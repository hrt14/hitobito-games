<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10140d">
<meta name="description" content="予定より時間を使った後に、過去の損失ではなく残っている時間と使える学びへ意識を戻し、次の一手を決めるLEVEL UPトレーニング。">
<title>ここから回収。— LEVEL UP</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;background:#0c1009;color:#f5f7ef;--lime:#d8ff5b;--panel:#151b12;--line:rgba(216,255,91,.2);--muted:#aab5a3}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -15%,#2a351d 0,#11160e 44%,#0a0d08 82%);color:#f5f7ef}.app{width:min(620px,100%);margin:auto;padding:14px 16px calc(34px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.top a{color:var(--lime);text-decoration:none;font-size:12px;font-weight:900;letter-spacing:.08em}.progress{font-size:11px;color:var(--muted);font-weight:800}.screen{display:none}.screen.active{display:block}.eyebrow{margin:0 0 9px;color:var(--lime);font-size:11px;font-weight:950;letter-spacing:.15em}.hero h1{font-size:clamp(44px,14vw,70px);line-height:.92;letter-spacing:-.075em;margin:0 0 18px}.hero h1 span{color:var(--lime)}.lead{font-size:15px;line-height:1.8;color:#cbd3c5;margin:0 0 22px}.principle{border:1px solid var(--line);border-radius:20px;padding:15px 16px;background:rgba(216,255,91,.055);margin:18px 0}.principle b{display:block;color:var(--lime);font-size:11px;letter-spacing:.1em;margin-bottom:6px}.principle p{margin:0;font-size:14px;line-height:1.65}.next{width:100%;min-height:54px;border:0;border-radius:16px;background:var(--lime);color:#10140d;font-weight:950;font-size:15px}.question h2{font-size:29px;line-height:1.18;letter-spacing:-.045em;margin:0 0 8px}.question p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.65}.choices{display:grid;gap:9px}.choice{width:100%;min-height:62px;text-align:left;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:var(--panel);color:#f7f9f2;padding:15px 16px;font-weight:850;line-height:1.4}.choice small{display:block;margin-top:4px;color:var(--muted);font-weight:650}.choice.selected{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime);background:#1b2512}.nav{display:flex;gap:9px;margin-top:18px}.nav button{min-height:48px;border-radius:15px;font-weight:900}.back{flex:0 0 92px;background:transparent;color:#d0d7ca;border:1px solid rgba(255,255,255,.12)}.forward{flex:1;border:0;background:var(--lime);color:#11150d}.result h2{font-size:38px;line-height:1;letter-spacing:-.055em;margin:0 0 12px}.result>p{color:var(--muted);line-height:1.7}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#182112,#10150d);padding:17px;margin:14px 0}.card .label{display:block;font-size:10px;font-weight:950;color:var(--lime);letter-spacing:.12em}.card h3{font-size:26px;margin:8px 0;letter-spacing:-.04em}.card p{margin:0;color:#d0d7ca;line-height:1.65}.steps{display:grid;gap:8px;margin-top:12px}.step{display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px;background:rgba(255,255,255,.025)}.step b{min-width:30px;color:var(--lime)}.step span{font-size:13px;line-height:1.55;color:#d3d9ce}.actions{display:grid;gap:9px;margin-top:18px}.actions button,.actions a{min-height:50px;border-radius:15px;display:grid;place-items:center;text-decoration:none;font-weight:900}.restart{border:0;background:var(--lime);color:#11150d}.related{border:1px solid rgba(255,255,255,.13);color:#eef2e9;background:transparent}.note{font-size:10px;color:#7f8a7a;line-height:1.6;margin-top:18px}@media(max-width:420px){.app{padding-left:13px;padding-right:13px}.hero h1{font-size:50px}.question h2{font-size:26px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><a href="/">← LEVEL UP</a><span class="progress" id="progress">RESET / 60 SEC</span></header>
<section class="screen active" id="start"><div class="hero"><p class="eyebrow">PAST → NEXT</p><h1>ここから<br><span>回収。</span></h1><p class="lead">予定より時間を使ったあと、失った時間を取り返そうとすると、次の時間まで失いやすい。<br><strong>過去の損失と、これからの判断を分ける</strong>60秒トレーニングです。</p></div><div class="principle"><b>RULE</b><p>使った時間は戻らない。でも、残り時間・得た情報・次の一手はまだ選べる。</p></div><button class="next" id="startBtn">これからに戻す →</button><p class="note">強い落ち込みや不調が長く続く場合の診断・治療を目的としたものではありません。</p></section>
<section class="screen" id="quiz"><div class="question"><p class="eyebrow" id="qKicker"></p><h2 id="qTitle"></h2><p id="qHelp"></p><div class="choices" id="choices"></div></div><div class="nav"><button class="back" id="backBtn">← 戻る</button><button class="forward" id="nextBtn" disabled>次へ →</button></div></section>
<section class="screen result" id="result"><p class="eyebrow">NEXT VALUE</p><h2 id="resultTitle">ここから取り返す。</h2><p id="resultLead"></p><article class="card"><span class="label">NEXT 10 MINUTES</span><h3 id="move"></h3><p id="why"></p></article><div class="steps" id="steps"></div><div class="actions"><button class="restart" id="restartBtn">もう一度リセットする</button><a class="related" href="/apps/maa-iika/">次に「まあ、いいか。」を使う →</a></div></section>
</main>
<script>
(()=>{'use strict';
const qs=[
 {k:'01 / FACT',t:'まず、何が起きた？',h:'評価ではなく事実だけで選ぶ。',o:[['over','予定より時間がかかった','見積もりより長く使った'],['stuck','途中で詰まった','進め方を変える必要が出た'],['redo','やり直しが出た','一部を作り直した']]},
 {k:'02 / LEFT',t:'今日、まだ使える時間は？',h:'失った時間ではなく、残っている時間を見る。',o:[['tiny','10分前後','一手だけならできる'],['short','30分前後','小さく一区切りできる'],['room','1時間以上','次のまとまりまで進められる']]},
 {k:'03 / GAIN',t:'今回から持ち帰れるものは？',h:'成果が薄くても、次回に使える情報は残る。',o:[['cause','時間がかかった原因','見積もりや手順を修正できる'],['asset','途中までの成果物','次回ゼロから始めなくてよい'],['rule','次から避ける条件','同じ損失を減らせる']]},
 {k:'04 / NEXT',t:'今いちばん価値があるのは？',h:'「取り返す」より、次の10分の価値で選ぶ。',o:[['finish','最小サイズで終える','完璧より区切りを作る'],['record','学びを1行残す','次回の損失を防ぐ'],['switch','次の重要仕事へ移る','これ以上追加で失わない']]}
];
const answers=[];let i=0;const $=id=>document.getElementById(id);const show=id=>document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('active',el.id===id));
function render(){const q=qs[i];$('progress').textContent=`${i+1} / ${qs.length}`;$('qKicker').textContent=q.k;$('qTitle').textContent=q.t;$('qHelp').textContent=q.h;$('choices').innerHTML='';q.o.forEach(([v,l,s])=>{const b=document.createElement('button');b.className='choice'+(answers[i]===v?' selected':'');b.innerHTML=`${l}<small>${s}</small>`;b.onclick=()=>{answers[i]=v;render()};$('choices').appendChild(b)});$('backBtn').style.visibility=i?'visible':'hidden';$('nextBtn').disabled=!answers[i];$('nextBtn').textContent=i===qs.length-1?'結果を見る →':'次へ →'}
function finish(){const [fact,left,gain,next]=answers;let move='10分で区切れる形にする';let why='残っている時間を、新しい損失ではなく次の価値へ変えます。';if(next==='record'){move='原因と次回ルールを1行ずつ残す';why='今日の時間を取り戻せなくても、次回の同じ損失を減らせます。'}else if(next==='switch'){move='今の作業を閉じて、次の重要仕事を10分進める';why='追加で時間を注ぎ込まず、残り時間の価値を守ります。'}else if(left==='tiny'){move='「ここまで」を決めて10分で閉じる';why='残りが短い日は、完成より再開しやすい区切りを作る方が有効です。'}else if(left==='room'&&fact==='stuck'){move='進め方を1つ変えて20分だけ再試行する';why='同じ方法を延長せず、詰まりの原因に対して小さく検証します。'}
const gainText=gain==='cause'?'時間が延びた原因を次回の見積もりに入れる':gain==='asset'?'途中成果を「次回の開始地点」として残す':'次回やらない条件を1つ決める';$('resultLead').textContent='使った時間は過去。ここからは「残っているもの」を使って次の価値を作ります。';$('move').textContent=move;$('why').textContent=why;$('steps').innerHTML=[['1','使った時間を取り返す対象にしない'],['2',gainText],['3','次の10分だけを新しい判断として始める']].map(([n,s])=>`<div class="step"><b>${n}</b><span>${s}</span></div>`).join('');$('progress').textContent='DONE';show('result')}
$('startBtn').onclick=()=>{answers.length=0;i=0;render();show('quiz')};$('backBtn').onclick=()=>{if(i){i--;render()}};$('nextBtn').onclick=()=>{if(!answers[i])return;if(i<qs.length-1){i++;render()}else finish()};$('restartBtn').onclick=()=>{answers.length=0;i=0;render();show('quiz')};
})();
</script>
</body>
</html>
