<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#11130f">
<meta name="description" content="最後のエレベーター — 100階まで、誰を乗せる？">
<title>最後のエレベーター</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app" class="app">
  <header class="hud">
    <a class="back" href="../../" aria-label="hitobito games に戻る">‹ GAMES</a>
    <div class="floor-display" aria-live="polite"><span id="floorNum">001</span><small>F</small></div>
    <div class="endings" id="endingCount">END 0/8</div>
  </header>

  <main class="elevator-shell" id="gameArea">
    <div class="ceiling-light"></div>
    <div class="side-panel left-panel">
      <span class="plate">LAST<br>ELEVATOR</span>
      <div class="society-meter">
        <div><b>♥</b><i><span id="moodBar"></span></i></div>
        <div><b>!</b><i><span id="dangerBar"></span></i></div>
        <div><b>✦</b><i><span id="wonderBar"></span></i></div>
      </div>
    </div>

    <section class="door-frame" id="doorFrame" aria-label="エレベーターのドア">
      <div class="hall" id="hall">
        <div class="hall-floor" id="hallFloorLabel">1F</div>
        <div class="candidate" id="candidate">
          <div class="candidate-shadow"></div>
          <div class="candidate-emoji" id="candidateEmoji">👴</div>
          <div class="candidate-name" id="candidateName">老人</div>
          <div class="candidate-note" id="candidateNote">少し息を切らしている</div>
        </div>
      </div>
      <div class="door door-left"></div>
      <div class="door door-right"></div>
      <div class="door-seam"></div>
    </section>

    <div class="side-panel right-panel">
      <div class="capacity"><span id="capacityNow">0</span><small>/12</small></div>
      <div class="buttons" aria-hidden="true">
        <i class="lit"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>

    <section class="cabin" aria-label="乗っているメンバー">
      <div class="passengers" id="passengers"></div>
      <div class="cabin-floor"></div>
    </section>

    <div class="event-toast" id="eventToast" role="status" aria-live="polite"></div>
    <div class="swipe-feedback left" id="leftFeedback">← 見送る</div>
    <div class="swipe-feedback right" id="rightFeedback">乗せる →</div>
  </main>

  <footer class="controls" id="controls">
    <button id="rejectBtn" class="choice reject" type="button"><span>←</span><small>乗せない</small></button>
    <div class="hint" id="hint"><b>SWIPE</b><span>← / →</span></div>
    <button id="acceptBtn" class="choice accept" type="button"><small>乗せる</small><span>→</span></button>
  </footer>

  <section class="intro" id="intro">
    <div class="intro-card">
      <span class="intro-kicker">100 FLOORS / ONE CABIN</span>
      <h1>最後の<br>エレベーター</h1>
      <p>毎階、誰かが乗ろうとする。<br>乗せるか、乗せないか。それだけ。</p>
      <div class="intro-demo"><span>← 見送る</span><b>👴</b><span>乗せる →</span></div>
      <button id="startBtn" type="button">1階から上がる</button>
    </div>
  </section>

  <section class="ending-screen" id="endingScreen" hidden>
    <div class="ending-card">
      <span class="ending-kicker">100F / ENDING</span>
      <div class="ending-icon" id="endingIcon">🏙️</div>
      <h2 id="endingTitle">小さな社会</h2>
      <p id="endingText"></p>
      <div class="ending-cast" id="endingCast"></div>
      <div class="ending-stats" id="endingStats"></div>
      <button id="restartBtn" type="button">もう一度、1階から</button>
      <a href="../../">hitobito games に戻る</a>
    </div>
  </section>
</div>
<script src="./game.js"></script>
</body>
</html>
