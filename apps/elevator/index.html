<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d0b">
<meta name="description" content="最後のエレベーター — 10階まで、誰を乗せる？">
<title>最後のエレベーター</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <a href="../../" class="back">‹ GAMES</a>
    <div class="title"><small>THE LAST</small><strong>最後のエレベーター</strong></div>
    <button class="sound" type="button" aria-label="演出">✦</button>
  </header>

  <main class="game" id="gameArea">
    <section class="left-rail">
      <div class="meter mood"><span>機嫌</span><b id="moodValue">25</b><i><em id="moodBar"></em></i></div>
      <div class="meter danger"><span>危険</span><b id="dangerValue">12</b><i><em id="dangerBar"></em></i></div>
      <div class="meter wonder"><span>怪異</span><b id="wonderValue">8</b><i><em id="wonderBar"></em></i></div>
    </section>

    <section class="elevator">
      <div class="floor-display"><strong id="floorNum">01</strong><span>/10</span><small id="hallFloorLabel">1F</small></div>
      <div class="end-count" id="endingCount">END 0/8</div>

      <div class="door-frame" id="doorFrame">
        <div class="hall" id="hall">
          <div class="hall-sign" id="hallSign">1F</div>
          <div class="candidate" id="candidate">
            <div class="candidate-art" id="candidateArt"></div>
            <div class="candidate-card">
              <strong id="candidateName">老人</strong>
              <span id="candidateNote">少し息を切らしている</span>
            </div>
          </div>
        </div>
        <div class="door left"></div>
        <div class="door right"></div>
        <div class="door-light"></div>
      </div>

      <div class="cabin">
        <div class="capacity"><span>定員</span><strong><b id="capacityNow">0</b>/8</strong></div>
        <div class="passengers" id="passengers"></div>
        <div class="floor-shadow"></div>
      </div>

      <div class="event-toast" id="eventToast" role="status" aria-live="polite"></div>
      <div class="swipe left" id="leftFeedback">← 見送る</div>
      <div class="swipe right" id="rightFeedback">乗せる →</div>
    </section>
  </main>

  <footer class="controls" id="controls">
    <button id="rejectBtn" class="choice reject" type="button"><span>←</span><strong>乗せない</strong></button>
    <div class="guide"><b>SWIPE</b><small>← / →</small></div>
    <button id="acceptBtn" class="choice accept" type="button"><strong>乗せる</strong><span>→</span></button>
  </footer>

  <section class="intro" id="intro">
    <div class="intro-card">
      <div class="intro-emblem">10F</div>
      <p class="kicker">TEN FLOORS / ONE CABIN</p>
      <h1>最後の<br><em>エレベーター</em></h1>
      <p>毎階、誰かが乗ろうとする。<br>乗せるか、見送るか。<br><b>同じ箱に入れた者同士で、何かが起きる。</b></p>
      <div class="intro-pair"><span>犬</span><i>＋</i><span>老人</span><b>→ 元気</b></div>
      <button id="startBtn" type="button">1階から上がる</button>
    </div>
  </section>

  <section class="ending" id="endingScreen" hidden>
    <div class="ending-card">
      <span class="kicker" id="endingKicker">10F / ENDING</span>
      <div class="ending-icon" id="endingIcon"></div>
      <h2 id="endingTitle"></h2>
      <p id="endingText"></p>
      <div class="ending-cast" id="endingCast"></div>
      <div class="ending-stats" id="endingStats"></div>
      <button id="restartBtn" type="button">もう一度、1階から</button>
      <a href="../../">hitobito games に戻る</a>
    </div>
  </section>
</div>
<script src="./game.js"></script>
</body>
</html>
