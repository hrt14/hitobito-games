<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#06100d"/>
<meta name="description" content="群れずに生きる動物の戦略を、8夜の3択サバイバルで体験するゲーム。"/>
<title>単独行動サバイバル</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;--ink:#f5f0db;--muted:#9daf9f;--lime:#d7f27a;--amber:#f5c967;--danger:#ff7569;--panel:#0b1d16;--line:rgba(245,240,219,.13)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06100d;color:var(--ink);-webkit-font-smoothing:antialiased}body{overflow-x:hidden}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.app{min-height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#06100d 0%,#0a1711 48%,#06100c 100%)}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}.aurora{position:absolute;inset:-20% -15% auto;height:54%;background:radial-gradient(ellipse at 66% 20%,rgba(190,225,121,.12),transparent 42%),radial-gradient(ellipse at 25% 18%,rgba(87,155,123,.1),transparent 42%);filter:blur(20px);animation:aurora 12s ease-in-out infinite alternate}.stars{position:absolute;inset:0;opacity:.55;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.3px),radial-gradient(circle,#dff9bb 0 1px,transparent 1.2px);background-size:83px 83px,137px 137px;background-position:12px 19px,43px 67px;mask-image:linear-gradient(#000,transparent 65%)}
.moon{position:absolute;width:210px;height:210px;border-radius:50%;right:-40px;top:-48px;background:radial-gradient(circle at 35% 34%,#fffde5 0 8%,#eae1a7 36%,#c6bd7f 68%,#8f885b 100%);box-shadow:0 0 80px rgba(237,227,165,.17);opacity:.92}.moon:after{content:"";position:absolute;inset:29px 53px 72px 38px;border-radius:50%;background:rgba(98,94,61,.11);box-shadow:48px 35px 0 7px rgba(98,94,61,.1),-10px 76px 0 -4px rgba(98,94,61,.08)}
.mist{position:absolute;width:130%;height:140px;left:-15%;bottom:8%;background:linear-gradient(90deg,transparent,rgba(218,239,218,.08),transparent);filter:blur(16px);animation:mist 13s linear infinite alternate}.ridge,.ridge2{position:absolute;left:-10%;right:-10%;bottom:0;height:34vh;clip-path:polygon(0 64%,9% 50%,20% 59%,31% 30%,40% 48%,52% 27%,65% 54%,75% 38%,86% 61%,100% 43%,100% 100%,0 100%);background:#0d241b;opacity:.95}.ridge2{height:27vh;bottom:-2%;background:#091812;opacity:1;transform:scaleX(1.08)}
.fireflies{position:absolute;inset:0}.fireflies i{position:absolute;width:3px;height:3px;border-radius:50%;background:#e8ff94;box-shadow:0 0 12px #dfff77;animation:fly 6s ease-in-out infinite}.fireflies i:nth-child(1){left:12%;top:34%;animation-delay:-1s}.fireflies i:nth-child(2){left:77%;top:42%;animation-delay:-3s}.fireflies i:nth-child(3){left:42%;top:24%;animation-delay:-5s}.fireflies i:nth-child(4){left:58%;top:58%;animation-delay:-2s}.fireflies i:nth-child(5){left:28%;top:64%;animation-delay:-4s}
@keyframes aurora{to{transform:translate3d(4%,2%,0) scale(1.08)}}@keyframes mist{to{transform:translateX(9%)}}@keyframes fly{0%,100%{transform:translate(0,0);opacity:.15}35%{transform:translate(18px,-13px);opacity:1}70%{transform:translate(-11px,9px);opacity:.35}}
.shell{position:relative;z-index:3;width:min(800px,calc(100% - 24px));margin:auto;padding:14px 0 32px;min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}.brand{display:flex;align-items:center;gap:9px;font-size:10px;font-weight:950;letter-spacing:.18em;color:#c7d3c9}.brand:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px rgba(215,242,122,.55)}.home{border:1px solid var(--line);background:rgba(255,255,255,.035);backdrop-filter:blur(12px);border-radius:999px;padding:9px 12px;text-decoration:none;color:#d7dfd8;font-size:10px;font-weight:900}
.screen{display:none;flex:1;animation:screenIn .42s ease}.screen.active{display:flex;flex-direction:column}@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.start{justify-content:center;padding:28px 0 54px}.hero-animal{position:relative;height:210px;margin:6px 0 4px}.hero-animal svg{width:100%;height:100%;filter:drop-shadow(0 24px 24px rgba(0,0,0,.35))}.animal-glow{position:absolute;width:250px;height:90px;border-radius:50%;left:50%;bottom:6px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(215,242,122,.12),transparent 70%);filter:blur(8px)}
.eyebrow{font-size:10px;font-weight:950;letter-spacing:.22em;color:var(--lime);margin-bottom:12px}.title{font-size:clamp(44px,12vw,78px);line-height:.87;letter-spacing:-.075em;margin:0;max-width:660px;text-shadow:0 10px 45px rgba(0,0,0,.25)}.title span{display:block;color:var(--lime)}.lead{font-size:14px;line-height:1.85;color:#bdc9bf;max-width:590px;margin:19px 0 0}.rulechips{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 26px}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850;color:#c1cdc4;background:rgba(6,18,13,.45);backdrop-filter:blur(8px)}
.primary{appearance:none;border:0;border-radius:18px;background:linear-gradient(180deg,#e3f994,#cce86e);color:#112016;padding:17px 20px;font-size:14px;font-weight:950;cursor:pointer;box-shadow:0 12px 34px rgba(203,232,107,.14),inset 0 1px 0 rgba(255,255,255,.55);transition:.16s ease}.primary:hover{transform:translateY(-2px);filter:brightness(1.03)}.primary:active{transform:scale(.985)}
.game{padding-top:9px}.nightline{display:flex;align-items:center;justify-content:space-between;gap:13px;margin:8px 0 11px}.night{font-size:11px;font-weight:950;letter-spacing:.16em}.progress{height:5px;flex:1;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:12.5%;background:linear-gradient(90deg,#9ecf58,#e3f994);border-radius:99px;box-shadow:0 0 14px rgba(215,242,122,.45);transition:width .4s ease}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}.stat{border:1px solid var(--line);background:rgba(8,25,18,.72);backdrop-filter:blur(12px);border-radius:14px;padding:10px 11px}.stathead{display:flex;justify-content:space-between;align-items:center;gap:7px;font-size:9px;color:#aebbb1;font-weight:850}.stat strong{font-size:16px;color:#fff}.meter{height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}.meter i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:.35s ease}
.visual{position:relative;height:240px;border:1px solid rgba(245,240,219,.12);border-radius:26px 26px 9px 9px;overflow:hidden;background:linear-gradient(#10271d,#0b1b14 58%,#07110d);box-shadow:0 20px 55px rgba(0,0,0,.25)}.visual:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 18%,rgba(223,244,166,.15),transparent 25%),linear-gradient(transparent 64%,rgba(0,0,0,.24));pointer-events:none}.visual .mini-moon{position:absolute;width:72px;height:72px;right:30px;top:24px;border-radius:50%;background:#e7dda5;box-shadow:0 0 35px rgba(231,221,165,.18)}.visual .ground{position:absolute;left:-5%;right:-5%;bottom:-5px;height:70px;border-radius:50% 50% 0 0/35% 35% 0 0;background:#08150f}.visual .bush{position:absolute;bottom:27px;width:80px;height:48px;border-radius:50%;background:#173828;filter:drop-shadow(58px 5px 0 #153425) drop-shadow(130px 12px 0 #112c20)}.visual .bush.left{left:-18px}.visual .bush.right{right:95px;transform:scale(.76)}
.animal{position:absolute;left:50%;bottom:42px;width:155px;height:92px;transform:translateX(-50%);transition:.45s cubic-bezier(.2,.8,.2,1)}.animal-body{position:absolute;width:92px;height:55px;border-radius:58% 46% 48% 50%;left:34px;top:26px;background:linear-gradient(145deg,#181c18,#050807);box-shadow:inset -12px -8px 20px rgba(0,0,0,.48)}.animal-head{position:absolute;width:48px;height:48px;border-radius:48% 55% 46% 48%;left:93px;top:16px;background:#111612}.animal-head:before,.animal-head:after{content:"";position:absolute;top:-10px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:19px solid #111612}.animal-head:before{left:2px;transform:rotate(-12deg)}.animal-head:after{right:2px;transform:rotate(12deg)}.eye{position:absolute;right:9px;top:21px;width:5px;height:5px;border-radius:50%;background:#eaff86;box-shadow:0 0 10px #dfff69}.tail{position:absolute;width:58px;height:16px;border:10px solid #0a0e0b;border-left:0;border-bottom-color:transparent;border-radius:0 60px 0 0;left:0;top:40px;transform:rotate(-12deg)}.leg{position:absolute;width:8px;height:35px;background:#090d0a;bottom:0;border-radius:6px}.leg.one{left:53px}.leg.two{left:104px}.visual.danger .animal{transform:translateX(-60%) scale(.93)}.visual.hunt .animal{transform:translateX(-38%) rotate(-2deg)}.visual.rival .animal{transform:translateX(-54%) scale(1.05)}
.threat{position:absolute;right:-35px;bottom:54px;width:140px;height:105px;opacity:0;transition:.35s}.visual.danger .threat,.visual.rival .threat{opacity:.78}.threat:before{content:"";position:absolute;width:120px;height:70px;border-radius:55% 40% 45% 45%;background:#030504;right:0;bottom:0}.threat:after{content:"";position:absolute;width:44px;height:43px;border-radius:48%;background:#030504;left:6px;top:13px;box-shadow:18px -9px 0 -13px #ffb45e}.prey{position:absolute;left:14%;bottom:53px;width:22px;height:14px;border-radius:60% 55% 50% 50%;background:#b9a778;opacity:0}.prey:before{content:"";position:absolute;width:8px;height:10px;border-radius:50%;right:-6px;top:-4px;background:#b9a778}.prey:after{content:"";position:absolute;width:10px;height:1px;background:#b9a778;left:-9px;top:7px;transform:rotate(-20deg)}.visual.hunt .prey{opacity:.9;animation:prey 1.2s ease-in-out infinite alternate}@keyframes prey{to{transform:translateX(12px)}}
.scene{border:1px solid rgba(245,240,219,.12);border-top:0;background:linear-gradient(180deg,rgba(15,34,25,.96),rgba(7,18,13,.96));border-radius:9px 9px 24px 24px;padding:18px 18px 17px}.scene small{display:flex;align-items:center;gap:7px;font-size:9px;font-weight:950;letter-spacing:.16em;color:var(--lime);margin-bottom:8px}.scene small:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.scene h2{font-size:clamp(23px,6vw,34px);line-height:1.1;letter-spacing:-.045em;margin:0 0 9px}.scene p{font-size:12px;line-height:1.7;color:#b8c5bb;margin:0}
.choices{display:grid;gap:8px;margin-top:10px}.choice{appearance:none;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.035);backdrop-filter:blur(10px);border-radius:16px;padding:13px 14px;cursor:pointer;transition:.15s ease}.choice:hover{background:rgba(215,242,122,.08);border-color:rgba(215,242,122,.35);transform:translateY(-1px)}.choice b{display:block;font-size:13px;margin-bottom:3px}.choice span{font-size:10px;color:#9fada2;line-height:1.4}.choice:disabled{opacity:.52;cursor:default;transform:none}
.feedback{display:none;margin-top:10px;border-radius:17px;padding:14px 15px;background:linear-gradient(180deg,#f2edd8,#ded7bb);color:#122016;box-shadow:0 14px 32px rgba(0,0,0,.2)}.feedback.show{display:block;animation:screenIn .25s ease}.verdict{font-size:10px;font-weight:950;letter-spacing:.08em;margin-bottom:4px}.feedback p{font-size:11px;line-height:1.6;margin:0}.delta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.delta span{font-size:9px;font-weight:950;border:1px solid rgba(16,32,20,.16);padding:4px 7px;border-radius:99px}.next{width:100%;margin-top:8px;background:#173528;color:#eff5ef;border:1px solid rgba(215,242,122,.22);box-shadow:none}
.result{justify-content:center;padding:28px 0 52px}.result-art{height:210px;position:relative;margin-bottom:8px}.result-art .halo{position:absolute;width:185px;height:185px;border-radius:50%;left:50%;top:5px;transform:translateX(-50%);border:1px solid rgba(215,242,122,.25);box-shadow:0 0 70px rgba(215,242,122,.12),inset 0 0 60px rgba(215,242,122,.03)}.result-art .sil{position:absolute;left:50%;bottom:16px;transform:translateX(-50%) scale(1.38)}.result h1{font-size:clamp(38px,10vw,66px);line-height:.94;letter-spacing:-.06em;margin:0}.summary{font-size:13px;line-height:1.75;color:#b9c5bc;margin:14px 0 19px}.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.score{border:1px solid var(--line);background:rgba(10,28,20,.72);backdrop-filter:blur(10px);border-radius:15px;padding:12px;text-align:center}.score b{font-size:24px;display:block}.score span{font-size:9px;color:#9dad9f;font-weight:900;letter-spacing:.08em}.lesson{border:1px solid rgba(215,242,122,.18);background:rgba(215,242,122,.055);border-radius:18px;padding:15px;margin-bottom:13px}.lesson h2{font-size:10px;letter-spacing:.12em;color:var(--lime);margin:0 0 7px}.lesson p{font-size:11px;line-height:1.65;color:#c6d0c8;margin:0}.again{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:17px;padding:15px;font-weight:900;cursor:pointer;text-decoration:none;text-align:center}
.flash{position:fixed;inset:0;pointer-events:none;z-index:20;opacity:0;background:radial-gradient(circle at center,rgba(255,116,105,.25),rgba(255,80,70,.08))}.flash.on{animation:flash .34s ease}@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
@media(max-width:540px){.shell{width:min(100% - 18px,800px);padding-top:8px}.hero-animal{height:170px}.start{padding-bottom:34px}.title{font-size:clamp(46px,17vw,68px)}.visual{height:205px}.animal{transform:translateX(-50%) scale(.9)}.visual.danger .animal{transform:translateX(-60%) scale(.83)}.visual.hunt .animal{transform:translateX(-38%) scale(.9)}.stats{gap:5px}.stat{padding:9px 8px}.scene{padding:15px}.choice{padding:12px}.again{grid-template-columns:1fr}.result-art{height:180px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="sky" aria-hidden="true"><div class="aurora"></div><div class="stars"></div><div class="moon"></div><div class="mist"></div><div class="ridge"></div><div class="ridge2"></div><div class="fireflies"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="flash" id="flash"></div>
  <main class="shell">
    <header class="top"><div class="brand">HITOBITO PLAY / NATURE</div><a class="home" href="/">PLAY一覧</a></header>

    <section class="screen start active" id="startScreen">
      <div class="hero-animal" aria-hidden="true"><div class="animal-glow"></div><svg viewBox="0 0 700 230" role="img"><defs><linearGradient id="fur" x1="0" x2="1"><stop stop-color="#15251b"/><stop offset="1" stop-color="#030706"/></linearGradient></defs><path fill="url(#fur)" d="M231 156c21-53 92-78 166-52 46 16 79 48 110 53 45 8 88-22 114-4 27 19-7 55-64 52-41-2-71-14-103-9-69 12-154 28-205-4-24-15-31-29-18-36Z"/><path fill="#050807" d="M444 112c13-27 45-44 73-33 23 9 36 36 26 58-9 21-35 33-59 25-26-9-50-28-40-50Z"/><path fill="#050807" d="m457 86 7-38 25 31m19-3 29-31-3 44"/><circle cx="523" cy="108" r="4" fill="#e9ff8a"/><path fill="none" stroke="#050807" stroke-width="18" stroke-linecap="round" d="M243 159c-53-14-84-43-118-28-23 10-23 31-5 40 25 12 68-5 101-4"/><path fill="#050807" d="M292 179h18l-4 46h-17zm99 0h18l12 46h-18z"/></svg></div>
      <div class="eyebrow">8 NIGHTS / SOLITARY STRATEGY</div><h1 class="title">単独行動<span>サバイバル</span></h1>
      <p class="lead">群れないのは、弱いからじゃない。隠れ、獲物を独占し、争いを避け、必要なら夜に動く。ひとりで生きる動物の判断を、8夜だけ体験する。</p>
      <div class="rulechips"><span class="chip">外敵から隠れる</span><span class="chip">獲物を独占する</span><span class="chip">無駄な争いを避ける</span><span class="chip">夜を使う</span></div>
      <button class="primary" id="startBtn">最初の夜へ</button>
    </section>

    <section class="screen game" id="gameScreen">
      <div class="nightline"><div class="night" id="nightLabel">NIGHT 1 / 8</div><div class="progress"><i id="progressBar"></i></div></div>
      <div class="stats"><div class="stat"><div class="stathead"><span>体力</span><strong id="hpNum">70</strong></div><div class="meter"><i id="hpBar"></i></div></div><div class="stat"><div class="stathead"><span>警戒</span><strong id="alertNum">60</strong></div><div class="meter"><i id="alertBar"></i></div></div><div class="stat"><div class="stathead"><span>縄張り</span><strong id="territoryNum">45</strong></div><div class="meter"><i id="territoryBar"></i></div></div></div>
      <div class="visual" id="visual"><div class="mini-moon"></div><div class="ground"></div><div class="bush left"></div><div class="bush right"></div><div class="prey"></div><div class="threat"></div><div class="animal"><div class="tail"></div><div class="animal-body"></div><div class="animal-head"><i class="eye"></i></div><div class="leg one"></div><div class="leg two"></div></div></div>
      <article class="scene"><small id="sceneTag">気配</small><h2 id="sceneTitle"></h2><p id="sceneText"></p></article>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"><div class="verdict" id="verdict"></div><p id="feedbackText"></p><div class="delta" id="delta"></div><button class="primary next" id="nextBtn">次の夜へ</button></div>
    </section>

    <section class="screen result" id="resultScreen">
      <div class="result-art" aria-hidden="true"><div class="halo"></div><div class="animal sil"><div class="tail"></div><div class="animal-body"></div><div class="animal-head"><i class="eye"></i></div><div class="leg one"></div><div class="leg two"></div></div></div>
      <h1 id="resultTitle">8夜を生き抜いた。</h1><p class="summary" id="resultSummary"></p>
      <div class="scorebox"><div class="score"><b id="finalHp">0</b><span>体力</span></div><div class="score"><b id="finalAlert">0</b><span>警戒</span></div><div class="score"><b id="finalTerritory">0</b><span>縄張り</span></div></div>
      <div class="lesson"><h2>単独行動の戦略</h2><p id="lessonText"></p></div>
      <div class="again"><button class="primary" id="againBtn">もう一度、生きる</button><a class="secondary" href="/">別のゲームへ</a></div>
    </section>
  </main>
</div>
<script>
(()=>{
const MAX=8;
const scenes=[
{tag:'外敵',kind:'danger',title:'草むらの向こうで、枝が折れた。',text:'姿は見えない。でも風上から知らない匂いがする。',c:[['低い茂みに身を伏せる','見つからないことを最優先',{hp:-2,alert:9,territory:0},1,'戦わず、見つからない。単独行動の強みを活かして接触そのものを減らせた。'],['音の正体を確かめに行く','先に見つければ安心できる',{hp:-13,alert:-10,territory:2},0,'確認のために接近しすぎた。ひとりでは負傷の代償が大きい。'],['遠回りして縄張りの端へ移る','距離を取りながら様子を見る',{hp:-5,alert:6,territory:-5},1,'縄張りを少し譲ってでも安全を取った。生き残るための撤退だ。']]},
{tag:'狩り',kind:'hunt',title:'小さな獲物が、月明かりを横切った。',text:'今なら誰にも横取りされない。だが追いすぎれば体力を使う。',c:[['音を消して一気に仕留める','単独狩りの利点を活かす',{hp:15,alert:1,territory:3},1,'気づかれにくい接近から狩りに成功。獲物を独占できた。'],['長く追跡して確実に狙う','成功率を上げたい',{hp:5,alert:-5,territory:1},0,'獲物は得たが消耗した。単独行動では追跡コストも自分ひとりで払う。'],['今夜は見送る','危険を増やさない',{hp:-8,alert:6,territory:0},1,'食料は減ったが、無用なリスクを避けた。状況次第では正しい判断だ。']]},
{tag:'縄張り',kind:'rival',title:'境界に、別の個体の匂いが残っている。',text:'このままでは縄張りに入られるかもしれない。',c:[['鳴き声で存在を知らせる','直接戦わず威嚇する',{hp:-2,alert:4,territory:14},1,'姿を合わせず「ここは使っている」と伝えた。無駄な闘争を避けながら縄張りを守れた。'],['すぐ追跡して追い払う','直接対決で決める',{hp:-15,alert:-8,territory:13},0,'縄張りは守れたが負傷した。勝っても消耗が大きい。'],['匂いを無視する','衝突しない',{hp:0,alert:2,territory:-13},0,'争いは避けたが、縄張りの優位を失った。']]},
{tag:'時間',kind:'calm',title:'昼。森は明るく、遠くまで見える。',text:'獲物も見つけやすいが、自分も見つかりやすい。',c:[['木陰で休み、夜を待つ','夜行性の強みを使う',{hp:9,alert:8,territory:-2},1,'明るい時間を休息に回し、活動しやすい夜へ備えた。'],['今のうちに広く巡回する','見通しの良さを使う',{hp:-8,alert:-7,territory:9},0,'縄張りは確認できたが、自分の姿もさらした。'],['短時間だけ水場へ行く','必要最低限だけ動く',{hp:2,alert:4,territory:1},1,'活動量を絞って必要な資源だけ得た。']]},
{tag:'大物',kind:'hunt',title:'大きな獲物の足跡を見つけた。',text:'成功すれば何日も食べられる。でも失敗すれば危険だ。',c:[['小さな獲物を探し直す','欲張らず確実性を取る',{hp:7,alert:6,territory:1},1,'大物を捨て、単独でも扱える獲物に切り替えた。'],['足跡を追う','大きなリターンを狙う',{hp:-18,alert:-8,territory:4},0,'単独では大物のリスクを分散できない。負傷が重い。'],['待ち伏せだけ試す','追わずに機会だけ待つ',{hp:3,alert:3,territory:2},1,'深追いせず、条件が良い時だけ狙った。']]},
{tag:'遭遇',kind:'rival',title:'暗闇で、同じくらいの大きさの影と向き合った。',text:'相手もこちらを見ている。まだ攻撃してこない。',c:[['体を大きく見せて威嚇する','戦わず退かせる',{hp:-3,alert:5,territory:10},1,'直接ぶつからず、相手にコストを想像させて退かせた。'],['先に飛びかかる','主導権を取る',{hp:-20,alert:-10,territory:12},0,'勝敗より先にダメージが残った。単独生活では傷の回復も自分次第だ。'],['ゆっくり後退する','衝突を避ける',{hp:0,alert:8,territory:-6},1,'争いを避けて安全を取った。縄張りは少し失ったが生存には有利だ。']]},
{tag:'飢え',kind:'hunt',title:'獲物の気配が薄い夜が続いた。',text:'同じ場所に留まるか、縄張りの外へ出るか。',c:[['縄張り内を静かに探し直す','知っている地形を使う',{hp:-4,alert:6,territory:5},1,'地形を知っていることが強みになった。'],['遠くまで一気に移動する','未知の場所に賭ける',{hp:3,alert:-10,territory:-12},0,'食料は得たが縄張りと安全を失った。'],['今夜は消耗を抑える','休んで次夜に備える',{hp:4,alert:4,territory:-3},1,'すぐに成果を求めず、体力を守った。']]},

let state={night:1,hp:70,alert:60,territory:45,order:[]};
const $=id=>document.getElementById(id), clamp=n=>Math.max(0,Math.min(100,n));
function show(id){['startScreen','gameScreen','resultScreen'].forEach(x=>$(x).classList.toggle('active',x===id))}
function reset(){state={night:1,hp:70,alert:60,territory:45,order:[...scenes].sort(()=>Math.random()-.5)};render();show('gameScreen')}
function meters(){[['hp',state.hp],['alert',state.alert],['territory',state.territory]].forEach(([k,v])=>{$(k+'Num').textContent=v;$(k+'Bar').style.width=v+'%';$(k+'Bar').style.background=v<25?'var(--danger)':v<45?'var(--amber)':'var(--lime)'})}
function render(){const s=state.order[state.night-1];$('nightLabel').textContent=`NIGHT ${state.night} / ${MAX}`;$('progressBar').style.width=(state.night/MAX*100)+'%';meters();$('sceneTag').textContent=s.tag;$('sceneTitle').textContent=s.title;$('sceneText').textContent=s.text;$('visual').className='visual '+s.kind;$('feedback').classList.remove('show');const c=$('choices');c.innerHTML='';s.c.forEach((x,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<b>${x[0]}</b><span>${x[1]}</span>`;b.onclick=()=>choose(x);c.appendChild(b)});$('nextBtn').textContent=state.night===MAX?'夜明けを見る':'次の夜へ'}
function choose(x){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);state.hp=clamp(state.hp+x[2].hp);state.alert=clamp(state.alert+x[2].alert);state.territory=clamp(state.territory+x[2].territory);meters();$('verdict').textContent=x[3]?'GOOD SURVIVAL':'HIGH COST';$('feedbackText').textContent=x[4];$('delta').innerHTML=Object.entries(x[2]).map(([k,v])=>`<span>${{hp:'体力',alert:'警戒',territory:'縄張り'}[k]} ${v>0?'+':''}${v}</span>`).join('');$('feedback').classList.add('show');if(!x[3]){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}}
function finish(){const safety=100-Math.max(0,100-state.alert);const score=Math.round((state.hp+state.alert+state.territory)/3);let title,summary;if(state.hp<=0||score<25){title='夜を越えられなかった。';summary='単独行動では、ひとつの大きな失敗を仲間が埋めてくれない。戦わない判断が生存率を上げる。'}else if(score>=72){title='孤高のサバイバー。';summary='姿を消し、必要な時だけ動き、争いを避けた。ひとりで生きる強さは「全部ひとりで戦う」ことではない。'}else if(score>=50){title='8夜を生き抜いた。';summary='危ない夜もあったが、生存に必要な体力・警戒・縄張りを残した。'}else{title='ぎりぎり、夜明け。';summary='生き残った。ただし単独生活では、消耗の積み重ねがそのまま次の危険になる。'}$('resultTitle').textContent=title;$('resultSummary').textContent=summary;$('finalHp').textContent=state.hp;$('finalAlert').textContent=state.alert;$('finalTerritory').textContent=state.territory;$('lessonText').textContent='単独行動は「孤独に戦う」ことではない。隠れる、距離を取る、活動時間を選ぶ、威嚇で争いを避ける。接触を減らし、自分の資源を守ることが戦略になる。';show('resultScreen')}
$('startBtn').onclick=reset;$('againBtn').onclick=reset;$('nextBtn').onclick=()=>{if(state.night>=MAX)finish();else{state.night++;render();window.scrollTo({top:0,behavior:'smooth'})}};
})();
</script>
