<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071d2c" />
  <meta name="description" content="一頭のクジラの死から、深海の生態系が生まれる過程を触って体験するインタラクティブWebアニメーション。" />
  <title>クジラが死んだら｜WHALE FALL</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="game" class="game phase-surface" aria-label="クジラが死んだら インタラクティブ体験">
    <div id="ocean" class="ocean">
      <div class="sun-rays" aria-hidden="true"></div>
      <div id="snow" class="snow" aria-hidden="true"></div>
      <div id="distantLife" class="distant-life" aria-hidden="true"></div>
      <div id="nutrients" class="nutrients" aria-hidden="true"></div>
      <div id="seafloor" class="seafloor" aria-hidden="true"><div class="silt"></div><div class="rocks"></div></div>

      <svg id="whale" class="whale" viewBox="0 0 820 330" role="img" aria-label="クジラ">
        <defs>
          <linearGradient id="whaleBody" x1="0" x2="1"><stop offset="0" stop-color="#6f91a3"/><stop offset=".55" stop-color="#8da9b6"/><stop offset="1" stop-color="#557a8c"/></linearGradient>
          <linearGradient id="whaleBelly" x1="0" x2="1"><stop offset="0" stop-color="#b5c8cf"/><stop offset="1" stop-color="#7f9eaa"/></linearGradient>
          <filter id="softGlow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <g id="livingWhale" class="living-whale">
          <path class="tail tail-top" d="M150 153 C95 100 57 73 21 92 C58 124 72 156 118 176 Z" fill="#5d8192"/>
          <path class="tail tail-bottom" d="M150 169 C88 185 54 221 27 249 C71 249 109 228 139 193 Z" fill="#507487"/>
          <path class="body" d="M115 168 C168 68 335 45 508 69 C644 88 740 140 786 188 C748 243 645 278 497 277 C320 275 181 245 115 168 Z" fill="url(#whaleBody)"/>
          <path class="belly" d="M256 231 C390 271 604 262 727 218 C674 269 570 292 431 287 C356 284 298 266 256 231Z" fill="url(#whaleBelly)" opacity=".75"/>
          <path class="fin" d="M434 219 C399 278 353 311 321 304 C350 261 357 225 369 190 Z" fill="#4c7184"/>
          <path d="M720 154 C747 148 763 153 778 164" fill="none" stroke="#b8d4de" stroke-width="5" stroke-linecap="round" opacity=".55"/>
          <circle cx="704" cy="140" r="7" fill="#102735"/><circle cx="706" cy="138" r="2" fill="#d8fbff"/>
          <path d="M782 194 Q748 201 720 196" fill="none" stroke="#365668" stroke-width="5" stroke-linecap="round"/>
          <g class="breath" opacity="0"><circle cx="592" cy="62" r="8" fill="#dff9ff"/><circle cx="604" cy="42" r="5" fill="#dff9ff"/></g>
        </g>
        <g id="skeleton" class="skeleton" opacity="0">
          <path d="M173 174 C285 96 566 103 731 179" fill="none" stroke="#d7d2bf" stroke-width="25" stroke-linecap="round"/>
          <path d="M218 159 C240 214 255 244 279 264 M276 135 C292 204 309 239 334 270 M337 121 C351 195 369 238 391 271 M402 116 C413 192 432 233 451 269 M467 120 C474 187 494 224 513 259 M532 130 C541 181 559 214 578 246 M596 145 C604 181 620 207 642 230" stroke="#c9c3af" stroke-width="10" fill="none" stroke-linecap="round"/>
          <path d="M703 174 C757 149 792 159 803 193 C778 226 738 228 701 205 Z" fill="#d8d1ba"/>
          <path d="M173 174 L88 140 M166 182 L88 216 M92 140 L29 108 M92 216 L28 252" stroke="#ccc5ae" stroke-width="14" stroke-linecap="round"/>
        </g>
        <g id="osedax" class="osedax" opacity="0"></g>
      </svg>

      <div id="scavengers" class="scavengers" aria-hidden="true"></div>
      <div id="benthicLife" class="benthic-life" aria-hidden="true"></div>
      <canvas id="microbeCanvas" class="microbe-canvas" aria-hidden="true"></canvas>
      <div class="foreground" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>

    <header class="hud">
      <a class="back" href="../" aria-label="ゲーム一覧へ">‹</a>
      <div><div class="hud-label">経過時間</div><div id="timeLabel" class="hud-value">0日</div></div>
      <div class="hud-center"><div id="phaseLabel" class="phase-label">生きている海</div><div class="phase-dots" id="phaseDots"></div></div>
      <div class="right-stat"><div class="hud-label">水深</div><div id="depthLabel" class="hud-value">20 m</div></div>
      <button id="infoButton" class="info-btn" aria-label="図鑑を開く">◎ <span id="foundCount">0</span></button>
    </header>

    <section id="intro" class="intro-card">
      <div class="kicker">WHALE FALL</div>
      <h1>クジラが死んだら</h1>
      <p>一頭の巨大な命が終わったあと、深海では何が始まるのか。</p>
      <button id="startButton" class="primary">時間を進める <span>長押し</span></button>
    </section>

    <div id="storyCaption" class="story-caption" aria-live="polite"></div>
    <div id="gestureHint" class="gesture-hint" aria-live="polite"></div>
    <button id="timeHold" class="time-hold hidden" aria-label="長押しして時間を進める"><span class="hold-ring"></span><span>時間</span></button>

    <section id="ending" class="ending hidden">
      <div class="ending-inner"><div class="kicker">YEARS LATER</div><h2>一頭が終わった場所で、<br>無数の命が始まった。</h2><p>クジラは消えていく。<br>けれど、そのエネルギーは深海を長く生かし続ける。</p><div class="ending-actions"><button id="restartButton" class="primary">もう一度見る</button><button id="openFieldGuide" class="secondary">見つけた生き物</button></div></div>
    </section>

    <aside id="fieldGuide" class="field-guide" aria-hidden="true">
      <button id="closeGuide" class="close-guide">×</button>
      <div class="kicker">FIELD GUIDE</div><h2>見つけた生き物</h2><div id="guideGrid" class="guide-grid"></div>
    </aside>
  </main>
  <script src="./game.js"></script>
</body>
</html>
