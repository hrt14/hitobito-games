<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#03131e" />
  <meta name="description" content="一頭のクジラの死から、深海の生態系が生まれる過程を触って体験するインタラクティブWebゲーム。" />
  <title>クジラが死んだら｜WHALE FALL</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<main id="game" class="game phase-surface" aria-label="クジラが死んだら">
  <div id="ocean" class="ocean">
    <div class="surface-glow"></div>
    <div class="light-rays"></div>
    <div id="snow" class="snow"></div>
    <div id="distantLife" class="distant-life"></div>
    <div id="scent" class="scent"></div>
    <div id="seafloor" class="seafloor">
      <div class="silt-cloud"></div>
      <div class="ridge ridge-a"></div><div class="ridge ridge-b"></div>
      <div id="bloomLayer" class="bloom-layer"></div>
    </div>

    <div id="approaching" class="approaching" aria-hidden="true"><i></i><i></i><i></i></div>

    <svg id="whale" class="whale" viewBox="0 0 900 360" role="img" aria-label="クジラ">
      <defs>
        <linearGradient id="bodyGrad" x1="0" x2="1"><stop offset="0" stop-color="#7598a8"/><stop offset=".58" stop-color="#91aeba"/><stop offset="1" stop-color="#557989"/></linearGradient>
        <linearGradient id="bellyGrad" x1="0" x2="1"><stop offset="0" stop-color="#c0d0d5"/><stop offset="1" stop-color="#819da7"/></linearGradient>
      </defs>
      <g id="skeleton" class="skeleton">
        <path class="spine" d="M180 184 C300 103 604 111 778 185"/>
        <path class="rib" d="M238 163 C256 223 270 258 300 281 M300 140 C315 216 335 253 360 287 M366 127 C380 207 402 250 425 286 M435 122 C449 203 469 245 492 280 M505 126 C516 198 537 237 560 270 M575 139 C586 192 607 225 630 256 M644 155 C655 191 676 216 700 238"/>
        <path class="skull" d="M752 181 C808 153 848 164 862 199 C835 236 793 239 750 210 Z"/>
        <path class="tailbone" d="M180 184 L96 147 M173 194 L95 226 M100 147 L34 112 M99 226 L35 266"/>
      </g>
      <g id="livingWhale" class="living-whale">
        <path class="tail tail-a" d="M156 158 C99 103 58 74 20 95 C60 128 76 157 124 181 Z"/>
        <path class="tail tail-b" d="M156 176 C93 192 57 229 29 258 C76 257 114 235 146 199 Z"/>
        <path class="body" d="M120 176 C177 70 353 48 537 73 C681 92 782 147 832 197 C792 256 682 291 525 290 C337 288 190 256 120 176 Z"/>
        <path class="belly" d="M269 243 C411 285 636 276 769 228 C713 281 602 307 455 301 C376 298 315 279 269 243Z"/>
        <path class="fin" d="M458 230 C421 292 372 327 338 320 C369 274 377 237 390 201 Z"/>
        <circle class="eye" cx="744" cy="149" r="8"/>
        <path class="mouth" d="M829 203 Q793 211 763 205"/>
        <g id="decayMarks" class="decay-marks"></g>
      </g>
      <g id="osedax" class="osedax"></g>
    </svg>

    <div id="scavengers" class="scavengers"></div>
    <canvas id="energyCanvas" class="energy-canvas"></canvas>
    <div class="foreground"><i></i><i></i><i></i></div>
  </div>

  <header class="hud">
    <div class="stat"><small>経過時間</small><strong id="timeLabel">0日</strong></div>
    <div class="phase-head"><strong id="phaseLabel">生きている海</strong><div id="phaseDots" class="phase-dots"></div></div>
    <div class="stat right"><small>水深</small><strong id="depthLabel">20 m</strong></div>
    <button id="guideButton" class="round-btn" aria-label="図鑑を開く">◎<b id="foundCount">0</b></button>
  </header>

  <section id="intro" class="intro-card">
    <div class="kicker">WHALE FALL</div>
    <h1>クジラが死んだら</h1>
    <p>巨大な命が終わったあと、深海では別の世界が始まる。</p>
    <button id="startButton" class="primary">触って見届ける <span>START</span></button>
  </section>

  <div id="storyCaption" class="story-caption" aria-live="polite"></div>

  <section id="actionDock" class="action-dock hidden" aria-live="polite">
    <div class="action-icon" id="actionIcon">↓</div>
    <div class="action-copy"><strong id="actionTitle">下へスワイプ</strong><small id="actionSub">深海まで沈める</small></div>
    <div id="actionProgress" class="action-progress"><i></i></div>
  </section>

  <button id="timeButton" class="time-button hidden" aria-label="長押しして時間を進める"><span class="ring"></span><b>長押し</b><small>時間を進める</small></button>

  <aside id="fieldGuide" class="field-guide" aria-hidden="true">
    <button id="closeGuide" class="close-guide">×</button>
    <div class="kicker">FIELD GUIDE</div><h2>見つけた生き物</h2><div id="guideGrid" class="guide-grid"></div>
  </aside>

  <section id="ending" class="ending hidden">
    <div class="ending-inner"><div class="kicker">YEARS LATER</div><h2>一頭が終わった場所で、<br>無数の命が始まった。</h2><p>クジラは小さくなった。<br>でも、周りの世界は豊かになった。</p><div class="ending-actions"><button id="restartButton" class="primary">もう一度</button><button id="endingGuide" class="secondary">生き物を見る</button></div></div>
  </section>
</main>
<script src="./game.js"></script>
</body>
</html>
