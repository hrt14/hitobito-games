<body>
<div id="app">

<div class="topbar"><div class="brand">00:17 / BICYCLE PARK<b>駐輪場</b></div><div class="stats"><div class="stat"><span>ROUND</span><strong id="roundText">1/6</strong></div><div class="stat"><span>SCORE</span><strong id="scoreText">0</strong></div></div></div>

<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startSheet=document.getElementById('startSheet'),resultSheet=document.getElementById('resultSheet'),startBtn=document.getElementById('startBtn'),retryBtn=document.getElementById('retryBtn'),roundText=document.getElementById('roundText'),scoreText=document.getElementById('scoreText'),timerEl=document.getElementById('timer'),messageEl=document.getElementById('message'),hintEl=document.getElementById('hint'),flashEl=document.getElementById('flash'),resultScore=document.getElementById('resultScore'),resultNote=document.getElementById('resultNote'),resultTitle=document.getElementById('resultTitle'),resultKicker=document.getElementById('resultKicker'),bestScoreEl=document.getElementById('bestScore'),missText=document.getElementById('missText'),timeText=document.getElementById('timeText');
const COLORS=['#d55b3e','#c6b079','#345b88','#7f7e76','#bfc2bb','#5d473a','#314b3a','#9a6a75'],SETTINGS=[{count:12,time:12,memorize:2200},{count:16,time:10.5,memorize:2000},{count:20,time:9.5,memorize:1850},{count:24,time:8.5,memorize:1700},{count:28,time:7.7,memorize:1550},{count:32,time:7,memorize:1450}];
let W=0,H=0,dpr=1,bikes=[],target=null,phase='idle',round=0,score=0,misses=0,roundTime=0,timeLeft=0,phaseUntil=0,lastTs=0,totalStart=0,totalElapsed=0,messageTimer=0,shakeUntil=0,darkness=0,flicker=0,running=false,pointerDown=null,audioCtx=null;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layoutBikes();draw(performance.now())}
function bikeSignature(i){return{color:COLORS[i%COLORS.length],basket:i%3!==1,rearRack:i%4!==2,childSeat:i%9===5,highHandle:i%5===3,frontLight:i%4===0,wheelBand:i%7===2}}
function makeTarget(){const s=bikeSignature(Math.floor(rand(0,80)));s.basket=true;if(!s.childSeat&&!s.highHandle&&!s.frontLight)s.frontLight=true;return{...s,key:'target'}}
function nearTargetBike(i){const t=target,b={...bikeSignature(i+round*17)};if(Math.random()<.55)b.color=t.color;if(Math.random()<.52)b.basket=t.basket;if(Math.random()<.45)b.rearRack=t.rearRack;if(Math.random()<.3)b.highHandle=t.highHandle;if(Math.random()<.28)b.frontLight=t.frontLight;if(Math.random()<.22)b.childSeat=t.childSeat;if(JSON.stringify([b.color,b.basket,b.rearRack,b.childSeat,b.highHandle,b.frontLight])===JSON.stringify([t.color,t.basket,t.rearRack,t.childSeat,t.highHandle,t.frontLight]))b.frontLight=!b.frontLight;return b}
function generateRound(){bikes=[];for(let i=0;i<SETTINGS[round].count-1;i++)bikes.push({...nearTargetBike(i),id:'d'+i,wrong:false});bikes.push({...target,id:'target',wrong:false});for(let i=bikes.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bikes[i],bikes[j]]=[bikes[j],bikes[i]]}layoutBikes()}
function layoutBikes(){if(!bikes.length)return;const top=Math.max(145,H*.2),bottom=H-62,lanes=W<520?4:Math.max(5,Math.min(8,Math.floor(W/110))),rows=Math.ceil(bikes.length/lanes),usableH=Math.max(220,bottom-top);bikes.forEach((b,i)=>{const row=Math.floor(i/lanes),col=i%lanes,y=top+(row+.72)*(usableH/Math.max(1,rows)),depth=clamp((y-top)/usableH,0,1),laneW=W/(lanes+1),zig=(row%2?-.12:.12)*laneW,x=(col+1)*laneW+zig+rand(-laneW*.09,laneW*.09);b.x=clamp(x,30,W-30);b.y=y;b.scale=.58+depth*.62;b.angle=rand(-.12,.12);b.hitR=34*b.scale+8});bikes.sort((a,b)=>a.y-b.y)}
function startGame(){score=0;misses=0;round=0;target=makeTarget();totalStart=performance.now();running=true;startSheet.hidden=false;resultSheet.hidden=true;overlay.classList.add('hidden');roundText.textContent='1/6';scoreText.textContent='0';startRound();beep(520,.07,.03,'triangle')}
function startRound(){generateRound();phase='memorize';phaseUntil=performance.now()+SETTINGS[round].memorize;roundTime=SETTINGS[round].time;timeLeft=roundTime;roundText.textContent=`${round+1}/6`;hintEl.textContent='この自転車を覚える';showMessage(round===0?'これが、あなたの自転車。':round===3?'照明が少しおかしい。':round===5?'最後。似たのが増えている。':'もう一度、覚えて。',1000);darkness=round>=3?.12:0;flicker=0}
function beginSearch(){phase='search';timeLeft=roundTime;hintEl.textContent='覚えた自転車をタップ';showMessage('見つけろ',650);beep(660,.06,.025,'square');if(round>=3)triggerFlicker()}
function triggerFlicker(){flicker=1;flashEl.classList.remove('on');void flashEl.offsetWidth;flashEl.classList.add('on');setTimeout(()=>flicker=.2,100);setTimeout(()=>flicker=0,260)}
function showMessage(text,ms=850){messageEl.textContent=text;messageEl.classList.add('show');clearTimeout(messageTimer);messageTimer=setTimeout(()=>messageEl.classList.remove('show'),ms)}
function onCorrect(){if(phase!=='search')return;phase='success';const bonus=Math.max(40,Math.round(timeLeft*100));score+=1000+bonus+round*250;scoreText.textContent=score.toLocaleString();beep(880,.07,.045,'triangle');setTimeout(()=>beep(1175,.08,.035,'triangle'),70);vibrate([22,35,35]);showMessage(round===5?'あった。帰れる。':'見つけた',800);triggerFlicker();setTimeout(()=>{if(round>=5)finish(true);else{round++;startRound()}},850)}
function onWrong(b){if(phase!=='search')return;misses++;b.wrong=true;timeLeft=Math.max(0,timeLeft-2);shakeUntil=performance.now()+180;beep(120,.11,.055,'sawtooth');vibrate(45);showMessage('違う。 -2秒',650);setTimeout(()=>b.wrong=false,260);if(round>=4&&Math.random()<.48)triggerFlicker()}
function finish(win){running=false;phase='end';totalElapsed=(performance.now()-totalStart)/1000;const finalScore=Math.max(0,score-misses*120),best=Math.max(Number(localStorage.getItem('last-bike-best')||0),finalScore);localStorage.setItem('last-bike-best',String(best));resultScore.textContent=finalScore.toLocaleString();bestScoreEl.textContent=best.toLocaleString();missText.textContent=String(misses);timeText.textContent=`${totalElapsed.toFixed(1)}s`;if(win){resultKicker.textContent='YOU FOUND IT';resultTitle.innerHTML='帰れる。<small>LAST BIKE</small>';resultNote.textContent='何十台もの似た自転車の中から、自分の一台にたどり着いた。'}else{resultKicker.textContent='TIME OVER';resultTitle.innerHTML='見つからない。<small>00:17 → ??:??</small>';resultNote.textContent='時間切れ。駐輪場は、さっきより少し広くなっている。'}startSheet.hidden=true;resultSheet.hidden=false;overlay.classList.remove('hidden')}
function drawBike(b,ghost=false){const s=b.scale||1,x=b.x||0,y=b.y||0;ctx.save();ctx.translate(x,y);ctx.rotate(b.angle||0);ctx.scale(s,s);if(b.wrong)ctx.translate(Math.sin(performance.now()*.12)*3,0);const metal=ghost?'rgba(235,239,238,.75)':'#b9c0c3',tire='rgba(14,17,20,.96)',wheelY=11,rr=18;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=tire;ctx.lineWidth=5;ctx.beginPath();ctx.arc(-19,wheelY,rr,0,Math.PI*2);ctx.arc(22,wheelY,rr,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(215,220,220,.42)';ctx.lineWidth=1.3;for(const wx of[-19,22])for(let a=0;a<Math.PI;a+=Math.PI/4){ctx.beginPath();ctx.moveTo(wx,wheelY);ctx.lineTo(wx+Math.cos(a)*rr,wheelY+Math.sin(a)*rr);ctx.stroke()}ctx.strokeStyle=b.color;ctx.lineWidth=4.4;ctx.beginPath();ctx.moveTo(-18,8);ctx.lineTo(-4,-10);ctx.lineTo(10,9);ctx.lineTo(-18,8);ctx.lineTo(0,8);ctx.lineTo(-4,-10);ctx.lineTo(15,-15);ctx.stroke();ctx.strokeStyle=metal;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-4,-10);ctx.lineTo(-7,-20);ctx.lineTo(0,-20);ctx.moveTo(15,-15);ctx.lineTo(22,7);ctx.stroke();ctx.strokeStyle='#b08a68';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-11,-20);ctx.lineTo(1,-20);ctx.stroke();ctx.strokeStyle=metal;ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(15,-15);if(b.highHandle){ctx.lineTo(15,-31);ctx.lineTo(25,-33)}else{ctx.lineTo(18,-25);ctx.lineTo(29,-24)}ctx.stroke();if(b.basket){ctx.strokeStyle='rgba(185,191,184,.86)';ctx.lineWidth=1.7;ctx.strokeRect(17,-25,19,12);ctx.beginPath();ctx.moveTo(19,-21);ctx.lineTo(34,-21);ctx.moveTo(19,-17);ctx.lineTo(34,-17);ctx.stroke()}if(b.rearRack){ctx.strokeStyle=metal;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-20,-8);ctx.lineTo(-33,-8);ctx.lineTo(-27,3);ctx.moveTo(-32,-8);ctx.lineTo(-20,8);ctx.stroke()}if(b.childSeat){ctx.fillStyle='#34383b';ctx.beginPath();ctx.roundRect(-38,-24,14,18,3);ctx.fill();ctx.strokeStyle='#9da1a0';ctx.lineWidth=1.2;ctx.stroke()}if(b.frontLight){ctx.fillStyle='#fff9c6';ctx.shadowColor='#fff3a0';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(17,-15,2.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}if(b.wheelBand){ctx.strokeStyle='rgba(255,255,255,.82)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(22,wheelY,14,0,Math.PI*1.25);ctx.stroke()}if(b.id==='target'&&phase==='memorize'){ctx.strokeStyle='rgba(247,243,195,.98)';ctx.lineWidth=2.4;ctx.shadowColor='#fff4a8';ctx.shadowBlur=18;ctx.beginPath();ctx.ellipse(0,-4,52,43,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}ctx.restore()}
function drawTargetCard(){const boxW=Math.min(W-38,360),boxH=126,x=(W-boxW)/2,y=Math.max(132,H*.17);ctx.save();ctx.fillStyle='rgba(7,10,14,.89)';ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x,y,boxW,boxH,20);ctx.fill();ctx.stroke();ctx.fillStyle='#9ca5ad';ctx.font='800 10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.fillText('YOUR BIKE — 覚える',x+18,y+22);drawBike({...target,x:x+boxW*.5,y:y+78,scale:1.55,angle:0,id:'demo'},true);ctx.restore()}
function drawScene(ts){const shake=ts<shakeUntil?Math.sin(ts*.18)*5:0;ctx.save();ctx.translate(shake,0);const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#10151b');grad.addColorStop(.46,'#12171b');grad.addColorStop(1,'#090b0d');ctx.fillStyle=grad;ctx.fillRect(-10,0,W+20,H);ctx.fillStyle='#0c1014';ctx.fillRect(0,0,W,Math.max(105,H*.17));const lights=W<520?2:3;for(let i=0;i<lights;i++){const lx=(i+.5)*W/lights,ly=Math.max(46,H*.085),dim=round>=3&&((i+round)%3===0)?.33:1;ctx.save();ctx.globalAlpha=dim*(1-flicker*.75);ctx.fillStyle='#f4f1d7';ctx.shadowColor='#fffde8';ctx.shadowBlur=20;ctx.fillRect(lx-38,ly,76,7);ctx.restore()}const horizon=Math.max(112,H*.18);for(let i=0;i<4;i++){const px=i*W/3;ctx.fillStyle=i%2?'#d7d5cb':'#bfc0ba';ctx.globalAlpha=.72;ctx.fillRect(px-13,horizon-18,26,H*.19);ctx.globalAlpha=1;ctx.fillStyle='rgba(255,214,84,.62)';ctx.fillRect(px-9,horizon+12,18,7)}ctx.strokeStyle='rgba(170,179,181,.18)';ctx.lineWidth=1;const fy=horizon+44;for(let x=-20;x<W+20;x+=18){ctx.beginPath();ctx.moveTo(x,fy);ctx.lineTo(x+26,fy+40);ctx.stroke();ctx.beginPath();ctx.moveTo(x+26,fy);ctx.lineTo(x,fy+40);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.022)';for(let i=0;i<120;i++){const x=i*97%Math.max(1,W),y=horizon+80+(i*53%Math.max(1,H-horizon-80));ctx.fillRect(x,y,1.4,1.4)}ctx.strokeStyle='rgba(238,231,195,.14)';ctx.lineWidth=1.2;for(let i=0;i<7;i++){const bx=i*W/6;ctx.beginPath();ctx.moveTo(W*.5+(bx-W*.5)*.14,horizon+44);ctx.lineTo(bx,H);ctx.stroke()}for(const b of bikes)drawBike(b);if(round>=4&&phase==='search'){ctx.save();ctx.globalAlpha=.08+.05*Math.sin(ts*.0017);drawBike({...target,x:W*.86,y:horizon+72,scale:.54,angle:-.05,id:'ghost'},true);ctx.restore()}if(darkness>0){ctx.fillStyle=`rgba(0,0,0,${darkness+flicker*.34})`;ctx.fillRect(0,0,W,H)}ctx.restore();if(phase==='memorize')drawTargetCard()}
function draw(ts){if(!W||!H)return;ctx.clearRect(0,0,W,H);drawScene(ts)}
function update(ts){if(!lastTs)lastTs=ts;const dt=Math.min(.05,(ts-lastTs)/1000);lastTs=ts;if(running){if(phase==='memorize'&&ts>=phaseUntil)beginSearch();else if(phase==='search'){timeLeft-=dt;const ratio=clamp(timeLeft/roundTime,0,1);timerEl.style.transform=`scaleX(${ratio})`;timerEl.style.background=ratio<.28?'#ff626d':'linear-gradient(90deg,#f2efc8,#fff)';if(round>=3&&Math.random()<dt*(round===5?.42:.16))triggerFlicker();if(timeLeft<=0){beep(80,.2,.06,'sawtooth');vibrate([80,60,80]);finish(false)}}else if(phase==='memorize'){timerEl.style.transform='scaleX(1)';timerEl.style.background='linear-gradient(90deg,#f2efc8,#fff)'}}draw(ts);requestAnimationFrame(update)}
function coords(ev){const r=canvas.getBoundingClientRect(),t=ev.touches?.[0]||ev.changedTouches?.[0]||ev;return{x:(t.clientX-r.left)*(W/r.width),y:(t.clientY-r.top)*(H/r.height)}}function hitBike(p){let best=null,bestD=1e9;for(let i=bikes.length-1;i>=0;i--){const b=bikes[i],dx=p.x-b.x,dy=p.y-(b.y-2*b.scale),d=Math.hypot(dx,dy);if(d<b.hitR&&d<bestD){best=b;bestD=d}}return best}function pointerStart(ev){if(phase!=='search')return;pointerDown=coords(ev)}function pointerEnd(ev){if(phase!=='search'||!pointerDown)return;const p=coords(ev);if(Math.hypot(p.x-pointerDown.x,p.y-pointerDown.y)>24){pointerDown=null;return}pointerDown=null;const b=hitBike(p);if(!b){showMessage('自転車をタップ',450);return}b.id==='target'?onCorrect():onWrong(b)}
canvas.addEventListener('pointerdown',pointerStart,{passive:true});canvas.addEventListener('pointerup',pointerEnd,{passive:true});startBtn.addEventListener('click',startGame);retryBtn.addEventListener('click',startGame);addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&phase==='search')lastTs=performance.now()});resize();requestAnimationFrame(update);
})();
