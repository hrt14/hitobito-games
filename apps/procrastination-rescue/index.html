<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="今先送りしていることの詰まりを整理し、できる大きさまで一歩を小さくするルールベースの行動支援ツール。">
  <title>先送りレスキュー</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="最初に戻る">
        <span class="brand-mark" aria-hidden="true">↘</span>
        <span>先送りレスキュー</span>
      </button>
      <button class="history-button" type="button" data-action="history">履歴</button>
    </header>

    <section id="app" class="stage" aria-live="polite"></section>

    <footer class="footer-note">
      日常の先送りを整理するセルフヘルプツールです。医療的な診断は行いません。
    </footer>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
