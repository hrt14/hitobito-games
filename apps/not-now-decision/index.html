<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10110f"><meta name="description" content="今日決める必要があるかだけを3問で判定し、不要な判断を正式に保留するLEVEL UPアプリ。"><title>いま決めなくていい</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#10110f;--card:#191a17;--line:#33342f;--lime:#e4ff58;--paper:#f0eee6;--ink:#151611;--muted:#83867d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f3ed;-webkit-font-smoothing:antialiased}button,input{font:inherit}.app{width:min(690px,100%);min-height:100dvh;margin:auto;padding:max(13px,env(safe-area-inset-top)) 13px max(22px,env(safe-area-inset-bottom))}.top{height:44px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:10px;font-weight:950;letter-spacing:.14em}.brand b{color:var(--lime)}.ghost{border:1px solid var(--line);border-radius:999px;background:transparent;color:#9da099;padding:8px 11px;font-size:10px;font-weight:900}.screen{display:none}.screen.active{display:block}.hero{padding-top:9vh}.kicker{color:var(--lime);font-size:10px;letter-spacing:.16em;font-weight:950}.hero h1,.step h1,.result h1{font-size:clamp(44px,12vw,71px);line-height:.94;letter-spacing:-.065em;margin:14px 0 17px}.hero p{font-size:16px;line-height:1.7;color:#b9bcb4}.hero strong{color:#fff}.primary{width:100%;min-height:59px;border:0;border-radius:17px;background:var(--lime);color:#11130e;font-size:16px;font-weight:950}.secondary{width:100%;min-height:50px;border:1px solid var(--line);border-radius:15px;background:#191a17;color:#e9eae4;font-weight:900;margin-top:8px}.step{padding-top:5vh}.step h1{font-size:clamp(35px,9vw,52px);margin-bottom:9px}.sub{color:#93978e;font-size:13px;line-height:1.65;margin:0 0 16px}.decision-input{width:100%;border:1px solid var(--line);border-radius:18px;background:#191a17;color:#fff;padding:17px;outline:none;font-size:17px}.decision-input:focus{border-color:#697526}.question-card{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:18px;margin-top:13px}.qnum{font-size:9px;color:var(--lime);font-weight:950;letter-spacing:.13em}.question{font-size:clamp(24px,6.5vw,34px);line-height:1.3;letter-spacing:-.035em;font-weight:950;margin:15px 0 20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{min-height:57px;border:1px solid #3a3c36;border-radius:15px;background:#20211d;color:white;font-weight:950}.choice.yes{background:var(--lime);border-color:var(--lime);color:#11130e}.progress{height:5px;background:#272824;border-radius:99px;overflow:hidden;margin:13px 2px}.progress i{display:block;height:100%;background:var(--lime);transition:width .2s}.result{padding-top:5vh}.verdict{display:inline-block;border:1px solid rgba(228,255,88,.4);color:var(--lime);border-radius:999px;padding:7px 10px;font-size:9px;letter-spacing:.13em;font-weight:950}.result h1{font-size:clamp(43px,11vw,67px);margin-bottom:13px}.decision-box{background:var(--paper);color:var(--ink);border-radius:21px;padding:16px}.decision-box small{display:block;color:#73756d;font-size:9px;font-weight:950;letter-spacing:.1em}.decision-box strong{display:block;font-size:21px;line-height:1.4;margin-top:7px}.reason{color:#a2a69b;font-size:12px;line-height:1.6;margin:14px 2px}.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.datebtn{min-height:54px;border:1px solid #3a3c36;border-radius:14px;background:#1c1d19;color:white;font-weight:900}.datebtn.selected{background:var(--lime);color:#11130e;border-color:var(--lime)}.store{margin-top:20px}.store-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.store-head strong{font-size:11px;letter-spacing:.1em}.store-head span{font-size:9px;color:#7e8279}.stored-item{border:1px solid var(--line);border-radius:15px;background:#181916;padding:12px 13px;margin-top:7px}.stored-item small{display:block;color:#7e827a;font-size:9px}.stored-item strong{display:block;font-size:14px;line-height:1.4;margin:4px 0}.stored-item button{border:0;background:transparent;color:#8f938a;padding:4px 0;font-size:10px;font-weight:900}.error{min-height:18px;color:#ff927e;font-size:10px;margin-top:7px}.done-now{margin-top:13px;border-left:3px solid var(--lime);padding:9px 11px;background:#181a15;font-size:12px;line-height:1.55;color:#cdd1c6}@media(max-width:480px){.hero{padding-top:6vh}.hero h1{font-size:51px}.hero p{font-size:15px}.dates{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><div class="brand">LEVEL <b>UP</b> / DECISION GATE</div><button class="ghost" id="restart">新しく判定</button></header><section id="hero" class="screen hero active"><div class="kicker">DECIDE WHETHER TO DECIDE</div><h1>いま決めなくて<br>いい</h1><p><strong>結論を出す前に、「今日決める必要ある？」だけ決める。</strong><br>判断そのものを抱え続けない。</p><button id="start" class="primary">判断をゲートに通す</button><button id="storeBtn" class="secondary">保留中を見る</button></section><section id="inputScreen" class="screen step"><div class="kicker">ONE DECISION</div><h1>いま頭にある<br>判断は？</h1><p class="sub">1件だけ。結論はまだ考えない。</p><input id="decision" class="decision-input" placeholder="例：新しい仕事を受けるか"><button id="gateBtn" class="primary" style="margin-top:13px">3問だけ判定する</button><div id="inputError" class="error"></div></section><section id="questionScreen" class="screen step"><div class="kicker">DECISION GATE</div><div class="progress"><i id="progress"></i></div><div class="question-card"><div id="qnum" class="qnum"></div><div id="question" class="question"></div><div class="choices"><button id="yes" class="choice yes">はい</button><button id="no" class="choice">いいえ</button></div></div></section><section id="resultScreen" class="screen result"><div id="verdict" class="verdict"></div><h1 id="resultTitle"></h1><div class="decision-box"><small>判断案件</small><strong id="resultDecision"></strong></div><div id="reason" class="reason"></div><div id="laterArea" style="display:none"><div class="sub">再検討日を決めたら、それまでは考えなくていい。</div><div class="dates"><button class="datebtn" data-days="1">明日</button><button class="datebtn" data-days="3">3日後</button><button class="datebtn" data-days="7">1週間後</button></div><button id="saveLater" class="primary">保留庫に入れる</button><div id="saveError" class="error"></div></div><div id="nowArea" style="display:none"><div class="done-now">今日は判断する理由があります。ただし、今この画面で結論を出す必要はない。判断する時間を1枠だけ確保して、そこで決める。</div><button id="finishNow" class="primary" style="margin-top:12px">判断する時間を取る</button></div><div id="store" class="store"></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),KEY='levelup-not-now-decision-v1';const qs=['今日が実際の締切？','今日決めないと、誰か・何かが止まる？','待てば判断材料が増える？'];let decision='',answers=[],qi=0,selectedDays=0;const show=id=>document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));function loadStore(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function saveStore(v){try{localStorage.setItem(KEY,JSON.stringify(v.slice(-10)))}catch{}}function renderQ(){show('questionScreen');$('qnum').textContent=`0${qi+1} / 03`;$('question').textContent=qs[qi];$('progress').style.width=((qi+1)/3*100)+'%'}function answer(v){answers[qi]=v;qi++;navigator.vibrate?.(10);if(qi<3)renderQ();else renderResult()}function fmtDate(days){const d=new Date();d.setDate(d.getDate()+days);return `${d.getMonth()+1}/${d.getDate()}`}function renderResult(){show('resultScreen');$('resultDecision').textContent=decision;const must=answers[0]||answers[1];$('laterArea').style.display=must?'none':'block';$('nowArea').style.display=must?'block':'none';if(must){$('verdict').textContent='DECIDE TODAY';$('resultTitle').textContent='今日は、決める理由あり。';$('reason').textContent=answers[0]?'実際の締切が今日。判断を今日の予定として扱う。':'今日決めないと誰か・何かが止まる。判断を今日の予定として扱う。'}else{$('verdict').textContent='NOT NOW';$('resultTitle').textContent='いま決めなくていい。';$('reason').textContent=answers[2]?'しかも待てば判断材料が増える。今の情報で急いで決める理由は薄い。':'今日決める外的な理由はない。再検討日まで正式に保留する。'}renderStore()}function renderStore(){const items=loadStore(),el=$('store');el.innerHTML='<div class="store-head"><strong>保留中</strong><span>'+items.length+'件</span></div>';items.slice().reverse().forEach((it,rev)=>{const actual=items.length-1-rev,d=document.createElement('div');d.className='stored-item';d.innerHTML='<small></small><strong></strong><button>完了・削除</button>';d.querySelector('small').textContent='再検討 '+it.date;d.querySelector('strong').textContent=it.text;d.querySelector('button').onclick=()=>{const x=loadStore();x.splice(actual,1);saveStore(x);renderStore()};el.appendChild(d)})}$('start').onclick=()=>show('inputScreen');$('storeBtn').onclick=()=>{decision='保留庫';answers=[false,false,false];show('resultScreen');$('verdict').textContent='DECISION PARKING';$('resultTitle').textContent='保留中の判断。';$('resultDecision').textContent='再検討日までは、考えなくていい。';$('reason').textContent='';$('laterArea').style.display='none';$('nowArea').style.display='none';renderStore()};$('gateBtn').onclick=()=>{decision=$('decision').value.trim();if(!decision){$('inputError').textContent='判断したいことを1件だけ入れてください。';return}answers=[];qi=0;selectedDays=0;renderQ()};$('yes').onclick=()=>answer(true);$('no').onclick=()=>answer(false);document.querySelectorAll('.datebtn').forEach(b=>b.onclick=()=>{selectedDays=Number(b.dataset.days);document.querySelectorAll('.datebtn').forEach(x=>x.classList.toggle('selected',x===b));$('saveError').textContent=''});$('saveLater').onclick=()=>{if(!selectedDays){$('saveError').textContent='再検討日を1つ選ぶ。';return}const x=loadStore();x.push({text:decision,date:fmtDate(selectedDays),created:Date.now()});saveStore(x);renderStore();$('saveLater').textContent='保留しました';navigator.vibrate?.([12,20,12])};$('finishNow').onclick=()=>{$('finishNow').textContent='今日の判断枠に入れた';navigator.vibrate?.(15)};$('restart').onclick=()=>{$('decision').value='';decision='';answers=[];qi=0;selectedDays=0;show('inputScreen');setTimeout(()=>$('decision').focus(),80)};renderStore()})();</script></body></html>
