<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b0d"><title>NEGOTIATOR｜小動画やめろ | LEVEL UP</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#090b0d;--panel:#12161a;--ink:#f5f6f0;--muted:#939aa0;--lime:#d8ff5b;--line:#ffffff16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit}.app{min-height:100svh;width:min(100%,560px);margin:auto;padding:14px 14px 28px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;min-height:48px}.brand{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--lime)}.home{color:var(--muted);text-decoration:none;font-size:12px}.meter{height:5px;background:#ffffff10;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--lime);width:8%;transition:.25s}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}.round{font-size:10px;color:var(--lime);font-weight:900;letter-spacing:.13em}.ask{font-size:clamp(31px,9vw,46px);line-height:1.03;letter-spacing:-.05em;margin:10px 0 12px}.sub{font-size:13px;line-height:1.75;color:#bac1b7;margin:0 0 18px}.reply{padding:12px 14px;border:1px solid #d8ff5b30;background:#11170e;border-radius:15px;color:#dce5cf;margin-bottom:12px;font-size:12px;line-height:1.6}.choices{display:grid;gap:9px}.choice,.primary,.secondary{width:100%;min-height:56px;border-radius:17px;padding:13px 15px}.choice{border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;font-weight:800}.choice:active{transform:scale(.99)}.timer{text-align:center;padding:25px;border:1px solid #d8ff5b35;border-radius:28px;background:#10150d}.timer b{display:block;font-size:84px;color:var(--lime);line-height:1}.timer p{color:#b7c0af}.primary{border:0;background:var(--lime);color:#11140d;font-weight:1000}.secondary{border:1px solid var(--line);background:#12161a;color:var(--ink);font-weight:900}.result{padding:22px;border:1px solid #d8ff5b30;border-radius:26px;background:#10140e}.result h1{font-size:38px;line-height:1;margin:0 0 12px}.result strong{color:var(--lime)}.plans{display:grid;gap:8px;margin:15px 0}.tiny{font-size:10px;color:var(--muted);line-height:1.6}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="app"><header class="top"><div class="brand">NEGOTIATOR / SHORT VIDEO</div><a class="home" href="/">LEVEL UP</a></header><div class="meter"><i id="meter"></i></div><section id="stage" class="stage"></section></main><script>(()=>{const stage=document.getElementById('stage'),meter=document.getElementById('meter'),KEY='levelup-negotiator-short-video-v2';let score=8,step='big',history=[],timerId=null;const stats=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{"sessions":0,"deals":0,"lastPlan":""}')}catch{return{sessions:0,deals:0,lastPlan:''}}};const save=s=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const data={big:{r:'ROUND 01 / 大きく出る',a:'今日はもう、ショート動画やめない？',s:'断っていい。こっちは要求を小さくしていく。',c:[['やめる','away',28,'早い。では離れるところまで取引します。'],['あと1本だけ','mirror',6,'出ました「あと1本」。条件を下げます。'],['別に困ってない','future',4,'了解。やめろとは言わない。確認だけ。']]},mirror:{r:'ROUND 02 / 言い当てにいく',a:'完全にやめたいより、このまま延々見るのは嫌、くらいじゃない？',s:'当たっていても外れていても次へ進む。',c:[['それはある','tiny',18,'十分。ゼロではなく3秒止めるに変えます。'],['いや別に','future',5,'OK。10本後の自分で判定しよう。'],['わからん','tiny',9,'判断は不要。動作だけ小さくします。']]},future:{r:'ROUND 02 / 10本後を見る',a:'次の10本を見終わった自分、いまより満足してそう？',s:'正解なし。未来の自分に1票。',c:[['たぶん満足してない','tiny',16,'その1票を使う。3秒だけ止まろう。'],['わからない','tiny',10,'なら実験。3秒止まってまだ見たいか確かめる。'],['満足してると思う','finger',4,'視聴は許可。親指だけ一回止める。']]},tiny:{r:'ROUND 03 / 要求を極小化',a:'やめなくていい。次の動画の前に、3秒だけ止まるのは？',s:'視聴禁止ではない。スクロールを止めるだけ。',c:[['3秒なら','timer3',24,'成立。3秒だけ取ります。'],['1秒なら','timer1',16,'値切られた。1秒で契約。'],['止まりたくない','finger',5,'では時間を要求しない。親指だけ変える。']]},finger:{r:'ROUND 04 / 動作だけ変える',a:'見るのは続けていい。親指を画面から外して、息を1回吐くのは？',s:'「やめる」を決めなくていい。自動スクロールだけ切る。',c:[['それならやる','away',20,'十分。次は距離です。'],['息だけなら','awaylite',14,'契約成立。少しだけ離します。'],['まだ無理','awaylite',5,'さらに値下げ。画面を下向きにするだけ。']]},away:{r:'ROUND 05 / 距離をつくる',a:'スマホを伏せて、30秒だけ手の届かないところに置く？',s:'30秒後に戻ってもいい。',c:[['30秒やる','timer30',30,'いい取引です。'],['10秒なら','timer10',20,'10秒で成立。'],['まだ見る','awaylite',5,'場所は変えない。画面を伏せるだけ。']]},awaylite:{r:'ROUND 06 / さらに値下げ',a:'やめなくていい。画面を下に向けるか、ロックするだけなら？',s:'5秒後に解除してもいい。',c:[['伏せる','timer5',22,'視界から消す5秒を取ります。'],['画面ロックだけ','timer5',18,'それで十分。'],['それも嫌','last',4,'最後は「やめる」ではなく「区切る」。']]},last:{r:'FINAL ROUND / 最終値下げ',a:'「あと1本だけ」を、本当に「次の1本で終了」に変える？',s:'ゼロにしなくていい。終わる場所だけ決める。',c:[['次の1本で終了','plan',26,'交渉成立。次回の一手だけ決める。'],['区切りは決めない','plan',8,'今回は強い。次回の一手だけ残す。'],['この交渉を閉じる','draw',0,'了解。今回は引き分け。']]}};function render(reply=''){clearInterval(timerId);meter.style.width=Math.min(100,score)+'%';const d=data[step];stage.innerHTML=`<div class=round>${d.r}</div><h1 class=ask>${d.a}</h1><p class=sub>${d.s}</p>${reply?`<div class=reply>${reply}</div>`:''}<div class=choices>${d.c.map((x,i)=>`<button class=choice data-i=${i}>${x[0]}</button>`).join('')}</div>`;stage.querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}function choose(i){const x=data[step].c[i];history.push([step,x[0]]);score=Math.min(100,score+x[2]);if(x[1].startsWith('timer'))return countdown(+x[1].replace('timer',''),x[3]);if(x[1]==='plan')return plan();if(x[1]==='draw')return done(true);step=x[1];render(x[3])}function countdown(n,msg){let t=n;stage.innerHTML=`<div class=timer><div class=round>NO SCROLL</div><b id=t>${t}</b><p>${msg}<br>いまは何も決めなくていい。</p></div>`;timerId=setInterval(()=>{t--;document.getElementById('t').textContent=t;if(t<=0){clearInterval(timerId);step=n>=5?'last':'away';render('できた。自動運転が一度切れました。')}},1000)}function plan(){const s=stats();stage.innerHTML=`<div class=result><div class=round>NEXT SESSION</div><h1>次に開く前の<br><strong>一手</strong>だけ決める。</h1><div class=plans>${['水を一口飲んでから開く','立って3歩歩いてから開く','10分後にまだ見たければ開く'].map(p=>`<button class=choice data-p="${p}">${p}</button>`).join('')}</div><p class=tiny>永久禁止ではありません。自動で開く前に1つ挟むだけ。</p></div>`;stage.querySelectorAll('button').forEach(b=>b.onclick=()=>done(false,b.dataset.p))}function done(draw,plan=''){const s=stats(),next={sessions:s.sessions+1,deals:s.deals+(draw?0:1),lastPlan:plan||s.lastPlan};save(next);stage.innerHTML=`<div class=result><div class=round>${draw?'DRAW':'DEAL CLOSED'}</div><h1>${draw?'今回は引き分け。':'ショート動画との間に、<strong>1回</strong>割り込めた。'}</h1><p class=sub>${plan?`次回ルール：${plan}`:'強制終了はしません。次に開いた時また交渉できます。'}</p><p class=tiny>この端末で ${next.sessions} 回交渉 / 成立 ${next.deals} 回</p><button class=primary id=again>もう一度交渉する</button></div>`;document.getElementById('again').onclick=()=>{score=8;step='big';history=[];render()}}render();})();</script></body></html>
