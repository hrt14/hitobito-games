<style>
:root{color-scheme:dark;--bg:#090b08;--panel:#10140d;--panel2:#151a10;--ink:#f2f5e9;--muted:#9aa28d;--line:rgba(217,255,87,.17);--lime:#d9ff57;--lime2:#b8de36;--danger:#ff8c73;--shadow:#0008;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{-webkit-font-smoothing:antialiased;overscroll-behavior:none}.app{min-height:100svh;color:var(--ink);background:var(--bg)}.shell{width:min(100%,600px);min-height:100svh;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;overflow:hidden}.shell:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px);opacity:.45;z-index:30}.top{height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:3}.navbtn{border:0;background:transparent;color:#c5cfb5;padding:8px 4px;font:inherit;font-size:11px;font-weight:900;letter-spacing:.04em;cursor:pointer;text-decoration:none}.navbtn:focus-visible,.btn:focus-visible,.chip:focus-visible,.typebtn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.toplabel{font-size:8px;font-weight:950;letter-spacing:.16em;color:#68715e}.progress{height:3px;background:#ffffff0b;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--lime);box-shadow:0 0 18px rgba(217,255,87,.35);transition:width .2s ease}.screen{flex:1;display:flex;flex-direction:column;padding:24px 0 6px;animation:enter .2s ease}.screen.center{justify-content:center}.step{font-size:9px;font-weight:950;letter-spacing:.17em;color:var(--lime);margin-bottom:12px}.screen h1,.screen h2{margin:0;letter-spacing:-.055em;line-height:1.02}.screen h1{font-size:clamp(43px,12vw,64px)}.screen h2{font-size:clamp(34px,9vw,48px)}.lead{font-size:14px;line-height:1.75;color:#c3cab7;margin:15px 0 22px}.panel{border:1px solid var(--line);background:var(--panel);border-radius:24px;padding:18px}.label{display:block;font-size:10px;font-weight:900;letter-spacing:.04em;color:#b5bea7;margin:0 0 8px}.hint{display:block;font-size:9px;line-height:1.5;color:#77816c;margin-top:6px}.textarea,.textinput{width:100%;border:1px solid #ffffff13;background:#090c08;color:var(--ink);font:inherit;border-radius:16px;padding:13px 14px}.textarea{min-height:98px;resize:vertical;font-size:15px;line-height:1.55}.textinput{font-size:14px;min-height:48px}.textarea::placeholder,.textinput::placeholder{color:#69705f}.pressure-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:18px 0 2px}.pressure-head strong{font-size:27px;color:var(--lime);font-variant-numeric:tabular-nums}.range{width:100%;accent-color:var(--lime);height:32px}.btn{width:100%;min-height:56px;border:0;border-radius:17px;padding:13px 16px;font:inherit;font-size:15px;font-weight:950;cursor:pointer;transition:transform .12s ease,opacity .12s ease,background .12s ease}.btn:active,.chip:active,.typebtn:active{transform:scale(.985)}.btn.primary{background:var(--lime);color:#0a0d06}.btn.primary:disabled{opacity:.28;cursor:not-allowed}.btn.ghost{background:transparent;color:#aab49b;border:1px solid #ffffff12}.actions{display:grid;gap:9px;margin-top:14px}.last{margin-top:14px;border:1px solid #ffffff0d;border-radius:17px;padding:12px 14px;color:#8c967e}.last span{display:block;font-size:8px;letter-spacing:.12em}.last strong{display:block;color:#d7dec9;font-size:12px;line-height:1.5;margin-top:5px}.zoomfield{position:relative;min-height:300px;border:1px solid #ffffff0f;background:#0c100a;border-radius:26px;margin:4px 0 14px;padding:18px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.horizon{position:absolute;top:13px;left:15px;font-size:9px;font-weight:950;letter-spacing:.1em;color:var(--lime)}.problem-card{max-width:430px;margin:26px auto 22px;border:1px solid rgba(217,255,87,.3);background:#171e10;border-radius:22px;padding:20px;font-size:20px;line-height:1.45;font-weight:950;text-align:center;transform-origin:center;transition:transform .15s ease,opacity .15s ease,box-shadow .15s ease;box-shadow:0 0 55px rgba(217,255,87,.08)}.timeline{display:flex;justify-content:space-between;color:#626b59;font-size:7px;letter-spacing:.05em;margin:0 4px}.insight{border-left:3px solid var(--lime);padding:10px 0 10px 14px;margin-bottom:15px}.insight span{display:block;color:#77816c;font-size:8px;letter-spacing:.11em;margin-bottom:5px}.insight strong{display:block;font-size:14px;line-height:1.55}.compare-board{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 14px}.chip{min-height:92px;border:1px solid #ffffff10;background:var(--panel);color:var(--ink);border-radius:18px;padding:13px;text-align:left;font:inherit;cursor:pointer;transition:.18s transform,.18s opacity,.18s background}.chip span{display:block;font-size:14px;font-weight:900}.chip small{display:block;font-size:8px;color:#737d69;margin-top:7px}.chip.discarded{opacity:.23;transform:scale(.94) rotate(-1deg);text-decoration:line-through;pointer-events:none}.target{grid-column:1/-1;border:1px dashed #39422c;border-radius:18px;padding:12px 14px;text-align:center;color:#707a65;transition:.2s}.target span{display:block;font-size:8px;letter-spacing:.12em}.target strong{display:block;font-size:23px;margin-top:4px}.target.ready{border-style:solid;border-color:var(--lime);background:#17200d;color:var(--lime);box-shadow:0 0 32px rgba(217,255,87,.09)}.delta{border:1px solid #ffffff0d;background:#0d100b;border-radius:20px;padding:15px;margin-bottom:14px}.problem-reminder{border:1px solid #ffffff0c;border-radius:17px;padding:12px 14px;margin:3px 0 15px;color:#7d8772}.problem-reminder span{display:block;font-size:8px;letter-spacing:.12em}.problem-reminder strong{display:block;color:#d0d8c3;font-size:12px;line-height:1.5;margin-top:4px}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.typebtn{min-height:47px;border:1px solid #ffffff11;background:var(--panel);color:#bac3ae;border-radius:14px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.typebtn.active{border-color:var(--lime);background:#18210d;color:var(--lime)}.action-detail{margin-top:14px}.hold{position:relative;overflow:hidden;background:#171d11;color:#e4e9da;border:1px solid #364128}.hold:before{content:"";position:absolute;inset:0 auto 0 0;width:0;background:var(--lime);transition:width 1.05s linear}.hold.holding:before{width:100%}.hold span{position:relative;z-index:1}.hold.holding span{color:#0a0d06}.big-rate{text-align:center;margin:18px 0}.big-rate strong{display:block;font-size:88px;line-height:.9;color:var(--lime);letter-spacing:-.08em;font-variant-numeric:tabular-nums}.big-rate span{font-size:9px;color:#7d8772;letter-spacing:.12em}.before-after{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 20px}.ratebox{border:1px solid #ffffff0e;border-radius:17px;padding:12px;text-align:center}.ratebox span{display:block;font-size:8px;color:#727b68;letter-spacing:.1em}.ratebox strong{display:block;font-size:25px;margin-top:4px}.arrow{color:#59604f}.result{border:1px solid var(--line);background:#0d110a;border-radius:28px;padding:19px;margin:2px 0 14px;box-shadow:0 18px 60px #0005}.stamp{display:inline-block;border:1px solid var(--lime);border-radius:999px;padding:6px 9px;font-size:8px;font-weight:950;letter-spacing:.13em;color:var(--lime)}.result h2{font-size:38px;margin:15px 0 8px}.result .sub{font-size:11px;color:#7f8975;margin:0 0 16px}.result-row{padding:12px 0;border-top:1px solid #ffffff0b}.result-row span{display:block;font-size:8px;color:#6f7966;letter-spacing:.12em;margin-bottom:5px}.result-row strong{display:block;font-size:14px;line-height:1.55}.action-result{color:var(--lime)!important;font-size:19px!important}.change{display:flex;align-items:baseline;gap:6px;color:#c7d0bb}.change b{font-size:35px;color:var(--lime)}.launch{min-height:75svh;display:flex;flex-direction:column;justify-content:center;text-align:center}.launch .count{font-size:10px;color:var(--lime);letter-spacing:.16em;font-weight:950}.launch h2{font-size:42px;margin:14px 0}.launch .mission{border:1px solid var(--lime);border-radius:22px;padding:20px;font-size:20px;line-height:1.45;font-weight:950;background:#141b0d;color:#f1f5e9}.launch p{font-size:12px;line-height:1.7;color:#849078}.micro{font-size:9px;line-height:1.55;color:#77816c}.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);width:min(calc(100% - 30px),520px);background:#eef8d2;color:#111609;border-radius:15px;padding:12px 14px;text-align:center;font-size:11px;font-weight:900;z-index:50;box-shadow:0 16px 40px #0008;animation:toast 1.8s both}.hidden{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(7px)}}@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,8px)}10%,86%{opacity:1;transform:translate(-50%,0)}}@media(max-width:390px){.screen{padding-top:18px}.screen h1{font-size:43px}.screen h2{font-size:34px}.types{grid-template-columns:1fr 1fr}.compare-board{grid-template-columns:1fr 1fr}.problem-card{font-size:18px;padding:17px}.result h2{font-size:34px}}@media(max-height:700px){.screen{padding-top:12px}.lead{margin:11px 0 15px}.zoomfield{min-height:245px}.screen h1{font-size:39px}.screen h2{font-size:31px}.big-rate strong{font-size:68px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body><div id="app" class="app"></div>
<script>
(()=>{
'use strict';
const root=document.getElementById('app');
const STORE='hitobito-levelup-breakthrough-90-v1';
const comparisons=['同業の売上','SNSの成功談','年下の成長','他社のスピード'];
const actionTypes=[['調べる','例：解約理由を3件だけ確認する'],['1通送る','例：詳しい人に15分だけ相談を頼む'],['試す','例：最小版を1人にだけ見せる'],['捨てる','例：今週やらない施策を1つ決める'],['頼る','例：抱えている1タスクを渡す'],['数字を見る','例：直近7日の流入だけ確認する'],['立て直す','例：15分だけ離れて頭を空にする']];
const state={stage:'intro',problem:'',before:8,after:8,horizon:0,discarded:[],delta:'',actionType:'',nextAction:'',actionStarted:false,last:null};
let holdTimer=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function clamp(v){return Math.max(1,Math.min(10,Math.round(Number(v)||1)));}
function buzz(){try{navigator.vibrate?.(18)}catch{}}
function loadLast(){try{const raw=localStorage.getItem(STORE);if(raw){const x=JSON.parse(raw);if(x&&typeof x.nextAction==='string')state.last=x;}}catch{}}
function save(){const data={problem:state.problem.trim(),yesterdayDelta:state.delta.trim(),actionType:state.actionType,nextAction:state.nextAction.trim(),pressureBefore:clamp(state.before),pressureAfter:clamp(state.after),savedAt:new Date().toISOString()};try{localStorage.setItem(STORE,JSON.stringify(data));state.last=data;}catch{} return data;}
function progress(){return {intro:0,zoom:25,compare:50,action:75,rate:88,done:100}[state.stage]||0;}
function top(){const back=state.stage==='intro'?'<a class="navbtn" id="home-link" href="/" aria-label="LEVEL UPトップへ戻る">← LEVEL UP</a>':'<button class="navbtn" id="back-btn" type="button">← 戻る</button>';return `<header class="top">${back}<span class="toplabel">BREAKTHROUGH / 90 SEC</span></header>${state.stage==='intro'?'':`<div class="progress" aria-hidden="true"><i style="width:${progress()}%"></i></div>`}`;}
function shell(body){root.innerHTML=`<main class="shell">${top()}${body}</main>`;wireCommon();}
function wireCommon(){document.getElementById('back-btn')?.addEventListener('click',goBack);}
function goBack(){cancelHold();state.actionStarted=false;const prev={zoom:'intro',compare:'zoom',action:'compare',rate:'action',done:'rate'};if(prev[state.stage]){state.stage=prev[state.stage];render();buzz();}}
function cancelHold(){if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}document.getElementById('hold-btn')?.classList.remove('holding');}
function renderIntro(){shell(`<section class="screen center" data-stage="intro"><div class="step">八方塞がりのとき専用</div><h1>詰んだ気分を、<br>次の一手に戻す。</h1><p class="lead">問題を消すのではなく、90秒で視点を引き、比べる相手を戻し、いま動かせる一手だけを決めます。</p><div class="panel"><label class="label" for="problem">いま「もう無理かも」と感じていること</label><textarea class="textarea" id="problem" maxlength="120" placeholder="例：新しい企画が伸びない。何を試せばいいか分からない">${esc(state.problem)}</textarea><div class="pressure-head"><div><span class="label" style="margin:0">いまの詰まり感</span><span class="hint">直感でOK</span></div><strong id="before-num">${state.before}/10</strong></div><input class="range" id="before-range" type="range" min="1" max="10" value="${state.before}" aria-label="いまの詰まり感"><button class="btn primary" id="start-btn" type="button" ${state.problem.trim().length<2?'disabled':''}>90秒で整理する</button></div>${state.last?`<aside class="last"><span>前回の一手</span><strong>${esc(state.last.nextAction)}</strong></aside>`:''}</section>`);const p=document.getElementById('problem');const start=document.getElementById('start-btn');p.addEventListener('input',()=>{state.problem=p.value;start.disabled=state.problem.trim().length<2;});document.getElementById('before-range').addEventListener('input',e=>{state.before=Number(e.target.value);document.getElementById('before-num').textContent=`${state.before}/10`;});start.addEventListener('click',()=>{if(state.problem.trim().length<2)return;state.after=state.before;state.stage='zoom';render();buzz();});}
function horizonLabel(v){if(v===0)return'今日';if(v<=1)return'1年';if(v<=3)return'3年';if(v<=5)return'5年';return'10年';}
function renderZoom(){const scale=Math.max(.46,1-state.horizon*.055);shell(`<section class="screen" data-stage="zoom"><div class="step">01 / 引く</div><h2>10年の地図まで、引いて見る。</h2><p class="lead">目の前では巨大でも、人生全体と同じ大きさとは限りません。時間軸を右へ広げてください。</p><div class="zoomfield"><div class="horizon" id="horizon-label">${horizonLabel(state.horizon)}の視点</div><div class="problem-card" id="zoom-problem" style="transform:scale(${scale});opacity:${1-state.horizon*.035}">${esc(state.problem)}</div><div class="timeline"><span>今日</span><span>1年</span><span>3年</span><span>5年</span><span>10年</span></div><input class="range" id="horizon-range" type="range" min="0" max="10" value="${state.horizon}" aria-label="時間軸を10年まで広げる"></div><div class="insight"><span>10年後から見る問い</span><strong>これは人生の結論か。それとも途中の一局面か？</strong></div><button class="btn primary" id="zoom-next" type="button" ${state.horizon<8?'disabled':''}>一局面として扱う</button></section>`);const range=document.getElementById('horizon-range');const next=document.getElementById('zoom-next');range.addEventListener('input',e=>{state.horizon=Number(e.target.value);document.getElementById('horizon-label').textContent=`${horizonLabel(state.horizon)}の視点`;const s=Math.max(.46,1-state.horizon*.055);const c=document.getElementById('zoom-problem');c.style.transform=`scale(${s})`;c.style.opacity=String(1-state.horizon*.035);next.disabled=state.horizon<8;});next.addEventListener('click',()=>{state.horizon=10;state.stage='compare';render();buzz();});}
function renderCompare(){const all=state.discarded.length===comparisons.length;const chips=comparisons.map((item,i)=>{const gone=state.discarded.includes(item);return `<button class="chip ${gone?'discarded':''}" data-compare="${i}" type="button" ${gone?'disabled':''}><span>${esc(item)}</span><small>${gone?'比較対象から外した':'タップして外す'}</small></button>`}).join('');shell(`<section class="screen" data-stage="compare"><div class="step">02 / 戻す</div><h2>戦う相手を、昨日の自分に戻す。</h2><p class="lead">違う道を進むほど、他人の数字はノイズになります。比較対象を一つずつ外してください。</p><div class="compare-board">${chips}<div class="target ${all?'ready':''}"><span>比較対象</span><strong>${all?'昨日の自分':'？'}</strong></div></div>${all?`<div class="delta"><label class="label" for="delta">昨日より1mmだけ前に進んだこと</label><input class="textinput" id="delta" maxlength="90" value="${esc(state.delta)}" placeholder="例：原因の仮説を1つ捨てられた"><button class="btn ghost" id="delta-none" type="button" style="min-height:42px;margin-top:8px">まだ見つからない</button></div>`:''}<button class="btn primary" id="compare-next" type="button" ${!all||state.delta.trim().length<2?'disabled':''}>今日の一手へ</button></section>`);document.querySelectorAll('[data-compare]').forEach(btn=>btn.addEventListener('click',()=>{const item=comparisons[Number(btn.dataset.compare)];if(!state.discarded.includes(item))state.discarded.push(item);render();buzz();}));if(all){const delta=document.getElementById('delta');const next=document.getElementById('compare-next');delta.addEventListener('input',()=>{state.delta=delta.value;next.disabled=state.delta.trim().length<2;});document.getElementById('delta-none').addEventListener('click',()=>{state.delta='まだ見つからない。だから今日の一手を1mmにする';render();});}document.getElementById('compare-next').addEventListener('click',()=>{if(!all||state.delta.trim().length<2)return;state.stage='action';render();buzz();});}
function renderAction(){const types=actionTypes.map(([label],i)=>`<button class="typebtn ${state.actionType===label?'active':''}" data-type="${i}" type="button">${esc(label)}</button>`).join('');const selected=actionTypes.find(x=>x[0]===state.actionType);shell(`<section class="screen" data-stage="action"><div class="step">03 / 前提を変える</div><h2>「いずれ突破する」を、先に置く。</h2><p class="lead">自信を気分として待ちません。最終的には抜ける前提なら、次の15分で何をするかだけ決めます。</p><div class="problem-reminder"><span>いまの問題</span><strong>${esc(state.problem)}</strong></div><div class="types" role="group" aria-label="次の一手の種類">${types}</div>${selected?`<div class="action-detail"><label class="label" for="next-action">次の15分でやること</label><input class="textinput" id="next-action" maxlength="100" value="${esc(state.nextAction)}" placeholder="${esc(selected[1])}"></div>`:''}<span class="hint" style="margin:14px 0 8px">タッチでは長押しで決定。キーボードではEnter/Spaceで決定できます。</span><button class="btn hold" id="hold-btn" type="button" ${!state.actionType||state.nextAction.trim().length<2?'disabled':''}><span>1秒長押しして、この一手に決める</span></button></section>`);document.querySelectorAll('[data-type]').forEach(btn=>btn.addEventListener('click',()=>{state.actionType=actionTypes[Number(btn.dataset.type)][0];state.nextAction='';render();buzz();}));const input=document.getElementById('next-action');if(input){input.addEventListener('input',()=>{state.nextAction=input.value;document.getElementById('hold-btn').disabled=state.nextAction.trim().length<2;});}const hold=document.getElementById('hold-btn');function commit(){cancelHold();if(hold.disabled)return;state.stage='rate';render();buzz();}hold.addEventListener('pointerdown',e=>{if(hold.disabled)return;e.preventDefault();cancelHold();hold.classList.add('holding');holdTimer=setTimeout(commit,1050);});['pointerup','pointercancel','pointerleave'].forEach(name=>hold.addEventListener(name,cancelHold));hold.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!hold.disabled){e.preventDefault();commit();}});}
function renderRate(){shell(`<section class="screen center" data-stage="rate"><div class="step">04 / 測る</div><h2>いま、詰まり感はいくつ？</h2><p class="lead">問題が解決していなくても大丈夫です。「次に何をするか」が見えた分だけ、数字をつけ直してください。</p><div class="big-rate"><strong id="after-num">${state.after}</strong><span>STUCK / 10</span></div><input class="range" id="after-range" type="range" min="1" max="10" value="${state.after}" aria-label="整理した後の詰まり感"><div class="before-after"><div class="ratebox"><span>BEFORE</span><strong>${state.before}</strong></div><div class="arrow">→</div><div class="ratebox"><span>NOW</span><strong id="after-box">${state.after}</strong></div></div><button class="btn primary" id="finish-btn" type="button">結果を見る</button></section>`);document.getElementById('after-range').addEventListener('input',e=>{state.after=Number(e.target.value);document.getElementById('after-num').textContent=state.after;document.getElementById('after-box').textContent=state.after;});document.getElementById('finish-btn').addEventListener('click',()=>{save();state.stage='done';render();buzz();});}
function renderDone(){if(state.actionStarted){shell(`<section class="launch" data-stage="launch"><div class="count">15 MINUTE LAUNCH</div><h2>ここからは、考えない。</h2><div class="mission">${esc(state.nextAction)}</div><p>この画面を閉じて、15分だけこれをやる。<br>次の判断は、そのあとで。</p><div class="actions"><button class="btn ghost" id="launch-back" type="button">結果カードに戻る</button><a class="navbtn" href="/">LEVEL UPに戻る</a></div></section>`);document.getElementById('launch-back').addEventListener('click',()=>{state.actionStarted=false;render();});return;}const change=clamp(state.before)-clamp(state.after);shell(`<section class="screen" data-stage="done"><div class="step">BREAKTHROUGH CARD</div><div class="result"><span class="stamp">NEXT MOVE FOUND</span><h2>次の一手は、もうある。</h2><p class="sub">問題を全部解くのではなく、動ける大きさまで戻しました。</p><div class="result-row"><span>10年視点</span><strong>これは人生の結論ではなく、途中の一局面として扱う。</strong></div><div class="result-row"><span>比較対象</span><strong>他人ではなく、昨日の自分。</strong></div><div class="result-row"><span>昨日より1mm</span><strong>${esc(state.delta)}</strong></div><div class="result-row"><span>NEXT 15 MIN</span><strong class="action-result">${esc(state.nextAction)}</strong></div><div class="result-row"><span>詰まり感の変化</span><div class="change"><b>${change>0?'−'+change:change===0?'±0':'＋'+Math.abs(change)}</b><span>${state.before} → ${state.after}</span></div></div></div><div class="actions"><button class="btn primary" id="launch-btn" type="button">15分だけ、やってくる</button><button class="btn ghost" id="reset-btn" type="button">別の問題でやり直す</button><a class="navbtn" style="text-align:center" href="/">LEVEL UPに戻る</a></div></section>`);document.getElementById('launch-btn').addEventListener('click',()=>{state.actionStarted=true;render();buzz();});document.getElementById('reset-btn').addEventListener('click',()=>{Object.assign(state,{stage:'intro',problem:'',before:8,after:8,horizon:0,discarded:[],delta:'',actionType:'',nextAction:'',actionStarted:false});render();});}
function render(){cancelHold();if(state.stage==='intro')return renderIntro();if(state.stage==='zoom')return renderZoom();if(state.stage==='compare')return renderCompare();if(state.stage==='action')return renderAction();if(state.stage==='rate')return renderRate();return renderDone();}
loadLast();render();
})();
</script>
</body>
