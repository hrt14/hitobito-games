{id:'think',name:'構造を考える',icon:'◇',tactics:[['分解する','大きな問題を、小さな変数・工程・原因候補に分ける'],['比較する','良い例・悪い例・前後・競合との差を見る'],['原因を掘る','なぜ？を重ね、症状ではなく原因候補へ近づく'],['逆から考える','ゴール・失敗条件・最後の工程から逆算する']]},
{id:'borrow',name:'知恵を借りる',icon:'↗',tactics:[['AIに投げる','論点整理・仮説・選択肢出しを外部の頭に任せる'],['専門家に聞く','法務・技術など、専門性が必要な所だけ上げる'],['経験者を探す','似た状況を越えた人の再現可能なやり方を借りる'],['他業界を見る','別の世界で解かれている同型問題を持ってくる']]},
{id:'try',name:'小さく試す',icon:'▶',tactics:[['5分だけ試す','考え続ける前に、最小サイズで動いて情報を取る'],['手作業でやる','仕組み化する前に、人力で一度最後まで通す'],['試作品を作る','完成品ではなく、判断に必要な部分だけ作る'],['A/Bで比べる','迷う2案を小さく同時に試して結果で決める']]},

const SCENARIOS=[
{q:'売上が急に落ちた。でも、どこから手を付ければいいか分からない。',goal:'原因を絞って最初の一手を決めたい',best:['observe-2','think-0','think-1','try-0'],examples:{'observe-2':'流入・CVR・客単価を前週と比較する。','think-0':'売上＝アクセス×CVR×客単価に分ける。','think-1':'落ちた日・商品・流入元を正常時と比べる。','try-0':'一番怪しい1点だけ5分で確認して仮説を更新する。'}},
{q:'新しい仕事を頼まれた。できなくはないが、今のまま全部受けると破綻しそう。',goal:'引き受け方を決めたい',best:['change-0','release-0','release-2','change-3'],examples:{'change-0':'「成果物の一部だけ」など範囲を小さくする。','release-0':'実務部分を相手側や別担当へ戻す。','release-2':'目的に直結しない作業は契約から外す。','change-3':'“全部やる”ではなく“判断に必要な支援をする”へ目的を言い直す。'}},
{q:'サイト改善案が出ない。画面を見ても、もう何を直せばいいのか分からない。',goal:'改善候補を増やしたい',best:['observe-3','observe-0','borrow-2','borrow-3'],examples:{'observe-3':'初見ユーザーの操作を観察し、迷う瞬間を拾う。','observe-0':'購入者や離脱者に「どこで迷った？」と聞く。','borrow-2':'伸ばした経験がある運営者のチェック順を聞く。','borrow-3':'ホテル予約やSaaSなど別業界の導線を参考にする。'}},
{q:'資料作りに時間がかかりすぎる。毎回ゼロから考えている感じがする。',goal:'次回から速くしたい',best:['release-1','try-1','change-1','think-0'],examples:{'release-1':'構成・集計・図表生成をテンプレや自動処理にする。','try-1':'一度、最短の手作業フローを最後まで通してボトルネックを特定する。','change-1':'デザインより先に、結論→根拠→数字の順で骨格を固定する。','think-0':'調査・判断・作図・整形に工程分解する。'}},
{q:'不具合が起きているが、再現したりしなかったりする。原因が見えない。',goal:'原因候補を狭めたい',best:['observe-2','observe-3','think-1','try-3'],examples:{'observe-2':'発生時刻・端末・操作順のログを揃える。','observe-3':'再現時の操作を最初から録画して差を見る。','think-1':'起きる時／起きない時の条件を比較する。','try-3':'1条件ずつ変えて再現率を比べる。'}},
{q:'新商品のアイデアはある。でも本当に欲しい人がいるか分からない。',goal:'大きく作る前に確かめたい',best:['observe-0','try-2','try-1','change-0'],examples:{'observe-0':'想定顧客に「今どう解決している？」を聞く。','try-2':'完成品ではなく説明ページやデモだけ作る。','try-1':'最初の数人には人力でサービスを提供する。','change-0':'対象を1種類の顧客・1用途に絞って検証する。'}},
{q:'会議で難しい課題を渡された。頭の中が散らかって、考えが進まない。',goal:'考え始められる状態にしたい',best:['think-0','borrow-0','change-0','try-0'],examples:{'think-0':'「分かっている／分からない／決めること」に分ける。','borrow-0':'AIに論点と確認事項だけ整理させる。','change-0':'今日決める1点だけに範囲を縮める。','try-0':'5分で仮の答えを1本作って穴を見つける。'}},
{q:'広告の数字が悪い。とりあえずクリエイティブを変えたくなる。',goal:'思いつきではなく打ち手を選びたい',best:['think-0','observe-2','think-1','change-3'],examples:{'think-0':'表示→クリック→遷移→購入のどこが落ちているか分ける。','observe-2':'媒体・商品・配信面ごとの数字を見る。','think-1':'良かった期間や広告セットとの差分を見る。','change-3':'「広告を直す」でなく「粗利ある購入を増やす」に目的を戻す。'}},
{q:'調べても答えが見つからない。検索を続けるほど時間だけが減っていく。',goal:'別の進み方へ切り替えたい',best:['observe-0','borrow-1','try-1','release-3'],examples:{'observe-0':'知っていそうな人に「検索語ではなく答え」を聞く。','borrow-1':'必要箇所だけ専門家へエスカレーションする。','try-1':'仮定を置いて手作業で進め、必要な情報を逆に特定する。','release-3':'今なくても進められる情報なら保留条件を決める。'}},
{q:'やることが多すぎて、全部が中途半端になっている。',goal:'今日の前進を作りたい',best:['change-0','release-2','release-0','change-3'],examples:{'change-0':'今日終える1成果物まで範囲を縮める。','release-2':'今日やらなくても壊れない仕事を消す。','release-0':'自分以外でもできるものを渡す。','change-3':'“全部進める”を“最重要1つを終える”に言い直す。'}},
{q:'チームの人が期待どおりに動いてくれない。説明を増やしても改善しない。',goal:'人を責めずに状況を変えたい',best:['observe-0','observe-3','change-3','release-1'],examples:{'observe-0':'本人に「どこが曖昧／やりにくい？」と聞く。','observe-3':'実際の作業手順を横で見て詰まりを探す。','change-3':'“言うことを聞かせる”でなく“望む結果が自然に出る”へ目的を変える。','release-1':'チェックリストやテンプレで期待行動を仕組みにする。'}},

function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1200)}
function render(){clearInterval(state.timer);app.innerHTML=top()+`<section class="screen">${state.screen==='home'?home():state.screen==='play'?play():state.screen==='reveal'?reveal():state.screen==='result'?result():state.screen==='library'?library():practice()}</section>`;bind()}
function home(){let best=Number(localStorage.getItem('uchite-best')||0);return `<div class="hero"><div><div class="eyebrow">WHEN YOU ARE STUCK, OPEN ANOTHER DRAWER.</div><h1>答えを探すな。<br><em>棚を開けろ。</em></h1><p class="hero-copy">困ったときに強い人は、最初から正解を知っているわけじゃない。<b>「聞く」「調べる」「分ける」「試す」「変える」「手放す」</b>という打ち手の棚をたくさん持っている。</p><div class="principle"><span>情報を取る</span><span>構造を考える</span><span>知恵を借りる</span><span>小さく試す</span><span>条件を変える</span><span>抱えない</span></div></div><div><div class="eyebrow">BEST ${best} / 100</div><div class="cta-row"><button class="btn primary" data-action="start">6問トレーニング</button><button class="btn secondary" data-action="library">打ち手24</button></div><button class="btn secondary" style="width:100%;margin-top:8px" data-action="practice">実際の困りごとで使う</button></div></div>`}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function prepare(){state.selected=[];state.seconds=15;state.current=SCENARIOS[(state.round*2+Math.floor(Math.random()*3))%SCENARIOS.length];let best=state.current.best.map(id=>TACTICS.find(t=>t.id===id)).filter(Boolean);let rest=shuffle(TACTICS.filter(t=>!state.current.best.includes(t.id)));state.current.options=shuffle([...best.slice(0,3),...rest.slice(0,3)]);}
function play(){if(!state.current)prepare();let s=state.current;return `<div class="card"><div class="roundline"><span>ROUND ${state.round+1} / 6</span><b class="timer" id="timer">${state.seconds}</b></div><div class="situation"><small>困った。</small><h2>${esc(s.q)}</h2><p>目標：${esc(s.goal)}</p></div><div class="mission"><b>違う方向から3つ選ぶ</b><span>正解当てではなく<br>選択肢を増やす練習</span></div><div class="choices">${s.options.map(t=>`<button class="choice ${state.selected.includes(t.id)?'selected':''}" data-choice="${t.id}"><span class="check">${state.selected.includes(t.id)?'✓':''}</span><span class="family">${esc(t.familyName)}</span><strong>${esc(t.name)}</strong><small>${esc(t.desc)}</small></button>`).join('')}</div><div class="commit"><button class="btn primary" data-action="commit" ${state.selected.length<3?'disabled style="opacity:.45"':''}>この3方向で開く</button><button class="btn secondary skip" data-action="commit">見る</button></div></div>`}
function reveal(){let s=state.current;let ids=[...new Set([...state.selected,...s.best])].slice(0,4);let diversity=new Set(state.selected.map(id=>TACTICS.find(t=>t.id===id)?.family)).size;let gained=Math.min(17,6+diversity*3+(state.selected.length===3?2:0));return `<div class="card"><div class="reveal"><div class="reveal-head"><small>1つの問題に、入口は何本もある。</small><h2>${esc(s.goal)}</h2><p>あなたが選んだ棚だけで終わらず、別方向の打ち手も一緒に開く。</p></div><div class="ideas">${ids.map(id=>{let t=TACTICS.find(x=>x.id===id);let ex=s.examples[id]||`${t.desc}。この状況なら何を最小単位でできるか考える。`;return `<div class="idea ${state.selected.includes(id)?'mine':''}"><div class="idea-top"><b>${esc(t.name)}</b><span>${esc(t.familyName)}</span></div><p>${esc(ex)}</p></div>`}).join('')}</div><div class="takeaway"><b>脳内ショートカット</b>詰まったら「もっと考える」ではなく、<strong>まだ開けていない棚はどれ？</strong> と聞く。</div><button class="btn primary next" data-action="next">次の困ったへ　+${gained}</button></div></div>`}
function result(){let total=Object.values(state.familyCounts).reduce((a,b)=>a+b,0);let score=Math.min(100,Math.round(state.score));localStorage.setItem('uchite-best',String(Math.max(score,Number(localStorage.getItem('uchite-best')||0))));let weak=[...FAMILIES].sort((a,b)=>state.familyCounts[a.id]-state.familyCounts[b.id])[0];return `<div class="result"><div class="eyebrow">TRAINING COMPLETE</div><h1>打ち手の棚が<br><span>${state.seen.size}個</span> 開いた。</h1><p>正解を1本当てるより、別方向の入口をすぐ出せる方が、現実の困りごとには強い。</p><div class="scorebig">${score}<small> / 100</small></div><div class="shelves">${FAMILIES.map(f=>{let v=total?Math.round(state.familyCounts[f.id]/Math.max(1,total)*100):0;return `<div class="shelfrow"><span>${f.name}</span><div class="track"><i style="width:${Math.min(100,v*3)}%"></i></div><b>${state.familyCounts[f.id]}</b></div>`}).join('')}</div><div class="tip"><b>NEXT SHELF</b>次は「${weak.name}」を意識して使うと、いつもの考え方から外れやすい。</div><div class="result-actions"><button class="btn primary" data-action="restart">もう6問</button><button class="btn secondary" data-action="practice">実戦で使う</button></div><button class="btn secondary" style="width:100%;margin-top:8px" data-action="library">打ち手24を見る</button></div>`}
function library(){return `<div class="library"><div class="library-head"><div><div class="eyebrow">TACTIC LIBRARY</div><h1>打ち手24</h1><p>困ったら全部思い出す必要はない。まず6つの棚を思い出す。</p></div><button class="close" data-action="home">×</button></div>${FAMILIES.map(f=>`<div class="family-block"><div class="family-title"><b>${f.icon} ${f.name}</b><span>4 tactics</span></div><div class="tactic-grid">${f.tactics.map(t=>`<div class="tactic"><b>${esc(t[0])}</b><p>${esc(t[1])}</p></div>`).join('')}</div></div>`).join('')}</div>`}
function practice(){let saved=localStorage.getItem('uchite-problem')||'';let picks=state.practicePicks||shuffle(TACTICS).slice(0,6);state.practicePicks=picks;return `<div class="practice"><div class="practice-head"><div><div class="eyebrow">USE IT NOW</div><h1>実際の困りごと</h1><p>問題を書いたら、違う棚を順に当てる。</p></div><button class="close" data-action="home">×</button></div><div><div class="practice-label">いま何に困ってる？</div><textarea id="problem" placeholder="例：会議のあと、次に何をすればいいか分からない">${esc(saved)}</textarea></div><div class="practice-label">この6方向を1回ずつ当ててみる</div><div class="roulette">${picks.map((t,i)=>`<button class="prompt-card ${i===0?'active':''}" data-prompt="${i}"><b>${esc(t.name)} <small>— ${esc(t.familyName)}</small></b><p>${esc(t.desc)}。この困りごとに当てるなら、具体的に何ができる？</p></button>`).join('')}</div><div class="practice-actions"><button class="btn secondary" data-action="reroll">別の6方向</button><button class="btn primary" data-action="saveProblem">保存して考える</button></div></div>`}
function bind(){app.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>act(el.dataset.action));app.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{let id=el.dataset.choice;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<3)state.selected.push(id);else return showToast('3つ選んだ。別方向を意識しよう');render()});app.querySelectorAll('[data-prompt]').forEach(el=>el.onclick=()=>{app.querySelectorAll('[data-prompt]').forEach(x=>x.classList.remove('active'));el.classList.add('active')});if(state.screen==='play'){state.timer=setInterval(()=>{state.seconds--;let e=document.getElementById('timer');if(e)e.textContent=state.seconds;if(state.seconds<=0)act('commit')},1000)}}
function act(a){if(a==='start'||a==='restart'){state.screen='play';state.round=0;state.score=0;state.seen=new Set();state.familyCounts=Object.fromEntries(FAMILIES.map(f=>[f.id,0]));state.current=null;prepare();render()}else if(a==='library'){state.screen='library';render()}else if(a==='home'){state.screen='home';state.current=null;render()}else if(a==='practice'){state.screen='practice';state.practicePicks=shuffle(TACTICS).slice(0,6);render()}else if(a==='reroll'){state.practicePicks=shuffle(TACTICS).slice(0,6);render()}else if(a==='saveProblem'){let v=document.getElementById('problem')?.value.trim()||'';localStorage.setItem('uchite-problem',v);showToast(v?'保存した。6方向を順に当てよう':'困りごとを書いてみよう')}else if(a==='commit'){clearInterval(state.timer);state.selected.forEach(id=>{let t=TACTICS.find(x=>x.id===id);if(t){state.seen.add(id);state.familyCounts[t.family]++}});let diversity=new Set(state.selected.map(id=>TACTICS.find(t=>t.id===id)?.family)).size;state.score+=Math.min(17,6+diversity*3+(state.selected.length===3?2:0));state.screen='reveal';render()}else if(a==='next'){state.current.best.forEach(id=>state.seen.add(id));state.round++;if(state.round>=6){state.screen='result';render()}else{state.current=null;prepare();state.screen='play';render()}}}
render();
})();
</script>
</body>
</html>
