const FAMILIES=[

{id:'think',name:'構造を考える',icon:'◇',tactics:[['分解する','大きな問題を、小さな変数・工程・原因候補に分ける','この問題を3つの要素に分けるなら？'],['比較する','良い例・悪い例・前後・競合との差を見る','何と何を比べれば差分が見える？'],['原因を掘る','なぜ？を重ね、症状ではなく原因候補へ近づく','表面の症状ではなく、原因候補を3つ挙げるなら？'],['逆から考える','ゴール・失敗条件・最後の工程から逆算する','最後にどうなれば成功？ その1つ前は？']]},
{id:'borrow',name:'知恵を借りる',icon:'↗',tactics:[['AIに投げる','論点整理・仮説・選択肢出しを外部の頭に任せる','AIに何を整理・列挙させれば、自分は判断だけできる？'],['専門家に聞く','法務・技術など、専門性が必要な所だけ上げる','自分で抱えず、誰の専門領域へ上げる？'],['経験者を探す','似た状況を越えた人の再現可能なやり方を借りる','同じ問題を越えた人は誰？ 何を聞く？'],['他業界を見る','別の世界で解かれている同型問題を持ってくる','別業界なら、この問題をどう解いている？']]},
{id:'try',name:'小さく試す',icon:'▶',tactics:[['5分だけ試す','考え続ける前に、最小サイズで動いて情報を取る','5分だけやるなら何を試す？'],['手作業でやる','仕組み化する前に、人力で一度最後まで通す','自動化せず1回だけ人力で通すなら？'],['試作品を作る','完成品ではなく、判断に必要な部分だけ作る','判断に必要な最小デモは何？'],['A/Bで比べる','迷う2案を小さく同時に試して結果で決める','迷っている2案をどう小さく比べる？']]},
{id:'change',name:'条件を変える',icon:'↔',tactics:[['範囲を縮める','全部ではなく、対象・期間・成果物を小さくする','対象を1人・1商品・1時間に縮めるなら？'],['順番を変える','重い工程より、判断材料が増える工程を先にする','先にやると後工程がラクになることは？'],['制約を置く','時間・予算・回数などを決め、選択肢を絞る','あえて制約を1つ置くなら何？'],['目的を言い直す','手段ではなく、本当に得たい結果へ戻す','「○○する」ではなく「何を良くしたい」に言い直すと？']]},

];
const TACTICS=FAMILIES.flatMap(f=>f.tactics.map((t,i)=>({id:`${f.id}-${i}`,family:f.id,familyName:f.name,name:t[0],desc:t[1],prompt:t[2]})));
const SCENARIOS=[
{q:'売上が急に落ちた。でも、どこから手を付ければいいか分からない。',goal:'原因を絞って最初の一手を決めたい',best:['observe-2','think-0','think-1','try-0'],examples:{'observe-2':'流入・CVR・客単価を前週と比較する。','think-0':'売上＝アクセス×CVR×客単価に分ける。','think-1':'落ちた日・商品・流入元を正常時と比べる。','try-0':'一番怪しい1点だけ5分で確認して仮説を更新する。'}},
{q:'新しい仕事を頼まれた。できなくはないが、今のまま全部受けると破綻しそう。',goal:'引き受け方を決めたい',best:['change-0','release-0','release-2','change-3'],examples:{'change-0':'「成果物の一部だけ」など範囲を小さくする。','release-0':'実務部分を相手側や別担当へ戻す。','release-2':'目的に直結しない作業は契約から外す。','change-3':'“全部やる”ではなく“判断に必要な支援をする”へ目的を言い直す。'}},
{q:'サイト改善案が出ない。画面を見ても、もう何を直せばいいのか分からない。',goal:'改善候補を増やしたい',best:['observe-3','observe-0','borrow-2','borrow-3'],examples:{'observe-3':'初見ユーザーの操作を観察し、迷う瞬間を拾う。','observe-0':'購入者や離脱者に「どこで迷った？」と聞く。','borrow-2':'伸ばした経験がある運営者のチェック順を聞く。','borrow-3':'ホテル予約やSaaSなど別業界の導線を参考にする。'}},
{q:'資料作りに時間がかかりすぎる。毎回ゼロから考えている感じがする。',goal:'次回から速くしたい',best:['release-1','try-1','change-1','think-0'],examples:{'release-1':'構成・集計・図表生成をテンプレや自動処理にする。','try-1':'一度、最短の手作業フローを最後まで通してボトルネックを特定する。','change-1':'デザインより先に、結論→根拠→数字の順で骨格を固定する。','think-0':'調査・判断・作図・整形に工程分解する。'}},
{q:'不具合が起きているが、再現したりしなかったりする。原因が見えない。',goal:'原因候補を狭めたい',best:['observe-2','observe-3','think-1','try-3'],examples:{'observe-2':'発生時刻・端末・操作順のログを揃える。','observe-3':'再現時の操作を最初から録画して差を見る。','think-1':'起きる時／起きない時の条件を比較する。','try-3':'1条件ずつ変えて再現率を比べる。'}},
{q:'新商品のアイデアはある。でも本当に欲しい人がいるか分からない。',goal:'大きく作る前に確かめたい',best:['observe-0','try-2','try-1','change-0'],examples:{'observe-0':'想定顧客に「今どう解決している？」を聞く。','try-2':'完成品ではなく説明ページやデモだけ作る。','try-1':'最初の数人には人力でサービスを提供する。','change-0':'対象を1種類の顧客・1用途に絞って検証する。'}},
{q:'会議で難しい課題を渡された。頭の中が散らかって、考えが進まない。',goal:'考え始められる状態にしたい',best:['think-0','borrow-0','change-0','try-0'],examples:{'think-0':'「分かっている／分からない／決めること」に分ける。','borrow-0':'AIに論点と確認事項だけ整理させる。','change-0':'今日決める1点だけに範囲を縮める。','try-0':'5分で仮の答えを1本作って穴を見つける。'}},
{q:'広告の数字が悪い。とりあえずクリエイティブを変えたくなる。',goal:'思いつきではなく打ち手を選びたい',best:['think-0','observe-2','think-1','change-3'],examples:{'think-0':'表示→クリック→遷移→購入のどこが落ちているか分ける。','observe-2':'媒体・商品・配信面ごとの数字を見る。','think-1':'良かった期間や広告セットとの差分を見る。','change-3':'「広告を直す」でなく「粗利ある購入を増やす」に目的を戻す。'}},
{q:'調べても答えが見つからない。検索を続けるほど時間だけが減っていく。',goal:'別の進み方へ切り替えたい',best:['observe-0','borrow-1','try-1','release-3'],examples:{'observe-0':'知っていそうな人に「検索語ではなく答え」を聞く。','borrow-1':'必要箇所だけ専門家へエスカレーションする。','try-1':'仮定を置いて手作業で進め、必要な情報を逆に特定する。','release-3':'今なくても進められる情報なら保留条件を決める。'}},
{q:'やることが多すぎて、全部が中途半端になっている。',goal:'今日の前進を作りたい',best:['change-0','release-2','release-0','change-3'],examples:{'change-0':'今日終える1成果物まで範囲を縮める。','release-2':'今日やらなくても壊れない仕事を消す。','release-0':'自分以外でもできるものを渡す。','change-3':'“全部進める”を“最重要1つを終える”に言い直す。'}},
{q:'チームの人が期待どおりに動いてくれない。説明を増やしても改善しない。',goal:'人を責めずに状況を変えたい',best:['observe-0','observe-3','change-3','release-1'],examples:{'observe-0':'本人に「どこが曖昧／やりにくい？」と聞く。','observe-3':'実際の作業手順を横で見て詰まりを探す。','change-3':'“言うことを聞かせる”でなく“望む結果が自然に出る”へ目的を変える。','release-1':'チェックリストやテンプレで期待行動を仕組みにする。'}},
{q:'新しい施策をやりたいが、失敗したときの影響が怖くて決められない。',goal:'安全に前へ進みたい',best:['try-2','change-0','try-3','release-3'],examples:{'try-2':'本番全体ではなくテスト版を作る。','change-0':'対象を5%や1商品だけにする。','try-3':'現状維持群とテスト群を分けて比較する。','release-3':'撤退条件を先に決め、判断を未来へ委ねる。'}}
];
const state={screen:'home',round:0,selected:[],seen:new Set(),familyCounts:Object.fromEntries(FAMILIES.map(f=>[f.id,0])),seconds:15,timer:null,current:null,practicePicks:null,practiceSelected:null,practiceProblem:'',practiceAction:''};
const app=document.getElementById('app');
const toast=document.getElementById('toast');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function validateData(){if(FAMILIES.length!==6)throw new Error('UCHITE: 6 shelves required');if(TACTICS.length!==24)throw new Error('UCHITE: 24 tactics required');for(const s of SCENARIOS){for(const id of s.best){if(!TACTICS.some(t=>t.id===id))throw new Error(`UCHITE: unknown tactic ${id}`)}}}
function onePerFamily(){return FAMILIES.map(f=>{const candidates=TACTICS.filter(t=>t.family===f.id);return candidates[Math.floor(Math.random()*candidates.length)]})}
function top(){const done=state.round+(state.screen==='reveal'?1:0);const p=state.screen==='play'||state.screen==='reveal'?Math.round(done/6*100):state.screen==='result'?100:0;return `<div class="top"><a class="home" href="/" aria-label="LEVEL UPトップへ">⌂</a><div class="brand"><b>打ち手を増やせ。</b><span>LEVEL UP / OPTION TRAINING</span></div><div class="stat"><small>OPENED TACTICS</small>${state.seen.size}/24</div></div><div class="progress"><i style="width:${p}%"></i></div>`}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1400)}
function render(){clearInterval(state.timer);app.innerHTML=top()+`<section class="screen">${state.screen==='home'?home():state.screen==='play'?play():state.screen==='reveal'?reveal():state.screen==='result'?result():state.screen==='library'?library():state.screen==='practice'?practice():state.screen==='practiceAction'?practiceAction():practiceDone()}</section>`;bind()}
function home(){let best=Number(localStorage.getItem('uchite-best')||0);return `<div class="hero"><div><div class="eyebrow">WHEN YOU ARE STUCK, OPEN ANOTHER DRAWER.</div><h1>答えを探すな。<br><em>棚を開けろ。</em></h1><p class="hero-copy">困ったときに強い人は、最初から正解を知っているわけじゃない。<b>「聞く」「調べる」「分ける」「試す」「変える」「手放す」</b>という打ち手の棚をたくさん持っている。</p><div class="principle"><span>情報を取る</span><span>構造を考える</span><span>知恵を借りる</span><span>小さく試す</span><span>条件を変える</span><span>抱えない</span></div></div><div><div class="eyebrow">BEST ${best} / 100</div><div class="cta-row"><button class="btn primary" data-action="start">6問トレーニング</button><button class="btn secondary" data-action="library">打ち手24</button></div><button class="btn secondary" style="width:100%;margin-top:8px" data-action="practice">実際の困りごとで使う</button></div></div>`}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function prepare(){state.selected=[];state.seconds=15;state.current=SCENARIOS[(state.round*2+Math.floor(Math.random()*3))%SCENARIOS.length];const byFamily=FAMILIES.map(f=>{const bestIds=state.current.best.filter(id=>id.startsWith(f.id+'-'));const chosenId=bestIds.length&&Math.random()<.7?bestIds[Math.floor(Math.random()*bestIds.length)]:null;return chosenId?TACTICS.find(t=>t.id===chosenId):shuffle(TACTICS.filter(t=>t.family===f.id))[0]});state.current.options=shuffle(byFamily)}
function play(){if(!state.current)prepare();let s=state.current;return `<div class="card"><div class="roundline"><span>ROUND ${state.round+1} / 6</span><b class="timer" id="timer">${state.seconds}</b></div><div class="situation"><small>困った。</small><h2>${esc(s.q)}</h2><p>目標：${esc(s.goal)}</p></div><div class="mission"><b>6つの棚から3つ選ぶ</b><span>正解当てではなく<br>入口を増やす練習</span></div><div class="choices">${s.options.map(t=>`<button class="choice ${state.selected.includes(t.id)?'selected':''}" data-choice="${t.id}" aria-pressed="${state.selected.includes(t.id)}"><span class="check">${state.selected.includes(t.id)?'✓':''}</span><span class="family">${esc(t.familyName)}</span><strong>${esc(t.name)}</strong><small>${esc(t.desc)}</small></button>`).join('')}</div><div class="commit"><button class="btn primary" data-action="commit" ${state.selected.length<3?'disabled':''}>この3方向で開く</button><button class="btn secondary skip" data-action="peek">見る</button></div></div>`}
function revealIds(){const s=state.current;const selectedFamilies=new Set(state.selected.map(id=>TACTICS.find(t=>t.id===id)?.family));const blind=s.best.find(id=>{const t=TACTICS.find(x=>x.id===id);return t&&!selectedFamilies.has(t.family)})||s.best.find(id=>!state.selected.includes(id));return [...new Set([...state.selected,blind].filter(Boolean))].slice(0,4)}
function reveal(){let s=state.current;let ids=revealIds();let gain=state.selected.length===3?15:0;let note=state.selected.length===3?'選んだ3方向に、見落としやすい別棚を1つ足した。':state.selected.length?'選んだ方向に、別棚の打ち手を足した。':'まず答えを見る回でもOK。次は3つの棚を自分で開こう。';return `<div class="card"><div class="reveal"><div class="reveal-head"><small>1つの問題に、入口は何本もある。</small><h2>${esc(s.goal)}</h2><p>${note}</p></div><div class="ideas">${ids.map(id=>{let t=TACTICS.find(x=>x.id===id);let ex=s.examples[id]||`${t.desc}。この状況なら「${t.prompt}」`;return `<div class="idea ${state.selected.includes(id)?'mine':''}"><div class="idea-top"><b>${esc(t.name)}</b><span>${esc(t.familyName)}</span></div><p>${esc(ex)}</p></div>`}).join('')}</div><div class="takeaway"><b>脳内ショートカット</b>詰まったら「もっと考える」ではなく、<strong>まだ開けていない棚はどれ？</strong> と聞く。</div><button class="btn primary next" data-action="next">次の困ったへ${gain?`　+${gain}`:''}</button></div></div>`}
function calcScore(){const touched=FAMILIES.filter(f=>state.familyCounts[f.id]>0).length;const selections=Object.values(state.familyCounts).reduce((a,b)=>a+b,0);const balanced=FAMILIES.every(f=>state.familyCounts[f.id]>=2)?10:0;return Math.min(100,touched*12+Math.min(18,selections)+balanced)}
function result(){let score=calcScore();localStorage.setItem('uchite-best',String(Math.max(score,Number(localStorage.getItem('uchite-best')||0))));let weak=[...FAMILIES].sort((a,b)=>state.familyCounts[a.id]-state.familyCounts[b.id])[0];let max=Math.max(1,...Object.values(state.familyCounts));return `<div class="result"><div class="eyebrow">TRAINING COMPLETE</div><h1>24の打ち手のうち<br><span>${state.seen.size}個</span> を開いた。</h1><p>このスコアは「正解率」ではなく、6つの棚をどれだけ広く実際に使ったかを見る展開力スコア。</p><div class="scorebig">${score}<small> / 100</small></div><div class="shelves">${FAMILIES.map(f=>`<div class="shelfrow"><span>${f.name}</span><div class="track"><i style="width:${Math.round(state.familyCounts[f.id]/max*100)}%"></i></div><b>${state.familyCounts[f.id]}</b></div>`).join('')}</div><div class="tip"><b>NEXT SHELF</b>次は「${weak.name}」を意識して使うと、いつもの思考ルートから外れやすい。</div><div class="result-actions"><button class="btn primary" data-action="restart">もう6問</button><button class="btn secondary" data-action="practice">実戦で使う</button></div><button class="btn secondary" style="width:100%;margin-top:8px" data-action="library">打ち手24を見る</button></div>`}
function library(){return `<div class="library"><div class="library-head"><div><div class="eyebrow">TACTIC LIBRARY</div><h1>打ち手24</h1><p>全部を暗記しなくていい。まず6つの棚を脳内に置く。</p></div><button class="close" data-action="home" aria-label="閉じる">×</button></div>${FAMILIES.map(f=>`<div class="family-block"><div class="family-title"><b>${f.icon} ${f.name}</b><span>4 tactics</span></div><div class="tactic-grid">${f.tactics.map(t=>`<div class="tactic"><b>${esc(t[0])}</b><p>${esc(t[1])}</p></div>`).join('')}</div></div>`).join('')}</div>`}
function practice(){if(!state.practicePicks)state.practicePicks=onePerFamily();let problem=state.practiceProblem||localStorage.getItem('uchite-problem')||'';return `<div class="practice"><div class="practice-head"><div><div class="eyebrow">USE IT NOW</div><h1>実際の困りごと</h1><p>6つの棚を1回ずつ当て、使えそうな方向を1つ選ぶ。</p></div><button class="close" data-action="home" aria-label="閉じる">×</button></div><div><div class="practice-label">いま何に困ってる？</div><textarea id="problem" placeholder="例：会議のあと、次に何をすればいいか分からない">${esc(problem)}</textarea></div><div class="practice-label">6つの棚から1つずつ</div><div class="roulette">${state.practicePicks.map(t=>`<button class="prompt-card ${state.practiceSelected===t.id?'active':''}" data-practice-choice="${t.id}" aria-pressed="${state.practiceSelected===t.id}"><span class="fam">${esc(t.familyName)}</span><b>${esc(t.name)}</b><p>${esc(t.prompt)}</p></button>`).join('')}</div><div class="practice-actions"><button class="btn secondary" data-action="reroll">別の24から引く</button><button class="btn primary" data-action="practiceNext" ${state.practiceSelected?'':'disabled'}>この方向を使う</button></div></div>`}
function practiceAction(){const t=TACTICS.find(x=>x.id===state.practiceSelected);if(!t){state.screen='practice';return practice()}return `<div class="practice"><div class="practice-head"><div><div class="eyebrow">TURN IT INTO ONE MOVE</div><h1>1手にする</h1><p>考え方を知るだけで終わらず、現実の1アクションへ落とす。</p></div><button class="close" data-action="practice" aria-label="戻る">×</button></div><div class="focus-card"><small>${esc(t.familyName)}</small><h2>${esc(t.name)}</h2><p>${esc(t.prompt)}</p></div><div><div class="practice-label">困りごと</div><div style="font-size:13px;line-height:1.55;padding:10px 2px">${esc(state.practiceProblem||'（未入力）')}</div></div><div><div class="practice-label">具体的に、何をする？</div><input id="oneMove" maxlength="120" placeholder="例：○○さんに、過去の成功例を1つ聞く" value="${esc(state.practiceAction)}"></div><div class="practice-actions"><button class="btn secondary" data-action="practice">別の棚を見る</button><button class="btn primary" data-action="finishPractice">この一手で終了</button></div></div>`}
function practiceDone(){const t=TACTICS.find(x=>x.id===state.practiceSelected);return `<div class="practice"><div class="practice-head"><div><div class="eyebrow">READY</div><h1>次の一手ができた。</h1><p>困ったら、正解を考え続けるより別の棚を開く。</p></div><button class="close" data-action="home" aria-label="閉じる">×</button></div><div class="done-card"><small>${esc(t?.familyName||'')}</small><h2>${esc(state.practiceAction||'1つだけ動く')}</h2><p>${esc(state.practiceProblem)}</p></div><div class="tip"><b>現実へ</b>この画面を閉じたら、今決めた1手だけやる。詰まったらまた別の棚を開く。</div><div class="result-actions" style="margin-top:auto"><button class="btn secondary" data-action="practice">別の困りごと</button><button class="btn primary" data-action="home">終了</button></div></div>`}
function preservePracticeDraft(){const p=document.getElementById('problem');if(p)state.practiceProblem=p.value;const m=document.getElementById('oneMove');if(m)state.practiceAction=m.value}
function bind(){app.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{preservePracticeDraft();act(el.dataset.action)});app.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{let id=el.dataset.choice;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(state.selected.length<3)state.selected.push(id);else return showToast('3つ選んだ。別の棚を試そう');render()});app.querySelectorAll('[data-practice-choice]').forEach(el=>el.onclick=()=>{preservePracticeDraft();state.practiceSelected=el.dataset.practiceChoice;render()});if(state.screen==='play'){state.timer=setInterval(()=>{state.seconds--;let e=document.getElementById('timer');if(e)e.textContent=state.seconds;if(state.seconds<=0)act('peek')},1000)}}
function act(a){if(a==='start'||a==='restart'){state.screen='play';state.round=0;state.selected=[];state.seen=new Set();state.familyCounts=Object.fromEntries(FAMILIES.map(f=>[f.id,0]));state.current=null;prepare();render()}else if(a==='library'){state.screen='library';render()}else if(a==='home'){state.screen='home';state.current=null;render()}else if(a==='practice'){state.screen='practice';state.practicePicks=onePerFamily();state.practiceSelected=null;render()}else if(a==='reroll'){state.practicePicks=onePerFamily();state.practiceSelected=null;render()}else if(a==='practiceNext'){if(!state.practiceSelected)return;state.practiceProblem=(state.practiceProblem||'').trim();if(!state.practiceProblem)return showToast('困りごとを1行だけ書こう');localStorage.setItem('uchite-problem',state.practiceProblem);state.screen='practiceAction';render()}else if(a==='finishPractice'){state.practiceAction=(state.practiceAction||'').trim();if(!state.practiceAction)return showToast('現実でやる1手を1行だけ書こう');localStorage.setItem('uchite-problem',state.practiceProblem);localStorage.setItem('uchite-last-move',JSON.stringify({problem:state.practiceProblem,tactic:state.practiceSelected,action:state.practiceAction,at:Date.now()}));state.screen='practiceDone';render()}else if(a==='commit'){if(state.selected.length<3)return;clearInterval(state.timer);state.selected.forEach(id=>{let t=TACTICS.find(x=>x.id===id);if(t){state.seen.add(id);state.familyCounts[t.family]++}});state.screen='reveal';render()}else if(a==='peek'){clearInterval(state.timer);state.screen='reveal';render()}else if(a==='next'){state.current.best.forEach(id=>state.seen.add(id));state.round++;if(state.round>=6){state.screen='result';render()}else{state.current=null;prepare();state.screen='play';render()}}}
validateData();
render();
})();
</script>
</body>
</html>
