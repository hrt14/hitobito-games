<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#dff3e6"><meta name="description" content="道路を引き、区画を置き、住民が勝手に育てる小さな都市経営ゲーム。"><title>はじまり市 — CITY BUILDER</title><link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app" class="app">
<header class="topbar"><div><div class="kicker">ひとびと <b>CITY</b></div><div class="cityline"><h1>はじまり市</h1><span id="cityRank" class="rank">小さな集落</span></div></div><div class="headline-stats"><div><span>人口</span><strong id="population">0</strong></div><div><span>資金</span><strong id="money">¥12,000</strong></div></div></header>
<section class="demandbar"><span class="demand-title">需要</span><div class="demand r"><b>住</b><i><em id="demandR"></em></i></div><div class="demand c"><b>商</b><i><em id="demandC"></em></i></div><div class="demand i"><b>工</b><i><em id="demandI"></em></i></div><div class="mini"><span>満足</span><strong id="happiness">70%</strong></div><div class="mini"><span>電力</span><strong id="power">0/20</strong></div></section>
<main class="world"><div class="sky"><div class="sun"></div><div id="skyline" class="skyline"></div></div><div class="map-frame"><div id="map" class="map"></div><div id="trafficLayer" class="traffic-layer"></div><div class="fg l">🌿</div><div class="fg rr">🌳</div></div><button id="mission" class="mission"><span id="missionIcon" class="mission-icon">🛣️</span><span><small>市長の最初の仕事</small><b id="missionText">道を3マス引こう</b></span><span id="missionProgress" class="mission-progress">0/3</span></button><div id="toast" class="toast"></div></main>
<section class="dock"><div class="tools"><button class="tool active" data-tool="road"><span>🛣️</span><b>道路</b><small>¥20</small></button><button class="tool" data-tool="residential"><span>🏠</span><b>住宅</b><small>¥40</small></button><button class="tool" data-tool="commercial"><span>🏪</span><b>商業</b><small>¥60</small></button><button class="tool" data-tool="industrial"><span>🏭</span><b>工業</b><small>¥70</small></button><button class="tool" data-tool="park"><span>🌳</span><b>公園</b><small>¥180</small></button><button class="tool" data-tool="power"><span>⚡</span><b>発電</b><small>¥650</small></button><button class="tool" data-tool="bulldoze"><span>🚜</span><b>撤去</b><small>¥10</small></button></div><div class="hint"><span id="toolHint">道路をドラッグして、街の骨格を作ろう</span><button id="menuButton">•••</button></div></section>
<div id="backdrop" class="backdrop" hidden></div><section id="sheet" class="sheet"><div class="grab"></div><div class="sheet-head"><div><small>市役所</small><h2>はじまり市</h2></div><button id="closeSheet">×</button></div><div class="sheet-grid"><div><span>人口</span><strong id="sheetPop">0</strong></div><div><span>雇用</span><strong id="sheetJobs">0</strong></div><div><span>税収 / 月</span><strong id="sheetTax">¥0</strong></div><div><span>満足度</span><strong id="sheetHappy">70%</strong></div></div><div class="sheet-actions"><button id="saveButton">💾 今の街を保存</button><button id="resetButton" class="danger">↺ はじめから</button></div><p>道路に接した区画は、需要・電力・仕事が整うと自動で育ちます。建物そのものが変化する街を作ろう。</p></section>
</div><script src="./game.js"></script>
</body></html>
