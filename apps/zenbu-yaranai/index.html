<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0a">
  <meta name="description" content="忙しすぎて全部ちゃんとやろうとしているときに、今やる一件と最低成立ラインを決め、やらないことを明示して25分だけ進めるLEVEL UPアプリ。">
  <title>全部やらなくていい | LEVEL UP</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="home-link" href="../../" aria-label="LEVEL UPホームへ">LEVEL UP</a>
      <div class="top-actions">
        <button class="text-button" id="historyButton" type="button">履歴</button>
        <button class="icon-button" id="resetButton" type="button" aria-label="最初からやり直す">↺</button>
      </div>
    </header>

    <main id="app" class="app-main" aria-live="polite">
      <section class="screen check-screen">
        <div class="eyebrow">仕事負荷セルフチェック</div>
        <h1>全部やらなくていい</h1>
        <p class="subtitle">高負荷のときほど、一個ずつ。</p>
        <div class="step-label">1 / 7</div>
        <div class="question-card">
          <div class="question-index">1 / 8</div>
          <h2>締切が近い未完了仕事が複数ある</h2>
          <div class="answer-grid">
            <button type="button">いいえ</button>
            <button type="button">少し</button>
            <button type="button">かなり</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer-note">能力で押し切らない。捨てるものを決める。</footer>
  </div>
  <script src="./game.js"></script>
</body>
</html>
