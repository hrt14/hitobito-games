<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b08"><meta name="description" content="全部を終わらせず、破綻を防ぐ最低限と終了条件を作るLEVEL UPゲーム。"><title>全部やらない。 | LEVEL UP</title><link rel="stylesheet" href="./style.css"></head><body><div class="app"><header class="top"><a class="home" href="../../" aria-label="LEVEL UPホーム">⌂</a><div class="brand">HITOBITO / LEVEL UP<small>OVERLOAD DEFENSE</small></div><button class="reset" id="reset">↺</button></header><main class="stage">
<section class="screen intro on" id="intro"><div class="mark">≠ALL</div><h1>全部<br><em>やらない。</em></h1><p class="lead">全部を終わらせるゲームじゃない。<br><b>今日を壊さず、仕事も壊さない。</b></p><div class="rules"><div><b>守る</b><span>今日壊れる</span></div><div><b>縮める</b><span>最低限へ</span></div><div><b>逃がす</b><span>日程・人へ</span></div><div><b>捨てる</b><span>今はやらない</span></div></div><div class="actions"><button class="btn pri" id="start">8問トレーニング</button><button class="btn sec" id="realStart">いま圧倒されてる</button></div></section>
<section class="screen game" id="game"><div class="hud"><span id="round"></span><div class="track"><div class="fill" id="progress"></div></div><span id="score"></span></div><div class="case"><div class="story"><small>OVERLOAD</small><h2 id="title"></h2><p id="detail"></p></div><div class="meters"><div class="meter"><div><span>破綻回避</span><strong id="safeN">50</strong></div><div class="bar"><i id="safeB"></i></div></div><div class="meter"><div><span>余力</span><strong id="energyN">50</strong></div><div class="bar"><i id="energyB"></i></div></div></div><div class="choices" id="choices"></div></div><div class="feedback" id="fb"><div class="fbmark" id="fbm"></div><div><b id="fbt"></b><p id="fbp"></p></div><button class="next" id="next">次へ</button></div></section>
<section class="screen result" id="result"><div class="ring" id="ring"><strong id="rate"></strong></div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="stats"><div class="stat"><strong id="rs"></strong><span>破綻回避</span></div><div class="stat"><strong id="re"></strong><span>残せた余力</span></div></div><div class="actions"><button class="btn pri" id="toReal">現実の仕事を整理</button><button class="btn sec" id="again">もう8問</button></div></section>
<section class="screen real" id="real"><div class="realhead"><b>REAL DEFENSE LINE</b><h2>今日、何だけ守る？</h2><p>最大5件。全部を処理せず、今日どう扱うかだけ決める。</p></div><div class="tasks" id="tasks"></div><div class="realactions"><button class="btn sec" id="add">＋</button><button class="btn pri" id="make">防衛ラインを作る</button></div></section>
<section class="screen summary" id="summary"><div class="shield">✓</div><h2>これだけで、今日は破綻しない。</h2><p>全部終えるまで、ではなく。ここまでで仕事終了。</p><div class="defense" id="defense"></div><div class="finish" id="finish"></div><div class="actions"><button class="btn pri" id="save">このラインで終える</button><button class="btn sec" id="edit">戻って直す</button></div></section>
</main></div><script src="./game.js"></script></body></html>
