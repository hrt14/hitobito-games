<title>WEBマーケター：自社サイト担当者 | LEVEL UP</title>
<style>
:root{--bg:#07101d;--panel:#0e1b2d;--panel2:#12243a;--line:#213a57;--ink:#f6fbff;--muted:#9cb1c7;--cyan:#52e0ff;--green:#69efad;--amber:#ffc857;--red:#ff7b83;--violet:#af91ff;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}button{font:inherit}button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}#app{height:100svh;background:radial-gradient(circle at 85% 8%,#133a56 0,transparent 28%),radial-gradient(circle at 5% 95%,#132d2e 0,transparent 30%),linear-gradient(160deg,#07101d,#091725 55%,#07101d)}.shell{width:min(100%,620px);height:100%;margin:auto;padding:max(9px,env(safe-area-inset-top)) 12px max(9px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.top{height:34px;display:flex;align-items:center;justify-content:space-between;flex:none}.brand{font-weight:950;font-size:14px;letter-spacing:.02em}.brand b{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:7px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06101c}.top a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:850}.screen{flex:1;min-height:0;display:flex;flex-direction:column}.home{justify-content:center}.hero{padding:4px 4px 0}.kicker{font-size:11px;font-weight:950;letter-spacing:.14em;color:var(--cyan)}h1{font-size:clamp(33px,8.8vw,52px);line-height:.98;letter-spacing:-.055em;margin:8px 0 10px}.home p{font-size:17px;line-height:1.55;color:#c2d2e3;margin:0}.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.benefit{background:#0d1c2dcb;border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center}.benefit strong{display:block;font-size:13px}.benefit span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.best{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.mini{border:1px solid var(--line);background:#0c1928;border-radius:14px;padding:10px 12px}.mini small{display:block;color:var(--muted);font-size:10px;font-weight:800}.mini strong{font-size:20px}.btn{border:0;border-radius:16px;min-height:54px;padding:0 16px;font-weight:950;cursor:pointer}.primary{background:linear-gradient(135deg,var(--cyan),#6ba8ff);color:#06101c;font-size:17px}.secondary{background:#102237;border:1px solid var(--line);color:var(--ink)}.btn:active,.choice:active{transform:scale(.985)}.note{font-size:11px;line-height:1.45;color:var(--muted);text-align:center;margin:8px 4px 0}.hud{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;flex:none}.round,.score{font-size:12px;font-weight:950}.round{color:var(--muted)}.score{color:var(--green)}.track{height:7px;border-radius:99px;background:#102136;overflow:hidden;border:1px solid #1c3550}.fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:width .2s}.case{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}.case-head{background:linear-gradient(145deg,#102238,#0d1a2a);border:1px solid var(--line);border-radius:18px;padding:11px 12px}.case-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:10px;font-weight:1000;letter-spacing:.08em;border-radius:999px;padding:5px 8px;background:#15334b;color:var(--cyan)}.day{font-size:11px;color:var(--muted);font-weight:850}.case-head h2{font-size:clamp(19px,5.3vw,25px);line-height:1.28;letter-spacing:-.035em;margin:8px 0 4px}.case-head p{font-size:12.5px;line-height:1.42;color:var(--muted);margin:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}.metric{background:#0b1828;border:1px solid #1d354f;border-radius:13px;padding:8px 7px;min-width:0}.metric span{display:block;font-size:9px;color:var(--muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric strong{display:block;font-size:17px;margin-top:2px;white-space:nowrap}.metric em{display:block;font-size:9px;font-style:normal;margin-top:1px}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--amber)}.judge-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px;flex:none}.judge-head strong{font-size:17px}.timer{display:flex;align-items:center;gap:7px}.ring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amber) var(--deg,360deg),#213246 0);position:relative}.ring:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#081321}.sec{position:relative;z-index:1;font-size:14px;font-weight:1000}.choices{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:7px;flex:1;min-height:0}.choice{border:1px solid #27415e;background:linear-gradient(145deg,#10243a,#0c1a2b);color:var(--ink);border-radius:15px;padding:10px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;min-height:0}.choice b{font-size:10px;color:var(--cyan);letter-spacing:.08em;margin-bottom:4px}.choice strong{font-size:14.5px;line-height:1.32}.read{flex:1;display:flex;align-items:flex-end}.read .btn{width:100%}.feedback{position:absolute;inset:0;z-index:20;background:#07101df2;backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px}.fb{width:min(100%,470px);max-height:calc(100svh - 36px);overflow:hidden;background:#0e1d30;border:1px solid #294966;border-radius:22px;padding:18px}.fb-mark{font-size:36px}.fb h2{font-size:24px;margin:4px 0 6px}.fb .answer{font-size:14px;font-weight:950;color:var(--cyan);margin:0 0 8px}.fb .why{font-size:15px;line-height:1.48;color:#d4e0ec;margin:0}.rule{background:#0a1726;border-left:4px solid var(--green);padding:10px 11px;border-radius:10px;margin:11px 0;font-size:12px;line-height:1.45;color:#bfd1e2}.impact{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.impact span{font-size:10px;font-weight:900;border-radius:999px;padding:5px 8px;background:#173149}.impact .good{background:#12392f;color:#85f4bd}.impact .bad{background:#422029;color:#ff9ca2}.fb .btn{width:100%}.result{justify-content:center}.result .grade{font-size:52px;font-weight:1000;line-height:1}.result h1{font-size:34px;margin:8px 0 5px}.result>p{margin:0;color:var(--muted);font-size:14px}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:14px 0}.result-card{background:#0d1c2d;border:1px solid var(--line);border-radius:14px;padding:10px 11px}.result-card span{font-size:10px;color:var(--muted);display:block}.result-card strong{font-size:22px}.skills{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:12px}.skill{background:#0c1928;border:1px solid #1d354f;border-radius:12px;padding:8px 3px;text-align:center}.skill b{display:block;font-size:9px;color:var(--muted)}.skill strong{font-size:15px}.coach{font-size:13px;line-height:1.5;background:#10243a;border-radius:14px;padding:11px 12px;margin-bottom:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}@media(max-height:720px){.shell{gap:6px}.top{height:29px}.case-head{padding:8px 10px}.case-head h2{font-size:19px;margin:5px 0 2px}.case-head p{font-size:11.5px}.metric{padding:6px}.metric strong{font-size:15px}.choice{padding:8px 9px}.choice strong{font-size:13.5px}.fb{padding:14px}.fb-mark{font-size:30px}.fb h2{font-size:21px}.fb .why{font-size:14px}.rule{margin:8px 0;padding:8px 9px}.benefits{margin:10px 0}.hero h1{font-size:38px}.home p{font-size:15px}}@media(max-height:620px){.case-head p{display:none}.metric em{display:none}.choice b{display:none}.choice strong{font-size:12.8px}.ring{width:34px;height:34px}.fb .why{font-size:13px}.rule{font-size:11px}.result h1{font-size:27px}.result .grade{font-size:42px}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{
const app=document.querySelector('#app');
const LIMIT=7000,ROUNDS=10;
const labels={traffic:'集客',cvr:'CVR',measure:'計測',ltv:'LTV',test:'実験'};
const cases=[
{cat:'traffic',title:'売上が20%落ちた。CVRと客単価はほぼ同じ。',detail:'まず「売上が落ちた」だけでサイト全面改修を始めるべきか？',m:[['セッション','80','-20%'],['CVR','2.4%','±0'],['客単価','¥6,200','+1%'],['売上','¥1.19M','-19%']],choices:['商品ページを全面リニューアル','流入チャネル別のセッション減少を確認','全商品を10%値下げ','メルマガ配信数を2倍'],ok:1,why:'売上低下の主因はセッション減です。CVRと客単価が安定しているので、最初に流入チャネル別で減少源を切り分けます。',rule:'売上を「セッション × CVR × 客単価」に分解し、変化した要素から見る。'},
{cat:'cvr',title:'商品閲覧は変わらないのに、購入だけ落ちた。',detail:'カート追加までは安定。送料ルール変更の翌日からチェックアウト完了率が悪化。',m:[['商品閲覧','12k','±0'],['カート率','8.2%','±0'],['決済完了','41%','-18%'],['売上','¥980k','-16%']],choices:['SEO記事を10本追加','送料表示とチェックアウト離脱を確認','広告予算を増やす','トップページの色を変更'],ok:1,why:'ボトルネックがチェックアウトに限定され、直前に送料変更があります。まず離脱箇所と表示内容を検証します。',rule:'ファネルの「落ち始めた場所」と直前の変更を一致させる。'},
{cat:'measure',title:'GA4の購入が突然0件。でも受注管理には43件ある。',detail:'広告管理画面のCVも同時に急減。サイトの注文メールは届いている。',m:[['受注','43','正常'],['GA4購入','0','-100%'],['広告CV','2','-94%'],['売上DB','¥312k','正常']],choices:['広告を全部停止','計測タグとpurchaseイベントを確認','商品を値下げ','新しいLPを作る'],ok:1,why:'実売上は発生しているため、最優先は計測異常の確認です。施策評価に使う数字が壊れた状態で広告停止やLP変更をすると誤判断になります。',rule:'事業データと計測データが矛盾したら、まず計測を疑う。'},
{cat:'traffic',title:'自然検索のセッションが下がった。どこから見る？',detail:'指名流入は安定。検索経由だけが2週間で減っている。',m:[['Organic','18k','-24%'],['Direct','9k','+1%'],['CVR','2.8%','±0'],['指名売上','¥620k','±0']],choices:['Search Consoleでクエリ/ページ別の変化を見る','サイトのロゴを変える','カートボタンを大きくする','SNS投稿を全部止める'],ok:0,why:'検索流入の変化はSearch Consoleのパフォーマンスで、クエリやページ単位に分解して原因候補を絞ります。',rule:'チャネル固有の異常は、そのチャネルを説明できるデータまで降りる。'},
{cat:'cvr',title:'モバイルだけCVRが半減。PCは正常。',detail:'新しい大型ヒーローバナーを公開した直後から、スマホの商品ページが重い。',m:[['Mobile CVR','1.1%','-49%'],['PC CVR','3.0%','±0'],['Mobile LCP','5.1s','悪化'],['直帰','54%','+18%']],choices:['全デバイスで価格を下げる','モバイル表示速度とバナー実装を優先修正','PCサイトを先に改修','広告の曜日設定を変更'],ok:1,why:'悪化がモバイルに限定され、表示速度も同時に悪化しています。まず重い変更を戻す/軽くする検証が最短です。',rule:'全体平均より「差分」が原因を教える。端末別・ページ別・新旧で比較する。'},
{cat:'ltv',title:'新規獲得は順調。でも利益が伸びない。',detail:'初回購入は増えた一方、2回目購入率が低い。消耗品で再購入余地がある。',m:[['新規客','1,420','+31%'],['CAC','¥2,100','+4%'],['2回目率','12%','低い'],['粗利','¥1.8M','+3%']],choices:['初回割引をさらに深くする','購入後フォローと再購入導線を設計','広告媒体を全部入れ替える','商品ページを毎週作り直す'],ok:1,why:'獲得後の2回目購入が弱く、商品特性上リピート余地があります。購入後コミュニケーションと再購入導線が優先です。',rule:'売上を新規獲得だけでなく、継続率とLTVまでつなげて見る。'},
{cat:'test',title:'新LPの方がCVR 2.9%。旧LPは2.7%。勝ち？',detail:'新LP 120セッション、旧LP 4,800セッション。流入元も異なる。',m:[['新LP','2.9%','120ss'],['旧LP','2.7%','4.8kss'],['流入元','別','不揃い'],['差','+0.2pt','小']],choices:['新LPに100%切替','同条件で比較できるテストを設計','旧LPを削除','値引きを追加して差を広げる'],ok:1,why:'母数も流入条件も揃っていないので、LP差だけを比較できません。同条件で主要変数を揃えたテストにします。',rule:'施策評価では「比較可能な条件」を作る。差が出たことと、原因が分かったことは別。'},
{cat:'measure',title:'商品詳細→カート追加の落ち方が見えない。',detail:'ページビューとpurchaseだけは取れている。改善箇所を特定したい。',m:[['view_item','未計測','—'],['add_to_cart','未計測','—'],['checkout','未計測','—'],['purchase','取得','正常']],choices:['purchaseだけで判断する','商品閲覧・カート・チェックアウトも計測する','毎日アンケートだけ取る','アクセス解析をやめる'],ok:1,why:'購入だけではファネル途中のどこで離脱したか分かりません。EC行動イベントを整えて改善箇所を観測できるようにします。',rule:'改善したい行動は、その直前と直後を計測できるようにする。'},
{cat:'cvr',title:'商品ページ閲覧は多いが、カート追加率が低い。',detail:'レビューでは「サイズ感が分からない」「届く日が不明」が多い。',m:[['閲覧','24k','+12%'],['カート率','2.1%','低い'],['CVR','0.8%','低い'],['問合せ','多い','サイズ/納期']],choices:['購入前の不安情報を商品ページで解消','検索広告を増額','ロゴをリニューアル','会員登録を必須化'],ok:0,why:'流入はあるのに商品理解・購入不安で止まっています。サイズ・納期など、実際の障壁を商品ページで先に解消します。',rule:'CVR改善は「説得」より先に、購入を止めている不安・摩擦を取り除く。'},
{cat:'traffic',title:'広告流入が増えたのに売上が増えない。',detail:'新キャンペーンは大量にクリックを取ったが、商品と検索意図のズレが疑われる。',m:[['広告SS','+78%','増'],['広告CVR','0.4%','-63%'],['全体CVR','1.7%','-21%'],['売上','±1%','横ばい']],choices:['クリック単価が安いので継続','検索語句/訴求とLPの意図一致を確認','全商品を値上げ','SEOを止める'],ok:1,why:'量は増えていますが質が悪化しています。安いクリックではなく、意図と商品・LPの一致を見ます。',rule:'集客は「多いほど良い」ではない。売上につながる適切な流入を増やす。'},
{cat:'ltv',title:'クーポン配信日は売上が跳ねる。でも通常日は弱い。',detail:'毎週同じ20%OFFを全顧客に送り、定価購入が減っている。',m:[['配信日売上','+84%','増'],['通常日','-18%','減'],['粗利率','-7pt','悪化'],['解除率','+32%','悪化']],choices:['毎日20%OFFを送る','顧客/購入履歴で配信を分け、価値訴求も混ぜる','クーポンを30%にする','メールを全停止'],ok:1,why:'短期売上だけでなく粗利・通常購入・解除が悪化しています。顧客状態に合わせて配信し、値引き依存を下げます。',rule:'CRMは配信数ではなく、長期の購入行動と利益で評価する。'},
{cat:'test',title:'CTA色を変えたらCVRが上がった。本当に色の効果？',detail:'同日に送料無料キャンペーンも開始。新旧比較は期間が異なる。',m:[['旧CVR','2.1%','先週'],['新CVR','2.8%','今週'],['送料','有→無料','変更'],['流入','+35%','変化']],choices:['色の勝利と断定','同時変更が多いので因果を分離して再検証','全ボタンを同じ色にする','広告費を2倍にする'],ok:1,why:'CTA色以外の条件が複数変わっているため、CVR上昇を色だけの効果とは断定できません。',rule:'一度に多く変えると、何が効いたか学習できない。'},
{cat:'measure',title:'売上は合うが、チャネル別評価だけ不自然。',detail:'決済完了後に別ドメインを経由し、参照元が書き換わっている可能性がある。',m:[['総売上','一致','正常'],['Direct','+92%','急増'],['広告CV','-36%','減'],['決済','外部','経由']],choices:['Directが伸びたと喜ぶ','計測の参照元/クロスドメイン設定を確認','広告を停止','商品名を変更'],ok:1,why:'総売上が合うのに流入帰属だけ急変しています。決済経路変更による計測影響を先に確認します。',rule:'総量は合うのに内訳だけ壊れたら、分類・帰属の計測を疑う。'},
{cat:'cvr',title:'カゴ落ちが多い。フォーム入力項目は18個。',detail:'スマホで住所・会社名・FAXなど、購入に必須でない項目も表示している。',m:[['カート','1,020','正常'],['checkout','710','正常'],['購入','221','低い'],['入力項目','18','多い']],choices:['入力項目を必要最小限へ見直す','トップページを長くする','SEO記事を増やす','SNSフォロワーを買う'],ok:0,why:'離脱箇所が購入フォームにあり、入力摩擦が具体的に見えています。必須でない項目を減らすのが直接的です。',rule:'ファネル後半ほど、余計な一手の損失が売上へ直結する。'},
{cat:'traffic',title:'検索順位は大きく変わらないのに自然検索クリックが減少。',detail:'Search Consoleでは表示回数が横ばい、CTRだけ低下。',m:[['表示回数','±1%','横ばい'],['平均掲載','±0.3','横ばい'],['CTR','3.1%','-28%'],['クリック','-27%','減']],choices:['タイトル/スニペットと検索結果の訴求を確認','カートフォームを改修','メルマガを増やす','GA4を削除'],ok:0,why:'表示機会と順位はほぼ同じで、CTRが落ちています。検索結果上での見え方や意図とのズレを確認します。',rule:'SEO流入も「表示回数 × CTR」で分解して考える。'},
{cat:'ltv',title:'高LTV顧客に共通する行動が見つかった。',detail:'初回購入後30日以内に使い方コンテンツを見た顧客は、再購入率が高い。',m:[['再購入率','38%','閲覧群'],['未閲覧群','17%','低い'],['返品率','低い','閲覧群'],['粗利','高い','閲覧群']],choices:['購入後に使い方コンテンツへ案内','初回広告を停止','価格を半額にする','トップページから商品を隠す'],ok:0,why:'因果は追加検証が必要ですが、低コストで顧客価値に沿った導線改善です。購入後教育の対象としてテスト価値があります。',rule:'LTV改善は「次も買って」だけでなく、初回体験を成功させる設計から。'},

{cat:'cvr',title:'トップページの滞在時間が短い。悪い？',detail:'指名客はトップから商品ページへすぐ遷移し、その後の購入率が高い。',m:[['トップ滞在','18秒','短い'],['商品遷移','72%','高い'],['遷移後CVR','5.1%','高い'],['直帰','低い','良好']],choices:['滞在時間を伸ばすため文章を増やす','目的達成が速いので下流成果を優先評価','自動再生動画を追加','遷移リンクを減らす'],ok:1,why:'短い滞在時間が悪いとは限りません。ユーザーが素早く商品へ進み、購入につながっているなら目的達成は良好です。',rule:'代理指標を良くするために、本来の成果を悪化させない。'},

{cat:'ltv',title:'優良顧客の平均購入間隔は45日。再購入メールは120日後。',detail:'消耗タイミングよりかなり遅く、他社へ流れている可能性がある。',m:[['優良間隔','45日','—'],['配信','120日','遅い'],['再購入率','19%','低い'],['競合流出','不明','—']],choices:['購入間隔に合わせたリマインドをテスト','120日のまま配信数だけ増やす','毎日メール','広告を止める'],ok:0,why:'実際の購入周期に対して接触が遅すぎます。商品消費のタイミングに合わせて再購入導線を検証します。',rule:'CRMのタイミングは、社内都合ではなく顧客の利用周期に合わせる。'}
];
let pool=[],round=0,score=0,streak=0,bestStreak=0,answered=false,timer=null,startAt=0;
let skill=Object.fromEntries(Object.keys(labels).map(k=>[k,{ok:0,total:0}]));
const best=JSON.parse(localStorage.getItem('wm-owned-best')||'{"score":0,"plays":0}');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function shell(body){return `<div class="shell"><div class="top"><div class="brand"><b>W</b>WEB MARKETER</div><a href="/">LEVEL UP</a></div>${body}</div>`}
function home(){app.innerHTML=shell(`<main class="screen home"><div class="hero"><div class="kicker">OWNED SITE / DTC TRAINING</div><h1>自社サイトを<br>伸ばす判断力。</h1><p>数字を見て、ボトルネックを特定。<br><b>「次に何を見る・何を直す」</b>を反射にする。</p></div><div class="benefits"><div class="benefit"><strong>売上分解</strong><span>流入×CVR×客単価</span></div><div class="benefit"><strong>原因特定</strong><span>ファネルで詰まりを見る</span></div><div class="benefit"><strong>全体最適</strong><span>集客〜LTVまで横断</span></div></div><div class="best"><div class="mini"><small>BEST SCORE</small><strong>${best.score}</strong></div><div class="mini"><small>PLAY COUNT</small><strong>${best.plays}</strong></div></div><button class="btn primary" id="start">10ケース診断を始める</button><div class="note">問題文を読む時間は無制限。<b>判断開始</b>を押してから7秒。<br>正解後の解説も、自分で次へ押すまで消えません。</div></main>`);document.querySelector('#start').onclick=start}
function start(){pool=shuffle(cases).slice(0,ROUNDS);round=0;score=0;streak=0;bestStreak=0;skill=Object.fromEntries(Object.keys(labels).map(k=>[k,{ok:0,total:0}]));showCase()}
function trendClass(t){if(t.includes('+')||t==='増'||t==='正常'||t==='高い'||t==='良好')return'up';if(t.includes('-')||t==='減'||t==='低い'||t==='悪化'||t==='遅い')return'down';return'flat'}
function showCase(){clearInterval(timer);answered=false;const q=pool[round];app.innerHTML=shell(`<div class="hud"><span class="round">CASE ${round+1}/${ROUNDS}</span><div class="track"><div class="fill" style="width:${round/ROUNDS*100}%"></div></div><span class="score">SCORE ${score}</span></div><main class="screen case"><section class="case-head"><div class="case-top"><span class="tag">${labels[q.cat]}</span><span class="day">KPI診断 → 優先順位</span></div><h2>${q.title}</h2><p>${q.detail}</p></section><section class="metrics">${q.m.map(x=>`<div class="metric"><span>${x[0]}</span><strong>${x[1]}</strong><em class="${trendClass(x[2])}">${x[2]}</em></div>`).join('')}</section><div class="judge-head"><strong>最初の一手は？</strong><div class="timer"><span style="font-size:10px;color:var(--muted);font-weight:850">判断</span><div class="ring" id="ring" style="--deg:360deg"><span class="sec" id="sec">∞</span></div></div></div><div class="read"><button class="btn primary" id="judge">判断開始</button></div></main>`);document.querySelector('#judge').onclick=beginJudge}
function beginJudge(){const q=pool[round];document.querySelector('.read').outerHTML=`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-i="${i}"><b>${String.fromCharCode(65+i)}</b><strong>${c}</strong></button>`).join('')}</div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(+b.dataset.i));startAt=performance.now();const sec=document.querySelector('#sec'),ring=document.querySelector('#ring');timer=setInterval(()=>{const elapsed=performance.now()-startAt,left=Math.max(0,LIMIT-elapsed);sec.textContent=Math.ceil(left/1000);ring.style.setProperty('--deg',`${left/LIMIT*360}deg`);if(left<=0){clearInterval(timer);timeout()}},50)}
function timeout(){if(answered)return;answered=true;const q=pool[round];skill[q.cat].total++;streak=0;feedback(false,-1,q,'時間切れ。判断できないまま待つのも、ひとつの判断です。')}
function answer(i){if(answered)return;answered=true;clearInterval(timer);const q=pool[round],correct=i===q.ok;skill[q.cat].total++;if(correct){skill[q.cat].ok++;streak++;bestStreak=Math.max(bestStreak,streak);const speed=Math.max(0,Math.round((LIMIT-(performance.now()-startAt))/700));score+=10+speed}else{streak=0}feedback(correct,i,q)}
function feedback(correct,i,q,custom=''){const picked=i>=0?q.choices[i]:'未回答';const impacts=correct?['判断 +1','売上思考 +1','連続正解 +1']:['学び +1','連続正解 0'];app.insertAdjacentHTML('beforeend',`<div class="feedback"><div class="fb"><div class="fb-mark">${correct?'◎':'△'}</div><h2>${correct?'いい判断。':'優先順位が違う。'}</h2><p class="answer">最優先：${q.choices[q.ok]}</p><p class="why">${custom||q.why}</p><div class="rule"><b>反射ルール：</b> ${q.rule}</div><div class="impact">${impacts.map((x,j)=>`<span class="${correct&&j<2?'good':(!correct&&j===1?'bad':'')}">${x}</span>`).join('')}</div><button class="btn primary" id="next">${round===ROUNDS-1?'結果を見る':'次のケース'}</button></div></div>`);document.querySelector('#next').onclick=()=>{round++;round>=ROUNDS?result():showCase()}}
function result(){const acc=Math.round(Object.values(skill).reduce((a,s)=>a+s.ok,0)/ROUNDS*100);best.plays++;if(score>best.score)best.score=score;localStorage.setItem('wm-owned-best',JSON.stringify(best));const rows=Object.entries(skill).map(([k,s])=>[k,s.total?Math.round(s.ok/s.total*100):null]);const seen=rows.filter(x=>x[1]!==null);const weakest=[...seen].sort((a,b)=>a[1]-b[1])[0];const grade=acc>=90?'S':acc>=80?'A':acc>=70?'B':acc>=60?'C':'D';const advice=weakest?`${labels[weakest[0]]}が今回の伸びしろ。次は「${coach(weakest[0])}」を意識してもう一周。`:'もう一周して領域別の癖を見つけよう。';app.innerHTML=shell(`<main class="screen result"><div class="grade">${grade}</div><h1>${acc}% 正解</h1><p>速さより、正しい順番を反射にする。</p><div class="result-grid"><div class="result-card"><span>SCORE</span><strong>${score}</strong></div><div class="result-card"><span>BEST STREAK</span><strong>${bestStreak}</strong></div></div><div class="skills">${rows.map(([k,v])=>`<div class="skill"><b>${labels[k]}</b><strong>${v===null?'—':v+'%'}</strong></div>`).join('')}</div><div class="coach">${advice}</div><div class="actions"><button class="btn secondary" id="home">トップへ</button><button class="btn primary" id="again">もう一周</button></div></main>`);document.querySelector('#home').onclick=home;document.querySelector('#again').onclick=start}
function coach(k){return{traffic:'量ではなく、どの流入が変わったかまで分解する',cvr:'ファネルの落ち始めた場所から直す',measure:'事業データと計測データの矛盾を先に潰す',ltv:'初回獲得の先にある継続行動まで見る',test:'変数を絞り、比較可能な条件で学習する'}[k]}
home();
})();
</script>
