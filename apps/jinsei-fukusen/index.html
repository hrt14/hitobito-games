<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe5" />
  <meta name="description" content="昔の夢中、遠回り、困ったときの行動。5問で過去の経験をたどり、今の自分につながっている一本の線を見つけるLEVEL UPアプリ。" />
  <meta property="og:title" content="あなたの人生の伏線 | LEVEL UP" />
  <meta property="og:description" content="一見無関係だった経験を並べると、今の自分につながる線が見えてくる。" />
  <title>あなたの人生の伏線 | LEVEL UP</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="/" aria-label="LEVEL UP ホームへ">
      <span class="brand-dot"></span><span>LEVEL UP</span>
    </a>
    <button id="restartTop" class="top-action" type="button" hidden>最初から</button>
  </header>

  <main id="app" class="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="introTemplate">
    <section class="screen intro-screen">
      <div class="kicker">5 QUESTIONS · YOUR STORY</div>
      <div class="thread-hero" aria-hidden="true">
        <svg viewBox="0 0 360 150" role="img">
          <path class="faint" d="M14 114 C70 30 95 138 150 76 S260 48 346 92" />
          <path class="main" d="M14 114 C70 30 95 138 150 76 S260 48 346 92" />
          <circle cx="14" cy="114" r="5" />
          <circle cx="92" cy="90" r="4" />
          <circle cx="150" cy="76" r="4" />
          <circle cx="258" cy="62" r="4" />
          <circle cx="346" cy="92" r="7" />
        </svg>
      </div>
      <h1>あなたの人生の<br><em>伏線</em></h1>
      <p class="lead">昔の夢中。遠回り。困ったときのクセ。<br>バラバラだった経験を5つ選ぶと、<strong>今の自分につながる一本の線</strong>が見えてきます。</p>
      <div class="intro-note">
        <span>約60秒</span><span>入力なし</span><span>診断ではありません</span>
      </div>
      <button id="startBtn" class="primary" type="button">5問で伏線をたどる <span>→</span></button>
      <p class="fineprint">過去に「正解」をつけるのではなく、今から見える意味をひとつ拾うための振り返りです。</p>
    </section>
  </template>

  <script src="./app.js" defer></script>
</body>
</html>
