<style>
:root{color-scheme:dark;font-family:Inter,"Hiragino Sans","Yu Gothic",system-ui,sans-serif;--bg:#071018;--panel:rgba(8,20,30,.92);--ink:#f5fbff;--muted:#9bb3c6;--cyan:#62efff;--amber:#ffd166;--danger:#ff5d73;--good:#66f0a8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#102738 0,#071018 52%,#03070b 100%);color:var(--ink);touch-action:none}button{font:inherit;color:inherit}.app{height:100dvh;display:grid;place-items:center;padding:0}.shell{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;overflow:hidden;background:#071018;box-shadow:0 0 60px #000a}canvas{display:block;width:100%;height:100%;touch-action:none;background:linear-gradient(#071722,#08121a)}.hud{position:absolute;z-index:4;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none}.hudrow{display:flex;gap:7px;align-items:center}.pill{background:#06111acc;border:1px solid #a9dbef33;backdrop-filter:blur(8px);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;letter-spacing:.02em;box-shadow:0 3px 14px #0004}.pill strong{font-size:14px}.spacer{flex:1}.score{color:var(--amber)}.heatwrap{margin-top:8px;display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;background:#06111acc;border:1px solid #a9dbef22;padding:6px 9px;border-radius:12px}.heatlabel{font-size:11px;font-weight:900;letter-spacing:.08em;color:#b8ccd9}.heatbar{height:8px;border-radius:99px;background:#ffffff14;overflow:hidden}.heatfill{height:100%;width:0;background:linear-gradient(90deg,#56e7ff,#ffd166 65%,#ff5d73);border-radius:inherit;transition:width .08s linear}.heatpct{width:33px;text-align:right;font-size:11px;font-weight:900}.overheat .heatwrap{animation:dangerPulse .45s infinite alternate;border-color:#ff5d7377}.overheat .heatpct,.overheat .heatlabel{color:#ff8191}@keyframes dangerPulse{to{box-shadow:0 0 18px #ff435855}}.hint{position:absolute;z-index:5;left:50%;bottom:18%;transform:translateX(-50%);white-space:nowrap;background:#00101ae6;border:1px solid #6fefff55;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:900;box-shadow:0 8px 30px #0008;pointer-events:none;transition:.35s}.hint.hide{opacity:0;transform:translate(-50%,10px)}.banner{position:absolute;z-index:6;left:50%;top:22%;transform:translate(-50%,-50%) scale(.95);opacity:0;pointer-events:none;text-align:center;text-shadow:0 3px 20px #000;transition:.18s}.banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.banner .big{display:block;font-size:clamp(28px,8vw,48px);font-weight:1000;letter-spacing:.03em}.banner .sub{display:block;margin-top:4px;font-size:13px;font-weight:800;color:#c3d8e6}.banner.boss .big{color:#ff6d7f}.banner.clear .big{color:#70f1ad}.screen{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:24px max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 38%,#0d2b3be8,#03080cf6 72%);backdrop-filter:blur(5px)}.screen[hidden]{display:none}.card{width:min(100%,400px);border:1px solid #a8e8ff2d;background:linear-gradient(180deg,#0e2230e8,#071018f5);border-radius:24px;padding:22px;box-shadow:0 24px 70px #000b,inset 0 1px #ffffff12}.eyebrow{font-size:11px;font-weight:1000;letter-spacing:.18em;color:var(--cyan)}h1{font-size:clamp(30px,8vw,40px);line-height:1.05;margin:8px 0 10px;letter-spacing:-.04em}.lead{color:#c1d5e2;font-size:15px;line-height:1.65;margin:0 0 16px}.how{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0 18px}.how>div{background:#ffffff08;border:1px solid #ffffff10;border-radius:14px;padding:12px}.how b{display:block;font-size:14px;margin-bottom:3px}.how span{font-size:11px;line-height:1.45;color:var(--muted)}.primary{width:100%;border:0;border-radius:16px;padding:15px 16px;background:linear-gradient(135deg,#5ee9ff,#58ffb3);color:#021014;font-weight:1000;font-size:17px;box-shadow:0 8px 26px #53e9d03a;cursor:pointer}.primary:active{transform:translateY(1px) scale(.995)}.minor{margin-top:10px;text-align:center;font-size:11px;color:#6f899a}.backlink{position:absolute;left:14px;top:max(14px,env(safe-area-inset-top));z-index:25;color:#bdd2df;text-decoration:none;font-size:12px;font-weight:900;background:#061019cc;border:1px solid #ffffff14;padding:8px 10px;border-radius:999px}.upgradeScreen{background:#02080dd9}.upgradeCard{width:min(100%,430px)}.upgradeHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}.upgradeHead h2{font-size:25px;margin:0}.upgradeHead span{font-size:12px;color:var(--muted)}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid #ffffff16;background:linear-gradient(145deg,#102839,#0a1822);border-radius:16px;padding:14px 14px 13px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 24px #0005}.choice:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--cyan)}.choice:active{transform:scale(.99)}.choice .tag{font-size:10px;font-weight:1000;letter-spacing:.1em;color:var(--cyan)}.choice h3{font-size:17px;margin:3px 0 4px}.choice p{font-size:12px;line-height:1.5;color:#aabfcd;margin:0}.choice .trade{color:#ffd58b}.choice.evo{border-color:#ffd16655;background:linear-gradient(145deg,#392a10,#18180d)}.choice.evo:before{background:var(--amber)}.choice.evo .tag{color:var(--amber)}.endTitle{font-size:36px;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.stat{background:#ffffff08;border-radius:13px;padding:11px 5px;text-align:center}.stat b{display:block;font-size:22px;color:#fff}.stat span{font-size:10px;color:var(--muted)}.endReason{font-size:13px;line-height:1.6;color:#bed1dd;background:#ffffff06;border-radius:13px;padding:11px;margin:10px 0 14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{border-radius:14px;padding:13px 10px;font-weight:1000;border:1px solid #ffffff16;background:#ffffff0b}.actions .retry{background:linear-gradient(135deg,#59e7ff,#58ffb3);color:#021014;border:0}.newbest{display:inline-block;color:#061014;background:var(--amber);font-size:11px;font-weight:1000;border-radius:999px;padding:5px 9px;margin-bottom:4px}.pauseBtn{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:8;border:1px solid #ffffff14;background:#07131ccc;color:#9eb5c3;width:38px;height:38px;border-radius:50%;font-weight:1000;display:grid;place-items:center}.pauseBtn[hidden]{display:none}@media (min-width:600px){.shell{height:min(94vh,900px);border-radius:24px;border:1px solid #ffffff14}.backlink{top:18px}.hud{padding-top:12px}}@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><div class="app"><main class="shell" id="shell"><canvas id="game" aria-label="コア防衛サバイバルのゲーム画面"></canvas><div class="hud" id="hud" hidden><div class="hudrow"><div class="pill">WAVE <strong id="waveText">1/12</strong></div><div class="pill">CORE <strong id="hpText">100</strong></div><div class="spacer"></div><div class="pill score">撃破 <strong id="killText">0</strong></div></div><div class="heatwrap"><span class="heatlabel">HEAT</span><div class="heatbar"><div class="heatfill" id="heatFill"></div></div><span class="heatpct" id="heatText">0%</span></div></div><div class="banner" id="banner"><span class="big" id="bannerBig"></span><span class="sub" id="bannerSub"></span></div><div class="hint" id="hint">押したまま狙う → 離して冷却</div><button class="pauseBtn" id="pauseBtn" hidden aria-label="一時停止">Ⅱ</button><section class="screen" id="startScreen"><a class="backlink" href="/" aria-label="PLAYトップへ戻る">← PLAY</a><div class="card"><div class="eyebrow">ONE-FINGER ROGUELITE DEFENSE</div><h1>12波を守り切れ！<br>3択コア防衛サバイバル</h1><p class="lead">迫る敵を<strong>指で狙って撃つ</strong>。撃ちすぎると砲塔が止まる。波をしのぐたび、3択で兵器が変わる。</p><div class="how"><div><b>① 押して狙う</b><span>指の方向へ自動射撃。危険な敵から落とす。</span></div><div><b>② 離して冷却</b><span>赤くなる前に休む。ボスは光る弱点を狙う。</span></div></div><button class="primary" id="startBtn">防衛開始</button><div class="minor">1プレイ約3分・毎回ビルドが変化</div></div></section><section class="screen upgradeScreen" id="upgradeScreen" hidden><div class="card upgradeCard"><div class="upgradeHead"><div><div class="eyebrow">WAVE CLEAR</div><h2>1つだけ強化</h2></div><span id="buildLabel">BUILD Lv.0</span></div><div class="choices" id="choices"></div></div></section><section class="screen" id="endScreen" hidden><div class="card"><div class="eyebrow" id="endEyebrow">RUN RESULT</div><div id="bestBadge"></div><h2 class="endTitle" id="endTitle">防衛失敗</h2><p class="lead" id="endLead"></p><div class="stats"><div class="stat"><b id="endWave">0</b><span>到達WAVE</span></div><div class="stat"><b id="endKills">0</b><span>撃破</span></div><div class="stat"><b id="endBuild">0</b><span>強化数</span></div></div><div class="endReason" id="endReason"></div><div class="actions"><button class="retry" id="retryBtn">もう1回</button><button id="shareBtn">結果をシェア</button></div></div></section></main></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hud=document.getElementById('hud'),heatFill=document.getElementById('heatFill'),heatText=document.getElementById('heatText'),waveText=document.getElementById('waveText'),hpText=document.getElementById('hpText'),killText=document.getElementById('killText'),startScreen=document.getElementById('startScreen'),upgradeScreen=document.getElementById('upgradeScreen'),endScreen=document.getElementById('endScreen'),choicesEl=document.getElementById('choices'),hint=document.getElementById('hint'),pauseBtn=document.getElementById('pauseBtn');const W=390,H=720,TOTAL_WAVES=12,TURRET={x:195,y:610};let last=performance.now(),audio=null,enemies=[],bullets=[],particles=[],arcs=[],floaters=[];const game={running:false,paused:false,overlay:false,wave:0,waveClock:0,waveDuration:11,spawnClock:0,kills:0,core:100,maxCore:100,heat:0,maxHeat:100,overheated:false,firing:false,aimX:195,aimY:180,fireClock:0,shake:0,flash:0,barrier:0,barrierMax:0,buildCount:0,lastFailure:'',bossAlive:false};const stats={damage:15,fireInterval:.115,cooling:39,heatShot:8.2,bulletSpeed:650,pierce:0,spread:0,crit:.05,critMult:2,chainEvery:0,chainDamage:.5};const levels={damage:0,rate:0,cooling:0,heat:0,pierce:0,spread:0,crit:0,chain:0,repair:0,barrier:0};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];function initAudio(){if(audio)return;try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch{}}function beep(freq=220,dur=.04,type='square',vol=.025){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}function vibrate(ms=8){try{navigator.vibrate?.(ms)}catch{}}function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}addEventListener('resize',resize,{passive:true});resize();function reset(){enemies=[];bullets=[];particles=[];arcs=[];floaters=[];Object.assign(game,{running:true,paused:false,overlay:false,wave:0,waveClock:0,spawnClock:0,kills:0,core:100,maxCore:100,heat:0,maxHeat:100,overheated:false,firing:false,aimX:195,aimY:180,fireClock:0,shake:0,flash:0,barrier:0,barrierMax:0,buildCount:0,lastFailure:'',bossAlive:false});Object.assign(stats,{damage:15,fireInterval:.115,cooling:39,heatShot:8.2,bulletSpeed:650,pierce:0,spread:0,crit:.05,critMult:2,chainEvery:0,chainDamage:.5});Object.keys(levels).forEach(k=>levels[k]=0);hud.hidden=false;pauseBtn.hidden=false;startScreen.hidden=true;upgradeScreen.hidden=true;endScreen.hidden=true;hint.classList.remove('hide');setTimeout(()=>hint.classList.add('hide'),6500);startWave()}function showBanner(big,sub='',kind=''){const b=document.getElementById('banner');b.className='banner '+kind;document.getElementById('bannerBig').textContent=big;document.getElementById('bannerSub').textContent=sub;b.classList.add('show');clearTimeout(showBanner.t);showBanner.t=setTimeout(()=>b.classList.remove('show'),1100)}function startWave(){game.wave++;game.waveClock=0;game.spawnClock=.15;game.overlay=false;game.barrier=game.barrierMax;game.bossAlive=false;upgradeScreen.hidden=true;showBanner(game.wave%4===0?'BOSS WAVE':`WAVE ${game.wave}`,game.wave%4===0?'光る弱点を撃ち抜け':'コアを守れ',game.wave%4===0?'boss':'');if(game.wave%4===0)setTimeout(spawnBoss,700);syncHud()}function enemyBase(type){const scale=1+(game.wave-1)*.09,lane=pick([78,140,195,250,312])+rand(-16,16);if(type==='runner')return{x:lane,y:-25,r:11,hp:24*scale,maxHp:24*scale,speed:76+game.wave*2,damage:8,kind:type,score:1,wobble:rand(0,6)};if(type==='brute')return{x:lane,y:-30,r:18,hp:92*scale,maxHp:92*scale,speed:30+game.wave*.8,damage:18,kind:type,score:3,wobble:rand(0,6)};if(type==='splitter')return{x:lane,y:-25,r:15,hp:52*scale,maxHp:52*scale,speed:44+game.wave*1.1,damage:11,kind:type,score:2,wobble:rand(0,6)};return{x:lane,y:-25,r:13,hp:39*scale,maxHp:39*scale,speed:52+game.wave*1.4,damage:10,kind:'drone',score:1,wobble:rand(0,6)}}function spawnEnemy(){let pool=['drone','drone','runner'];if(game.wave>=3)pool.push('brute');if(game.wave>=5)pool.push('splitter');if(game.wave>=7)pool.push('runner','brute');enemies.push(enemyBase(pick(pool)))}function spawnBoss(){if(!game.running||game.overlay)return;const mult=1+(game.wave/4-1)*.75;enemies.push({x:195,y:-70,r:42,hp:820*mult,maxHp:820*mult,speed:15+game.wave*.25,damage:35,kind:'boss',score:20,wobble:0,weakAngle:0,stun:0});game.bossAlive=true;beep(95,.25,'sawtooth',.04)}function fireOne(angle,m=1){bullets.push({x:TURRET.x,y:TURRET.y-7,vx:Math.cos(angle)*stats.bulletSpeed,vy:Math.sin(angle)*stats.bulletSpeed,r:3,life:1.1,damage:stats.damage*m,pierce:stats.pierce,hit:new Set()})}function shoot(){const a=Math.atan2(game.aimY-TURRET.y,game.aimX-TURRET.x);if(!stats.spread)fireOne(a);else{const n=stats.spread===1?3:5;for(let i=0;i<n;i++)fireOne(a+(i-(n-1)/2)*.085,stats.spread===1?.72:.56)}game.heat+=stats.heatShot*(1+stats.spread*.11);game.fireClock=stats.fireInterval;beep(180+Math.random()*35,.025,'square',.012);for(let i=0;i<2;i++)particle(TURRET.x+Math.cos(a)*19,TURRET.y+Math.sin(a)*19,'#8df5ff',rand(1.5,3.2),rand(60,130),a+rand(-.25,.25),.18);if(game.heat>=game.maxHeat){game.heat=game.maxHeat;game.overheated=true;game.firing=false;showBanner('OVERHEAT','離して冷却');beep(80,.16,'sawtooth',.04);vibrate(25)}}function particle(x,y,color,size=2,speed=80,angle=Math.random()*Math.PI*2,life=.5){particles.push({x,y,color,size,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life,max:life})}function floater(x,y,text,color='#fff'){floaters.push({x,y,text,color,life:.65,max:.65})}function damageEnemy(e,amt,crit=false,weak=false){e.hp-=amt;if(weak){e.stun=.75;game.shake=Math.max(game.shake,5);showBanner('WEAK POINT!','ボス停止','clear');beep(520,.08,'square',.045);vibrate(18)}else if(crit)beep(390,.035,'square',.02);floater(e.x,e.y-e.r-4,Math.round(amt)+(weak?' ×3':''),weak?'#ffd166':crit?'#72f6ff':'#dff7ff');if(e.hp<=0)killEnemy(e)}function killEnemy(e){if(e.dead)return;e.dead=true;game.kills+=e.score||1;game.shake=Math.max(game.shake,e.kind==='boss'?8:2.5);beep(e.kind==='boss'?110:260,e.kind==='boss'?.2:.04,e.kind==='boss'?'sawtooth':'triangle',e.kind==='boss'?.06:.018);for(let i=0;i<(e.kind==='boss'?34:7);i++)particle(e.x,e.y,e.kind==='boss'?'#ff657b':'#63f0ff',rand(1.5,4.5),rand(50,220),Math.random()*Math.PI*2,rand(.25,.8));if(e.kind==='splitter')for(let j=0;j<2;j++){const s=enemyBase('runner');s.x=e.x+rand(-10,10);s.y=e.y;s.hp*=.58;s.maxHp=s.hp;s.speed*=1.08;enemies.push(s)}if(e.kind==='boss'){game.bossAlive=false;showBanner('BOSS BREAK','次の強化へ','clear')}}function chainFrom(e,d){if(!stats.chainEvery)return;game._hitCounter=(game._hitCounter||0)+1;if(game._hitCounter%stats.chainEvery)return;const ts=enemies.filter(x=>!x.dead&&x!==e).sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y)).slice(0,2);for(const t of ts)if(Math.hypot(t.x-e.x,t.y-e.y)<=150){arcs.push({x1:e.x,y1:e.y,x2:t.x,y2:t.y,life:.13,max:.13});damageEnemy(t,d*stats.chainDamage)}}function hitCore(e){if(game.barrier>0){game.barrier--;showBanner('BARRIER','1体ブロック','clear');for(let i=0;i<16;i++)particle(TURRET.x,TURRET.y+5,'#65f5cb',3,rand(70,180),Math.random()*Math.PI*2,.5);beep(600,.08,'sine',.03);e.dead=true;return}game.core-=e.damage;game.lastFailure=e.kind==='runner'?'速い敵の処理が遅れた':e.kind==='brute'?'硬い敵へ撃ち込み過ぎ、後続を通した':e.kind==='boss'?'ボスの弱点を壊し切れなかった':'敵の優先順位で後手に回った';game.shake=8;game.flash=.18;beep(55,.11,'sawtooth',.05);vibrate(30);e.dead=true;if(game.core<=0){game.core=0;finish(false)}}function update(dt){if(!game.running||game.paused||game.overlay)return;game.waveClock+=dt;game.spawnClock-=dt;game.fireClock-=dt;game.flash=Math.max(0,game.flash-dt);game.shake=Math.max(0,game.shake-dt*18);if(game.firing&&!game.overheated&&game.fireClock<=0)shoot();game.heat=Math.max(0,game.heat-stats.cooling*dt*(game.firing?.55:1));if(game.overheated&&game.heat<=game.maxHeat*.32){game.overheated=false;showBanner('COOLED','射撃復帰','clear')}if(game.wave%4!==0&&game.waveClock<game.waveDuration&&game.spawnClock<=0){spawnEnemy();game.spawnClock=Math.max(.27,.72-game.wave*.025)*rand(.78,1.18)}for(const e of enemies){if(e.dead)continue;if(e.stun>0)e.stun-=dt;else{const dx=TURRET.x-e.x,dy=TURRET.y-e.y,d=Math.hypot(dx,dy)||1,wig=e.kind==='boss'?Math.sin(game.waveClock*1.5)*18:Math.sin(game.waveClock*2+e.wobble)*7;e.x+=(dx/d*e.speed+wig*.18)*dt;e.y+=dy/d*e.speed*dt}if(e.kind==='boss')e.weakAngle+=dt*2.1;if(Math.hypot(e.x-TURRET.x,e.y-TURRET.y)<e.r+26)hitCore(e)}for(const b of bullets){if(b.dead)continue;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<-30||b.x>W+30||b.y<-40||b.y>H+40){b.dead=true;continue}for(const e of enemies){if(e.dead||b.hit.has(e))continue;let weak=false,hit=false;if(e.kind==='boss'){const wx=e.x+Math.cos(e.weakAngle)*e.r*.72,wy=e.y+Math.sin(e.weakAngle)*e.r*.72;if(Math.hypot(b.x-wx,b.y-wy)<b.r+10){weak=hit=true}else hit=Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r}else hit=Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r;if(hit){b.hit.add(e);const crit=Math.random()<stats.crit,amt=b.damage*(crit?stats.critMult:1)*(weak?3:1);damageEnemy(e,amt,crit,weak);chainFrom(e,b.damage);for(let i=0;i<3;i++)particle(b.x,b.y,weak?'#ffd166':'#9df5ff',rand(1,2.5),rand(30,90),Math.random()*Math.PI*2,.22);if(b.pierce>0)b.pierce--;else{b.dead=true;break}}}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt}for(const a of arcs)a.life-=dt;for(const f of floaters){f.y-=22*dt;f.life-=dt}enemies=enemies.filter(e=>!e.dead);bullets=bullets.filter(b=>!b.dead);particles=particles.filter(p=>p.life>0);arcs=arcs.filter(a=>a.life>0);floaters=floaters.filter(f=>f.life>0);const ended=game.wave%4===0?(!game.bossAlive&&game.wave ,-16,32,32);ctx.strokeRect(-16,-16,32,32);ctx.fillStyle='#071018';ctx.fillRect(-6,-5,12,10)}else if(e.kind==='splitter'){ctx.fillStyle='#70e9a5';ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2;ctx.lineTo(Math.cos(a)*15,Math.sin(a)*15)}ctx.closePath();ctx.fill();ctx.strokeStyle='#0b4';ctx.stroke()}else{ctx.fillStyle='#55c7ff';ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dff9ff';ctx.fillRect(-4,-5,8,10)}ctx.restore();if(e.hp<e.maxHp||e.kind==='boss'){const bw=e.kind==='boss'?84:30,x=e.x-bw/2,y=e.y-e.r-11;ctx.fillStyle='#0008';ctx.fillRect(x,y,bw,4);ctx.fillStyle=e.kind==='boss'?'#ff6479':'#6ce9aa';ctx.fillRect(x,y,bw*hp,4)}}function drawTurret(){const a=Math.atan2(game.aimY-TURRET.y,game.aimX-TURRET.x);ctx.save();ctx.translate(TURRET.x,TURRET.y);ctx.fillStyle=game.core<=30?'#6a1d2a':'#0d3442';ctx.strokeStyle=game.core<=30?'#ff657a':'#65eaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,31,0,Math.PI*2);ctx.fill();ctx.stroke();if(game.barrier>0){ctx.strokeStyle='#63f5c4aa';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(0,0,41,0,Math.PI*2);ctx.stroke();ctx.setLineDash([])}ctx.rotate(a);ctx.fillStyle=game.overheated?'#ff6178':'#baf7ff';ctx.fillRect(0,-6,36,12);ctx.fillStyle='#173a48';ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.restore();if(game.running&&!game.overlay){ctx.strokeStyle=game.overheated?'#ff617844':'#7deeff26';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(TURRET.x,TURRET.y);ctx.lineTo(game.aimX,game.aimY);ctx.stroke();ctx.fillStyle=game.overheated?'#ff6178':'#7deeff';ctx.beginPath();ctx.arc(game.aimX,game.aimY,5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#7deeff55';ctx.beginPath();ctx.arc(game.aimX,game.aimY,12,0,Math.PI*2);ctx.stroke()}}function render(){ctx.save();ctx.translate(game.shake?rand(-game.shake,game.shake):0,game.shake?rand(-game.shake,game.shake):0);drawGrid();for(const a of arcs){ctx.globalAlpha=a.life/a.max;ctx.strokeStyle='#72f5ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x1,a.y1);ctx.lineTo((a.x1+a.x2)/2+rand(-8,8),(a.y1+a.y2)/2+rand(-8,8));ctx.lineTo(a.x2,a.y2);ctx.stroke();ctx.globalAlpha=1}for(const e of enemies)drawEnemy(e);for(const b of bullets){ctx.fillStyle='#d9fbff';ctx.shadowBlur=8;ctx.shadowColor='#62efff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawTurret();for(const f of floaters){ctx.globalAlpha=clamp(f.life/f.max,0,1);ctx.fillStyle=f.color;ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)}ctx.globalAlpha=1;ctx.restore();if(game.flash>0){ctx.fillStyle=`rgba(255,70,90,${game.flash*1.6})`;ctx.fillRect(0,0,W,H)}}function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}canvas.addEventListener('pointerdown',e=>{if(!game.running||game.paused||game.overlay)return;canvas.setPointerCapture?.(e.pointerId);const p=point(e);game.aimX=p.x;game.aimY=Math.min(p.y,TURRET.y-25);if(!game.overheated)game.firing=true;e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!game.running||game.paused||game.overlay)return;const p=point(e);game.aimX=p.x;game.aimY=Math.min(p.y,TURRET.y-25);if(e.buttons||e.pointerType==='touch')game.firing=!game.overheated;e.preventDefault()});const stop=e=>{game.firing=false;e.preventDefault?.()};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')game.firing=false});document.getElementById('startBtn').addEventListener('click',()=>{initAudio();audio?.resume?.();reset()});document.getElementById('retryBtn').addEventListener('click',()=>{initAudio();reset()});document.getElementById('shareBtn').addEventListener('click',async()=>{const txt=`コア防衛サバイバル｜WAVE ${game.wave}/${TOTAL_WAVES}・撃破 ${game.kills}\n3択ビルドで12波を守れる？`;try{if(navigator.share)await navigator.share({title:'コア防衛サバイバル',text:txt,url:location.href});else{await navigator.clipboard.writeText(txt+'\n'+location.href);showBanner('コピーした','友だちに挑戦状を送ろう','clear')}}catch{}});pauseBtn.addEventListener('click',()=>{game.paused=!game.paused;game.firing=false;pauseBtn.textContent=game.paused?'▶':'Ⅱ';showBanner(game.paused?'PAUSE':'RESUME',game.paused?'▶で再開':'')});window.__GAME_QA__={getState:()=>({running:game.running,paused:game.paused,overlay:game.overlay,wave:game.wave,waveClock:+game.waveClock.toFixed(2),core:+game.core.toFixed(1),heat:+game.heat.toFixed(1),kills:game.kills,enemies:enemies.length,build:game.buildCount,bossAlive:game.bossAlive,overheated:game.overheated}),getUpgrades:()=>({...levels}),getTargets:()=>enemies.filter(e=>!e.dead).map(e=>({x:+e.x.toFixed(1),y:+e.y.toFixed(1),kind:e.kind,hp:+e.hp.toFixed(1),maxHp:+e.maxHp.toFixed(1),weakAngle:e.weakAngle||0,r:e.r})),version:'1.0.1'}})();
