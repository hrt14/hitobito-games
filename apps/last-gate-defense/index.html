<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#10151d" />
  <title>最後の城門 | 3本の道を1門の大砲で守れ</title>
  <meta name="description" content="3本の進路に迫る敵を見極め、1門の大砲と油壺で城門を守り切る短時間ディフェンスゲーム。" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app" id="app">
    <section class="hero" id="startScreen">
      <div class="eyebrow">HITOBITO PLAY</div>
      <h1>最後の城門</h1>
      <p class="tagline">3本の道。1門の大砲。<br><strong>危ない場所を見抜いて撃て。</strong></p>
      <div class="miniRules" aria-label="遊び方">
        <span>① 敵の群れをタップ</span>
        <span>② 大砲でまとめて吹き飛ばす</span>
        <span>③ 波の間に強化を1つ選ぶ</span>
      </div>
      <button class="primary" id="startButton">防衛を始める</button>
      <div class="best" id="bestLabel">BEST WAVE 0</div>
    </section>

    <section class="game hidden" id="gameScreen" aria-live="polite">
      <header class="hud">
        <div class="hudItem"><small>城門</small><strong id="gateHp">100</strong></div>
        <div class="hudItem center"><small>WAVE</small><strong><span id="waveNo">1</span>/8</strong></div>
        <div class="hudItem"><small>討伐</small><strong id="kills">0</strong></div>
      </header>

      <div class="gateBar" aria-label="城門耐久"><div class="gateBarFill" id="gateBarFill"></div></div>

      <div class="battleWrap" id="battleWrap">
        <canvas id="battle" width="390" height="610" aria-label="戦場。敵の群れをタップして砲撃します"></canvas>
        <div class="callout" id="callout"></div>
        <div class="waveBanner" id="waveBanner"></div>
      </div>

      <div class="controls">
        <button class="oilButton" id="oilButton" aria-label="油壺を使う">
          <span class="skillIcon">🔥</span>
          <span class="skillText"><strong>油壺</strong><small id="oilStatus">READY</small></span>
        </button>
        <div class="cannonPanel">
          <div class="cannonTop"><span>主砲</span><strong id="cannonStatus">READY</strong></div>
          <div class="reloadTrack"><div class="reloadFill" id="reloadFill"></div></div>
          <small>敵の群れをタップして砲撃</small>
        </div>
      </div>
    </section>

    <section class="overlay hidden" id="upgradeOverlay">
      <div class="panel">
        <div class="eyebrow">WAVE CLEAR</div>
        <h2>次の波までに1つ強化</h2>
        <div class="cards" id="upgradeCards"></div>
      </div>
    </section>

    <section class="overlay hidden" id="resultOverlay">
      <div class="panel resultPanel">
        <div class="eyebrow" id="resultEyebrow">DEFENSE FAILED</div>
        <h2 id="resultTitle">城門、陥落</h2>
        <div class="resultStats">
          <div><small>到達</small><strong id="resultWave">WAVE 1</strong></div>
          <div><small>討伐</small><strong id="resultKills">0</strong></div>
        </div>
        <p id="lessonText"></p>
        <button class="primary" id="retryButton">もう一度守る</button>
        <a class="homeLink" href="../../">PLAYへ戻る</a>
      </div>
    </section>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
