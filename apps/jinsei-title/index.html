<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>人生にタイトルをつけろ | LEVEL UP</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;--a:#ffd166;--b:#ff8c42;--g:rgba(255,209,102,.22);color:#f6f7f9;background:#090b10}*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow-x:hidden}button,input{font:inherit}.app{min-height:100dvh;background:radial-gradient(circle at 86% 12%,var(--g),transparent 32%),radial-gradient(circle at 10% 88%,rgba(255,255,255,.05),transparent 28%),#090b10;transition:.4s}.chapter{--a:#ffd166;--b:#ff8c42;--g:rgba(255,209,102,.24)}.foreshadow{--a:#8ec5fc;--b:#a777e3;--g:rgba(142,197,252,.23)}.reframe{--a:#7ae582;--b:#25a18e;--g:rgba(122,229,130,.22)}.challenge{--a:#ff6b6b;--b:#f06595;--g:rgba(255,107,107,.22)}.space{--a:#b8c0ff;--b:#c8b6ff;--g:rgba(184,192,255,.2)}.observe{--a:#90e0ef;--b:#48cae4;--g:rgba(144,224,239,.2)}header,main{width:min(760px,100%);margin:auto}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top) 18px 0;color:#8f98a8;font-size:11px;font-weight:900;letter-spacing:.14em}header b{color:#fff}.sound{width:40px;height:40px;border-radius:14px;border:1px solid #ffffff16;background:#ffffff0b;color:#fff}main{padding:18px 18px 54px}.in{animation:in .3s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.k{font-size:11px;color:var(--a);font-weight:950;letter-spacing:.12em}h1{font-size:clamp(38px,11vw,68px);line-height:.95;letter-spacing:-.06em;margin:18px 0}p{color:#c4cad4;line-height:1.75}.box,.scene,.score{border:1px solid #ffffff17;background:#ffffff0b;border-radius:26px;box-shadow:0 25px 65px #0006}.box{padding:22px}.demo{background:#05070b;border-radius:18px;padding:17px;margin:14px 0 20px}.demo small{display:block;color:#7e8797;margin-bottom:7px}.demo b{font-size:20px}.primary{width:100%;min-height:58px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));color:#0a0c10;font-weight:950;padding:13px 16px}.progress{display:flex;align-items:center;gap:12px;color:#8f98a8;font-size:11px;margin-bottom:13px}.track{height:5px;background:#ffffff12;border-radius:20px;flex:1;overflow:hidden}.track i{display:block;height:100%;background:var(--a)}.scene{min-height:255px;padding:25px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.scene:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-50px;top:-50px;background:var(--a);opacity:.13;box-shadow:-105px 105px 0 color-mix(in srgb,var(--b) 24%,transparent)}.scene small,.scene h2{position:relative}.scene small{color:#aeb6c3;font-weight:800}.scene h2{font-size:clamp(29px,8vw,46px);line-height:1.06;letter-spacing:-.04em;margin:10px 0 0}.prompt{color:var(--a);font-weight:950;font-size:12px;letter-spacing:.08em;margin:24px 0 10px}.row{display:flex;gap:9px}.title{min-width:0;flex:1;height:60px;border-radius:17px;border:1px solid #ffffff1c;background:#ffffff0c;color:#fff;padding:0 16px;font-size:17px;font-weight:850;outline:0}.title:focus{border-color:var(--a);box-shadow:0 0 0 4px var(--g)}.go{width:68px}.hints{display:flex;overflow:auto;gap:7px;padding:10px 0;scrollbar-width:none}.hint{flex:none;border:1px solid #ffffff15;background:#ffffff08;color:#b7bfcb;border-radius:999px;padding:8px 11px;font-size:11px}.bigtitle{font-size:clamp(32px,9vw,56px);line-height:1;letter-spacing:-.05em;margin:12px 0 17px}.pill{display:inline-flex;border:1px solid color-mix(in srgb,var(--a) 38%,transparent);background:color-mix(in srgb,var(--a) 10%,transparent);color:var(--a);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:950}.choices{display:grid;gap:9px;margin-top:10px}.choice{min-height:62px;text-align:left;border:1px solid #ffffff16;background:#ffffff0a;color:#fff;border-radius:17px;padding:13px 15px;font-weight:850;display:flex;justify-content:space-between;align-items:center}.choice span{color:var(--a)}.score{padding:22px}.num{font-size:62px;font-weight:950;letter-spacing:-.06em}.num small{font-size:16px;color:#87909f}.bars{display:grid;gap:12px;margin:23px 0}.br{display:grid;grid-template-columns:82px 1fr 34px;gap:9px;align-items:center;color:#b8c0cc;font-size:11px}.bar{height:6px;background:#ffffff12;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.hist{display:grid;gap:7px;margin:14px 0}.hi{border:1px solid #ffffff12;background:#ffffff08;border-radius:14px;padding:12px}.hi small{display:block;color:#7e8797;margin-bottom:4px}.note{text-align:center;color:#737d8d;font-size:10px;line-height:1.6;margin-top:20px}.shake{animation:s .28s}@keyframes s{25%{transform:translateX(-4px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}@media(min-width:700px){main{padding-top:34px}.scene{min-height:320px}.choices{grid-template-columns:1fr 1fr}.choice:first-child{grid-column:1/-1}}
</style></head><body><div id="root"></div><script>
const E=[
['仕事','突然、会社を辞めることになった。',['第二章が始まった日','肩書きを脱いだ朝','余白ができた'],['気になっていた仕事を調べる','まず生活を整える','会いたかった人に連絡する']],
['人間関係','大切な人と、うまく話せないまま別れた。',['言えなかった言葉の回','距離が教えてくれたこと','まだ終わっていない'],['自分の言葉を書き出す','距離を置いて日常へ戻る','短い一言だけ送る']],
['挑戦','半年かけた企画が、会議で却下された。',['ボツ案1号','弱点が見えた日','本番前の赤入れ'],['反対理由を3つ集める','別案として小さく試す','今日は撤退して休む']],
['偶然','楽しみにしていた旅行が、当日に中止になった。',['空白の休日','行かなかった旅の続き','予定外の一日'],['近所で未体験を1つ探す','次の旅程だけ決める','何もしない日にする']],
['失敗','本番で、頭が真っ白になった。',['忘れたくない30秒','練習では出なかった敵','次回のチェック項目'],['何が起きたか事実だけメモする','一人に感想を聞く','今日は評価を止める']],
['変化','長く続けてきた役割から外れることになった。',['役割のない自分','席を立った日','次の肩書きの前日'],['残したい経験を棚卸しする','新しい居場所を探す','予定をいったん減らす']],
['日常','今日は何も大きな成果を出せなかった。',['静かな一日','進まない日の仕事','何も起きなかった幸運'],['終わったことを3つ探す','明日の最初の1手だけ決める','そのまま寝る']],
['評価','SNSに、自分への厳しいコメントがついた。',['一件のコメント','刺さった言葉の正体','反応しなかった夜'],['使える指摘だけ抜き出す','信頼する人に見せる','画面を閉じる']]];
const L={chapter:['章を変える','↗','終点ではなく区切りとして編集しています。次の行動が見えやすいレンズ。',['章','始','スタート','次','前日','開幕','出発','再開']],foreshadow:['伏線にする','✦','意味を今ここで確定せず、未来に回収可能性を残すレンズ。',['伏線','10年後','未来','あとで','回収','いつか','続き','途中']],reframe:['意味をずらす','◇','同じ事実の別の面を拾い、意味の置き場所を変えるレンズ。',['教え','学','見え','気づ','残った','幸運','機会','材料','チェック']],challenge:['挑戦にする','⚡','出来事を攻略対象として編集するレンズ。休む選択も残します。',['敵','挑戦','戦','攻略','ボス','壁','試練','勝負']],space:['余白にする','◯','すぐ意味を決めず、空白のまま持つレンズ。前向きさを強制しません。',['余白','休','静か','空白','何もしない','保留','待つ']],observe:['事実を切り取る','◎','評価を足しすぎず、一場面として切り取るレンズ。',['一件','30秒','半年','朝','夜','日','回','記録','事実']]};
let S={n:0,i:0,p:'intro',t:'',l:'chapter',h:[],sc:{range:0,distance:0,motion:0,voice:0},sound:true},ctx,timer,beat=0;const R=document.querySelector('#root');
const x=s=>(s+'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lens(t){let z=Object.fromEntries(Object.keys(L).map(k=>[k,0]));for(const[k,v]of Object.entries(L))for(const q of v[3])if(t.includes(q))z[k]+=2+q.length/8;if(/[？?]/.test(t))z.observe+=1;if(/[！!]/.test(t))z.challenge+=1;if(/第[一二三四五六七八九十0-9]+章/.test(t))z.chapter+=3;let a=Object.entries(z).sort((a,b)=>b[1]-a[1]);return a[0][1]?a[0][0]:[...t].length<9?'observe':[...t].length>17?'foreshadow':'reframe'}
function score(t,l){let u=new Set([...t]),old=new Set(S.h.map(v=>v.l)),d={range:5+(old.has(l)?1:7)+(/今日|明日|朝|夜|年|日|未来|いつか/.test(t)?3:0),distance:6+(['space','observe'].includes(l)?6:2),motion:6+(['chapter','challenge'].includes(l)?7:2),voice:4+Math.min([...t].length,18)/2+(u.size>8?3:0)};for(let k in d)S.sc[k]=Math.min(100,S.sc[k]+Math.min(18,d[k]))}
function choices(e,l){let sig={chapter:'次の章の最初の1ページだけ決める',foreshadow:'今は結論を出さず「伏線候補」として記録する',reframe:'この出来事から残ったものを1つ探す',challenge:'次に同じ場面が来た時の攻略法を1つ作る',space:'今日は意味を決めず、余白のまま終える',observe:'評価を足さず、起きた事実だけ3行で残す'}[l],n={chapter:0,foreshadow:1,reframe:1,challenge:0,space:2,observe:0}[l],a=[...e[3].slice(n),...e[3].slice(0,n)];return[sig,a[0],a[1]]}
function stop(){if(timer)clearInterval(timer);timer=null;beat=0}function note(f){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type=S.l==='challenge'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.022,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.2);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.22)}function music(){stop();if(!S.sound)return;try{ctx||=new(window.AudioContext||window.webkitAudioContext)();let m={chapter:[262,330,392,523],foreshadow:[220,262,330,294],reframe:[294,370,440,370],challenge:[196,247,294,392],space:[175,220,196,220],observe:[247,294,277,247]}[S.l];note(m[0]);timer=setInterval(()=>note(m[beat++%4]),620)}catch(e){}}
function shell(c){return`<div class="app ${S.l}"><header><div><b>LEVEL UP</b> / EDIT LIFE</div><button class="sound">${S.sound?'♪':'×'}</button></header><main>${c}</main></div>`}function common(){document.querySelector('.sound').onclick=()=>{S.sound=!S.sound;S.sound&&S.p==='reveal'?music():stop();render()}}
function intro(){R.innerHTML=shell(`<section class="in"><div class="k">人生編集ゲーム</div><h1>人生に<br>タイトルをつけろ。</h1><p>出来事は変えられない。<br>でも、その出来事を物語のどこに置くかは編集できる。</p><div class="box"><div class="demo"><small>出来事：失業した。</small><b>「人生終了」 → 「第二章が始まった日」</b></div><p>正解はありません。ポジティブ変換もしなくていい。<b>一言で意味の置き場所を変える</b>ゲームです。</p><button class="primary start">最初の場面へ</button></div><div class="note">1プレイ8場面。つらい出来事を無理に美談化するゲームではありません。</div></section>`);common();document.querySelector('.start').onclick=()=>{S.p='title';render()}}
function title(){let e=E[S.i%E.length];R.innerHTML=shell(`<section class="in"><div class="progress"><div class="track"><i style="width:${S.n/8*100}%"></i></div>${S.n+1} / 8</div><div class="scene"><small>${e[0]}の場面</small><h2>${e[1]}</h2></div><div class="prompt">この場面にタイトルをつけろ</div><div class="row"><input class="title" maxlength="34" placeholder="例：第二章が始まった日"><button class="primary go">→</button></div><div class="hints">${e[2].map(v=>`<button class="hint">${v}</button>`).join('')}</div><div class="note">短くても、暗くても、疑問形でもOK。あなたの言葉で。</div></section>`);common();let q=document.querySelector('.title');q.focus({preventScroll:true});document.querySelectorAll('.hint').forEach(b=>b.onclick=()=>q.value=b.textContent);let go=()=>{let t=q.value.trim();if(!t){q.classList.add('shake');setTimeout(()=>q.classList.remove('shake'),300);return}S.t=t;S.l=lens(t);score(t,S.l);S.p='reveal';music();render()};document.querySelector('.go').onclick=go;q.onkeydown=e=>e.key==='Enter'&&go()}
function reveal(){let e=E[S.i%E.length],l=L[S.l],c=choices(e,S.l);R.innerHTML=shell(`<section class="in"><div class="k">TITLE LOCKED</div><h2 class="bigtitle">「${x(S.t)}」</h2><div class="pill">${l[1]}　${l[0]}</div><p>${l[2]}</p><div class="scene" style="min-height:170px"><small>タイトルが変える次のカット</small><h2 style="font-size:26px">同じ出来事から、見える選択肢が変わった。</h2></div><div class="prompt">次の1カットを選ぶ</div><div class="choices">${c.map(v=>`<button class="choice">${x(v)}<span>→</span></button>`).join('')}</div></section>`);common();document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{stop();S.h.push({e:e[1],t:S.t,l:S.l,c:b.textContent.replace('→','').trim()});S.n++;if(S.n>=8)S.p='result';else{S.i++;S.p='title'}render()})}
function result(){let labels={range:'見方の幅',distance:'距離を取る力',motion:'次へ動く力',voice:'自分の言葉'},total=Math.round(Object.values(S.sc).reduce((a,b)=>a+b,0)/4),cnt=S.h.reduce((a,v)=>(a[v.l]=(a[v.l]||0)+1,a),{}),fav=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]||'chapter',top=Object.entries(S.sc).sort((a,b)=>b[1]-a[1])[0][0];S.l=fav;R.innerHTML=shell(`<section class="in"><div class="k">EDIT REPORT</div><h1 style="font-size:48px">今日の編集力</h1><div class="score"><div class="num">${total}<small> / 100</small></div><p>よく使ったレンズ：<b style="color:var(--a)">${L[fav][0]}</b></p><div class="bars">${Object.entries(S.sc).map(([k,v])=>`<div class="br"><span>${labels[k]}</span><div class="bar"><i style="width:${v}%"></i></div><b>${Math.round(v)}</b></div>`).join('')}</div><p>今日は「${labels[top]}」が強く出ました。次は普段使わないレンズも試してみてください。</p></div><div class="prompt">今日つけたタイトル</div><div class="hist">${S.h.slice(-4).map(v=>`<div class="hi"><small>${x(v.e)}</small><b>「${x(v.t)}」</b></div>`).join('')}</div><button class="primary again">もう一度、別のタイトルで</button><div class="note">目的は「前向きになる」ことではなく、意味づけを自分で選び直せること。</div></section>`);common();document.querySelector('.again').onclick=()=>{let sound=S.sound;S={n:0,i:Math.floor(Math.random()*E.length),p:'title',t:'',l:'chapter',h:[],sc:{range:0,distance:0,motion:0,voice:0},sound};render()}}
function render(){({intro,title,reveal,result}[S.p])()}render();
</script></body></html>
