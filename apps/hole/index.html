<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#d9efe2" />
  <meta name="description" content="小さいものから飲み込み、穴を育てる。さっきまで障害物だったものが、成長すると獲物に変わっていくスケール成長ゲーム。" />
  <title>穴 - HOLE</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9efe2;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#10251c;touch-action:none;user-select:none}
    #game{display:block;width:100%;height:100%;touch-action:none}
    .hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .brand{font-weight:1000;font-size:22px;letter-spacing:-1px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);padding:9px 12px 8px;border-radius:17px;box-shadow:0 5px 18px rgba(26,61,45,.10)}
    .brand small{display:block;font-size:9px;letter-spacing:2.4px;opacity:.45;margin-bottom:1px}
    .meter{width:min(48vw,210px);background:rgba(255,255,255,.86);padding:9px 10px;border-radius:17px;box-shadow:0 5px 18px rgba(26,61,45,.10)}
    .meterline{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:900;opacity:.7;margin-bottom:5px}
    .track{height:7px;background:#d9e8df;border-radius:999px;overflow:hidden}
    #bar{height:100%;width:5%;background:#1d362a;border-radius:999px;transition:width .2s ease}
    #toast{position:fixed;left:50%;top:21%;transform:translate(-50%,-8px) scale(.96);opacity:0;background:rgba(15,28,22,.88);color:#fff;font-size:13px;font-weight:900;padding:9px 13px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.2);transition:.22s;pointer-events:none;white-space:nowrap}
    #toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
    .bottom{display:flex;justify-content:space-between;align-items:flex-end}
    .hint{background:rgba(255,255,255,.76);backdrop-filter:blur(10px);padding:9px 12px;border-radius:15px;font-weight:800;font-size:11px;line-height:1.35;box-shadow:0 5px 18px rgba(26,61,45,.08);transition:opacity .4s;max-width:205px}
    button{pointer-events:auto;border:0;font:inherit;color:inherit}
    #underBtn{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.9);box-shadow:0 7px 22px rgba(26,61,45,.15);font-size:24px;display:grid;place-items:center;position:relative}
    #count{position:absolute;right:-5px;top:-6px;min-width:23px;height:23px;border-radius:12px;background:#14281e;color:#fff;font-size:10px;font-weight:1000;display:grid;place-items:center;padding:0 5px}
    #underground{position:fixed;inset:0;background:linear-gradient(#16251f,#0d1713);color:#f5fff9;z-index:20;transform:translateY(103%);transition:transform .42s cubic-bezier(.2,.9,.2,1);pointer-events:auto;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom))}
    #underground.open{transform:translateY(0)}
    .ugHead{display:flex;align-items:center;justify-content:space-between}
    .ugHead h2{margin:0;font-size:22px;letter-spacing:-.6px}.ugHead p{font-size:10px;opacity:.55;margin:3px 0 0}
    #closeUg{background:#263830;color:#fff;width:42px;height:42px;border-radius:14px;font-size:20px}
    #pile{flex:1;position:relative;margin-top:18px;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#314c3f 0,#1b2d25 48%,#101b16 100%);box-shadow:inset 0 0 60px rgba(0,0,0,.38)}
    .pileItem{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));font-size:var(--s);filter:drop-shadow(0 8px 6px rgba(0,0,0,.4));animation:float 3s ease-in-out infinite alternate;animation-delay:var(--d)}
    @keyframes float{to{transform:translate(-50%,-54%) rotate(var(--r))}}
    #ending{position:fixed;inset:0;z-index:30;display:none;place-items:center;text-align:center;background:rgba(8,16,12,.82);backdrop-filter:blur(10px);color:white;padding:24px}
    #ending.show{display:grid}.endingCard{max-width:340px}.endingCard .big{font-size:64px}.endingCard h1{font-size:31px;margin:6px 0 10px}.endingCard p{opacity:.72;line-height:1.75;font-size:13px}.endingCard button{margin-top:14px;background:#fff;color:#14281e;border-radius:18px;padding:13px 18px;font-weight:1000}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="top">
      <div class="brand"><small>HOLE</small>穴</div>
      <div class="meter"><div class="meterline"><span id="sizeLabel">小石まで</span><span id="pct">0%</span></div><div class="track"><div id="bar"></div></div></div>
    </div>
    <div class="bottom"><div id="hint" class="hint">画面をなぞると穴が動く<br>小さいものから落としてみよう</div><button id="underBtn" aria-label="地下を見る">⬇️<span id="count">0</span></button></div>
  </div>
  <div id="toast"></div>
  <section id="underground">
    <div class="ugHead"><div><h2>地下世界</h2><p>落としたものは、ここで積み重なっている。</p></div><button id="closeUg">×</button></div>
    <div id="pile"></div>
  </section>
  <div id="ending"><div class="endingCard"><div class="big">🕳️</div><h1>地上が、なくなった。</h1><p>最初は小石しか落とせなかった穴が、最後には街のランドマークまで飲み込んだ。<br>地下には、あなたが作ったもうひとつの街が残っている。</p><button id="restart">もう一度、穴を開ける</button></div></div>
  <script src="game.js"></script>
</body>
</html>
