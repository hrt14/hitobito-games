<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f1e8">
<meta name="description" content="『人が集まるか不安』を、未検証の仮説と今日の1アクションに変えるLEVEL UPアプリ。">
<meta name="atsumaru-build" content="20260819-1240">
<title>集まる？ | LEVEL UP</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;--bg:#f4f1e8;--ink:#151515;--muted:#6c685f;--paper:#fffdf8;--line:rgba(21,21,21,.13);--accent:#ff5a36;--green:#d9ff68;--blue:#bdeeff;--amber:#ffe7a6;--shadow:0 22px 60px rgba(30,25,15,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}.app{height:100svh;min-height:620px;max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;overflow:hidden}.top{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px}.home{color:var(--ink);width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.6);text-decoration:none;font-size:18px}.brand{text-align:center;line-height:1}.brand b{display:block;font-size:11px;letter-spacing:.15em}.brand span{display:block;margin-top:4px;font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.14em}.step{min-width:62px;text-align:right;font-size:11px;font-weight:950}.step small{display:block;font-size:8px;color:var(--muted);letter-spacing:.08em}.progress{height:5px;border-radius:99px;background:rgba(21,21,21,.08);overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--ink);transition:width .25s}.screen{flex:1;min-height:0;display:flex;flex-direction:column}.panel{flex:1;min-height:0;border:1px solid var(--line);border-radius:30px;background:var(--paper);box-shadow:var(--shadow);padding:clamp(18px,5vw,32px);overflow:auto}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.16em;color:var(--muted)}h1{font-size:clamp(42px,12vw,74px);line-height:.9;letter-spacing:-.065em;margin:14px 0 12px}h1 em{font-style:normal;color:var(--accent)}.lead{font-size:14px;line-height:1.78;color:#555149;max-width:560px}.principle{margin-top:18px;padding:14px 15px;border-radius:18px;background:#f0ede5;font-size:11px;line-height:1.6}.principle b{display:block;font-size:9px;letter-spacing:.08em;margin-bottom:4px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:22px}.btn{border:0;border-radius:18px;min-height:56px;padding:0 17px;font-weight:950}.primary{background:var(--ink);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.btn:active,.state:active,.rate:active{transform:scale(.985)}
.question{display:flex;flex-direction:column;height:100%}.question h2{font-size:clamp(28px,7vw,42px);line-height:1.05;letter-spacing:-.05em;margin:10px 0 7px}.question p{font-size:12px;line-height:1.65;color:var(--muted);margin:0}.rate-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:20px}.rate{min-height:64px;border:1px solid var(--line);border-radius:17px;background:#fff;font-weight:950;font-size:18px}.rate span{display:block;font-size:8px;color:var(--muted);margin-top:3px}.rate.selected{background:var(--amber);border-color:rgba(21,21,21,.35)}.inputbox{margin-top:18px}.inputbox label{font-size:9px;font-weight:950;letter-spacing:.1em;color:var(--muted)}.inputbox input{margin-top:7px;width:100%;height:58px;border:1px solid var(--line);border-radius:17px;background:#fff;padding:0 14px;font-size:22px;font-weight:950;outline:none}.inputbox input:focus{box-shadow:inset 0 0 0 2px var(--ink)}.hint{font-size:9px;color:var(--muted);line-height:1.5;margin-top:6px}.bottom{margin-top:auto;padding-top:18px}
.hypotheses{display:grid;gap:10px;margin-top:16px}.hypo{border:1px solid var(--line);border-radius:20px;padding:13px;background:#fff}.hypo-head{display:flex;gap:10px;align-items:flex-start}.num{width:30px;height:30px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:950;font-size:11px;flex:0 0 auto}.hypo b{font-size:14px;line-height:1.35}.hypo p{font-size:10px;line-height:1.5;color:var(--muted);margin:4px 0 0}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.state{min-height:43px;border:1px solid var(--line);border-radius:13px;background:#f8f5ee;font-size:10px;font-weight:950}.state[data-value="evidence"].selected{background:var(--green)}.state[data-value="guess"].selected{background:var(--amber)}.state[data-value="unknown"].selected{background:var(--blue)}
.result-head{border-radius:24px;background:var(--ink);color:#fff;padding:18px;position:relative;overflow:hidden}.result-head:after{content:"?";position:absolute;right:8px;bottom:-38px;font-size:140px;font-weight:950;color:rgba(255,255,255,.07)}.result-head small{font-size:9px;color:#c4c1b9;font-weight:900;letter-spacing:.12em}.result-head h2{font-size:clamp(29px,8vw,44px);line-height:1;letter-spacing:-.05em;margin:9px 0 7px;max-width:560px;position:relative}.result-head p{font-size:11px;line-height:1.55;color:#d2d0ca;margin:0;max-width:560px;position:relative}.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.meter-item{border:1px solid var(--line);border-radius:15px;padding:10px 8px;background:#fff}.meter-item span{display:block;font-size:8px;color:var(--muted);font-weight:900}.meter-item b{display:block;font-size:12px;margin-top:4px}.meter-item.evidence{background:var(--green)}.meter-item.guess{background:var(--amber)}.meter-item.unknown{background:var(--blue)}.prescription{margin-top:12px;border-radius:20px;background:#fff;border:1px solid var(--line);padding:15px}.prescription .label{font-size:9px;font-weight:950;letter-spacing:.11em;color:var(--accent)}.prescription h3{font-size:21px;letter-spacing:-.04em;margin:7px 0 6px}.prescription p{font-size:11px;line-height:1.62;color:#57534c;margin:0}.one-action{margin-top:10px;border-radius:19px;background:var(--green);padding:14px}.one-action small{font-size:8px;font-weight:950;letter-spacing:.1em}.one-action b{display:block;font-size:15px;line-height:1.45;margin-top:5px}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.after{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.after-title{font-size:10px;font-weight:950}.after .rate-grid{margin-top:9px}.after .rate{min-height:48px;font-size:15px}.history{margin-top:10px;font-size:9px;line-height:1.5;color:var(--muted)}.toast{position:absolute;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;border-radius:999px;padding:9px 13px;font-size:9px;font-weight:900;transition:.18s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){.app{padding-left:9px;padding-right:9px}.panel{padding:17px}.hypotheses{gap:8px}.hypo{padding:11px}.states{gap:5px}.state{font-size:9px}.meter-item{padding:9px 6px}.meter-item b{font-size:11px}.actions{grid-template-columns:1fr}.actions .secondary{min-height:48px}.result-actions{grid-template-columns:1fr}.rate-grid{gap:5px}.rate{min-height:58px}}
@media(max-height:720px){.app{min-height:0}.panel{padding:15px}.lead{font-size:12px}.principle{margin-top:12px;padding:11px}.actions{margin-top:14px}.hypotheses{margin-top:10px;gap:6px}.hypo{padding:9px}.states{margin-top:7px}.state{min-height:38px}.question h2{font-size:28px}.inputbox{margin-top:12px}.inputbox input{height:50px}.bottom{padding-top:10px}.result-head{padding:14px}.result-head h2{font-size:27px}.prescription{padding:11px}.one-action{padding:11px}.after{margin-top:9px;padding-top:9px}.after .rate{min-height:42px}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
const FACTORS = [
  {id:'people',short:'人',title:'来てほしい人は、具体的に見えている？',desc:'「たくさんの人」ではなく、どんな人に来てほしいかを具体的に思い浮かべられる。',test:'来てほしい人を5人ぶん具体化する',detail:'実在でも想定でもいいので、来てほしい人を5人ぶん書く。その中の1人に近い相手へ「これなら参加したい？」と聞いてみる。'},
  {id:'reach',short:'届く',title:'その人たちに届く場所は、見えている？',desc:'SNS、知人、コミュニティ、店舗、学校、会社など、実際に接点を持てる場所がある。',test:'届きそうな場所を3つ書き、1つだけ試す',detail:'来てほしい人がいる場所を3つ書く。そのうち1つだけで小さく知らせて、見た人や反応した人を実際に数える。'},
  {id:'appeal',short:'魅力',title:'その人が「行きたい」と思う理由は、見えている？',desc:'楽しさ、役立ち、得られるもの、誰と会えるかなど、参加する理由を本人目線で言える。',test:'魅力の伝え方を3案つくる',detail:'同じ内容を3通りの言い方に変える。身近な人に「どれなら一番行ってみたい？」と選んでもらう。'},
  {id:'friction',short:'参加',title:'興味を持った人が、迷わず参加まで進める？',desc:'申込み、場所、日時、費用、必要な準備など、参加までの面倒や分かりにくさが少ない。',test:'参加までの流れを1人に試してもらう',detail:'案内から参加完了までを1人に説明なしでたどってもらう。止まった所、迷った所、面倒だった所を1つ直す。'}
];
const S = {screen:'hero',before:0,goal:100,answers:{},after:0};
const app = document.getElementById('app');
const toast = document.getElementById('toast');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
function pct(){return {hero:0,before:20,goal:40,audit:70,result:100}[S.screen]||0}
function shell(content,step){app.innerHTML=`<header class="top"><a class="home" href="/" aria-label="LEVEL UPトップへ">⌂</a><div class="brand"><b>集まる？</b><span>UNCERTAINTY → TEST</span></div><div class="step"><small>STEP</small>${step}</div></header><div class="progress"><i style="width:${pct()}%"></i></div><section class="screen">${content}</section>`}
function hero(){S.screen='hero';shell(`<div class="panel"><div class="eyebrow">BEFORE YOU GATHER PEOPLE</div><h1>人が<br><em>集まる？</em></h1><p class="lead">何かを始める前は、「誰も来なかったら」が頭に浮かぶ。<br>でも今あるのは失敗の証拠ではなく、まだ確かめていないこと。</p><div class="principle"><b>このアプリでやること</b>不安を「人・届く・魅力・参加」の4つに分ける。根拠が弱い1つを見つけて、今日の小さな確認に変える。</div><div class="actions"><button class="btn primary" id="start">不安を分解する →</button><button class="btn secondary" id="last">前回を見る</button></div></div>`, '0 / 4');document.getElementById('start').onclick=before;document.getElementById('last').onclick=showLast}
function before(){S.screen='before';shell(`<div class="panel question"><div class="eyebrow">BEFORE</div><h2>いま、どのくらい不安？</h2><p>正確じゃなくていい。今の感覚を置いておく。最後にもう一度だけ測る。</p><div class="rate-grid">${[1,2,3,4,5].map(n=>`<button class="rate ${S.before===n?'selected':''}" data-rate="${n}">${n}<span>${['小さい','少し','中くらい','強い','かなり'][n-1]}</span></button>`).join('')}</div><div class="bottom"><button class="btn primary" id="next" style="width:100%" ${S.before?'':'disabled'}>次へ →</button></div></div>`,'1 / 4');document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{S.before=+b.dataset.rate;before()});document.getElementById('next').onclick=goal}
function goal(){S.screen='goal';shell(`<div class="panel question"><div class="eyebrow">TARGET</div><h2>何人くらい来たらうれしい？</h2><p>大きな目標でもいい。ただし、今ここで「本当に集まるか」を当てようとはしない。</p><div class="inputbox"><label for="goalInput">目安の人数</label><input id="goalInput" type="number" inputmode="numeric" min="1" max="10000000" value="${esc(S.goal)}"><div class="hint">この数字は予測には使わない。大きな結果と、今日確かめることを切り分けるために使う。</div></div><div class="principle"><b>重要</b><strong id="goalText">${esc(S.goal)}人</strong>集まるかは、まだ分からなくていい。まず「何が分かっていないか」を見る。</div><div class="bottom"><button class="btn primary" id="next" style="width:100%">4つに分ける →</button></div></div>`,'2 / 4');const inp=document.getElementById('goalInput');inp.oninput=()=>{S.goal=Math.max(1,Number(inp.value)||1);document.getElementById('goalText').textContent=`${S.goal.toLocaleString()}人`};document.getElementById('next').onclick=audit}
function audit(){S.screen='audit';shell(`<div class="panel"><div class="eyebrow">UNCERTAINTY MAP</div><h2 style="font-size:32px;letter-spacing:-.05em;margin:9px 0 4px">分かってる？ 仮説？ 不明？</h2><p style="font-size:11px;line-height:1.6;color:var(--muted);margin:0">考え込まず、今ある根拠の強さで選ぶ。</p><div class="hypotheses">${FACTORS.map((f,i)=>`<div class="hypo"><div class="hypo-head"><div class="num">0${i+1}</div><div><b>${f.title}</b><p>${f.desc}</p></div></div><div class="states" data-factor="${f.id}">${[['evidence','根拠あり'],['guess','仮説'],['unknown','わからない']].map(([v,l])=>`<button class="state ${S.answers[f.id]===v?'selected':''}" data-value="${v}">${l}</button>`).join('')}</div></div>`).join('')}</div><div class="bottom"><button class="btn primary" id="resultBtn" style="width:100%" ${Object.keys(S.answers).length===FACTORS.length?'':'disabled'}>不安を「次の一手」に変える →</button></div></div>`,'3 / 4');document.querySelectorAll('.states').forEach(g=>g.querySelectorAll('.state').forEach(b=>b.onclick=()=>{S.answers[g.dataset.factor]=b.dataset.value;audit()}));document.getElementById('resultBtn').onclick=result}
function weakest(){const rank={unknown:0,guess:1,evidence:2};return FACTORS.slice().sort((a,b)=>(rank[S.answers[a.id]]??0)-(rank[S.answers[b.id]]??0))[0]}
function statusLabel(v){return v==='evidence'?'根拠あり':v==='guess'?'仮説':'不明'}
function result(){S.screen='result';const w=weakest();const unknowns=FACTORS.filter(f=>S.answers[f.id]!=='evidence').length;const allStrong=unknowns===0;const title=allStrong?'次は、小さく実際に集めてみる。':`まず「${w.short}」を確かめる。`;const action=allStrong?'小さく案内を出して、実際の反応を取る。':w.test;const detail=allStrong?'4つに根拠があるなら、次は全体を小さくつないで試す。案内を出して、見た人数・反応した人数・実際に来た人数を取り、次の打ち手を決める。':w.detail;const history=loadHistory();shell(`<div class="panel"><div class="result-head"><small>RESULT</small><h2>${title}</h2><p>目安${S.goal.toLocaleString()}人を今すぐ証明する必要はない。分からないことを1つ減らせば、次の判断は前より正確になる。</p></div><div class="meter">${FACTORS.map(f=>`<div class="meter-item ${S.answers[f.id]}"><span>${f.short}</span><b>${statusLabel(S.answers[f.id])}</b></div>`).join('')}</div><div class="prescription"><div class="label">PRESCRIPTION</div><h3>${esc(action)}</h3><p>${esc(detail)}</p></div><div class="one-action"><small>TODAY / ONE ACTION</small><b>${esc(action)}</b></div><div class="result-actions"><button class="btn primary" id="copy">今日の一手をコピー</button><button class="btn secondary" id="again">もう一度整理する</button></div><div class="after"><div class="after-title">今の不安は？</div><div class="rate-grid">${[1,2,3,4,5].map(n=>`<button class="rate ${S.after===n?'selected':''}" data-after="${n}">${n}</button>`).join('')}</div><div class="history">${history.length?`過去${history.length}回の記録あり。今回はAfterを選ぶと保存される。`:'Afterを選ぶと、Beforeとの変化を端末内に保存する。'}</div></div></div>`,'4 / 4');document.getElementById('copy').onclick=async()=>{const text=`人が集まる不安の次の一手：${action}\n目安：${S.goal.toLocaleString()}人\n理由：${detail}`;try{await navigator.clipboard.writeText(text);showToast('コピーしました')}catch{showToast('長押しでコピーしてください')}};document.getElementById('again').onclick=()=>{S.answers={};S.after=0;before()};document.querySelectorAll('[data-after]').forEach(b=>b.onclick=()=>{S.after=+b.dataset.after;save(w.id,action);result()})}
function loadHistory(){try{return JSON.parse(localStorage.getItem('levelup_atsumaru_history')||'[]')}catch{return []}}
function save(factor,action){const hist=loadHistory();const record={at:new Date().toISOString(),before:S.before,after:S.after,goal:S.goal,factor,action};hist.unshift(record);localStorage.setItem('levelup_atsumaru_history',JSON.stringify(hist.slice(0,20)));showToast(`不安 ${S.before} → ${S.after} を保存`)}
function showLast(){const h=loadHistory()[0];if(!h){showToast('まだ記録がありません');return}const label=FACTORS.find(f=>f.id===h.factor)?.short||'確認';alert(`前回\n不安 ${h.before} → ${h.after}\n目安 ${Number(h.goal).toLocaleString()}人\n焦点：${label}\n次の一手：${h.action}`)}
hero();
})();
</script>
</body>
</html>
