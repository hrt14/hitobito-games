<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{overscroll-behavior:none;-webkit-font-smoothing:antialiased}.app{min-height:100svh;background:#080b0b;color:var(--ink);overflow:hidden}.shell{width:min(100%,560px);min-height:100svh;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative}.shell:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 4px);opacity:.38;z-index:20}.top{height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}.brand{font-size:10px;font-weight:950;letter-spacing:.18em;color:var(--mint)}.year-chip{font-variant-numeric:tabular-nums;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.progress{height:4px;border-radius:99px;background:#ffffff0b;overflow:hidden;position:relative;z-index:2}.progress i{height:100%;display:block;width:0;background:var(--mint);box-shadow:0 0 20px rgba(186,255,203,.45);transition:width .25s ease}.screen{flex:1;display:flex;flex-direction:column;padding:20px 0 8px;position:relative;z-index:1;animation:enter .22s ease}.screen.center{justify-content:center}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.16em;color:var(--mint);margin-bottom:12px}.screen h1,.screen h2{letter-spacing:-.055em;line-height:1.02}.screen h1{font-size:clamp(42px,12vw,62px);margin:0 0 16px}.screen h2{font-size:clamp(31px,9vw,43px);margin:0 0 12px}.lead{font-size:14px;line-height:1.75;color:#c3cec9;margin:0 0 20px}.muted{color:var(--muted)}.micro{font-size:10px;line-height:1.6;color:#788681}.btn{width:100%;min-height:58px;border:0;border-radius:18px;padding:14px 17px;font:inherit;font-size:16px;font-weight:950;cursor:pointer;transition:transform .12s ease,opacity .12s ease}.btn:active,.choice:active,.mission:active,.sh 0%;top:30px;bottom:30px;width:2px;transform:translateX(-50%);background:linear-gradient(var(--mint),rgba(186,255,203,.12));box-shadow:0 0 22px rgba(186,255,203,.1)}.mark{position:absolute;left:0;width:100%;font-size:8px;color:#66766f;text-align:center;letter-spacing:.08em}.mark.top{top:5px}.mark.mid{top:48%}.mark.bottom{bottom:5px;color:var(--mint)}.capsule{position:absolute;left:50%;top:28px;width:62px;height:62px;transform:translate(-50%,0);border-radius:50%;border:1px solid var(--mint);background:#101b15;box-shadow:0 0 0 7px rgba(186,255,203,.04),0 0 40px rgba(186,255,203,.16);display:grid;place-items:center;cursor:grab;z-index:3}.capsule:active{cursor:grabbing}.capsule b{font-size:11px;letter-spacing:-.03em}.capsule.dragging{box-shadow:0 0 0 10px rgba(186,255,203,.06),0 0 60px rgba(186,255,203,.28)}.carry-copy{align-self:center;border:1px solid #ffffff10;background:var(--panel);border-radius:22px;padding:18px}.carry-copy .tag{font-size:8px;color:var(--mint);letter-spacing:.14em;font-weight:950}.carry-copy p{font-size:21px;line-height:1.45;font-weight:950;letter-spacing:-.035em;margin:12px 0}.carry-copy small{font-size:10px;line-height:1.55;color:var(--muted)}.drag-hint{text-align:center;font-size:10px;color:var(--muted);margin-top:2px}.drag-hint b{color:var(--mint)}.timer-card{border:1px solid var(--line);background:radial-gradient(circle at 50% 30%,rgba(186,255,203,.08),transparent 42%),#0d1211;border-radius:28px;padding:24px 18px;text-align:center;margin:14px 0}.timer-card .label{font-size:9px;font-weight:950;letter-spacing:.17em;color:var(--mint)}.timer{font-size:76px;line-height:1;font-variant-numeric:tabular-nums;font-weight:1000;letter-spacing:-.075em;margin:18px 0}.timer-mission{font-size:16px;line-height:1.45;font-weight:900;margin:0 auto;max-width:360px}.pulse{width:14px;height:14px;border-radius:50%;background:var(--mint);margin:20px auto 4px;box-shadow:0 0 0 0 rgba(186,255,203,.35);animation:pulse 2s infinite}.done-card{border:1px solid var(--line);background:var(--panel);border-radius:28px;padding:22px;margin:12px 0}.stamp{display:inline-flex;align-items:center;gap:7px;color:var(--mint);font-size:9px;font-weight:950;letter-spacing:.14em;border:1px solid var(--line);border-radius:999px;padding:7px 10px}.done-card h2{font-size:38px;margin:18px 0 12px}.result-mission{border-left:3px solid var(--mint);padding:8px 0 8px 14px;font-size:18px;line-height:1.45;font-weight:900}.statline{display:flex;gap:8px;margin-top:18px}.stat{flex:1;border:1px solid #ffffff0d;border-radius:15px;padding:12px}.stat b{display:block;font-size:24px}.stat span{font-size:8px;letter-spacing:.1em;color:var(--muted)}.share{border:1px solid #ffffff13;background:#ffffff06;color:#dce9e1;border-radius:14px;padding:12px 14px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.history{margin:18px 0 0}.history h3{font-size:9px;letter-spacing:.13em;color:var(--muted);margin:0 0 8px}.history-item{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid #ffffff0a}.history-item time{font-size:9px;color:#67766f}.history-item span{font-size:11px;line-height:1.45;color:#aebdb6}.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);width:min(calc(100% - 28px),520px);background:#edf8f0;color:#071009;border-radius:15px;padding:12px 14px;text-align:center;font-size:11px;font-weight:900;box-shadow:0 16px 40px #0008;z-index:50;animation:toast 1.8s both}.linkbtn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:850;padding:8px;cursor:pointer}.danger{color:var(--red)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes enter{from{opacity:0;transform:translateY(8px)}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(186,255,203,.35)}70%{box-shadow:0 0 0 18px rgba(186,255,203,0)}100%{box-shadow:0 0 0 0 rgba(186,255,203,0)}}@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,8px)}10%,86%{opacity:1;transform:translate(-50%,0)}}@media(max-width:390px){.choices{grid-template-columns:1fr}.choice{min-height:86px}.screen h1{font-size:42px}.carry-stage{grid-template-columns:66px 1fr;gap:12px}.carry-copy p{font-size:18px}.timer{font-size:67px}}@media(max-height:700px){.screen{padding-top:10px}.portal{height:145px;margin-bottom:14px}.ring.r1{width:132px;height:132px}.ring.r2{width:102px;height:102px}.ring.r3{width:72px;height:72px}.portal-year{font-size:29px}.carry-stage{min-height:310px}.year-track{min-height:310px}.timer-card{padding:18px}.timer{font-size:62px;margin:12px 0}}

<body><div id="app" class="app"></div>
<script>
(()=>{
'use strict';
const app=document.getElementById('app');
const STORE='levelup-10-years-back-v1';
const NOW_YEAR=2026;
const FUTURE_YEAR=2036;
const situations=[
  {id:'start',title:'やりたいのに、始めていない',desc:'仕事・勉強・制作・準備',future:'「いつか」を待ち続けた未来より、雑でも始めた日の記録を残したい。',missions:[
    ['入口だけ開く','必要なファイル・ページ・道具を開く。それで開始扱い。'],
    ['3分だけ手を動かす','完成を狙わず、最初の3分だけ作業する。'],
    ['最初の1工程だけ終える','全部ではなく、次の人に渡せる最小単位まで。']
  ]},
  {id:'contact',title:'言いたいのに、連絡していない',desc:'返信・相談・お願い・謝罪',future:'未来から見ると、完璧な文章より「連絡が始まった日」の方が大きい。',missions:[
    ['相手の画面だけ開く','送信はまだ不要。連絡先・メール・チャットを開く。'],
    ['1文だけ下書きする','挨拶＋要件を1文。整えるのはその後でいい。'],
    ['「少し話したい」とだけ送る','全部説明せず、会話の入口だけ作る。']
  ]},
  {id:'apply',title:'行きたいのに、予約・申込していない',desc:'予約・応募・申込・問い合わせ',future:'迷っている時間を増やすより、戻せる小さな手続きを1つ進めたい。',missions:[
    ['候補を1つだけ開く','比較は増やさない。第一候補の画面だけ開く。'],
    ['必要な条件を1個確認する','日程・価格・締切など、止まっている条件を1つ確認する。'],
    ['入力画面まで進む','送信はまだ不要。申込フォームを開いて入口まで進む。']
  ]},
  {id:'stop',title:'やめたいのに、続けている',desc:'惰性・見すぎ・やりすぎ',future:'10年分を一気に変えなくていい。次の1回だけ、別の選択にする。',missions:[
    ['次の1回だけやめる','永久に禁止しない。次に来る1回だけ見送る。'],
    ['10分だけ離す','対象を閉じる・伏せる・別の部屋に置く。10分だけ。'],
    ['再開する条件を決める','「いつまで」ではなく「何が終わったら」にする。']
  ]},
  {id:'decide',title:'決めたいのに、決めていない',desc:'選択・優先順位・方向性',future:'未来は正解を教えられない。でも、決めずに止まる時間は短くできる。',missions:[
    ['選択肢を2つまで減らす','3つ以上あるなら、今ないものを1つ落とす。'],
    ['決める期限を今日つける','結論ではなく、結論を出す時刻を先に決める。'],
    ['今日試せる方を選ぶ','戻せる方・小さく試せる方を先に実験する。']
  ]},
  {id:'clear',title:'片づけたいのに、そのまま',desc:'机・部屋・未処理・積み残し',future:'未来の自分が欲しいのは完璧な部屋ではなく、今日ひとつ減ったという事実。',missions:[
    ['1個だけ捨てる・戻す','目についた1個だけ定位置へ。そこで終えても成功。'],
    ['1面だけ空ける','机の角、棚1段、床30cmなど、面を1つ作る。'],
    ['3分タイマーで触る','分類せず、捨てる・戻すだけを3分。']
  ]}
];
let state={step:'intro',situation:null,mission:null,custom:'',timer:180,running:false,dragDone:false};
let timerId=null;
function load(){try{return JSON.parse(localStorage.getItem(STORE))||{logs:[]}}catch{return{logs:[]}}}
function save(data){try{localStorage.setItem(STORE,JSON.stringify(data))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function vibrate(ms=16){try{navigator.vibrate&&navigator.vibrate(ms)}catch{}}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),1850)}
function header(progress,label='TIME RETURN'){return `<div class="top"><div class="brand">LEVEL UP / ${label}</div><div class="year-chip">${NOW_YEAR} ← ${FUTURE_YEAR}</div></div><div class="progress"><i style="width:${progress}%"></i></div>`}
function render(){clearInterval(timerId);timerId=null;if(state.step==='intro')renderIntro();if(state.step==='choose')renderChoose();if(state.step==='future')renderFuture();if(state.step==='mission')renderMission();if(state.step==='carry')renderCarry();if(state.step==='timer')renderTimer();if(state.step==='done')renderDone()}
function renderIntro(){app.innerHTML=`<main class="shell">${header(8)}<section class="screen center"><div class="portal" aria-hidden="true"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="portal-year">${FUTURE_YEAR}</div><small>RETURN WINDOW / 03:00</small></div><div class="eyebrow">10年後のあなたが戻ってきた</div><h1>今日の分岐を<br>1つだけ変える。</h1><p class="lead">未来を全部やり直す時間はない。<br>今、止まっていることを1つ選んで、<b>今日の一手</b>だけ持ち帰る。</p><div class="actions"><button class="btn primary" id="start">3分だけ未来を変える</button></div><p class="micro">未来を予言するアプリではありません。10年後の視点を借りて、今できる行動を1つに絞るゲームです。</p></section></main>`;document.getElementById('start').onclick=()=>{state.step='choose';vibrate();render()}}
function renderChoose(){app.innerHTML=`<main class="shell">${header(22)}<section class="screen"><div class="eyebrow">STEP 1 / 何を救いに来た？</div><h2>今、止まっている<br>分岐はどれ？</h2><p class="lead">一番大きな悩みではなく、<b>今日1ミリ動かせるもの</b>を選ぶ。</p><div class="choices">${situations.map(s=>`<button class="choice ${state.situation===s.id?'selected':''}" data-id="${s.id}"><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></button>`).join('')}</div><div class="actions"><button class="btn primary" id="next" ${state.situation?'':'disabled'}>10年後のログを見る</button><button class="btn ghost" id="back">戻る</button></div></section></main>`;document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{state.situation=el.dataset.id;state.mission=null;vibrate(10);renderChoose()});document.getElementById('next').onclick=()=>{state.step='future';render()};document.getElementById('back').onclick=()=>{state.step='intro';render()}}
function currentSituation(){return situations.find(s=>s.id===state.situation)||situations[0]}
function renderFuture(){const s=currentSituation();app.innerHTML=`<main class="shell">${header(38)}<section class="screen"><div class="eyebrow">STEP 2 / FUTURE LOG</div><h2>10年後から見ると、<br>今日に戻りたかった。</h2><div class="future-log"><div class="future-head"><b>${FUTURE_YEAR} / PRIVATE LOG</b><span>${esc(s.desc)}</span></div><div class="timeline"><div class="time-row"><strong>今日</strong><p>「${esc(s.title)}」で止まっている。</p></div><div class="time-row"><strong>次の分岐</strong><p>大きな決断ではなく、今日の小さな一手を残せる。</p></div><div class="time-row"><strong>${FUTURE_YEAR}</strong><p>${esc(s.future)}</p></div></div><div class="future-note">※これは未来の予測ではなく、選択を考えるためのフィクションです。</div></div><div class="actions"><button class="btn primary" id="next">未来から一手を選ぶ</button><button class="btn ghost" id="back">選び直す</button></div></section></main>`;document.getElementById('next').onclick=()=>{state.step='mission';render()};document.getElementById('back').onclick=()=>{state.step='choose';render()}}
function renderMission(){const s=currentSituation();app.innerHTML=`<main class="shell">${header(54)}<section class="screen"><div class="eyebrow">STEP 3 / 1 ACTION ONLY</div><h2>未来から持ち帰れるのは、<br>1つだけ。</h2><p class="lead">「ちゃんとやる」は禁止。<b>3分で開始できる一手</b>にする。</p><div class="mission-list">${s.missions.map((m,i)=>`<button class="mission ${state.mission===`m${i}`?'selected':''}" data-id="m${i}"><small>MISSION 0${i+1}</small><strong>${esc(m[0])}</strong><span>${esc(m[1])}</span></button>`).join('')}</div><div class="custom"><input id="custom" maxlength="42" placeholder="自分の一手を42字以内で" value="${state.custom?esc(state.custom):''}"><button id="customBtn">採用</button></div><div class="actions"><button class="btn primary" id="next" ${(state.mission||state.custom.trim())?'':'disabled'}>2036年から持ち帰る</button><button class="btn ghost" id="back">戻る</button></div></section></main>`;document.querySelectorAll('.mission').forEach(el=>el.onclick=()=>{state.mission=el.dataset.id;state.custom='';vibrate(10);renderMission()});const input=document.getElementById('custom');input.oninput=()=>{state.custom=input.value;state.mission=null;document.getElementById('next').disabled=!state.custom.trim()};document.getElementById('customBtn').onclick=()=>{state.custom=input.value.trim();if(state.custom){state.mission=null;vibrate(10);renderMission()}};document.getElementById('next').onclick=()=>{state.custom=input.value.trim();state.step='carry';state.dragDone=false;render()};document.getElementById('back').onclick=()=>{state.step='future';render()}}
function chosenMission(){if(state.custom.trim())return state.custom.trim();const s=currentSituation();const idx=Number((state.mission||'m0').slice(1));return s.missions[idx]?.[0]||s.missions[0][0]}
function renderCarry(){const mission=chosenMission();app.innerHTML=`<main class="shell">${header(70)}<section class="screen carry"><div class="eyebrow">STEP 4 / BRING IT BACK</div><h2>その一手を、<br>今まで引き戻す。</h2><div class="carry-stage"><div class="year-track" id="track"><div class="year-line"></div><span class="mark top">${FUTURE_YEAR}</span><span class="mark mid">2031</span><span class="mark bottom">NOW</span><button class="capsule" id="capsule" aria-label="2036年のカプセルを2026年までドラッグ"><b>${FUTURE_YEAR}</b></button></div><div class="carry-copy"><div class="tag">CARRY ONE ACTION</div><p>${esc(mission)}</p><small>カプセルを下の「NOW」まで引く。<br>未来の話を、今日の行動に戻す。</small></div></div><div class="drag-hint">↓ <b>${FUTURE_YEAR}</b> を NOW までドラッグ</div><div class="actions"><button class="btn secondary" id="assist">ドラッグできない場合：今へ持ち帰る</button><button class="btn ghost" id="back">一手を選び直す</button></div></section></main>`;setupDrag();document.getElementById('assist').onclick=completeCarry;document.getElementById('back').onclick=()=>{state.step='mission';render()}}
function setupDrag(){const cap=document.getElementById('capsule'),track=document.getElementById('track');if(!cap||!track)return;let active=false,startY=0,startTop=28;const max=()=>Math.max(0,track.clientHeight-cap.offsetHeight-28);function move(y){const dy=y-startY;const top=Math.min(max(),Math.max(28,startTop+dy));cap.style.top=top+'px';cap.style.transform='translate(-50%,0)';const ratio=(top-28)/Math.max(1,max()-28);cap.querySelector('b').textContent=String(Math.round(FUTURE_YEAR-(FUTURE_YEAR-NOW_YEAR)*ratio));if(ratio>.84){completeCarry()}}cap.onpointerdown=e=>{active=true;startY=e.clientY;startTop=parseFloat(getComputedStyle(cap).top)||28;cap.classList.add('dragging');cap.setPointerCapture(e.pointerId);e.preventDefault()};cap.onpointermove=e=>{if(active)move(e.clientY)};cap.onpointerup=e=>{active=false;cap.classList.remove('dragging');try{cap.releasePointerCapture(e.pointerId)}catch{}};cap.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){e.preventDefault();completeCarry()}}}
function completeCarry(){if(state.dragDone)return;state.dragDone=true;vibrate(35);toast('未来から持ち帰った。次は3分だけ実行。');setTimeout(()=>{state.step='timer';state.timer=180;state.running=false;render()},500)}
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`}
function renderTimer(){const mission=chosenMission();app.innerHTML=`<main class="shell">${header(86,'ACTION WINDOW')}<section class="screen center"><div class="eyebrow">LAST STEP / 3 MINUTES</div><h2>未来はもういい。<br>今、3分だけ。</h2><div class="timer-card"><div class="label">TODAY'S ONE MOVE</div><div class="timer" id="timer">${fmt(state.timer)}</div><p class="timer-mission">${esc(mission)}</p><div class="pulse" aria-hidden="true"></div></div><div class="actions"><button class="btn primary" id="toggle">${state.running?'一時停止':'3分スタート'}</button><button class="btn secondary" id="done">できた / もう着手した</button><button class="btn ghost" id="skip">今日はここまで</button></div><p class="micro">3分で終わらなくてOK。目的は「始めた」という分岐を作ること。</p></section></main>`;document.getElementById('toggle').onclick=()=>{state.running=!state.running;vibrate(10);renderTimer()};document.getElementById('done').onclick=()=>finish(true);document.getElementById('skip').onclick=()=>finish(false);if(state.running){timerId=setInterval(()=>{state.timer=Math.max(0,state.timer-1);const el=document.getElementById('timer');if(el)el.textContent=fmt(state.timer);if(state.timer<=0){clearInterval(timerId);timerId=null;state.running=false;vibrate([20,50,20]);toast('3分完了。未来変更ログに残します。');setTimeout(()=>finish(true),500)}},1000)}}
function finish(did){clearInterval(timerId);const db=load();const log={at:new Date().toISOString(),situation:currentSituation().title,mission:chosenMission(),did};db.logs=[log,...(db.logs||[])].slice(0,12);save(db);state.step='done';state.did=did;render()}
function renderDone(){const db=load(),logs=db.logs||[],doneCount=logs.filter(x=>x.did).length;const mission=chosenMission();app.innerHTML=`<main class="shell">${header(100,'RETURN COMPLETE')}<section class="screen"><div class="eyebrow">RETURN COMPLETE / ${NOW_YEAR}</div><div class="done-card"><div class="stamp">● FUTURE CHANGED: ${state.did?'STARTED':'SAVED'}</div><h2>${state.did?'今日、分岐を1つ変えた。':'一手は持ち帰った。'}</h2><div class="result-mission">${esc(mission)}</div><div class="statline"><div class="stat"><b>${doneCount}</b><span>着手できた未来</span></div><div class="stat"><b>${logs.length}</b><span>未来変更ログ</span></div></div></div><div class="actions"><button class="share" id="share">結果をシェア</button><button class="btn primary" id="again">別の分岐を変える</button><button class="btn ghost" id="home">最初に戻る</button></div>${logs.length?`<div class="history"><h3>最近の未来変更ログ</h3>${logs.slice(0,3).map(x=>`<div class="history-item"><time>${new Date(x.at).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'})}</time><span>${esc(x.mission)} ${x.did?'— 着手':'— 保存'}</span></div>`).join('')}</div>`:''}<p class="micro">記録はこの端末のブラウザ内だけに保存されます。</p></section></main>`;document.getElementById('share').onclick=shareResult;document.getElementById('again').onclick=()=>{state={step:'choose',situation:null,mission:null,custom:'',timer:180,running:false,dragDone:false};render()};document.getElementById('home').onclick=()=>{state={step:'intro',situation:null,mission:null,custom:'',timer:180,running:false,dragDone:false};render()}}
async function shareResult(){const text=`10年後から戻ってきた。\n今日、未来から持ち帰った一手：\n「${chosenMission()}」\n\nLEVEL UP`;try{if(navigator.share){await navigator.share({title:'10年後から戻ってきた',text,url:location.href});return}await navigator.clipboard.writeText(`${text}\n${location.href}`);toast('結果をコピーしました')}catch(err){if(err?.name!=='AbortError')toast('共有できませんでした')}}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.step!=='intro'){state.step='intro';render()}});
render();
})();
</script>
</body>
</html>
