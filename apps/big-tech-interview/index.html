<title>面接官は、答えを知らない。 | LEVEL UP</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;color:#f7f7f3;background:#080809;--bg:#080809;--panel:#121216;--panel2:#19191f;--line:rgba(255,255,255,.10);--muted:#9b9ba6;--accent:#c7ff5b;--danger:#ff6b7a;--safe:#75e7ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f7f7f3;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}body{overflow:hidden}
.app{height:100svh;min-height:620px;display:flex;flex-direction:column;max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}.home{width:38px;height:38px;border:1px solid var(--line);border-radius:14px;background:#111115;display:grid;place-items:center;text-decoration:none;color:#fff;font-size:18px}.brand{text-align:center;line-height:1}.brand b{display:block;font-size:11px;letter-spacing:.14em}.brand span{display:block;color:var(--muted);font-size:8px;letter-spacing:.15em;margin-top:4px}.score{min-width:60px;text-align:right;font-weight:900;font-size:13px}.score small{display:block;color:var(--muted);font-size:8px;font-weight:800;letter-spacing:.1em;margin-bottom:3px}

.stage{flex:1;min-height:0;display:flex;flex-direction:column}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.type{display:inline-flex;align-items:center;gap:7px;color:#d8d8de;font-size:10px;font-weight:900;letter-spacing:.08em}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px rgba(199,255,91,.5)}.round{font-size:10px;color:var(--muted);font-weight:850;letter-spacing:.08em}
.card{flex:1;min-height:0;background:linear-gradient(160deg,#18181e,#0f0f13);border:1px solid var(--line);border-radius:28px;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 24px 70px rgba(0,0,0,.28);position:relative;overflow:hidden}.card:before{content:"";position:absolute;width:220px;height:220px;border:1px solid rgba(199,255,91,.13);border-radius:50%;right:-90px;top:-110px}.question-no{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.14em}.question{font-size:clamp(25px,6.4vw,42px);line-height:1.23;letter-spacing:-.045em;font-weight:950;margin:12px 0 14px;max-width:620px}.brief{color:#b7b7bf;font-size:12px;line-height:1.65;max-width:590px}.think-label{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:18px}.think-label span{font-size:10px;color:var(--muted);font-weight:850;letter-spacing:.08em}.timer{font-size:clamp(42px,12vw,74px);font-weight:950;line-height:.9;letter-spacing:-.07em}.timer.warn{color:#ffbe5b}.timer.danger{color:var(--danger)}
.timerbar{height:8px;background:#24242c;border-radius:999px;overflow:hidden;margin-top:10px}.timerbar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transition:width 1s linear,background .2s}.actions{display:grid;grid-template-columns:.72fr 1.28fr;gap:9px;margin-top:12px}.btn{border:0;border-radius:18px;min-height:56px;font-weight:950;letter-spacing:-.02em;cursor:pointer;touch-action:manipulation}.ghost{background:#17171d;border:1px solid var(--line);color:#c7c7ce}.primary{background:var(--accent);color:#080809}.btn:active{transform:scale(.985)}
.answer-card{flex:1;min-height:0;background:#f2f2ec;color:#111114;border-radius:28px;padding:clamp(18px,4vw,28px);display:flex;flex-direction:column;overflow:auto}.answer-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.answer-top span{font-size:9px;font-weight:950;letter-spacing:.12em;color:#6a6a6f}.skill-pill{background:#111114;color:#fff;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:900}.answer-title{font-size:12px;color:#67676e;font-weight:900;margin-top:16px}.answer{font-size:clamp(21px,5.6vw,32px);font-weight:950;line-height:1.3;letter-spacing:-.04em;margin:7px 0 12px}.why{font-size:13px;line-height:1.72;color:#4d4d53;border-top:1px solid rgba(0,0,0,.09);padding-top:12px}.lens{margin-top:12px;background:#deded5;border-radius:18px;padding:12px 14px}.lens b{font-size:10px;letter-spacing:.08em}.lens p{font-size:12px;line-height:1.55;margin:5px 0 0}.rate-title{text-align:center;font-size:10px;color:#8d8d94;font-weight:900;letter-spacing:.08em;margin:12px 0 8px}.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.rate button{min-height:49px;border-radius:15px;border:1px solid rgba(0,0,0,.08);background:#fff;color:#18181c;font-size:11px;font-weight:950;cursor:pointer}.rate button:nth-child(3){background:#17171b;color:#fff}.rate small{display:block;font-size:8px;font-weight:700;opacity:.62;margin-top:3px}
.hintbox{position:absolute;inset:auto 18px 18px;z-index:5;background:#f3f3ed;color:#151519;border-radius:20px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.45);transform:translateY(140%);transition:transform .25s ease}.hintbox.show{transform:translateY(0)}.hintbox b{font-size:10px;letter-spacing:.1em}.hintbox p{font-size:14px;line-height:1.55;margin:7px 0 0}.hint-close{position:absolute;right:10px;top:9px;border:0;background:transparent;color:#555;font-size:20px}
.result{flex:1;min-height:0;background:linear-gradient(160deg,#19191f,#0e0e12);border:1px solid var(--line);border-radius:28px;padding:22px;overflow:auto}.result-kicker{color:var(--accent);font-size:10px;font-weight:950;letter-spacing:.15em}.result h1{font-size:clamp(34px,9vw,55px);line-height:.95;letter-spacing:-.06em;margin:10px 0 8px}.result p{font-size:12px;color:#b7b7bf;line-height:1.6}.bigscore{font-size:56px;font-weight:950;letter-spacing:-.06em;margin:14px 0}.bigscore small{font-size:13px;color:var(--muted);letter-spacing:0}.skills{display:grid;gap:8px}.skill-row{display:grid;grid-template-columns:84px 1fr 30px;align-items:center;gap:9px;font-size:10px;font-weight:850}.skill-row span:last-child{text-align:right}.skill-track{height:8px;border-radius:99px;background:#282830;overflow:hidden}.skill-track i{display:block;height:100%;background:var(--safe);border-radius:99px}.restart{width:100%;margin-top:16px;background:var(--accent);color:#0b0b0d;border:0;border-radius:18px;min-height:56px;font-weight:950}.disclaimer{text-align:center;color:#707078;font-size:8px;line-height:1.45;margin-top:8px}
.toast{position:absolute;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#f3f3ed;color:#111;padding:9px 12px;border-radius:999px;font-size:10px;font-weight:900;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:700px){.app{min-height:0}.question{font-size:24px;margin:8px 0}.brief{font-size:11px}.timer{font-size:40px}.btn{min-height:48px}.answer{font-size:20px}.why{font-size:11px}.lens{padding:9px 11px}.rate button{min-height:43px}.answer-card{padding:16px}}
</style>

<body>
<main id="app" class="app" aria-live="polite"></main>
<script>
(() => {
  'use strict';
  const QUESTIONS = [
    {type:'前提突破',q:'エレベーターを一切速くせず、待ち時間への不満を半分にしてください。',brief:'設備交換は禁止。建物の利用者数も変えられません。',a:'「待ち時間」ではなく「待っていると感じる時間」を変える。たとえば鏡、短い情報表示、乗る前に済ませられる小さな用事を置く。',why:'問題文が求めているのは速度改善ではなく、不満の改善です。指標を一段上に置き直すと解法が増えます。',lens:'聞かれた手段ではなく、本当に変えるべき結果は何かを見る。',hint:'「速くする」以外に、待つ体験そのものを変えられない？'},
    {type:'構造分解',q:'毎朝、駅の改札が3分だけ大混雑します。改札機は増やせません。どうしますか？',brief:'人員追加も禁止です。',a:'混雑を「人数×到着の集中×1人あたり処理時間」に分解する。到着時刻をずらす導線、事前準備の促進、滞留の原因除去などを試す。',why:'「改札が少ない」を原因と決めつけず、混雑を作る変数に分けると設備追加なしでも打ち手が出ます。',lens:'問題を掛け算や足し算に分解して、動かせる変数を探す。',hint:'混雑は何と何の掛け算で起きている？'},
    {type:'概算',q:'東京23区で、1日に捨てられるコンビニ傘は何本くらいだと思いますか？',brief:'正確な統計は使わず、考え方を説明してください。',a:'人口→コンビニ利用者→雨の日比率→傘を買う比率→その日のうちに手放す比率、と仮定を積み上げて幅で答える。',why:'重要なのは数字を当てることより、未知の量を既知の小さな量へ分解し、仮定を明示することです。',lens:'当てにいかず、推定式を作る。最後はレンジで持つ。',hint:'人口から順番に、割合を何段か掛けられない？'},
    {type:'逆転',q:'レビューを書いてくれる人を増やしたい。お願い文を長く丁寧にする以外で何を変えますか？',brief:'割引や金銭報酬は禁止です。',a:'「書きたい人を増やす」より「書くまでの摩擦を減らす」。入力項目を減らす、選択式から始める、利用直後の最適な瞬間に出す。',why:'行動率は動機だけでなく摩擦にも左右されます。追加の説得ではなく、障害を消す方が効く場合があります。',lens:'足すより先に、邪魔しているものを引く。',hint:'もっと説得するのではなく、面倒を消せない？'},
    {type:'制約活用',q:'新商品の広告予算が0円です。最初の100人にどう届けますか？',brief:'既存顧客リストはあります。',a:'制約を利用し、既存顧客への先行体験、紹介、既存商品の同梱導線、運営者本人の発信など「すでにある接点」に集中する。',why:'0円という制約は、広い施策を捨てて既存資産へ集中するルールになります。',lens:'制約を障害ではなく、選択肢を削るフィルターとして使う。',hint:'すでに持っている接点・顧客・場所は？'},
    {type:'視点転換',q:'問い合わせ件数を減らしたい。FAQを増やす以外の方法を考えてください。',brief:'サポート品質は落とせません。',a:'問い合わせが発生する直前を観察し、商品画面・申込画面・発送通知など「疑問が生まれる場所」で先回りして解消する。',why:'問い合わせ画面だけを見ると回答改善に偏ります。ユーザーの時系列へ視点を移すと原因側を直せます。',lens:'問題が観測される場所と、問題が生まれる場所を分ける。',hint:'質問はどの瞬間に生まれている？'},
    {type:'優先順位',q:'改善案が100個あります。会議なしで最初の3個を決めるなら？',brief:'全部それなりに良さそうです。',a:'効果の大きさ、確信度、実装コストなど同じ軸で粗く点数化し、上位だけ小さく試す。',why:'議論で正解を決めるより、共通軸で比較し、試験コストを下げる方が前に進みます。',lens:'意見の強さではなく、同じ物差しで比較する。',hint:'全案を同じ3つの軸で雑に採点すると？'},
    {type:'システム思考',q:'売上が上がるほど利益が下がる店があります。最初に何を疑いますか？',brief:'売上データ自体は正しいものとします。',a:'売上を一枚で見ず、商品構成・広告費・送料・値引き・返品・限界利益など「売れるほど増えるコスト」を疑う。',why:'単一KPIだけを最大化すると、別の変数が悪化することがあります。因果のつながりを見る問題です。',lens:'一つの数字の改善が、どこへ副作用を出すか追う。',hint:'売上と一緒に増える費用は何？'},
    {type:'前提突破',q:'会議時間を半分にしてください。ただし議題数は減らせません。',brief:'参加者も減らせません。',a:'会議中に「読む・報告する」をやめ、事前入力へ移す。会議は差分・争点・意思決定だけに使う。',why:'議題数と会議時間が比例するという前提を外し、同期が必要な工程だけ残します。',lens:'その場でやる必要がある工程だけを残す。',hint:'全工程が本当に「同時に集まって」やる必要がある？'},
    {type:'概算',q:'日本で今日、スマホの充電が切れて困る人は何人くらい？',brief:'検索禁止。桁が合う推定を作ってください。',a:'人口→スマホ保有者→1日に外出する人→低残量になる比率→その時に充電手段がない比率、と置いてレンジを出す。',why:'フェルミ推定では、答えより分解の妥当性と仮定の説明可能性が重要です。',lens:'巨大な未知数を、日常感覚で置ける割合へ割る。',hint:'まずスマホ利用者は何人くらい？ そこから割合を落とそう。'},
    {type:'逆転',q:'アプリを毎日開いてもらうには？ 通知を増やすのは禁止です。',brief:'ゲーム報酬も増やせません。',a:'「開かせる」より、日常の既存習慣に入口を埋め込む。朝の確認、仕事開始、就寝前など既に毎日起きる行動と結びつける。',why:'新しい習慣を作るより、既存習慣の直後に置く方が定着しやすい設計になります。',lens:'新しい行動を要求せず、すでに起きる行動へ寄生させる。',hint:'ユーザーが絶対に毎日やっていることは？'},
    {type:'制約活用',q:'商品ページの文章を1文字も変えずに、購入率を上げるなら？',brief:'価格変更も不可です。',a:'画像順、比較表、レビューの見せ方、配送情報、CTA周辺、表示速度など文章以外の意思決定材料と摩擦を改善する。',why:'制約があるほど、普段見落としていたレバーが見えます。',lens:'禁止された手段を諦め、残った変数を列挙する。',hint:'文章と価格以外にも、購入前に見ているものは多い。'},
    {type:'視点転換',q:'レストランで「料理が遅い」という不満が多い。厨房を速くできない場合は？',brief:'料理品質は落とせません。',a:'注文直後の期待値、待ち時間の可視化、先に出せる体験、会話や観察対象など、客側の待ち体験を設計する。',why:'提供時間という供給側の指標から、体感時間という顧客側の指標へ移します。',lens:'同じ事象を、提供者ではなく受け手の時間軸から見る。',hint:'客が不満なのは秒数そのもの？'},
    {type:'優先順位',q:'バグが30件あります。重大度が同じなら、どれから直しますか？',brief:'1日で5件しか直せません。',a:'発生頻度、影響ユーザー数、回避手段の有無、離脱点への近さで並べ替える。',why:'「重大度」という一軸が同じでも、実際の損失は発生頻度や回避可能性で変わります。',lens:'同点なら、被害の期待値を分解して比較する。',hint:'同じ重さでも、毎日起きるものと年1回のものは同じ？'},
    {type:'システム思考',q:'社員の返信を速くしたら、会社全体の仕事が遅くなりました。なぜ？',brief:'返信速度の計測ミスではありません。',a:'即レスを評価すると割り込みが増え、深い作業が分断され、重要タスクの完了時間が延びる可能性がある。',why:'局所最適が全体最適を壊す典型です。速い返信というKPIが別のコストを生みます。',lens:'その改善が、他の場所にどんなコストを移すかを見る。',hint:'返信を速くするために、何が中断される？'},
    {type:'前提突破',q:'「店に来る客を増やす」以外で、店の売上を2倍にする方法を考えてください。',brief:'営業時間は変えません。',a:'購入率、買上点数、単価、再来店頻度、法人需要など来客数以外の掛け算を上げる。',why:'売上=客数だけではありません。問題文に引っ張られず、目的を構造へ戻します。',lens:'目的を式に戻し、指定された変数以外を探す。',hint:'売上は「客数×？」'},
    {type:'構造分解',q:'「このアプリ、なんとなく使いづらい」を開発タスクに変えてください。',brief:'ユーザーはそれ以上うまく説明できません。',a:'開始まで、理解、入力、待ち、迷い、失敗回復、終了など利用フローへ分解し、各段階の時間・戻り・離脱を観察する。',why:'曖昧な感想をそのまま直せません。体験を工程へ分解すると検証可能になります。',lens:'形容詞を工程と観察可能な行動へ翻訳する。',hint:'「使う」を最初から最後まで時系列にすると？'},
    {type:'概算',q:'1つの大型ショッピングモールで、1年間に迷子になる子どもは何人くらい？',brief:'統計なしで推定してください。',a:'年間来館者→子連れ比率→子どもの人数→保護者とはぐれる確率、と分解して幅を出す。',why:'答えを知らなくても、推定可能な部品へ変換できます。',lens:'期間・母数・発生率の3つに分ける。',hint:'まず年間に何人来る？ そのうち子どもは？'},
    {type:'逆転',q:'退会を減らしたい。退会ボタンを隠す以外で、最初に何をしますか？',brief:'割引クーポンは禁止です。',a:'退会者を止めるより、退会理由が生まれる最初の瞬間を特定する。初回価値到達、期待値ずれ、使わない期間などを改善する。',why:'出口で引き止めるより、離脱の原因が発生する上流を直した方が本質的です。',lens:'最後の行動ではなく、最初の原因へ遡る。',hint:'退会を押す数日前・数週間前に何が起きている？'},
    {type:'制約活用',q:'新しい機能を一つも追加せずに、アプリを「新しくなった」と感じてもらうには？',brief:'ロゴ変更だけでは弱いものとします。',a:'既存機能の並び、初期設定、導線、見せる順番、名称、フィードバック表現を再編集し、価値への到達を変える。',why:'価値は機能数だけでなく、発見性と体験順序でも変わります。',lens:'作る前に、すでにあるものの編集余地を見る。',hint:'同じ材料でも、順番が変わると体験は変わらない？'},
    {type:'視点転換',q:'高齢者向けアプリを若い開発者だけで改善するなら、最初の1時間で何をしますか？',brief:'新しいユーザー調査の募集には時間がかかります。',a:'実機の文字サイズ・片手操作・通信環境・明るさなど利用条件を意図的に厳しくし、既存ログや問い合わせを高齢者視点で読み直す。',why:'自分の通常環境を基準にしないため、利用者の制約を疑似的に再現します。',lens:'自分の環境ではなく、相手の制約を先に置く。',hint:'自分のスマホ環境を「不利」に変えたら何が見える？'},
    {type:'優先順位',q:'明日サービス公開。改善できるのは1箇所だけです。どこを見る？',brief:'大きな障害は今のところ見つかっていません。',a:'ユーザーが最初の価値に到達するまでの最大の摩擦、または致命的な失敗から復帰できない地点を優先する。',why:'公開前は美観の平均点より、価値到達を止めるボトルネックの除去が効きます。',lens:'全部を少し良くせず、成功を止める一点を探す。',hint:'その1箇所が壊れると、サービス全体が無意味になる場所は？'},
    {type:'システム思考',q:'無料体験の申込数は増えたのに、有料会員が減りました。考えられる構造は？',brief:'決済障害はありません。',a:'申込ハードル低下で意図の弱い層が増えた、訴求と実体験がずれた、無料体験だけで目的を満たした、などファネルの質変化を疑う。',why:'上流KPIの改善が下流KPIを保証するわけではありません。流入の構成変化まで見ます。',lens:'量が増えた時ほど、中身の構成が変わっていないか確認する。',hint:'増えた「人」は、以前と同じ種類の人？'},
    {type:'前提突破',q:'「検索機能を改善して」と言われました。検索画面を触らずに改善できますか？',brief:'検索エンジン自体も変えません。',a:'検索しなくても目的物に到達できる並び、人気・履歴・お気に入り・カテゴリ導線を強くして、検索が必要な回数自体を減らす。',why:'検索の目的は検索することではなく、目的物を見つけることです。',lens:'機能を改善する前に、その機能を使わなくて済む設計を考える。',hint:'ユーザーは検索したい？ それとも見つけたい？'},
    {type:'構造分解',q:'「仕事が多すぎる」を、今日動ける問題に分解してください。',brief:'仕事量そのものは今日減りません。',a:'締切、損失、他人待ち、所要時間、今日やらなくていいものへ分類し、次の15分で閉じられる一件を選ぶ。',why:'巨大な感覚を、そのまま処理しようとすると動けません。判断軸で小さな箱へ分けます。',lens:'量ではなく、種類と次の一手に分解する。',hint:'全部同じ「仕事」ではなく、今やる理由ごとに分けると？'},
    {type:'概算',q:'あなたの町で、今この瞬間にオンライン会議中の人は何人くらい？',brief:'検索なしでレンジを作ってください。',a:'人口→就業者→ホワイトカラー比率→勤務時間中比率→オンライン会議利用率→その瞬間に会議している比率、と置く。',why:'瞬間値は「対象人口×その状態にいる時間割合」と考えると推定しやすくなります。',lens:'ストックではなく瞬間値なら、時間割合を掛ける。',hint:'1日の勤務時間のうち、会議時間は何割くらい？'},
    {type:'逆転',q:'ユーザーの入力ミスを減らしたい。「注意してください」と書く以外では？',brief:'入力項目は削除できません。',a:'ミスしにくい入力形式、例示、リアルタイム検証、候補選択、単位の固定など「正しく入力する方が自然」な設計にする。',why:'人へ注意を要求するより、ミスの余地を設計で消す方が再現性があります。',lens:'人を変える前に、間違いにくい環境へ変える。',hint:'注意力ではなく、UI側で間違えにくくできない？'},
    {type:'制約活用',q:'1ページしか作れないECサイトで、何を載せますか？',brief:'商品は10種類あります。',a:'全商品情報を平等に並べず、誰向けか→選び方→代表商品→比較→不安解消→購入の順に、意思決定に必要な情報だけ圧縮する。',why:'ページ数制約が情報設計を強制し、顧客の意思決定順序を明確にします。',lens:'制約が厳しい時は、情報量ではなく意思決定順序を設計する。',hint:'顧客が買うまでに必要な判断は何個？'},
    {type:'視点転換',q:'「説明書を読まないユーザー」が悪い。そう考えずに改善するなら？',brief:'説明書自体は十分丁寧です。',a:'説明を読むことを前提にせず、操作の直前に必要な情報だけ出す、初見で意味が伝わる配置にする。',why:'提供側の正しさではなく、実際の行動から設計を始めます。',lens:'理想のユーザーではなく、実際のユーザーを仕様にする。',hint:'読まないという事実を、欠点ではなく仕様にしたら？'},
    {type:'優先順位',q:'売上、利益、レビュー、リピート率。全部悪化しています。最初にどれを直す？',brief:'原因はまだ分かっていません。',a:'数字を一つ選ぶ前に、同時悪化を説明できる共通原因を探す。商品品質、在庫、配送、価格変更など上流要因を特定する。',why:'複数指標が同時に崩れた時は、それぞれ別施策を打つより共通原因の可能性が高いです。',lens:'複数の症状を一つで説明できる上流原因を優先する。',hint:'4つ全部を同時に悪化させる一つの出来事は？'},
    {type:'システム思考',q:'「作業を自動化したら忙しくなった」。どういうことが起きた？',brief:'自動化自体は正常に動いています。',a:'処理能力が増えて受ける仕事量が増えた、確認工程が増えた、例外処理が新しいボトルネックになった、など全体の流量変化を疑う。',why:'一工程の効率化は需要や次工程を変えます。局所効率だけでは全体負荷を読めません。',lens:'速くした工程の「次」に何が起きたかを見る。',hint:'空いた時間には、本当に何も入ってこない？'},
    {type:'前提突破',q:'「もっと勉強時間を増やしたい」。時間を増やさず成績を上げるなら？',brief:'教材費も増やしません。',a:'想起練習、間隔反復、間違いの再出題など、同じ時間あたりの学習効率と復習タイミングを変える。',why:'目的は勉強時間ではなく学習成果です。投入量以外のレバーを探します。',lens:'手段KPIを目的KPIに戻す。',hint:'欲しいのは時間？ それとも定着？'},
    {type:'構造分解',q:'「新規事業がうまくいくか不安」を、検証可能な3問に変えてください。',brief:'まだ売上はありません。',a:'誰が強く困っているか、既存代替より選ばれるか、継続して払う理由があるか、など需要・優位性・経済性へ分ける。',why:'漠然とした成功確率は答えられません。失敗要因ごとに仮説を分けると実験できます。',lens:'不安を、反証できる仮説の束へ変える。',hint:'失敗するとしたら「誰」「価値」「お金」のどこ？'},
    {type:'概算',q:'日本全国で、今日「パスワードを忘れた」を押す回数は何回くらい？',brief:'正確さより推定の筋道を重視します。',a:'ネット利用者→1日のログイン回数→パスワード入力が必要な比率→忘れる確率、と置き、企業・学校なども含めてレンジを調整する。',why:'見えないイベントも、母数×機会回数×発生率に分ければ推定できます。',lens:'人数だけでなく、1人あたりの発生機会も掛ける。',hint:'1人が1日に何回ログイン機会を持つ？'},
    {type:'逆転',q:'社内ルールを守る人を増やしたい。研修を増やさずにどうする？',brief:'罰則強化も禁止です。',a:'守る方をデフォルトにする、入力フォームへ組み込む、禁止操作自体をできなくするなど、記憶ではなく仕組みに埋め込む。',why:'人の記憶と意志へ依存するルールは抜けます。正しい行動が自然に起きる環境へ変えます。',lens:'教育ではなく、デフォルトと仕組みで行動を作る。',hint:'「覚えておく」をゼロにできない？'},
    {type:'制約活用',q:'スマホ画面にボタンを1つしか置けません。家計簿アプリなら何のボタン？',brief:'他の操作はその先の画面でできます。',a:'最頻・最重要の行動を一つ決める。多くの場合は「記録する」など、価値を生む最初の行動への入口にする。',why:'制約によって「このアプリの中心行動は何か」を決めざるを得なくなります。',lens:'機能一覧ではなく、中心となる一行動を選ぶ。',hint:'そのアプリで、ユーザーが一番繰り返す価値行動は？'},
    {type:'視点転換',q:'商品が「高い」と言われます。値下げせずに最初に確認することは？',brief:'原価は変えられません。',a:'誰と何を比較して高いのか、価値が伝わる前に価格を見ていないか、総コストや使用期間で比較できているかを確認する。',why:'「高い」は絶対値ではなく比較の文脈です。顧客の比較軸を特定します。',lens:'評価語を聞いたら、その人の比較対象を探す。',hint:'「何と比べて？」を考える。'},
    {type:'優先順位',q:'今週できる改善は、小さな確実改善と、大きいが不確実な改善のどちら？',brief:'二つ同時にはできません。',a:'期待値だけでなく、学習価値・失敗コスト・可逆性で選ぶ。不確実案が安く試せて学びが大きいなら小さく実験する。',why:'「確実か大きいか」の二択ではなく、試験可能性を入れると第三の選択が生まれます。',lens:'意思決定に「戻せるか」「学べるか」を足す。',hint:'本番実装ではなく、小さく試す形にできない？'},
    {type:'システム思考',q:'人気機能をトップに移したら、全体の利用率が下がりました。なぜ？',brief:'機能自体は壊れていません。',a:'人気機能が他機能への入口を押し下げた、目的が違う人にも強く見せすぎた、トップの選択肢が単調になったなど導線全体の再配分を疑う。',why:'一項目を上げると、限られた画面では他項目が下がります。配置はゼロサム要素を持ちます。',lens:'目立たせたものだけでなく、押し出されたものを見る。',hint:'上に置いた分、何が下に行った？'}
  ];

  const SKILLS = ['前提突破','構造分解','概算','逆転','制約活用','視点転換','優先順位','システム思考'];
  const app = document.getElementById('app');
  let deck=[], idx=0, time=30, timer=null, score=0, sessionSkills={}, revealed=false, hintUsed=false;
  const bestKey='levelup-big-tech-interview-best-v1';
  let best=Number(localStorage.getItem(bestKey)||0);

  function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function start(){deck=shuffle(QUESTIONS).slice(0,10);idx=0;score=0;sessionSkills={};renderQuestion()}
  function shell(inner){return `<div class="top"><a class="home" href="/" aria-label="LEVEL UPトップへ">⌂</a><div class="brand"><b>面接官は、答えを知らない。</b><span>BIG TECH THINKING TEST</span></div><div class="score"><small>SCORE</small>${score}</div></div><div class="progress"><i style="width:${Math.min(100,((idx+1)/10)*100)}%"></i></div>${inner}<div class="disclaimer">実在する企業・採用試験とは無関係です。問題・回答例は本ゲーム用のオリジナルです。</div>`}
  function renderQuestion(){clearInterval(timer);revealed=false;hintUsed=false;time=30;const x=deck[idx];app.innerHTML=shell(`<section class="stage"><div class="meta"><span class="type"><i class="dot"></i>${esc(x.type)}</span><span class="round">QUESTION ${idx+1} / 10</span></div><div class="card"><div><div class="question-no">NO.${String(idx+1).padStart(2,'0')}</div><div class="question">${esc(x.q)}</div><div class="brief">${esc(x.brief)}</div></div><div><div class="think-label"><span>30秒で、筋道を作れ</span><strong id="timer" class="timer">30</strong></div><div class="timerbar"><i id="timerbar"></i></div></div></div><div class="actions"><button id="hint" class="btn ghost">ヒント</button><button id="reveal" class="btn primary">回答例を見る</button></div></section><div id="hintbox" class="hintbox"><button id="hintclose" class="hint-close">×</button><b>HINT</b><p>${esc(x.hint)}</p></div><div id="toast" class="toast"></div>`);document.getElementById('reveal').onclick=showAnswer;document.getElementById('hint').onclick=showHint;document.getElementById('hintclose').onclick=hideHint;timer=setInterval(tick,1000)}
  function tick(){if(revealed)return;time=Math.max(0,time-1);const el=document.getElementById('timer'),bar=document.getElementById('timerbar');if(el){el.textContent=time;el.className='timer'+(time<=5?' danger':time<=10?' warn':'')}if(bar){bar.style.width=(time/30*100)+'%';bar.style.background=time<=5?'var(--danger)':time<=10?'#ffbe5b':'var(--accent)'}if(time<=0)showAnswer()}
  function showHint(){hintUsed=true;document.getElementById('hintbox')?.classList.add('show')}
  function hideHint(){document.getElementById('hintbox')?.classList.remove('show')}
  function showAnswer(){if(revealed)return;revealed=true;clearInterval(timer);const x=deck[idx];app.innerHTML=shell(`<section class="stage"><div class="meta"><span class="type"><i class="dot"></i>${esc(x.type)}</span><span class="round">ANSWER ${idx+1} / 10</span></div><div class="answer-card"><div class="answer-top"><span>ONE POSSIBLE ANSWER</span><div class="skill-pill">${esc(x.type)}</div></div><div class="answer-title">回答例</div><div class="answer">${esc(x.a)}</div><div class="why">${esc(x.why)}</div><div class="lens"><b>この問題で鍛える型</b><p>${esc(x.lens)}</p></div><div class="rate-title">自分の答えは、どこまで行けた？</div><div class="rate"><button data-rate="0">出なかった<small>型を覚える</small></button><button data-rate="1">近かった<small>+1</small></button><button data-rate="2">出た<small>+2</small></button></div></div></section><div id="toast" class="toast"></div>`);document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(Number(b.dataset.rate)))}
  function rate(n){const x=deck[idx];const speed=Math.max(0,Math.floor(time/6));const gain=n===0?10:n===1?60+speed*4:120+speed*7;score+=hintUsed?Math.floor(gain*.8):gain;sessionSkills[x.type]=(sessionSkills[x.type]||0)+n+1;if(n===2&&navigator.vibrate)navigator.vibrate(18);idx++;if(idx>=10)renderResult();else renderQuestion()}
  function renderResult(){clearInterval(timer);if(score>best){best=score;localStorage.setItem(bestKey,String(best))}const rows=SKILLS.map(s=>{const v=sessionSkills[s]||0;const pct=Math.min(100,Math.round(v/6*100));return `<div class="skill-row"><span>${esc(s)}</span><div class="skill-track"><i style="width:${pct}%"></i></div><span>${v}</span></div>`}).join('');const rank=score>=1100?'STRATEGIST':score>=850?'PROBLEM SOLVER':score>=600?'THINKER':'ROOKIE';app.innerHTML=shell(`<section class="stage"><div class="result"><div class="result-kicker">INTERVIEW COMPLETE</div><h1>${rank}</h1><p>正解を覚えるより、問題を見た瞬間に「どの型で崩すか」が出ることを狙うゲームです。</p><div class="bigscore">${score}<small> / BEST ${best}</small></div><div class="skills">${rows}</div><button id="restart" class="restart">別の10問に挑戦</button></div></section>`);document.getElementById('restart').onclick=start}
  start();
})();
</script>
</body>
</html>
