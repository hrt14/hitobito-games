<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080a08">
<meta name="description" content="休む気がない人を、NOから交渉して数十秒の休息まで連れていくLEVEL UPアプリ。要求を小さくしながら、水・脱力・視線オフ・呼吸へ切り替える。">
<title>NEGOTIATOR｜休ませる | LEVEL UP</title>
<style>
:root{color-scheme:dark;--bg:#080a08;--panel:#10140d;--text:#f4f6ef;--muted:#969e8f;--lime:#d8ff5b;--line:rgba(216,255,91,.17);--amber:#ffc95b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{overscroll-behavior:none}.app{min-height:100svh;background:radial-gradient(circle at 50% -18%,rgba(216,255,91,.08),transparent 34%),var(--bg);color:var(--text)}.shell{width:min(100%,560px);min-height:100svh;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:11px;letter-spacing:.18em;font-weight:1000;color:var(--lime)}button{font-family:inherit}.exit{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:850;min-width:54px;min-height:44px}.board{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}.meter{background:#0d100b;border:1px solid #ffffff0d;border-radius:14px;padding:10px 11px}.meter-head{display:flex;justify-content:space-between;gap:8px;font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.05em}.track{height:6px;background:#ffffff0c;border-radius:99px;overflow:hidden;margin-top:8px}.track i{display:block;height:100%;border-radius:99px;transition:width .34s cubic-bezier(.2,.9,.2,1)}.ask-track i{background:var(--amber)}.rest-track i{background:var(--lime)}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 0 8px;animation:enter .2s ease}.kicker{font-size:10px;font-weight:1000;letter-spacing:.16em;color:var(--lime);margin-bottom:10px}.title{font-size:clamp(37px,11vw,54px);line-height:.96;letter-spacing:-.06em;margin:0 0 12px}.lead{margin:0;color:#c4c9bd;font-size:14px;line-height:1.7}.offer-wrap{display:grid;place-items:center;min-height:190px;margin:18px 0 14px}.offer{width:var(--offer-w,100%);min-width:176px;max-width:100%;background:#f3f2e9;color:#161a14;border-radius:22px;padding:22px 20px;box-shadow:0 20px 55px rgba(0,0,0,.36);transition:width .4s cubic-bezier(.2,.9,.2,1)}.offer small{display:block;color:#6b7267;font-size:9px;font-weight:1000;letter-spacing:.15em;margin-bottom:12px}.offer strong{display:block;font-size:clamp(24px,7.4vw,34px);line-height:1.22;letter-spacing:-.045em}.offer em{display:block;font-style:normal;color:#6a7166;font-size:11px;line-height:1.55;margin-top:10px}.choices{display:grid;gap:9px}.choice,.primary,.secondary,.hold-btn{border:0;border-radius:17px;min-height:58px;width:100%;padding:13px 16px;font:inherit;cursor:pointer;transition:transform .11s ease}.choice:active,.primary:active,.secondary:active,.hold-btn:active{transform:scale(.985)}.choice{text-align:left;background:#12160f;color:var(--text);border:1px solid #ffffff13}.choice strong{display:block;font-size:15px;line-height:1.35}.choice small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.choice.yes{border-color:rgba(216,255,91,.28);background:#172012}.choice.no strong:before{content:'NO  ';font-size:8px;color:#9ca393;letter-spacing:.1em}.primary{background:var(--lime);color:#10130b;font-weight:1000;font-size:16px}.secondary{background:#12160f;color:var(--text);border:1px solid #ffffff13;font-weight:900}.tech{margin-top:13px;text-align:center;color:#727a6d;font-size:9px;letter-spacing:.06em}.action-card{border:1px solid var(--line);background:linear-gradient(160deg,#151b10,#0c0f0a);border-radius:28px;padding:24px 18px;margin:18px 0}.action-icon{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;border:1px solid rgba(216,255,91,.22);font-size:30px;background:#0e120b}.action-card h2{text-align:center;font-size:30px;letter-spacing:-.05em;margin:0 0 9px}.action-card p{text-align:center;color:#b2b8aa;font-size:13px;line-height:1.65;margin:0}.hold-btn{margin-top:20px;background:#eef3df;color:#11150e;font-weight:1000;font-size:15px;touch-action:none}.hold-btn.holding{background:var(--lime)}.ring{--p:0;width:132px;height:132px;border-radius:50%;margin:12px auto 18px;display:grid;place-items:center;background:conic-gradient(var(--lime) calc(var(--p)*1%),#20251c 0);position:relative}.ring:after{content:'';position:absolute;inset:9px;background:#0f130c;border-radius:50%}.ring b{position:relative;z-index:1;font-size:36px}.timer-actions{display:grid;gap:8px;margin-top:14px}.result{border:1px solid var(--line);border-radius:28px;background:#10140d;padding:22px;margin:16px 0}.result-main{text-align:center;padding:10px 0 20px}.result-main b{display:block;font-size:70px;line-height:.9;letter-spacing:-.07em;color:var(--lime)}.result-main span{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{border:1px solid #ffffff10;border-radius:15px;padding:12px;text-align:center}.stat strong{display:block;font-size:24px}.stat small{font-size:9px;color:var(--muted)}.reveal{margin-top:14px;border-top:1px solid #ffffff10;padding-top:14px}.reveal h3{font-size:10px;letter-spacing:.13em;color:var(--muted);margin:0 0 8px}.reveal p{font-size:12px;line-height:1.7;color:#c8cec0;margin:0}.previous{display:inline-flex;border:1px solid #ffffff10;border-radius:999px;padding:7px 10px;color:#9ca493;font-size:9px;margin-bottom:12px}.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#f4f4eb;color:#171a15;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:900;z-index:40;animation:toast 1.2s both}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:grid;align-items:end;padding:14px}.sheet{width:min(100%,530px);margin:auto;background:#141811;border:1px solid #ffffff14;border-radius:26px;padding:20px}.sheet h2{font-size:25px;letter-spacing:-.04em;margin:0 0 8px}.sheet p{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 16px}.fine{font-size:9px;line-height:1.55;color:#6f776a;text-align:center;margin-top:12px}@keyframes enter{from{opacity:0;transform:translateY(7px)}}@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,6px)}15%,80%{opacity:1;transform:translate(-50%,0)}}@media(max-width:380px){.shell{padding-left:11px;padding-right:11px}.offer-wrap{min-height:166px}.offer{padding:18px 16px}.choice{min-height:55px}.title{font-size:39px}}@media(max-height:700px){.screen{justify-content:flex-start}.offer-wrap{min-height:145px;margin:10px 0}.offer{padding:17px}.choices{gap:7px}.choice{min-height:52px}.action-card{margin:9px 0;padding:18px}.action-icon{width:64px;height:64px;margin-bottom:12px}.action-card h2{font-size:26px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div id="app" class="app"></div>
<script>
(()=>{
const app=document.getElementById('app'),TEST=new URLSearchParams(location.search).get('test')==='1',ACTIVE='levelup-negotiator-rest-active-v1',HISTORY='levelup-negotiator-rest-history-v1';
const fresh=()=>({stage:'opening',restSeconds:0,yes:0,resistance:0,reason:null,offer:100,startedAt:Date.now(),exitOpen:false,finalized:false});let state=loadActive()||fresh(),actionTimer=null;
function hist(){try{return JSON.parse(localStorage.getItem(HISTORY)||'{"sessions":0,"totalRest":0,"lastRest":0,"lastResistance":0}')}catch{return {sessions:0,totalRest:0,lastRest:0,lastResistance:0}}}
function loadActive(){try{const s=JSON.parse(localStorage.getItem(ACTIVE)||'null');return s&&s.stage&&s.stage!=='done'&&!s.finalized?s:null}catch{return null}}
function persist(){try{localStorage.setItem(ACTIVE,JSON.stringify(state))}catch{}}
function buzz(){try{navigator.vibrate&&navigator.vibrate(12)}catch{}}
function setStage(stage,patch={}){clearTimeout(actionTimer);state={...state,...patch,stage,exitOpen:false};persist();buzz();render()}
function resist(reason,next,offer){state.resistance++;if(reason)state.reason=reason;setStage(next,{offer})}
function agree(next,patch={}){state.yes++;setStage(next,patch)}
function board(){const rest=Math.min(100,state.restSeconds/30*100);return `<div class="board"><div class="meter ask-track"><div class="meter-head"><span>要求サイズ</span><b>${Math.max(1,Math.round(state.offer))}%</b></div><div class="track"><i style="width:${state.offer}%"></i></div></div><div class="meter rest-track"><div class="meter-head"><span>休息残高</span><b>${state.restSeconds}秒</b></div><div class="track"><i style="width:${rest}%"></i></div></div></div>`}
function shell(content,{boardOn=true}={}){return `<div class="shell"><header class="top"><div class="brand">NEGOTIATOR / LEVEL UP</div><button class="exit" data-action="exit">終了</button></header>${boardOn?board():''}${content}<div class="fine">無理に続ける必要はありません。体調に異変があるときは、このアプリより休息や必要な支援を優先してください。</div></div>${state.exitOpen?exitModal():''}`}
function offerScreen({kicker='COUNTER OFFER',title,copy,offer,choices,tech}){const h=hist(),prev=h.sessions?`<div class="previous">前回 ${h.lastRest}秒休息 / NO ${h.lastResistance}回</div>`:'';return shell(`<section class="screen"><div class="kicker">${kicker}</div>${prev}<h1 class="title">${title}</h1><p class="lead">${copy}</p><div class="offer-wrap"><div class="offer" style="--offer-w:${Math.max(42,offer)}%"><small>こちらの提案</small><strong>${offerText()}</strong><em>NOなら、さらに条件を下げます。</em></div></div><div class="choices">${choices.map(c=>`<button class="choice ${c.kind==='yes'?'yes':'no'}" data-choice="${c.id}"><strong>${c.label}</strong>${c.sub?`<small>${c.sub}</small>`:''}</button>`).join('')}</div>${tech?`<div class="tech">${tech}</div>`:''}</section>`)}
function offerText(){return {opening:'2週間、全部休みませんか？',five:'では、5分だけ休みませんか？',one:'1分だけ。時計を止める感覚で。',water:'休憩じゃなくていい。水を一口だけ。',shoulder:'肩を1cmだけ下げませんか？',eyes:'10秒だけ、画面の外を見ませんか？',breath:'8秒だけ、長く息を吐きませんか？',final:'あと少しだけ、何もしない。'}[state.stage]||'ほんの少しだけ止まる。'}
function opening(){return offerScreen({kicker:'NEGOTIATOR',title:'あなたを休ませます。',copy:'NOで構いません。拒否されたら、こちらが条件を下げます。',offer:100,choices:[{id:'open-yes',kind:'yes',label:'休む。2週間でもいい'},{id:'open-busy',label:'無理。仕事がある'},{id:'open-tasks',label:'そんな暇ない。やることある'}]})}
function five(){return offerScreen({title:'2週間は撤回します。',copy:state.reason==='busy'?'仕事がある。了解。では、なくならない仕事の横に5分だけ空白を置く提案です。':'やることがある。了解。全部を止める話はやめます。',offer:72,tech:'交渉技：大きな要求から小さな要求へ',choices:[{id:'five-yes',kind:'yes',label:'5分なら休む'},{id:'five-no',label:'5分も無理'},{id:'five-anxious',label:'止まる方が落ち着かない'}]})}
function one(){return offerScreen({title:'5分も撤回します。',copy:'1分で仕事は壊れません。1分で回復もしなくていい。ただ止まるだけ。',offer:48,tech:'交渉技：要求をさらに小さくする',choices:[{id:'one-yes',kind:'yes',label:'1分ならやる'},{id:'one-busy',label:'1分でも惜しい'},{id:'one-tasks',label:'まだ「休む」は嫌だ'}]})}
function water(){return offerScreen({title:'「休む」も撤回します。',copy:'休憩しなくていいです。作業の途中で水を一口。それだけなら？',offer:29,tech:'交渉技：目的を保ったまま言い方を変える',choices:[{id:'water-yes',kind:'yes',label:'水なら飲む'},{id:'water-no',label:'水もいらない'},{id:'water-hands',label:'手を止めたくない'}]})}
function shoulder(){return offerScreen({title:'水も必須ではありません。',copy:'座ったまま、仕事も開いたまま。肩を1cm下げるだけに値切ります。',offer:18,tech:'交渉技：身体の最小動作へ',choices:[{id:'shoulder-yes',kind:'yes',label:'4秒ならやる'},{id:'shoulder-no',label:'それすら面倒'},{id:'shoulder-busy',label:'今は動きたくない'}]})}
function eyes(){return offerScreen({title:'目だけ、仕事から外します。',copy:'立たない。片づけない。10秒だけ別の場所を見る。',offer:11,tech:'交渉技：対象を「休む」から「視線」に変える',choices:[{id:'eyes-yes',kind:'yes',label:'10秒なら見る'},{id:'eyes-no',label:'画面から目を離したくない'},{id:'eyes-back',label:'もう仕事に戻りたい'}]})}
function breath(){return offerScreen({title:'では最後に呼吸だけ。',copy:'深呼吸を頑張る必要はありません。長く吐くだけです。',offer:6,tech:'交渉技：最小動作へ分解',choices:[{id:'breath-yes',kind:'yes',label:'8秒なら吐く'},{id:'breath-no',label:'呼吸はいい'},{id:'breath-back',label:'本当に戻りたい'}]})}
function finalOffer(){return offerScreen({title:state.restSeconds?`もう${state.restSeconds}秒、離れています。`:'ここまで全部NOでもOK。',copy:state.restSeconds?'「休む」と決める前に、少し休めました。30秒だけ完成させますか？':'交渉は失敗しても、終了はあなたが決められます。最後に3秒だけ提案します。',offer:3,tech:'交渉技：すでにできた行動を足場にする',choices:[{id:'final-yes',kind:'yes',label:`あと${Math.max(3,30-state.restSeconds)}秒だけ止まる`},{id:'final-five',kind:'yes',label:'逆に5分なら休む'},{id:'final-back',label:'今日はここで戻る'}]})}
function waterAction(){return shell(`<section class="screen"><div class="kicker">MICRO YES</div><div class="action-card"><div class="action-icon">水</div><h2>一口だけ。</h2><p>量はどうでもいいです。飲んだら、それだけ教えてください。</p><button class="hold-btn" data-choice="water-done">飲んだ</button></div><button class="secondary" data-choice="water-skip">今は飲まない</button></section>`)}
function holdAction(){return shell(`<section class="screen"><div class="kicker">4 SECOND DEAL</div><div class="action-card"><div class="action-icon">↓</div><h2>肩を1cm下げる。</h2><p>下のボタンを押している4秒だけ、肩とあごの力を抜きます。</p><button class="hold-btn" data-hold="shoulder">4秒 押し続ける</button></div><button class="secondary" data-choice="shoulder-skip">やっぱりやめる</button></section>`)}
function timedActionPage(kind,secs,title,copy){return shell(`<section class="screen"><div class="kicker">MICRO BREAK</div><div class="action-card"><div class="ring" data-ring><b data-count>${secs}</b></div><h2>${title}</h2><p>${copy}</p></div><button class="secondary" data-choice="action-cancel">途中で戻る</button></section>`)}
function restTimerPage(secs){return shell(`<section class="screen"><div class="kicker">DEAL ACCEPTED</div><h1 class="title">交渉成立。</h1><p class="lead">仕事は消えません。戻る時刻だけ決めて、いまはタイマーに預けます。</p><div class="action-card"><div class="ring" data-ring><b data-count>${fmt(secs)}</b></div><h2>${secs===60?'1分':'5分'}だけ休む</h2><p>途中で戻っても構いません。実際に止まった秒数だけ記録します。</p></div><div class="timer-actions"><button class="secondary" data-choice="timer-stop">途中で戻る</button></div></section>`)}
function resultPage(){const h=hist(),success=state.restSeconds>=30||state.timerStartedAt,reduction=Math.max(0,100-state.offer);return shell(`<section class="screen"><div class="kicker">${success?'NEGOTIATION COMPLETE':'NEGOTIATION CLOSED'}</div><h1 class="title">${success?'休むと言う前に、少し休めました。':'今日は、ここで終了。'}</h1><div class="result"><div class="result-main"><b>${state.restSeconds}</b><span>実際に仕事・画面・緊張から外した秒</span></div><div class="stats"><div class="stat"><strong>${state.resistance}</strong><small>NO / 抵抗</small></div><div class="stat"><strong>${reduction}%</strong><small>要求を値切った幅</small></div></div><div class="reveal"><h3>今回こちらが使った手</h3><p>大きな要求 → 要求縮小 → 「休む」の言い換え → 小さなYES → すでにできた行動を足場にする。あなたが押した選択以外のことは推測していません。</p></div></div><div class="choices"><button class="primary" data-choice="again">もう一度交渉する</button><button class="secondary" data-choice="share">結果を共有</button></div><div class="tech">累計 ${h.sessions}回 · ${h.totalRest}秒</div></section>`,{boardOn:false})}
function exitModal(){return `<div class="modal"><div class="sheet"><h2>ここで終わって大丈夫です。</h2><p>NEGOTIATORはユーザーを閉じ込めません。続けるか、今すぐ戻るかはあなたが決めます。</p><div class="choices"><button class="primary" data-action="continue">交渉を続ける</button><button class="secondary" data-action="quit">今日は終了する</button></div></div></div>`}
function render(){clearTimeout(actionTimer);let html='';switch(state.stage){case'opening':html=opening();break;case'five':html=five();break;case'one':html=one();break;case'water':html=water();break;case'shoulder':html=shoulder();break;case'eyes':html=eyes();break;case'breath':html=breath();break;case'final':html=finalOffer();break;case'water-action':html=waterAction();break;case'shoulder-action':html=holdAction();break;case'eyes-action':html=timedActionPage('eyes',10,'視線を外す','この画面を見なくて大丈夫です。遠くの一点へ。');break;case'breath-action':html=timedActionPage('breath',8,'長く吐く','吸うことより、ゆっくり吐くことだけ意識。');break;case'final-action':html=timedActionPage('final',Math.max(3,30-state.restSeconds),'何もしない','手を止めて、交渉を終わらせます。');break;case'timer60':html=restTimerPage(60);break;case'timer300':html=restTimerPage(300);break;case'done':html=resultPage();break;default:state=fresh();persist();return render()}app.innerHTML=html;bind();if(['eyes-action','breath-action','final-action'].includes(state.stage))startAutoAction();if(['timer60','timer300'].includes(state.stage))startRestTimer()}
function startAutoAction(){const kind=state.stage.replace('-action',''),secs=kind==='eyes'?10:kind==='breath'?8:Math.max(3,30-state.restSeconds);runRing(secs,()=>{state.restSeconds+=secs;const next=kind==='eyes'?'breath':kind==='breath'?'final':'done';if(next==='done')finish(false);else setStage(next,{offer:kind==='eyes'?6:3})})}
function runRing(secs,done){const started=Date.now(),duration=TEST?120:secs*1000,ring=document.querySelector('[data-ring]'),count=document.querySelector('[data-count]');const tick=()=>{const ratio=Math.min(1,(Date.now()-started)/duration);if(ring)ring.style.setProperty('--p',String(ratio*100));if(count)count.textContent=String(Math.max(0,Math.ceil(secs*(1-ratio))));if(ratio>=1)return done();actionTimer=setTimeout(tick,TEST?15:100)};tick()}
function startRestTimer(){const secs=state.stage==='timer60'?60:300,started=Date.now(),duration=TEST?220:secs*1000;state.timerStartedAt=started;state.timerIntended=secs;persist();const ring=document.querySelector('[data-ring]'),count=document.querySelector('[data-count]');const tick=()=>{const ratio=Math.min(1,(Date.now()-started)/duration);if(ring)ring.style.setProperty('--p',String(ratio*100));if(count)count.textContent=fmt(Math.max(0,Math.ceil(secs*(1-ratio))));if(ratio>=1){state.restSeconds+=secs;return finish(false)}actionTimer=setTimeout(tick,TEST?20:200)};tick()}
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return m?`${m}:${String(s).padStart(2,'0')}`:`${s}`}
function stopTimer(){const intended=state.timerIntended||0,den=TEST?(220/intended):1000,actual=state.timerStartedAt?Math.max(1,Math.min(intended,Math.floor((Date.now()-state.timerStartedAt)/den))):0;state.restSeconds+=actual;finish(false)}
function finish(quit){if(!state.finalized){const h=hist();try{localStorage.setItem(HISTORY,JSON.stringify({sessions:h.sessions+1,totalRest:h.totalRest+state.restSeconds,lastRest:state.restSeconds,lastResistance:state.resistance}))}catch{}state.finalized=true}state.stage='done';state.quit=!!quit;try{localStorage.removeItem(ACTIVE)}catch{}render()}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function bind(){document.querySelector('[data-action="exit"]')?.addEventListener('click',()=>{state.exitOpen=true;render()});document.querySelector('[data-action="continue"]')?.addEventListener('click',()=>{state.exitOpen=false;render()});document.querySelector('[data-action="quit"]')?.addEventListener('click',()=>finish(true));document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>choose(el.dataset.choice)));const hold=document.querySelector('[data-hold="shoulder"]');if(hold){let t=null;const cancel=()=>{if(t)clearTimeout(t);t=null;hold.classList.remove('holding');hold.textContent='4秒 押し続ける'};const begin=e=>{e.preventDefault();hold.classList.add('holding');hold.textContent='そのまま…';t=setTimeout(()=>{t=null;state.restSeconds+=4;setStage('eyes',{offer:11})},TEST?100:4000)};hold.addEventListener('pointerdown',begin);hold.addEventListener('pointerup',cancel);hold.addEventListener('pointercancel',cancel)}}
function choose(id){switch(id){case'open-yes':agree('timer300',{offer:72});break;case'open-busy':resist('busy','five',72);break;case'open-tasks':resist('tasks','five',72);break;case'five-yes':agree('timer300',{offer:48});break;case'five-no':resist(null,'one',48);break;case'five-anxious':resist('anxious','one',48);break;case'one-yes':agree('timer60',{offer:29});break;case'one-busy':resist('busy','water',29);break;case'one-tasks':resist('tasks','water',29);break;case'water-yes':agree('water-action',{offer:18});break;case'water-no':resist(null,'shoulder',18);break;case'water-hands':resist('busy','shoulder',18);break;case'water-done':toast('それで十分。休憩とは呼びません。');setTimeout(()=>setStage('shoulder',{offer:18}),TEST?30:420);break;case'water-skip':resist(null,'shoulder',18);break;case'shoulder-yes':agree('shoulder-action',{offer:11});break;case'shoulder-no':resist(null,'eyes',11);break;case'shoulder-busy':resist('busy','eyes',11);break;case'shoulder-skip':resist(null,'eyes',11);break;case'eyes-yes':agree('eyes-action',{offer:6});break;case'eyes-no':resist(null,'breath',6);break;case'eyes-back':resist(null,'breath',6);break;case'breath-yes':agree('breath-action',{offer:3});break;case'breath-no':resist(null,'final',3);break;case'breath-back':resist(null,'final',3);break;case'final-yes':agree('final-action',{offer:1});break;case'final-five':agree('timer300',{offer:1});break;case'final-back':finish(false);break;case'action-cancel':setStage('final',{offer:3});break;case'timer-stop':stopTimer();break;case'again':state=fresh();persist();render();break;case'share':shareResult();break}}
async function shareResult(){const text=`NEGOTIATOR｜休ませる\n${state.resistance}回NOと言って、${state.restSeconds}秒だけ休めた。\nhttps://levelup.hitobito.jp/apps/negotiator-rest/`;try{if(navigator.share)await navigator.share({title:'NEGOTIATOR｜休ませる',text});else{await navigator.clipboard.writeText(text);toast('結果をコピーしました')}}catch{}}
render();
})();
</script>
</body>
