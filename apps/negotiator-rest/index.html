<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080a08"><meta name="description" content="休む気がない人を、NOから交渉して数十秒の休息まで連れていくLEVEL UPアプリ。"><title>NEGOTIATOR｜休ませる | LEVEL UP</title><style>
:root{color-scheme:dark;--bg:#080a08;--card:#11150e;--text:#f5f7f0;--muted:#939b8d;--lime:#d8ff5b;--line:#d8ff5b2b;--amber:#ffc95b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}button{font:inherit}.app{min-height:100svh;color:var(--text);background:radial-gradient(circle at 50% -12%,#d8ff5b12,transparent 30%),var(--bg)}.shell{width:min(100%,560px);min-height:100svh;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:48px;display:flex;align-items:center;justify-content:space-between}.brand{color:var(--lime);font-size:11px;font-weight:1000;letter-spacing:.17em}.exit{min-height:44px;min-width:54px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:900}.board{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meter{padding:10px;border:1px solid #ffffff0d;border-radius:14px;background:#0d100b}.mh{display:flex;justify-content:space-between;font-size:9px;font-weight:900;color:var(--muted)}.track{height:6px;margin-top:8px;border-radius:9px;background:#ffffff0c;overflow:hidden}.track i{display:block;height:100%;border-radius:9px;transition:width .3s}.ask i{background:var(--amber)}.rest i{background:var(--lime)}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0}.kicker{margin-bottom:10px;color:var(--lime);font-size:10px;font-weight:1000;letter-spacing:.16em}.title{margin:0 0 12px;font-size:clamp(38px,11vw,54px);line-height:.96;letter-spacing:-.06em}.lead{margin:0;color:#c2c8bb;font-size:14px;line-height:1.7}.previous{align-self:flex-start;margin-bottom:10px;padding:7px 10px;border:1px solid #ffffff12;border-radius:999px;color:var(--muted);font-size:9px}.offer-wrap{min-height:180px;margin:18px 0 14px;display:grid;place-items:center}.offer{width:var(--w);min-width:178px;max-width:100%;padding:21px;background:#f2f1e8;color:#171a15;border-radius:22px;box-shadow:0 20px 55px #0007;transition:width .35s}.offer small{display:block;margin-bottom:10px;color:#6c7368;font-size:9px;font-weight:1000;letter-spacing:.14em}.offer strong{display:block;font-size:clamp(24px,7vw,34px);line-height:1.23;letter-spacing:-.045em}.offer em{display:block;margin-top:9px;color:#697066;font-size:11px;font-style:normal}.choices{display:grid;gap:9px}.choice,.primary,.secondary,.hold{width:100%;min-height:58px;padding:13px 16px;border-radius:17px;cursor:pointer}.choice{border:1px solid #ffffff13;background:#12160f;color:var(--text);text-align:left}.choice strong{display:block;font-size:15px;line-height:1.35}.choice.no strong:before{content:'NO  ';color:#9ba293;font-size:8px;letter-spacing:.1em}.choice.yes{border-color:#d8ff5b47;background:#172012}.primary{border:0;background:var(--lime);color:#11140d;font-weight:1000}.secondary{border:1px solid #ffffff13;background:#12160f;color:var(--text);font-weight:900}.tech{margin-top:12px;color:#727a6d;font-size:9px;text-align:center}.action{margin:18px 0;padding:22px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(160deg,#151b10,#0c0f0a)}.action h2{margin:0 0 8px;text-align:center;font-size:30px;letter-spacing:-.05em}.action p{margin:0;color:#b2b8aa;text-align:center;font-size:13px;line-height:1.65}.icon{width:78px;height:78px;margin:0 auto 17px;border:1px solid #d8ff5b38;border-radius:50%;display:grid;place-items:center;font-size:29px}.hold{margin-top:18px;border:0;background:#eef3df;color:#11150e;font-weight:1000;touch-action:none}.hold.holding{background:var(--lime)}.ring{--p:0;width:132px;height:132px;margin:6px auto 18px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--lime) calc(var(--p)*1%),#20251c 0)}.ring:after{content:'';position:absolute;inset:9px;border-radius:50%;background:#0f130c}.ring b{position:relative;z-index:1;font-size:34px}.result{margin:16px 0;padding:22px;border:1px solid var(--line);border-radius:28px;background:#10140d}.result-main{text-align:center;padding:8px 0 18px}.result-main b{display:block;color:var(--lime);font-size:70px;line-height:.9}.result-main span{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;border:1px solid #ffffff10;border-radius:15px;text-align:center}.stat strong{display:block;font-size:24px}.stat small{font-size:9px;color:var(--muted)}.reveal{margin-top:14px;padding-top:14px;border-top:1px solid #ffffff10}.reveal h3{margin:0 0 8px;color:var(--muted);font-size:10px;letter-spacing:.12em}.reveal p{margin:0;color:#c6ccbf;font-size:12px;line-height:1.7}.modal{position:fixed;inset:0;z-index:50;padding:14px;display:grid;align-items:end;background:#000a}.sheet{width:min(100%,530px);margin:auto;padding:20px;border:1px solid #ffffff14;border-radius:26px;background:#141811}.sheet h2{margin:0 0 8px;font-size:25px}.sheet p{margin:0 0 15px;color:var(--muted);font-size:12px;line-height:1.65}.fine{margin-top:10px;color:#6d7568;font-size:9px;line-height:1.5;text-align:center}@media(max-height:700px){.screen{justify-content:flex-start}.offer-wrap{min-height:145px;margin:10px 0}.offer{padding:17px}.choice{min-height:52px}.action{margin:9px 0;padding:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app" class="app"></div><script>
(()=>{const app=document.getElementById('app'),TEST=new URLSearchParams(location.search).get('test')==='1',A='levelup-negotiator-rest-active-v1',H='levelup-negotiator-rest-history-v1';const fresh=()=>({stage:'opening',restSeconds:0,resistance:0,reason:null,offer:100,exitOpen:false,finalized:false});let state=load()||fresh(),timer=null;
function history(){try{return JSON.parse(localStorage.getItem(H)||'{"sessions":0,"totalRest":0,"lastRest":0,"lastResistance":0}')}catch{return {sessions:0,totalRest:0,lastRest:0,lastResistance:0}}}function load(){try{const s=JSON.parse(localStorage.getItem(A)||'null');return s&&s.stage!=='done'&&!s.finalized?s:null}catch{return null}}function save(){try{localStorage.setItem(A,JSON.stringify(state))}catch{}}function go(stage,patch={}){clearTimeout(timer);state={...state,...patch,stage,exitOpen:false};save();render()}function no(reason,next,offer){state.resistance++;if(reason)state.reason=reason;go(next,{offer})}
function board(){return `<div class="board"><div class="meter ask"><div class="mh"><span>要求サイズ</span><b>${state.offer}%</b></div><div class="track"><i style="width:${state.offer}%"></i></div></div><div class="meter rest"><div class="mh"><span>休息残高</span><b>${state.restSeconds}秒</b></div><div class="track"><i style="width:${Math.min(100,state.restSeconds/30*100)}%"></i></div></div></div>`}function shell(content,b=true){return `<div class="shell"><header class="top"><div class="brand">NEGOTIATOR / LEVEL UP</div><button class="exit" data-action="exit">終了</button></header>${b?board():''}${content}<div class="fine">無理に続ける必要はありません。体調に異変があるときは、このアプリより休息や必要な支援を優先してください。</div></div>${state.exitOpen?modal():''}`}
const offers={opening:'2週間、全部休みませんか？',five:'では、5分だけ休みませんか？',one:'1分だけ。時計を止める感覚で。',water:'休憩じゃなくていい。水を一口だけ。',shoulder:'肩を1cmだけ下げませんか？',eyes:'10秒だけ、画面の外を見ませんか？',breath:'8秒だけ、長く息を吐きませんか？',final:'あと少しだけ、何もしない。'};
function offer({title,copy,choices,tech}){const h=history(),prev=h.sessions?`<div class="previous">前回 ${h.lastRest}秒休息 / NO ${h.lastResistance}回</div>`:'';return shell(`<section class="screen"><div class="kicker">${state.stage==='opening'?'NEGOTIATOR':'COUNTER OFFER'}</div>${prev}<h1 class="title">${title}</h1><p class="lead">${copy}</p><div class="offer-wrap"><div class="offer" style="--w:${Math.max(42,state.offer)}%"><small>こちらの提案</small><strong>${offers[state.stage]}</strong><em>NOなら、さらに条件を下げます。</em></div></div><div class="choices">${choices.map(x=>`<button class="choice ${x.y?'yes':'no'}" data-choice="${x.id}"><strong>${x.t}</strong></button>`).join('')}</div>${tech?`<div class="tech">${tech}</div>`:''}</section>`)}
function action(title,copy,button,extra=''){return shell(`<section class="screen"><div class="kicker">MICRO BREAK</div><div class="action">${extra}<h2>${title}</h2><p>${copy}</p>${button}</div></section>`)}function timed(title,copy,secs){return action(title,copy,'<button class="secondary" data-choice="action-cancel">途中で戻る</button>',`<div class="ring" data-ring><b data-count>${secs}</b></div>`)}function restTimer(secs){return shell(`<section class="screen"><div class="kicker">DEAL ACCEPTED</div><h1 class="title">交渉成立。</h1><p class="lead">仕事は消えません。戻る時刻だけ決めて、いまはタイマーに預けます。</p><div class="action"><div class="ring" data-ring><b data-count>${secs}</b></div><h2>${secs===60?'1分':'5分'}だけ休む</h2><p>途中で戻っても構いません。実際に止まった秒数だけ記録します。</p></div><button class="secondary" data-choice="timer-stop">途中で戻る</button></section>`)}
function result(){const h=history(),success=state.restSeconds>=30||state.timerStartedAt;return shell(`<section class="screen"><div class="kicker">${success?'NEGOTIATION COMPLETE':'NEGOTIATION CLOSED'}</div><h1 class="title">${success?'休むと言う前に、少し休めました。':'今日は、ここで終了。'}</h1><div class="result"><div class="result-main"><b>${state.restSeconds}</b><span>実際に仕事・画面・緊張から外した秒</span></div><div class="stats"><div class="stat"><strong>${state.resistance}</strong><small>NO / 抵抗</small></div><div class="stat"><strong>${100-state.offer}%</strong><small>要求を値切った幅</small></div></div><div class="reveal"><h3>今回こちらが使った手</h3><p>大きな要求 → 要求縮小 → 「休む」の言い換え → 小さなYES → すでにできた行動を足場にする。あなたが押した選択以外のことは推測していません。</p></div></div><div class="choices"><button class="primary" data-choice="again">もう一度交渉する</button><button class="secondary" data-choice="share">結果を共有</button></div><div class="tech">累計 ${h.sessions}回 · ${h.totalRest}秒</div></section>`,false)}function modal(){return `<div class="modal"><div class="sheet"><h2>ここで終わって大丈夫です。</h2><p>NEGOTIATORはユーザーを閉じ込めません。続けるか、今すぐ戻るかはあなたが決めます。</p><div class="choices"><button class="primary" data-action="continue">交渉を続ける</button><button class="secondary" data-action="quit">今日は終了する</button></div></div></div>`}
function render(){clearTimeout(timer);let v='';switch(state.stage){case'opening':v=offer({title:'あなたを休ませます。',copy:'NOで構いません。拒否されたら、こちらが条件を下げます。',choices:[{id:'open-yes',t:'休む。2週間でもいい',y:1},{id:'open-busy',t:'無理。仕事がある'},{id:'open-tasks',t:'そんな暇ない。やることある'}]});break;case'five':v=offer({title:'2週間は撤回します。',copy:state.reason==='busy'?'仕事がある。了解。では5分だけ空白を置く提案です。':'全部を止める話はやめます。5分だけなら？',tech:'交渉技：大きな要求から小さな要求へ',choices:[{id:'five-yes',t:'5分なら休む',y:1},{id:'five-no',t:'5分も無理'},{id:'five-anxious',t:'止まる方が落ち着かない'}]});break;case'one':v=offer({title:'5分も撤回します。',copy:'1分で回復しなくていい。ただ止まるだけ。',tech:'交渉技：要求をさらに小さくする',choices:[{id:'one-yes',t:'1分ならやる',y:1},{id:'one-busy',t:'1分でも惜しい'},{id:'one-tasks',t:'まだ「休む」は嫌だ'}]});break;case'water':v=offer({title:'「休む」も撤回します。',copy:'休憩しなくていいです。作業の途中で水を一口。それだけなら？',tech:'交渉技：目的を保ったまま言い方を変える',choices:[{id:'water-yes',t:'水なら飲む',y:1},{id:'water-no',t:'水もいらない'},{id:'water-hands',t:'手を止めたくない'}]});break;case'shoulder':v=offer({title:'水も必須ではありません。',copy:'座ったまま。肩を1cm下げるだけに値切ります。',choices:[{id:'shoulder-yes',t:'4秒ならやる',y:1},{id:'shoulder-no',t:'それすら面倒'},{id:'shoulder-busy',t:'今は動きたくない'}]});break;case'eyes':v=offer({title:'目だけ、仕事から外します。',copy:'立たない。片づけない。10秒だけ別の場所を見る。',choices:[{id:'eyes-yes',t:'10秒なら見る',y:1},{id:'eyes-no',t:'画面から目を離したくない'},{id:'eyes-back',t:'もう仕事に戻りたい'}]});break;case'breath':v=offer({title:'では最後に呼吸だけ。',copy:'深呼吸を頑張る必要はありません。長く吐くだけです。',choices:[{id:'breath-yes',t:'8秒なら吐く',y:1},{id:'breath-no',t:'呼吸はいい'},{id:'breath-back',t:'本当に戻りたい'}]});break;case'final':v=offer({title:state.restSeconds?`もう${state.restSeconds}秒、離れています。`:'ここまで全部NOでもOK。',copy:state.restSeconds?'「休む」と決める前に、少し休めました。30秒だけ完成させますか？':'終了はあなたが決められます。最後に3秒だけ提案します。',choices:[{id:'final-yes',t:`あと${Math.max(3,30-state.restSeconds)}秒だけ止まる`,y:1},{id:'final-five',t:'逆に5分なら休む',y:1},{id:'final-back',t:'今日はここで戻る'}]});break;case'water-action':v=action('一口だけ。','量はどうでもいいです。飲んだら、それだけ教えてください。','<button class="hold" data-choice="water-done">飲んだ</button><button class="secondary" data-choice="water-skip">今は飲まない</button>','<div class="icon">水</div>');break;case'shoulder-action':v=action('肩を1cm下げる。','下のボタンを押している4秒だけ、肩とあごの力を抜きます。','<button class="hold" data-hold="shoulder">4秒 押し続ける</button><button class="secondary" data-choice="shoulder-skip">やっぱりやめる</button>','<div class="icon">↓</div>');break;case'eyes-action':v=timed('視線を外す','この画面を見なくて大丈夫です。遠くの一点へ。',10);break;case'breath-action':v=timed('長く吐く','吸うことより、ゆっくり吐くことだけ意識。',8);break;case'final-action':v=timed('何もしない','手を止めて、交渉を終わらせます。',Math.max(3,30-state.restSeconds));break;case'timer60':v=restTimer(60);break;case'timer300':v=restTimer(300);break;case'done':v=result();break;default:state=fresh();save();return render()}app.innerHTML=v;bind();if(['eyes-action','breath-action','final-action'].includes(state.stage))startMicro();if(['timer60','timer300'].includes(state.stage))startTimer()}
function ring(secs,done){const start=Date.now(),dur=TEST?120:secs*1000,r=document.querySelector('[data-ring]'),c=document.querySelector('[data-count]');const tick=()=>{const q=Math.min(1,(Date.now()-start)/dur);if(r)r.style.setProperty('--p',q*100);if(c)c.textContent=Math.max(0,Math.ceil(secs*(1-q)));if(q>=1)return done();timer=setTimeout(tick,TEST?15:100)};tick()}function startMicro(){const k=state.stage.replace('-action',''),secs=k==='eyes'?10:k==='breath'?8:Math.max(3,30-state.restSeconds);ring(secs,()=>{state.restSeconds+=secs;if(k==='eyes')go('breath',{offer:6});else if(k==='breath')go('final',{offer:3});else finish(false)})}function startTimer(){const secs=state.stage==='timer60'?60:300,start=Date.now(),dur=TEST?220:secs*1000;state.timerStartedAt=start;state.timerIntended=secs;save();const r=document.querySelector('[data-ring]'),c=document.querySelector('[data-count]');const tick=()=>{const q=Math.min(1,(Date.now()-start)/dur);if(r)r.style.setProperty('--p',q*100);if(c)c.textContent=Math.max(0,Math.ceil(secs*(1-q)));if(q>=1){state.restSeconds+=secs;return finish(false)}timer=setTimeout(tick,TEST?20:200)};tick()}function stopTimer(){const intended=state.timerIntended||0,div=TEST?(220/intended):1000,actual=state.timerStartedAt?Math.max(1,Math.min(intended,Math.floor((Date.now()-state.timerStartedAt)/div))):0;state.restSeconds+=actual;finish(false)}
function finish(quit){if(!state.finalized){const h=history();try{localStorage.setItem(H,JSON.stringify({sessions:h.sessions+1,totalRest:h.totalRest+state.restSeconds,lastRest:state.restSeconds,lastResistance:state.resistance}))}catch{}state.finalized=true}state.exitOpen=false;state.stage='done';state.quit=!!quit;try{localStorage.removeItem(A)}catch{}render()}function bind(){document.querySelector('[data-action="exit"]')?.addEventListener('click',()=>{state.exitOpen=true;render()});document.querySelector('[data-action="continue"]')?.addEventListener('click',()=>{state.exitOpen=false;render()});document.querySelector('[data-action="quit"]')?.addEventListener('click',()=>finish(true));document.querySelectorAll('[data-choice]').forEach(x=>x.addEventListener('click',()=>choose(x.dataset.choice)));const h=document.querySelector('[data-hold="shoulder"]');if(h){let t;const cancel=()=>{clearTimeout(t);t=null;h.classList.remove('holding');h.textContent='4秒 押し続ける'};h.addEventListener('pointerdown',e=>{e.preventDefault();h.classList.add('holding');h.textContent='そのまま…';t=setTimeout(()=>{t=null;state.restSeconds+=4;go('eyes',{offer:11})},TEST?100:4000)});h.addEventListener('pointerup',cancel);h.addEventListener('pointercancel',cancel)}}function choose(id){const m={ 'open-busy':['busy','five',72],'open-tasks':['tasks','five',72],'five-no':[null,'one',48],'five-anxious':['anxious','one',48],'one-busy':['busy','water',29],'one-tasks':['tasks','water',29],'water-no':[null,'shoulder',18],'water-hands':['busy','shoulder',18],'water-skip':[null,'shoulder',18],'shoulder-no':[null,'eyes',11],'shoulder-busy':['busy','eyes',11],'shoulder-skip':[null,'eyes',11],'eyes-no':[null,'breath',6],'eyes-back':[null,'breath',6],'breath-no':[null,'final',3],'breath-back':[null,'final',3]};if(m[id])return no(...m[id]);switch(id){case'open-yes':case'five-yes':go('timer300',{offer:48});break;case'one-yes':go('timer60',{offer:29});break;case'water-yes':go('water-action',{offer:18});break;case'water-done':setTimeout(()=>go('shoulder',{offer:18}),TEST?30:350);break;case'shoulder-yes':go('shoulder-action',{offer:11});break;case'eyes-yes':go('eyes-action',{offer:6});break;case'breath-yes':go('breath-action',{offer:3});break;case'final-yes':go('final-action',{offer:1});break;case'final-five':go('timer300',{offer:1});break;case'final-back':finish(false);break;case'action-cancel':go('final',{offer:3});break;case'timer-stop':stopTimer();break;case'again':state=fresh();save();render();break;case'share':share();break;}}async function share(){const text=`NEGOTIATOR｜休ませる\n${state.resistance}回NOと言って、${state.restSeconds}秒だけ休めた。\nhttps://levelup.hitobito.jp/apps/negotiator-rest/`;try{if(navigator.share)await navigator.share({title:'NEGOTIATOR｜休ませる',text});else await navigator.clipboard.writeText(text)}catch{}}render()})();
</script></body></html>
