<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="3秒以内に、やる・捨てる・任せる。即着手の反射を鍛えるLEVEL UPゲーム。">
<title>3秒で動け | LEVEL UP</title>
<style>
:root{color-scheme:dark;--bg:#080c17;--panel:#141b30;--text:#f7f9ff;--muted:#98a5c2;--yellow:#ffe45e;--red:#ff6b5f;--blue:#68b7ff;--green:#6fe7a8;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{overscroll-behavior:none}.app{min-height:100svh;color:var(--text);background:radial-gradient(circle at 50% 0,#16264a 0,transparent 38%),linear-gradient(#0b1020,#070a12);display:flex;justify-content:center}.shell{width:min(100%,520px);min-height:100svh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:40px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:1000;letter-spacing:.02em}.brand span{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:7px;border-radius:8px;background:linear-gradient(135deg,var(--yellow),var(--red));color:#111}.muted{color:var(--muted);font-size:12px}.hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:30px 8px}.bolt{font-size:72px}.hero h1{font-size:clamp(40px,12vw,64px);line-height:.95;margin:14px 0 10px;letter-spacing:-.06em}.hero p{color:var(--muted);line-height:1.75;margin:8px auto 22px;max-width:350px}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:24px}.chip{border:1px solid #ffffff1c;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.btn{border:0;border-radius:18px;min-height:58px;width:100%;font:inherit;font-weight:1000;font-size:16px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--yellow),#ffb24c,var(--red));color:#161820}.btn.ghost{background:#ffffff0c;color:var(--text);border:1px solid #ffffff1b}.btn:active,.choice:active{transform:scale(.98)}.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:10px 0}.track{height:7px;border-radius:99px;background:#ffffff12;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .2s}.arena{flex:1;min-height:390px;display:flex;align-items:center;position:relative}.stack{position:absolute;inset:62px 18px 95px;pointer-events:none}.paper{position:absolute;inset:0;border:1px solid #ffffff16;border-radius:28px;background:#1c2540cc}.paper:nth-child(1){transform:rotate(-7deg) scale(.93)}.paper:nth-child(2){transform:rotate(5deg) scale(.96)}.paper:nth-child(3){transform:rotate(-2deg) scale(.98)}.card{position:relative;width:100%;min-height:350px;z-index:2;border-radius:30px;border:1px solid #ffffff20;background:linear-gradient(155deg,#202b4b,#11172a);box-shadow:0 26px 70px #0007;padding:25px 22px;display:flex;flex-direction:column;text-align:center;align-items:center;animation:in .18s ease}.icon{width:82px;height:82px;border-radius:26px;background:#ffffff0e;border:1px solid #ffffff1c;display:grid;place-items:center;font-size:45px}.type{margin-top:18px;color:var(--blue);font-size:11px;font-weight:1000;letter-spacing:.16em}.title{font-size:30px;line-height:1.25;margin:9px 0 7px;font-weight:1000;letter-spacing:-.035em}.detail{color:var(--muted);font-size:13px;line-height:1.65;max-width:320px}.timer{margin-top:auto;width:100%;display:flex;align-items:center;gap:10px}.timer .track{height:12px;flex:1}.timer .fill{transform-origin:left;background:linear-gradient(90deg,var(--green),var(--yellow) 55%,var(--red))}.sec{font-size:23px;font-weight:1000;font-variant-numeric:tabular-nums;width:50px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{min-height:80px;border-radius:18px;border:1px solid #ffffff20;color:#fff;font:inherit;font-weight:1000;cursor:pointer}.choice b{display:block;font-size:23px;margin-bottom:4px}.do{background:#6fe7a81b}.drop{background:#ff6b5f1b}.delegate{background:#68b7ff1b}.toast{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#fff;color:#111827;border-radius:999px;padding:10px 15px;font-size:12px;font-weight:1000;z-index:30;animation:toast .7s both}.toast.bad{background:#ff8178}.toast.good{background:#90efba}.reality{justify-content:center}.badge{background:var(--yellow);color:#141820;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:1000}.reality .icon{background:none;border:0;font-size:66px}.count{font-size:78px;color:var(--yellow);font-weight:1000;margin:12px}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:8px;width:100%;margin-top:22px}.result{padding:34px 0}.grade{font-size:88px;font-weight:1000;line-height:1;background:linear-gradient(135deg,var(--yellow),var(--red));background-clip:text;color:transparent}.result h2{font-size:30px;margin:6px 0}.result p{color:var(--muted);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.stat,.box{background:#ffffff0b;border:1px solid #ffffff16;border-radius:18px;padding:16px}.stat strong{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted)}.box{margin:10px 0}.box small{color:var(--blue);font-weight:1000}.box h3{margin:7px 0 5px}.actions{display:grid;gap:8px;margin-top:16px}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.stage .big{font-size:70px}.stage h2{font-size:35px;margin:6px}.stage p{color:var(--muted);line-height:1.7}.pause{position:fixed;inset:0;background:#050812e8;z-index:50;display:grid;place-items:center;padding:18px}.pause>div{width:min(100%,380px);background:#151d33;border:1px solid #ffffff1d;border-radius:24px;padding:22px}@keyframes in{from{opacity:0;transform:translateY(12px) scale(.98)}}@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,8px)}15%,80%{opacity:1;transform:translate(-50%,0)}}@media(max-height:680px){.card{min-height:300px;padding:18px}.arena{min-height:320px}.icon{width:66px;height:66px;font-size:38px}.title{font-size:25px}.choice{min-height:68px}}
</style>
</head>
<body><div id="app" class="app"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),app=$('#app'),D=3000,R=30;
const stages=[{name:'反射',icon:'⚡',copy:'まずはゲーム内だけ。3秒以内に分類する。'},{name:'ノイズ',icon:'🧹',copy:'「気になるだけ」を捨て、抱えなくていいものを任せる。'},{name:'現実接続',icon:'🚪',copy:'30秒以内の現実行動を混ぜる。全部やる必要はない。'}];
const tasks=[
['🥤','机の横の水を一口飲む','30秒で終わるなら、考える前に動く。','do'],['📩','確認だけで返せるメッセージ','長文が必要なら今はやらない。','do'],['🗑️','机のゴミを1個捨てる','1個でいい。片付けを始めない。','do'],['📰','あとで読むかもしれない記事','今日の目的に不要なら閉じる。','drop'],['💡','いつかやりたい新しい企画','今の仕事を止めるなら、今回は捨てる。','drop'],['🔔','内容のない通知','反応する必要がないなら消す。','drop'],['📊','定型レポートの転記','手順が決まっているなら任せられる。','delegate'],['📅','日程候補の整理','条件が明確なら人やAIに渡せる。','delegate'],['🧾','領収書の一覧化','判断不要の作業は抱えない。','delegate'],['✉️','「了解です」だけの返信','30秒未満なら今終わらせる。','do'],['🧠','気になるけど今は使わない情報','保存するだけでもWIP。不要なら捨てる。','drop'],['📝','会議メモの清書','目的と形式が決まっているなら任せる。','delegate']];
const reality=[['🥤','水を一口飲む'],['🗑️','目の前のゴミを1個捨てる'],['📩','30秒で返せる返信を1件する'],['📚','物を1個だけ元の場所へ戻す']];
let st={screen:'home',stage:0,turn:0,backlog:0,score:0,streak:0,max:0,correct:0,late:0,done:0,dec:[],started:0,raf:0,timer:0,realStarted:0,paused:false};
const shell=(body,meta='')=>`<main class="shell"><header class="top"><div class="brand"><span>⚡</span>3秒で動け</div><div class="muted">${meta}</div></header>${body}</main>`;
function home(){cancel();st.screen='home';app.innerHTML=shell(`<section class="hero"><div class="bolt">⚡</div><h1>3秒で動け</h1><p>考え込む前に、<b>やる／捨てる／任せる</b>。即着手の反射をゲームで作る。</p><div class="chips"><span class="chip">3秒判断</span><span class="chip">未処理を減らす</span><span class="chip">30秒の現実行動</span></div><button class="btn primary" data-a="start">スタート</button><p class="muted">正解探しより、止まらず決める。</p></section>`)}
function reset(){st={screen:'stage',stage:0,turn:0,backlog:0,score:0,streak:0,max:0,correct:0,late:0,done:0,dec:[],started:0,raf:0,timer:0,realStarted:0,paused:false};stageIntro()}
function stageIntro(){const s=stages[st.stage];st.screen='stage';app.innerHTML=shell(`<section class="stage"><div class="big">${s.icon}</div><div class="muted">STAGE ${st.stage+1} / 3</div><h2>${s.name}</h2><p>${s.copy}</p><button class="btn primary" data-a="go">始める</button></section>`,`${s.name}`)}
function shouldReality(){return st.stage===2&&st.turn>0&&st.turn%4===0&&st.done<2}
function next(){if(st.turn>=12){if(st.stage<2){st.stage++;st.turn=0;return stageIntro()}return result()}if(shouldReality())return realPrompt();renderTask()}
function renderTask(){cancelAnimationFrame(st.raf);st.screen='decision';const t=tasks[(st.stage*4+st.turn)%tasks.length],pct=Math.round(((st.stage*12+st.turn)/36)*100);st.started=performance.now();app.innerHTML=shell(`<div class="hud"><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="muted"><b data-b>${st.backlog}</b> 未処理</div></div><section class="arena"><div class="stack">${'<div class="paper"></div>'.repeat(Math.min(3,st.backlog))}</div><article class="card"><div class="icon">${t[0]}</div><div class="type">3秒で分類</div><h2 class="title">${t[1]}</h2><p class="detail">${t[2]}</p><div class="timer"><div class="track"><div class="fill" data-fill></div></div><div class="sec" data-sec>3.0</div></div></article></section><div class="choices"><button class="choice do" data-c="do"><b>✓</b>やる</button><button class="choice drop" data-c="drop"><b>×</b>捨てる</button><button class="choice delegate" data-c="delegate"><b>→</b>任せる</button></div>`,stages[st.stage].name);st.raf=requestAnimationFrame(tick)}
function tick(now){if(st.screen!=='decision'||st.paused)return;const e=now-st.started,r=Math.max(0,1-e/D);const f=$('[data-fill]'),n=$('[data-sec]');if(f)f.style.transform=`scaleX(${r})`;if(n)n.textContent=Math.max(0,(D-e)/1000).toFixed(1);if(e>=D&&!st._timed){st._timed=true;st.late++;st.backlog++;updateBacklog();toast('未処理 +1','bad')}st.raf=requestAnimationFrame(tick)}
function updateBacklog(){const b=$('[data-b]');if(b)b.textContent=st.backlog;const stack=$('.stack');if(stack)stack.innerHTML='<div class="paper"></div>'.repeat(Math.min(3,st.backlog))}
function choose(c){if(st.screen!=='decision'||st.paused)return;cancelAnimationFrame(st.raf);const t=tasks[(st.stage*4+st.turn)%tasks.length],elapsed=performance.now()-st.started,within=elapsed<=D,best=t[3];st.dec.push({elapsed,within,best,c});if(c===best){st.correct++;st.score+=within?180:100;st.streak++;st.max=Math.max(st.max,st.streak);st.backlog=Math.max(0,st.backlog-1);toast(within?'即決 ✓':'決めた。次へ','good')}else{st.streak=0;st.score+=within?70:40;toast('止まらず決めた','')}st.turn++;st._timed=false;setTimeout(next,260)}
function realPrompt(){const r=reality[st.done%reality.length];st.screen='realPrompt';app.innerHTML=shell(`<section class="arena"><article class="card reality"><div class="badge">現実ミッション</div><div class="icon">${r[0]}</div><h2 class="title">${r[1]}</h2><p class="detail">30秒で終わる範囲だけ。無理ならパスしていい。</p><div class="two"><button class="btn primary" data-a="realStart">今やる</button><button class="btn ghost" data-a="skip">パス</button></div></article></section>`,stages[st.stage].name)}
function realStart(){if(st.screen!=='realPrompt')return;const r=reality[st.done%reality.length];st.screen='realRun';st.realStarted=Date.now();app.innerHTML=shell(`<section class="arena"><article class="card reality"><div class="badge">画面から離れてOK</div><div class="icon">${r[0]}</div><h2 class="title">${r[1]}</h2><div class="count" data-count>${R}</div><p class="detail">終わった瞬間に押す。全部やろうとしない。</p><button class="btn primary" data-a="done">できた</button></article></section>`,stages[st.stage].name);clearInterval(st.timer);st.timer=setInterval(()=>{const left=Math.max(0,R-Math.floor((Date.now()-st.realStarted)/1000));const el=$('[data-count]');if(el)el.textContent=left;if(left<=0){clearInterval(st.timer);st.turn++;toast('30秒。ここで切る','');setTimeout(next,300)}},250)}
function done(){if(st.screen!=='realRun')return;clearInterval(st.timer);st.done++;st.score+=350;st.backlog=Math.max(0,st.backlog-1);st.turn++;toast('現実で1つ動いた ✓','good');setTimeout(next,350)}
function skip(){if(st.screen!=='realPrompt')return;st.turn++;toast('パスも即決','');setTimeout(next,250)}
function avg(){return st.dec.length?st.dec.reduce((a,x)=>a+x.elapsed,0)/st.dec.length:0}
function insight(){const total=st.dec.length||1,late=st.dec.filter(x=>!x.within).length/total,del=st.dec.filter(x=>x.best==='delegate'&&x.c!=='delegate').length,drop=st.dec.filter(x=>x.best==='drop'&&x.c!=='drop').length;if(late>.25)return['考える時間が長くなりやすい','次は正解より「まず分類」を優先すると反射が作りやすい。'];if(del>=2)return['自分で抱えやすい','判断不要・手順化済みなら、早めに人やAIへ出す。'];if(drop>=2)return['「気になる」を残しやすい','今使わない情報を捨てると、頭の未処理が軽くなる。'];return['分類の反射ができている','現実でも「30秒だけ着手」をつなげると定着しやすい。']}
function result(){cancel();st.screen='result';const a=avg(),rate=st.dec.length?Math.round(st.dec.filter(x=>x.within).length/st.dec.length*100):0,acc=st.dec.length?Math.round(st.correct/st.dec.length*100):0,g=a<=1300&&rate>=95?'S':a<=1800&&rate>=90?'A':a<=2400&&rate>=80?'B':'C',ins=insight();app.innerHTML=shell(`<section class="result"><div class="grade">${g}</div><h2>${g==='S'?'反射で動けている':g==='A'?'かなり速い':g==='B'?'あと少しで反射になる':'考える前に切ろう'}</h2><p>今回のプレイ傾向。診断ではなく、次の1回のための目安。</p><div class="stats"><div class="stat"><strong>${(a/1000).toFixed(2)}s</strong><span>平均判断</span></div><div class="stat"><strong>${rate}%</strong><span>3秒以内</span></div><div class="stat"><strong>${st.done}</strong><span>現実着手</span></div></div><div class="box"><small>今回の傾向</small><h3>${ins[0]}</h3><p>${ins[1]}</p></div><div class="box"><small>REFLEX SCORE</small><h3>${st.score.toLocaleString()} pts · 最長 ${st.max}連続即決</h3><p>分類一致 ${acc}% ／ 3秒超過 ${st.late}回。正解率より「止まらず決める」を先に伸ばす。</p></div><div class="actions"><button class="btn primary" data-a="restart">もう1回</button><button class="btn ghost" data-a="home">終了</button></div></section>`)}
function toast(msg,cls=''){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className=`toast ${cls}`;e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),720)}
function pause(){if(st.screen!=='decision'||st.paused)return;st.paused=true;cancelAnimationFrame(st.raf);const elapsed=performance.now()-st.started;const e=document.createElement('div');e.className='pause';e.dataset.pause='1';e.innerHTML=`<div><h2>一時停止</h2><p class="muted">通常の3秒判断だけ止めています。</p><button class="btn primary" data-a="resume" data-elapsed="${elapsed}">戻る</button></div>`;document.body.appendChild(e)}
function resume(elapsed){document.querySelector('[data-pause]')?.remove();st.paused=false;st.started=performance.now()-Number(elapsed||0);st.raf=requestAnimationFrame(tick)}
function cancel(){cancelAnimationFrame(st.raf);clearInterval(st.timer)}
app.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c)return choose(c.dataset.c);const b=e.target.closest('[data-a]');if(!b)return;({start:reset,go:next,realStart,done,skip,restart:reset,home, resume:()=>resume(b.dataset.elapsed)})[b.dataset.a]?.()});
document.addEventListener('keydown',e=>{if(st.screen==='decision'){if(['ArrowLeft','a'].includes(e.key))choose('do');if(['ArrowDown','s'].includes(e.key))choose('drop');if(['ArrowRight','d'].includes(e.key))choose('delegate')}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st.screen==='decision'&&!st.paused)pause()});
home();
})();
</script></body></html>
