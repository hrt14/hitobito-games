<div class="app">
  <section id="hub" class="screen hub active" aria-label="テーマ選択">
    <div class="hub-head"><div class="brand">PEEL SERIES</div><h1>世界を、<br>一枚ずつめくる。</h1><p>上へスワイプするだけ。地球、人体、東京、記憶まで。表面の下に隠れている世界へ。</p></div>
    <div id="themeGrid" class="theme-grid"></div>
  </section>

  <section id="play" class="screen play" aria-label="ゲーム">
    <div id="gameBg" class="game-bg"></div>
    <header class="topbar">
      <button id="backBtn" class="iconbtn" aria-label="テーマ選択に戻る">‹</button>
      <div class="game-title"><small id="seriesLabel">PEEL</small><strong id="gameName"></strong></div>
      <button id="collectionBtn" class="iconbtn" aria-label="発見物">◇</button>
    </header>
    <div class="progress"><i id="progressBar"></i></div>
    <main class="stage">
      <div class="layer-wrap">
        <div id="underCard" class="under-card"></div>
        <div id="layerCard" class="layer-card">
          <div class="texture"></div><div id="scene" class="scene"></div><div class="peel-edge"></div>
          <div class="layer-meta"><div><small id="layerIndex"></small><strong id="layerName"></strong></div><div id="depthLabel" class="depth"></div></div>
        </div>
        <div id="hint" class="hint"><div class="arrow">↑</div><strong>上へめくる</strong><small>ゆっくり大きくめくると PERFECT</small></div>
      </div>
    </main>
    <div id="toast" class="toast"><div id="toastIcon" class="gem"></div><div><small>DISCOVERY</small><strong id="toastTitle"></strong><p id="toastNote"></p></div></div>
    <div id="perfect" class="perfect">PERFECT</div>
    <section id="ending" class="ending" aria-hidden="true"><div class="end-card"><div id="endOrb" class="end-orb"></div><div class="brand">DEEPEST LAYER</div><h2 id="endTitle"></h2><p id="endText"></p><div class="end-stats"><div><small>発見</small><strong id="endFound"></strong></div><div><small>PERFECT</small><strong id="endPerfect"></strong></div></div><div class="end-actions"><button id="replayBtn" class="primary">もう一度</button><button id="themesBtn" class="secondary">別の世界へ</button></div></div></section>
    <aside id="collection" class="collection" aria-hidden="true"><div class="collection-head"><div><div class="brand">DISCOVERIES</div><h2 id="collectionTitle">発見したもの</h2></div><button id="closeCollection" class="iconbtn">×</button></div><div id="discoveries" class="discoveries"></div></aside>
  </section>
</div>

function pointerEnd(e){if(!dragging)return;dragging=false;const duration=performance.now()-startT,up=-dy;if(up>78){const isPerfect=up>155&&duration>320&&duration<1500;commitPeel(isPerfect)}else{$('#layerCard').classList.add('snap');$('#layerCard').style.transform='';$('#layerCard').style.filter=''}}
function commitPeel(isPerfect){const t=T[themeKey],layer=t.layers[idx];if(isPerfect){perfects++;const p=$('#perfect');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop');if(navigator.vibrate)navigator.vibrate([12,28,18])}else if(navigator.vibrate)navigator.vibrate(10);discover(layer,isPerfect);$('#layerCard').classList.add('commit');$('#layerCard').style.transform=`translate3d(0,-125%,0) rotate(${dy<-150?'-5':'4'}deg) scale(.96)`;$('#layerCard').style.filter='brightness(1.15)';setTimeout(()=>{idx++;if(idx>=t.layers.length){finish()}else render()},390)}
function discover(layer,perfect){const d=progressData(themeKey),found=new Set(d.found||[]),id=idx;const chance=perfect?1:.74;if(found.has(id)||Math.random()<chance){found.add(id);d.found=[...found];saveData(themeKey,d);$('#toastIcon').textContent=layer[6];$('#toastTitle').textContent=layer[5];$('#toastNote').textContent=layer[7];$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}}
function finish(){const t=T[themeKey],d=progressData(themeKey);d.done=true;d.bestPerfect=Math.max(d.bestPerfect||0,perfects);saveData(themeKey,d);$('#progressBar').style.width='100%';$('#ending').style.setProperty('--end1',t.end[0]);$('#ending').style.setProperty('--end2',t.end[1]);$('#endOrb').textContent=t.orb;$('#endTitle').textContent=t.endTitle;$('#endText').textContent=t.endText;$('#endFound').textContent=`${(d.found||[]).length} / ${t.layers.length}`;$('#endPerfect').textContent=`${perfects} / ${t.layers.length}`;setTimeout(()=>$('#ending').classList.add('show'),180);buildHub()}
function showCollection(){const t=T[themeKey],d=progressData(themeKey),found=new Set(d.found||[]);$('#collectionTitle').textContent=t.name;$('#discoveries').innerHTML=t.layers.map((l,i)=>`<div class="disc ${found.has(i)?'':'locked'}"><div class="ico">${found.has(i)?l[6]:'◇'}</div><strong>${found.has(i)?l[5]:'未発見'}</strong><small>${found.has(i)?l[7]:`${l[0]}に何か隠れている`}</small></div>`).join('');$('#collection').classList.add('show');$('#collection').setAttribute('aria-hidden','false')}
$('#layerCard').addEventListener('pointerdown',pointerStart);$('#layerCard').addEventListener('pointermove',pointerMove);$('#layerCard').addEventListener('pointerup',pointerEnd);$('#layerCard').addEventListener('pointercancel',pointerEnd);
$('#backBtn').onclick=()=>{switchScreen('hub');buildHub()};$('#collectionBtn').onclick=showCollection;$('#closeCollection').onclick=()=>$('#collection').classList.remove('show');$('#replayBtn').onclick=()=>startTheme(themeKey);$('#themesBtn').onclick=()=>{switchScreen('hub');buildHub()};
buildHub();
</script>
