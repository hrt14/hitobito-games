!access(p)?'🔒':'⚓')+'</span><b>'+(!access(p)?'？？？':p.name)+'</b><small>'+(!access(p)?'霧の向こう':p.id===S.here?'現在地':reach(p)?'航海可能':p.region)+'</small>';b.onclick=()=>mapClick(p);$('ports').appendChild(b)});$('routes').innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none">'+R.map(r=>{let a=pt(r[0]),b=pt(r[1]),o=S.visited.includes(a.id)||S.visited.includes(b.id);return '<path class="route '+(o?'open':'')+'" d="M '+a.x+' '+a.y+' Q '+((a.x+b.x)/2+3)+' '+((a.y+b.y)/2-4)+' '+b.x+' '+b.y+'"/>'}).join('')+'</svg>';let p=pt(S.here);$('shipmark').style.left=p.x+'%';$('shipmark').style.top=p.y+'%';if(S.tutorial===0){$('mapTitle').textContent='小さな船から、世界へ。';$('mapHint').textContent='まずはリスボンをタップ。商品を積んで最初の航海へ。'}else if(S.tutorial===1||S.tutorial===2){$('mapTitle').textContent='最初の交易へ。';$('mapHint').textContent='光っているセビリアへ。ワインは向こうの方が高い。'}else{$('mapTitle').textContent=S.disc.length>2?'あなたの航路が、世界をつなぐ。':'まだ知らない海がある。';$('mapHint').textContent='光っている港が、いま到達できる航路。'}}function mapClick(p){if(p.id===S.here){S.tutorial=Math.max(S.tutorial,1);save();renderPort(p.id)}else if(reach(p))destModal(p)}function destModal(p){open('<span class="eyebrow">NEXT PORT</span><h2>'+p.name+'へ</h2><div class="shipart">⛵</div><p style="font-size:10px;line-height:1.65;color:#586b64">'+pt(S.here).name+'から'+p.name+'へ。航海中には天候・海賊・発見が起こる。</p><div class="triples"><div><small>積荷</small><b>'+count()+'/'+S.cap+'</b></div><div><small>船体</small><b>'+S.hp+'</b></div><div><small>航海</small><b>'+S.trips+'</b></div></div><button id="go" class="primary" style="width:100%;margin-top:12px"><small>帆を上げる</small><b>'+p.name+'へ出航</b><i>→</i></button>');$('go').onclick=()=>{close();sailTo(p.id)}}function renderPort(id){S.here=id;save();view('port');stats();let p=pt(id);$('portName').textContent=p.name;$('portRegion').textContent=p.region;$('loc').textContent=p.name;let pr=S.pros[id]||1;$('pros').textContent=pr>=4?'にぎわう港':'小さな港';$('city').innerHTML=[0,1,2,3,4,5].map((x,i)=>'<div class="bld" style="height:'+(34+(i%3)*15+pr*2)+'%;background:'+(i%2?'#c48660':'#b97658')+'"></div>').join('');market();shipyard();rumor();if(S.tutorial===1)toast('特産品のワインが安い。まず買ってみよう')}function price(g,pid=S.here){let p=pt(pid),n=1+((hash(pid+g+S.trips)%13)-6)/100;return Math.max(8,Math.round(G[g][2]*p.prices[g]*n))}function market(){let p=pt(S.here),ids=Object.keys(G).filter(g=>g===p.special||p.prices[g]<1.3).slice(0,4);if(!ids.includes(p.special))ids.unshift(p.special);$('goods').innerHTML=ids.map(g=>{let q=S.cargo[g]||0,v=price(g),best=Math.max(...P.filter(x=>conn(S.here,x.id)&&access(x)).map(x=>price(g,x.id)),v),good=best-v;return '<div class="good"><div class="gicon">'+G[g][1]+'</div><div class="ginfo"><b>'+G[g][0]+(g===p.special?' <span style="color:#ad6c30">特産</span>':'')+'</b><small>'+(q?'積荷 '+q+'個':good>50?'遠方で高値になりそう':'港ごとに相場が違う')+'</small><span class="price">'+v+'G</span></div><div class="buttons"><button class="buy" data-buy="'+g+'" '+(S.money>=v&&count()<S.cap?'':'disabled')+'>買う</button><button class="sell" data-sell="'+g+'" '+(q?'':'disabled')+'>売る</button></div></div>'}).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sell(b.dataset.sell))}function buy(g){let v=price(g);if(S.money<v||count()>=S.cap)return;S.money-=v;S.cargo[g]=(S.cargo[g]||0)+1;if(S.tutorial===1&&g==='wine')S.tutorial=2;save();stats();market();toast(G[g][0]+'を積み込んだ −'+v+'G')}function sell(g){if(!S.cargo[g])return;let v=price(g);S.cargo[g]--;if(!S.cargo[g])delete S.cargo[g];S.money+=v;S.pros[S.here]=Math.min(5,(S.pros[S.here]||1)+.35);if(S.tutorial===3)S.tutorial=4;save();stats();market();toast(G[g][0]+'が '+v+'Gで売れた！')}function shipyard(){let cost=S.ship===1?1200:S.ship===2?2600:5200,next=S.ship===1?14:S.ship===2?22:34;$('shipyard').innerHTML='<div class="shipcard"><div class="shipart">'+(S.ship>=3?'⛵⛵':'⛵')+'</div><b>'+(S.ship===1?'小型帆船「アステル」':S.ship===2?'商用帆船「アステル II」':S.ship===3?'遠洋帆船「アステル III」':'大型遠洋船「アステル」')+'</b><div class="triples"><div><small>積載</small><b>'+S.cap+'</b></div><div><small>船体</small><b>'+S.maxHp+'</b></div><div><small>船格</small><b>★'+S.ship+'</b></div></div></div><div class="upgrade"><div><b>'+(S.ship>=4?'最高級船':'船体を大型化')+'</b><small>'+(S.ship>=4?'これ以上ない遠洋船':'積載 '+S.cap+' → '+next+' / 外観も大型化')+'</small></div><button id="upgrade" '+(S.ship>=4||S.money<cost?'disabled':'')+'>'+(S.ship>=4?'MAX':cost+'G')+'</button></div>';$('upgrade').onclick=upgrade}function upgrade(){let cost=S.ship===1?1200:S.ship===2?2600:5200;if(S.money<cost||S.ship>=4)return;S.money-=cost;S.ship++;S.cap=[0,8,14,22,34][S.ship];S.maxHp=[0,100,120,145,175][S.ship];S.hp=S.maxHp;save();stats();shipyard();toast('船が大型化！ 積載 '+S.cap)}function rumor(){let rs=['セビリアではワインが高く売れる。最初の船乗りは皆そこから覚える。','南のダカールでは金が採れる。ただし外洋は海賊が多い。','東へ行った船が、胡椒を山ほど積んで戻ったそうだ。','何度も使う航路は港を栄えさせる。海は人が通って道になる。','巨大な鯨を見た船乗りがいる。金にはならないが、名は残る。'];$('rumor').innerHTML='<div class="face">🧔</div><blockquote>「'+rs[(S.trips+hash(S.here))%rs.length]+'」</blockquote>'}function sailTo(dest){let from=S.here;view('sail');$('from').textContent=pt(from).name;$('to').textContent=pt(dest).name;$('fill').style.width='0';$('event').classList.add('hidden');paused=false;let prog=0,at=30+hash(from+dest+S.trips)%22,done=false;clearInterval(timer);timer=setInterval(()=>{if(paused)return;prog+=1.55+S.ship*.08;$('fill').style.width=Math.min(100,prog)+'%';$('day').textContent='航海 '+Math.max(1,Math.ceil(prog/34))+'日目';if(!done&&prog>=at){done=true;trigger(from,dest)}if(prog>=100){clearInterval(timer);arrive(dest)}},90)}function trigger(from,dest){paused=true;let pool=S.trips<1?E.slice(0,2):E,ev=pool[hash(from+dest+S.trips+S.money)%pool.length];$('event').innerHTML='<div class="eicon">'+ev[0]+'</div><h3>'+ev[1]+'</h3><p>'+ev[2]+'</p><div class="choices"><button data-o="'+ev[4]+'">'+ev[3]+'</button><button class="alt" data-o="'+ev[6]+'">'+ev[5]+'</button></div>';$('event').classList.remove('hidden');document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>resolve(b.dataset.o))}function resolve(o){$('event').classList.add('hidden');if(o.startsWith('discover:')){let id=o.split(':')[1];if(!S.disc.includes(id))S.disc.push(id);toast('新しい発見を海図に記録した！')}else if(o==='storm'){let d=Math.max(7,18-S.ship*3);S.hp=Math.max(1,S.hp-d);toast('嵐を突破！ 船体 −'+d)}else if(o==='battle'){let win=(hash(S.here+S.trips+S.money)%100)/100<.58+S.ship*.1;if(win){let r=130+S.ship*55;S.money+=r;toast('海賊を撃退！ +'+r+'G')}else{S.hp=Math.max(1,S.hp-20);toast('砲撃戦で損傷 −20')}}else if(o==='escape'){let l=Math.min(S.money,40);S.money-=l;toast(l?'逃走中に物資を失った −'+l+'G':'逃げ切った')}else toast(o==='speed'?'風をつかんだ。航海が進む':'安全な進路を選んだ');save();stats();setTimeout(()=>paused=false,350)}function arrive(dest){let from=S.here;S.here=dest;S.trips++;if(!S.visited.includes(dest))S.visited.push(dest);if(!S.known.includes(dest))S.known.push(dest);S.pros[dest]=Math.min(5,(S.pros[dest]||1)+.6);S.pros[from]=Math.min(5,(S.pros[from]||1)+.25);P.filter(p=>conn(dest,p.id)&&p.level<=Math.floor(S.trips/2)+1).forEach(p=>{if(!S.known.includes(p.id))S.known.push(p.id)});if(S.tutorial===2&&dest==='seville')S.tutorial=3;save();toast(pt(dest).name+'に到着！');setTimeout(()=>renderPort(dest),420)}function open(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function close(){$('modal').classList.add('hidden')}function discoveries(){open('<span class="eyebrow">DISCOVERY LOG</span><h2>航海の発見</h2><div class="dgrid">'+D.map(d=>{let f=S.disc.includes(d[0]);return '<div class="disc '+(f?'found':'')+'"><div><span>'+(f?d[2]:'?')+'</span><b>'+(f?d[1]:'未発見')+'</b><small>'+(f?d[3]:'霧の向こう')+'</small></div></div>'}).join('')+'</div>')}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),1700)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['market','ship','tavern'].forEach(n=>$(n+'Panel').classList.toggle('active',n===b.dataset.tab));if(b.dataset.tab==='market')market();if(b.dataset.tab==='ship')shipyard();if(b.dataset.tab==='tavern')rumor()});$('back').onclick=renderMap;$('chart').onclick=renderMap;$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('reset').onclick=()=>{if(confirm('航海記録を消して最初から始めますか？')){S=def();save();renderMap();toast('新しい航海を始めよう')}};document.addEventListener('dblclick',e=>{if(e.target.id==='mapTitle')discoveries()});stats();renderMap()})();</script></body></html>
