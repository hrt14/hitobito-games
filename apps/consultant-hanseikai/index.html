<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d09">
<meta name="description" content="コンサルや商談のあとに止まらない脳内反省会を、事実・想像・次に変えられることへ仕分け、改善を1個だけ残して3分で閉じるLEVEL UPアプリ。">
<title>コンサル後反省会を3分で終わらせる | LEVEL UP</title>
<style>
:root{color-scheme:dark;--bg:#0b0d09;--panel:#13170f;--panel2:#191e13;--paper:#f3f1e8;--ink:#181a16;--text:#f4f6ed;--muted:#a7ad9e;--line:rgba(216,255,91,.17);--lime:#d8ff5b;--fact:#88bfff;--guess:#d9a4ff;--next:#a9e88e;--danger:#ff8e78;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{overscroll-behavior:none}.app{min-height:100svh;color:var(--text);background:radial-gradient(circle at 85% -10%,rgba(216,255,91,.08),transparent 32%),#0b0d09}.shell{width:min(100%,560px);min-height:100svh;margin:auto;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:11px;font-weight:950;letter-spacing:.16em;color:var(--lime)}.mini{font-size:10px;color:var(--muted)}.linkbtn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:800;padding:10px;cursor:pointer}.progress{height:5px;background:#ffffff10;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--lime);transition:width .25s ease}.screen{flex:1;display:flex;flex-direction:column;padding:18px 0 8px;animation:enter .2s ease}.screen.center{justify-content:center}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.16em;color:var(--lime);margin-bottom:10px}.screen h1,.screen h2{letter-spacing:-.05em;line-height:1.04}.screen h1{font-size:clamp(38px,11vw,58px);margin:0 0 16px}.screen h2{font-size:31px;margin:0 0 10px}.lead{color:#c5cabd;line-height:1.75;font-size:14px;margin:0 0 22px}.muted{color:var(--muted)}.btn{border:0;border-radius:18px;min-height:58px;padding:14px 18px;width:100%;font:inherit;font-size:16px;font-weight:950;cursor:pointer;transition:transform .12s ease,opacity .12s}.btn:active,.chip:active,.bin:active,.pick:active{transform:scale(.98)}.btn.primary{background:var(--lime);color:#10130b}.btn.secondary{background:#ffffff0a;color:var(--text);border:1px solid #ffffff15}.btn[disabled]{opacity:.34;cursor:not-allowed}.actions{display:grid;gap:9px;margin-top:16px}.occupancy{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;margin:12px 0 20px}.occupancy-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.occupancy strong{font-size:48px;line-height:.9;letter-spacing:-.06em}.occupancy span{font-size:12px;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--lime);margin:20px 0 2px}.scale{display:flex;justify-content:space-between;font-size:10px;color:#7e8575}.recent{border-left:2px solid var(--line);padding-left:12px;font-size:11px;line-height:1.6;color:var(--muted);margin-top:18px}.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.chip{border:1px solid #ffffff12;background:#12160f;color:var(--text);border-radius:16px;min-height:72px;padding:13px;text-align:left;font:inherit;font-size:13px;line-height:1.45;font-weight:800;cursor:pointer;position:relative}.chip.selected{border-color:var(--lime);background:#1c2513;box-shadow:inset 0 0 0 1px rgba(216,255,91,.14)}.chip.selected:after{content:'選択';position:absolute;right:9px;top:8px;color:var(--lime);font-size:8px;letter-spacing:.08em}.custom-row{display:flex;gap:8px;margin:8px 0 4px}.custom-row input{flex:1;min-width:0;border:1px solid #ffffff18;background:#11150e;color:var(--text);border-radius:14px;padding:13px;font:inherit;font-size:14px}.custom-row button{width:auto;min-width:68px;border:1px solid var(--line);background:#1b2115;color:var(--lime);border-radius:14px;font:inherit;font-weight:900}.counter{font-size:11px;color:var(--muted);text-align:right}.sort-stage{flex:1;display:flex;flex-direction:column;min-height:0}.sort-hint{display:flex;justify-content:space-between;gap:8px;margin:10px 0 8px;font-size:10px;color:var(--muted)}.thought-wrap{flex:1;display:grid;place-items:center;min-height:320px;position:relative}.thought{width:min(92%,390px);min-height:245px;border-radius:8px;background:var(--paper);color:var(--ink);padding:24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;touch-action:none;user-select:none;position:relative;transform:rotate(-1deg);transition:transform .16s ease,opacity .16s ease}.thought:before{content:'';position:absolute;left:22px;right:22px;top:51px;height:1px;background:#d9d6ca;box-shadow:0 34px 0 #e0ddd1,0 68px 0 #e0ddd1,0 102px 0 #e0ddd1}.thought-label{position:relative;font-size:10px;letter-spacing:.15em;font-weight:950;color:#777a70}.thought-text{position:relative;font-size:28px;line-height:1.3;font-weight:950;letter-spacing:-.04em;margin:22px 0;z-index:1}.thought-foot{position:relative;color:#676b62;font-size:11px;line-height:1.55;z-index:1}.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.bin{min-height:78px;border-radius:16px;border:1px solid #ffffff16;background:#12150f;color:#fff;padding:9px 6px;font:inherit;font-weight:950;font-size:12px;cursor:pointer}.bin b{display:block;font-size:19px;margin-bottom:4px}.bin.fact b{color:var(--fact)}.bin.guess b{color:var(--guess)}.bin.next b{color:var(--next)}.feedback{position:fixed;left:50%;bottom:max(108px,calc(env(safe-area-inset-bottom) + 94px));transform:translateX(-50%);width:min(calc(100% - 32px),500px);background:#f6f5ef;color:#181a16;border-radius:16px;padding:12px 14px;font-size:12px;font-weight:850;line-height:1.45;box-shadow:0 16px 40px #0008;z-index:30;animation:toast .9s both}.feedback small{display:block;margin-top:3px;color:#64685f;font-weight:700}.summary-row{display:flex;gap:8px;margin:10px 0 18px}.summary-pill{flex:1;border:1px solid #ffffff12;border-radius:14px;padding:10px;text-align:center}.summary-pill strong{display:block;font-size:24px}.summary-pill span{font-size:9px;color:var(--muted)}.discard-stage{flex:1;display:flex;flex-direction:column}.wip{display:flex;align-items:center;gap:12px;background:#12160f;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:8px 0 14px}.wip-track{height:8px;flex:1;background:#ffffff0d;border-radius:99px;overflow:hidden}.wip-track i{display:block;height:100%;background:var(--guess);transition:width .25s}.wip b{font-size:13px}.trash-zone{flex:1;display:grid;place-items:center;min-height:330px}.trash-card{width:min(90%,380px);min-height:235px;border-radius:8px;background:var(--paper);color:var(--ink);padding:24px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 22px 55px #0007;touch-action:none;user-select:none}.trash-card .k{font-size:10px;color:#777a70;letter-spacing:.13em;font-weight:950}.trash-card .t{font-size:27px;line-height:1.35;font-weight:950;letter-spacing:-.04em;margin-top:18px}.discard-help{text-align:center;font-size:11px;color:var(--muted);margin:9px 0}.discard-btn{margin-top:8px}.empty{display:grid;place-items:center;text-align:center;min-height:260px;border:1px dashed var(--line);border-radius:24px}.empty strong{font-size:38px;color:var(--lime)}.choices-list{display:grid;gap:9px;margin:14px 0}.pick{border:1px solid #ffffff14;background:#12160f;color:var(--text);border-radius:17px;padding:15px 16px;text-align:left;font:inherit;cursor:pointer}.pick strong{display:block;font-size:15px;line-height:1.4}.pick small{display:block;color:var(--muted);font-size:10px;margin-top:6px}.pick.selected{border-color:var(--lime);background:#1b2412}.limit-note{background:#1a1811;border:1px solid rgba(255,205,91,.25);color:#e8d9a1;border-radius:14px;padding:11px 12px;font-size:11px;line-height:1.5;margin-top:7px}.divider{height:1px;background:#ffffff12;margin:20px 0}.own{background:var(--paper);color:var(--ink);border-radius:26px;padding:22px;margin:12px 0}.own .eyebrow{color:#60752c}.own h2{font-size:34px}.own p{color:#555a50;line-height:1.6;font-size:13px}.close-card{border:1px solid var(--line);border-radius:26px;padding:22px;background:#10140d}.close-card h3{font-size:12px;letter-spacing:.13em;color:var(--muted);margin:0 0 9px}.close-card p{margin:0;font-size:18px;line-height:1.5;font-weight:850}.close-card+.close-card{margin-top:10px}.diff{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:18px 0}.diff-box{background:#12160f;border:1px solid #ffffff12;border-radius:18px;padding:16px;text-align:center}.diff-box b{display:block;font-size:34px}.diff-box span{font-size:9px;color:var(--muted)}.diff-arrow{color:var(--lime);font-size:24px}.closed{font-size:50px;font-weight:1000;letter-spacing:-.06em;color:var(--lime);margin:14px 0}.footnote{font-size:10px;line-height:1.6;color:#7f8678;margin-top:14px}.privacy{font-size:10px;color:#72796b;margin:10px 0;text-align:center}@keyframes enter{from{opacity:0;transform:translateY(8px)}}@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,7px)}12%,82%{opacity:1;transform:translate(-50%,0)}}@media(max-width:390px){.chips{grid-template-columns:1fr}.thought-wrap{min-height:285px}.thought{min-height:220px}.thought-text{font-size:24px}.bin{min-height:72px;font-size:11px}.screen h1{font-size:40px}}@media(max-height:690px){.screen{padding-top:8px}.thought-wrap{min-height:270px}.thought{min-height:215px;padding:19px}.trash-zone{min-height:260px}.trash-card{min-height:200px}.screen h2{font-size:27px}.chips{gap:7px}.chip{min-height:62px}}
</style>
</head>
<body><div id="app" class="app"></div>
<script>
(()=>{
const app=document.getElementById('app');
const STORE='levelup-consultant-hanseikai-v1';
const concerns=[
{id:'reaction',text:'相手の反応が薄かった',bucket:'fact',note:'反応が薄かった、までは観察できる。意味はまだ足さない。'},
{id:'satisfied',text:'満足してなかったかも',bucket:'guess',note:'満足度は相手の内側。今はまだ確認できない。'},
{id:'renewal',text:'契約、続くかな',bucket:'guess',note:'未来の契約はまだ結果が出ていない。考えても情報は増えない。'},
{id:'value',text:'今日の提案、価値低かったかも',bucket:'guess',note:'「価値が低い」は現時点では評価予測。必要なら次回データで確かめる。'},
{id:'rough',text:'適当なこと言ったかも',bucket:'next',action:'次回、曖昧な話はその場で「要確認」と分ける',note:'発言の良し悪しを再生し続けるより、次回の確認ルールに変える。'},
{id:'prep',text:'もっと準備できた',bucket:'next',action:'次回、重要数字を3つだけ事前確認する',note:'「もっと」を無限にしない。次回変える一手へ落とす。'},
{id:'competitor',text:'競合をもっと見ればよかった',bucket:'next',action:'次回、競合事例を1つ準備する',note:'これは自分側で具体的に変えられる。'},
{id:'questions',text:'相手から質問が少なかった',bucket:'fact',note:'質問が少なかったことは事実。満足・不満の意味づけは別。'},
{id:'silence',text:'最後、少し沈黙があった',bucket:'fact',note:'沈黙は観察できる。何を意味したかは未確定。'},
{id:'called',text:'次回呼ばれないかも',bucket:'guess',note:'呼ばれるかどうかはまだ起きていない。結果が来るまで保留。'},
{id:'fee',text:'報酬に見合ってなかったかも',bucket:'guess',note:'相手の評価を今ここで確定する材料はない。'},
{id:'too-much',text:'話を広げすぎた',bucket:'next',action:'次回、結論を1つに絞ってから話す',note:'反省を行動へ変えられるなら、1個だけ持ち帰る。'},
{id:'own-biz',text:'人の商売ばかり進めてる',bucket:'fact',note:'そう感じる材料があるなら、これは別テーマ。最後に自分の商売へ戻す。'},
{id:'self',text:'自分の商売、全然進んでない',bucket:'next',action:'今日、自分の商売を5分だけ進める',note:'自己評価ではなく、自分側の一手に変換する。'}
];
const ownActions=[
{id:'idea',label:'自分の企画を1行メモする',detail:'完成させない。1行だけ残す。'},
{id:'product',label:'自分の商品を1つ改善する',detail:'画面・説明・価格など、1箇所だけ。'},
{id:'sales',label:'売上につながる導線を1つ直す',detail:'リンク、商品ページ、告知など小さく。'},
{id:'five',label:'自分の商売を5分だけ進める',detail:'内容は決めすぎず、5分だけ自分側へ戻る。'}
];
let s={screen:'home',before:70,after:40,selected:[],custom:[],sortIndex:0,sorted:{fact:[],guess:[],next:[]},discardIndex:0,improvement:null,own:null,startedAt:0};
const load=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}};
const saveSummary=(data)=>{try{localStorage.setItem(STORE,JSON.stringify(data))}catch{}};
const previous=load();
const progress=()=>({home:0,select:16,sort:32,discard:52,improve:68,own:82,after:92,result:100}[s.screen]??0);
const shell=(body,opts={})=>`<main class="shell"><header class="top"><div class="brand">LEVEL UP / WORK RESET</div>${opts.back?'<button class="linkbtn" data-a="back">戻る</button>':'<div class="mini">3 MIN RESET</div>'}</header><div class="progress"><i style="width:${progress()}%"></i></div>${body}</main>`;
function h(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function vib(n=12){try{navigator.vibrate?.(n)}catch{}}
function home(){s.screen='home';const prev=previous?`<div class="recent">前回：反省会 ${previous.before} → ${previous.after}。持ち帰りは ${h(previous.improvementLabel||'なし')}。</div>`:'';app.innerHTML=shell(`<section class="screen center"><div class="eyebrow">会議はもう終わっている</div><h1>コンサル後反省会を<br>3分で終わらせる</h1><p class="lead">相手の反応、契約、言ったこと。<br><b>事実・想像・次に変えられること</b>へ分けて、考える範囲を閉じる。</p><div class="occupancy"><div class="occupancy-head"><div><span>今の頭の占有度</span><strong data-score>${s.before}</strong></div><span>/ 100</span></div><input type="range" min="0" max="100" step="1" value="${s.before}" data-before><div class="scale"><span>ほぼ平気</span><span>頭から離れない</span></div></div><button class="btn primary" data-a="start">3分で終わらせる</button>${prev}<p class="privacy">自由入力した内容は保存しません。</p></section>`)}
function select(){s.screen='select';app.innerHTML=shell(`<section class="screen"><div class="eyebrow">STEP 1 / 頭の中を出す</div><h2>今、何が引っかかってる？</h2><p class="lead">当てはまるものをタップ。最大8枚。</p><div class="chips">${concerns.map(c=>`<button class="chip ${s.selected.includes(c.id)?'selected':''}" data-concern="${c.id}">${h(c.text)}</button>`).join('')}${s.custom.map((c,i)=>`<button class="chip selected" data-custom-remove="${i}">${h(c.text)}<br><small>タップで削除</small></button>`).join('')}</div><div class="custom-row"><input maxlength="54" placeholder="ほかにあれば1つだけ書く" data-custom-input><button data-a="add-custom">追加</button></div><div class="counter"><span data-count>${s.selected.length+s.custom.length}</span> / 8</div><div class="actions"><button class="btn primary" data-a="sort" ${s.selected.length+s.custom.length?'':'disabled'}>仕分ける</button></div></section>`,{back:true})}
function items(){return [...s.selected.map(id=>concerns.find(c=>c.id===id)).filter(Boolean),...s.custom.map((c,i)=>({...c,id:'custom-'+i,bucket:null,note:'自分の言葉は、事実・まだ分からない想像・次に変えられる行動のどれかへ置く。'}))]}
function sort(){s.screen='sort';const all=items();if(s.sortIndex>=all.length)return discardIntro();const c=all[s.sortIndex];app.innerHTML=shell(`<section class="screen sort-stage"><div class="eyebrow">STEP 2 / 仕分け ${s.sortIndex+1} / ${all.length}</div><div class="sort-hint"><span>← 事実</span><span>↓ 想像</span><span>次に変える →</span></div><div class="thought-wrap"><article class="thought" data-swipe><div class="thought-label">頭の中のカード</div><div class="thought-text">${h(c.text)}</div><div class="thought-foot">意味を足さず、今どこまで扱えるかで分ける。</div></article></div><div class="bins"><button class="bin fact" data-bin="fact"><b>事実</b>確認できた</button><button class="bin guess" data-bin="guess"><b>想像</b>まだ不明</button><button class="bin next" data-bin="next"><b>次に変える</b>自分で動ける</button></div></section>`,{back:true});bindSwipe(document.querySelector('[data-swipe]'),dir=>{if(dir==='left')place('fact');if(dir==='down')place('guess');if(dir==='right')place('next')})}
function place(bucket){const all=items(),c=all[s.sortIndex];s.sorted[bucket].push(c);const recommended=c.bucket;let main={fact:'事実へ置いた',guess:'想像へ置いた',next:'次に変えるへ置いた'}[bucket];let sub=c.note;if(recommended&&recommended!==bucket){sub=`おすすめは「${{fact:'事実',guess:'想像',next:'次に変える'}[recommended]}」。${c.note}`;main='いったん置いた。見方も確認';}toast(main,sub);vib();s.sortIndex++;setTimeout(sort,620)}
function toast(main,sub=''){document.querySelector('.feedback')?.remove();const el=document.createElement('div');el.className='feedback';el.innerHTML=`${h(main)}${sub?`<small>${h(sub)}</small>`:''}`;document.body.appendChild(el);setTimeout(()=>el.remove(),880)}
function discardIntro(){s.screen='discard';s.discardIndex=0;discard()}
function discard(){s.screen='discard';const list=s.sorted.guess;if(!list.length||s.discardIndex>=list.length){app.innerHTML=shell(`<section class="screen center"><div class="empty"><div><strong>想像 0</strong><p class="lead" style="margin-top:10px">考えても情報が増えないものは、ここで終了。</p></div></div><button class="btn primary" data-a="improve">改善を1個だけ残す</button></section>`,{back:true});return}
const c=list[s.discardIndex],remain=list.length-s.discardIndex,pct=Math.round((remain/list.length)*100);app.innerHTML=shell(`<section class="screen discard-stage"><div class="eyebrow">STEP 3 / 想像を捨てる</div><h2>今は、答えが増えない。</h2><div class="wip"><b>脳内WIP ${remain}</b><div class="wip-track"><i style="width:${pct}%"></i></div></div><div class="trash-zone"><article class="trash-card" data-discard><div class="k">まだ分からないこと</div><div class="t">${h(c.text)}</div></article></div><div class="discard-help">上へスワイプして捨てる</div><button class="btn secondary discard-btn" data-a="discard">今は考えない</button></section>`,{back:true});bindDiscard(document.querySelector('[data-discard]'))}
function throwAway(){const card=document.querySelector('[data-discard]');if(card){card.style.transform='translateY(-130px) rotate(7deg)';card.style.opacity='0'}vib(18);toast('考えても情報は増えない','結果か新しい情報が来たら、そのとき扱えばいい。');s.discardIndex++;setTimeout(discard,520)}
function improve(){s.screen='improve';const actions=s.sorted.next.map(c=>({id:c.id,label:c.action||c.text,source:c.text}));app.innerHTML=shell(`<section class="screen"><div class="eyebrow">STEP 4 / 持ち帰りは最大1個</div><h2>全部直さない。</h2><p class="lead">次回変えるなら、いちばん効きそうな1個だけ。</p>${actions.length?`<div class="choices-list">${actions.map(a=>`<button class="pick ${s.improvement?.id===a.id?'selected':''}" data-improvement="${h(a.id)}"><strong>${h(a.label)}</strong><small>元の反省：${h(a.source)}</small></button>`).join('')}</div>`:`<div class="empty"><div><strong>0個でもOK</strong><p class="muted">今回、持ち帰る改善がないなら増やさない。</p></div></div>`}<div class="limit-note">改善点を増やすほど、また反省会が始まる。今回は1個で十分。</div><div class="actions"><button class="btn primary" data-a="own">${actions.length?'これ1個だけ持ち帰る':'改善なしで次へ'}</button></div></section>`,{back:true})}
function own(){s.screen='own';app.innerHTML=shell(`<section class="screen"><div class="eyebrow">STEP 5 / 視線を戻す</div><div class="own"><div class="eyebrow">コンサルは終わり。</div><h2>次は、自分の番。</h2><p>自己嫌悪する代わりに、今日、自分の商売を1mmだけ進める。</p></div><div class="choices-list">${ownActions.map(a=>`<button class="pick ${s.own===a.id?'selected':''}" data-own="${a.id}"><strong>${h(a.label)}</strong><small>${h(a.detail)}</small></button>`).join('')}</div><div class="actions"><button class="btn primary" data-a="after" ${s.own?'':'disabled'}>この1個で戻る</button></div></section>`,{back:true})}
function after(){s.screen='after';app.innerHTML=shell(`<section class="screen center"><div class="eyebrow">最後 / もう一度だけ測る</div><h2>今、どれくらい引きずってる？</h2><div class="occupancy"><div class="occupancy-head"><div><span>現在の頭の占有度</span><strong data-after-score>${s.after}</strong></div><span>/ 100</span></div><input type="range" min="0" max="100" step="1" value="${s.after}" data-after><div class="scale"><span>ほぼ平気</span><span>頭から離れない</span></div></div><button class="btn primary" data-a="finish">反省会を閉じる</button></section>`,{back:true})}
function result(){s.screen='result';const ownA=ownActions.find(a=>a.id===s.own);const imp=s.improvement?.label||'なし';const delta=s.after-s.before;saveSummary({count:(previous?.count||0)+1,before:s.before,after:s.after,improvementId:s.improvement?.id||null,improvementLabel:imp,ownId:s.own,at:Date.now()});app.innerHTML=shell(`<section class="screen"><div class="eyebrow">CLOSED</div><div class="closed">反省会、終了。</div><p class="lead">分からないものは分からないまま。変えられるものだけ持って帰る。</p><div class="summary-row"><div class="summary-pill"><strong>${s.sorted.guess.length}</strong><span>手放した想像</span></div><div class="summary-pill"><strong>${s.improvement?1:0}</strong><span>持ち帰る改善</span></div><div class="summary-pill"><strong>1</strong><span>自分の一手</span></div></div><div class="close-card"><h3>今日、背負わなくていいもの</h3><p>${s.sorted.guess.length?s.sorted.guess.slice(0,3).map(x=>h(x.text)).join('<br>'):'なし'}</p></div><div class="close-card"><h3>次回変えること</h3><p>${h(imp)}</p></div><div class="close-card"><h3>自分の商売</h3><p>${h(ownA?.label||'1mm進める')}</p></div><div class="diff"><div class="diff-box"><b>${s.before}</b><span>開始</span></div><div class="diff-arrow">→</div><div class="diff-box"><b>${s.after}</b><span>現在 ${delta===0?'±0':delta>0?'+'+delta:delta}</span></div></div><div class="actions"><button class="btn primary" data-a="close">今日は終わり</button><button class="btn secondary" data-a="again">もう一度使う</button></div><p class="footnote">このアプリは相手の本音や契約結果を推測して断定しません。必要なフィードバックが来たら、その時点で新しい事実として扱います。</p></section>`)}
function bindSwipe(el,cb){if(!el)return;let sx=0,sy=0,active=false;el.addEventListener('pointerdown',e=>{active=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture?.(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active)return;const dx=e.clientX-sx,dy=e.clientY-sy;el.style.transform=`translate(${dx*.28}px,${dy*.2}px) rotate(${dx*.012}deg)`});el.addEventListener('pointerup',e=>{if(!active)return;active=false;const dx=e.clientX-sx,dy=e.clientY-sy;el.style.transform='rotate(-1deg)';if(Math.abs(dx)>62&&Math.abs(dx)>Math.abs(dy))cb(dx<0?'left':'right');else if(dy>65)cb('down')})}
function bindDiscard(el){if(!el)return;let sy=0,active=false;el.addEventListener('pointerdown',e=>{active=true;sy=e.clientY;el.setPointerCapture?.(e.pointerId)});el.addEventListener('pointermove',e=>{if(!active)return;const dy=Math.min(10,e.clientY-sy);el.style.transform=`translateY(${dy}px) rotate(${dy*.02}deg)`});el.addEventListener('pointerup',e=>{if(!active)return;active=false;if(e.clientY-sy<-55)throwAway();else el.style.transform=''})}
function resetForStart(){s={screen:'select',before:s.before,after:Math.max(0,s.before-30),selected:[],custom:[],sortIndex:0,sorted:{fact:[],guess:[],next:[]},discardIndex:0,improvement:null,own:null,startedAt:Date.now()};select()}
function goBack(){if(s.screen==='select')return home();if(s.screen==='sort'){if(s.sortIndex>0){s.sortIndex--;for(const k of ['fact','guess','next']){const idx=s.sorted[k].findIndex(x=>x.id===items()[s.sortIndex]?.id);if(idx>=0)s.sorted[k].splice(idx,1)}return sort()}return select()}if(s.screen==='discard')return sort();if(s.screen==='improve')return discard();if(s.screen==='own')return improve();if(s.screen==='after')return own();home()}
app.addEventListener('input',e=>{if(e.target.matches('[data-before]')){s.before=+e.target.value;document.querySelector('[data-score]').textContent=s.before}else if(e.target.matches('[data-after]')){s.after=+e.target.value;document.querySelector('[data-after-score]').textContent=s.after}});
app.addEventListener('click',e=>{const concern=e.target.closest('[data-concern]');if(concern){const id=concern.dataset.concern;if(s.selected.includes(id))s.selected=s.selected.filter(x=>x!==id);else if(s.selected.length+s.custom.length<8)s.selected.push(id);select();return}const remove=e.target.closest('[data-custom-remove]');if(remove){s.custom.splice(+remove.dataset.customRemove,1);select();return}const bin=e.target.closest('[data-bin]');if(bin){place(bin.dataset.bin);return}const imp=e.target.closest('[data-improvement]');if(imp){const c=s.sorted.next.find(x=>x.id===imp.dataset.improvement);s.improvement=c?{id:c.id,label:c.action||c.text}:null;improve();return}const ownPick=e.target.closest('[data-own]');if(ownPick){s.own=ownPick.dataset.own;own();return}const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a==='start')resetForStart();if(a==='back')goBack();if(a==='add-custom'){const input=document.querySelector('[data-custom-input]');const text=input?.value.trim();if(text&&s.selected.length+s.custom.length<8){s.custom.push({text});select()}}if(a==='sort'){s.sortIndex=0;s.sorted={fact:[],guess:[],next:[]};sort()}if(a==='discard')throwAway();if(a==='improve')improve();if(a==='own')own();if(a==='after')after();if(a==='finish')result();if(a==='close'){vib(28);home()}if(a==='again'){s.before=s.after;home()}});
home();
})();
</script>
</body>
</html>
