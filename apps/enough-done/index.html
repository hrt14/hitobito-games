<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10110f"><meta name="description" content="目的達成・致命的な穴・追加30分の価値を3問で判定し、仕事を終えるLEVEL UPアプリ。"><title>十分やった</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;--bg:#10110f;--card:#191a17;--line:#34352f;--lime:#e5ff58;--paper:#f1efe7;--ink:#151612;--muted:#85887f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f4ed;-webkit-font-smoothing:antialiased}button,input{font:inherit}.app{width:min(690px,100%);min-height:100dvh;margin:auto;padding:max(13px,env(safe-area-inset-top)) 13px max(22px,env(safe-area-inset-bottom))}.top{height:44px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:10px;font-weight:950;letter-spacing:.14em}.brand b{color:var(--lime)}.ghost{border:1px solid var(--line);border-radius:999px;background:transparent;color:#9ba098;padding:8px 11px;font-size:10px;font-weight:900}.screen{display:none}.screen.active{display:block}.hero{padding-top:9vh}.kicker{color:var(--lime);font-size:10px;letter-spacing:.16em;font-weight:950}.hero h1,.step h1,.result h1{font-size:clamp(46px,12vw,72px);line-height:.94;letter-spacing:-.065em;margin:14px 0 17px}.hero p{font-size:16px;line-height:1.7;color:#b9bcb4}.hero strong{color:white}.primary{width:100%;min-height:59px;border:0;border-radius:17px;background:var(--lime);color:#11130e;font-size:16px;font-weight:950}.step{padding-top:5vh}.step h1{font-size:clamp(35px,9vw,52px);margin-bottom:9px}.sub{color:#93978f;font-size:13px;line-height:1.6;margin:0 0 15px}.target{width:100%;border:1px solid var(--line);border-radius:18px;background:var(--card);color:white;padding:17px;outline:none;font-size:17px}.qcard{border:1px solid var(--line);border-radius:22px;background:var(--card);padding:18px;margin-top:14px}.qnum{color:var(--lime);font-size:9px;letter-spacing:.13em;font-weight:950}.question{font-size:clamp(24px,6.5vw,34px);font-weight:950;line-height:1.3;letter-spacing:-.035em;margin:15px 0 20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{min-height:57px;border:1px solid #3b3d37;border-radius:15px;background:#20211d;color:white;font-weight:950}.choice.yes{background:var(--lime);border-color:var(--lime);color:#11130e}.progress{height:5px;border-radius:99px;background:#272824;overflow:hidden;margin:13px 2px}.progress i{display:block;height:100%;background:var(--lime)}.result{padding-top:5vh}.badge{display:inline-block;border:1px solid rgba(229,255,88,.4);color:var(--lime);border-radius:999px;padding:7px 10px;font-size:9px;font-weight:950;letter-spacing:.13em}.result h1{font-size:clamp(44px,11.5vw,68px);margin-bottom:12px}.work{background:var(--paper);color:var(--ink);border-radius:21px;padding:16px}.work small{display:block;color:#777970;font-size:9px;font-weight:950;letter-spacing:.1em}.work strong{display:block;font-size:21px;line-height:1.4;margin-top:7px}.why{color:#a4a89e;font-size:12px;line-height:1.65;margin:14px 2px}.stopline{font-size:clamp(27px,7.6vw,40px);font-weight:950;line-height:1.1;letter-spacing:-.045em;margin:20px 0 16px}.done-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.done-action{min-height:54px;border:1px solid #3b3c36;border-radius:14px;background:#1b1c19;color:white;font-weight:900}.complete{display:none;margin-top:12px;color:var(--lime);font-size:12px;font-weight:950;text-align:center}.complete.show{display:block}.patch{display:none}.patch.show{display:block}.patchbox{border:1px solid var(--line);border-radius:19px;background:#191a17;padding:15px;margin-top:14px}.patchbox label{display:block;color:#8b8f86;font-size:10px;font-weight:900}.patchbox input{width:100%;border:0;border-bottom:1px solid #3b3d36;background:transparent;color:#fff;outline:none;padding:10px 0;margin:5px 0 12px}.ticket{display:flex;align-items:center;gap:9px;color:#bec1b9;font-size:11px;margin-bottom:11px}.ticket b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--lime);color:#11130e}.error{min-height:18px;color:#ff927f;font-size:10px;margin-top:7px}@media(max-width:480px){.hero{padding-top:6vh}.hero h1{font-size:53px}.hero p{font-size:15px}.done-actions{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><div class="brand">LEVEL <b>UP</b> / STOP LINE</div><button class="ghost" id="restart">別の仕事を判定</button></header><section id="hero" class="screen hero active"><div class="kicker">STOP WHEN MORE IS NOT BETTER</div><h1>十分<br>やった</h1><p><strong>「もっと良くできる」は、終わらない。</strong><br>あと30分が本当に結果を変えるか、3問で止め時を決める。</p><button id="start" class="primary">終わっていいか判定する</button></section><section id="inputScreen" class="screen step"><div class="kicker">ONE WORK</div><h1>まだ直してる<br>ものは？</h1><p class="sub">資料、メール、企画、分析、デザイン。1件だけ。</p><input id="target" class="target" placeholder="例：明日のコンサル資料"><button id="judge" class="primary" style="margin-top:13px">3問で判定</button><div id="inputError" class="error"></div></section><section id="qScreen" class="screen step"><div class="kicker">STOP GATE</div><div class="progress"><i id="progress"></i></div><div class="qcard"><div id="qnum" class="qnum"></div><div id="question" class="question"></div><div class="choices"><button id="yes" class="choice yes">はい</button><button id="no" class="choice">いいえ</button></div></div></section><section id="resultScreen" class="screen result"><div id="badge" class="badge"></div><h1 id="title"></h1><div class="work"><small>判定した仕事</small><strong id="workText"></strong></div><div id="why" class="why"></div><div id="stopArea"><div class="stopline">これ以上は改善ではなく、<br>追加作業。</div><div class="done-actions"><button class="done-action">出した</button><button class="done-action">送った</button><button class="done-action">閉じた</button></div><div id="complete" class="complete">終了。もう開き直さない。</div></div><div id="patchArea" class="patch"><div class="patchbox"><div class="ticket"><b>1</b><span>修正券は1枚だけ</span></div><label>最後に直す1件</label><input id="patchInput" placeholder="例：結論の1行だけ直す"><button id="patchBtn" class="primary">これだけ直して再判定</button><div id="patchError" class="error"></div></div></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const qs=['いまの状態で、本来の目的を満たす？','このまま出したら困る、致命的な穴がある？','次の30分で、結果が大きく変わる？'];let target='',answers=[],qi=0,patch='';const show=id=>document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));function renderQ(){show('qScreen');$('qnum').textContent=`0${qi+1} / 03`;$('question').textContent=qs[qi];$('progress').style.width=((qi+1)/3*100)+'%'}function answer(v){answers[qi]=v;qi++;navigator.vibrate?.(9);if(qi<3)renderQ();else renderResult()}function renderResult(){const stop=answers[0]&&!answers[1]&&!answers[2];show('resultScreen');$('workText').textContent=target;$('stopArea').style.display=stop?'block':'none';$('patchArea').classList.toggle('show',!stop);if(stop){$('badge').textContent='STOP CONDITION MET';$('title').textContent='十分やった。出す。';$('why').textContent='目的は満たしている。致命的な穴はない。さらに30分使っても結果は大きく変わらない。ここが止め時。';navigator.vibrate?.([14,24,18])}else{$('badge').textContent='ONE LAST PATCH';$('title').textContent='直すなら、あと1件だけ。';let why=[];if(!answers[0])why.push('本来の目的をまだ満たしていない');if(answers[1])why.push('致命的な穴がある');if(answers[2])why.push('次の30分で結果が大きく変わる');$('why').textContent=why.join('。')+'。無限に直さず、最後の修正を1件だけ決める。'}}$('start').onclick=()=>{show('inputScreen');setTimeout(()=>$('target').focus(),80)};$('judge').onclick=()=>{target=$('target').value.trim();if(!target){$('inputError').textContent='判定する仕事を1件だけ入れてください。';return}answers=[];qi=0;patch='';renderQ()};$('yes').onclick=()=>answer(true);$('no').onclick=()=>answer(false);document.querySelectorAll('.done-action').forEach(b=>b.onclick=()=>{$('complete').classList.add('show');b.style.borderColor='var(--lime)';navigator.vibrate?.(18)});$('patchBtn').onclick=()=>{patch=$('patchInput').value.trim();if(!patch){$('patchError').textContent='最後の修正を1件だけ書いてください。';return}$('patchBtn').textContent='修正後、3問でもう一度';$('patchBtn').onclick=()=>{answers=[];qi=0;$('patchInput').value='';renderQ()};navigator.vibrate?.(12)};$('restart').onclick=()=>{$('target').value='';$('patchInput').value='';$('complete').classList.remove('show');target='';answers=[];qi=0;show('inputScreen');setTimeout(()=>$('target').focus(),80)}})();</script></body></html>
