<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="先延ばしを、今やる痛みと何もしない未来の両方から公平に比べるLEVEL UPアプリ。待つことが滑走路か麻酔かを見極め、次の一手を決める。">
<title>何もしないコスト | LEVEL UP</title>
<style>
:root{color-scheme:dark;--bg:#080c15;--panel:#121a2a;--panel2:#182235;--text:#f7f9ff;--muted:#9aa6bc;--line:#ffffff17;--lime:#c9ff57;--amber:#ffc65c;--red:#ff7770;--cyan:#69d6ff;--shadow:0 24px 70px #0007;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -10%,#1b2c46 0,transparent 34%),linear-gradient(180deg,#0b1120,#070a10);color:var(--text);overscroll-behavior:none}.app{min-height:100svh;display:flex;justify-content:center}.shell{width:min(100%,560px);min-height:100svh;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-weight:950;letter-spacing:-.02em}.brandmark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--lime);color:#10160a;font-size:14px}.step{font-size:12px;color:var(--muted);font-weight:800}.progress{height:5px;border-radius:99px;background:#ffffff10;overflow:hidden;margin:4px 0 14px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--cyan));transition:width .25s ease}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0 28px}.kicker{font-size:12px;font-weight:950;letter-spacing:.12em;color:var(--lime);margin-bottom:8px}.hero h1,.stage h1{font-size:clamp(38px,10vw,58px);line-height:1.02;letter-spacing:-.06em;margin:0 0 12px}.stage h2{font-size:30px;line-height:1.15;letter-spacing:-.04em;margin:0 0 10px}.lead{color:var(--muted);font-size:15px;line-height:1.7;margin:0 0 22px}.input{width:100%;min-height:58px;border:1px solid #ffffff20;background:#ffffff0b;border-radius:18px;padding:15px 16px;color:var(--text);font:inherit;font-size:16px;outline:none}.input:focus{border-color:#c9ff5799;box-shadow:0 0 0 4px #c9ff5714}.input::placeholder{color:#748098}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.chip,.pain,.choice,.horizon,.tiny{border:1px solid var(--line);background:#ffffff09;color:var(--text);font:inherit;cursor:pointer}.chip{padding:9px 12px;border-radius:999px;font-size:13px;font-weight:800}.chip:hover,.pain:hover,.choice:hover,.horizon:hover,.tiny:hover{border-color:#ffffff35}.btn{width:100%;min-height:58px;border:0;border-radius:18px;font:inherit;font-size:16px;font-weight:950;cursor:pointer;transition:transform .12s ease,opacity .12s}.btn:active,.chip:active,.pain:active,.choice:active,.horizon:active,.tiny:active{transform:scale(.985)}.btn.primary{background:var(--lime);color:#11170a}.btn.secondary{background:#ffffff0c;color:var(--text);border:1px solid var(--line)}.btn.text{background:transparent;color:var(--muted);min-height:45px}.btn[disabled]{opacity:.38;cursor:not-allowed}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin-top:10px}.error{min-height:22px;margin:8px 0;color:#ff9c97;font-size:13px;font-weight:800}.pain-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 20px}.pain{min-height:64px;border-radius:18px;padding:12px;text-align:left;font-weight:850;display:flex;align-items:center;gap:10px}.pain::before{content:'○';color:var(--muted);font-size:17px}.pain.on{background:#c9ff5714;border-color:#c9ff576f}.pain.on::before{content:'✓';color:var(--lime)}.count{font-size:12px;color:var(--muted);text-align:right;margin-top:-5px}.balance-wrap{margin:8px 0 18px}.balance{position:relative;height:245px;border:1px solid var(--line);border-radius:28px;background:radial-gradient(circle at 50% 86%,#c9ff570c,transparent 28%),linear-gradient(180deg,#151e30,#0e1523);overflow:hidden;box-shadow:var(--shadow)}.beam{position:absolute;left:50%;top:112px;width:78%;height:8px;border-radius:99px;background:#e9edf5;transform:translateX(-50%) rotate(var(--tilt,-7deg));transform-origin:center;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.pivot{position:absolute;left:50%;top:105px;transform:translateX(-50%);width:28px;height:28px;background:var(--lime);border-radius:50%;border:6px solid #1a2333;z-index:3}.stem{position:absolute;left:50%;top:126px;transform:translateX(-50%);width:9px;height:72px;background:#c8cedb}.base{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:100px;height:12px;background:#c8cedb;border-radius:99px}.pan{position:absolute;top:46px;width:42%;min-height:78px;border-radius:18px;padding:11px 10px;text-align:center;border:1px solid var(--line);background:#0b111eeb;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.pan.left{left:4%;transform:translateY(var(--leftY,-12px))}.pan.right{right:4%;transform:translateY(var(--rightY,12px))}.pan strong{display:block;font-size:14px;margin-bottom:5px}.pan small{display:block;color:var(--muted);line-height:1.35}.pan.left strong{color:var(--amber)}.pan.right strong{color:var(--lime)}.horizons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.horizon{border-radius:15px;min-height:48px;font-weight:900}.horizon.on{background:#c9ff5718;border-color:#c9ff5780;color:var(--lime)}.future-list{display:grid;gap:8px;min-height:126px}.future{border:1px solid var(--line);background:#ffffff08;border-radius:15px;padding:12px 13px;display:flex;gap:10px;align-items:flex-start;animation:rise .25s ease}.future b{color:var(--lime);font-size:12px;white-space:nowrap}.future span{font-size:13px;line-height:1.55}.note{font-size:11px;color:var(--muted);line-height:1.55;margin:12px 2px 0}.choice-grid{display:grid;gap:12px;margin:18px 0}.choice{border-radius:22px;padding:18px;text-align:left}.choice strong{display:block;font-size:21px;margin-bottom:6px}.choice span{display:block;color:var(--muted);font-size:13px;line-height:1.55}.choice.runway strong{color:var(--cyan)}.choice.anesthetic strong{color:var(--amber)}.choice.selected{border-color:#c9ff5770;background:#c9ff570f}.form-group{margin:14px 0}.label{display:block;font-size:13px;font-weight:900;margin-bottom:8px}.tiny-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}.tiny{border-radius:16px;min-height:60px;padding:10px;font-weight:850;text-align:left}.tiny.on{border-color:#c9ff5780;background:#c9ff5714}.summary{display:grid;gap:10px;margin:16px 0}.summary-card{border-radius:20px;border:1px solid var(--line);background:#ffffff09;padding:16px}.summary-card small{display:block;color:var(--muted);font-weight:850;margin-bottom:7px}.summary-card strong{display:block;font-size:18px;line-height:1.45}.summary-card ul{margin:6px 0 0;padding-left:20px;color:#dce3ef}.summary-card li{margin:5px 0;line-height:1.45;font-size:13px}.result-mark{width:68px;height:68px;border-radius:22px;background:var(--lime);color:#10160a;display:grid;place-items:center;font-size:32px;margin-bottom:18px}.result-title{font-size:38px!important}.actions{display:grid;gap:9px;margin-top:14px}.privacy{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:11px;line-height:1.55;margin-top:14px}.privacy b{color:var(--lime)}.back{align-self:flex-start;border:0;background:transparent;color:var(--muted);padding:10px 0;font:inherit;font-weight:850;cursor:pointer}.back:hover{color:var(--text)}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.toast{position:fixed;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#f8fbff;color:#10141b;padding:11px 16px;border-radius:999px;font-size:13px;font-weight:900;box-shadow:0 12px 40px #0008;z-index:30;animation:toast 1.6s both}.divider{height:1px;background:var(--line);margin:16px 0}@keyframes rise{from{opacity:0;transform:translateY(7px)}}@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,8px)}12%,84%{opacity:1;transform:translate(-50%,0)}}:focus-visible{outline:3px solid var(--lime);outline-offset:3px}@media(max-height:700px){.stage{justify-content:flex-start;padding-top:12px}.hero h1,.stage h1{font-size:38px}.balance{height:220px}.beam{top:103px}.pivot{top:96px}.stem{top:117px;height:65px}.pan{top:37px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const app=document.getElementById('app');
const live=document.getElementById('live');
const PAINS=['面倒','怖い','失敗したくない','断られたくない','時間が足りない','気まずい'];
const EXAMPLES=['返信する','企画に着手','予約する','人に連絡','応募する'];
const FUTURE={
  week:['頭の片隅を占有し続けるかもしれない','最初の一歩で得られたはずの情報が、まだない'],
  month3:['試して修正できたかもしれない回数','積めたかもしれない経験','別の選択肢を知る機会'],
  year:['積み上げられたかもしれない経験','出会えたかもしれない機会','方向転換に使えた時間']
};
const HORIZON_LABEL={week:'1週間',month3:'3か月',year:'1年'};
const TINY=['対象を開く','必要なものを1つ出す','1文だけ書く','5分だけ触る','自分で決める'];
let st=fresh();
function fresh(){return{screen:'home',task:'',pains:[],horizons:[],kind:'',runwayGain:'',reviewRule:'',tiny:'',customTiny:''}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function shell(body,step=0){const pct=[0,18,42,64,82,100][step]||0;return`<main class="shell"><header class="top"><a class="brand" href="https://levelup.hitobito.jp/" aria-label="LEVEL UPトップへ"><span class="brandmark">↗</span>LEVEL UP</a><span class="step">${step?`${step} / 5`:'何もしないコスト'}</span></header>${step?`<div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>`:''}${body}</main>`}
function setLive(msg){live.textContent='';requestAnimationFrame(()=>live.textContent=msg)}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1650)}
function home(){st.screen='home';app.innerHTML=shell(`<section class="stage hero"><div class="kicker">FAIR COMPARISON</div><h1>何もしない<br>コスト</h1><p class="lead">やる痛みだけ見て、決めてない？<br>「やる」と「やらない」を同じ天秤に乗せる。</p><label class="label" for="task">いま先延ばししていること</label><input id="task" class="input" maxlength="80" autocomplete="off" placeholder="例：返信する" value="${esc(st.task)}"><div class="chips" aria-label="入力例">${EXAMPLES.map(x=>`<button class="chip" type="button" data-example="${x}">${x}</button>`).join('')}</div><button class="btn primary" type="button" data-a="to-pains">公平に比べる</button><div id="err" class="error" aria-live="polite"></div><div class="privacy"><b>●</b><span>入力した内容はこの端末の画面内だけで使います。保存・共有文への自動挿入はしません。</span></div></section>`,0);document.getElementById('task').focus({preventScroll:true})}
function pains(){st.screen='pains';app.innerHTML=shell(`<button class="back" data-a="home">← 戻る</button><section class="stage"><div class="kicker">VISIBLE COST</div><h2>今やると、何が嫌？</h2><p class="lead">いま目に入りやすいコストを、最大3つだけ置く。</p><div class="pain-grid">${PAINS.map(p=>`<button type="button" class="pain ${st.pains.includes(p)?'on':''}" aria-pressed="${st.pains.includes(p)}" data-pain="${p}">${p}</button>`).join('')}</div><div class="count">${st.pains.length} / 3 選択</div><button class="btn primary" type="button" data-a="to-balance" ${st.pains.length?'':'disabled'}>天秤に乗せる</button><div id="err" class="error" aria-live="polite"></div></section>`,1)}
function balance(){st.screen='balance';const revealed=st.horizons.flatMap(h=>FUTURE[h].map(text=>({h,text})));const n=st.horizons.length;const tilt=-7+(n*5);const leftY=-8+(n*4),rightY=8-(n*4);app.innerHTML=shell(`<button class="back" data-a="pains">← 戻る</button><section class="stage" style="justify-content:flex-start"><div class="kicker">HIDDEN COST</div><h2>時間を進めてみる</h2><p class="lead">右側に「何もしない未来」の比較材料を足していく。</p><div class="balance-wrap"><div class="balance" style="--tilt:${tilt}deg;--leftY:${leftY}px;--rightY:${rightY}px"><div class="pan left"><strong>今やる痛み</strong><small>${esc(st.pains.join('・'))}</small></div><div class="pan right"><strong>何もしない未来</strong><small>${revealed.length?`${revealed.length}個の比較材料`:'まだ見えていない'}</small></div><div class="beam"></div><div class="pivot"></div><div class="stem"></div><div class="base"></div></div></div><div class="horizons">${Object.keys(HORIZON_LABEL).map(h=>`<button type="button" class="horizon ${st.horizons.includes(h)?'on':''}" data-h="${h}">${HORIZON_LABEL[h]}</button>`).join('')}</div><div class="future-list">${revealed.length?revealed.map(x=>`<div class="future"><b>${HORIZON_LABEL[x.h]}</b><span>${esc(x.text)}</span></div>`).join(''):`<div class="future"><b>いま</b><span>「やると嫌」は見えている。では、待つ側には何がある？</span></div>`}</div><p class="note">※ 天秤の傾きは、比較材料が増えたことを見せる演出です。損失や重要度を数値化したものではありません。</p><button class="btn primary" type="button" data-a="to-kind" ${st.horizons.length?'':'disabled'}>待つ意味を確かめる</button></section>`,2)}
function kind(){st.screen='kind';app.innerHTML=shell(`<button class="back" data-a="balance">← 戻る</button><section class="stage"><div class="kicker">RUNWAY OR ANESTHETIC?</div><h2>この先延ばしは、<br>どっちに近い？</h2><p class="lead">正解を当てる診断ではない。待つ理由を自分で分類する。</p><div class="choice-grid"><button type="button" class="choice runway ${st.kind==='runway'?'selected':''}" data-kind="runway"><strong>滑走路</strong><span>待つほど、情報・準備・選択肢が具体的に増える。</span></button><button type="button" class="choice anesthetic ${st.kind==='anesthetic'?'selected':''}" data-kind="anesthetic"><strong>麻酔</strong><span>待つ主な理由が、いま感じている嫌さや不安を避けること。</span></button></div><button class="btn primary" type="button" data-a="to-plan" ${st.kind?'':'disabled'}>この判断で進む</button></section>`,3)}
function plan(){st.screen='plan';if(st.kind==='runway'){app.innerHTML=shell(`<button class="back" data-a="kind">← 戻る</button><section class="stage"><div class="kicker">MAKE A RUNWAY</div><h2>待つなら、<br>待つほど前へ。</h2><p class="lead">「そのうち」ではなく、待つことで増えるものと再判断の条件を置く。</p><div class="form-group"><label class="label" for="gain">待つことで何を増やす？</label><input id="gain" class="input" maxlength="100" placeholder="例：候補3社の情報を集める" value="${esc(st.runwayGain)}"></div><div class="form-group"><label class="label" for="rule">いつ／何が揃ったら判断し直す？</label><input id="rule" class="input" maxlength="100" placeholder="例：金曜18時にもう一度決める" value="${esc(st.reviewRule)}"></div><button class="btn primary" type="button" data-a="runway-result">滑走路にする</button><div id="err" class="error" aria-live="polite"></div></section>`,4)}else{app.innerHTML=shell(`<button class="back" data-a="kind">← 戻る</button><section class="stage"><div class="kicker">SMALLEST MOVE</div><h2>麻酔を切るなら、<br>一手だけ。</h2><p class="lead">全部やらなくていい。いまの不快感を増やしすぎないサイズまで小さくする。</p><div class="tiny-grid">${TINY.map(t=>`<button type="button" class="tiny ${st.tiny===t?'on':''}" data-tiny="${t}">${t}</button>`).join('')}</div>${st.tiny==='自分で決める'?`<div class="form-group"><label class="label" for="custom">自分の一手</label><input id="custom" class="input" maxlength="80" placeholder="例：ファイル名だけ決める" value="${esc(st.customTiny)}"></div>`:''}<button class="btn primary" type="button" data-a="tiny-result" ${st.tiny?'':'disabled'}>この一手で終える</button><div id="err" class="error" aria-live="polite"></div></section>`,4)}}
function result(){st.screen='result';const future=st.horizons.flatMap(h=>FUTURE[h]);const decision=st.kind==='runway'?`${st.runwayGain} → ${st.reviewRule}`:(st.tiny==='自分で決める'?st.customTiny:st.tiny);app.innerHTML=shell(`<section class="stage" style="justify-content:flex-start;padding-top:34px"><div class="result-mark">✓</div><div class="kicker">DECIDED</div><h2 class="result-title">比較して、決めた。</h2><p class="lead">「今の嫌さ」だけではなく、待つ側も見たうえでの判断。</p><div class="summary"><div class="summary-card"><small>いま向き合っていること</small><strong>${esc(st.task)}</strong></div><div class="summary-card"><small>今見えていたもの</small><ul>${st.pains.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div><div class="summary-card"><small>見落としやすかったもの</small><ul>${future.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="summary-card"><small>今回の判断：${st.kind==='runway'?'滑走路':'麻酔'}</small><strong>${esc(decision)}</strong></div></div><div class="actions"><button class="btn primary" type="button" data-a="share">結果だけ共有</button><button class="btn secondary" type="button" data-a="restart">もう一度比べる</button><a class="btn text" style="display:grid;place-items:center;text-decoration:none" href="https://levelup.hitobito.jp/">LEVEL UPへ戻る</a></div><div class="privacy"><b>●</b><span>共有文には、入力した内容や選んだ悩みを含めません。</span></div></section>`,5)}
function saveTask(){const input=document.getElementById('task');const err=document.getElementById('err');const v=(input?.value||'').trim();if(!v){if(err)err.textContent='先延ばししていることを1つ入れてください。';setLive('入力が必要です');input?.focus();return false}st.task=v;return true}
function err(msg,id){const e=document.getElementById('err');if(e)e.textContent=msg;setLive(msg);document.getElementById(id)?.focus();return false}
async function share(){const text='先延ばしを「滑走路か麻酔か」で見直しました。\n何もしないコスト — LEVEL UP';const data={title:'何もしないコスト | LEVEL UP',text,url:location.href};try{if(navigator.share){await navigator.share(data);return}if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(`${text}\n${location.href}`);toast('共有文をコピーしました');return}const ta=document.createElement('textarea');ta.value=`${text}\n${location.href}`;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('共有文をコピーしました')}catch(e){if(e?.name!=='AbortError')toast('共有をキャンセルしました')}}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.example){document.getElementById('task').value=b.dataset.example;document.getElementById('task').focus();return}if(b.dataset.pain){const p=b.dataset.pain,i=st.pains.indexOf(p);if(i>=0)st.pains.splice(i,1);else if(st.pains.length<3)st.pains.push(p);else{toast('最大3つまで');return}pains();return}if(b.dataset.h){const h=b.dataset.h;if(!st.horizons.includes(h)){st.horizons.push(h);setLive(`${HORIZON_LABEL[h]}の比較材料を追加しました`)}balance();return}if(b.dataset.kind){st.kind=b.dataset.kind;kind();return}if(b.dataset.tiny){st.tiny=b.dataset.tiny;plan();return}const a=b.dataset.a;if(!a)return;if(a==='to-pains'){if(saveTask())pains()}else if(a==='home')home();else if(a==='pains')pains();else if(a==='balance')balance();else if(a==='kind')kind();else if(a==='to-balance'){if(st.pains.length)balance()}else if(a==='to-kind'){if(st.horizons.length)kind()}else if(a==='to-plan'){if(st.kind)plan()}else if(a==='runway-result'){st.runwayGain=(document.getElementById('gain')?.value||'').trim();st.reviewRule=(document.getElementById('rule')?.value||'').trim();if(!st.runwayGain)return err('待つことで増やすものを具体的に入れてください。','gain');if(!st.reviewRule)return err('判断し直す時点か条件を入れてください。','rule');result()}else if(a==='tiny-result'){if(!st.tiny)return;if(st.tiny==='自分で決める'){st.customTiny=(document.getElementById('custom')?.value||'').trim();if(!st.customTiny)return err('今できる一手を短く入れてください。','custom')}result()}else if(a==='share')share();else if(a==='restart'){st=fresh();home()}});
home();
})();
</script>
</body>
</html>
