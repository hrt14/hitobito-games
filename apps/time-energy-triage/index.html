<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11150d">
<meta name="description" content="残っている時間と体力から、今やる・小さくする・任せる・後ろへ送る・休むを短時間で選ぶLEVEL UPトレーニング。">
<title>余力で決める。— LEVEL UP</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:#f5f7ef;background:#0d110b;--lime:#d8ff5b;--panel:#151b12;--line:rgba(216,255,91,.2);--muted:#aab5a3}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% -15%,#26321a 0,#11160e 42%,#0b0e09 78%);color:#f5f7ef;-webkit-font-smoothing:antialiased}button,a{font:inherit}.app{width:min(620px,100%);margin:auto;padding:14px 16px calc(34px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top a{color:#d8ff5b;text-decoration:none;font-size:12px;font-weight:900;letter-spacing:.08em}.step{font-size:11px;color:var(--muted);font-weight:800}.screen{display:none}.screen.active{display:block}.eyebrow{color:var(--lime);font-weight:950;font-size:11px;letter-spacing:.15em;margin:0 0 10px}.hero h1{font-size:clamp(42px,13vw,68px);line-height:.92;letter-spacing:-.07em;margin:0 0 18px}.hero h1 span{color:var(--lime)}.lead{color:#cbd3c5;font-size:15px;line-height:1.8;margin:0 0 24px}.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 28px}.meter div{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 8px;text-align:center}.meter b{display:block;font-size:22px;color:#fff}.meter span{display:block;font-size:9px;color:var(--muted);margin-top:3px}.question h2{font-size:27px;line-height:1.22;letter-spacing:-.04em;margin:0 0 8px}.question p{color:var(--muted);line-height:1.6;font-size:13px;margin:0 0 18px}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:var(--panel);color:#f7f9f2;padding:16px;min-height:58px;font-weight:850;line-height:1.35}.choice small{display:block;color:var(--muted);font-weight:650;margin-top:4px}.choice:active{transform:scale(.985)}.choice.selected{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime);background:#1b2512}.nav{display:flex;gap:9px;margin-top:20px}.nav button{min-height:48px;border-radius:15px;font-weight:900}.back{flex:0 0 92px;background:transparent;color:#ccd3c7;border:1px solid rgba(255,255,255,.12)}.next{flex:1;border:0;background:var(--lime);color:#11150d}.result-head{margin-bottom:20px}.result-head h2{font-size:38px;letter-spacing:-.055em;line-height:1;margin:0 0 12px}.result-head p{color:var(--muted);line-height:1.7;margin:0}.decision{border:1px solid var(--line);background:linear-gradient(145deg,#182112,#10150d);border-radius:24px;padding:18px;margin:14px 0}.decision .label{font-size:10px;font-weight:950;letter-spacing:.12em;color:var(--lime)}.decision h3{font-size:29px;letter-spacing:-.04em;margin:8px 0}.decision p{margin:0;color:#d0d7ca;line-height:1.65}.rules{display:grid;gap:8px;margin-top:12px}.rule{display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:12px;background:rgba(255,255,255,.025)}.rule b{color:var(--lime);min-width:38px}.rule span{font-size:13px;line-height:1.5;color:#d3d9ce}.action{margin-top:18px;display:grid;gap:9px}.action button,.action a{min-height:50px;border-radius:15px;display:grid;place-items:center;text-decoration:none;font-weight:900}.restart{background:var(--lime);border:0;color:#11150d}.related{background:transparent;border:1px solid rgba(255,255,255,.13);color:#eef2e9}.note{font-size:10px;color:#7f8a7a;line-height:1.6;margin-top:18px}@media(max-width:420px){.app{padding-left:13px;padding-right:13px}.hero h1{font-size:48px}.question h2{font-size:25px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><a href="/">← LEVEL UP</a><span class="step" id="stepLabel">60 SEC TRIAGE</span></header>
<section class="screen active" id="start"><div class="hero"><p class="eyebrow">TIME × ENERGY</p><h1>余力で<br><span>決める。</span></h1><p class="lead">時間が足りない日に、速度を上げる前に量を決める。<br>残り時間と体力から、今日の仕事を<strong>減らす判断</strong>を60秒で作ります。</p></div><div class="meter"><div><b>5</b><span>QUESTIONS</span></div><div><b>60</b><span>SECONDS</span></div><div><b>1</b><span>NEXT MOVE</span></div></div><button class="next" id="startBtn" style="width:100%;min-height:54px;border-radius:16px;font-weight:950">今の余力で仕分ける →</button><p class="note">体調不良の診断や治療を行うものではありません。強い疲労や体調不良が続く場合は、仕事の効率化より休息や専門家への相談を優先してください。</p></section>
<section class="screen" id="quiz"><div class="question"><p class="eyebrow" id="qKicker"></p><h2 id="qTitle"></h2><p id="qHelp"></p><div class="choices" id="choices"></div></div><div class="nav"><button class="back" id="backBtn">← 戻る</button><button class="next" id="nextBtn" disabled>次へ →</button></div></section>
<section class="screen" id="result"><div class="result-head"><p class="eyebrow">TODAY'S OPERATING MODE</p><h2 id="resultTitle"></h2><p id="resultLead"></p></div><article class="decision"><span class="label">FIRST MOVE</span><h3 id="firstMove"></h3><p id="firstWhy"></p></article><div class="rules" id="rules"></div><div class="action"><button class="restart" id="restartBtn">もう一度仕分ける</button><a class="related" id="relatedLink" href="/">次に使うLEVEL UPを見る →</a></div></section>
</main>
<script>
(()=>{'use strict';
const qs=[
 {k:'01 / ENERGY',t:'今の体力はどれに近い？',h:'気合ではなく、今この瞬間の残量で選ぶ。',o:[['low','かなり少ない','集中を長く保つのが難しい'],['mid','半分くらい','短い集中ならできる'],['high','まだある','重い判断にも取り組める']]},
 {k:'02 / TIME',t:'今日、自由に使える時間は？',h:'会議や移動を除いた「本当に使える時間」。',o:[['tiny','30分未満','ほぼ一手だけ'],['short','30〜90分','1つ＋小さい仕事'],['room','90分以上','重い仕事にも枠を取れる']]},
 {k:'03 / DEADLINE',t:'今日やらないと実害が出るものは？',h:'「気になる」ではなく、相手・売上・締切が実際に止まるか。',o:[['one','1つだけ','最重要を一本にできる'],['many','2つ以上','量の調整が必要'],['none','特にない','今日は前倒しより回復も選べる']]},
 {k:'04 / LEVERAGE',t:'自分しかできない仕事はどれくらい？',h:'全部を自分の仕事として数えない。',o:[['few','ほとんどない','任せる・自動化の余地が大きい'],['some','一部だけ','自分の判断部分だけ残せる'],['most','多い','やる量そのものを減らす']]},
 {k:'05 / RECOVERY',t:'終わったあと、余力を残したい？',h:'明日の自分まで今日の予算に入れる。',o:[['must','必ず残したい','終了時刻を先に守る'],['nice','できれば残したい','時間上限を決める'],['push','今日は使い切ってもよい','ただし対象は1つに絞る']]}
];
const a=[];let i=0;const $=id=>document.getElementById(id);const show=id=>document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));
function render(){const q=qs[i];$('stepLabel').textContent=`${i+1} / ${qs.length}`;$('qKicker').textContent=q.k;$('qTitle').textContent=q.t;$('qHelp').textContent=q.h;$('choices').innerHTML='';q.o.forEach(([v,l,s])=>{const b=document.createElement('button');b.className='choice'+(a[i]===v?' selected':'');b.innerHTML=`${l}<small>${s}</small>`;b.onclick=()=>{a[i]=v;render()};$('choices').appendChild(b)});$('backBtn').style.visibility=i?'visible':'hidden';$('nextBtn').disabled=!a[i];$('nextBtn').textContent=i===qs.length-1?'結果を見る →':'次へ →'}
function finish(){const [energy,time,dead,self,recover]=a;let mode='削って守る';let lead='今日は「速く全部」ではなく、残す仕事を決める日です。';let move='今日止まる1件だけ着手';let why='締切への実害があるものを一本にし、それ以外を今日の責任から外します。';let related='/apps/important-first/';const rules=[];
 if(energy==='low'){mode='回復を先に守る';lead='疲れている日は、同じ1時間でも判断コストが上がります。作業量を下げて回復枠を守ります。';move=dead==='one'?'最重要を15分だけ進める':'まず回復の一手を選ぶ';why='低い余力で「全部を効率化」しようとすると、判断そのものが増えます。';related='/apps/chou-tsukareta/';rules.push(['休む','終了時刻か休憩を先に固定する'])}
 else if(time==='tiny'){mode='一手だけ通す';lead='使える時間が短いので、仕事を並行せず一本化します。';move=dead==='none'?'明日の詰まりを1つだけ消す':'実害が出る1件を25分以内で通す';why='短い時間では、切り替え回数を減らすことが最大の効率化です。'}
 else if(dead==='many'){mode='量を交渉する';lead='今日必要なものが複数あるなら、自分の速度だけでは解けません。範囲・期限・担当を動かします。';move='1件を「小さく・任せる・延期」で軽くする';why='仕事量が時間を超えているときは、能力ではなく条件を調整します。';related='/apps/help-me/'}
 else if(self==='few'){mode='自分の仕事を減らす';lead='自分でなくても進むものが多い状態です。実行より、渡し方を決めます。';move='1件だけ人・AI・仕組みに渡す';why='繰り返し自分で処理するより、担当を移す方が次回以降の時間も増えます。';related='/apps/help-me/'}
 else if(energy==='high'&&time==='room'){mode='重要1件に深く使う';lead='時間と余力がある日は、細かい効率化より重要な仕事をまとめて進めます。';move='最重要1件に50分の枠を置く';why='余力のある時間を小タスクで細切れにしないためです.';related='/apps/important-first/'}
 if(recover==='must')rules.push(['終える','終わる時刻を先に決める']);else if(recover==='nice')rules.push(['上限','1タスク25〜50分で区切る']);else rules.push(['集中','使い切る対象を1件だけにする']);
 if(self==='few'||self==='some')rules.push(['任せる','自分しかできない判断だけ残す']);
 rules.push(['やらない','今日やらなくても実害がない仕事を1件外す']);rules.push(['小さく','完成ではなく次の詰まりが消えるサイズにする']);
 $('resultTitle').textContent=mode;$('resultLead').textContent=lead;$('firstMove').textContent=move;$('firstWhy').textContent=why;$('rules').innerHTML=rules.map(([b,s])=>`<div class="rule"><b>${b}</b><span>${s}</span></div>`).join('');$('relatedLink').href=related;$('stepLabel').textContent='DONE';show('result')}
$('startBtn').onclick=()=>{i=0;a.length=0;render();show('quiz')};$('backBtn').onclick=()=>{if(i){i--;render()}};$('nextBtn').onclick=()=>{if(!a[i])return;if(i<qs.length-1){i++;render()}else finish()};$('restartBtn').onclick=()=>{i=0;a.length=0;render();show('quiz')};
})();
</script>
</body>
</html>
