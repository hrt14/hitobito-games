<style>
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;min-height:100%;background:#07090c;color:#e8e3da;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100dvh;overflow:hidden}.game{position:relative;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 8%,#1b2530 0,#0a0e13 46%,#050608 85%)}.room{position:absolute;inset:0;opacity:.8;pointer-events:none;background:linear-gradient(#10161d 0 44%,#0a0c0f 44%)}.room:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff2 4px);opacity:.08}.light{position:absolute;top:-16px;left:50%;width:180px;height:24px;transform:translateX(-50%);background:#c7d9cb;box-shadow:0 0 90px 35px #c7d9cb1c}.window{position:absolute;left:4%;top:13%;width:31%;height:34%;border:7px solid #171c22;background:linear-gradient(155deg,#111c27,#050709);display:grid;grid-template-columns:1fr 1fr;gap:3px}.window i{border:1px solid #2a333c}.desk{position:absolute;left:12%;right:9%;bottom:5%;height:29%;background:linear-gradient(#292b2d,#141619);border-top:7px solid #34383b;box-shadow:0 -20px 55px #000a}.monitor{position:absolute;left:6%;top:-55%;width:34%;height:67%;border:9px solid #15181b;background:#061213;box-shadow:0 0 0 2px #34383c}.monitor:before{content:"CAM 01";position:absolute;left:7px;top:6px;font:9px monospace;color:#6db8ad}.monitor:after{content:"";position:absolute;right:7px;top:7px;width:6px;height:6px;border-radius:50%;background:#b94b51;box-shadow:0 0 8px #b94b51}.scan{position:absolute;inset:-100% 0 100%;background:linear-gradient(transparent,#9ff2dc11,transparent);animation:scan 4s linear infinite}.paper{position:absolute;left:48%;top:12%;width:25%;height:34%;border:1px solid #81796833;background:#d2cab113;transform:rotate(-5deg)}.phone{position:absolute;right:6%;top:11%;width:12%;height:20%;border-radius:6px;background:#080a0c;box-shadow:inset 0 0 0 2px #2b2f33}.door{position:absolute;right:-2%;top:7%;width:21%;height:58%;border:8px solid #181c20;background:linear-gradient(90deg,#16191c,#222529)}.door b{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.14em;white-space:nowrap;color:#b5aa99}.door i{position:absolute;top:43%;left:49%;width:9px;height:9px;border:2px solid #6c655b;border-radius:50%}.clock{position:absolute;left:40%;top:11%;padding:5px 9px;border:2px solid #24292d;background:#050607;color:#b14d52;font:700 17px monospace;letter-spacing:.08em}.start{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 22px 88px;background:linear-gradient(90deg,#05070ab8,transparent 25%,transparent 75%,#05070ab8)}.eyebrow{font:700 9px monospace;letter-spacing:.3em;color:#8b948e}.start h1{margin:13px 0 15px;font:500 clamp(44px,14vw,72px)/1.08 serif;letter-spacing:.08em;text-shadow:0 4px 24px #000}.start .tag{font-size:13px;line-height:1.9;color:#b5b1aa;margin:0 0 28px}.primary,.ghost{min-width:220px;padding:14px 24px;border-radius:999px;font-weight:700;letter-spacing:.07em}.primary{border:0;background:#e7e2d7;color:#101216;box-shadow:0 12px 35px #0008}.ghost{margin-top:10px;border:1px solid #41474a;background:#0c1015d9;color:#b7b4ad}.help{position:absolute;left:0;right:0;bottom:max(20px,env(safe-area-inset-bottom));color:#737a75;font-size:10px;letter-spacing:.08em}.hud{position:relative;z-index:4;padding:max(16px,env(safe-area-inset-top)) 16px 0}.night{display:flex;justify-content:space-between;align-items:end;font:500 18px serif;letter-spacing:.12em;margin-bottom:9px}.night small{font:9px monospace;color:#89908b}.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.meter{display:grid;grid-template-columns:15px 1fr;gap:4px;align-items:center}.meter span{font-size:11px;text-align:center}.meter b{display:block;font-size:7px;color:#858c88;font-weight:500;margin-bottom:3px}.meter i{display:block;height:4px;background:#20262a;border-radius:4px;overflow:hidden}.meter em{display:block;height:100%;background:#8da094;transition:width .3s}.meter.truth em{background:#82a8a4}.meter.sanity em{background:#aaa49e}.meter.anomaly em{background:#944d5a}.meter.locked{opacity:.36}.zone{position:relative;z-index:5;height:calc(100dvh - 145px);display:flex;align-items:center;justify-content:center;padding:14px 18px 102px}.card{position:relative;width:min(86vw,380px);height:min(63dvh,565px);overflow:hidden;border:1px solid #40464b;border-radius:18px;background:linear-gradient(#171c22,#0d1014);box-shadow:0 28px 75px #000c,0 0 0 1px #ffffff08 inset;touch-action:none;user-select:none;transition:transform .25s,opacity .2s}.card.drag{transition:none}.portrait{height:51%;position:relative;overflow:hidden;border-bottom:1px solid #343a3f;background:#0a0d11}.portrait svg{width:100%;height:100%;display:block;filter:saturate(.72) contrast(1.05)}.portrait:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -42px 58px #0d1117cc;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px);opacity:.06}.copy{height:42%;padding:17px 19px 10px}.speaker{font:700 9px monospace;letter-spacing:.06em;color:#909995}.copy p{margin:8px 0 0;font:500 clamp(16px,4.5vw,20px)/1.65 serif;color:#e4dfd7}.hint{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;color:#6f7773;font-size:10px}.choice{position:absolute;z-index:8;top:44%;max-width:130px;padding:9px 12px;border:1px solid #7d857f;border-radius:7px;background:#11151bed;font-weight:700;font-size:12px;opacity:0;pointer-events:none}.choice.l{left:7px;transform:rotate(-4deg)}.choice.r{right:7px;transform:rotate(4deg)}.buttons{position:absolute;z-index:7;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:9px}.buttons button{min-height:44px;padding:9px;border:1px solid #3c4246;border-radius:12px;background:#0b1015e8;color:#b4b7b3;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.toast{position:fixed;z-index:99;top:17%;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid #4a534e;border-radius:999px;background:#11171bed;color:#d9d4cb;font-size:11px;animation:toast 1.6s forwards}.corrupt .clock{animation:jitter .14s infinite}.corrupt .card{box-shadow:0 28px 75px #000c,0 0 28px #7d263333}.glitch #app{animation:glitch .1s steps(2) 2}.records,.ending{min-height:100dvh;overflow:auto;background:radial-gradient(circle at 50% 0,#1a232d,#07090c 58%);padding:calc(30px + env(safe-area-inset-top)) 20px 60px}.records h2,.ending h2{font:500 35px/1.25 serif;letter-spacing:.05em;margin:9px 0}.back{padding:0 0 22px;border:0;background:none;color:#a1a6a2}.grid{display:grid;gap:9px;margin:24px 0}.grid article{padding:14px;border:1px solid #343a3e;border-radius:12px;background:#0d1216}.grid small{font:8px monospace;color:#717a75;letter-spacing:.12em}.grid b{display:block;margin:5px 0;font:500 17px serif}.grid p{margin:0;color:#9ea29f;font-size:12px;line-height:1.65}.ending{display:flex;flex-direction:column;justify-content:center;overflow:hidden}.ending h2{font-size:39px}.ending>p{font:500 16px/1.9 serif;color:#bbb5ad}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 26px}.stats span{padding:6px 9px;border:1px solid #383e41;border-radius:999px;color:#979d98;font-size:10px}@keyframes scan{to{transform:translateY(200%)}}@keyframes jitter{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}@keyframes glitch{33%{transform:translate(3px,-1px);filter:hue-rotate(40deg)}66%{transform:translate(-3px,1px);filter:contrast(1.6)}}@keyframes toast{75%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
</style>

<body><div id="app"></div><script>
const A=document.querySelector('#app'),clamp=n=>Math.max(0,Math.min(100,n));
const faces={manager:['#9da7a8','#202833'],woman:['#c5aaa4','#372c34'],guard:['#aa998f','#243646'],delivery:['#b7a59a','#28525a'],old:['#b9aa99','#5b5348'],child:['#c6b4aa','#616d79'],tanaka:['#c0b3a8','#4b555f'],self:['#a5aaad','#30363e']};
function face(k='manager'){let [skin,coat]=faces[k]||faces.manager;let hat=k==='guard'?'<path d="M93 82l14-42h68l14 42z" fill="#192530"/><rect x="98" y="68" width="84" height="14" fill="#334654"/>':'';let hair=k==='old'?'#d3d0c8':'#24242a';let eyes=k==='self'?'6':'4';return `<svg viewBox="0 0 280 220"><rect width="280" height="220" fill="#11151a"/><circle cx="140" cy="91" r="44" fill="${skin}"/><path d="M96 89c2-58 89-63 90 2-18-19-33-26-48-26-17 0-29 8-42 24Z" fill="${hair}"/>${hat}<circle cx="123" cy="99" r="${eyes}" fill="#050608"/><circle cx="159" cy="99" r="${eyes}" fill="#050608"/><path d="M127 119c9 5 19 5 28 0" fill="none" stroke="#746b68" stroke-width="3"/><path d="M84 220c10-58 31-83 57-83 26 0 47 27 56 83" fill="${coat}"/>${k==='delivery'?'<rect x="33" y="151" width="72" height="50" fill="#8b6d48" stroke="#c1a06b"/>':''}${k==='self'?'<path d="M0 42h280M0 88h280M0 153h280" stroke="#d6eef1" opacity=".11" stroke-width="3"/>':''}</svg>`}
const C=[
{id:'intro',turn:0,p:'manager',n:'管理会社 本部',t:'今夜から、あなたが夜間管理人です。異常があれば判断してください。',l:'了解する',r:'勤務を始める',e:{l:{trust:2},r:{truth:2}}},
{id:'noise',turn:1,p:'woman',n:'203号室・佐々木',t:'上の階から、夜中ずっと椅子を引きずる音がするんです。',l:'様子を見る',r:'上階へ連絡する',e:{l:{sanity:2,truth:1},r:{trust:5,anomaly:2}},tag:'chair'},
{id:'delivery',turn:2,p:'delivery',n:'配達員',t:'407号室のお荷物です。受領印だけお願いできますか。',l:'そんな部屋はない',r:'預かる',e:{l:{truth:5,trust:-2},r:{trust:2,anomaly:6}},tag:'407'},
{id:'camera',turn:3,p:'guard',n:'警備員・黒田',t:'3階の防犯カメラ、23時47分だけ毎晩真っ黒になります。',l:'記録を確認する',r:'交換する',e:{l:{truth:6,sanity:-2},r:{trust:4,anomaly:3}},tag:'camera'},
{id:'water',min:4,p:'old',n:'101号室・森',t:'廊下が濡れている。上から漏れてるんじゃないか？',l:'清掃だけする',r:'原因を調べる',e:{l:{trust:2},r:{truth:5,sanity:-3}}},
{id:'childcry',min:5,req:['407'],p:'woman',n:'203号室・佐々木',t:'今度は407号室から子どもの泣き声が聞こえます。',l:'聞き間違いだ',r:'一緒に確認する',e:{l:{trust:-5,sanity:3},r:{truth:7,sanity:-5,anomaly:5}}},
{id:'key',min:5,req:['407'],p:'guard',n:'警備員・黒田',t:'鍵保管庫に「407」と刻まれた鍵が一本増えています。',l:'廃棄する',r:'保管する',e:{l:{sanity:5,truth:-2},r:{truth:7,anomaly:7}}},
{id:'plan',min:6,req:['407'],p:'manager',n:'管理会社 本部',t:'当館は6階建て、全36戸。図面上、4階は401〜406号室までです。',l:'図面を信じる',r:'現場を信じる',e:{l:{sanity:7,truth:-4},r:{truth:8,sanity:-5,anomaly:5}}},
{id:'kid',min:7,req:['407','chair'],p:'child',n:'？？？',t:'おじさん。お母さんが帰ってこないの。407まで一緒に来て。',l:'警察を呼ぶ',r:'ついていく',e:{l:{trust:4,anomaly:3},r:{truth:10,sanity:-8,anomaly:9}}},
{id:'tanaka',min:7,req:['407'],p:'tanaka',n:'407号室・田中',t:'昨日はありがとうございました。妻も落ち着きました。',l:'あなたは誰だ',r:'どういたしまして',e:{l:{truth:9,trust:-3,sanity:-3},r:{trust:5,anomaly:10,sanity:-6}}},
{id:'record',min:8,req:['camera'],p:'guard',n:'警備員・黒田',t:'古い台帳に「1998年 407号室 火災」とあります。見ますか？',l:'閉じる',r:'読む',e:{l:{sanity:6},r:{truth:12,sanity:-9,anomaly:7}}},
{id:'photo',min:8,p:'old',n:'101号室・森',t:'昔の集合写真だ。先代の管理人……あんたにそっくりだな。',l:'偶然だ',r:'写真を受け取る',e:{l:{sanity:4},r:{truth:9,anomaly:8,sanity:-6}}},
{id:'empty',min:9,p:'child',n:'？？？',t:'ねえ。どうして管理人室に、だれもいないの？',l:'ここにいる',r:'誰を見てる？',e:{l:{sanity:-7,anomaly:10},r:{truth:9,sanity:-9,anomaly:8}}},
{id:'selfcam',min:10,req:['camera'],p:'self',n:'防犯カメラ 01',t:'管理人室の映像です。椅子には誰も座っていません。',l:'映像を切る',r:'見続ける',e:{l:{sanity:5,truth:-4},r:{truth:13,sanity:-12,anomaly:12}}},
{id:'call',min:11,p:'woman',n:'203号室・佐々木',t:'管理人さん、今どこにいます？ 管理人室の前に、あなたが立ってるんですけど。',l:'ドアを開ける',r:'絶対に開けない',e:{l:{truth:8,anomaly:15,sanity:-12},r:{sanity:6,trust:-2,anomaly:4}}},
{id:'mirror',min:12,p:'self',n:'？？？',t:'あなたは何代目の管理人ですか？',l:'最初の一人だ',r:'わからない',e:{l:{sanity:-8,truth:3},r:{truth:10,anomaly:7}}},
{id:'basement',min:12,req:['camera'],p:'guard',n:'警備員・黒田',t:'地下の私物庫に名札が七つ。全部、あなたの名前です。',l:'焼却する',r:'中を開ける',e:{l:{sanity:5,truth:-6},r:{truth:15,sanity:-12,anomaly:10}}},
{id:'handover',min:14,p:'self',n:'夜間管理人',t:'今夜、管理人を交代しますか？',l:'ここに残る',r:'交代する',e:{l:{truth:5,sanity:-8},r:{anomaly:12,trust:3}},final:true}
];
const META=[
{id:'note',min:7,run:2,p:'manager',n:'机の引き出し',t:'「407を開けるな。私は一度、交代した」——あなたの筆跡だ。',l:'破る',r:'読む',e:{l:{sanity:3},r:{truth:12,anomaly:7,sanity:-7}}},
{id:'memory',min:9,run:3,p:'child',n:'？？？',t:'前は「警察を呼ぶ」って言ったよね。今度は一緒に来てくれる？',l:'記憶にない',r:'……覚えている',e:{l:{sanity:-6,truth:5},r:{truth:8,anomaly:8}}}
];
function getSave(){try{return JSON.parse(localStorage.getItem('midnight-manager')||'null')||{run:1,clues:[],ends:[]}}catch{return{run:1,clues:[],ends:[]}}}let save=getSave(),S,drag={on:false,x0:0,x:0};
function store(){try{localStorage.setItem('midnight-manager',JSON.stringify(save))}catch{}}
function bg(){return `<div class="room"><div class="light"></div><div class="window"><i></i><i></i><i></i><i></i></div><div class="desk"><div class="monitor"><div class="scan"></div></div><div class="paper"></div><div class="phone"></div></div><div class="door"><b>管理人室</b><i></i></div><div class="clock">23:${String(47+(S?.turn||0)%12).padStart(2,'0')}</div></div>`}
function startScreen(){A.innerHTML=`<main class="game">${bg()}<section class="start"><div class="eyebrow">MIDNIGHT CARETAKER</div><h1>午前零時の<br>管理人</h1><p class="tag">夜のマンションでは、<br>正しい判断ほど信用できない。</p><button class="primary" id="start">${save.run>1?'第'+save.run+'夜を始める':'勤務を始める'}</button><button class="ghost" id="archive">管理記録 ${save.clues.length}</button><div class="help">カードを左右にスワイプして判断する</div></section></main>`;document.querySelector('#start').onclick=begin;document.querySelector('#archive').onclick=records}
function records(){A.innerHTML=`<main class="records"><button class="back" id="back">← 戻る</button><div class="eyebrow">ARCHIVE</div><h2>管理記録</h2><div class="grid">${save.clues.length?save.clues.map((x,i)=>`<article><small>記録 ${String(i+1).padStart(2,'0')}</small><b>${x[0]}</b><p>${x[1]}</p></article>`).join(''):'<article><p>まだ記録はない。</p></article>'}</div><p style="color:#7f8782;font-size:11px">確認した結末：${save.ends.length?save.ends.join(' / '):'なし'}</p></main>`;document.querySelector('#back').onclick=startScreen}
function begin(){S={trust:52,truth:20+(save.run-1)*3,sanity:72,anomaly:Math.min(8,(save.run-1)*2),turn:0,seen:[],tags:[],end:false};next()}
function pool(){return C.concat(META.filter(x=>save.run>=x.run))}
function pick(){let p=pool().filter(x=>!S.seen.includes(x.id)&&(x.turn==null||x.turn===S.turn)&&(x.min==null||S.turn>=x.min)&&(!x.req||x.req.every(r=>S.tags.includes(r))));if(S.turn<4){let id=['intro','noise','delivery','camera'][S.turn];return p.find(x=>x.id===id)}let final=p.find(x=>x.final);let n=p.filter(x=>!x.final);if(S.turn>=15&&final)return final;if(n.length)return n[Math.floor(Math.random()*n.length)];return final||C.find(x=>x.final)}
function meter(k,label,hide){let v=S[k];if(hide&&v<18)return `<div class="meter locked"><span>?</span><div><b>---</b><i></i></div></div>`;return `<div class="meter ${k}"><span>${k==='trust'?'●':k==='truth'?'◉':k==='sanity'?'◇':'✦'}</span><div><b>${label}</b><i><em style="width:${v}%"></em></i></div></div>`}
function next(){let c=pick();if(!c)return end(C.find(x=>x.final),'l');render(c)}
function render(c){let corrupt=S.anomaly>=42,swap=corrupt&&S.anomaly>68&&Math.random()<.16,l=swap?c.r:c.l,r=swap?c.l:c.r;A.innerHTML=`<main class="game ${corrupt?'corrupt':''}">${bg()}<section class="hud"><div class="night">第${save.run}夜 <small>${String(S.turn+1).padStart(2,'0')}件目</small></div><div class="meters">${meter('trust','住民')}${meter('truth','真相')}${meter('sanity','正気')}${meter('anomaly','?',true)}</div></section><section class="zone"><div class="choice l" id="lc">${l}</div><div class="choice r" id="rc">${r}</div><article class="card" id="card"><div class="portrait">${face(c.p)}</div><div class="copy"><div class="speaker">${c.n}</div><p>${c.t}</p></div><div class="hint">‹　左右にスワイプ　›</div></article></section><section class="buttons"><button data-s="l">‹ ${l}</button><button data-s="r">${r} ›</button></section></main>`;wire(c)}
function wire(c){let el=document.querySelector('#card'),lc=document.querySelector('#lc'),rc=document.querySelector('#rc');el.onpointerdown=e=>{drag={on:true,x0:e.clientX,x:0};el.setPointerCapture(e.pointerId);el.classList.add('drag')};el.onpointermove=e=>{if(!drag.on)return;drag.x=e.clientX-drag.x0;el.style.transform=`translateX(${drag.x}px) rotate(${drag.x/24}deg)`;let o=Math.min(1,Math.abs(drag.x)/80);lc.style.opacity=drag.x<0?o:0;rc.style.opacity=drag.x>0?o:0};let up=()=>{if(!drag.on)return;drag.on=false;el.classList.remove('drag');if(Math.abs(drag.x)>85){let s=drag.x<0?'l':'r';el.style.transform=`translateX(${s==='l'?-520:520}px) rotate(${s==='l'?-18:18}deg)`;el.style.opacity=0;choose(c,s)}else{el.style.transform='';lc.style.opacity=rc.style.opacity=0}};el.onpointerup=up;el.onpointercancel=up;document.querySelectorAll('.buttons button').forEach(b=>b.onclick=()=>choose(c,b.dataset.s))}
const clue={delivery:['存在しない407号室','公式図面にはない部屋宛ての荷物が届いた。'],record:['1998年の火災','古い台帳に「407号室 火災」の記録がある。'],photo:['先代の管理人','昔の写真の管理人は、現在の管理人と酷似している。'],selfcam:['空の管理人室','防犯カメラには、管理人がいるはずの椅子しか映らない。'],basement:['七つの名札','地下に同じ名前の管理人の名札が七つある。'],note:['自分の筆跡','「私は一度、交代した」と自分の字で書かれている。']};
function choose(c,s){if(S.end)return;S.seen.push(c.id);if(c.tag&&!S.tags.includes(c.tag))S.tags.push(c.tag);let d=c.e[s]||{};['trust','truth','sanity','anomaly'].forEach(k=>S[k]=clamp(S[k]+(d[k]||0)));S.turn++;if(clue[c.id]&&!save.clues.some(x=>x[0]===clue[c.id][0])){save.clues.push(clue[c.id]);store();toast('管理記録を更新')}if(S.anomaly>30&&Math.random()<.4)glitch();if(c.final||S.sanity<=0||S.trust<=0||S.anomaly>=100)return end(c,s);setTimeout(next,240)}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1600)}function glitch(){document.body.classList.add('glitch');setTimeout(()=>document.body.classList.remove('glitch'),220)}
