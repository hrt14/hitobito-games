<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#090a0d" />
  <meta name="description" content="午前0時13分。玄関の外に立っていたのは、自分だった。選んだ手掛かりで結末が変わり、2周目から物語も変わるサウンドノベル型ホラー。" />
  <title>玄関の外に、自分がいる。｜hitobito PLAY</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app" class="app">
    <section id="startScreen" class="start-screen screen is-visible" aria-labelledby="gameTitle">
      <div class="rain rain-a" aria-hidden="true"></div>
      <div class="rain rain-b" aria-hidden="true"></div>
      <div class="start-house" aria-hidden="true">
        <div class="start-door"></div>
        <div class="start-person"></div>
      </div>
      <div class="start-copy">
        <p class="eyebrow">SOUND NOVEL / HORROR</p>
        <h1 id="gameTitle">玄関の外に、<br><em>自分がいる。</em></h1>
        <p class="hook">午前0時13分。<br>ドアホンの画面に、濡れたあなたが立っている。</p>
        <div id="memoryLine" class="memory-line" hidden></div>
        <div class="start-actions">
          <button id="startSound" class="primary-button" type="button">音ありで始める</button>
          <button id="startSilent" class="ghost-button" type="button">静かに始める</button>
        </div>
        <p class="tiny-note">イヤホン推奨 / 主要操作はタップだけ</p>
      </div>
    </section>

    <section id="gameScreen" class="game-screen screen" aria-live="polite">
      <header class="game-hud">
        <div class="hud-left">
          <span id="clockLabel" class="clock">00:13</span>
          <span id="weatherLabel" class="weather">雨</span>
        </div>
        <div class="approach" aria-label="玄関までの距離">
          <span class="approach-label">玄関まで</span>
          <div id="approachDots" class="approach-dots" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </div>
        </div>
        <button id="soundToggle" class="sound-toggle" type="button" aria-label="音を切り替える">音 ON</button>
      </header>

      <div id="scene" class="scene" data-scene="door" aria-hidden="true">
        <div class="rain rain-a"></div>
        <div class="rain rain-b"></div>
        <div class="room-shadow shadow-left"></div>
        <div class="room-shadow shadow-right"></div>

        <div class="door-frame">
          <div class="door-slab">
            <div class="door-chain"></div>
            <div class="door-eye"></div>
            <div class="door-handle"></div>
          </div>
          <div class="door-gap"></div>
          <div class="outside-self">
            <div class="outside-head"></div>
            <div class="outside-body"></div>
          </div>
        </div>

        <div class="intercom">
          <div class="intercom-screen">
            <div class="camera-noise"></div>
            <div class="camera-self">
              <div class="camera-head"></div>
              <div class="camera-body"></div>
            </div>
            <div id="cameraStamp" class="camera-stamp">00:13:08</div>
          </div>
          <div class="intercom-led"></div>
        </div>

        <div class="mirror-object">
          <div class="mirror-glass">
            <div class="reflection"></div>
            <div class="mirror-message">だすな</div>
          </div>
        </div>

        <div class="phone-object">
          <div class="phone-notch"></div>
          <div class="phone-screen">
            <span>下書き</span>
            <strong>00:28</strong>
            <p>家の中にいる方を<br>外へ出せ。</p>
          </div>
        </div>

        <div class="bed-object">
          <div class="bed-pillow"></div>
          <div class="wet-print print-1"></div>
          <div class="wet-print print-2"></div>
          <div class="wet-print print-3"></div>
        </div>

        <div class="closet-object">
          <div class="closet-door left"></div>
          <div class="closet-door right"></div>
          <div class="key-hook">鍵</div>
          <div class="missing-key">×</div>
        </div>

        <div class="backdoor-object">
          <div class="backdoor-window"></div>
          <div class="backdoor-handle"></div>
          <div class="backdoor-chain"></div>
        </div>

        <div id="flash" class="flash"></div>
        <div id="glitch" class="glitch"></div>
      </div>

      <section id="novelPanel" class="novel-panel">
        <div id="speaker" class="speaker" hidden></div>
        <p id="storyText" class="story-text"></p>
        <div id="tapHint" class="tap-hint">タップして進む</div>
        <div id="choices" class="choices" role="group" aria-label="選択肢"></div>
      </section>
    </section>

    <section id="endingScreen" class="ending-screen screen" aria-live="polite">
      <div class="ending-noise" aria-hidden="true"></div>
      <div class="ending-copy">
        <p id="endingLabel" class="eyebrow">ENDING</p>
        <h2 id="endingTitle"></h2>
        <p id="endingText" class="ending-text"></p>
        <div id="endingClues" class="ending-clues"></div>
        <button id="retryButton" class="primary-button" type="button">別の手掛かりを追う</button>
        <button id="forgetButton" class="ghost-button danger" type="button">この家の記憶を消す</button>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
</body>
</html>
