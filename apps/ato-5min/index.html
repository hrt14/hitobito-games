<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e16" />
  <title>あと5分 — バラして動け</title>
  <meta name="description" content="巨大なタスクを、今すぐ動ける最小単位までバラす。タスク分解の思考癖をゲームで鍛える。" />
  <link rel="stylesheet" href="style-part1.css" />
  <link rel="stylesheet" href="style-part2.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button id="homeBtn" class="icon-btn" aria-label="ホーム">⌂</button>
      <div class="brand">
        <span class="brand-kicker">THINKING TRAINER</span>
        <strong>あと5分</strong>
      </div>
      <button id="soundBtn" class="icon-btn" aria-label="音">♪</button>
    </header>

    <main id="main" class="main"></main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button data-nav="play" class="nav-item is-active"><span>⚒</span><small>分解</small></button>
      <button data-nav="patterns" class="nav-item"><span>✦</span><small>型</small></button>
      <button data-nav="dojo" class="nav-item"><span>⚡</span><small>道場</small></button>
      <button data-nav="me" class="nav-item"><span>◎</span><small>記録</small></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="burst" class="burst" aria-hidden="true"></div>
  <script>
  (async()=>{
    try{
      const [a,b]=await Promise.all(['game-a.bin','game-b.bin'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.arrayBuffer()})));
      const ua=new Uint8Array(a),ub=new Uint8Array(b),all=new Uint8Array(ua.length+ub.length);all.set(ua);all.set(ub,ua.length);
      if(!('DecompressionStream' in window))throw new Error('このブラウザはDecompressionStreamに対応していません');
      const stream=new Blob([all]).stream().pipeThrough(new DecompressionStream('gzip'));
      const code=await new Response(stream).text();
      (0,eval)(code);
    }catch(e){
      document.getElementById('main').innerHTML='<section class="card" style="padding:20px"><h2>ゲームを読み込めませんでした</h2><p style="color:var(--muted);line-height:1.6">Chrome / Edge / Safari の新しいバージョンで開いてください。</p><pre style="white-space:pre-wrap;color:#ff9d9d">'+String(e)+'</pre></section>';
    }
  })();
  </script>
</body>
</html>
