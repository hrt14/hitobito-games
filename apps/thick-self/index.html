<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0d0e" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)" />
  <title>分厚い自分をつくる | LEVEL UP</title>
  <meta name="description" content="批判・嫉妬・失敗・成功・不確実さに、すぐ反応せず、否定せず、囚われず、戻れる。7つの心理学的スキルを毎日反復する3分トレーニング。" />
  <meta property="og:title" content="分厚い自分をつくる | LEVEL UP" />
  <meta property="og:description" content="取り乱さない人ではなく、取り乱しても戻れる人へ。1日3分、反応の型を反復する。" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="LEVEL UP ホーム">LEVEL UP</a>
    <div class="top-actions">
      <button id="scienceBtn" class="ghost-btn" type="button">科学的背景</button>
      <button id="exitBtn" class="ghost-btn" type="button">終了</button>
    </div>
  </header>
  <main id="app" class="shell" aria-live="polite"></main>
  <dialog id="scienceDialog" class="science-dialog">
    <div class="dialog-head">
      <div><div class="eyebrow">EVIDENCE MAP</div><h2>「心の厚み」は7つの研究領域を組み合わせた独自モデル</h2></div>
      <button id="scienceClose" class="close-btn" type="button" aria-label="閉じる">×</button>
    </div>
    <p class="dialog-note">「分厚さ」自体が検証済みの心理尺度という意味ではありません。各トレーニングは既存研究の概念に対応し、アプリ内の厚みスコアは練習履歴を可視化する独自指標です。</p>
    <div id="scienceList" class="science-list"></div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
