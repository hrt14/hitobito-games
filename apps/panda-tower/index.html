<title>パンダタワー</title>
<style>
:root{--pink:#f64286;--green:#16875c;--yellow:#f6ad16;--ink:#17231d;--cream:#fffdf5;--sky1:#dcebdd;--sky2:#f4e7cf;--floor:0;--progress:0}

2,.9,.2,1),transform .25s}.panda-runner:before,.panda-runner:after{content:"";position:absolute;top:-6px;width:10px;height:10px;background:#313433;border-radius:50%;z-index:-1}.panda-runner:before{left:0}.panda-runner:after{right:0}.panda-runner i,.panda-runner b{position:absolute;top:9px;width:7px;height:9px;background:#313433;border-radius:50%}.panda-runner i{left:5px;transform:rotate(25deg)}.panda-runner b{right:5px;transform:rotate(-25deg)}.panda-runner em{position:absolute;left:11px;top:16px;width:8px;height:5px;background:#313433;border-radius:50%}.hud{position:absolute;z-index:30;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.hud-card{display:flex;gap:7px;align-items:center;background:#fffdf4d9;border:1px solid #ffffffcc;border-radius:15px;padding:8px 10px;box-shadow:0 7px 20px #39534518;backdrop-filter:blur(8px)}.floor strong{font-size:22px;line-height:1;letter-spacing:-.05em}.floor small{font-size:8px;font-weight:950;letter-spacing:.15em;color:#63736a}.hearts{font-size:15px;letter-spacing:2px}.timer{font-variant-numeric:tabular-nums;font-weight:950;font-size:18px}.timer.danger{color:#db315d;animation:pulse .55s infinite alternate}@keyframes pulse{to{transform:scale(1.09)}}.progress{position:absolute;z-index:25;top:62px;right:13px;width:10px;height:38%;min-height:180px;border-radius:99px;background:#ffffff88;border:1px solid #ffffffcc;overflow:hidden;box-shadow:0 5px 20px #0001}.progress i{position:absolute;left:1px;right:1px;bottom:1px;height:calc(var(--progress)*1%);border-radius:99px;background:linear-gradient(var(--pink),var(--yellow));transition:height .45s cubic-bezier(.2,.9,.2,1)}.progress:after{content:"30F";position:absolute;right:13px;top:-1px;font-size:8px;font-weight:950;white-space:nowrap;color:#35493e}.screen{position:absolute;z-index:20;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 13px max(14px,env(safe-area-inset-bottom));pointer-events:none}.panel{width:100%;border-radius:24px;background:#fffdf2ed;border:1px solid #ffffff;box-shadow:0 20px 48px #4833382d;backdrop-filter:blur(16px);padding:17px;pointer-events:auto}.hidden{display:none!important}.intro{align-self:center;margin-bottom:2vh;max-width:430px}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.16em;color:#66766d}.intro h1{font-size:clamp(48px,15vw,76px);line-height:.86;letter-spacing:-.075em;margin:9px 0 11px}.intro h1 span{color:var(--pink)}.intro p{font-size:13px;line-height:1.7;color:#66756c;margin:0 0 14px}.route-demo{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 11px}.route-demo div{border-radius:15px;padding:10px 6px;text-align:center;font-size:9px;font-weight:900;color:#314239;border:1px solid #0000000c}.route-demo b{display:block;font-size:28px;margin-bottom:3px}.route-demo .pink{background:#ffe3ee}.route-demo .green{background:#e0f0e7}.route-demo .yellow{background:#fff0cf}.primary{width:100%;border:0;border-radius:17px;background:#16241d;color:#fff;padding:15px 17px;font-weight:950;font-size:15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 7px 0 #0b1510;touch-action:manipulation}.primary:active{transform:translateY(4px);box-shadow:0 3px 0 #0b1510}.choice-panel{padding:14px}.choice-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}.choice-head b{font-size:16px}.choice-head span{font-size:9px;color:#738078;font-weight:900}.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.route{border:0;border-radius:18px;min-height:95px;padding:9px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:950;box-shadow:0 5px 0 #0002;touch-action:manipulation}.route:active{transform:translateY(3px);box-shadow:0 2px 0 #0002}.route .ico{font-size:26px}.route small{font-size:8px;letter-spacing:.08em;opacity:.65}.route b{font-size:12px}.route.slideBtn{background:#ffd3e5 dius:50%;background:conic-gradient(#ed4e84 calc(var(--spin)*1turn),#ebe5d8 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);pointer-events:none}.result{align-self:center;max-width:390px;text-align:center}.result .burst{font-size:56px;animation:pop .45s cubic-bezier(.2,1.4,.3,1)}@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}.result h2{font-size:36px;line-height:.95;letter-spacing:-.055em;margin:6px 0 8px}.result p{font-size:13px;line-height:1.65;color:#637169;margin:0 0 13px}.toast{position:absolute;z-index:50;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);opacity:0;background:#15231d;color:white;border-radius:999px;padding:10px 15px;font-size:13px;font-weight:950;pointer-events:none;transition:.18s;white-space:nowrap;box-shadow:0 12px 35px #17261e4d}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.float{position:absolute;z-index:45;left:50%;top:43%;font-size:28px;font-weight:950;color:#fff;text-shadow:0 3px 0 #0003;pointer-events:none;animation:floatUp .72s ease-out forwards}@keyframes floatUp{to{transform:translateY(-68px) scale(1.2);opacity:0}}.game.night{--sky1:#18244d;--sky2:#6f5472}.game.night .sun{background:#fff8d0;box-shadow:0 0 0 11px #fff5cb15,0 0 65px #fff4ba55}.game.night .building,.game.night .farhouse{filter:brightness(.48) saturate(.8)}.game.night .tree{filter:brightness(.65)}.game.night:after{content:"✦  ·  ✧    ·    ✦   ·  ✧    ·   ✦";position:absolute;left:12%;right:8%;top:8%;color:#fff9d6;font-size:18px;letter-spacing:17px;opacity:.65;z-index:0}.game.high{--sky1:#14274f;--sky2:#a1719a}.game.high .playground{filter:drop-shadow(0 0 16px #ffde9d55)}.game.win{--sky1:#101733;--sky2:#674777}.game.win .panda-arch{box-shadow:inset 0 0 0 2px #b7bbb5,0 9px 0 #90948f,0 0 50px #fff29b88}.shake{animation:shake .28s steps(3)}@keyframes shake{25%{transform:translateX(calc(-50% - 7px)) scale(.98)}75%{transform:tran <body>
<main id="game" class="game">
  <div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="building"></div><div class="farhouse"></div></div>
  <div class="ground"><div class="rubber"></div></div><div class="rails"></div>
  <div class="tree t1"><div class="trunk"></div><div class="crown"></div></div><div class="tree t2"><div class="trunk"></div><div class="crown"></div></div>
  <div id="playground" class="playground">
    <div class="tower-shadow"></div><div class="panda-arch"></div><div class="panda-body"></div><div class="panda-eye e1"></div><div class="panda-eye e2"></div><div class="panda-nose"></div><div class="panda-mouth"></div><div class="leaf-sign"></div>
    <div class="post p1"></div><div class="post p2"></div><div class="platform"></div><div class="slide"></div><div class="ladder"></div><div class="spinner-post"></div><div class="spinner"></div>
    <div id="runner" class="panda-runner"><i></i><b></b><em></em></div>
  </div>
  <div class="hud"><div class="hud-card floor"><div><small>HEIGHT</small><strong id="floor">0F</strong></div></div><div class="hud-card"><span id="hearts" class="hearts">♥♥♥</span><span id="timer" class="timer">60</span></div></div>
  <div class="progress"><i id="progressBar"></i></div>
  <div id="toast" class="toast">+3F</div>
  <div class="screen">
    <section id="intro" class="panel intro">
      <div class="eyebrow">THIS PLAYGROUND GROWS AFTER DARK</div>
      <h1>パンダ<span>タワー</span></h1>
      <p>夜になると、この遊具だけが上へ伸びる。<br><b>30Fの巨大パンダ</b>まで登れ。</p>
      <div class="route-demo"><div class="pink"><b>↙</b>すべる</div><div class="green"><b>↑</b>のぼる</div><div class="yellow"><b>↻</b>まわす</div></div>
      <button id="start" class="primary">登りはじめる <span>30F ↑</span></button>
    </section>
    <section id="choice" class="panel choice-panel hidden">
      <div class="choice-head"><b>どこから登る？</b><span>SWIPE OR TAP</span></div>
      <div class="routes">
        <button class="route slideBtn" data-route="slide"><span class="ico">↙</span><b>すべり台</b><small>+3F / TIMING</small></button>
        <button class="route ladderBtn" data-route="ladder"><span class="ico">↑</span><b>はしご</b><small>+2F / SAFE</small></button>
        <button class="route spinBtn" data-route="spin"><span class="ico">↻</span><b>ハンドル</b><small>+4F / RISK</small></button>
      </div>
    </section>
    <section id="mini" class="panel mini-panel hidden"></section>
    <section id="result" class="panel result hidden">
      <div id="resultBurst" class="burst">🐼</div><div class="eyebrow" id="resultKicker">TOWER COMPLETE</div>
      <h2 id="resultTitle">30F 到達！</h2><p id="resultText"></p>
      <button id="restart" class="primary">もう一度登る <span>↻</span></button>
    </section>
  </div>
</main>
<script>
(()=>{
  const $=s=>document.querySelector(s), game=$('#game'), playground=$('#playground'), runner=$('#runner'), intro=$('#intro'), choice=$('#choice'), mini=$('#mini'), result=$('#result'), floorEl=$('#floor'), heartsEl=$('#hearts'), timerEl=$('#timer'), toast=$('#toast');
  const TARGET=30, START_TIME=60; let floor=0, hearts=3, time=START_TIME, playing=false, phase='intro', timerId=null, best=Number(localStorage.getItem('pandaTowerBest')||0), activeCleanup=()=>{}, audio=null;
  const vibrate=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch{}};
  const tone=(freq=520,dur=.08,type='sine')=>{try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}};
  function show(el){[intro,choice,mini,result].forEach(x=>x.classList.add('hidden'));el.classList.remove('hidden')}
  function updateHud(){floorEl.textContent=floor+'F';heartsEl.textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);timerEl.textContent=String(time).padStart(2,'0');timerEl.classList.toggle('danger',time<=10);game.style.setProperty('--progress',Math.min(100,floor/TARGET*100));game.classList.toggle('night',floor>=10&&floor<20);game.classList.toggle('high',floor>=20&&floor<TARGET);game.classList.toggle('win',floor>=TARGET)}
  function start(){floor=0;hearts=3;time=START_TIME;playing=true;phase='choice';game.className='game';runner.style.left='151px';runner.style.top='319px';runner.style.transform='rotate(0)';updateHud();show(choice);clearInterval(timerId);timerId=setInterval(()=>{if(!playing)return;time--;updateHud();if(time<=0)finish(false,'TIME UP')},1000);tone(440,.07);setTimeout(()=>tone(660,.08),80)}
  function finish(win=false,reason='GAME OVER'){if(!playing&&phase==='result')return;playing=false;phase='result';clearInterval(timerId);activeCleanup();best=Math.max(best,floor);localStorage.setItem('pandaTowerBest',best);$('#resultBurst').textContent=win?'🐼':'💥';$('#resultKicker').textContent=win?'TOWER COMPLETE':reason;$('#resultTitle').textContent=win?'30F 到達！':floor+'F で落下';$('#resultText').innerHTML=win?`巨大パンダのてっぺんに到達。<br>残り <b>${time}秒</b> / BEST <b>${best}F</b>`:`あと <b>${Math.max(0,TARGET-floor)}F</b>。BEST <b>${best}F</b><br>ルートを変えると登り方も変わる。`;show(result);vibrate(win?[35,40,35,40,80]:[80,35,100]);tone(win?880:160,.18,win?'sine':'sawtooth')}
  function floatText(text){const e=document.createElement('div');e.className='float';e.textContent=text;game.appendChild(e);setTimeout(()=>e.remove(),760)}
  function flash(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),620)}
  function transitionRoute(route){const pos={slide:['76px','382px','rotate(18deg)'],ladder:['159px','397px','rotate(0)'],spin:['274px','402px','rotate(-15deg)']}[route];runner.style.left=pos[0];runner.style.top=pos[1];runner.style.transform=pos[2];playground.style.transform='translateX(-50%) scale(1.02) translateY(8px)';setTimeout(()=>playground.style.transform='',240)}
  function success(add,route){if(!playing)return;floor+=add;flash('+'+add+'F');floatText('+'+add+'F');tone(620+add*55,.09);vibrate(18);playground.animate([{transform:'translateX(-50%) translateY(0) scale(.98)'},{transform:'translateX(-50%) translateY(18px) scale(1.03)'},{transform:'translateX(-50%) translateY(0) scale(.98)'}],{duration:440,easing:'cubic-bezier(.2,.8,.2,1)'});runner.style.left='151px';runner.style.top='319px';runner.style.transform='rotate(0)';updateHud();if(floor>=TARGET){setTimeout(()=>finish(true),500)}else{phase='choice';setTimeout(()=>{if(playing&&phase==='choice')show(choice)},390)}}
  function fail(label='落ちた！'){if(!playing)return;hearts--;updateHud();flash(label);floatText('♥ -1');tone(170,.14,'sawtooth');vibrate([55,30,55]);playground.classList.add('shake');setTimeout(()=>playground.classList.remove('shake'),300);runner.style.left='151px';runner.style.top='319px';runner.style.transform='rotate(0)';if(hearts<=0){setTimeout(()=>finish(false,'3回落下'),450)}else{phase='choice';setTimeout(()=>{if(playing&&phase==='choice')show(choice)},450)}}
  function choose(route){if(!playing||phase!=='choice')return;phase=route;transitionRoute(route);setTimeout(()=>route==='slide'?slideMini():route==='ladder'?ladderMini():spinMini(),180)}
  function slideMini(){show(mini);mini.innerHTML=`<div class="mini-title">PINK SLIDE / +3F</div><div class="mini-copy">● が緑に入ったら TAP</div><div class="tap-track"><i class="good"></i><i id="marker" class="marker"></i></div><button id="slideTap" class="tap-big">TAP!</button>`;let startTime=performance.now(),raf=0,done=false;const marker=$('#marker');function frame(now){if(done)return;const t=(now-startTime)/1000, x=(Math.sin(t*4.5-Math.PI/2)+1)/2;marker.style.left=(x*100)+'%';raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame);const end=(ok)=>{if(done)return;done=true;cancelAnimationFrame(raf);ok?success(3,'slide'):fail('タイミング失敗')};const tap=()=>{const x=parseFloat(marker.style.left||'0')/100;end(x>=.38&&x<=.62)};$('#slideTap').addEventListener('pointerdown',tap,{once:true});const timeout=setTimeout(()=>end(false),4200);activeCleanup=()=>{done=true;cancelAnimationFrame(raf);clearTimeout(timeout)}}
  function ladderMini(){show(mini);mini.innerHTML=`<div class="mini-title">GREEN LADDER / +2F</div><div class="mini-copy">上へ 3回スワイプ</div><div class="ladder-mini"><i class="rung"></i><i class="rung"></i><i class="rung"></i><i class="rung"></i></div><div class="swipe-up">↑ SWIPE UP ↑</div>`;let count=0,sy=0,done=false;const rungs=[...mini.querySelectorAll('.rung')];const pd=e=>{sy=e.clientY};const pu=e=>{if(done)return;if(sy-e.clientY>32){count++;rungs[Math.min(count-1,rungs.length-1)].classList.add('on');tone(360+count*80,.055);vibrate(9);if(count>=3)end(true)}};mini.addEventListener('pointerdown',pd);mini.addEventListener('pointerup',pu);const end=ok=>{if(done)return;done=true;mini.removeEventListener('pointerdown',pd);mini.removeEventListener('pointerup',pu);clearTimeout(timeout);ok?success(2,'ladder'):fail('登りきれない')};const timeout=setTimeout(()=>end(false),4300);activeCleanup=()=>{done=true;clearTimeout(timeout);mini.removeEventListener('pointerdown',pd);mini.removeEventListener('pointerup',pu)}}
  function spinMini(){show(mini);mini.innerHTML=`<div class="mini-title">YELLOW HANDLE / +4F</div><div class="mini-copy">ぐるぐる 1.5周まわせ</div><div id="wheelWrap" class="wheel-wrap" style="--spin:0"><div class="wheel-progress"></div><div id="wheel" class="wheel"></div><div class="wheel-dot"></div></div>`;const wrap=$('#wheelWrap'),wheel=$('#wheel');let last=null,total=0,drag=false,done=false;const need=Math.PI*3;function ang(e){const r=wrap.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))}const pd=e=>{drag=true;last=ang(e);try{wrap.setPointerCapture(e.pointerId)}catch{}};const pm=e=>{if(!drag||done)return;const a=ang(e);let d=a-last;if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;total+=Math.abs(d);last=a;const p=Math.min(1,total/need);wrap.style.setProperty('--spin',p);wheel.style.transform=`rotate(${total*57.2958}deg)`;if(total>=need)end(true)};const pu=()=>drag=false;wrap.addEventListener('pointerdown',pd);wrap.addEventListener('pointermove',pm);wrap.addEventListener('pointerup',pu);wrap.addEventListener('pointercancel',pu);const end=ok=>{if(done)return;done=true;clearTimeout(timeout);wrap.removeEventListener('pointerdown',pd);wrap.removeEventListener('pointermove',pm);wrap.removeEventListener('pointerup',pu);ok?success(4,'spin'):fail('回転不足')};const timeout=setTimeout(()=>end(false),4700);activeCleanup=()=>{done=true;clearTimeout(timeout)}}
  $('#start').addEventListener('click',start);$('#restart').addEventListener('click',start);document.querySelectorAll('.route').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.route)));
  let sx=0,sy=0;game.addEventListener('pointerdown',e=>{if(phase==='choice'){sx=e.clientX;sy=e.clientY}});game.addEventListener('pointerup',e=>{if(phase!=='choice')return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<42)return;if(Math.abs(dx)>Math.abs(dy))choose(dx<0?'slide':'spin');else if(dy<0)choose('ladder')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)finish(false,'PAUSED')});updateHud();
})();
</script>
</body>
