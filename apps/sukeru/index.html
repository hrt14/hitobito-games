<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#090b0f" />
  <meta name="description" content="画面をひたすらこすると、背面カメラの向こう側が少しずつ見えてくる。" />
  <title>すける。</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./camera-fix.css" />
</head>
<body>
  <main id="app" class="app is-boot">
    <video id="camera" class="camera" autoplay muted playsinline aria-label="背面カメラ映像"></video>
    <div id="veil" class="veil" aria-hidden="true"></div>
    <canvas id="scratch" class="scratch" aria-label="画面をこすって透明にする"></canvas>
    <div class="glass-noise" aria-hidden="true"></div>

    <header id="hud" class="hud" aria-hidden="true">
      <a class="home" href="/" aria-label="hitobito PLAYへ戻る">HITO</a>
      <div class="meter" aria-live="polite">
        <span class="meter-label">透け</span>
        <strong id="percent">0%</strong>
      </div>
      <button id="reset" class="reset" type="button">曇らせる</button>
    </header>

    <section id="boot" class="boot" aria-labelledby="title">
      <div class="boot-copy">
        <p class="eyebrow">CAMERA EXPERIMENT</p>
        <h1 id="title">すける。</h1>
        <p class="lead">画面をひたすらこすると、<br />スマホの向こう側が見えてくる。</p>
        <button id="start" class="start" type="button">
          <span>カメラを起動</span><b>→</b>
        </button>
        <p class="privacy">初回だけカメラの許可が出ます。映像は録画・送信しません。</p>
      </div>
    </section>

    <div id="rubHint" class="rub-hint" hidden aria-hidden="true">
      <span class="finger">●</span>
      <span>こする</span>
    </div>

    <section id="done" class="done" hidden aria-live="polite">
      <p>向こう側。</p>
    </section>

    <section id="errorPanel" class="error-panel" hidden role="alert">
      <div class="error-card">
        <p class="eyebrow">CAMERA PERMISSION</p>
        <h2>カメラの許可が必要です</h2>
        <p id="errorMessage">「許可」を選んだあと、下のボタンを押してください。</p>
        <button id="retry" class="retry" type="button">許可したらもう一度</button>
      </div>
    </section>
  </main>

  <script src="./game.js"></script>
  <script src="./camera-fix.js"></script>
  <script src="./camera-launch-fix.js"></script>
</body>
</html>
