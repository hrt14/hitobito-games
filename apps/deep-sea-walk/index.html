:block}.overlay{position:fixed;inset:0;z-index:10;display:none;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));overflow:auto;background:rgba(1,9,14,.92);backdrop-filter:blur(14px)}.overlay.show{display:block}.panel{max-width:620px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.head h2{font-size:30px;margin:0}.close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#0a2029}.mapbox{margin-top:15px;aspect-ratio:1;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#03151f}.mapbox canvas{width:100%;height:100%;display:block}.note{font-size:11px;line-height:1.6;color:#98bbc8}.log{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.log div{min-height:90px;padding:12px;border:1px solid var(--line);border-radius:17px;background:#071b24}.log .unknown{opacity:.42}.log b{display:block;font-size:13px}.log span{display:block;font-size:10px;line-height:1.5;color:#91b6c3;margin-top:5px}.start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 16%,#0b4052 0,#05232f 34%,#020b10 74%)}.start article{width:min(520px,100%);text-align:center}.eyebrow{font-size:10px;letter-spacing:.2em;color:#88eaff;font-weight:900}.start h1{font-size:clamp(48px,13vw,74px);line-height:.9;letter-spacing:-.06em;margin:15px 0 12px}.start p{color:#9fc2cf;font-size:13px;line-height:1.7}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0 17px}.rules div{padding:11px 6px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.03)}.rules b{display:block;font-size:18px}.rules span{display:block;color:#9cc5d3;font-size:8px;margin-top:5px}.startBtn{width:100%;border:0;border-radius:18px;padding:15px;background:#c8f6ff;color:#06202a;font-size:16px;font-weight:950}@media(max-width:520px){.brand small{display:none}.log{grid-template-columns:1fr}.move,.sonar{he <body>
<canvas id="game"></canvas><div class="vignette"></div>

<section class="overlay" id="logOverlay"><div class="panel"><div class="head"><h2>発見記録 <small id="logCount"></small></h2><button class="close" data-close="logOverlay">×</button></div><div class="log" id="logGrid"></div></div></section>
<section class="start" id="startScreen"><article><div class="eyebrow">HITOBITO GAMES / OCEAN EXPLORATION</div><h1>深海を<br>ただ散歩する</h1><p>潜水艇で、地図にない海へ。敵も制限時間もありません。ソナーの「何かいる」を追うだけです。</p><div class="rules"><div><b>↑</b><span>押して進む</span></div><div><b>↔</b><span>海をドラッグして旋回</span></div><div><b>◎</b><span>ソナーで探す</span></div></div><button class="startBtn" id="startBtn">海へ潜る</button></article></section>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),X=C.getContext('2d'),M=document.getElementById('mapCanvas'),MX=M.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const WORLD=3200,GRID=16,CELL=WORLD/GRID,key='hitobito-deep-sea-walk-v1';

let S=load(),W=0,H=0,D=1,last=performance.now(),started=false,drag=false,dragX=0,go=false,dive=0,sonarT=0,hintTimer=0,discTimer=0,slowHintAt=0,audio=null;
const P=[
{id:'p1',name:'硝子クラゲの回廊',type:'生物',x:1750,z:1430,d:105,r:145,c:'#8ff1ff',k:'jelly',desc:'半透明の群れが潮の筋に沿って流れている。艇の光を消すと輪郭だけが青く残る。'},
{id:'p2',name:'沈んだ観測塔',type:'人工物',x:2260,z:1620,d:190,r:120,c:'#b8c9d0',k:'tower',desc:'海底に斜めに刺さった古い観測塔。窓の内側には細い砂が積もっている。'},
{id:'p3',name:'泡の森',type:'地形',x:2380,z:2280,d:330,r:165,c:'#ffe39a',k:'vent',desc:'海底の割れ目から細かな気泡が立ち上る。近づくと視界が一瞬だけ銀色になる。'},
{id:'p4',name:'眠る大翼',type:'巨大生物',x:1430,z:2570,d:420,r:210,c:'#c6b6ff',k:'ray',desc:'岩盤だと思っていた影が、ゆっくり一度だけ羽ばたいた。どこへ行くのかは分からない。'},
{id:'p5',name:'石の環',type:'遺構',x:820,z:2250,d:270,r:145,c:'#d7c6a4',k:'stones',desc:'自然には見えない間隔で並ぶ石柱。中央だけ砂が不自然に平らだ。'},
{id:'p6',name:'音の谷',type:'地形',x:610,z:1460,d:360,r:185,c:'#9ee7b8',k:'canyon',desc:'ソナー音が一拍遅れて返る峡谷。反響のたび、奥の魚群が同時に向きを変える。'},
{id:'p7',name:'白い背の影',type:'未知生物',x:1180,z:700,d:520,r:250,c:'#e9f7ff',k:'lev',desc:'視界の端から端まで続くほど大きい白い背。こちらを気にせず、暗い海へ消えた。'},
{id:'p8',name:'星砂の斜面',type:'地形',x:2560,z:820,d:235,r:170,c:'#fff2bf',k:'stars',desc:'砂粒の一部だけが光を返す斜面。角度で星空のように見えたり、何も見えなくなったりする。'},
{id:'r1',name:'空の漁礁 A',type:'漁礁',x:1780,z:2050,d:165,r:110,c:'#ff947f',k:'reef',desc:'何もいなかった砂地。ブロックを重ねると、小魚が少しずつ戻ってくる。'},
{id:'r2',name:'空の漁礁 B',type:'漁礁',x:980,z:1780,d:230,r:110,c:'#ff947f',k:'reef',desc:'流れの弱いくぼ地。形を作ると、生き物の休む場所になりそうだ。'},
{id:'r3',name:'空の漁礁 C',type:'漁礁',x:2100,z:960,d:125,r:110,c:'#ff947f',k:'reef',desc:'浅場と深場の境目。漁礁を育てると、両方の魚が立ち寄る。'},
{id:'p9',name:'逆さの雨',type:'現象',x:430,z:520,d:445,r:170,c:'#a6e9ff',k:'snow',desc:'海底から水面へ向かって白い粒が昇っていく。雪のようだが、触れる前に消える。'}];
let seed=74109;const rnd=()=>((seed=Math.imul(1664525,seed)+1013904223>>>0)/4294967296);const F=Array.from({length:84},()=>({x:160+rnd()*(WORLD-320),z:160+rnd()*(WORLD-320),d:50+rnd()*480,s:8+rnd()*15,p:rnd()*TAU,v:.13+rnd()*.28,t:rnd()}));const dust=Array.from({length:110},()=>({x:rnd(),y:rnd(),s:.4+rnd()*1.6,a:.1+rnd()*.35}));
function load(){try{return {...base,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{return {...base}}}function save(){try{localStorage.setItem(key,JSON.stringify({...S,visited:[...new Set(S.visited)].slice(-360)}))}catch{}}function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}function norm(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a}
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;X.setTransform(D,0,0,D,0,0);const s=Math.min(620,W-32);M.width=s*D;M.height=s*D;MX.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function tone(f=620){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,audio.currentTime+.55);g.gain.setValueAtTime(.001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.14,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.62);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.65)}function initAudio(){if(audio)return;audio=new (AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=51;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start()}
function zone(){return S.depth<120?'光の届く海':S.depth<220?'青の中層':S.depth<340?'薄明の斜面':S.depth<470?'深い谷':'無光帯'}function head(){const d=((S.heading*180/Math.PI)%360+360)%360,n=['N','NE','E','SE','S','SW','W','NW'];return `${n[Math.round(d/45)%8]} ${String(Math.round(d)).padStart(3,'0')}°`}function coverage(){return Math.round(new Set(S.visited).size/(GRID*GRID)*100)}
function hint(t,ms=2800){$('hint').innerHTML=t;$('hint').classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>$('hint').classList.remove('show'),ms)}function discover(p){if(S.discovered[p.id])return;S.discovered[p.id]=Date.now();save();$('discName').textContent=p.name;$('discDesc').textContent=p.desc;$('discovery').classList.add('show');clearTimeout(discTimer);discTimer=setTimeout(()=>$('discovery').classList.remove('show'),4300);tone(p.k==='lev'?250:760);navigator.vibrate?.(12);renderLog()}
function nearest(){let b=null;for(const p of P){const d=dist(S,p),dd=Math.abs(S.depth-p.d)*1.35,score=Math.hypot(d,dd);if(!b||score<b.score)b={p,d,dd,score}}return b}function nearReef(){return P.filter(p=>p.k==='reef').map(p=>({p,d:dist(S,p),dd:Math.abs(S.depth-p.d)})).filter(v=>v.d<125&&v.dd<90).sort((a,b)=>a.d-b.d)[0]||null}
function sonar(){if(!started)return;initAudio();tone();S.sonars++;sonarT=1.2;$('sonarBtn').classList.remove('pulse');void $('sonarBtn').offsetWidth;$('sonarBtn').classList.add('pulse');const hits=P.map(p=>({p,d:dist(S,p),dd:Math.abs(S.depth-p.d)})).filter(v=>v.d<700&&v.dd<250).sort((a,b)=>a.d-b.d);if(hits.length){const h=hits[0],a=norm(Math.atan2(h.p.x-S.x,h.p.z-S.z)-S.heading),dir=Math.abs(a)<.2?'正面':a>0?'右':'左';hint(`反応 <strong>${hits.length}</strong>。いちばん近いものは <strong>${dir} ${Math.round(h.d)}m</strong>`)}else hint('大きな反応なし。<strong>潜るか、別方向へ。</strong>');save()}
function build(){const n=nearReef();if(!n)return;const id=n.p.id,lv=S.reefs[id]||0;if(lv>=3){hint('完成した漁礁。魚影が周囲を回っている。');return}S.reefs[id]=lv+1;S.discovered[id]=S.discovered[id]||Date.now();save();tone(420+lv*120);hint(lv<2?'漁礁を1段追加。<strong>魚影が増えた。</strong>':'漁礁が完成。<strong>この海域の景色が変わった。</strong>',3500);renderLog()}
function update(dt){if(!started)return;S.speed=clamp(S.speed+(go?190:-86)*dt,0,150);if(!go)S.speed*=Math.pow(.985,dt*60);S.depth=clamp(S.depth+dive*78*dt,35,560);S.x=clamp(S.x+Math.sin(S.heading)*S.speed*dt,70,WORLD-70);S.z=clamp(S.z+Math.cos(S.heading)*S.speed*dt,70,WORLD-70);const cell=clamp(Math.floor(S.z/CELL),0,GRID-1)*GRID+clamp(Math.floor(S.x/CELL),0,GRID-1);if(S.visited.at(-1)!==cell)S.visited.push(cell);for(const f of F){f.p+=f.v*dt;f.x+=Math.cos(f.p)*2*dt;f.z+=Math.sin(f.p*.9)*2*dt}for(const p of P)if(!S.discovered[p.id]&&dist(S,p)<p.r&&Math.abs(S.depth-p.d)<110){if(p.k!=='reef'&&S.speed>82){if(performance.now()-slowHintAt>5000){slowHintAt=performance.now();hint('反応がすぐ近い。<strong>↑を離して速度を落とす</strong>と観察できます。')}}else discover(p)}sonarT=Math.max(0,sonarT-dt);const r=nearReef();$('contextBtn').classList.toggle('show',!!r);if(r)$('contextBtn').textContent=(S.reefs[r.p.id]||0)>=3?'完成した漁礁を観察':'漁礁ブロックを置く';$('heading').textContent=head();$('zone').textContent=zone();$('depth').textContent=Math.round(S.depth)+'m';const n=nearest();$('signal').textContent=sonarT>0&&n.score<760?`反応 ${Math.round(n.d)}m`:S.speed>12?`${Math.round(S.speed)} kn · 海図 ${coverage()}%`:'ソナー待機中'}
function project(x,z,d){const dx=x-S.x,dz=z-S.z,si=Math.sin(S.heading),co=Math.cos(S.heading),side=dx*co-dz*si,fwd=dx*si+dz*co;if(fwd<20)return null;const sc=W*.92/fwd,px=W/2+side*sc,py=H*.5+(d-S.depth)*sc*.68;return{px,py,fwd,sc}}
function fish(f,t){const p=project(f.x,f.z,f.d);if(!p||p.px<-60||p.px>W+60||p.py<-60||p.py>H+80||p.fwd>1000)return;let boost=0;for(const r of P.filter(x=>x.k==='reef'))if((S.reefs[r.id]||0)&&Math.hypot(f.x-r.x,f.z-r.z)<340)boost+=(S.reefs[r.id]||0)*.12;if(f.t>.63+boost)return;const s=clamp(f.s*p.sc*1.3,1.2,30);X.save();X.translate(p.px,p.py+Math.sin(t*.0015+f.p)*3);X.scale(s/18,s/18);X.globalAlpha=clamp(1-p.fwd/1050,.08,.72);X.fillStyle=f.t>.48?'#8ed2d4':'#668f9c';X.beginPath();X.ellipse(0,0,12,5,0,0,TAU);X.fill();X.beginPath();X.moveTo(-11,0);X.lineTo(-18,-6);X.lineTo(-18,6);X.closePath();X.fill();X.restore()}
function poi(p,t){const q=project(p.x,p.z,p.d);if(!q||q.px<-W*.25||q.px>W*1.25||q.py<-H*.3||q.py>H*1.1||q.fwd>1300)return;const s=clamp(q.sc,.13,2.2),a=clamp(1-q.fwd/1400,.08,.9);X.save();X.translate(q.px,q.py);X.globalAlpha=a;if(p.k==='jelly'){for(let i=0;i<10;i++){const A=i*.8+t*.00025,R=(18+i*5)*s;X.fillStyle='rgba(143,241,255,.34)';X.beginPath();X.arc(Math.cos(A)*R,Math.sin(A*1.1)*R*.45,clamp(6*s,2,14),0,TAU);X.fill()}}else if(p.k==='tower'){X.rotate(-.12);X.fillStyle='#536c72';X.fillRect(-20*s,-80*s,40*s,100*s);X.fillStyle='#9ab3b8';for(let i=0;i<4;i++)X.fillRect(-12*s,(-64+i*20)*s,24*s,7*s)}else if(p.k==='vent'){for(let i=-2;i<=2;i++){X.fillStyle='#4b3f34';X.fillRect((i*20-7)*s,-45*s,14*s,60*s);X.fillStyle='rgba(225,240,226,.16)';for(let j=0;j<4;j++){X.beginPath();X.arc(i*20*s+Math.sin(t*.001+j)*7*s,(-65-j*20-(t*.02)%24)*s,7*s,0,TAU);X.fill()}}}else if(p.k==='ray'){X.fillStyle='rgba(66,78,88,.82)';X.beginPath();X.moveTo(0,-8*s);X.quadraticCurveTo(-110*s,-40*s-Math.sin(t*.001)*9*s,-155*s,8*s);X.quadraticCurveTo(-70*s,25*s,0,15*s);X.quadraticCurveTo(70*s,25*s,155*s,8*s);X.quadraticCurveTo(110*s,-40*s-Math.sin(t*.001)*9*s,0,-8*s);X.fill()}else if(p.k==='lev'){X.fillStyle='rgba(205,224,231,.25)';X.beginPath();X.ellipse(0,0,270*s,43*s,.03,0,TAU);X.fill();X.beginPath();X.moveTo(-250*s,0);X.lineTo(-340*s,-68*s);X.lineTo(-330*s,60*s);X.closePath();X.fill()}else if(p.k==='stones'){X.fillStyle='#716a60';for(let i=0;i<7;i++){const A=i/7*TAU;X.fillRect((Math.cos(A)*70-6)*s,(Math.sin(A)*20-38)*s,12*s,66*s)}}else if(p.k==='canyon'){X.fillStyle='#122b31';X.beginPath();X.moveTo(-180*s,-70*s);X.lineTo(-80*s,40*s);X.lineTo(-25*s,-20*s);X.lineTo(20*s,45*s);X.lineTo(90*s,-8*s);X.lineTo(180*s,-70*s);X.lineTo(180*s,80*s);X.lineTo(-180*s,80*s);X.closePath();X.fill()}else if(p.k==='stars'){X.fillStyle='rgba(255,241,181,.56)';for(let i=0;i<30;i++){const A=i*2.37,R=(i%7)*15*s;X.fillRect(Math.cos(A)*R,Math.sin(A*1.5)*R*.4,clamp(2*s,1,4),clamp(2*s,1,4))}}else if(p.k==='reef'){const lv=S.reefs[p.id]||0;X.fillStyle='#59483d';X.fillRect(-42*s,8*s,84*s,12*s);for(let i=0;i<lv*5;i++){X.fillStyle=i%2?'#b85e56':'#d68c6b';X.fillRect((-36+(i%5)*18)*s,(2-Math.floor(i/5)*18)*s,13*s,14*s)}}else if(p.k==='snow'){X.fillStyle='rgba(205,241,255,.48)';for(let i=0;i<26;i++){X.fillRect(((i*43)%180-90)*s,((i*29+t*.025)%170-100)*s,2*s,5*s)}}X.restore();if(sonarT>0&&q.fwd<720){X.save();X.globalAlpha=sonarT/2;X.strokeStyle=p.c;X.beginPath();X.arc(q.px,q.py,20+58*(1-sonarT/1.2),0,TAU);X.stroke();X.restore()}}
function background(t){const deep=clamp((S.depth-35)/525,0,1),g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(3,${Math.round(44-29*deep)},${Math.round(61-41*deep)})`);g.addColorStop(.56,`rgb(3,${Math.round(25-15*deep)},${Math.round(36-20*deep)})`);g.addColorStop(1,'#02090d');X.fillStyle=g;X.fillRect(0,0,W,H);const y=H*(.68-clamp((S.depth-80)/900,-.03,.12));X.fillStyle=S.depth>370?'#071216':'#0a2024';X.beginPath();X.moveTo(0,y);for(let x=0;x<=W;x+=W/9)X.lineTo(x,y+Math.sin(x*.016+S.x*.003)*18+Math.cos(x*.008+S.z*.003)*13);X.lineTo(W,H);X.lineTo(0,H);X.fill();X.fillStyle='rgba(120,190,200,.12)';for(const d of dust){d.y+=.00003*(1+S.speed/90);if(d.y>1)d.y=0;X.globalAlpha=d.a;X.beginPath();X.arc(d.x*W,d.y*H,d.s,0,TAU);X.fill()}X.globalAlpha=1;const b=X.createRadialGradient(W/2,H*.48,0,W/2,H*.48,Math.min(W,H)*.52);b.addColorStop(0,'rgba(130,226,244,.07)');b.addColorStop(1,'rgba(130,226,244,0)');X.fillStyle=b;X.fillRect(0,0,W,H)}
function frame(t){const dt=Math.min(.035,(t-last)/1000);last=t;update(dt);background(t);[...P].sort((a,b)=>dist(S,b)-dist(S,a)).forEach(p=>poi(p,t));F.forEach(f=>fish(f,t));requestAnimationFrame(frame)}requestAnimationFrame(frame);
function map(){const s=M.width/D;MX.clearRect(0,0,s,s);MX.fillStyle='#03151f';MX.fillRect(0,0,s,s);const seen=new Set(S.visited);for(let z=0;z<GRID;z++)for(let x=0;x<GRID;x++)if(seen.has(z*GRID+x)){MX.fillStyle='rgba(67,153,177,.23)';MX.fillRect(x/GRID*s,z/GRID*s,s/GRID+1,s/GRID+1)}for(const p of P)if(S.discovered[p.id]){MX.fillStyle=p.c;MX.beginPath();MX.arc(p.x/WORLD*s,p.z/WORLD*s,5,0,TAU);MX.fill()}MX.save();MX.translate(S.x/WORLD*s,S.z/WORLD*s);MX.rotate(-S.heading);MX.fillStyle='#fff';MX.beginPath();MX.moveTo(0,-9);MX.lineTo(6,7);MX.lineTo(-6,7);MX.closePath();MX.fill();MX.restore()}
function renderLog(){const n=Object.keys(S.discovered).length;$('logCount').textContent=`${n}/${P.length}`;$('logGrid').innerHTML=P.map(p=>S.discovered[p.id]?`<div><b>${p.name}</b><span>${p.type} · ${p.desc.slice(0,48)}…${p.k==='reef'?` 漁礁 ${S.reefs[p.id]||0}/3`:''}</span></div>`:`<div class="unknown"><b>未発見</b><span>ソナーの反応を追って見つける</span></div>`).join('')}
function open(id){$(id).classList.add('show');if(id==='mapOverlay')map();else renderLog()}function start(){started=true;$('startScreen').style.display='none';initAudio();hint('まずは <strong>↑ を押して進む</strong>。海を左右へドラッグすると旋回できます。',4200);save()}
$('startBtn').onclick=start;$('sonarBtn').onclick=sonar;$('mapBtn').onclick=()=>open('mapOverlay');$('logBtn').onclick=()=>open('logOverlay');$('contextBtn').onclick=build;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));
function hold(el,on,off){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);on();el.classList.add('active')});['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,()=>{off();el.classList.remove('active')}))}hold($('moveBtn'),()=>go=true,()=>go=false);hold($('upBtn'),()=>dive=-1,()=>dive=0);hold($('downBtn'),()=>dive=1,()=>dive=0);C.addEventListener('pointerdown',e=>{if(started){drag=true;dragX=e.clientX;C.setPointerCapture?.(e.pointerId)}});C.addEventListener('pointermove',e=>{if(drag){S.heading=norm(S.heading+(e.clientX-dragX)*.006);dragX=e.clientX}});C.addEventListener('pointerup',()=>{drag=false;save()});C.addEventListener('pointercancel',()=>drag=false);addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='w')go=true;if(e.key==='ArrowLeft'||e.key==='a')S.heading-=.08;if(e.key==='ArrowRight'||e.key==='d')S.heading+=.08;if(e.key==='q')dive=-1;if(e.key==='e')dive=1;if(e.key===' '){e.preventDefault();sonar()}});addEventListener('keyup',e=>{if(e.key==='ArrowUp'||e.key==='w')go=false;if(e.key==='q'||e.key==='e')dive=0});renderLog();$('heading').textContent=head();$('zone').textContent=zone();$('depth').textContent=S.depth+'m';
})();
</script>
