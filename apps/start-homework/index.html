<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<meta name="description" content="やらなきゃいけないのに始められない。大きな宿題を、今できる最小の一手まで小さくする着手力トレーニングゲーム。">
<title>START — 3分だけやる。</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d1118;--text:#f5f7fb;--muted:#8d97a8;--line:rgba(255,255,255,.11);--accent:#d8ff5b;--blue:#6aa7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 70% -10%,rgba(143,255,188,.08),transparent 31%),linear-gradient(180deg,#090c12,#06080b 72%)}button,input{font:inherit}button{cursor:pointer}.app{width:min(520px,100%);min-height:100dvh;margin:auto;position:relative;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:44px}.brand{display:flex;align-items:center;gap:10px}.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px rgba(216,255,91,.75)}.brand strong{font-size:12px;letter-spacing:.16em}.brand small{display:block;color:#697487;font-size:8px;letter-spacing:.18em;margin-top:2px}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.025);color:#aeb6c3;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800}.screen{animation:in .32s ease both}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.hero{padding:34px 0 24px}.eyebrow{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:.17em;margin-bottom:13px}.hero h1{margin:0;font-size:clamp(45px,13vw,68px);line-height:.89;letter-spacing:-.065em}.hero p{margin:17px 0 0;color:#a7b0bf;line-height:1.75;font-size:14px;max-width:430px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,rgba(20,27,39,.88),rgba(9,13,19,.92));border-radius:26px;padding:18px;box-shadow:0 26px 70px rgba(0,0,0,.22)}.label{font-size:9px;font-weight:900;letter-spacing:.16em;color:#788397;text-transform:uppercase;margin-bottom:9px}.task-input{width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.16);background:transparent;color:white;padding:8px 0 12px;font-size:21px;font-weight:800;outline:none}.task-input::placeholder{color:#4f5867}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{border:1px solid var(--line);background:rgba(255,255,255,.035);color:#bdc4cf;border-radius:999px;padding:9px 12px;font-size:11px;font-weight:750}.chip:active{background:var(--accent);border-color:var(--accent);color:#0c1008}.primary{width:100%;border:0;background:var(--accent);color:#0b0e08;font-weight:950;border-radius:18px;padding:17px 18px;font-size:15px;margin-top:17px;box-shadow:0 14px 35px rgba(216,255,91,.12)}.primary:active{transform:scale(.985)}.primary[disabled]{opacity:.35}.secondary{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.025);color:#c9cfd8;font-weight:800;border-radius:18px;padding:15px 18px;font-size:13px;margin-top:9px}.mini-note{margin-top:12px;color:#697487;font-size:10px;line-height:1.6;text-align:center}.blocker-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.blocker{min-height:116px;border:1px solid var(--line);background:linear-gradient(145deg,#111722,#090d13);color:white;border-radius:21px;padding:14px;text-align:left;position:relative;overflow:hidden}.blocker:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-30px;top:-30px;background:var(--glow,rgba(216,255,91,.08))}.blocker b{display:block;font-size:15px;margin-top:22px}.blocker small{display:block;margin-top:7px;color:#717d8f;font-size:9px;line-height:1.45}.sigil{font-size:18px}.stage-head{padding:26px 0 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:18px}.stage-head h2{margin:0;font-size:25px;letter-spacing:-.035em}.stage-head p{margin:7px 0 0;color:#747f91;font-size:11px}.step-no{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:.16em;white-space:nowrap}.arena{position:relative;min-height:282px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 43%,rgba(106,167,255,.09),transparent 47%),linear-gradient(180deg,#0d131d,#090d13)}.gridbg{position:absolute;inset:0;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:29px 29px;mask-image:linear-gradient(to bottom,black,transparent)}.monster{position:absolute;left:50%;top:44%;width:var(--size,190px);height:var(--size,190px);transform:translate(-50%,-50%);border-radius:34% 42% 38% 45%;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.17),transparent 16%),linear-gradient(145deg,#293241,#131923 65%);box-shadow:inset -22px -28px 48px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.38);transition:width .55s cubic-bezier(.2,.8,.2,1),height .55s cubic-bezier(.2,.8,.2,1);animation:float 3.5s ease-in-out infinite}.monster:after{content:"";position:absolute;left:26%;right:26%;bottom:25%;height:2px;background:rgba(255,255,255,.25)}.monster-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:950;letter-spacing:.16em;color:#aab3c0;line-height:1.5}.monster-label span{display:block;color:#596477;font-size:8px;margin-top:5px}.eye{position:absolute;top:35%;width:7px;height:7px;background:#dbe1e9;border-radius:50%}.eye.e1{left:38%}.eye.e2{right:38%}@keyframes float{50%{transform:translate(-50%,-54%) rotate(1.5deg)}}.arena-caption{position:absolute;left:16px;right:16px;bottom:14px;text-align:center;color:#667285;font-size:9px;letter-spacing:.1em}.mission{margin-top:12px;border:1px solid rgba(216,255,91,.18);background:linear-gradient(145deg,rgba(216,255,91,.07),rgba(216,255,91,.015));border-radius:24px;padding:18px}.mission .tiny{font-size:9px;color:var(--accent);font-weight:950;letter-spacing:.17em}.mission h3{font-size:24px;line-height:1.32;letter-spacing:-.035em;margin:10px 0 7px}.mission p{margin:0;color:#8792a3;font-size:11px;line-height:1.6}.progress{display:flex;gap:5px;margin:14px 0 0}.progress i{height:3px;flex:1;border-radius:5px;background:#212936}.progress i.on{background:var(--accent);box-shadow:0 0 10px rgba(216,255,91,.3)}.start-burst{padding:50px 0 18px;text-align:center}.start-word{font-size:clamp(70px,22vw,110px);font-weight:1000;letter-spacing:-.08em;line-height:.8;color:var(--accent);text-shadow:0 0 45px rgba(216,255,91,.15);animation:pop .45s cubic-bezier(.2,1.5,.3,1) both}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}.start-burst h2{margin:28px 0 7px;font-size:27px}.start-burst p{margin:0;color:#8792a3;font-size:13px;line-height:1.65}.timer-wrap{text-align:center;padding:28px 0}.timer-ring{width:220px;height:220px;border-radius:50%;margin:20px auto 28px;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) var(--deg,0deg),#171e28 0)}.timer-ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#090d13;border:1px solid rgba(255,255,255,.07)}.timer-num{position:relative;z-index:2;font-size:56px;font-weight:950;letter-spacing:-.05em}.timer-num small{display:block;font-size:9px;color:#687386;letter-spacing:.18em;margin-top:7px}.timer-wrap h2{font-size:26px;margin:0}.timer-wrap p{font-size:12px;color:#778396;line-height:1.65}.done-box{text-align:center;padding:44px 6px 20px}.done-icon{width:78px;height:78px;border-radius:26px;margin:0 auto 20px;display:grid;place-items:center;background:var(--accent);color:#0b0f08;font-size:35px;font-weight:950}.done-box h2{font-size:29px;letter-spacing:-.04em;margin:0}.done-box p{color:#8490a2;line-height:1.7;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.stat{border:1px solid var(--line);border-radius:18px;background:#0b1017;padding:14px 9px;text-align:center}.stat strong{display:block;font-size:25px}.stat span{display:block;color:#657083;font-size:8px;letter-spacing:.1em;margin-top:4px}.history{display:grid;gap:8px;margin-top:12px}.history-row{border:1px solid var(--line);border-radius:17px;padding:13px 14px;background:#0b1017;display:flex;justify-content:space-between;gap:12px;align-items:center}.history-row b{font-size:12px}.history-row small{display:block;color:#687386;font-size:9px;margin-top:4px}.history-row em{font-style:normal;font-size:9px;color:var(--accent);font-weight:900}.empty{padding:34px 8px;text-align:center;color:#667285;font-size:12px;line-height:1.7}.bottom{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#07090d 72%,rgba(7,9,13,.85),transparent);display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav{border:1px solid var(--line);background:rgba(14,19,27,.94);color:#727d8f;border-radius:16px;padding:10px 6px 9px;font-size:9px;font-weight:850}.nav b{display:block;font-size:16px;line-height:1;margin-bottom:5px}.nav.on{color:#0c1008;background:var(--accent);border-color:var(--accent)}.resume{margin-top:18px;border:1px solid rgba(106,167,255,.24);border-radius:21px;padding:15px;background:linear-gradient(145deg,rgba(106,167,255,.09),rgba(106,167,255,.02));display:flex;justify-content:space-between;align-items:center;gap:10px}.resume b{font-size:12px}.resume small{display:block;color:#71809a;font-size:9px;margin-top:5px}.resume button{border:0;background:#e9eff8;color:#0a0d12;font-weight:900;border-radius:999px;padding:10px 13px;font-size:10px}.quote{margin:26px 0 0;border-left:2px solid var(--accent);padding:2px 0 2px 14px;color:#939dab;font-size:12px;line-height:1.7}.reduced{color:#697487;font-size:10px;text-align:center;margin:14px 0}@media(max-width:370px){.app{padding-left:12px;padding-right:12px}.hero{padding-top:24px}.blocker-grid{grid-template-columns:1fr}.arena{min-height:250px}.monster{--size:165px}.mission h3{font-size:21px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand"><span class="brand-dot"></span><div><strong>START</strong><small>LEVEL UP / 着手力</small></div></div><button class="ghost" id="resetBtn" type="button">記録をリセット</button></header><main id="main"></main></div>
<nav class="bottom"><button class="nav on" data-tab="play"><b>▶</b>START</button><button class="nav" data-tab="log"><b>◎</b>記録</button><button class="nav" data-tab="about"><b>↗</b>使い方</button></nav>
<script>
(()=>{'use strict';const KEY='hitobito-start-v1',DEFAULT={starts:0,restarts:0,hard:0,splits:0,history:[],lastTask:'',active:null};let state=load(),tab='play',flow=null,timerId=null;const main=document.getElementById('main'),resetBtn=document.getElementById('resetBtn');const blockers={overwhelm:{name:'多すぎる',code:'OVERWHELM',icon:'▦',glow:'rgba(106,167,255,.16)',sub:'全体が大きすぎて、手が止まる'},heavy:{name:'めんどくさい',code:'HEAVY',icon:'●',glow:'rgba(255,97,116,.13)',sub:'始めるまでが、とにかく重い'},choice:{name:'どこから？',code:'CHOICE',icon:'⌘',glow:'rgba(178,122,255,.14)',sub:'選択肢が多すぎて決められない'},perfect:{name:'完璧にやらなきゃ',code:'PERFECT',icon:'◇',glow:'rgba(216,255,91,.12)',sub:'ちゃんとやろうとして動けない'}};function load(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...DEFAULT}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function nowText(){return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date())}function setTab(next){clearTimer();tab=next;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));render()}function render(){if(tab==='log')return renderLog();if(tab==='about')return renderAbout();if(!flow)return renderHome();if(flow.stage==='blocker')return renderBlocker();if(flow.stage==='steps')return renderStep();if(flow.stage==='started')return renderStarted();if(flow.stage==='timer')return renderTimer();if(flow.stage==='done')return renderDone()}function renderHome(){const resume=state.active?`<div class="resume"><div><b>${esc(state.active.task)}</b><small>途中で止まっても、戻れば RESTART。</small></div><button id="resumeBtn">戻る</button></div>`:'';main.innerHTML=`<section class="screen"><div class="hero"><div class="eyebrow">NO MOTIVATION REQUIRED.</div><h1>始めるだけ。<br>全部はやらない。</h1><p>宿題を終わらせるゲームじゃない。重く見える課題を、<strong>今できる最小の一手</strong>まで小さくする。</p></div><div class="panel"><div class="label">今、一番やりたくないのは？</div><input id="taskInput" class="task-input" autocomplete="off" maxlength="40" placeholder="例：数学の夏休みワーク"><div class="chips"><button class="chip">数学</button><button class="chip">英語</button><button class="chip">レポート</button><button class="chip">夏休みの宿題</button></div><button id="goBtn" class="primary" disabled>これを小さくする</button><div class="mini-note">長くやる必要はありません。STARTできたら勝ち。</div></div>${resume}<div class="quote">「やる気が出たら始める」ではなく、<br>始められるサイズまで小さくする。</div></section>`;const input=document.getElementById('taskInput'),go=document.getElementById('goBtn');input.value=state.lastTask||'';go.disabled=!input.value.trim();input.addEventListener('input',()=>go.disabled=!input.value.trim());document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{input.value=c.textContent;go.disabled=false;input.focus()});go.onclick=()=>startFlow(input.value.trim());const rb=document.getElementById('resumeBtn');if(rb)rb.onclick=resumeFlow}function startFlow(task){state.lastTask=task;flow={task,stage:'blocker',blocker:null,step:0,startedAt:Date.now(),wasRestart:false};save();render()}function resumeFlow(){const a=state.active;flow={task:a.task,stage:'steps',blocker:a.blocker||'heavy',step:Math.max(0,a.step||0),startedAt:Date.now(),wasRestart:true};state.restarts++;state.active=null;save();render()}function renderBlocker(){main.innerHTML=`<section class="screen"><div class="hero" style="padding-bottom:16px"><div class="eyebrow">STEP 01 / NAME THE BLOCKER</div><h1 style="font-size:42px">何が止めてる？</h1><p>${esc(flow.task)}そのものではなく、始める直前に出てくるものを選ぶ。</p></div><div class="blocker-grid">${Object.entries(blockers).map(([k,b])=>`<button class="blocker" data-b="${k}" style="--glow:${b.glow}"><span class="sigil">${b.icon}</span><b>${b.name}</b><small>${b.sub}</small></button>`).join('')}</div><p class="reduced">どれでも正解。今いちばん近いものを1つ。</p></section>`;document.querySelectorAll('.blocker').forEach(b=>b.onclick=()=>chooseBlocker(b.dataset.b))}function chooseBlocker(k){flow.blocker=k;flow.stage='steps';flow.step=0;state.splits++;state.active={task:flow.task,blocker:k,step:0};save();render()}function getSteps(){const t=flow.task;if(flow.blocker==='overwhelm')return [`${t}の全体量を見ない。いったん閉じる。`,`今日触るところを1ページだけ決める。`,`そのページの一番簡単そうな1問を探す。`,`その1問だけ読む。`,`1文字でもいい。手を動かす。`];if(flow.blocker==='choice')return [`${t}以外の課題を今だけ視界から外す。`,`${t}の中で「簡単 / 締切近い / 嫌」のどれか1つで場所を決める。`,`決めたページだけ開く。`,`最初の1問だけ読む。`,`答えを途中まででも書く。`];if(flow.blocker==='perfect')return [`${t}を「完成」させるのを一度やめる。`,`雑でいい下書き用のページを開く。`,`分からないところには印だけ付けて進んでいいと決める。`,`1問だけ途中までやる。`,`60点の答えを1つ置く。`];return [`${t}を持ってくる。`,`机に置く。`,`やる場所を開く。`,`最初の1問を読む。`,`1問だけ手を動かす。`]}function renderStep(){const steps=getSteps(),b=blockers[flow.blocker],idx=Math.min(flow.step,steps.length-1),size=Math.max(72,196-idx*29);main.innerHTML=`<section class="screen"><div class="stage-head"><div><h2>${esc(flow.task)}</h2><p>全部じゃない。今は一手だけ。</p></div><span class="step-no">${String(idx+1).padStart(2,'0')} / ${String(steps.length).padStart(2,'0')}</span></div><div class="arena"><div class="gridbg"></div><div class="monster" style="--size:${size}px"><i class="eye e1"></i><i class="eye e2"></i><div class="monster-label">${b.code}<span>${b.name}</span></div></div><div class="arena-caption">小さくするほど、相手も小さくなる。</div></div><div class="mission"><div class="tiny">NOW / 現実でやる</div><h3>${esc(steps[idx])}</h3><p>できたら戻ってきてください。速さも上手さも採点しません。</p><div class="progress">${steps.map((_,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div><button id="doneStep" class="primary">できた</button><button id="pauseBtn" class="secondary">いったん離れる</button></div></section>`;document.getElementById('doneStep').onclick=advanceStep;document.getElementById('pauseBtn').onclick=pauseFlow}function pauseFlow(){state.active={task:flow.task,blocker:flow.blocker,step:flow.step};save();flow=null;render()}function advanceStep(){const steps=getSteps();if(flow.step<steps.length-1){flow.step++;state.active={task:flow.task,blocker:flow.blocker,step:flow.step};save();render()}else{state.active=null;state.starts++;if(flow.blocker==='heavy'||flow.blocker==='perfect')state.hard++;state.history.unshift({task:flow.task,when:nowText(),type:flow.wasRestart?'RESTART':'START',blocker:flow.blocker});state.history=state.history.slice(0,40);save();flow.stage='started';render()}}function renderStarted(){main.innerHTML=`<section class="screen"><div class="start-burst"><div class="start-word">START</div><h2>もう始まってる。</h2><p>ここで終わっても成功。<br>続けるなら、次は3分だけ。</p></div><div class="panel"><button id="threeBtn" class="primary">3分だけ続ける</button><button id="finishBtn" class="secondary">今日はここまで</button><div class="mini-note">30分やる約束はしない。次の3分だけ。</div></div></section>`;document.getElementById('threeBtn').onclick=startTimer;document.getElementById('finishBtn').onclick=finishFlow}function startTimer(){flow.stage='timer';flow.timerEnd=Date.now()+180000;render()}function clearTimer(){if(timerId){clearInterval(timerId);timerId=null}}function renderTimer(){clearTimer();main.innerHTML=`<section class="screen"><div class="timer-wrap"><div class="eyebrow">RUN / THREE MINUTES</div><h2>考えず、続ける。</h2><div class="timer-ring" id="ring"><div class="timer-num" id="timerNum">3:00<small>ONLY THIS ROUND</small></div></div><p>終わったら、続けるか終わるかをもう一度選べます。</p><button id="stopBtn" class="secondary">今ここで終わる</button></div></section>`;document.getElementById('stopBtn').onclick=finishFlow;tick();timerId=setInterval(tick,250)}function tick(){if(!flow||flow.stage!=='timer')return clearTimer();const total=180000,remain=Math.max(0,flow.timerEnd-Date.now()),elapsed=total-remain,s=Math.ceil(remain/1000),m=Math.floor(s/60),ss=String(s%60).padStart(2,'0'),num=document.getElementById('timerNum'),ring=document.getElementById('ring');if(num)num.innerHTML=`${m}:${ss}<small>ONLY THIS ROUND</small>`;if(ring)ring.style.setProperty('--deg',`${Math.min(360,elapsed/total*360)}deg`);if(remain<=0){clearTimer();flow.stage='done';render()}}function finishFlow(){clearTimer();if(flow){flow.stage='done';render()}}function renderDone(){main.innerHTML=`<section class="screen"><div class="done-box"><div class="done-icon">✓</div><h2>今日は START 済み。</h2><p>量ではなく、止まっていた状態から動いたことを記録しました。</p><div class="stats"><div class="stat"><strong>${state.starts}</strong><span>START</span></div><div class="stat"><strong>${state.restarts}</strong><span>RESTART</span></div><div class="stat"><strong>${state.splits}</strong><span>SPLIT</span></div></div></div><div class="panel"><button id="againBtn" class="primary">別の課題をSTART</button><button id="homeBtn" class="secondary">終わる</button></div></section>`;document.getElementById('againBtn').onclick=()=>{flow=null;render()};document.getElementById('homeBtn').onclick=()=>{flow=null;render()}}function renderLog(){main.innerHTML=`<section class="screen"><div class="hero" style="padding-bottom:12px"><div class="eyebrow">YOUR START LOG</div><h1 style="font-size:48px">始めた記録。</h1><p>勉強時間ではなく、「止まっていたところから動いた回数」を残す。</p></div><div class="stats"><div class="stat"><strong>${state.starts}</strong><span>START</span></div><div class="stat"><strong>${state.restarts}</strong><span>RESTART</span></div><div class="stat"><strong>${state.splits}</strong><span>SPLIT</span></div></div><div class="history">${state.history.length?state.history.map(h=>`<div class="history-row"><div><b>${esc(h.task)}</b><small>${esc(h.when)} · ${esc(blockers[h.blocker]?.name||'')}</small></div><em>${h.type}</em></div>`).join(''):`<div class="empty">まだ記録はありません。<br>最初のSTARTを1回だけ作ってみてください。</div>`}</div></section>`}function renderAbout(){main.innerHTML=`<section class="screen"><div class="hero"><div class="eyebrow">HOW IT WORKS</div><h1 style="font-size:48px">全部を<br>考えない。</h1><p>このゲームは、宿題を管理するアプリではありません。「取りかかれない」を攻略するための短いトレーニングです。</p></div><div class="panel"><div class="label">RULE 01</div><h2 style="margin:0 0 8px">成功条件は、始めたこと。</h2><p style="color:#8792a3;font-size:12px;line-height:1.7">1問で終わっても成功。3分でやめても成功。長時間やることは評価しません。</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="label">RULE 02</div><h2 style="margin:0 0 8px">中断しても、失敗にしない。</h2><p style="color:#8792a3;font-size:12px;line-height:1.7">スマホを見たり休憩が長くなったりしても、戻ってきたら RESTART として記録します。</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="label">RULE 03</div><h2 style="margin:0 0 8px">最終的には、ゲームなしで。</h2><p style="color:#8792a3;font-size:12px;line-height:1.7">目標はアプリを長く使うことではなく、自分で「最初だけやるか」と動けることです。</p></div></section>`}document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));resetBtn.addEventListener('click',()=>{if(confirm('STARTの記録をすべてリセットしますか？')){state={...DEFAULT};save();flow=null;setTab('play')}});render()})();
</script>
</body></html>
