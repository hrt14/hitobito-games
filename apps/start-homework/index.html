<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<meta name="description" content="MBTIを入口に、自分に合う始め方で宿題の最初の一歩を出すLEVEL UPゲーム。">
<title>START — MBTIで、動き出せる。</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d121a;--text:#f6f8fb;--muted:#7e899a;--line:rgba(255,255,255,.11);--accent:#d8ff5b;--soft:rgba(216,255,91,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 50% -12%,rgba(216,255,91,.09),transparent 32rem),linear-gradient(180deg,#090c11,#05070a 75%)}
button,input{font:inherit}button{cursor:pointer}.app{width:min(520px,100%);min-height:100dvh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.brand{height:42px;display:flex;align-items:center;gap:9px;color:#aeb7c4}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgba(216,255,91,.55)}.brand b{font-size:11px;letter-spacing:.19em}.screen{flex:1;display:flex;flex-direction:column;animation:in .28s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.spacer{flex:1}.eyebrow{margin:26px 0 11px;color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.19em}.title{margin:0;font-size:clamp(42px,12vw,66px);line-height:.92;letter-spacing:-.065em}.lead{margin:15px 0 0;color:#8e98a8;font-size:12px;line-height:1.7}.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:26px}.mbti{aspect-ratio:1.08;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#111720,#0a0e14);color:#dfe5ec;font-weight:900;font-size:13px;letter-spacing:.04em;position:relative;overflow:hidden}.mbti:before{content:"";position:absolute;width:60px;height:60px;border-radius:50%;right:-35px;top:-35px;background:rgba(216,255,91,.07)}.mbti:active,.choice:active,.primary:active{transform:scale(.975)}.mbti.saved{border-color:rgba(216,255,91,.35);background:linear-gradient(145deg,rgba(216,255,91,.10),#0b1015)}.footnote{margin:15px 0 0;text-align:center;color:#505a69;font-size:9px;line-height:1.55}.mode-card{margin:25px 0 0;border:1px solid rgba(216,255,91,.18);border-radius:22px;background:linear-gradient(145deg,rgba(216,255,91,.08),rgba(216,255,91,.015));padding:16px}.mode-card small{display:block;color:var(--accent);font-size:8px;font-weight:950;letter-spacing:.18em}.mode-card b{display:block;margin-top:8px;font-size:17px}.mode-card p{margin:8px 0 0;color:#8994a5;font-size:11px;line-height:1.65}.question{margin:42px 0 22px;font-size:clamp(38px,11vw,58px);line-height:.98;letter-spacing:-.055em}.choices{display:grid;gap:10px}.choice{min-height:76px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#111720,#0a0e14);color:#f4f6f9;text-align:left;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:18px;letter-spacing:-.02em}.choice span:last-child{color:#5f6a7a;font-size:18px}.custom{margin-top:12px;border:1px solid var(--line);border-radius:20px;background:#0a0f15;padding:15px}.custom input{width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.14);background:transparent;color:white;font-size:18px;font-weight:800;outline:none;padding:5px 1px 12px}.custom input::placeholder{color:#4e5867}.primary{width:100%;margin-top:13px;border:0;border-radius:17px;background:var(--accent);color:#0c1008;padding:16px 18px;font-size:14px;font-weight:950}.primary:disabled{opacity:.35}.shrink-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 2px}.shrink-label{color:#616c7c;font-size:9px;font-weight:900;letter-spacing:.17em}.shrink-stack{width:100%;margin-top:28px;display:grid;gap:10px}.shrink-item{margin:auto;border:1px solid var(--line);border-radius:19px;background:#0d121a;padding:17px 18px;font-weight:900;transition:all .4s ease;opacity:.24;transform:scale(.94)}.shrink-item.on{opacity:1;transform:scale(1);border-color:rgba(216,255,91,.25);box-shadow:0 0 35px rgba(216,255,91,.04)}.shrink-item:nth-child(1){width:100%;font-size:20px}.shrink-item:nth-child(2){width:79%;font-size:17px}.shrink-item:nth-child(3){width:57%;font-size:14px}.shrink-arrow{color:#485363;font-size:13px}.shrink-end{margin-top:25px;color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.13em;opacity:0;transition:opacity .35s}.shrink-end.on{opacity:1}.action-wrap{flex:1;display:flex;flex-direction:column}.action-top{padding-top:24px}.type-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.type-tag{color:var(--accent);font-size:9px;font-weight:950;letter-spacing:.15em}.step{color:#697486;font-size:9px;font-weight:900;letter-spacing:.14em}.action-card{flex:1;min-height:370px;margin-top:14px;border:1px solid var(--line);border-radius:30px;background:radial-gradient(circle at 50% 24%,rgba(216,255,91,.08),transparent 36%),linear-gradient(160deg,#111720,#090d13);padding:24px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;overflow:hidden}.action-card:after{content:"";position:absolute;inset:auto -15% -42% -15%;height:55%;border-radius:50%;border:1px solid rgba(255,255,255,.05)}.count{color:#4e5969;font-size:10px;letter-spacing:.15em;font-weight:900}.action-card h1{margin:18px auto 0;max-width:390px;font-size:clamp(36px,10.5vw,55px);line-height:1.04;letter-spacing:-.06em}.action-card p{max-width:340px;margin:18px auto 0;color:#818c9d;font-size:12px;line-height:1.7}.done-btn{margin-top:12px;width:100%;border:0;border-radius:19px;background:var(--accent);color:#0a0e07;padding:18px;font-weight:950;font-size:16px}.burst{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.burst-word{font-size:clamp(78px,23vw,116px);line-height:.78;font-weight:1000;letter-spacing:-.09em;color:var(--accent);text-shadow:0 0 50px rgba(216,255,91,.16);animation:pop .48s cubic-bezier(.2,1.5,.3,1) both}@keyframes pop{from{opacity:0;transform:scale(.68)}to{opacity:1;transform:scale(1)}}.burst h2{margin:31px 0 8px;font-size:27px;letter-spacing:-.04em}.burst p{margin:0;color:#8490a1;font-size:12px;line-height:1.7}.stats{display:flex;justify-content:center;gap:8px;margin-top:23px}.stat{min-width:94px;border:1px solid var(--line);border-radius:15px;padding:11px;background:#0a0f15}.stat b{display:block;font-size:21px}.stat small{display:block;color:#606b7b;font-size:8px;margin-top:3px;letter-spacing:.08em}.actions{margin-top:26px}.secondary{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:17px;background:#0b1016;color:#aeb7c4;padding:15px;font-size:12px;font-weight:850}.timer{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.timer-circle{width:220px;height:220px;margin:22px auto;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) var(--deg,0deg),#151c25 0)}.timer-circle:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#080c11}.timer-num{position:relative;z-index:2;font-size:53px;font-weight:950}.timer-num small{display:block;margin-top:6px;color:#647083;font-size:8px;letter-spacing:.17em}.timer h2{margin:0;font-size:28px}.timer p{color:#7b8798;font-size:11px;line-height:1.65}.skip{margin-top:18px;border:0;background:none;color:#515d6d;font-size:10px;text-decoration:underline}.change{position:absolute;right:16px;top:max(19px,env(safe-area-inset-top));border:0;background:none;color:#596474;font-size:9px;font-weight:800}.hidden{display:none!important}@media(max-width:360px){.app{padding-left:12px;padding-right:12px}.mbti-grid{gap:6px}.mbti{border-radius:13px;font-size:12px}.question{margin-top:30px}.action-card{min-height:330px;padding:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app"><div class="brand"><span class="dot"></span><b>START / LEVEL UP</b></div><button id="changeBtn" class="change hidden" type="button">MBTIを変える</button><main id="main" class="screen"></main></div>
<script>
(()=>{'use strict';
const KEY='hitobito-start-v2';
const TYPES=['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
const MODES={
INTJ:['最短攻略モード','全体ではなく、攻略範囲を切る。'],INTP:['3分実験モード','やる気を待たず、まず試してみる。'],ENTJ:['勝利条件モード','今日の勝利条件を、最初の一手にする。'],ENTP:['入口選択モード','順番より、いちばん入りやすい入口から。'],
INFJ:['静かな一歩モード','全部を背負わず、目の前の一手だけ。'],INFP:['気分ゼロOKモード','やりたくないままでいい。小さく触る。'],ENFJ:['GOモード','勢いを借りて、一緒に最初の一手へ。'],ENFP:['好きなところからモード','最初から順番にやらなくていい。'],
ISTJ:['3手固定モード','最初の3手だけ決めて、その通りに進む。'],ISFJ:['安心スタートモード','確実にできる小さな一歩から始める。'],ESTJ:['即実行モード','考えるより先に、次の一手を処理する。'],ESFJ:['チェックモード','一個ずつ終わらせて、前進を見える形にする。'],
ISTP:['触るだけモード','まず物理的に触る。考えるのはそのあと。'],ISFP:['いちばん軽いところモード','今いちばん抵抗の少ない一歩から。'],ESTP:['3・2・1モード','考える前にカウントで身体を動かす。'],ESFP:['テンポスタートモード','小さく、速く、気持ちよく始める。']};
const TASKS={math:{label:'数学',short:'数学',steps:['数学の教材を手に取る。','やるページを開く。','1問目を読む。']},english:{label:'英語',short:'英語',steps:['英語の教材を手に取る。','やるページを開く。','最初の1問を読む。']},summer:{label:'夏休みの宿題',short:'宿題',steps:['宿題をひとつだけ机に出す。','その宿題を開く。','最初の1問だけ見る。']}};
let state=load(),mbti='',task=null,actionIndex=0,timerId=null;
const main=document.getElementById('main'),changeBtn=document.getElementById('changeBtn');
function load(){try{return Object.assign({lastMbti:'',starts:0,lastTask:'',history:[]},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {lastMbti:'',starts:0,lastTask:'',history:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(html){main.className='screen';main.innerHTML=html;window.scrollTo(0,0)}
function profile(type){const [name,line]=MODES[type];return {name,line,E:type[0]==='E',S:type[1]==='S',T:type[2]==='T',J:type[3]==='J'}}
function mbtiScreen(){changeBtn.classList.add('hidden');mbti='';task=null;const saved=state.lastMbti;show(`<div class="eyebrow">MBTIで、動き出せる。</div><h1 class="title">あなたの<br>MBTIは？</h1><div class="mbti-grid">${TYPES.map(t=>`<button class="mbti ${saved===t?'saved':''}" data-type="${t}">${t}</button>`).join('')}</div><p class="footnote">あなたに合った「始め方」に切り替えます。</p>`);main.querySelectorAll('.mbti').forEach(b=>b.onclick=()=>{mbti=b.dataset.type;state.lastMbti=mbti;save();taskScreen()})}
function taskScreen(){changeBtn.classList.remove('hidden');const p=profile(mbti);show(`<div class="mode-card"><small>${mbti} / START MODE</small><b>${p.name}</b><p>${p.line}</p></div><h1 class="question">何を<br>始めたい？</h1><div class="choices"><button class="choice" data-task="math"><span>数学</span><span>→</span></button><button class="choice" data-task="english"><span>英語</span><span>→</span></button><button class="choice" data-task="summer"><span>夏休みの宿題</span><span>→</span></button><button class="choice" data-task="custom"><span>自分で入力</span><span>＋</span></button></div><div id="customBox" class="custom hidden"><input id="customInput" maxlength="45" placeholder="例：理科のレポート"><button id="customGo" class="primary" disabled>これを小さくする</button></div>`);main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.task==='custom'){document.getElementById('customBox').classList.remove('hidden');const i=document.getElementById('customInput'),go=document.getElementById('customGo');i.focus();i.oninput=()=>go.disabled=!i.value.trim();go.onclick=()=>{task=customTask(i.value.trim());shrinkScreen()}}else{task={...TASKS[b.dataset.task]};shrinkScreen()}})}
function customTask(name){const lower=name.toLowerCase();let steps;if(/レポート|作文|感想|論文/.test(name))steps=[`${name}に必要なものを開く。`,'タイトルだけ書く。','最初の1行だけ書く。'];else if(/単語|暗記/.test(name))steps=[`${name}を手元に出す。`,'最初のページを開く。','1個だけ見る。'];else if(/片付|掃除/.test(name))steps=[`${name}の場所へ行く。`,'いちばん小さい物を1個持つ。','その1個だけ片付ける。'];else steps=[`${name}に必要なものを手に取る。`,'最初に触る場所を開く。','1個だけやってみる。'];return {label:name,short:name.length>10?name.slice(0,10)+'…':name,steps}}
function shrinkScreen(){changeBtn.classList.add('hidden');state.lastTask=task.label;save();show(`<div class="shrink-wrap"><div class="shrink-label">DON'T DO IT ALL</div><div class="shrink-stack"><div class="shrink-item" id="s1">${esc(task.label)}</div><div class="shrink-arrow">↓</div><div class="shrink-item" id="s2">全部やる</div><div class="shrink-arrow">↓</div><div class="shrink-item" id="s3">次の一手だけ</div></div><div class="shrink-end" id="se">これなら、今できる。</div></div>`);const ids=['s1','s2','s3'];ids.forEach((id,i)=>setTimeout(()=>document.getElementById(id)?.classList.add('on'),180+i*360));setTimeout(()=>document.getElementById('se')?.classList.add('on'),1260);setTimeout(()=>{actionIndex=0;actionScreen()},1900)}
function cueFor(p,i){if(p.E&&i===0)return '3、2、1。画面から目を離して動く。';if(!p.E&&i===0)return 'この一つだけ。他は考えなくていい。';if(p.T)return i===2?'終了条件は「1個見る」だけ。':'ここまでで1ステップ。';return i===2?'やる気はなくていい。触れたら十分。':'できる小ささのまま進む。'}
function actionText(p,i){let base=task.steps[i];if(!p.S&&i===0)return `今は「${esc(task.short)}を終わらせる」ではなく、最初の動作だけ。\n${base}`;return base}
function actionScreen(){changeBtn.classList.add('hidden');const p=profile(mbti),txt=actionText(p,actionIndex);show(`<div class="action-wrap"><div class="action-top"><div class="type-row"><span class="type-tag">${mbti} / ${p.name}</span><span class="step">${actionIndex+1} / 3</span></div></div><div class="action-card"><div class="count">REAL WORLD ACTION</div><h1>${esc(txt).replace(/\n/g,'<br>')}</h1><p>${cueFor(p,actionIndex)}</p></div><button class="done-btn" id="done">できた</button></div>`);document.getElementById('done').onclick=()=>{actionIndex++;if(actionIndex>=3)startClear();else actionScreen()}}
function startClear(){state.starts++;state.history.unshift({mbti,task:task.label,at:Date.now()});state.history=state.history.slice(0,30);save();show(`<div class="burst"><div class="burst-word">START</div><h2>もう、始まってる。</h2><p>${mbti}の${profile(mbti).name}で、最初の一手まで到達。</p><div class="stats"><div class="stat"><b>${state.starts}</b><small>START</small></div><div class="stat"><b>${mbti}</b><small>MODE</small></div></div><div class="actions"><button class="primary" id="three">このまま3分だけ続ける</button><button class="secondary" id="finish">今日はここまで</button></div></div>`);document.getElementById('three').onclick=timerScreen;document.getElementById('finish').onclick=mbtiScreen}
function timerScreen(){let left=180;clearInterval(timerId);function render(){const deg=((180-left)/180)*360;show(`<div class="timer"><div class="eyebrow">STARTした結果、続いている。</div><h2>あと3分だけ。</h2><div class="timer-circle" style="--deg:${deg}deg"><div class="timer-num">${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}<small>KEEP GOING</small></div></div><p>3分でやめても成功。<br>続けたくなったら、そのとき決める。</p><button class="secondary" id="stop">ここで終了</button></div>`);document.getElementById('stop').onclick=()=>{clearInterval(timerId);startClear()}}render();timerId=setInterval(()=>{left--;if(left<=0){clearInterval(timerId);left=0;render();setTimeout(startClear,700)}else{const n=document.querySelector('.timer-num');const ring=document.querySelector('.timer-circle');if(n)n.innerHTML=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}<small>KEEP GOING</small>`;if(ring)ring.style.setProperty('--deg',`${((180-left)/180)*360}deg`)}},1000)}
changeBtn.onclick=mbtiScreen;mbtiScreen();
})();
</script>
</body>
</html>
