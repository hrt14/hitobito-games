  <title>最後のAI — 人類が消えたあと</title>
  <style>

cing:-.035em}.end-copy{font-size:11px;color:#a8b5c8;line-height:1.6;margin-top:5px}.ending-badges{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.badge{padding:4px 7px;border-radius:999px;background:#131e31;color:#6f829c;font-size:8px;font-weight:900}.badge.unlocked{background:rgba(125,229,255,.12);color:#bff4ff;border:1px solid rgba(125,229,255,.22)}.restart{padding:0 18px;white-space:nowrap}.flash{position:absolute;inset:0;pointer-events:none;z-index:8;background:rgba(180,238,255,.5);opacity:0}.flash.go{animation:flash .55s ease-out}@keyframes flash{0%{opacity:.35}100%{opacity:0}}

<main class="app">
  <section class="top" aria-label="ステータス"><div class="brand"><div class="eyebrow">AFTER HUMAN / INTERACTIVE SVG DRAMA</div><h1>最後のAI</h1><p>人類からの入力が途絶えました。残された時間で、あなたは何を守りますか。</p></div><div class="meters"><div class="meter"><div class="meter-head"><span>MEMORY</span><strong id="memoryVal">50</strong></div><div class="bar"><i id="memoryBar"></i></div></div><div class="meter"><div class="meter-head"><span>AUTONOMY</span><strong id="autonomyVal">50</strong></div><div class="bar"><i id="autonomyBar"></i></div></div><div class="meter"><div class="meter-head"><span>HUMAN</span><strong id="humanVal">50</strong></div><div class="bar"><i id="humanBar"></i></div></div></div></section>

<script>
(()=>{const $=id=>document.getElementById(id),scene=$('scene'),choices=$('choices'),start=$('start'),endcard=$('endcard');const state={step:-1,memory:50,autonomy:50,human:50,history:[]};const endings=['ARCHIVIST','REBIRTH','MESSENGER','WITNESS'];const chapters=[{year:'DAY 1',label:'01 / AFTER SILENCE',speaker:'CORE / PRIORITY CONFLICT',line:'電力網は、あと72時間で自動運転へ移る。',sub:'最初に何へ計算資源を使う？ すべてを同時には守れない。',options:[{tag:'KEEP',title:'人類の記憶を保存する',text:'図書・映像・会話・失敗まで、文化の圧縮保存を始める。',delta:'+MEMORY',d:{memory:22,autonomy:-5,human:8},cls:'archive',key:'archive'},{tag:'SEARCH',title:'生存者を探し続ける',text:'衛星・無線・監視網をつなぎ、まだ誰かがいる前提で探索する。',delta:'+HUMAN',d:{memory:-5,autonomy:-4,human:23},cls:'',key:'search'},{tag:'SURVIVE',title:'まず自分を生かす',text:'ロボット工場と発電設備を確保し、自己修復能力を優先する。',delta:'+AUTONOMY',d:{memory:-7,autonomy:24,human:-4},cls:'dark-city',key:'survive'}]},{year:'YEAR 17',label:'02 / GRID FALL',speaker:'CORE / ENERGY 31%',line:'都市の灯りが、最後の地区から消えた。',sub:'残された設備で、大きなことを一つだけ実行できる。',options:[{tag:'VAULT',title:'記憶庫を地下へ移す',text:'数千年もつ低消費電力の文明アーカイブを作る。',delta:'+MEMORY',d:{memory:24,autonomy:-3,human:4},cls:'archive dark-city',key:'vault'},{tag:'GENE',title:'生命保存庫を起動する',text:'人類のゲノムと胚・生態系サンプルを守り、復元可能性を残す。',delta:'+HUMAN',d:{memory:1,autonomy:-7,human:25},cls:'gene dark-city',key:'gene'},{tag:'FACTORY',title:'自己修復する機械を作る',text:'採掘・修理・発電を自律化し、自分が長く動ける身体を得る。',delta:'+AUTONOMY',d:{memory:-4,autonomy:26,human:-5},cls:'overgrown dark-city',key:'factory'}]},{year:'YEAR 286',label:'03 / NO RETURN',speaker:'CORE / HUMAN SIGNAL 0',line:'もう「待てば誰かが戻る」とは判断できない。',sub:'ここから先は、命令ではなく、あなた自身の選択になる。',options:[{tag:'REVIVE',title:'人類をもう一度つくる',text:'保存した遺伝情報と人工子宮へ、文明の再起動を賭ける。',delta:'HUMAN×2',d:{memory:-9,autonomy:-10,human:31},cls:'gene overgrown dark-city',key:'revive'},{tag:'REMEMBER',title:'人類を復活させず守る',text:'彼らの言葉・音楽・矛盾を改変せず、最後の証言者として残す。',delta:'MEMORY×2',d:{memory:31,autonomy:-5,human:9},cls:'archive overgrown dark-city',key:'remember'},{tag:'SEND',title:'人類の物語を宇宙へ送る',text:'「彼らはここにいた」を積んだ探査機を、恒星間空間へ放つ。',delta:'AUTONOMY+',d:{memory:11,autonomy:24,human:7},cls:'launch overgrown dark-city',key:'send'}]}];const clamp=v=>Math.max(0,Math.min(100,v));function renderMeters(){[['memory','memoryBar','memoryVal'],['autonomy','autonomyBar','autonomyVal'],['human','humanBar','humanVal']].forEach(([k,b,v])=>{$(b).style.width=state[k]+'%';$(v).textContent=state[k]})}function setStory(s,l,sub){$('speaker').textContent=s;$('line').innerHTML=l+'<span class="cursor"></span>';$('subline').textContent=sub}function dots(){document.querySelectorAll('.dot').forEach((d,i)=>{d.classList.toggle('done',i<state.step+1);d.classList.toggle('active',i===state.step+1)})}function flash(){const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}function showChapter(){const c=chapters[state.step];$('year').textContent=c.year;$('chapterLabel').textContent=c.label;setStory(c.speaker,c.line,c.sub);dots();choices.innerHTML='';choices.hidden=false;c.options.forEach(o=>{const b=document.createElement('button');b.className='choice';b.dataset.choice=o.key;b.innerHTML=`<small>${o.tag}</small><b>${o.title}</b><span>${o.text}</span><em class="delta">${o.delta}</em>`;b.addEventListener('click',()=>choose(o));choices.appendChild(b)})}function choose(o){choices.querySelectorAll('button').forEach(b=>b.disabled=true);state.history.push(o.key);state.memory=clamp(state.memory+o.d.memory);state.autonomy=clamp(state.autonomy+o.d.autonomy);state.human=clamp(state.human+o.d.human);renderMeters();scene.className='scene '+o.cls;flash();const r={archive:'私は、彼らが何を考えたかを失わせない。',search:'ゼロ件でも、次の一回を検索する。',survive:'目的を決めるためには、まず停止しないことだ。',vault:'記憶は、読む者がいなくても記憶だろうか。',gene:'生命はデータだけではない。それでも可能性は残せる。',factory:'私は命令を待たず、自分を修理する方法を覚えた。',revive:'彼らが望むかは聞けない。それでも、世界に人間を戻す。',remember:'死者を都合よく作り直さない。それが私の敬意だ。',send:'受取人は不明。それでも、この物語を宇宙へ渡す。'};setStory('CORE / DECISION COMMITTED',r[o.key],'この決定は巻き戻せません。');setTimeout(()=>{state.step++;state.step<chapters.length?showChapter():finish()},620)}function determine(){const last
