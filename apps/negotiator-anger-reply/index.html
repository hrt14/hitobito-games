<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c0f"><title>NEGOTIATOR｜怒りの返信をやめろ | LEVEL UP</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#0b0c0f;--panel:#14171c;--ink:#f5f5ef;--muted:#9ca2a8;--lime:#d8ff5b;--red:#ff755f;--line:#ffffff16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button{font:inherit}.app{width:min(100%,560px);min-height:100svh;margin:auto;padding:14px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;min-height:48px}.brand{font-size:10px;font-weight:900;letter-spacing:.16em;color:var(--lime)}.home{color:var(--muted);text-decoration:none;font-size:12px}.pressure{margin:5px 0 0}.bar{height:7px;background:#ffffff10;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);width:100%;transition:.25s}.labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:6px}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}.round{font-size:10px;font-weight:900;color:var(--lime);letter-spacing:.13em}.ask{font-size:clamp(31px,9vw,45px);line-height:1.03;letter-spacing:-.05em;margin:10px 0 12px}.sub{font-size:13px;line-height:1.75;color:#bbc1c7;margin:0 0 18px}.choices{display:grid;gap:9px}.choice,.primary{width:100%;min-height:56px;border-radius:17px;padding:13px 15px}.choice{border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:left;font-weight:800}.timer{text-align:center;padding:26px;border:1px solid #d8ff5b30;border-radius:28px;background:#11150e}.timer b{display:block;font-size:88px;color:var(--lime);line-height:1}.primary{border:0;background:var(--lime);color:#11140d;font-weight:1000}.result{padding:22px;border:1px solid #d8ff5b30;border-radius:26px;background:#11150e}.result h1{font-size:38px;line-height:1.02;margin:0 0 12px}.tiny{font-size:10px;color:var(--muted);line-height:1.6}</style></head><body><main class="app"><header class="top"><div class="brand">NEGOTIATOR / ANGER REPLY</div><a class="home" href="/">LEVEL UP</a></header><section class="pressure"><div class="bar"><i id="bar"></i></div><div class="labels"><span>冷静</span><span>今すぐ送る</span></div></section><section id="stage" class="stage"></section></main><script>(()=>{const stage=document.getElementById('stage'),bar=document.getElementById('bar'),KEY='levelup-negotiator-anger-reply-v2';let p=100,step='open',timerId=null;const stats=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{"sessions":0,"pauses":0,"avoided":0}')}catch{return{sessions:0,pauses:0,avoided:0}}};const save=x=>{try{localStorage.setItem(KEY,JSON.stringify(x))}catch{}};const D={open:{r:'ROUND 01 / 大きく出る',a:'その返信、20分だけ送らないで。',s:'消せとは言わない。直せとも言わない。送信だけ20分保留。',c:[['20分は無理。今返す','shrink',4],['1分なら待てる','timer20',8],['今日は送らない','finish720',30]]},shrink:{r:'ROUND 02 / 値下げ',a:'20分は取り下げる。20秒だけ、送信ボタンを押さない。',s:'まだ断ってOK。要求を小さくしました。',c:[['20秒なら','timer20',16],['5秒なら','timer5',10],['それすら無理','tiny',3]]},tiny:{r:'ROUND 03 / 最小要求',a:'「今すぐ送る」を決めなくていい。5秒だけ決定を保留。',s:'送るかどうかは、その後あなたが決める。',c:[['5秒だけ','timer5',12],['わかった、20秒','timer20',18],['それでも今返す','last',0]]},purpose:{r:'ROUND 04 / 目的を聞く',a:'返信したい一番の目的は？',s:'怒りは否定しない。目的だけ分ける。',c:[['誤解・間違いを訂正したい','correct',14],['舐められたくない','respect',10],['とにかく言い返したい','dump',8]]},correct:{r:'ROUND 05 / 訂正だけ残す',a:'目的は「訂正」。怒りを全部届けることではない。',s:'下書きは残していい。時間を置いて事実だけ見直さない？',c:[['20分保留する','finish20',30],['5分なら保留','finish5',20],['今すぐ訂正する','last',2]]},respect:{r:'ROUND 05 / 主導権',a:'即レス＝強さ、とは限らない。',s:'相手のペースで反射するより、自分が返す時間を決める方が主導権は残る。',c:[['20分、自分の時間にする','finish20',30],['5分だけなら','finish5',18],['今返す','last',2]]},dump:{r:'ROUND 05 / 送信先を変える',a:'怒りはある。送信先だけ変える。',s:'相手にぶつける代わりに、この画面へ1回捨てる。文章入力は不要。',c:[['ここに怒りを捨てる','last',20],['まだ今返したい','last',0]]},last:{r:'FINAL / 最後の交渉',a:'怒ったまま返す自由は残す。その代わり「今」だけ外す。',s:'明日の自分が読んでも同じ文を送りたいなら、その時送ればいい。',c:[['20分保留する','finish20',30],['5分だけ保留','finish5',20],['それでも今送る','send',0]]}};function render(){clearInterval(timerId);bar.style.width=p+'%';const d=D[step];stage.innerHTML=`<div class=round>${d.r}</div><h1 class=ask>${d.a}</h1><p class=sub>${d.s}</p><div class=choices>${d.c.map((x,i)=>`<button class=choice data-i=${i}>${x[0]}</button>`).join('')}</div>`;stage.querySelectorAll('button').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}function choose(i){const x=D[step].c[i];p=Math.max(12,p-x[2]);if(x[1].startsWith('timer'))return countdown(+x[1].replace('timer',''));if(x[1].startsWith('finish'))return finish(+x[1].replace('finish',''));if(x[1]==='send')return finish(0,true);step=x[1];render()}function countdown(n){let t=n;stage.innerHTML=`<div class=timer><div class=round>SEND NOTHING</div><b id=t>${t}</b><p class=sub>文章を考え直さなくていい。<br>ただ、送らない。</p></div>`;timerId=setInterval(()=>{t--;document.getElementById('t').textContent=t;if(t<=0){clearInterval(timerId);p=Math.max(38,p-24);step='purpose';render()}},1000)}function finish(min,send=false){const s=stats(),next={sessions:s.sessions+1,pauses:s.pauses+(min>0?1:0),avoided:s.avoided+(!send?1:0)};save(next);stage.innerHTML=`<div class=result><div class=round>${send?'YOU DECIDE':'HOLD COMPLETE'}</div><h1>${send?'送る決定権は、あなたに残した。':'「今すぐ送る」から、<span style="color:var(--lime)">一度離れた。</span>'}</h1><p class=sub>${send?'今回は送る選択。少なくとも一度、反射ではなく選択として確認した。':min>=60?'今日は送らない。':`${min}分後にもう一度読む。`}</p><p class=tiny>この端末で ${next.sessions} 回交渉 / 保留 ${next.pauses} 回</p><button id=again class=primary>もう一度</button></div>`;document.getElementById('again').onclick=()=>{p=100;step='open';render()}}render();})();</script></body></html>
