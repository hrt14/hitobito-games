<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4efe6">
<meta name="description" content="予定どおりじゃない日を、その時点からいい日に組み直す。5秒判断で切り替えの反射を鍛えるLEVEL UPゲーム。">
<title>それでも、いい日。 | LEVEL UP</title>
<style>
:root{color-scheme:light;--bg:#f4efe6;--paper:#fffdf8;--ink:#23241f;--muted:#70756d;--line:#d9d3c8;--sage:#718a73;--sage2:#dfe9dd;--amber:#d69a3a;--rose:#c86f63;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}button{font:inherit}#app{height:100svh;overflow:hidden;background:radial-gradient(circle at 82% 10%,#fff5d1 0 10%,transparent 26%),radial-gradient(circle at 10% 92%,#dfeadd 0 11%,transparent 28%),linear-gradient(#fbf8f1,#eee7dc)}.shell{width:min(100%,560px);height:100%;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}.top{height:34px;display:flex;align-items:center;justify-content:space-between;flex:none}.brand{font-weight:900;font-size:15px}.brand b{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:7px;border-radius:8px;background:var(--sage);color:white;font-size:13px}.mini{font-size:11px;color:var(--muted);font-weight:850}.screen{flex:1;min-height:0;display:flex;flex-direction:column}.home{justify-content:center;text-align:center;padding:6px 4px 18px}.sun{font-size:54px;line-height:1}.home h1{font-size:clamp(36px,10vw,54px);line-height:1.02;letter-spacing:-.06em;margin:14px 0 10px}.home p{font-size:18px;line-height:1.65;margin:0 auto;color:#535951;max-width:390px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:430px;margin:18px auto}.chips span{background:#ffffffa8;border:1px solid var(--line);border-radius:14px;padding:9px 5px;font-size:12px;font-weight:850}.btn{border:0;border-radius:18px;min-height:58px;padding:0 18px;font-weight:900;cursor:pointer}.primary{background:var(--ink);color:white;font-size:18px}.btn:active,.choice:active{transform:scale(.985)}.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;flex:none}.round,.score{font-size:12px;font-weight:900}.round{color:var(--muted)}.score{color:var(--sage)}.track{height:8px;border-radius:99px;background:#ffffffb8;border:1px solid #ddd7cd;overflow:hidden}.fill{height:100%;background:var(--sage)}.case{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}.timebar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;background:#ffffff94;border:1px solid var(--line);border-radius:16px;padding:10px 12px}.now small,.remain small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:2px}.now strong{font-size:28px;line-height:1;font-variant-numeric:tabular-nums}.remain{text-align:right}.remain strong{font-size:16px}.priority{font-size:12px;color:#556053;font-weight:850;margin-top:3px}.situation{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px 16px;min-height:126px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.situation:after{content:"";position:absolute;right:-28px;bottom:-43px;width:115px;height:115px;border-radius:50%;background:#e8eee1}.eyebrow{font-size:11px;color:var(--sage);font-weight:950;letter-spacing:.12em;position:relative;z-index:1}.situation h2{font-size:clamp(21px,5.8vw,27px);line-height:1.35;letter-spacing:-.035em;margin:6px 0 0;position:relative;z-index:1}.situation p{font-size:14px;line-height:1.45;color:var(--muted);margin:5px 0 0;position:relative;z-index:1}.question{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:0 2px;flex:none}.question h3{font-size:22px;margin:0;letter-spacing:-.04em}.ring{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amber) var(--deg,360deg),#ddd7cd 0);position:relative}.ring:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}.sec{position:relative;z-index:1;font-size:15px;font-weight:1000;font-variant-numeric:tabular-nums}.choices{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;flex:1;min-height:0}.choice{border:1px solid #d7d0c4;background:#fffdf9;border-radius:16px;padding:11px 12px;text-align:left;cursor:pointer;min-height:0;display:flex;flex-direction:column;justify-content:center}.choice .label{font-size:10px;font-weight:1000;color:var(--sage);letter-spacing:.08em;margin-bottom:4px}.choice strong{font-size:16.5px;line-height:1.32;letter-spacing:-.02em}.choice[data-tone="hard"] .label{color:var(--rose)}.choice[data-tone="soft"] .label{color:var(--amber)}.feedback{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#f4efe6e8;backdrop-filter:blur(5px);padding:20px}.feedback-card{width:min(100%,430px);background:#fffdf9;border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center}.feedback .icon{font-size:42px}.feedback h2{font-size:26px;margin:8px 0 5px}.feedback p{font-size:16px;line-height:1.55;color:#555b54;margin:0}.delta{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:12px}.delta span{font-size:12px;font-weight:900;background:var(--sage2);border-radius:999px;padding:6px 9px}.delta .minus{background:#f3ddd8}.delta .neutral{background:#eeeae3}.result{justify-content:center;text-align:center}.result .big{font-size:58px}.result h1{font-size:36px;line-height:1.1;margin:8px 0 4px;letter-spacing:-.05em}.result .sub{font-size:17px;color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0 12px}.stat{background:#fffdf8;border:1px solid var(--line);border-radius:15px;padding:12px 5px}.stat strong{display:block;font-size:25px}.stat span{font-size:10px;color:var(--muted);font-weight:800}.message{background:#e3eadf;border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.55;margin-bottom:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{background:#fffdf9;border:1px solid var(--line);color:var(--ink);font-size:15px}.actions .primary{font-size:15px}@media(max-height:700px){.shell{gap:8px;padding-top:max(9px,env(safe-area-inset-top));padding-bottom:max(9px,env(safe-area-inset-bottom))}.top{height:29px}.timebar{padding:8px 10px}.now strong{font-size:25px}.situation{min-height:108px;padding:12px 14px}.situation h2{font-size:20px}.situation p{font-size:13px}.question h3{font-size:20px}.ring{width:34px;height:34px}.choice{padding:9px 10px}.choice strong{font-size:15.5px}.home p{font-size:16px}.result .big{font-size:46px}.result h1{font-size:31px}.stats{margin:12px 0 9px}.message{padding:11px 13px;margin-bottom:9px}}@media(max-height:610px){.situation{min-height:94px}.situation p{display:none}.choice strong{font-size:14.5px}.question h3{font-size:18px}.now strong{font-size:22px}.remain strong{font-size:14px}.priority{font-size:11px}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{const app=document.querySelector('#app'),LIMIT=5000,ROUNDS=8;
const S=[
['14:07','あと9時間53分','守りたいこと：17時のサウナ','9時に始めるはずの仕事。まだ手をつけていない。','「本当ならもう終わっていたのに」が頭に浮かぶ。',[['取り返す','夜まで全部やる。サウナはなし。','hard',-2,0,'遅れを、休息から取り返しました。'],['投げる','今日はもうダメ。何もしない。','hard',-1,-1,'失った午前に、残っていた午後まで渡しました。'],['組み直す','最重要だけ90分。サウナは残す。','good',2,2,'旧プランを手放して、大事なものを残せました。'],['保留する','あと30分だけ考えてから決める。','soft',0,-1,'決めない時間も、今日を少しずつ使います。']]],
['10:35','あと13時間25分','守りたいこと：午前の集中時間','寝坊した。朝の散歩も朝食も、予定どおりには入らない。','全部を後ろへずらすと、夜まで予定が詰まりそう。',[['全部維持','朝の予定を全部そのまま後ろへずらす。','hard',-1,0,'予定表は守れましたが、余白が消えました。'],['選び直す','散歩は短縮。11時から重要仕事へ。','good',2,2,'目的を残して、形式を手放せました。'],['自分を罰する','昼食を抜いて遅れを取り返す。','hard',-2,0,'遅れの代償を、体に払わせました。'],['終了扱い','今日は失敗日。明日からやり直す。','soft',-1,-1,'今日の残り時間まで失敗扱いになりました。']]],
['16:10','退勤予定まで1時間50分','締切：明日17時','2時間ぶんの追加作業が突然入った。','今日全部やる必要があるかは、まだ確認していない。',[['即残業','とにかく今日全部終わらせる。','hard',-1,0,'締切を確認する前に、夜を差し出しました。'],['確認する','締切と必要範囲を先に確認する。','good',2,2,'現実の条件を見てから、新しい予定を作れます。'],['拒否する','急な仕事は全部断る。','soft',0,0,'守れるものは増えますが、条件確認が残っています。'],['悩む','まず30分、どうしようか考える。','hard',-1,-1,'判断しないまま、使える時間だけ減りました。']]],
['18:20','自由時間あと4時間','楽しみ：映画','楽しみにしていた映画が満席だった。','映画に行く前提で、一日を組んでいた。',[['最悪扱い','もう気分が台無し。家でずっと不満を言う。','hard',-2,-1,'映画だけでなく、夜全体が「失敗」になりました。'],['代替する','近くの本屋と好きな夕食に切り替える。','good',2,2,'目的だった「楽しむ」を別の形で残せました。'],['次を予約','来週を予約して、今日は早く休む。','good',2,2,'楽しみを未来へ移して、今日は回復に使えました。'],['探し続ける','空席が出るまで何時間でも検索する。','soft',-1,0,'元の予定への固執で、残り時間を使いました。']]],
['13:40','あと10時間20分','今日の必須：返信1件だけ','SNSを見ていたら、3時間たっていた。','「自分のせいだから、今日は遊んじゃダメ」と思う。',[['罰する','娯楽を全部禁止して、夜まで働く。','hard',-2,0,'原因への反省が、今日への罰に変わりました。'],['切り分ける','必要な返信だけ済ませ、午後を作り直す。','good',2,2,'原因と、ここからの判断を分けられました。'],['投げる','もう集中できないから一日SNSを見る。','hard',-1,-1,'失った3時間を理由に、残りも手放しました。'],['分析する','なぜ見たかを1時間かけて分析する。','soft',0,-1,'振り返りが長くなり、再出発が遅れました。']]],
['15:15','約束まで2時間45分','守りたいこと：家族との夕食','午前の作業が予想より長引き、まだ2件残っている。','全部終えれば達成感はある。でも夕食に遅れる。',[['全部終える','約束に遅れても2件とも片づける。','hard',-2,0,'仕事の達成率と引き換えに、大事な予定を削りました。'],['最小化する','今日必須の1件だけ。もう1件は明日へ。','good',2,2,'「全部」ではなく「必要」を残せました。'],['全部やめる','2件とも放置してすぐ遊びに行く。','soft',0,0,'休息は守れますが、必須の確認が残っています。'],['自責する','まず「なぜ遅いか」を反省してから決める。','hard',-1,-1,'反省が次の判断より先になりました。']]],
['08:50','出発まで40分','目的：10時の約束に間に合う','朝のルーティンを全部やる時間がない。','運動、日記、片付け。いつもどおり全部やりたい。',[['全部やる','約束に遅れてもルーティンを守る。','hard',-1,0,'習慣の形を守って、今日の目的が後ろへずれました。'],['短縮する','運動5分だけ。残りは今日は飛ばす。','good',2,2,'習慣の目的を残して、量を調整できました。'],['全部捨てる','もう朝は崩れた。何もせずスマホを見る。','hard',-1,-1,'「全部できない」が「何もしない」に変わりました。'],['焦る','どれを削るかギリギリまで悩む。','soft',0,-1,'選ぶ時間が、いちばん貴重な40分を使います。']]],
['21:30','就寝まで2時間','守りたいこと：睡眠','今日やるつもりだった仕事が1つ残った。','明日でも間に合う。でも「今日やる」と決めていた。',[['予定死守','睡眠を削ってでも今日終わらせる。','hard',-2,0,'昨日の計画を守るために、明日の自分へ負債を送りました。'],['更新する','明日の最初に移して、今日は終える。','good',2,2,'予定を守るより、今の条件に合わせて更新できました。'],['気にし続ける','やらないけど寝るまで罪悪感を持つ。','soft',-1,-1,'仕事はしなくても、休息には入りきれませんでした。'],['勢いで開始','10分だけのつもりで、とりあえず開く。','hard',-1,0,'終わりの条件がないまま、夜の仕事を始めました。']]]];
let st={screen:'home',round:0,order:[],good:0,protect:0,fast:0,started:0,raf:0,locked:false};const shell=(body,meta='')=>`<main class="shell"><header class="top"><div class="brand"><b>日</b>それでも、いい日。</div><div class="mini">${meta}</div></header>${body}</main>`;
function home(){cancelAnimationFrame(st.raf);st.screen='home';app.innerHTML=shell(`<section class="screen home"><div class="sun">☀️</div><h1>それでも、<br>いい日。</h1><p>予定が崩れたあと、<b>残った一日をいい日に組み直す</b>。5秒で選んで、切り替えの反射をつくる。</p><div class="chips"><span>5秒判断</span><span>1画面完結</span><span>8ケース</span></div><button class="btn primary" data-a="start">はじめる</button></section>`,`LEVEL UP`)}
function start(){const ids=[...Array(S.length).keys()];for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}st={screen:'play',round:0,order:ids.slice(0,ROUNDS),good:0,protect:0,fast:0,started:0,raf:0,locked:false};render()}
function render(){cancelAnimationFrame(st.raf);if(st.round>=ROUNDS)return result();st.locked=false;st.screen='play';const s=S[st.order[st.round]],pct=Math.round(st.round/ROUNDS*100);app.innerHTML=shell(`<section class="screen"><div class="hud"><div class="round">${st.round+1} / ${ROUNDS}</div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="score">切替 ${st.good}</div></div><div class="case"><div class="timebar"><div class="now"><small>いま</small><strong>${s[0]}</strong><div class="priority">${s[2]}</div></div><div class="remain"><small>残っている時間</small><strong>${s[1]}</strong></div></div><article class="situation"><div class="eyebrow">予定が崩れた</div><h2>${s[3]}</h2><p>${s[4]}</p></article><div class="question"><h3>ここから、どうする？</h3><div class="ring" data-ring><span class="sec" data-sec>5.0</span></div></div><div class="choices">${s[5].map((c,i)=>`<button class="choice" data-c="${i}" data-tone="${c[2]}"><span class="label">${c[0]}</span><strong>${c[1]}</strong></button>`).join('')}</div></div></section>`,`OLD PLAN → NEW PLAN`);st.started=performance.now();st.raf=requestAnimationFrame(tick)}
function tick(now){if(st.screen!=='play'||st.locked)return;const e=now-st.started,r=Math.max(0,1-e/LIMIT),ring=document.querySelector('[data-ring]'),sec=document.querySelector('[data-sec]');if(ring)ring.style.setProperty('--deg',`${r*360}deg`);if(sec)sec.textContent=Math.max(0,(LIMIT-e)/1000).toFixed(1);if(e>=LIMIT){st.locked=true;return feedbackTimeout()}st.raf=requestAnimationFrame(tick)}
function choose(i){if(st.locked||st.screen!=='play')return;st.locked=true;cancelAnimationFrame(st.raf);const elapsed=performance.now()-st.started,c=S[st.order[st.round]][5][i];if(c[2]==='good')st.good++;if(c[4]>0)st.protect+=c[4];if(elapsed<=3200)st.fast++;showFeedback(c,elapsed)}
function showFeedback(c,elapsed){const good=c[2]==='good',neutral=c[2]==='soft',o=document.createElement('div');o.className='feedback';o.innerHTML=`<div class="feedback-card"><div class="icon">${good?'↻':neutral?'…':'↩'}</div><h2>${good?'新しい今日に更新':'その選択も、今日を使う'}</h2><p>${c[5]}</p><div class="delta"><span class="${c[3]<0?'minus':c[3]===0?'neutral':''}">回復 ${c[3]>0?'+':''}${c[3]}</span><span class="${c[4]<0?'minus':c[4]===0?'neutral':''}">大事なこと ${c[4]>0?'+':''}${c[4]}</span><span class="neutral">判断 ${(elapsed/1000).toFixed(1)}秒</span></div></div>`;app.appendChild(o);setTimeout(()=>{st.round++;render()},760)}
function feedbackTimeout(){const o=document.createElement('div');o.className='feedback';o.innerHTML=`<div class="feedback-card"><div class="icon">⌛</div><h2>決めない間も、時間は進む</h2><p>正解探しより、今の条件で一度決めてみる。</p><div class="delta"><span class="minus">回復 -1</span><span class="neutral">判断 5.0秒超</span></div></div>`;app.appendChild(o);setTimeout(()=>{st.round++;render()},760)}
function result(){cancelAnimationFrame(st.raf);st.screen='result';const flex=Math.round(st.good/ROUNDS*100),msg=flex>=75?'予定どおりではなくても、残った時間から何度も一日を作り直せました。':flex>=45?'「取り返す」より「組み直す」を選べる場面が増えています。':'予定が崩れた瞬間こそ練習どころ。次は「ここから」を先に見てみよう。';app.innerHTML=shell(`<section class="screen result"><div class="big">🌤️</div><h1>それでも、いい日。</h1><p class="sub">予定達成率ではなく、立て直す力のリザルト。</p><div class="stats"><div class="stat"><strong>${flex}%</strong><span>切り替え</span></div><div class="stat"><strong>${st.protect}</strong><span>守れた大事</span></div><div class="stat"><strong>${st.fast}</strong><span>3.2秒以内</span></div></div><div class="message">${msg}<br><b>旧プラン終了。じゃあ、ここからどうする？</b></div><div class="actions"><button class="btn secondary" data-a="home">タイトルへ</button><button class="btn primary" data-a="retry">もう一度</button></div></section>`,`RESULT`)}
app.addEventListener('click',e=>{const a=e.target.closest('[data-a]'),c=e.target.closest('[data-c]');if(a){if(a.dataset.a==='start'||a.dataset.a==='retry')start();if(a.dataset.a==='home')home()}if(c)choose(Number(c.dataset.c))});home();})();
</script></body></html>
