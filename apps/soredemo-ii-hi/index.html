<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4efe6">
<meta name="description" content="予定どおりじゃない日を、その時点からいい日に組み直す。読む時間は無制限、判断だけ5秒で反射を鍛えるLEVEL UPゲーム。">
<title>それでも、いい日。 | LEVEL UP</title>
<style>
:root{color-scheme:light;--bg:#f4efe6;--paper:#fffdf8;--ink:#23241f;--muted:#70756d;--line:#d9d3c8;--sage:#718a73;--sage2:#dfe9dd;--amber:#d69a3a;--rose:#c86f63;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}button{font:inherit}#app{height:100svh;overflow:hidden;background:radial-gradient(circle at 82% 10%,#fff5d1 0 10%,transparent 26%),radial-gradient(circle at 10% 92%,#dfeadd 0 11%,transparent 28%),linear-gradient(#fbf8f1,#eee7dc)}.shell{width:min(100%,560px);height:100%;margin:auto;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.top{height:32px;display:flex;align-items:center;justify-content:space-between;flex:none}.brand{font-weight:900;font-size:15px}.brand b{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:7px;border-radius:8px;background:var(--sage);color:white;font-size:13px}.mini{font-size:11px;color:var(--muted);font-weight:850}.screen{flex:1;min-height:0;display:flex;flex-direction:column}.home{justify-content:center;text-align:center;padding:6px 4px 16px}.sun{font-size:54px;line-height:1}.home h1{font-size:clamp(36px,10vw,54px);line-height:1.02;letter-spacing:-.06em;margin:14px 0 10px}.home p{font-size:18px;line-height:1.6;margin:0 auto;color:#535951;max-width:390px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;max-width:430px;margin:18px auto}.chips span{background:#ffffffa8;border:1px solid var(--line);border-radius:14px;padding:9px 5px;font-size:12px;font-weight:850}.btn{border:0;border-radius:18px;min-height:56px;padding:0 18px;font-weight:900;cursor:pointer}.primary{background:var(--ink);color:white;font-size:18px}.secondary{background:#fffdf9;border:1px solid var(--line);color:var(--ink);font-size:15px}.btn:active,.choice:active{transform:scale(.985)}.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;flex:none}.round,.score{font-size:12px;font-weight:900}.round{color:var(--muted)}.score{color:var(--sage)}.track{height:8px;border-radius:99px;background:#ffffffb8;border:1px solid #ddd7cd;overflow:hidden}.fill{height:100%;background:var(--sage)}.case{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}.timebar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;background:#ffffff94;border:1px solid var(--line);border-radius:16px;padding:9px 11px}.now small,.remain small{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:2px}.now strong{font-size:27px;line-height:1;font-variant-numeric:tabular-nums}.remain{text-align:right}.remain strong{font-size:15px}.priority{font-size:12px;color:#556053;font-weight:850;margin-top:3px}.situation{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px 15px;min-height:122px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.situation:after{content:"";position:absolute;right:-28px;bottom:-43px;width:115px;height:115px;border-radius:50%;background:#e8eee1}.eyebrow{font-size:11px;color:var(--sage);font-weight:950;letter-spacing:.12em;position:relative;z-index:1}.situation h2{font-size:clamp(21px,5.8vw,27px);line-height:1.35;letter-spacing:-.035em;margin:6px 0 0;position:relative;z-index:1}.situation p{font-size:14px;line-height:1.45;color:var(--muted);margin:5px 0 0;position:relative;z-index:1}.decision-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:0 2px;flex:none}.decision-head h3{font-size:21px;margin:0;letter-spacing:-.04em}.phase-note{font-size:12px;color:var(--muted);font-weight:850}.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amber) var(--deg,360deg),#ddd7cd 0);position:relative}.ring:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}.sec{position:relative;z-index:1;font-size:15px;font-weight:1000;font-variant-numeric:tabular-nums}.readbox{display:grid;grid-template-columns:1fr;gap:8px;flex:1;min-height:0}.start-judge{align-self:end}.choices{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;flex:1;min-height:0}.choice{border:1px solid #d7d0c4;background:#fffdf9;border-radius:16px;padding:11px 12px;text-align:left;cursor:pointer;min-height:0;display:flex;flex-direction:column;justify-content:center}.choice .label{font-size:10px;font-weight:1000;color:var(--sage);letter-spacing:.08em;margin-bottom:4px}.choice strong{font-size:16.5px;line-height:1.32;letter-spacing:-.02em}.choice[data-tone="hard"] .label{color:var(--rose)}.choice[data-tone="soft"] .label{color:var(--amber)}.feedback{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#f4efe6ed;backdrop-filter:blur(5px);padding:20px}.feedback-card{width:min(100%,430px);background:#fffdf9;border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center}.feedback .icon{font-size:42px}.feedback h2{font-size:26px;margin:8px 0 7px}.feedback p{font-size:17px;line-height:1.6;color:#4f554e;margin:0}.delta{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:14px 0}.delta span{font-size:12px;font-weight:900;background:var(--sage2);border-radius:999px;padding:6px 9px}.delta .minus{background:#f3ddd8}.delta .neutral{background:#eeeae3}.feedback .btn{width:100%;margin-top:4px}.result{justify-content:center;text-align:center}.result .big{font-size:58px}.result h1{font-size:36px;line-height:1.1;margin:8px 0 4px;letter-spacing:-.05em}.result .sub{font-size:17px;color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0 12px}.stat{background:#fffdf8;border:1px solid var(--line);border-radius:15px;padding:12px 5px}.stat strong{display:block;font-size:25px}.stat span{font-size:10px;color:var(--muted);font-weight:800}.message{background:#e3eadf;border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.55;margin-bottom:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-height:700px){.shell{gap:7px}.top{height:28px}.timebar{padding:7px 10px}.now strong{font-size:24px}.situation{min-height:104px;padding:11px 13px}.situation h2{font-size:20px}.situation p{font-size:13px}.decision-head h3{font-size:19px}.choice{padding:9px 10px}.choice strong{font-size:15px}.feedback-card{padding:18px}.feedback p{font-size:16px}.result .big{font-size:46px}.result h1{font-size:31px}}@media(max-height:610px){.situation{min-height:90px}.situation p{display:none}.choice strong{font-size:14px}.now strong{font-size:21px}.remain strong{font-size:13px}.priority{font-size:11px}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{
const app=document.querySelector('#app'),LIMIT=5000,ROUNDS=8;
const S=[
{time:'14:07',remain:'あと9時間53分',priority:'守りたいこと：17時のサウナ',title:'9時に始めるはずの仕事。まだ手をつけていない。',detail:'「本当ならもう終わっていたのに」が頭に浮かぶ。',choices:[['取り返す','夜まで全部やる。サウナはなし。','hard',-2,0,'遅れを、休息から取り返しました。'],['投げる','今日はもうダメ。何もしない。','hard',-1,-1,'失った午前に、残っていた午後まで渡しました。'],['組み直す','最重要だけ90分。サウナは残す。','good',2,2,'旧プランを手放して、大事なものを残せました。'],['保留する','あと30分だけ考えてから決める。','soft',0,-1,'決めない時間も、今日を少しずつ使います。']]},
{time:'10:35',remain:'あと13時間25分',priority:'守りたいこと：午前の集中時間',title:'寝坊した。朝の散歩も朝食も、予定どおりには入らない。',detail:'全部を後ろへずらすと、夜まで予定が詰まりそう。',choices:[['全部維持','朝の予定を全部そのまま後ろへずらす。','hard',-1,0,'予定表は守れましたが、余白が消えました。'],['選び直す','散歩は短縮。11時から重要仕事へ。','good',2,2,'目的を残して、形式を手放せました。'],['自分を罰する','昼食を抜いて遅れを取り返す。','hard',-2,0,'遅れの代償を、体に払わせました。'],['終了扱い','今日は失敗日。明日からやり直す。','soft',-1,-1,'今日の残り時間まで失敗扱いになりました。']]},
{time:'16:10',remain:'退勤予定まで1時間50分',priority:'締切：明日17時',title:'2時間ぶんの追加作業が突然入った。',detail:'今日全部やる必要があるかは、まだ確認していない。',choices:[['即残業','とにかく今日全部終わらせる。','hard',-1,0,'締切を確認する前に、夜を差し出しました。'],['確認する','締切と必要範囲を先に確認する。','good',2,2,'現実の条件を見てから、新しい予定を作れます。'],['拒否する','急な仕事は全部断る。','soft',0,0,'守れるものは増えますが、条件確認が残っています。'],['悩む','まず30分、どうしようか考える。','hard',-1,-1,'判断しないまま、使える時間だけ減りました。']]},
{time:'18:20',remain:'自由時間あと4時間',priority:'楽しみ：映画',title:'楽しみにしていた映画が満席だった。',detail:'映画に行く前提で、一日を組んでいた。',choices:[['最悪扱い','もう気分が台無し。家でずっと不満を言う。','hard',-2,-1,'映画だけでなく、夜全体が「失敗」になりました。'],['代替する','近くの本屋と好きな夕食に切り替える。','good',2,2,'目的だった「楽しむ」を別の形で残せました。'],['次を予約','来週を予約して、今日は早く休む。','good',2,2,'楽しみを未来へ移して、今日は回復に使えました。'],['探し続ける','空席が出るまで何時間でも検索する。','soft',-1,0,'元の予定への固執で、残り時間を使いました。']]},
{time:'13:40',remain:'あと10時間20分',priority:'今日の必須：返信1件だけ',title:'SNSを見ていたら、3時間たっていた。',detail:'「自分のせいだから、今日は遊んじゃダメ」と思う。',choices:[['罰する','娯楽を全部禁止して、夜まで働く。','hard',-2,0,'原因への反省が、今日への罰に変わりました。'],['切り分ける','必要な返信だけ済ませ、午後を作り直す。','good',2,2,'原因と、ここからの判断を分けられました。'],['投げる','もう集中できないから一日SNSを見る。','hard',-1,-1,'失った3時間を理由に、残りも手放しました。'],['分析する','なぜ見たかを1時間かけて分析する。','soft',0,-1,'振り返りが長くなり、再出発が遅れました。']]},
{time:'15:15',remain:'約束まで2時間45分',priority:'守りたいこと：家族との夕食',title:'午前の作業が予想より長引き、まだ2件残っている。',detail:'全部終えれば達成感はある。でも夕食に遅れる。',choices:[['全部終える','約束に遅れても2件とも片づける。','hard',-2,0,'仕事の達成率と引き換えに、大事な予定を削りました。'],['1件だけ','締切が近い1件だけやって切り上げる。','good',2,2,'全部ではなく、必要な分だけ残せました。'],['両方明日','確認せず2件とも明日に回す。','soft',0,0,'余白は守れますが、締切確認が残っています。'],['反省会','遅れた原因を今すぐ長く振り返る。','hard',-1,-1,'原因分析で、さらに今の時間を使いました。']]},
{time:'08:50',remain:'出発まで40分',priority:'守りたいこと：遅刻しない',title:'朝食も身支度も予定より遅れている。',detail:'全部いつも通りやると、出発に間に合わない。',choices:[['全部やる','朝食も準備も通常どおりやる。','hard',-1,0,'元の形式を守って、出発時刻を失いました。'],['簡略化','朝食を簡単にして、必要な準備だけする。','good',2,2,'大事な目的を守るため、手順を小さくできました。'],['朝食抜き','何も食べず、走って取り返す。','hard',-2,0,'遅れの代償を体に払わせました。'],['諦める','もう遅れそうだからゆっくりする。','soft',-1,-1,'遅れの可能性を、確定した失敗に変えました。']]},
{time:'20:10',remain:'就寝まで3時間20分',priority:'守りたいこと：睡眠',title:'予定していた家事がまだ終わっていない。',detail:'全部終わらせると、寝る時間が遅くなる。',choices:[['全部完了','眠くても全部終わらせる。','hard',-2,0,'未完了を減らす代わりに、明日の回復を削りました。'],['最低限だけ','明日に困る分だけ済ませて終える。','good',2,2,'今日の未完了より、明日の自分を守れました。'],['全部放置','必要なことも確認せず全部やめる。','soft',0,0,'休息は守れますが、明日の負担確認が残っています。'],['悩み続ける','寝るまで家事のことを考える。','hard',-1,-1,'作業しなくても、頭の中では休めませんでした。']]}
];
let st={screen:'home',round:0,score:0,flex:0,rest:0,fast:0,phase:'read',started:0,raf:0,locked:false,last:null};
const shell=(body,meta='')=>`<main class="shell"><header class="top"><div class="brand"><b>☀</b>それでも、いい日。</div><div class="mini">${meta}</div></header>${body}</main>`;
function home(){cancelAnimationFrame(st.raf);st.screen='home';app.innerHTML=shell(`<section class="screen home"><div class="sun">🌤️</div><h1>それでも、いい日。</h1><p>予定が崩れたあと、<b>ここからどうする？</b>を選び直すゲーム。</p><div class="chips"><span>読む時間は無制限</span><span>判断だけ5秒</span><span>アドバイスは自分のペース</span></div><button class="btn primary" data-a="start">スタート</button></section>`,'LEVEL UP')}
function reset(){st={screen:'case',round:0,score:0,flex:0,rest:0,fast:0,phase:'read',started:0,raf:0,locked:false,last:null};renderCase()}
function renderCase(){cancelAnimationFrame(st.raf);st.screen='case';st.phase='read';st.locked=false;const s=S[st.round];const pct=Math.round((st.round/ROUNDS)*100);app.innerHTML=shell(`<div class="hud"><div class="round">${st.round+1} / ${ROUNDS}</div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="score">切替 ${st.flex}</div></div><section class="screen case"><div class="timebar"><div class="now"><small>いま</small><strong>${s.time}</strong><div class="priority">${s.priority}</div></div><div class="remain"><small>残り</small><strong>${s.remain}</strong></div></div><article class="situation"><div class="eyebrow">予定が崩れた</div><h2>${s.title}</h2><p>${s.detail}</p></article><div class="decision-head"><div><h3>まず、状況を読む</h3><div class="phase-note">読み終わったら判断スタート</div></div></div><div class="readbox"><button class="btn primary start-judge" data-a="judge">判断スタート</button></div></section>`,`${st.round+1}/${ROUNDS}`)}
function beginJudge(){if(st.phase!=='read')return;st.phase='judge';st.started=performance.now();const s=S[st.round];const buttons=s.choices.map((c,i)=>`<button class="choice" data-c="${i}" data-tone="${c[2]}"><span class="label">${c[0]}</span><strong>${c[1]}</strong></button>`).join('');const area=app.querySelector('.case');area.querySelector('.decision-head').innerHTML=`<h3>ここから、どうする？</h3><div class="ring" data-ring><div class="sec" data-sec>5.0</div></div>`;area.querySelector('.readbox').outerHTML=`<div class="choices">${buttons}</div>`;st.raf=requestAnimationFrame(tick)}
function tick(now){if(st.phase!=='judge'||st.locked)return;const elapsed=now-st.started,remain=Math.max(0,LIMIT-elapsed),r=remain/LIMIT;const ring=app.querySelector('[data-ring]'),sec=app.querySelector('[data-sec]');if(ring)ring.style.setProperty('--deg',`${r*360}deg`);if(sec)sec.textContent=(remain/1000).toFixed(1);if(remain<=0){st.locked=true;cancelAnimationFrame(st.raf);showFeedback(null,true);return}st.raf=requestAnimationFrame(tick)}
function choose(i){if(st.phase!=='judge'||st.locked)return;st.locked=true;cancelAnimationFrame(st.raf);const elapsed=performance.now()-st.started;if(elapsed<=LIMIT)st.fast++;showFeedback(Number(i),false)}
function showFeedback(index,timedOut){const s=S[st.round];let text,deltaScore=0,deltaFlex=0,tone='neutral',title='時間切れ';if(timedOut){text='決められないままでも大丈夫。まずは「今からどうする？」に戻ればいい。'}else{const c=s.choices[index];deltaScore=c[3];deltaFlex=c[4];text=c[5];st.score+=deltaScore;st.flex+=Math.max(0,deltaFlex);if(deltaScore>0){tone='good';title='組み直せた'}else if(deltaScore<0){tone='bad';title='ちょっと引っかかった'}else{title='一理ある'}}st.last={timedOut,index};const icon=tone==='good'?'🌿':tone==='bad'?'↩️':'⏸️';const badges=[];if(!timedOut){badges.push(`<span class="${deltaScore<0?'minus':deltaScore===0?'neutral':''}">一日の守り ${deltaScore>0?'+':''}${deltaScore}</span>`);badges.push(`<span class="${deltaFlex<0?'minus':deltaFlex===0?'neutral':''}">切替 ${deltaFlex>0?'+':''}${deltaFlex}</span>`)}else badges.push('<span class="neutral">読み終わるまでアドバイスは消えません</span>');app.insertAdjacentHTML('beforeend',`<div class="feedback"><div class="feedback-card"><div class="icon">${icon}</div><h2>${title}</h2><p>${text}</p><div class="delta">${badges.join('')}</div><button class="btn primary" data-a="next">読んだ。次へ</button></div></div>`)}
function next(){document.querySelector('.feedback')?.remove();st.round++;if(st.round>=ROUNDS)return result();renderCase()}
function result(){st.screen='result';const good=st.score>=8;app.innerHTML=shell(`<section class="screen result"><div class="big">${good?'🌤️':'🌥️'}</div><h1>${good?'それでも、いい日。':'ここからでいい。'}</h1><p class="sub">予定どおりではなくても、一日は組み直せる。</p><div class="stats"><div class="stat"><strong>${st.flex}</strong><span>切り替え</span></div><div class="stat"><strong>${st.fast}</strong><span>5秒判断</span></div><div class="stat"><strong>${Math.max(0,st.score)}</strong><span>一日の守り</span></div></div><div class="message">失った時間を取り返すより、<b>残っている時間から新しい今日を作る。</b></div><div class="actions"><button class="btn secondary" data-a="home">タイトルへ</button><button class="btn primary" data-a="again">もう一度</button></div></section>`,'RESULT')}
app.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a,c=e.target.closest('[data-c]')?.dataset.c;if(a==='start'||a==='again')reset();else if(a==='home')home();else if(a==='judge')beginJudge();else if(a==='next')next();else if(c!=null)choose(c)});
home();
})();
</script>
</body>
</html>
