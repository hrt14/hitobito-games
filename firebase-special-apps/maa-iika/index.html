<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0c0f0b"><title>まあ、いいか。 | LEVEL UP</title><style>
:root{color-scheme:dark;--bg:#0a0d09;--panel:#11160f;--text:#f4f7ef;--muted:#98a18f;--line:rgba(255,255,255,.10);--lime:#d8ff5b;--bad:#ff826f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--text)}body{min-height:100dvh;background:radial-gradient(circle at 80% -10%,rgba(216,255,91,.09),transparent 30rem),#0a0d09}.app{width:min(640px,100%);min-height:100dvh;margin:auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(88px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:10px;font-weight:950;letter-spacing:.17em;color:#aeb6a4}.home{color:#8d9686;text-decoration:none;font-size:10px;border:1px solid var(--line);padding:8px 10px;border-radius:999px}.hero{padding:36px 2px 20px}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.18em;color:var(--lime);margin-bottom:10px}.hero h1{font-size:clamp(52px,15vw,82px);line-height:.9;letter-spacing:-.07em;margin:0}.hero p{font-size:12px;line-height:1.75;color:var(--muted);margin:14px 0 0}.meter{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:12px 0 18px}.bar{height:8px;border-radius:999px;background:#20271d;overflow:hidden}.fill{height:100%;width:50%;background:var(--lime);transition:.25s}.meter small{font-size:9px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(150deg,#151b12,#0e120c);padding:20px}.scene{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#8e9986;font-size:9px;font-weight:900;letter-spacing:.11em}.icon{font-size:38px;margin:18px 0 10px}.card h2{font-size:clamp(28px,8vw,42px);line-height:1.08;letter-spacing:-.05em;margin:0}.detail{font-size:11px;line-height:1.7;color:#899183;margin:11px 0 18px}.choices{display:grid;gap:9px}.choice{border:1px solid var(--line);background:#0d120c;color:#eef2e9;border-radius:16px;min-height:60px;padding:13px 14px;text-align:left;font-weight:850;font-size:13px;line-height:1.45}.choice.good{border-color:rgba(216,255,91,.35)}.choice:active{transform:scale(.985)}.result{margin-top:14px;border-radius:18px;padding:15px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.result b{display:block;font-size:16px}.result p{margin:7px 0 0;color:#a5ad9c;font-size:11px;line-height:1.65}.delta{margin-top:10px;font-weight:950;font-size:13px}.delta.good{color:var(--lime)}.delta.bad{color:var(--bad)}.next,.again{width:100%;margin-top:12px;border:0;border-radius:16px;background:var(--lime);color:#11150d;padding:15px;font-weight:950}.secondary{display:block;text-align:center;text-decoration:none;width:100%;margin-top:9px;border:1px solid var(--line);border-radius:16px;background:#0d120c;color:#aeb7a4;padding:14px;font-weight:850}.summary{display:flex;flex:1;flex-direction:column;justify-content:center;text-align:center}.summary h1{font-size:clamp(58px,17vw,92px);line-height:.85;letter-spacing:-.08em;color:var(--lime);margin:10px 0 20px}.summary p{font-size:12px;line-height:1.8;color:#9da696}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:20px}.stat{padding:15px;border:1px solid var(--line);border-radius:16px;background:#0e130d}.stat b{display:block;font-size:26px}.stat small{font-size:8px;color:#7f8979}.hidden{display:none!important}
</style></head><body><div class="app"><div class="top"><div class="brand">ACCEPT, THEN MOVE / LEVEL UP</div><a class="home" href="/">⌂ TOP</a></div><main id="main"></main></div><script>
(()=>{'use strict';const KEY='hitobito-maa-iika-v2';const EVENTS=[
['🚃','朝 / 移動','電車が20分遅れている。','急いでも、電車そのものは早くならない。',[['なんで今日に限って？',17,'抵抗しても、遅延はそのまま。'],['最悪。予定が全部崩れた',20,'未来までまとめて悪くすると、引っかかりが増える。'],['気にしないことにする',7,'押し込めるより、起きたことを一度受け取る。'],['そうなったか。連絡して次を考えよう',-11,'事実を受け取ると、次の一手が戻ってくる。']]],
['☔','休日 / 外出','出かけた瞬間、雨が降ってきた。','天気は、自分の予定に合わせてはくれない。',[['予報では降らないって言ったのに',15,'正しさを争っても、雨は止まらない。'],['もう今日ぜんぶ台無し',19,'一つの予定外を、一日全体に広げなくていい。'],['別に雨なんてどうでもいい',6,'嫌だった気持ちまで消す必要はない。'],['まあ、いいか。傘を買うか予定を変えよう',-12,'嫌でもいい。抵抗を終えると選択肢が見える。']]],
['🏪','昼 / 買い物','わざわざ来た店が臨時休業。','入口には「本日休業」の紙が貼られている。',[['ここまで来たのにありえない',18,'コストを払った後ほど、人は現実に抵抗しやすい。'],['なんで事前に告知しないの？',16,'確認したいなら後でできる。まず現実を受け取る。'],['行きたくなかったことにする',8,'欲しかった気持ちは、そのままでいい。'],['休みか。じゃあ近くの別の店を見よう',-11,'「そうなったか」の後には、すぐ次が置ける。']]],
['💬','午後 / メッセージ','送ったメッセージに返信が来ない。','既読かどうかも分からない。',[['なんで返してくれないんだろう',18,'分からないものを頭の中で埋めるほど、離れにくくなる。'],['きっと嫌われた',23,'事実は「返信がまだない」まで。物語を足さなくていい。'],['もう二度と送らない',9,'極端な結論で切るのも、引っかかりの別の形。'],['まだ来てない。それだけ。必要なら後で確認しよう',-13,'分からないまま置いておけることも、受容の力。']]],
['📄','仕事 / 会議','自分の案が採用されなかった。','かなり時間をかけて作った案だった。',[['あれだけ作ったのに意味がない',22,'努力した事実と、採用されるかどうかは別。'],['見る目がない',20,'相手を裁いている間も、結果は変わらない。'],['どうでもいい案だった',8,'大事だったことまで否定しなくていい。'],['不採用か。理由だけ拾って次の案に使おう',-12,'受容は敗北ではなく、次の操作権を取り戻すこと。']]],
['📅','夕方 / 約束','楽しみにしていた予定が急にキャンセル。','空いた時間だけが残った。',[['ずっと楽しみにしてたのに',18,'残念なのは事実。それ以上、現実と綱引きしなくていい。'],['もっと早く言ってよ',17,'伝え方の問題は後で扱える。まず予定変更を確定させる。'],['最初から楽しみじゃなかった',7,'がっかりしてもいい。感情と抵抗は別。'],['残念。でも空いた時間は使える。まあ、いいか',-13,'残念さを残したままでも、次へ進める。']]],
['👥','夜 / 食事','入りたかった店に長い行列。','待ち時間は約50分。',[['なんでこんなに混んでるの？',14,'混んでいる事実は、問い詰めても空かない。'],['せっかくここまで来たのに',16,'ここまで来たコストと、これから50分使うかは別。'],['意地でも並ぶ',8,'受け入れずに固定すると、自分の選択肢が減る。'],['50分か。待つか別の店か、今決めよう',-10,'事実を受け取ると、選ぶ問題に変わる。']]],
['⚠️','仕事 / 作業','提出後に自分のミスを見つけた。','修正の連絡はまだ間に合う。',[['なんで確認しなかったんだ',24,'自分を責め続けても、ファイルは直らない。'],['見なかったことにしたい',17,'受容は放置ではない。問題が動かせるなら動く。'],['最悪だ。もう信用を失った',25,'まだ起きていない結末まで確定しなくていい。'],['ミスした。まあ、いい。今すぐ訂正を送ろう',-14,'起きた事実は受け入れ、変えられる部分にはすぐ手を出す。']]],
['🧾','生活 / 支払い','請求額が明らかに違っている。','確認すれば訂正してもらえそうだ。',[['まあ、いいか。払ってしまおう',12,'「まあ、いいか」は放置の合言葉ではない。'],['なんでこんなミスするの？',17,'怒り続けるより、訂正できる部分を動かす。'],['絶対に許せない',20,'問題を解くことと、抵抗し続けることは別。'],['違ってるな。事実を確認して問い合わせよう',-12,'受容 = 現実を見ること。必要な行動はむしろ早くなる。']]],
['🧭','旅行 / 現地','目当ての場所が工事で入れない。','今日ここに来ることを中心に予定を組んでいた。',[['こんなの旅行じゃない',21,'一つの予定を、旅行全体と同一化しなくていい。'],['事前にもっと調べるべきだった',18,'反省は後で一回すればいい。今の景色は今しか使えない。'],['もうホテルに帰る',10,'悔しさの勢いで、残りの選択肢まで捨てなくていい。'],['入れないのか。じゃあ今ここから行ける場所を探そう',-13,'計画より現実を先に置くと、旅が再開する。']]]];let order=[],i=0,stress=50,good=0;const main=document.getElementById('main');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){order=shuffle(EVENTS).slice(0,8);i=0;stress=50;good=0;render()}function render(){const e=order[i];main.innerHTML=`<section class="hero"><div class="eyebrow">ROUND ${i+1} / ${order.length}</div><h1>まあ、<br>いいか。</h1><p>嫌なことを好きになるゲームではない。<br>起きた現実との綱引きを早く終えて、次へ進む反射を鍛える。</p></section><div class="meter"><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,stress))}%"></div></div><small>引っかかり ${Math.round(stress)}</small></div><section class="card"><div class="scene"><span>${e[1]}</span><span>${i+1}/${order.length}</span></div><div class="icon">${e[0]}</div><h2>${e[2]}</h2><p class="detail">${e[3]}</p><div class="choices">${e[4].map((c,n)=>`<button class="choice ${c[1]<0?'good':''}" data-n="${n}">${c[0]}</button>`).join('')}</div><div id="result" class="result hidden"></div><button id="next" class="next hidden">次へ</button></section>`;main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(Number(b.dataset.n)))}function answer(n){const e=order[i],c=e[4][n];main.querySelectorAll('.choice').forEach(x=>x.disabled=true);stress=Math.max(0,Math.min(100,stress+c[1]));if(c[1]<0)good++;const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<b>${c[1]<0?'現実を受け取って、次へ。':'まだ現実と綱引き中。'}</b><p>${c[2]}</p><div class="delta ${c[1]<0?'good':'bad'}">引っかかり ${c[1]>0?'+':''}${c[1]}</div>`;const next=document.getElementById('next');next.classList.remove('hidden');next.onclick=()=>{i++;if(i>=order.length)finish();else render()}}function finish(){const best=Number(localStorage.getItem(KEY)||0);const score=Math.round(good/order.length*100);if(score>best)localStorage.setItem(KEY,String(score));main.innerHTML=`<section class="summary"><div class="eyebrow">SESSION COMPLETE</div><h1>${score}</h1><p>${score>=75?'受け入れる → 必要なら動く、の切り替えがかなり速い。':score>=50?'「抵抗を終える」と「放置しない」を分ける練習を続けよう。':'まずは「そうなったか」と事実だけ言うところから。'}</p><div class="stats"><div class="stat"><b>${good}/${order.length}</b><small>ACCEPT / ACT</small></div><div class="stat"><b>${Math.round(stress)}</b><small>FINAL STRESS</small></div></div><button id="again" class="again">もう一回</button><a class="secondary" href="/">LEVEL UPへ戻る</a></section>`;document.getElementById('again').onclick=start}start()})();
</script></body></html>
