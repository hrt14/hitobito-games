<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b08"><title>自分を回せ。 | LEVEL UP</title><style>
:root{color-scheme:dark;--bg:#090b08;--panel:#11150f;--text:#f5f7f0;--muted:#9ca493;--line:rgba(255,255,255,.10);--lime:#d8ff5b;--warn:#ffb454;--bad:#ff786c}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--text)}body{min-height:100dvh;background:radial-gradient(circle at 85% -10%,rgba(216,255,91,.09),transparent 30rem),#090b08}.app{width:min(700px,100%);min-height:100dvh;margin:auto;padding:max(14px,env(safe-area-inset-top)) 14px calc(88px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:10px;font-weight:950;letter-spacing:.17em;color:#aab19f}.home{color:#899183;text-decoration:none;font-size:10px;border:1px solid var(--line);padding:8px 10px;border-radius:999px}.head{padding:26px 1px 14px}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.17em;color:var(--lime)}.head h1{font-size:clamp(45px,13vw,76px);line-height:.9;letter-spacing:-.075em;margin:9px 0 12px}.head p{font-size:11px;line-height:1.75;color:var(--muted);margin:0}.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 14px}.gauge{border:1px solid var(--line);border-radius:14px;background:#0d110c;padding:10px}.gauge label{display:flex;justify-content:space-between;gap:6px;font-size:8px;color:#8d9686;font-weight:900}.track{height:6px;border-radius:99px;background:#232920;margin-top:7px;overflow:hidden}.track span{display:block;height:100%;background:var(--lime)}.gauge.bad .track span{background:var(--bad)}.card{border:1px solid var(--line);border-radius:24px;background:linear-gradient(155deg,#151a12,#0c100b);padding:19px}.meta{display:flex;justify-content:space-between;gap:12px;font-size:9px;color:#8e9887;letter-spacing:.1em;font-weight:900}.urg{color:var(--warn)}.card h2{font-size:clamp(27px,7.5vw,40px);line-height:1.08;letter-spacing:-.05em;margin:14px 0 9px}.body{color:#9ca494;font-size:11px;line-height:1.72;margin:0}.hint{margin:14px 0;border-left:2px solid var(--lime);padding:9px 11px;color:#b6bfaa;font-size:10px;line-height:1.6;background:rgba(216,255,91,.035)}.choices{display:grid;gap:9px}.choice{border:1px solid var(--line);border-radius:16px;background:#0d110c;color:#f2f5ed;padding:13px 14px;text-align:left}.choice b{display:block;font-size:13px}.choice span{display:block;color:#7f8979;font-size:9px;margin-top:4px}.choice:active{transform:scale(.985)}.result{margin-top:13px;padding:14px;border:1px solid rgba(216,255,91,.18);border-radius:17px;background:rgba(216,255,91,.035)}.result b{font-size:15px}.result p{font-size:10px;line-height:1.65;color:#a6af9c;margin:7px 0 0}.delta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{font-size:8px;font-weight:900;padding:5px 7px;border-radius:999px;border:1px solid var(--line);color:#b6bea9}.next,.again{width:100%;border:0;border-radius:16px;background:var(--lime);color:#11150d;padding:15px;margin-top:12px;font-weight:950}.summary{min-height:calc(100dvh - 100px);display:flex;flex-direction:column;justify-content:center;text-align:center}.summary h1{font-size:clamp(58px,18vw,98px);line-height:.84;letter-spacing:-.08em;color:var(--lime);margin:10px 0}.summary p{font-size:11px;line-height:1.8;color:#9ca594}.scoregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}.score{border:1px solid var(--line);border-radius:15px;padding:13px;background:#0e120d}.score b{display:block;font-size:25px}.score small{font-size:8px;color:#7f8878}.secondary{display:block;text-decoration:none;text-align:center;width:100%;border:1px solid var(--line);border-radius:16px;background:#0d110c;color:#aeb6a5;padding:14px;margin-top:9px;font-weight:850}.hidden{display:none!important}@media(max-width:420px){.dash{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><div class="top"><div class="brand">SELF MANAGEMENT / LEVEL UP</div><a class="home" href="/">⌂ TOP</a></div><main id="main"></main></div><script>
(()=>{'use strict';const KEY='hitobito-self-management-v2';const INITIAL={energy:74,focus:68,stress:24,wip:3,trust:62,progress:18};const S=[
['09:05','朝イチ','今日やることが、頭の中に6個ある。','メール、資料、確認、電話、会議準備、調査。全部が「今やること」に見えている。',2,'脳内WIPが多いほど、集中力は削られる。',[['全部少しずつ触る','取りこぼしを防ぐ',{progress:8,wip:2,focus:-12,stress:8},'進んだ感覚はある。でも未完了がさらに増えた。'],['最重要を1個だけ決める','他は次・後で・待ちへ',{progress:7,wip:-2,focus:10,stress:-5},'頭の中の同時実行が減り、目の前の一件が見えた。'],['まず予定表を完璧に作る','30分かけて整理',{progress:1,wip:-1,focus:3,stress:-2},'整理はできたが、仕事そのものはほぼ進んでいない。']]],
['10:20','締切','12時提出の資料が、まだ60%。','完成度を上げたい。でも残り時間は少ない。追加調査を始めると間に合わない可能性がある。',3,'締切直前は、完成度より「出せる形」を優先する局面がある。',[['追加調査して90点を狙う','質を上げてから出す',{progress:8,energy:-12,focus:-8,stress:12,trust:-4},'質は上がったが、締切リスクまで抱え込んだ。'],['60点で一度出せる形にする','骨組みを完成させる',{progress:16,energy:-6,focus:-2,stress:-3,trust:8,wip:-1},'提出可能な状態を先に作った。改善はその後でもできる。'],['締切を延ばせるか相談する','必要なら条件を調整',{progress:5,stress:-5,trust:2},'条件を固定せず、現実に合わせて交渉した。']]],
['11:40','依頼','同僚から「これも今日お願い」。','重要そうだが、自分の仕事も詰まっている。引き受ければWIPが増える。',2,'依頼を受けるかどうかより、今のキャパシティを見る。',[['とりあえず引き受ける','あとで何とかする',{trust:3,wip:2,stress:9,focus:-6},'その場は丸く収まったが、未来の自分に負債を送った。'],['期限と優先度を確認する','条件を明確にする',{trust:5,wip:-1,focus:4,stress:-2},'「今日」の意味を確認したら、今やる必要はなかった。'],['一部を別の人に振る','抱え込まず分ける',{progress:7,trust:5,wip:-1,energy:-2},'仕事を所有するのではなく、前に進めることを選んだ。']]],
['13:25','集中','昼食後、頭が明らかに重い。','作業を続けても同じ段落を何度も読み直している。会議までは45分。',1,'作業時間と有効な作業時間は同じではない。',[['そのまま押し切る','席を立たず続行',{progress:5,energy:-10,focus:-12,stress:6},'時間は使った。でも処理能力が落ち、やり直しが増えた。'],['10分だけ離れる','水分・歩く・目を休める',{energy:10,focus:14,stress:-7,progress:-1},'短く止まったことで、残り時間の質が戻った。'],['軽い作業に切り替える','返信・整理を処理',{progress:6,wip:-1,focus:3,stress:-3},'重い判断を避け、低負荷の未完了を一つ減らした。']]],
['14:50','ミス','さっき送った資料にミスを発見。','小さいが放置はできない。頭の中では「もっと確認すべきだった」が何度も再生される。',2,'反省は次の一手に変換し、反芻は終了させる。',[['原因をずっと考える','二度と失敗しないように',{progress:-2,focus:-8,stress:12},'新しい情報は増えていないのに、思考だけが回り続けた。'],['訂正してチェック項目を1つ足す','修正 → 学び → 終了',{progress:8,trust:6,stress:-4,wip:-1},'直せることを直し、次回の仕組みに変えて終了した。'],['誰にも言わず様子を見る','気づかれないかもしれない',{stress:4,trust:-10,wip:1},'問題は画面から消えたが、頭の中には残った。']]],
['15:35','通知','Slack・メール・チャットが同時に鳴る。','どれも数分で返せそう。今は重要な作業の途中だ。',1,'「すぐ終わる」ものほど集中を分断する。',[['全部その場で返す','未読をゼロにする',{progress:5,wip:-1,focus:-15,stress:4},'未読は減ったが、元の作業に戻るまでに時間がかかった。'],['25分だけ通知を閉じる','今の一個を終える',{progress:13,focus:8,stress:-2,wip:-1},'割り込みを遮断し、一つを完了まで運んだ。'],['緊急だけ確認する','入口を絞る',{progress:9,focus:3,stress:-1},'全部を見るのではなく、例外だけを拾った。']]],
['17:20','追加仕事','帰る直前に、大きめの仕事が来た。','「今日中にできる？」と聞かれた。今から全部やれば夜までかかる。',2,'仕事量・品質・期限は、どれかを調整できる。',[['全部今日やる','期待には応えたい',{progress:14,energy:-18,focus:-10,stress:14,trust:2},'仕事は進んだが、明日の処理能力を先に使った。'],['今日15分で着手だけする','骨組み＋明日の一手',{progress:9,energy:-5,focus:-1,stress:-2,trust:6},'ゼロではなくした。続きが明確なので頭から降ろせる。'],['明日の優先順位と交換する','期限を再設計',{progress:5,wip:-1,trust:5,stress:-5},'追加した分、何かを後ろへ送る。総量を無視しなかった。']]],
['18:10','境界線','明日は大事な朝。今夜の誘いが来た。','行けば楽しい。でも帰宅は遅くなりそう。最近少し疲れも溜まっている。',1,'自己管理は、予定を埋めることではなく明日の自分も守ること。',[['勢いで参加する','今日を優先',{energy:-14,focus:-8,stress:3,trust:3},'楽しい時間は得たが、明日の余白は小さくなった。'],['今回は断る','理由は短く伝える',{energy:10,focus:6,stress:-5,trust:1},'未来の重要な予定のために、今の選択を変えた。'],['30分だけ顔を出す','参加と回復を両立',{energy:-3,stress:-2,trust:5},'0か100かにせず、条件を自分で設計した。']]],
['19:00','未完了','今日終わらなかった仕事が4件残った。','全部を覚えておこうとすると、休んでいても頭が仕事に戻る。',1,'未完了ゼロではなく、脳内WIPを減らす。',[['忘れないよう何度も考える','頭の中に保持',{focus:-9,stress:10,wip:2},'忘れない代わりに、仕事をずっと持ち帰った。'],['次の一手だけ外に書く','今・次・後・待ちへ分ける',{wip:-3,stress:-9,focus:5},'仕事は残っている。でも頭の中からは降ろせた。'],['全部明日の朝に回す','詳細は決めない',{stress:2,wip:1,focus:-2},'先送りしただけなので、脳は未完了として持ち続ける。']]]];let stats={...INITIAL},i=0;const main=document.getElementById('main');function clamp(k,v){if(k==='wip')return Math.max(0,Math.min(9,v));return Math.max(0,Math.min(100,v))}function gauges(){const g=[['ENERGY','energy'],['FOCUS','focus'],['STRESS','stress',1],['WIP','wip',1],['TRUST','trust'],['PROGRESS','progress']];return `<div class="dash">${g.map(x=>{const val=stats[x[1]],pct=x[1]==='wip'?val/9*100:val;return `<div class="gauge ${x[2]?'bad':''}"><label><span>${x[0]}</span><b>${val}</b></label><div class="track"><span style="width:${pct}%"></span></div></div>`}).join('')}</div>`}function render(){const s=S[i];main.innerHTML=`<section class="head"><div class="eyebrow">DAY SIMULATION ${i+1}/${S.length}</div><h1>自分を<br>回せ。</h1><p>頑張る量ではなく、その瞬間の自分の状態を見て最適な一手を選ぶ。</p></section>${gauges()}<section class="card"><div class="meta"><span>${s[0]} / ${s[1]}</span><span class="urg">URGENCY ${'●'.repeat(s[4])}${'○'.repeat(3-s[4])}</span></div><h2>${s[2]}</h2><p class="body">${s[3]}</p><div class="hint">${s[5]}</div><div class="choices">${s[6].map((c,n)=>`<button class="choice" data-n="${n}"><b>${c[0]}</b><span>${c[1]}</span></button>`).join('')}</div><div id="result" class="result hidden"></div><button id="next" class="next hidden">次へ</button></section>`;main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(Number(b.dataset.n)))}function answer(n){const c=S[i][6][n],d=c[2];main.querySelectorAll('.choice').forEach(b=>b.disabled=true);Object.entries(d).forEach(([k,v])=>stats[k]=clamp(k,stats[k]+v));const chips=Object.entries(d).map(([k,v])=>`<span class="chip">${k.toUpperCase()} ${v>0?'+':''}${v}</span>`).join('');const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<b>${c[3]}</b><div class="delta">${chips}</div>`;const next=document.getElementById('next');next.classList.remove('hidden');next.onclick=()=>{i++;if(i>=S.length)finish();else render()}}function finish(){const health=Math.round((stats.energy+stats.focus+(100-stats.stress)+(100-Math.min(100,stats.wip*11))+stats.trust+stats.progress)/6);const best=Math.max(Number(localStorage.getItem(KEY)||0),health);localStorage.setItem(KEY,String(best));const grade=health>=78?'S':health>=68?'A':health>=58?'B':'C';main.innerHTML=`<section class="summary"><div class="eyebrow">DAY COMPLETE</div><h1>${grade}</h1><p>${grade==='S'?'進める・減らす・休む・守るを状態に合わせて切り替えられている。':grade==='A'?'かなり安定。押し切る以外の選択肢をさらに増やそう。':grade==='B'?'進捗だけでなく、明日の処理能力も守るともっと回る。':'頑張り方より、WIPと回復の設計から変えてみよう。'}</p><div class="scoregrid"><div class="score"><b>${health}</b><small>MANAGEMENT</small></div><div class="score"><b>${stats.progress}</b><small>PROGRESS</small></div><div class="score"><b>${stats.energy}</b><small>ENERGY</small></div><div class="score"><b>${stats.wip}</b><small>WIP</small></div></div><button id="again" class="again">もう一日</button><a class="secondary" href="/">LEVEL UPへ戻る</a></section>`;document.getElementById('again').onclick=()=>{stats={...INITIAL};i=0;render()}}render()})();
</script></body></html>
