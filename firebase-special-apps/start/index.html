<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07090d"><title>START — MBTIで、動き出せる。 | LEVEL UP</title><style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0d121a;--text:#f6f8fb;--muted:#7e899a;--line:rgba(255,255,255,.11);--accent:#d8ff5b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 50% -12%,rgba(216,255,91,.09),transparent 32rem),linear-gradient(180deg,#090c11,#05070a 75%)}button,input{font:inherit}.app{width:min(520px,100%);min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px;color:#aeb7c4}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgba(216,255,91,.55)}.brand b{font-size:11px;letter-spacing:.19em}.home{color:#8c96a4;text-decoration:none;font-size:10px;border:1px solid var(--line);padding:8px 10px;border-radius:999px}.screen{flex:1;display:flex;flex-direction:column}.eyebrow{margin:34px 0 11px;color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.19em}.title{margin:0;font-size:clamp(42px,12vw,66px);line-height:.92;letter-spacing:-.065em}.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:26px}.mbti{aspect-ratio:1.08;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#111720,#0a0e14);color:#dfe5ec;font-weight:900;font-size:13px}.mbti.saved{border-color:rgba(216,255,91,.42);background:rgba(216,255,91,.08)}.mode{margin:24px 0 0;border:1px solid rgba(216,255,91,.18);border-radius:20px;background:rgba(216,255,91,.05);padding:16px}.mode small{display:block;color:var(--accent);font-size:8px;font-weight:950;letter-spacing:.16em}.mode b{display:block;margin-top:7px;font-size:17px}.mode p{margin:7px 0 0;color:#8994a5;font-size:11px;line-height:1.6}.question{margin:36px 0 20px;font-size:clamp(38px,11vw,56px);line-height:.98;letter-spacing:-.055em}.choices{display:grid;gap:10px}.choice{min-height:70px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#111720,#0a0e14);color:#f4f6f9;text-align:left;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:17px}.custom{margin-top:12px;border:1px solid var(--line);border-radius:18px;background:#0a0f15;padding:14px}.custom input{width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.14);background:transparent;color:white;font-size:17px;font-weight:800;outline:none;padding:6px 1px 11px}.primary,.done{width:100%;margin-top:13px;border:0;border-radius:17px;background:var(--accent);color:#0c1008;padding:16px;font-size:14px;font-weight:950}.primary:disabled{opacity:.35}.stack{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.stack .step{margin:8px auto;border:1px solid var(--line);border-radius:18px;background:#0d121a;padding:16px 18px;font-weight:900}.stack .step:nth-child(1){width:100%;font-size:20px}.stack .step:nth-child(2){width:78%;font-size:17px}.stack .step:nth-child(3){width:58%;font-size:14px;border-color:rgba(216,255,91,.35);color:var(--accent)}.action{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.action h1{font-size:clamp(38px,10vw,56px);line-height:1.03;letter-spacing:-.06em;margin:18px 0}.action p{color:#8792a3;font-size:12px;line-height:1.7}.timer{width:220px;height:220px;margin:24px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--deg),#151c25 0);position:relative}.timer:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#080c11}.timer span{position:relative;z-index:2;font-size:52px;font-weight:950}.stats{display:flex;justify-content:center;gap:8px;margin-top:20px}.stat{min-width:96px;border:1px solid var(--line);border-radius:14px;padding:11px;background:#0a0f15}.stat b{display:block;font-size:21px}.stat small{color:#667181;font-size:8px}.muted{color:#657080;font-size:10px;line-height:1.7}.secondary{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:17px;background:#0b1016;color:#aeb7c4;padding:14px;font-weight:850}.hidden{display:none!important}@media(max-width:360px){.app{padding-left:12px;padding-right:12px}.mbti-grid{gap:6px}.mbti{font-size:12px}}
</style></head><body><div class="app"><div class="top"><div class="brand"><span class="dot"></span><b>START / LEVEL UP</b></div><a class="home" href="/">⌂ TOP</a></div><main id="main" class="screen"></main></div><script>
(()=>{'use strict';const KEY='hitobito-start-v2';const TYPES=['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];const MODES={INTJ:['最短攻略モード','全体ではなく、攻略範囲を切る。'],INTP:['3分実験モード','やる気を待たず、まず試してみる。'],ENTJ:['勝利条件モード','今日の勝利条件を最初の一手にする。'],ENTP:['入口選択モード','順番より、いちばん入りやすい入口から。'],INFJ:['静かな一歩モード','全部を背負わず、目の前の一手だけ。'],INFP:['気分ゼロOKモード','やりたくないままでいい。小さく触る。'],ENFJ:['GOモード','勢いを借りて最初の一手へ。'],ENFP:['好きなところからモード','最初から順番にやらなくていい。'],ISTJ:['3手固定モード','最初の3手だけ決め、その通りに進む。'],ISFJ:['安心スタートモード','確実にできる小さな一歩から。'],ESTJ:['即実行モード','考えるより先に次の一手を処理する。'],ESFJ:['チェックモード','一個ずつ終わらせて前進を見える形に。'],ISTP:['触るだけモード','まず物理的に触る。考えるのはそのあと。'],ISFP:['いちばん軽いところモード','今いちばん抵抗の少ない一歩から。'],ESTP:['3・2・1モード','考える前にカウントで身体を動かす。'],ESFP:['テンポスタートモード','小さく、速く、気持ちよく始める。']};const TASKS={math:{label:'数学',steps:['数学の教材を手に取る。','やるページを開く。','1問目を読む。']},english:{label:'英語',steps:['英語の教材を手に取る。','やるページを開く。','最初の1問を読む。']},summer:{label:'夏休みの宿題',steps:['宿題をひとつだけ机に出す。','その宿題を開く。','最初の1問だけ見る。']}};let state=load(),mbti='',task=null,timerId=null;const main=document.getElementById('main');function load(){try{return Object.assign({lastMbti:'',starts:0},JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return{lastMbti:'',starts:0}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function show(html){main.innerHTML=html;scrollTo(0,0)}function profile(t){const m=MODES[t];return{name:m[0],line:m[1]}}function mbtiScreen(){mbti='';task=null;show(`<div class="eyebrow">MBTIで、動き出せる。</div><h1 class="title">あなたの<br>MBTIは？</h1><div class="mbti-grid">${TYPES.map(t=>`<button class="mbti ${state.lastMbti===t?'saved':''}" data-type="${t}">${t}</button>`).join('')}</div><p class="muted" style="text-align:center;margin-top:15px">あなたに合った「始め方」に切り替えます。</p>`);main.querySelectorAll('.mbti').forEach(b=>b.onclick=()=>{mbti=b.dataset.type;state.lastMbti=mbti;save();taskScreen()})}function taskScreen(){const p=profile(mbti);show(`<div class="mode"><small>${mbti} / START MODE</small><b>${p.name}</b><p>${p.line}</p></div><h1 class="question">何を<br>始めたい？</h1><div class="choices"><button class="choice" data-task="math"><span>数学</span><span>→</span></button><button class="choice" data-task="english"><span>英語</span><span>→</span></button><button class="choice" data-task="summer"><span>夏休みの宿題</span><span>→</span></button></div><div class="custom"><input id="custom" maxlength="40" placeholder="ほかの宿題・課題"><button id="customGo" class="primary" disabled>これを小さくする</button></div>`);main.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{task=TASKS[b.dataset.task];shrink()});const i=document.getElementById('custom'),g=document.getElementById('customGo');i.oninput=()=>g.disabled=!i.value.trim();g.onclick=()=>{const v=i.value.trim();task={label:v,steps:[`${v}に必要なものを出す。`,`${v}を開く。`,`最初の30秒だけ触る。`]};shrink()}}function shrink(){show(`<div class="stack"><div class="eyebrow">BIG → SMALL</div><h2>${task.label}を、食べられる大きさにする。</h2><div class="step">${task.label}をやる</div><div class="step">${task.steps[1]}</div><div class="step">${task.steps[2]}</div><button id="go" class="primary">最初の一手だけやる</button></div>`);document.getElementById('go').onclick=action}function action(){const p=profile(mbti);show(`<div class="action"><div class="mode"><small>${mbti} / ${p.name}</small><b>最初の一手</b></div><h1>${task.steps[2]}</h1><p>全部終わらせなくていい。<br>いまはこの一手だけ。</p><button id="done" class="done">できた</button><button id="timer" class="secondary">3分だけタイマー</button></div>`);document.getElementById('done').onclick=finish;document.getElementById('timer').onclick=startTimer}function startTimer(){let sec=180;show(`<div class="action"><div class="eyebrow">3 MINUTES</div><h2>考えるより、触り続ける。</h2><div class="timer" id="circle" style="--deg:0deg"><span id="num">3:00</span></div><button id="done" class="done">もう始められた</button></div>`);const num=document.getElementById('num'),circle=document.getElementById('circle');document.getElementById('done').onclick=()=>{clearInterval(timerId);finish()};timerId=setInterval(()=>{sec--;const m=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');num.textContent=`${m}:${s}`;circle.style.setProperty('--deg',`${(180-sec)/180*360}deg`);if(sec<=0){clearInterval(timerId);finish()}},1000)}function finish(){state.starts++;save();show(`<div class="action"><div class="eyebrow">START COMPLETE</div><h1 style="color:var(--accent)">始めた。</h1><p>やる気が出てからではなく、<br>小さくしたから動けた。</p><div class="stats"><div class="stat"><b>${state.starts}</b><small>STARTS</small></div><div class="stat"><b>${mbti}</b><small>MODE</small></div></div><button id="again" class="primary">もう一回</button><a class="secondary" href="/" style="display:block;text-align:center;text-decoration:none">LEVEL UPへ戻る</a></div>`);document.getElementById('again').onclick=mbtiScreen}mbtiScreen()})();
</script></body></html>
