<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08100e"><title>INFLUENCE RINGS | LEVEL UP</title><style>:root{color-scheme:dark;--bg:#08100e;--panel:#0e1815;--text:#f5f8f6;--muted:#8ca099;--line:rgba(255,255,255,.12);--lime:#d8ff5b;--aqua:#79f2ce}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}button,input{font:inherit}.app{width:min(540px,100%);min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;background:radial-gradient(circle at 50% 16%,rgba(121,242,206,.08),transparent 26rem)}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;font-weight:950;letter-spacing:.17em}.home{font-size:10px;color:#91a39c;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 10px}.screen{flex:1;display:flex;flex-direction:column}.hero{flex:1;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.18em;color:var(--aqua);margin-bottom:10px}.hero h1{margin:0;font-size:clamp(44px,13vw,70px);line-height:.9;letter-spacing:-.065em}.hero p{color:var(--muted);font-size:13px;line-height:1.75;margin:18px 0 26px}.primary{width:100%;border:0;border-radius:18px;padding:17px;background:var(--lime);color:#0b1109;font-weight:950}.field{margin:26px 0 14px}.field label{display:block;font-size:10px;color:#9cacaa;margin-bottom:8px;font-weight:900}.field input{width:100%;border:1px solid var(--line);border-radius:16px;background:#0b1412;color:white;padding:15px;outline:none;font-weight:800}.ringWrap{flex:1;display:grid;place-items:center;padding:18px 0}.rings{position:relative;width:min(88vw,420px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:radial-gradient(circle,rgba(216,255,91,.16) 0 28%,transparent 28.5% 52%,rgba(121,242,206,.06) 52.5% 72%,transparent 72.5%);display:grid;place-items:center}.rings:before,.rings:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(121,242,206,.24)}.rings:before{width:56%;height:56%}.rings:after{width:82%;height:82%;border-color:rgba(255,255,255,.09)}.center{position:relative;z-index:2;width:46%;text-align:center}.center b{font-size:15px}.center small{display:block;color:#b7c5c0;margin-top:5px;font-size:10px;line-height:1.5}.prompt{margin-top:10px;text-align:center}.prompt h2{font-size:24px;line-height:1.15;margin:0 0 8px}.prompt p{color:var(--muted);font-size:12px;line-height:1.65}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choice{min-height:64px;border:1px solid var(--line);border-radius:17px;background:#0c1613;color:white;font-weight:900}.choice.in{border-color:rgba(216,255,91,.35)}.choice.out{border-color:rgba(121,242,206,.24)}.next{margin-top:12px}.score{display:flex;gap:8px;margin-top:18px}.stat{flex:1;border:1px solid var(--line);border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}.stat small{font-size:8px;color:var(--muted)}.result{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.result h1{font-size:50px;line-height:.95;letter-spacing:-.055em;margin:8px 0 14px;color:var(--lime)}.secondary{display:block;width:100%;border:1px solid var(--line);border-radius:17px;padding:14px;color:#c2cfca;text-decoration:none;text-align:center;margin-top:9px}</style></head><body><div class="app"><div class="top"><div class="brand">INFLUENCE RINGS / LEVEL UP</div><a class="home" href="/">⌂ TOP</a></div><main id="main" class="screen"></main></div><script>(()=>{'use strict';const main=document.getElementById('main'),KEY='levelup-influence-rings-v1';const cards=[['相手の機嫌','外'],['自分が今送る一通','内'],['天気','外'],['今日の最初の30分','内'],['他人の評価','外'],['自分が次に聞く質問','内'],['過去の失敗','外'],['今の姿勢と呼吸','内']];let order=[],i=0,ok=0;function show(x){main.innerHTML=x;scrollTo(0,0)}function home(){const streak=Number(localStorage.getItem(KEY)||0);show(`<section class="hero"><div class="eyebrow">SORT BEFORE YOU START</div><h1>変えられる側に、<br>集中する。</h1><p>気になることを「今の自分が直接動かせるか」で仕分けする練習。<br>仕事や勉強の前に、注意の置き場所を整える。</p><button id="go" class="primary">8問で練習する</button>${streak?`<div class="score"><div class="stat"><b>${streak}</b><small>SESSIONS</small></div></div>`:''}</section>`);document.getElementById('go').onclick=start}function start(){order=[...cards].sort(()=>Math.random()-.5);i=0;ok=0;round()}function round(){const c=order[i];show(`<div class="ringWrap"><div><div class="rings"><div class="center"><b>${c[0]}</b><small>これは今の自分が直接動かせる？</small></div></div><div class="prompt"><h2>${i+1} / ${order.length}</h2><p>基準は「今、自分の行動で直接変えられるか」。</p></div><div class="choices"><button class="choice in" data-a="内">動かせる</button><button class="choice out" data-a="外">直接は動かせない</button></div></div></div>`);main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.a,c[1]))}function answer(a,correct){if(a===correct)ok++;const good=a===correct;const copy=correct==='内'?'次の具体的な一手に変えられる。':'気にはできる。でも直接は操作できない。';show(`<div class="hero"><div class="eyebrow">${good?'GOOD SORT':'TRY THE BOUNDARY'}</div><h1 style="font-size:42px">${good?'その切り分けでOK。':'ここは境界の外。'}</h1><p>${copy}</p><button id="next" class="primary">${i+1<order.length?'次へ':'結果を見る'}</button></div>`);document.getElementById('next').onclick=()=>{i++;if(i<order.length)round();else finish()}}function finish(){const n=Number(localStorage.getItem(KEY)||0)+1;localStorage.setItem(KEY,String(n));show(`<div class="result"><div class="eyebrow">FOCUS RESET</div><h1>${ok} / ${order.length}</h1><p style="color:var(--muted);line-height:1.7">外側を消すのではなく、<br>次の行動は内側から選ぶ。</p><button id="again" class="primary">もう一回</button><a href="/" class="secondary">LEVEL UPへ戻る</a></div>`);document.getElementById('again').onclick=start}home()})();</script></body></html>
