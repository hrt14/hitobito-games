<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b0f"><title>PULSE START | LEVEL UP</title><style>:root{color-scheme:dark;--bg:#090b0f;--panel:#11151c;--text:#f7f8fb;--muted:#8d96a4;--line:rgba(255,255,255,.12);--lime:#d8ff5b;--hot:#ffb347}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}body{background:radial-gradient(circle at 50% -10%,rgba(216,255,91,.11),transparent 28rem),linear-gradient(180deg,#0b0f14,#07090c 78%)}button{font:inherit}.app{width:min(520px,100%);min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;font-weight:950;letter-spacing:.18em;color:#cbd2dc}.home{font-size:10px;color:#8d96a4;text-decoration:none;border:1px solid var(--line);padding:8px 10px;border-radius:999px}.screen{flex:1;display:flex;flex-direction:column}.hero{flex:1;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.19em;color:var(--lime);margin-bottom:10px}.hero h1{font-size:clamp(50px,15vw,78px);line-height:.87;letter-spacing:-.07em;margin:0}.hero p{color:var(--muted);line-height:1.7;font-size:13px;margin:18px 0 26px}.start{width:100%;border:0;border-radius:20px;background:var(--lime);color:#0d1108;padding:19px;font-weight:950;font-size:16px}.pulseWrap{flex:1;display:grid;place-items:center;text-align:center}.pulse{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(216,255,91,.28),rgba(216,255,91,.06) 48%,transparent 70%);border:1px solid rgba(216,255,91,.35);box-shadow:0 0 70px rgba(216,255,91,.13);animation:pulse 1.2s ease-in-out infinite}.pulse b{font-size:66px;letter-spacing:-.06em}.pulse small{display:block;font-size:10px;letter-spacing:.16em;color:#c9d1bc;margin-top:4px}@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 95px rgba(216,255,91,.24)}}.cue{text-align:center;margin-top:22px}.cue h2{font-size:28px;line-height:1.1;margin:0}.cue p{font-size:12px;color:var(--muted);line-height:1.7}.actions{display:grid;gap:10px}.choice{width:100%;min-height:62px;text-align:left;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#121821,#0c1016);color:white;padding:0 16px;font-weight:900;display:flex;align-items:center;justify-content:space-between}.done{width:100%;border:0;border-radius:18px;background:var(--hot);color:#171006;padding:17px;font-weight:950}.secondary{width:100%;border:1px solid var(--line);border-radius:18px;background:#0d1218;color:#c5ccd6;padding:15px;font-weight:850;margin-top:9px}.result{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.result h1{font-size:58px;letter-spacing:-.065em;line-height:.9;margin:8px 0 16px;color:var(--lime)}.stat{margin:18px auto;border:1px solid var(--line);border-radius:16px;padding:14px 22px;min-width:130px}.stat b{display:block;font-size:28px}.stat small{font-size:9px;color:var(--muted)}.hidden{display:none!important}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style></head><body><div class="app"><div class="top"><div class="brand">PULSE START / LEVEL UP</div><a class="home" href="/">⌂ TOP</a></div><main id="main" class="screen"></main></div><script>(()=>{'use strict';const main=document.getElementById('main'),KEY='levelup-pulse-start-v1';let runs=Number(localStorage.getItem(KEY)||0);const cues=[['立つ','足の裏を床につけて、立ち上がる。'],['水を飲む','ひと口だけ。動きのスイッチにする。'],['対象に触る','仕事・勉強なら、まず必要な物に手を置く。']];function show(x){main.innerHTML=x;scrollTo(0,0)}function home(){show(`<section class="hero"><div class="eyebrow">90 SECOND IGNITION</div><h1>止まったら、<br>身体から。</h1><p>考え込む前に、90秒だけ動きを作る。<br>やる気ではなく、最初の身体動作を起点にする。</p><button id="go" class="start">90秒で起動する</button></section>`);document.getElementById('go').onclick=countdown}function countdown(){let sec=3;show(`<div class="pulseWrap"><div><div class="pulse"><div><b id="n">3</b><small>GET READY</small></div></div><div class="cue"><h2>姿勢を起こす。</h2><p>肩を開いて、視線を少し上げる。</p></div></div></div>`);const n=document.getElementById('n');const t=setInterval(()=>{sec--;if(sec>0)n.textContent=sec;else{clearInterval(t);pick()}},700)}function pick(){show(`<div class="hero"><div class="eyebrow">CHOOSE ONE MOVEMENT</div><h1 style="font-size:48px">次の10秒を<br>決める。</h1><div class="actions" style="margin-top:26px">${cues.map((c,i)=>`<button class="choice" data-i="${i}"><span>${c[0]}</span><span>→</span></button>`).join('')}</div></div>`);main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>move(Number(b.dataset.i)))}function move(i){const c=cues[i];let sec=10;show(`<div class="pulseWrap"><div><div class="pulse"><div><b id="n">10</b><small>MOVE NOW</small></div></div><div class="cue"><h2>${c[0]}</h2><p>${c[1]}</p></div></div></div><button id="done" class="done">もう動いた</button>`);document.getElementById('done').onclick=finish;const n=document.getElementById('n');const t=setInterval(()=>{sec--;if(sec>=0)n.textContent=sec;else{clearInterval(t);finish()}},1000)}function finish(){runs++;localStorage.setItem(KEY,String(runs));show(`<div class="result"><div class="eyebrow">IGNITION COMPLETE</div><h1>起動した。</h1><p style="color:var(--muted);line-height:1.7">次は「全部やる」ではなく、<br>今触れた対象を30秒だけ続ける。</p><div class="stat"><b>${runs}</b><small>IGNITIONS</small></div><button id="again" class="start">もう一回</button><a class="secondary" href="/" style="display:block;text-decoration:none;text-align:center">LEVEL UPへ戻る</a></div>`);document.getElementById('again').onclick=home}home()})();</script></body></html>
