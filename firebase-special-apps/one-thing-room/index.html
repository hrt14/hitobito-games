<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b0f"><title>ONE THING ROOM | LEVEL UP</title><style>:root{color-scheme:dark;--bg:#090b0f;--panel:#11161d;--text:#f7f8fb;--muted:#929ba8;--line:rgba(255,255,255,.12);--lime:#d8ff5b;--soft:#bfe7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}body{background:radial-gradient(circle at 50% -12%,rgba(191,231,255,.12),transparent 30rem),linear-gradient(180deg,#0b1015,#07090c 75%)}button,input{font:inherit}.app{width:min(520px,100%);min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:10px;font-weight:950;letter-spacing:.17em;color:#d8dee7}.home{font-size:10px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 10px;border-radius:999px}.screen{flex:1;display:flex;flex-direction:column}.hero{flex:1;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.18em;color:var(--lime);margin-bottom:10px}.hero h1,.result h1{font-size:clamp(48px,14vw,72px);line-height:.88;letter-spacing:-.065em;margin:0}.hero p,.copy{color:var(--muted);line-height:1.75;font-size:13px;margin:18px 0 24px}.primary{width:100%;border:0;border-radius:19px;background:var(--lime);color:#0c1108;padding:18px;font-weight:950;font-size:15px}.secondary{width:100%;border:1px solid var(--line);border-radius:17px;background:#0d1218;color:#d3d8df;padding:14px;font-weight:850}.breath{flex:1;display:grid;place-items:center;text-align:center}.orb{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(191,231,255,.35);background:radial-gradient(circle,rgba(191,231,255,.24),rgba(191,231,255,.05) 55%,transparent 72%);animation:breathe 5s ease-in-out infinite}.orb b{font-size:58px}.orb small{display:block;font-size:10px;letter-spacing:.16em;color:#d6e9f5}@keyframes breathe{50%{transform:scale(1.08)}}.panel{margin:auto 0}.panel h1{font-size:38px;line-height:1.03;letter-spacing:-.045em;margin:7px 0 10px}.slots{display:grid;gap:10px;margin:20px 0}.slot{width:100%;border:1px solid var(--line);border-radius:16px;background:#0d1218;color:#fff;padding:15px;outline:none}.slot:focus{border-color:rgba(216,255,91,.55)}.cards{display:grid;gap:10px;margin:18px 0}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#121820,#0d1117);padding:15px}.card b{display:block;margin-bottom:5px}.card small{color:var(--muted);line-height:1.6}.pick{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:0}.timer{font-size:82px;font-weight:950;letter-spacing:-.07em;text-align:center;margin:28px 0 6px}.focus{text-align:center;color:var(--soft);font-weight:900;line-height:1.5}.result{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.stat{margin:18px auto;border:1px solid var(--line);border-radius:16px;padding:13px 22px}.stat b{display:block;font-size:27px}.stat small{font-size:9px;color:var(--muted)}@media(prefers-reduced-motion:reduce){.orb{animation:none}}</style></head><body><div class="app"><div class="top"><div class="brand">ONE THING ROOM / LEVEL UP</div><a class="home" href="/">⌂ TOP</a></div><main id="main" class="screen"></main></div><script>(()=>{'use strict';const main=document.getElementById('main'),KEY='levelup-one-thing-room-v1';let runs=Number(localStorage.getItem(KEY)||0),items=[];const show=x=>{main.innerHTML=x;scrollTo(0,0)};function home(){show(`<section class="hero"><div class="eyebrow">OVERLOAD RESET</div><h1>全部を、<br>一度やめる。</h1><p>難しいことが同時に押し寄せたら、頭の中で全部を処理しない。90秒で負荷を外に出し、次の1個だけ決める。</p><button id="go" class="primary">今すぐ1個に戻す</button></section>`);document.getElementById('go').onclick=downshift}function downshift(){let sec=30;show(`<div class="breath"><div><div class="orb"><div><b id="n">30</b><small>肩を下げて、ゆっくり呼吸</small></div></div><p class="copy" style="margin-bottom:0">今は解決しない。まず身体の速度だけ落とす。</p></div></div><button id="skip" class="secondary">書き出しへ進む</button>`);const n=document.getElementById('n');const t=setInterval(()=>{sec--;n.textContent=sec;if(sec<=0){clearInterval(t);dump()}},1000);document.getElementById('skip').onclick=()=>{clearInterval(t);dump()}}function dump(){show(`<div class="panel"><div class="eyebrow">STEP 1 / OUTSIDE YOUR HEAD</div><h1>重いものを3つまで<br>外に置く。</h1><p class="copy">短い言葉で十分。入力内容はこの端末内だけで使い、送信しません。</p><div class="slots"><input class="slot" maxlength="80" placeholder="例：今日中の返信"><input class="slot" maxlength="80" placeholder="例：明日の準備"><input class="slot" maxlength="80" placeholder="例：考えがまとまらない件"></div><button id="next" class="primary">並べ替える</button></div>`);document.getElementById('next').onclick=()=>{items=[...main.querySelectorAll('.slot')].map(x=>x.value.trim()).filter(Boolean);if(!items.length)items=['今いちばん気になること'];sort()}}function sort(){show(`<div class="panel"><div class="eyebrow">STEP 2 / ONE DECISION</div><h1>今やるのは、<br>どれ1つ？</h1><p class="copy">「重要な順」ではなく、2分で少し前に進められるものを1つ選ぶ。</p><div class="cards">${items.map((x,i)=>`<div class="card"><button class="pick" data-i="${i}"><b>${esc(x)}</b><small>これだけを2分進める →</small></button></div>`).join('')}<div class="card"><button class="pick" data-i="-1"><b>今は何もしない</b><small>水を飲む・席を離れる・休むなど、負荷を下げる方を選ぶ →</small></button></div></div></div>`);main.querySelectorAll('.pick').forEach(b=>b.onclick=()=>focus(Number(b.dataset.i)))}function focus(i){const label=i<0?'休むための小さな行動':items[i];let sec=120;show(`<div class="panel"><div class="eyebrow">STEP 3 / TWO MINUTES ONLY</div><h1 style="font-size:38px">この2分だけ。</h1><div id="timer" class="timer">2:00</div><div class="focus">${esc(label)}</div><p class="copy" style="text-align:center">終わらせなくていい。少しだけ動かす。</p><button id="done" class="primary">少し前に進んだ</button><button id="stop" class="secondary" style="margin-top:9px">今日はここで止める</button></div>`);const timer=document.getElementById('timer'),t=setInterval(()=>{sec--;timer.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(sec<=0){clearInterval(t);finish()}},1000);document.getElementById('done').onclick=()=>{clearInterval(t);finish()};document.getElementById('stop').onclick=()=>{clearInterval(t);finish()}}function finish(){runs++;localStorage.setItem(KEY,String(runs));show(`<div class="result"><div class="eyebrow">LOAD REDUCED</div><h1>1個でいい。</h1><p class="copy">残りは消えていない。でも、同時に持たなくていい。<br>次に戻るときも、1個ずつ。</p><div class="stat"><b>${runs}</b><small>RESETS</small></div><button id="again" class="primary">もう一度整理する</button></div>`);document.getElementById('again').onclick=home}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}home()})();</script></body></html>
