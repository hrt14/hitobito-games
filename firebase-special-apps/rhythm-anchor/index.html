<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090b0f"><title>RHYTHM ANCHOR | LEVEL UP</title><style>:root{color-scheme:dark;--bg:#090b0f;--panel:#11151c;--text:#f7f8fb;--muted:#8f98a5;--line:rgba(255,255,255,.12);--lime:#d8ff5b;--blue:#8ed7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}body{background:radial-gradient(circle at 50% -10%,rgba(142,215,255,.12),transparent 30rem),linear-gradient(180deg,#0b1016,#07090c 76%)}button,input{font:inherit}.app{width:min(520px,100%);min-height:100dvh;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:10px;font-weight:950;letter-spacing:.17em;color:#d9e0e9}.home{font-size:10px;color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 10px;border-radius:999px}.screen{flex:1;display:flex;flex-direction:column}.hero{flex:1;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.18em;color:var(--lime);margin-bottom:10px}.hero h1,.result h1{font-size:clamp(48px,14vw,72px);line-height:.88;letter-spacing:-.065em;margin:0}.hero p,.copy{color:var(--muted);line-height:1.75;font-size:13px;margin:18px 0 24px}.primary{width:100%;border:0;border-radius:19px;background:var(--lime);color:#0d1108;padding:18px;font-weight:950;font-size:15px}.secondary{width:100%;border:1px solid var(--line);border-radius:17px;background:#0d1218;color:#d4dae2;padding:14px;font-weight:850}.panel{margin:auto 0}.panel h1{font-size:39px;line-height:1.02;letter-spacing:-.045em;margin:7px 0 12px}.timeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.timeBox{border:1px solid var(--line);border-radius:17px;background:#0e141b;padding:14px}.timeBox label{display:block;font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.12em;margin-bottom:8px}.timeBox input{width:100%;border:0;background:transparent;color:#fff;font-size:26px;font-weight:950;outline:none}.steps{display:grid;gap:10px;margin:18px 0}.step{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#121820,#0d1117);padding:14px;display:flex;gap:12px;align-items:center}.dot{width:30px;height:30px;border-radius:50%;border:1px solid rgba(216,255,91,.42);display:grid;place-items:center;color:var(--lime);font-size:12px;font-weight:950;flex:0 0 auto}.step b{display:block;font-size:14px}.step small{display:block;color:var(--muted);font-size:11px;line-height:1.55;margin-top:3px}.check{width:100%;text-align:left;border:1px solid var(--line);border-radius:17px;background:#0e141b;color:white;padding:15px;display:flex;align-items:center;justify-content:space-between}.check.done{border-color:rgba(216,255,91,.5);background:rgba(216,255,91,.07)}.check span:last-child{color:var(--lime);font-weight:950}.result{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}.ring{width:190px;height:190px;border-radius:50%;margin:0 auto 24px;display:grid;place-items:center;border:1px solid rgba(142,215,255,.35);background:radial-gradient(circle,rgba(142,215,255,.18),transparent 68%)}.ring b{font-size:54px;letter-spacing:-.06em}.ring small{display:block;color:var(--muted);font-size:9px;letter-spacing:.13em}.stat{margin:16px auto;border:1px solid var(--line);border-radius:16px;padding:13px 22px}.stat b{display:block;font-size:26px}.stat small{font-size:9px;color:var(--muted)}</style></head><body><div class="app"><div class="top"><div class="brand">RHYTHM ANCHOR / LEVEL UP</div><a class="home" href="/">⌂ TOP</a></div><main id="main" class="screen"></main></div><script>(()=>{'use strict';const main=document.getElementById('main'),KEY='levelup-rhythm-anchor-v1';let state=load();function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}const show=x=>{main.innerHTML=x;scrollTo(0,0)};function home(){show(`<section class="hero"><div class="eyebrow">NIGHT ROUTINE</div><h1>毎日を、<br>2つの時刻で戻す。</h1><p>生活リズムが崩れた夜は、全部を立て直さない。明日の起床時刻と、今夜の終了時刻だけ決めて、3つの小さな準備をする。</p><button id="go" class="primary">今夜のアンカーを作る</button>${state.lastDate?`<button id="quick" class="secondary" style="margin-top:10px">昨日の設定を使う</button>`:''}</section>`);document.getElementById('go').onclick=times;const q=document.getElementById('quick');if(q)q.onclick=()=>plan(state.wake||'07:00',state.close||'23:30')}function times(){show(`<div class="panel"><div class="eyebrow">STEP 1 / TWO ANCHORS</div><h1>明日を戻す<br>2つの時刻。</h1><p class="copy">完璧な時刻ではなく、明日守れそうな時刻を選ぶ。大きく崩れている日は、無理のない範囲で少しずつ。</p><div class="timeGrid"><div class="timeBox"><label>明日の起床</label><input id="wake" type="time" value="${state.wake||'07:00'}"></div><div class="timeBox"><label>今夜の終了</label><input id="close" type="time" value="${state.close||'23:30'}"></div></div><button id="next" class="primary">この2つで準備する</button></div>`);document.getElementById('next').onclick=()=>plan(document.getElementById('wake').value||'07:00',document.getElementById('close').value||'23:30')}function plan(wake,close){state.wake=wake;state.close=close;save();show(`<div class="panel"><div class="eyebrow">STEP 2 / MAKE TOMORROW EASY</div><h1>寝る前に、<br>3つだけ置く。</h1><p class="copy">朝の最初の判断を減らす。全部できなくても1つで十分。</p><div class="steps"><div class="step"><div class="dot">1</div><div><b>起きたら見る場所を決める</b><small>カーテン・窓・照明など、朝の最初の光の合図を決める。</small></div></div><div class="step"><div class="dot">2</div><div><b>最初に使う物を出す</b><small>水、服、仕事道具など、朝いちばんの行動を1つだけ準備。</small></div></div><div class="step"><div class="dot">3</div><div><b>${close} に終える物を1つ決める</b><small>動画、仕事、ゲームなど「ここで閉じる」対象を具体的にする。</small></div></div></div><button id="next" class="primary">今夜の3チェックへ</button></div>`);document.getElementById('next').onclick=()=>checks(wake,close)}function checks(wake,close){let done=[false,false,false];const render=()=>{show(`<div class="panel"><div class="eyebrow">STEP 3 / TONIGHT</div><h1>今夜は<br>これだけ。</h1><p class="copy">チェックした瞬間に準備完了。できない項目は飛ばしてよい。</p><div class="steps"><button class="check ${done[0]?'done':''}" data-i="0"><span>朝の光の合図を決めた</span><span>${done[0]?'✓':'○'}</span></button><button class="check ${done[1]?'done':''}" data-i="1"><span>朝いちばんの物を出した</span><span>${done[1]?'✓':'○'}</span></button><button class="check ${done[2]?'done':''}" data-i="2"><span>${close} に閉じる対象を決めた</span><span>${done[2]?'✓':'○'}</span></button></div><button id="finish" class="primary">${done.filter(Boolean).length}/3 で今夜を終える</button></div>`);main.querySelectorAll('.check').forEach(b=>b.onclick=()=>{done[Number(b.dataset.i)]=!done[Number(b.dataset.i)];render()});document.getElementById('finish').onclick=()=>finish(wake,close,done.filter(Boolean).length)};render()}function finish(wake,close,count){const today=new Date().toISOString().slice(0,10);const previous=state.lastDate?new Date(state.lastDate):null;const diff=previous?Math.round((new Date(today)-previous)/86400000):0;state.streak=diff===1?(state.streak||0)+1:diff===0?(state.streak||1):1;state.lastDate=today;state.lastCount=count;save();show(`<div class="result"><div class="ring"><div><b>${wake}</b><small>TOMORROW WAKE</small></div></div><div class="eyebrow">ANCHOR SET</div><h1>明日は、<br>ここから。</h1><p class="copy">今夜は${count}/3できた。<br>崩れた日も、次の夜にまた2つの時刻から戻せばいい。</p><div class="stat"><b>${state.streak}</b><small>NIGHT STREAK</small></div><button id="again" class="primary">次の夜も設定する</button></div>`);document.getElementById('again').onclick=home}home()})();</script></body></html>
