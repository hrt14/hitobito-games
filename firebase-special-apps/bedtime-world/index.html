<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#07111f" />
<meta name="description" content="毎晩、頭の中の世界の続きをひとつだけ開く。布団に入るのが楽しみになる、寝る前のイメトレアプリ。" />
<title>寝る前が楽しみになるイメトレ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;color:#f5f0e7;background:#07111f;--bg:#07111f;--panel:#0c1a2b;--line:rgba(221,231,242,.14);--muted:#9aa9b9;--gold:#d6bc8f}*{box-sizing:border-box}html{background:var(--bg);min-height:100%}body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(128,169,190,.16),transparent 38%),linear-gradient(180deg,#07111f 0%,#08101a 60%,#050b13 100%);color:#f5f0e7;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.app-shell{width:min(100%,560px);min-height:100svh;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));position:relative;overflow:hidden}.app-shell:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.4) .55px,transparent .7px);background-size:34px 34px;opacity:.06;mask-image:linear-gradient(to bottom,black,transparent 70%)}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:26px}.brand{text-decoration:none;color:#b7c6d5;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;padding:8px 12px;font-size:12px;color:#b9c6d4}.hero{padding:8px 2px 14px}.eyebrow{margin:0 0 12px;font-size:11px;letter-spacing:.16em;font-weight:800;color:#9fb1c1;text-transform:uppercase}h1{font-size:clamp(30px,8.2vw,48px);line-height:1.08;letter-spacing:-.055em;margin:0;font-weight:850}.lead{margin:18px 0 0;font-size:15px;line-height:1.85;color:#bdc8d3;max-width:31em}.teaser{margin:26px 0 20px;padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(16,34,56,.9),rgba(7,17,31,.94));box-shadow:0 18px 50px rgba(0,0,0,.18)}.teaser-kicker{font-size:10px;letter-spacing:.14em;color:#8ea4b7;font-weight:800;text-transform:uppercase}.teaser-title{font-size:26px;line-height:1.18;letter-spacing:-.035em;margin:9px 0 5px}.teaser-sub{font-size:13px;line-height:1.6;color:#9fb0bf;margin:0}.primary{width:100%;border:0;border-radius:18px;padding:17px 18px;background:#e9dfca;color:#142031;font-weight:850;font-size:16px;box-shadow:0 12px 34px rgba(0,0,0,.22)}.primary:active{transform:scale(.985)}.primary:disabled{opacity:.38}.secondary{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:rgba(255,255,255,.025);color:#c8d2dc;font-weight:700;font-size:14px}.quiet{border:0;background:transparent;color:#8295a6;font-size:12px;padding:10px 2px;text-decoration:underline;text-underline-offset:4px}.stack{display:grid;gap:10px}.note{font-size:11px;line-height:1.65;color:#73879a;text-align:center;margin:12px 10px 0}.world-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 16px}.world-card{position:relative;min-height:138px;border:1px solid var(--line);background:linear-gradient(165deg,rgba(19,42,65,.86),rgba(7,16,29,.95));border-radius:22px;padding:15px;text-align:left;overflow:hidden}.world-card:after{content:"";position:absolute;width:90px;height:90px;border:1px solid rgba(255,255,255,.10);border-radius:50%;right:-26px;bottom:-28px}.world-card strong{display:block;font-size:17px;line-height:1.25;letter-spacing:-.03em;margin-top:36px}.world-card span{display:block;font-size:11px;line-height:1.45;color:#91a6b7;margin-top:7px}.world-symbol{position:absolute;left:14px;top:14px;font-size:20px!important;color:#d5c5a5!important;margin:0!important}.screen-title{font-size:30px;line-height:1.15;letter-spacing:-.045em;margin:8px 0}.screen-copy{font-size:14px;line-height:1.75;color:#aebdca;margin:0 0 18px}.portal{height:250px;margin:20px 0 22px;border-radius:30px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.10);background:linear-gradient(180deg,#102238 0%,#091523 55%,#050a10 100%);box-shadow:inset 0 -44px 70px rgba(0,0,0,.35),0 26px 70px rgba(0,0,0,.2)}.moon{position:absolute;width:76px;height:76px;border-radius:50%;background:#efe2c6;right:40px;top:34px;box-shadow:0 0 40px rgba(239,226,198,.18)}.horizon{position:absolute;left:-6%;right:-6%;bottom:0;height:45%;background:linear-gradient(150deg,#12233a,#08111d);clip-path:polygon(0 48%,14% 42%,24% 54%,34% 35%,44% 52%,54% 37%,66% 55%,78% 31%,88% 45%,100% 37%,100% 100%,0 100%)}.path{position:absolute;left:50%;bottom:-10%;width:38%;height:70%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(214,188,143,.18),rgba(214,188,143,.02));clip-path:polygon(46% 0,54% 0,100% 100%,0 100%)}.door{position:absolute;left:50%;bottom:48px;width:56px;height:92px;transform:translateX(-50%);border:1px solid rgba(238,225,198,.38);border-radius:28px 28px 4px 4px;background:linear-gradient(180deg,rgba(239,225,195,.12),rgba(12,23,36,.4));box-shadow:0 0 30px rgba(214,188,143,.10)}.portal-label{position:absolute;left:18px;top:16px;font-size:10px;font-weight:800;letter-spacing:.12em;color:#8fa4b6}.route-list{display:grid;gap:10px;margin:16px 0 20px}.route{display:flex;align-items:flex-start;gap:12px;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:18px;padding:14px 15px;text-align:left}.route.selected{border-color:rgba(214,188,143,.52);background:rgba(214,188,143,.075)}.route-no{width:26px;height:26px;display:grid!important;place-items:center;border-radius:999px;border:1px solid rgba(255,255,255,.15);font-size:11px;color:#a9bac9;flex:none;margin:0!important}.route strong{display:block;font-size:15px;line-height:1.35}.route span span{display:block;margin-top:5px;color:#8297a9;font-size:11px;line-height:1.45}.fragments{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}.fragment{min-height:90px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:18px;padding:13px;text-align:left}.fragment.selected{border-color:rgba(141,183,204,.58);background:rgba(141,183,204,.09)}.fragment small{display:block;font-size:9px;letter-spacing:.12em;color:#7e93a6;font-weight:800}.fragment strong{display:block;font-size:14px;line-height:1.45;margin-top:8px}.slot-row{display:flex;gap:8px;margin:14px 0 18px}.slot{flex:1;min-height:54px;border:1px dashed rgba(255,255,255,.16);border-radius:15px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:10px;color:#607487}.slot.filled{border-style:solid;border-color:rgba(214,188,143,.32);color:#d6dce3;background:rgba(214,188,143,.05)}.dark-screen{min-height:calc(100svh - 60px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:30px 10px}.dark-screen .tiny{font-size:10px;letter-spacing:.16em;color:#5f7284;font-weight:800}.dark-screen h2{font-size:36px;line-height:1.15;letter-spacing:-.05em;margin:16px 0 14px}.dark-screen p{font-size:15px;line-height:1.9;color:#92a1ae;margin:0 auto;max-width:28em}.dim{margin:28px auto 0;width:min(100%,360px);padding:18px;border-radius:22px;border:1px solid rgba(255,255,255,.08);color:#75899b;font-size:12px;line-height:1.7;background:rgba(255,255,255,.015)}.finish-btn{margin-top:28px;background:#182433;color:#b7c2cd;border:1px solid rgba(255,255,255,.10)}.map{margin:22px 0 18px;border:1px solid var(--line);border-radius:24px;padding:18px;background:rgba(255,255,255,.02)}.map-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.map-head strong{font-size:14px}.map-head span{font-size:10px;color:#71869a}.map-track{display:flex;gap:8px;align-items:center;overflow:auto;padding-bottom:4px;scrollbar-width:none}.landmark{min-width:100px;min-height:86px;border:1px solid var(--line);border-radius:18px;padding:11px;background:rgba(255,255,255,.02)}.landmark.current{border-color:rgba(214,188,143,.42);background:rgba(214,188,143,.06)}.landmark.locked{opacity:.38}.landmark small{display:block;color:#6d8295;font-size:9px;letter-spacing:.1em}.landmark b{display:block;font-size:12px;line-height:1.4;margin-top:17px}@media(max-width:420px){.app-shell{padding-left:14px;padding-right:14px}.world-card{min-height:130px}.screen-title{font-size:28px}.portal{height:230px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main id="app" class="app-shell" aria-live="polite"></main>
<script>
(()=>{
const KEY='levelup-bedtime-world-v1';
const TODAY=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());
const W={
train:{name:'夜行列車の世界',short:'誰も知らない駅を、ひと駅ずつ。',symbol:'◐',landmarks:['月明かりのホーム','水上の駅','星屑トンネル','眠らない食堂車','朝焼けの終着駅','霧の交換駅','天文台ホーム','海を渡る鉄橋','夜だけの市場駅','白い森の停車場','雲上の分岐駅','星明かりの車庫','風の谷の駅','まだ地図にない終点'],routes:[['最後尾のデッキへ行く','風とレールの音だけが聞こえる。'],['まだ名前のない駅で降りる','ホームの先に小さな灯りがある。'],['食堂車の奥の扉を開ける','今まで気づかなかった車両が続いている。']],fragments:[['sound','遠くで鳴る、低い汽笛'],['light','窓に流れる青い灯り'],['touch','少し冷たい手すり'],['smell','木の床と夜気の匂い'],['detail','誰もいない席に置かれた鍵'],['motion','ゆっくり揺れるカーテン']]},
sky:{name:'空に浮かぶ街',short:'雲の上の区画を、毎晩ひとつ開ける。',symbol:'◇',landmarks:['雲の門','風の商店街','空中庭園','透明な図書館','夜明けの塔','吊り橋区画','空の温室','雲海劇場','風車広場','星見の学校','静かな高架街','飛行船ドック','雨の回廊','最上層の庭'],routes:[['屋上から細い橋を渡る','橋の下は雲だけ。向こうに灯りが見える。'],['閉店後の商店街を歩く','ひとつだけシャッターが開いている。'],['空中庭園の奥へ進む','植物の間から階段が下へ続いている。']],fragments:[['sound','旗が風を切る音'],['light','足元から透ける街の灯り'],['touch','乾いた夜風'],['smell','雨上がりの雲の匂い'],['detail','空に浮いた小さな標識'],['motion','遠くを横切る飛行船']]},
hotel:{name:'森の奥のホテル',short:'泊まるたび、使える部屋が増えていく。',symbol:'▱',landmarks:['玄関ホール','古いラウンジ','温室','地下回廊','屋根裏の展望室','中庭の離れ','雨音の書斎','地下の浴場','森側の食堂','閉じた客室棟','ガラスの廊下','夜の音楽室','湖畔の別館','朝だけ開く屋上'],routes:[['消灯後のラウンジへ戻る','暖炉だけがまだ残っている。'],['温室の奥の扉を開ける','夜にだけ咲く花が光っている。'],['誰も使わない階段を上がる','最上階から森が一望できる。']],fragments:[['sound','古い時計の小さな音'],['light','暖炉の残り火'],['touch','厚い絨毯の感触'],['smell','木と雨の匂い'],['detail','部屋番号のない鍵'],['motion','廊下の先で揺れるカーテン']]},
sea:{name:'月の港',short:'夜の海沿いを、港から先へ。',symbol:'≈',landmarks:['月の桟橋','灯台通り','夜市','青い入江','海上ホテル','波止場倉庫街','白い防波堤','海底窓のカフェ','潮風の坂道','島へ渡る小舟','静かな造船所','星見の浜','夜明け前の魚市場','沖に浮かぶ庭園'],routes:[['桟橋の一番先まで歩く','水面の下にもうひとつ街が見える。'],['灯台の裏道へ入る','海沿いに細い階段が続いている。'],['夜市の最後の店をのぞく','地図にはない場所の切符を売っている。']],fragments:[['sound','岸壁に当たる小さな波'],['light','水面で揺れる月明かり'],['touch','潮風の冷たさ'],['smell','海と木の桟橋の匂い'],['detail','濡れていない古い切符'],['motion','ゆっくり離れていく小舟']]}}
const app=document.getElementById('app');let state=load(),screen=state.world?'home':'intro',route=0,cues=[];
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return{world:x.world||null,nights:Number(x.nights||0),lastCompleted:x.lastCompleted||null,history:Array.isArray(x.history)?x.history.slice(-12):[]}}catch{return{world:null,nights:0,lastCompleted:null,history:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function world(){return W[state.world]}function doneToday(){return state.lastCompleted===TODAY()}function idx(){const n=doneToday()?Math.max(0,state.nights-1):state.nights;return Math.min(n,world().landmarks.length-1)}function place(){return world().landmarks[idx()]}function top(extra=''){return `<div class="topline"><a class="brand" href="/">LEVEL UP · NIGHT</a>${extra}</div>`}
function render(){({intro:renderIntro,home:renderHome,portal:renderPortal,fragments:renderFragments,dark:renderDark,done:renderDone,settings:renderSettings}[screen])()}
function renderIntro(){app.innerHTML=`${top()}<section class="hero"><p class="eyebrow">寝る前が楽しみになるイメトレ</p><h1>今夜から、<br>寝る前に続きがある。</h1><p class="lead">毎晩ひとつだけ、頭の中の世界を先へ進めます。アプリを見るのは入口まで。続きは、布団で目を閉じてから。</p></section><div class="teaser"><div class="teaser-kicker">最初にひとつだけ選ぶ</div><div class="teaser-title">どの世界に通う？</div><p class="teaser-sub">毎晩ちがう世界を転々とせず、同じ場所の続きを育てます。</p></div><div class="world-grid">${Object.entries(W).map(([id,w])=>`<button class="world-card" data-world="${id}"><span class="world-symbol">${w.symbol}</span><strong>${w.name}</strong><span>${w.short}</span></button>`).join('')}</div><p class="note">睡眠を治療するアプリではありません。寝る前の時間を、楽しみに変えるための想像ルーティンです。</p>`;app.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>{state={world:b.dataset.world,nights:0,lastCompleted:null,history:[]};save();screen='home';render()})}
function renderHome(){const w=world(),i=idx(),completed=doneToday();app.innerHTML=`${top('<button class="icon-btn" id="settings">世界</button>')}<section class="hero"><p class="eyebrow">${w.name}</p><h1>${completed?'今夜の続きを、もう見た。':'今夜も、続きがある。'}</h1><p class="lead">${completed?'続きはもう頭の中にあります。もう一度入りたいなら、同じ入口を開けます。':'布団に入ったら、今日の新しい場所をひとつだけ開けます。'}</p></section><div class="map"><div class="map-head"><strong>あなたの世界</strong><span>${state.nights}夜ぶん進行</span></div><div class="map-track">${w.landmarks.map((n,j)=>`<div class="landmark ${j===i?'current':''} ${j>i?'locked':''}"><small>${j<i?'OPEN':j===i?'TONIGHT':'SOON'}</small><b>${j>i?'まだ見えない場所':n}</b></div>`).join('')}</div></div><div class="teaser"><div class="teaser-kicker">${completed?'今夜の場所':'今夜、新しく開く場所'}</div><div class="teaser-title">${place()}</div><p class="teaser-sub">入口だけ見たら、スマホは伏せます。</p></div><div class="stack"><button class="primary" id="enter">${completed?'もう一度、入口を見る':'布団に入った。入口を開く'}</button><button class="secondary" id="history">これまでの夜を見る</button></div><p class="note">“早く寝なきゃ”ではなく、“続きが見たいから布団へ行く”を狙うアプリです。</p>`;settings.onclick=()=>{screen='settings';render()};enter.onclick=()=>{route=state.nights%3;cues=[];screen='portal';render()};history.onclick=()=>alert(state.history.length?state.history.map(h=>`${h.date} — ${h.place}`).join('\n'):'まだありません')}
function renderPortal(){const w=world();app.innerHTML=`${top('<button class="icon-btn" id="back">戻る</button>')}<p class="eyebrow">今夜の入口</p><h2 class="screen-title">${place()}</h2><p class="screen-copy">今日は、どこから入る？ ひとつ選んだら、次は頭の中に持っていく“3つの手がかり”を選びます。</p><div class="portal" aria-hidden="true"><div class="portal-label">TONIGHT</div><div class="moon"></div><div class="horizon"></div><div class="path"></div><div class="door"></div></div><div class="route-list">${w.routes.map((r,i)=>`<button class="route ${i===route?'selected':''}" data-route="${i}"><span class="route-no">${i+1}</span><span><strong>${r[0]}</strong><span>${r[1]}</span></span></button>`).join('')}</div><button class="primary" id="next">この入口から入る</button>`;back.onclick=()=>{screen='home';render()};app.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=Number(b.dataset.route);renderPortal()});next.onclick=()=>{screen='fragments';render()}}
function label(t){return({sound:'SOUND',light:'LIGHT',touch:'TOUCH',smell:'SCENT',detail:'DETAIL',motion:'MOTION'})[t]||'CUE'}
function renderFragments(){const w=world();app.innerHTML=`${top('<button class="icon-btn" id="back">戻る</button>')}<p class="eyebrow">3つだけ持っていく</p><h2 class="screen-title">頭の中の世界に、材料を渡す。</h2><p class="screen-copy">見えるもの・聞こえるもの・触れる感じ。気になるものを3つ選ぶと、今夜の入口が完成します。</p><div class="slot-row">${[0,1,2].map(i=>`<div class="slot ${cues[i]!=null?'filled':''}">${cues[i]!=null?w.fragments[cues[i]][1]:'空き'}</div>`).join('')}</div><div class="fragments">${w.fragments.map((f,i)=>`<button class="fragment ${cues.includes(i)?'selected':''}" data-cue="${i}"><small>${label(f[0])}</small><strong>${f[1]}</strong></button>`).join('')}</div><button class="primary" id="close" ${cues.length===3?'':'disabled'}>目を閉じる準備ができた</button>`;back.onclick=()=>{screen='portal';render()};app.querySelectorAll('[data-cue]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.cue);if(cues.includes(i))cues=cues.filter(x=>x!==i);else if(cues.length<3)cues.push(i);renderFragments()});if(cues.length===3)close.onclick=()=>{screen='dark';render()}}
function renderDark(){const w=world(),r=w.routes[route],parts=cues.map(i=>w.fragments[i][1]);app.innerHTML=`<section class="dark-screen"><div class="tiny">ここから先は画面を見ない</div><h2>${r[0]}</h2><p>${r[1]}<br><br>${parts.join('。')}。<br><br>この3つだけ持って、あとは好きに続きを見てください。</p><div class="dim">途中で筋書きが変わってもOK。うまく想像できなくてもOK。眠ってしまったら、そのままで成功です。</div><button class="primary finish-btn" id="finish">画面を伏せる</button></section>`;finish.onclick=complete}
function complete(){const was=doneToday(),w=world(),p=place();if(!was){state.history.push({date:TODAY(),place:p,route:w.routes[route][0]});state.history=state.history.slice(-12);state.lastCompleted=TODAY();state.nights+=1;save()}screen='done';render()}
function renderDone(){const next=world().landmarks[Math.min(state.nights,world().landmarks.length-1)];app.innerHTML=`<section class="dark-screen"><div class="tiny">GOOD NIGHT</div><h2>続きは、明日の夜。</h2><p>アプリはここで終わりです。今夜はさっきの入口から、好きなところまで進んでください。</p><div class="dim">次に開く場所：<strong>${next}</strong><br>今は見なくて大丈夫。</div><button class="secondary" id="home" style="margin-top:24px">ホームへ戻る</button></section>`;home.onclick=()=>{screen='home';render()}}
function renderSettings(){const w=world();app.innerHTML=`${top('<button class="icon-btn" id="back">戻る</button>')}<p class="eyebrow">世界の設定</p><h2 class="screen-title">今は「${w.name}」に通っています。</h2><p class="screen-copy">世界を変えると、今までの夜の記録はこの端末から消えます。</p><div class="stack"><button class="secondary" id="reset">別の世界を選び直す</button><button class="quiet" id="clear">この世界の進行だけ最初から</button></div>`;back.onclick=()=>{screen='home';render()};reset.onclick=()=>{if(confirm('世界を選び直しますか？')){state={world:null,nights:0,lastCompleted:null,history:[]};save();screen='intro';render()}};clear.onclick=()=>{if(confirm('進行を最初からに戻しますか？')){state.nights=0;state.lastCompleted=null;state.history=[];save();screen='home';render()}}}
render();
})();
</script></body></html>
