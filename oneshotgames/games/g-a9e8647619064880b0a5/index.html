<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>あと1回だけ</title><style>body{margin:0;background:#111827;color:#f9fafb;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.g{width:min(92vw,480px);text-align:center}.rep{font-size:76px;margin:18px}.bar{height:20px;background:#374151;border-radius:12px;overflow:hidden}.fill{height:100%;width:0;background:#22c55e;transition:.18s}button{width:100%;padding:20px;border:0;border-radius:16px;background:#22c55e;color:#052e16;font-size:22px;font-weight:900}.card{background:#1f2937;border-radius:20px;padding:22px}</style><main class="g"><div class="card"><h1>あと1回だけ</h1><p>10回だけタップ。回数が進むほど応援が変わる。終わったら本当に体を1回動かしてみよう。</p><div class="bar"><div class="fill" id="fill"></div></div><div class="rep" id="rep">0</div><h2 id="cheer">最初の1回がいちばん重い。</h2><button id="tap">1 REP</button></div></main><script>const fill=document.querySelector('#fill'),rep=document.querySelector('#rep'),cheer=document.querySelector('#cheer'),tap=document.querySelector('#tap');const C=['まず1回。','もう始まってる。','3回できた。','半分が見えた。','あと少し。','ここから勢い。','7回。止めない。','残り2。','最後の1回。','完了。今なら本物の1回もできる。'];let n=0,done=false;tap.onclick=()=>{if(done)return location.reload();n++;rep.textContent=n;fill.style.width=n*10+'%';cheer.textContent=C[n-1];tap.style.transform='scale(.98)';setTimeout(()=>tap.style.transform='',90);if(n>=10){done=true;tap.textContent='もう一度';rep.textContent='🔥'}};</script>
