<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>コーヒー抽出30秒</title><style>body{margin:0;background:#2b2118;color:#fff8ee;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.g{text-align:center;width:min(92vw,460px)}.cup{width:180px;height:150px;background:#f8fafc;border-radius:10px 10px 55px 55px;margin:20px auto;position:relative;overflow:hidden}.coffee{position:absolute;left:0;right:0;bottom:0;height:0;background:#5b321b;transition:.1s}button{width:100%;padding:18px;border:0;border-radius:16px;background:#d97706;color:#fff;font-size:19px;font-weight:800}#gauge{height:16px;background:#6b4f3a;border-radius:10px;overflow:hidden}#needle{height:100%;width:8%;background:#fde68a;transform:translateX(0)}</style><main class="g"><h1>コーヒー抽出30秒</h1><p>針が中央の香りゾーンに来た瞬間だけ注げ。5回成功で最高の一杯。</p><div id="gauge"><div id="needle"></div></div><div class="cup"><div class="coffee" id="coffee"></div></div><p>成功 <b id="score">0</b>/5　苦味 <b id="bitter">0</b>/3</p><button id="pour">注ぐ</button><p id="msg"></p></main><script>const n=document.querySelector('#needle'),c=document.querySelector('#coffee'),s=document.querySelector('#score'),b=document.querySelector('#bitter'),m=document.querySelector('#msg'),p=document.querySelector('#pour');let x=0,d=1,score=0,bad=0,done=false;function end(win){done=true;m.textContent=win?'香りが立った。最高の一杯！':'苦すぎた。抽出やり直し。';p.textContent='もう一度'}p.onclick=()=>{if(done)return location.reload();if(x>43&&x<57){score++;s.textContent=score;m.textContent='いい香り！';c.style.height=(score*20)+'%';if(score===5)end(true)}else{bad++;b.textContent=bad;m.textContent='抽出しすぎ！';if(bad===3)end(false)}};function loop(){if(!done){x+=d*1.5;if(x>=92||x<=0)d*=-1;n.style.transform=`translateX(${x*11}px)`}requestAnimationFrame(loop)}loop();</script>
