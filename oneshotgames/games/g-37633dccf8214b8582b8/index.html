<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ONE LIAR</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.people{display:grid;grid-template-columns:1fr 1fr;gap:8px}.person{text-align:left;min-height:120px}.statement{font-size:13px;font-weight:700;display:block;margin-top:6px}</style></head><body><main class="app"><div class="tag">LOGIC · 30 CASES</div><h1>ONE LIAR</h1><p class="muted">4人のうち1人だけ嘘つき。手がかりと証言を照合し、嘘つきを当てろ。</p><div class="panel"><div class="hud"><span class="pill">CASE <b id="case">1</b>/30</span><span class="pill">SCORE <b id="score">0</b></span></div><p class="card" id="clue"></p><div class="people" id="people"></div><p class="card" id="msg">証言を読んで人物をタップ。</p></div><div class="panel result" id="result"><h2>捜査終了</h2><p id="rx"></p><button id="retry">30問を再挑戦</button></div></main><script>(()=>{const names=['アオ','ベニ','キイ','ミド'],icons=['🧑🏻','👩🏽','🧑🏾','👩🏻'],places=['屋上','食堂','倉庫','中庭','会議室','ロビー'],days=['月曜','火曜','水曜','木曜','金曜'];let c,score,locked;function buildCase(n){const day=days[Math.floor(n/6)],place=places[n%6],liar=(n*3+1)%4,box=(n*5+Math.floor(n/3)+2)%4,drink=(n*7+Math.floor(n/5)+1)%4,hour=9+((n*5+Math.floor(n/2))%9);return{day,place,liar,box,drink,hour}}function make(){locked=false;const x=buildCase(c);clue.textContent=`手がかり：${x.day}の${x.place}。箱を持っていたのは ${names[x.box]}。ジュースを飲んだのは ${names[x.drink]}。犯行時刻は ${x.hour}時。`;people.innerHTML='';const truths=[`${x.day}の${x.place}で起きた`,`箱を持っていたのは${names[x.box]}だ`,`ジュースを飲んだのは${names[x.drink]}だ`,`犯行時刻は${x.hour}時だ`];for(let i=0;i<4;i++){let st=truths[i];if(i===x.liar){if(i===0)st=`${days[(days.indexOf(x.day)+1)%days.length]}の${x.place}で起きた`;if(i===1)st=`箱を持っていたのは${names[(x.box+1)%4]}だ`;if(i===2)st=`ジュースを飲んだのは${names[(x.drink+2)%4]}だ`;if(i===3)st=`犯行時刻は${9+((x.hour-8)%9)}時だ`}let b=document.createElement('button');b.className='person '+(i%2?'alt':'');b.innerHTML=`${icons[i]} ${names[i]}<span class="statement">「${st}」</span>`;b.onclick=()=>guess(i,x.liar);people.appendChild(b)}case.textContent=c+1;msg.textContent='1人だけ手がかりと矛盾している。'}function guess(i,liar){if(locked)return;locked=true;if(i===liar){score++;msg.textContent='✅ 正解。矛盾する証言を発見！'}else msg.textContent=`❌ 違う。嘘つきは ${names[liar]}。`;document.getElementById('score').textContent=score;setTimeout(()=>{c++;if(c>=30)return end();make()},650)}function end(){rx.textContent=`30問中 ${score} 問正解。矛盾を1つずつ照合するほど強くなる。`;result.classList.add('on')}function reset(){c=0;score=0;document.getElementById('score').textContent=0;result.classList.remove('on');make()}retry.onclick=reset;reset()})()</script></body></html>
