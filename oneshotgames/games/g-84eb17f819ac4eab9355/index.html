<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>育つ廃墟</title><style>*{box-sizing:border-box}body{margin:0;background:#101511;color:#eef7e9;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;padding:16px;background:radial-gradient(circle at 50% 0,#304631,#101511 58%)}.top{display:flex;justify-content:space-between;gap:8px}.pill{background:#19241a;border:1px solid #486047;border-radius:999px;padding:8px 10px;font-size:12px}.city{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.zone{min-height:112px;border:1px solid #435448;border-radius:16px;background:#1b251d;padding:10px;position:relative}.zone b{display:block;font-size:12px;color:#b7cdb5}.zone .icons{font-size:28px;line-height:1.4;margin-top:7px}.panel{background:#151f17;border:1px solid #394b3c;border-radius:16px;padding:12px}.history{line-height:1.65;color:#c9d8c5;min-height:74px}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.items button,.card button{border:0;border-radius:13px;padding:11px 5px;background:#496b47;color:white;font-weight:800}.items button.sel{outline:3px solid #d8e979}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#0b0f0cee;padding:24px}.card{max-width:520px;text-align:center}.card h1{font-size:clamp(48px,13vw,76px)}.card p{line-height:1.7;color:#c8d3c5}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div class="pill" id="year">0年</div><div class="pill" id="turn">1 / 10</div><div class="pill" id="stats">森0 人0 機0 信0</div></div><div class="city" id="city"></div><div class="panel"><div class="history" id="history">物を一つ選び、置く場所をタップ。20年後の街を見る。</div><div class="items" id="items"></div></div></main><section class="modal" id="intro"><div class="card"><h1>育つ廃墟</h1><p>無人の街に、20年に一度だけ物を一つ置ける。種、水槽、太陽光パネル、本、像、無線機、薬、道具。場所と過去の選択で未来が変わる。</p><button id="go">200年を始める</button></div></section><section class="modal hidden" id="end"><div class="card"><h1 id="et"></h1><p id="em"></p><button id="again">別の歴史を作る</button></div></section><script>(()=>{'use strict';const zones=['公園','屋上','図書館跡','駅前','病院跡','河川敷'];const its=[['種','🌱'],['水槽','💧'],['太陽光','☀'],['本','📖'],['像','♜'],['無線機','📡'],['薬','✚'],['道具','⚒']];let t=0,sel=0,s={forest:0,people:0,machine:0,faith:0,water:0},placed=[];function render(){city.innerHTML='';zones.forEach((z,i)=>{const d=document.createElement('button');d.className='zone';d.innerHTML=`<b>${z}</b><div class="icons">${placed.filter(p=>p.z===i).map(p=>its[p.i][1]).join(' ')||'·'}</div>`;d.onclick=()=>place(i);city.appendChild(d)});items.innerHTML='';its.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v[1]+' '+v[0];if(i===sel)b.className='sel';b.onclick=()=>{sel=i;render()};items.appendChild(b)});year.textContent=(t*20)+'年';turn.textContent=Math.min(10,t+1)+' / 10';stats.textContent=`森${s.forest} 人${s.people} 機${s.machine} 信${s.faith}`};function place(z){if(t>=10)return;placed.push({i:sel,z});let msg='';if(sel===0){s.forest+=z===0?3:1;s.people+=z===0?1:0;msg=z===0?'公園が森になり、動物と移住者が現れた。':'芽は瓦礫の隙間に根付いた。'}if(sel===1){s.water+=2;s.people+=z===1?2:1;if(z===1&&s.water>3){s.forest+=2;msg='屋上水槽は集落を救ったが、一部が崩れ、低地に湿地が生まれた。'}else msg='水が人を呼び戻した。'}if(sel===2){s.machine+=3;s.people++;msg=s.machine>5?'残ったパネルを継いだ小さな機械文明が動き始めた。':'古い建物に灯りが戻った。'}if(sel===3){s.people+=2;s.faith+=placed.some(p=>p.i===4)?2:0;msg='拾われた本は学校になり、昔の記録は新しい物語として読まれた。'}if(sel===4){s.faith+=3;s.people++;msg=s.faith>5?'像は災害前の記念碑ではなく、守護神として祀られた。':'像は遠くから見える目印になった。'}if(sel===5){s.people+=3;s.machine++;msg='無線に返事があり、遠方から新しい家族が来た。'}if(sel===6){s.people+=3;msg='薬の残り方を学んだ住民が診療所を作った。'}if(sel===7){s.machine+=2;s.people++;s.forest=Math.max(0,s.forest-1);msg='道具で建物が直された。一方、森は少し切り開かれた。'}t++;if(s.forest>=6&&s.people>=3)msg+=' 森と人の境界に木の家が増えている。';if(s.faith>=6&&s.machine>=4)msg+=' 信仰と機械が奇妙に結びついた祭りが生まれた。';history.textContent=`${t*20}年後：${msg}`;render();if(t===10)setTimeout(finish,450)}function finish(){let title='静かな再生都市',desc='瓦礫の隙間に、人と自然が折り合う小さな街が残った。';if(s.forest>=s.people+s.machine){title='森に飲まれた楽園';desc='道路は消えたが、廃ビルは森の崖となり、人はその縁で暮らした。'}else if(s.machine>=7){title='遺物機械都市';desc='災害前の道具をつなぎ直した街は、古い電力を新しい生活へ変えた。'}else if(s.faith>=7){title='記憶を祀る国';desc='置かれた物の意味は忘れられ、物語だけが制度と祭りになった。'}else if(s.people<4){title='人のいない豊かな街';desc='人は戻らなかった。代わりに湿地、鳥、森が都市を使い始めた。'}et.textContent=title;em.textContent=desc+' あなたが置いた10個は回収できない。200年の連鎖だけが残った。';end.classList.remove('hidden')}go.onclick=()=>{intro.classList.add('hidden');render()};again.onclick=()=>{end.classList.add('hidden');t=0;sel=0;s={forest:0,people:0,machine:0,faith:0,water:0};placed=[];history.textContent='物を一つ選び、置く場所をタップ。20年後の街を見る。';render()};render()})();</script></body></html>
