<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NEON ALLEY BRAWL</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.w{width:min(680px,100%);padding:14px}.top{display:flex;justify-content:space-between;font-weight:900}.stage{height:390px;border:2px solid #ffffff24;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(#1b2850 0 52%,#241b2f 52%);box-shadow:inset 0 -80px #0005}.fighter,.enemy{position:absolute;bottom:65px;font-size:58px;transition:.08s}.fighter{left:18%}.enemy{right:18%}.hit{animation:hit .15s}@keyframes hit{50%{transform:translateX(18px) rotate(10deg);filter:brightness(2)}}.flash{position:absolute;inset:0;pointer-events:none}.flash.on{background:#fff3}.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}.bar{height:10px;background:#ffffff20;border-radius:8px;overflow:hidden}.f{height:100%;background:#39e58c}.e{height:100%;background:#ff4d76}.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.ctrl button,.again{border:0;border-radius:18px;min-height:62px;font-weight:950;font-size:16px}.atk{background:#ff3e78;color:#fff}.result{display:none;text-align:center;padding:25px;background:#ffffff0b;border-radius:22px}</style></head><body><main class="w"><div class="top"><span>🌃 NEON ALLEY BRAWL</span><span>STAGE <b id="stageN">1</b>/4</span></div><p>近づいて攻撃。敵の赤い合図が出たら「よける」！</p><section id="game"><div class="bars"><div>YOU<div class="bar"><div id="hp" class="f"></div></div></div><div>ENEMY<div class="bar"><div id="ehp" class="e"></div></div></div></div><div class="stage" id="arena"><div id="flash" class="flash"></div><div id="you" class="fighter">🥊</div><div id="foe" class="enemy">😠</div></div><div class="ctrl"><button id="back">← 下がる</button><button id="attack" class="atk">👊 攻撃</button><button id="dodge">よける ↗</button></div></section><section class="result" id="res"><h2 id="rt"></h2><p id="rs"></p><button class="again" id="again">もう一度</button></section></main><script>(()=>{let my=100,en=100,st=1,dist=110,warning=false,active=true,timer;const draw=()=>{hp.style.width=my+'%';ehp.style.width=en+'%';foe.style.right=(10+dist/4)+'px';stageN.textContent=st};function cue(){if(!active)return;warning=true;foe.textContent='😡';flash.classList.add('on');timer=setTimeout(()=>{if(warning){my-=24;you.classList.add('hit');setTimeout(()=>you.classList.remove('hit'),170);if(my<=0)return end(false)}warning=false;foe.textContent='😠';flash.classList.remove('on');draw();setTimeout(cue,900+Math.random()*1100)},650)}function atk(){if(!active)return;if(dist>45){dist-=22}else{en-=20;foe.classList.add('hit');setTimeout(()=>foe.classList.remove('hit'),150);if(en<=0){if(st===4)return end(true);st++;en=100;dist=110;foe.textContent=['😠','🤖','👹','🦹'][st-1]}}draw()}function dodgeNow(){if(!active)return;if(warning){warning=false;clearTimeout(timer);flash.classList.remove('on');my=Math.min(100,my+5);setTimeout(cue,500)}dist=Math.min(120,dist+18);draw()}function end(win){active=false;clearTimeout(timer);game.style.display='none';res.style.display='block';rt.textContent=win?'路地裏制覇！':'ノックダウン';rs.textContent=`到達 STAGE ${st}。攻撃と回避のリズムを掴もう。`}function reset(){my=en=100;st=1;dist=110;warning=false;active=true;game.style.display='block';res.style.display='none';draw();setTimeout(cue,900)}attack.onclick=atk;back.onclick=()=>{dist=Math.min(120,dist+15);draw()};dodge.onclick=dodgeNow;again.onclick=reset;reset()})();</script></body></html>
