<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SEAFOOD SKY RAID</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.stage{background:linear-gradient(#0b5b7b,#03283e)}</style></head><body><main class="app"><div class="tag">VERTICAL SHOOTER</div><h1>SEAFOOD SKY RAID</h1><p class="muted">画面をドラッグして自機を移動。自動射撃で魚介モンスターを撃ち落とし、60体撃破でクリア。</p><div class="panel"><div class="hud"><span class="pill">KO <b id="ko">0</b>/60</span><span class="pill">HP <b id="hpv">3</b></span></div><div class="stage" id="stage"><canvas id="c"></canvas><div class="overlay" id="intro"><div><div class="big">🚤</div><h2>ドラッグで移動</h2><button id="start">START</button></div></div></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">再出撃</button></div></main><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),stage=document.getElementById('stage');let W,H,p,en,shots,ko,hp,run,last,spawn;function size(){W=stage.clientWidth;H=stage.clientHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();function reset(){p={x:W/2,y:H-55};en=[];shots=[];ko=0;hp=3;run=true;last=0;spawn=0;document.getElementById('ko').textContent=0;document.getElementById('hpv').textContent=3;document.getElementById('result').classList.remove('on');requestAnimationFrame(loop)}function loop(t){if(!run)return;let dt=Math.min(32,t-last||16);last=t;spawn-=dt;if(spawn<0){en.push({x:25+Math.random()*(W-50),y:-30,v:.05+Math.random()*.05,e:['🦀','🦑','🦐','🐡','🐙'][Math.floor(Math.random()*5)]});spawn=420-Math.min(250,ko*3)}if(Math.floor(t/180)%2===0&&(!shots.length||t-shots[shots.length-1].t>150))shots.push({x:p.x,y:p.y-22,t});en.forEach(e=>e.y+=e.v*dt);shots.forEach(s=>s.y-=.28*dt);for(const s of shots)for(const e of en)if(Math.hypot(s.x-e.x,s.y-e.y)<24){s.dead=e.dead=true;ko++;document.getElementById('ko').textContent=ko}shots=shots.filter(s=>!s.dead&&s.y>-20);en=en.filter(e=>{if(e.dead)return false;if(e.y>H+30){hp--;document.getElementById('hpv').textContent=hp;return false}return true});if(ko>=60)return end(true);if(hp<=0)return end(false);x.clearRect(0,0,W,H);for(let i=0;i<35;i++){x.fillStyle='#ffffff25';x.fillRect((i*71+t*.02)%W,(i*47+t*.05)%H,2,6)}x.font='34px sans-serif';en.forEach(e=>x.fillText(e.e,e.x-17,e.y));x.fillStyle='#8fffff';shots.forEach(s=>x.fillRect(s.x-2,s.y,4,14));x.font='42px sans-serif';x.fillText('🚤',p.x-21,p.y);requestAnimationFrame(loop)}function end(win){run=false;document.getElementById('rt').textContent=win?'海域クリア！':'船体損傷！';document.getElementById('rx').textContent=`撃破 ${ko} 体。ドラッグで隙間へ逃げながら自動射撃を当てよう。`;document.getElementById('result').classList.add('on')}function pos(e){const r=c.getBoundingClientRect();p.x=Math.max(22,Math.min(W-22,e.clientX-r.left));p.y=Math.max(35,Math.min(H-25,e.clientY-r.top))}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pos(e)};c.onpointermove=e=>{if(e.buttons)pos(e)};document.getElementById('start').onclick=()=>{document.getElementById('intro').classList.add('hide');reset()};document.getElementById('retry').onclick=reset})()</script></body></html>
