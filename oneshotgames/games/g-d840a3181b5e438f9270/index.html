<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>時間泥棒</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0d14;color:#f7f4ea;font-family:system-ui,sans-serif}.wrap{min-height:100vh;padding:16px 16px 110px;background:radial-gradient(circle at 50% 0,#243047,#0a0d14 55%)}.top{max-width:680px;margin:auto;display:flex;gap:8px;justify-content:space-between}.pill{background:#151b27;border:1px solid #39445d;border-radius:999px;padding:8px 11px;font-size:12px}.board{max-width:680px;margin:14px auto;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:#111722;padding:5px;border-radius:18px}.cell{border-radius:8px;background:#20293a;display:grid;place-items:center;font-size:18px;position:relative}.wall{background:#090c12}.player{outline:3px solid #ffd55b}.shard:after{content:'✦';color:#6deaff}.clock:after{content:'🕰️'}.shadow:after{content:'◼';color:#c54cff}.event:after{content:'!';color:#ff7e6b;font-weight:900}.gate{background:#473c20}.controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,64px);gap:6px}.controls button,.act{border:0;border-radius:14px;background:#26344c;color:white;font-weight:900;font-size:20px;min-height:54px}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}.panel{max-width:680px;margin:auto;background:#121925;border:1px solid #2f3a52;border-radius:18px;padding:13px}.log{min-height:42px;color:#b9c7d9;font-size:13px}.start,.end{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:#080b12ee;padding:24px}.card{max-width:520px;text-align:center}.card h1{font-size:clamp(48px,14vw,78px);line-height:.9;margin:0}.card p{line-height:1.7;color:#c4cfde}.card button{border:0;border-radius:16px;padding:15px 24px;background:#ffd55b;font-weight:900}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div class="pill" id="timer">60.0秒</div><div class="pill" id="loop">LOOP 1</div><div class="pill" id="count">欠片 0/24</div></div><div class="board" id="board"></div><div class="panel"><div class="log" id="log">時計台から始まる。欠片と事件の順番を覚えよう。</div></div></main><div class="controls"><button data-d="u">↑</button><button data-d="l">←</button><button data-d="d">↓</button><button data-d="r">→</button></div><section class="start" id="start"><div class="card"><h1>時間泥棒</h1><p>60秒の「今日」を何度も繰り返す。欠片・鍵・近道はループを越えて残る。影はあなたが動いた時だけ動く。</p><button id="go">今日を取り戻す</button></div></section><section class="end hidden" id="end"><div class="card"><h1>一日を救った</h1><p id="result"></p><button id="again">もう一度</button></div></section><script>(()=>{'use strict';const B=board,T=timer,L=loop,C=count,Log=log;const N=6,clock=35;let pos=35,remain=60,loops=1,run=false,last=0,shards=new Set(),keys=new Set(),shortcuts=new Set(),shadow=0;const shardCells=[2,4,7,10,13,16,19,22,25,28,31,33,1,6,9,12,15,18,21,24,27,30,32,34];const walls=new Set([5,11,17,23]);const gates=new Set([8,20,29]);const events=new Set([3,14,26]);function draw(){B.innerHTML='';for(let i=0;i<36;i++){const d=document.createElement('div');d.className='cell';if(walls.has(i))d.classList.add('wall');if(gates.has(i)&&!shortcuts.has(i))d.classList.add('gate');if(i===clock)d.classList.add('clock');if(shardCells.includes(i)&&!shards.has(i))d.classList.add('shard');if(events.has(i)&&!keys.has('e'+i))d.classList.add('event');if(i===shadow)d.classList.add('shadow');if(i===pos)d.classList.add('player');B.appendChild(d)}C.textContent=`欠片 ${shards.size}/24`;L.textContent='LOOP '+loops}function resetLoop(){loops++;remain=60;pos=clock;shadow=0;Log.textContent='また同じ朝。だが、覚えたことと開いた道は残っている。';draw()}function step(dir){if(!run)return;let r=Math.floor(pos/N),c=pos%N,n=pos;if(dir==='u')r--;if(dir==='d')r++;if(dir==='l')c--;if(dir==='r')c++;if(r<0||r>=N||c<0||c>=N)return;n=r*N+c;if(walls.has(n)){Log.textContent='停止した街の壁。別ルートを探す。';return}if(gates.has(n)&&!shortcuts.has(n)){if(shards.size>=4){shards.delete(shards.values().next().value);shortcuts.add(n);Log.textContent='欠片を1つ使って近道を開通。次のループにも残る。'}else{Log.textContent='扉には時間の欠片が4つ必要。';return}}pos=n;remain-=1.5;if(shardCells.includes(pos)&&!shards.has(pos)){shards.add(pos);Log.textContent='時の欠片を回収。'}if(events.has(pos)&&!keys.has('e'+pos)){keys.add('e'+pos);shortcuts.add((pos+5)%36);Log.textContent='事件の順番を理解した。新しい抜け道が次のループから使える。'}const sr=Math.floor(shadow/N),sc=shadow%N,pr=Math.floor(pos/N),pc=pos%N;shadow+=(Math.abs(pr-sr)>Math.abs(pc-sc)?(pr>sr?N:-N):(pc>sc?1:-1));if(shadow===pos){remain=Math.max(0,remain-8);Log.textContent='時間泥棒の影に触れた。残り時間を奪われた！';shadow=0}if(shards.size>=24&&pos===clock){run=false;result.textContent=`${loops}回のループで24個の欠片を集め、時計台へ帰還した。街の順序を知ったあなたは、奪われた一日を取り戻した。`;end.classList.remove('hidden')}draw()}function tick(ts){if(run){if(last){remain-=Math.min(.05,(ts-last)/1000)}last=ts;T.textContent=remain.toFixed(1)+'秒';if(remain<=0)resetLoop()}requestAnimationFrame(tick)}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>step(b.dataset.d));onkeydown=e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};if(m[e.key])step(m[e.key])};go.onclick=()=>{start.classList.add('hidden');run=true;last=0;draw()};again.onclick=()=>{end.classList.add('hidden');shards.clear();keys.clear();shortcuts.clear();loops=1;remain=60;pos=clock;shadow=0;run=true;draw()};draw();requestAnimationFrame(tick)})();</script></body></html>
