<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ダメ操作選手権</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#d7d7d7;color:#202020;display:grid;place-items:center;padding:16px}.game{width:min(100%,440px);background:#f7f0d7;border:5px double #4a4a4a;border-radius:6px;padding:16px;box-shadow:8px 8px 0 #777}h1{margin:0;font-size:28px}.sub{margin:6px 0 14px}.hud{display:flex;justify-content:space-between;background:#111;color:#9cff57;padding:9px 12px;font-family:monospace;font-weight:900}.stage{height:360px;position:relative;margin:12px 0;background:repeating-linear-gradient(45deg,#f8d66d 0 12px,#eec855 12px 24px);border:3px solid #222;overflow:hidden}.badbtn{position:absolute;min-width:86px;min-height:58px;border:4px outset #ddd;background:#cfcfcf;font-weight:1000;font-size:15px;color:#111;touch-action:manipulation}.badbtn:active{border-style:inset}.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:4px;opacity:0;pointer-events:none}.toast.show{animation:t .6s}@keyframes t{20%,70%{opacity:1}}.goal{font-weight:900;text-align:center;min-height:44px}.action{width:100%;padding:14px;border:3px outset #ddd;background:#dcdcdc;font-weight:1000;font-size:18px}.result{display:none;text-align:center}.result.show{display:block}.hidden{display:none}.big{font-size:54px;font-weight:1000}</style></head><body><main class="game"><section id="intro"><h1>ダメ操作選手権</h1><p class="sub">逃げる「OK」を10回押せ。ミス3回で強制終了。</p><button class="action" id="begin">開始（たぶん）</button></section><section id="play" class="hidden"><div class="hud"><span>HIT <b id="hits">0</b>/10</span><span>MISS <b id="miss">0</b>/3</span></div><div class="stage" id="stage"><button id="badbtn" class="badbtn">OK</button><div id="toast" class="toast">入力を無視しました</div></div><div id="goal" class="goal">OKを押してください。押しにくいです。</div></section><section id="result" class="result"><h1 id="rtitle"></h1><div class="big" id="rank"></div><p id="rtext"></p><button class="action" id="again">もう一度ひどい目に遭う</button></section></main><script>let hit=0,misses=0,running=false;function move(){const maxX=stage.clientWidth-100,maxY=stage.clientHeight-70;badbtn.style.left=Math.max(5,Math.random()*maxX)+'px';badbtn.style.top=Math.max(45,Math.random()*maxY)+'px';const labels=['OK','確定','押す','たぶんOK','はい'];badbtn.textContent=labels[Math.floor(Math.random()*labels.length)]}function start(){hit=0;misses=0;running=true;hits.textContent=0;miss.textContent=0;intro.classList.add('hidden');result.classList.remove('show');play.classList.remove('hidden');goal.textContent='OKを押してください。押しにくいです。';move()}badbtn.onclick=e=>{e.stopPropagation();if(!running)return;hit++;hits.textContent=hit;toast.classList.remove('show');void toast.offsetWidth;toast.textContent=hit===7?'なぜか今だけ成功しました':'入力を受け付けました（珍しい）';toast.classList.add('show');goal.textContent=hit<10?'あと '+(10-hit)+' 回。':'奇跡。';if(hit>=10){end(true);return}move()};stage.onclick=()=>{if(!running)return;misses++;miss.textContent=misses;goal.textContent='そこじゃない。なぜそこを押した。';toast.classList.remove('show');void toast.offsetWidth;toast.textContent='エラー: 指が悪い';toast.classList.add('show');if(misses>=3){end(false);return}move()};function end(win){running=false;play.classList.add('hidden');result.classList.add('show');rtitle.textContent=win?'最低UIを制覇':'強制終了';rank.textContent=win?'S':'F';rtext.textContent=win?'ひどい操作性に勝った。すごい。':'3ミス。最低なゲームの勝ち。'}begin.onclick=start;again.onclick=start</script></body></html>
