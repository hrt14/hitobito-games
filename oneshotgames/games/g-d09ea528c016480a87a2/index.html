<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MILLION YEN RUSH</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{min-height:96px;text-align:left}.money{font-size:34px;font-weight:1000}</style></head><body><main class="app"><div class="tag">SPEND ¥1,000,000</div><h1>MILLION YEN RUSH</h1><p class="muted">60秒以内に予算をできるだけゼロへ。次々出る日用品をタップして買い物。</p><div class="panel"><div class="hud"><span class="pill">TIME <b id="time">60</b></span><span class="pill">残額</span></div><div class="money">¥<span id="money">1,000,000</span></div><div class="shop" id="shop"></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">もう一度爆買い</button></div></main><script>(()=>{const catalog=[['歯ブラシ',180],['牛乳',238],['傘',1980],['炊飯器',32800],['自転車',69800],['ソファ',129000],['高級枕',19800],['洗濯機',148000],['スニーカー',13800],['掃除機',59800],['机',44800],['観葉植物',6800],['コーヒー豆',1680],['布団',36800],['テレビ',179000],['冷蔵庫',248000]];let money,time,timer,run;const shop=document.getElementById('shop');function refill(){shop.innerHTML='';for(let i=0;i<4;i++){let it=catalog[Math.floor(Math.random()*catalog.length)],b=document.createElement('button');b.className='item '+(i%2?'alt':'');b.innerHTML=`${it[0]}<br><b>¥${it[1].toLocaleString()}</b>`;b.onclick=()=>buy(it[1]);shop.appendChild(b)}}function buy(v){if(!run)return;if(v>money)return;money-=v;document.getElementById('money').textContent=money.toLocaleString();refill();if(money===0)end()}function tick(){time--;document.getElementById('time').textContent=time;if(time<=0)end()}function end(){if(!run)return;run=false;clearInterval(timer);document.getElementById('rt').textContent=money<5000?'使い切り名人！':'TIME UP';document.getElementById('rx').textContent=`残額 ¥${money.toLocaleString()}。100万円、日用品だけだと意外と減らない。`;document.getElementById('result').classList.add('on')}function reset(){money=1000000;time=60;run=true;document.getElementById('money').textContent=money.toLocaleString();document.getElementById('time').textContent=time;document.getElementById('result').classList.remove('on');refill();clearInterval(timer);timer=setInterval(tick,1000)}document.getElementById('retry').onclick=reset;reset()})()</script></body></html>
