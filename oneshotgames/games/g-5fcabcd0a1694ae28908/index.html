<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>最弱モンスター防衛戦</title><style>*{box-sizing:border-box}body{margin:0;background:#17121b;color:#fff4e3;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;min-height:100vh;padding:16px;background:radial-gradient(circle at 50% 0,#3b263a,#17121b 60%)}.top{display:flex;justify-content:space-between;gap:7px}.pill{background:#261c29;border:1px solid #654862;border-radius:999px;padding:8px 10px;font-size:12px}.lane{margin:14px 0;border:1px solid #604a5c;border-radius:18px;padding:12px;background:#241a25}.track{height:150px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;align-items:end}.slot{height:120px;border-radius:12px;background:#312434;border:1px dashed #66566a;display:grid;place-items:center;font-size:31px}.slot.active{outline:3px solid #ffd36f}.egg{text-align:center;font-size:48px}.panel{background:#211823;border:1px solid #564255;border-radius:16px;padding:12px}.units{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.units button,.card button,#fight{border:0;border-radius:13px;padding:12px 6px;background:#744f78;color:white;font-weight:900}.units button.sel{outline:3px solid #ffd36f}#fight{width:100%;margin-top:10px;background:#b35a62}.log{min-height:54px;line-height:1.55;color:#dbcddd;margin-top:10px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#100c12ef;padding:22px}.card{text-align:center;max-width:520px}.card h1{font-size:clamp(43px,12vw,72px)}.card p{line-height:1.7;color:#d6c9d5}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div class="pill" id="day">DAY 1 / 30</div><div class="pill" id="eggHp">卵 100</div><div class="pill" id="infamy">悪名 0</div></div><section class="lane"><div class="track" id="track"></div><div class="egg">🥚</div></section><section class="panel"><div class="units" id="units"></div><button id="fight">この配置で迎撃</button><div class="log" id="log">弱い魔物を3体まで配置。連携すると罠になる。</div></section></main><section class="modal" id="intro"><div class="card"><h1>最弱モンスター防衛戦</h1><p>スライム、コウモリ、キノコ、ネズミ。全員、勇者なら一撃。でも組み合わせれば罠になる。30日後に孵る卵を守れ。</p><button id="go">巣を守る</button></div></section><section class="modal hidden" id="end"><div class="card"><h1 id="et"></h1><p id="em"></p><button id="again">別の巣を作る</button></div></section><script>(()=>{'use strict';const U=[['スライム','🟢','濡らす'],['コウモリ','🦇','暗くする'],['冷気キノコ','🍄','凍らす'],['ネズミ','🐀','盗む']];let d=1,hp=100,bad=0,sel=0,slots=[null,null,null,null,null,null],survivors=[3,3,3,3];function render(){day.textContent=`DAY ${d} / 30`;eggHp.textContent='卵 '+Math.max(0,hp);infamy.textContent='悪名 '+bad;track.innerHTML='';slots.forEach((v,i)=>{const b=document.createElement('button');b.className='slot'+(v!==null?' active':'');b.textContent=v===null?'＋':U[v][1];b.onclick=()=>{if(v===null){const count=slots.filter(x=>x!==null).length;if(count<3&&survivors[sel]>0)slots[i]=sel}else slots[i]=null;render()};track.appendChild(b)});units.innerHTML='';U.forEach((u,i)=>{const b=document.createElement('button');b.textContent=`${u[1]} ${u[0]} (${survivors[i]})`;if(i===sel)b.className='sel';b.onclick=()=>{sel=i;render()};units.appendChild(b)})}function battle(){const team=slots.filter(v=>v!==null);if(!team.length){log.textContent='誰も置かなかった。勇者は巣まで直進した。';hp-=20;advance();return}const unique=new Set(team);let power=team.length*8+unique.size*7;const wet=team.includes(0),bat=team.includes(1),ice=team.includes(2),rat=team.includes(3);let combo=[];if(wet&&ice){power+=18;combo.push('濡れた床を凍結')}if(bat&&rat){power+=14;combo.push('暗闇で装備を盗む')}if(wet&&bat){power+=10;combo.push('消灯中の滑る床')}const hero=Math.min(105,18+d*2+bad*1.3);let result='';if(power>=hero){const nonlethal=rat||bat;bad+=nonlethal?1:3;result=`${combo.join('＋')||'弱い魔物の波状妨害'}で討伐隊を${nonlethal?'追い返した':'撃退した'}。`;if(rat)result+=' 装備を一つ盗み、次の侵入を少し弱めた。'}else{const dmg=Math.ceil((hero-power)/3)+5;hp-=dmg;result=`突破された。卵に${dmg}ダメージ。`;const victim=team[Math.floor((d+bad)%team.length)];if(survivors[victim]>0&&d%5===0){survivors[victim]--;result+=` ${U[victim][0]}が1体戻らなかった。`}}log.textContent=result;advance()}function advance(){slots=[null,null,null,null,null,null];if(hp<=0){et.textContent='巣は破られた';em.textContent=`DAY ${d}。最弱の群れはここまでだった。連携を変えれば未来も変わる。`;end.classList.remove('hidden');return}if(d===30){et.textContent='孵化';em.textContent=`伝説の勇者一行をしのぎ、卵は孵った。残存戦力：${survivors.reduce((a,b)=>a+b,0)}体、悪名${bad}。強さではなく連携で30日を守り切った。`;end.classList.remove('hidden');return}d++;if(d===30)log.textContent='最終日。伝説の勇者一行が来る。残った全連携を使え。';render()}fight.onclick=battle;go.onclick=()=>{intro.classList.add('hidden');render()};again.onclick=()=>{end.classList.add('hidden');d=1;hp=100;bad=0;slots=[null,null,null,null,null,null];survivors=[3,3,3,3];render()};render()})();</script></body></html>
