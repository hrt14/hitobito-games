<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>記憶配達人</title><style>*{box-sizing:border-box}body{margin:0;background:#10101a;color:#f6f1ff;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:auto;min-height:100vh;padding:18px;background:radial-gradient(circle at 30% 0,#31244a,#10101a 55%)}.top{display:flex;justify-content:space-between;gap:8px}.pill{font-size:12px;background:#1d1928;border:1px solid #51436a;border-radius:999px;padding:8px 11px}.scene{margin-top:14px;border:1px solid #453b5b;border-radius:22px;padding:20px;background:#181520;min-height:280px}.orb{font-size:64px;text-align:center;filter:drop-shadow(0 0 20px #a184ff)}h1,h2{margin:8px 0}.text{line-height:1.75;color:#d6cce3;min-height:82px}.cargo{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tag{padding:7px 9px;border-radius:999px;background:#2b2340;font-size:12px}.choices{display:grid;gap:8px}.choices button,.card button{border:0;border-radius:14px;padding:13px;background:#7b5dcc;color:white;font-weight:800}.choices button:nth-child(2n){background:#435b98}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#0b0910ee;padding:24px}.card{max-width:520px;text-align:center}.card h1{font-size:clamp(44px,12vw,72px)}.card p{line-height:1.7;color:#d3c8df}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div class="pill" id="chapter">第1章 / 7</div><div class="pill" id="weight">感情重量 0</div><div class="pill" id="town">街の歪み 0</div></div><section class="scene"><div class="orb" id="orb">◉</div><h2 id="title">配達前夜</h2><div class="text" id="text"></div><div class="cargo" id="cargo"></div><div class="choices" id="choices"></div></section></main><section class="modal" id="intro"><div class="card"><h1>記憶配達人</h1><p>記憶は3つまで運べる。悲しみは足を重くし、怒りは危険を呼び、喜びは暗闇を照らす。届ける直前だけ、あなたは中身を変えられる。正解表示はない。</p><button id="go">最初の記憶を受け取る</button></div></section><section class="modal hidden" id="ending"><div class="card"><h1>最後の配達</h1><p id="result"></p><button id="again">別の記憶を運ぶ</button></div></section><script>(()=>{'use strict';const chapters=[['父から娘へ','悲しみ','雨の日、父が娘の傘を黙って差し出した記憶。'],['姉から弟へ','怒り','家を出た夜、扉の向こうで謝れなかった記憶。'],['医師から町へ','喜び','病棟の屋上で皆が初日の出を見た記憶。'],['証人から友人へ','怒り','犯人を見たが、友人を守るため口を閉ざした記憶。'],['老人から少年へ','悲しみ','昔この町に海があったころの記憶。'],['母から家族へ','喜び','食卓で一度だけ全員が笑った記憶。'],['自分から自分へ','空白','失った名前と、配達人になった理由の記憶。']];let ch=0,cargo=[],dist=0,relations=0;function render(){chapter.textContent=`第${ch+1}章 / 7`;town.textContent='街の歪み '+dist;const q=chapters[ch];title.textContent=q[0];text.textContent=q[2];orb.textContent=q[1]==='喜び'?'✦':q[1]==='怒り'?'◆':q[1]==='悲しみ'?'●':'◎';if(cargo.length===3)cargo.shift();cargo.push(q[1]);document.getElementById('cargo').innerHTML=cargo.map(v=>`<span class="tag">${v}</span>`).join('');weight.textContent='感情重量 '+cargo.reduce((n,v)=>n+(v==='悲しみ'?2:v==='怒り'?1:0),0);choices.innerHTML='';[['そのまま届ける',0,1],['一部を消す',1,0],['別の記憶を混ぜる',2,2],['届けず持ち帰る',1,-1]].forEach(([lab,d,r])=>{const b=document.createElement('button');b.textContent=lab;b.onclick=()=>choose(d,r,lab);choices.appendChild(b)})}function choose(d,r,lab){dist+=d;relations+=r;text.textContent=`「${lab}」を選んだ。結果は今は分からない。次の配達先へ。`;choices.innerHTML='';setTimeout(()=>{ch++;if(ch>=7){finish();return}render()},550)}function finish(){const tone=relations>=5?'多くの人は再び話し始めた。':relations<=0?'街には静かな空白が増えた。':'和解と断絶が入り混じる街になった。';const self=dist>=6?'最後に、自分の記憶も改変して届けた。真実より、生きられる物語を選んだ。':'最後に、自分の記憶はそのまま受け取った。痛みごと、自分の名前を取り戻した。';result.textContent=`${tone} ${self} あなたが残した街の歪みは ${dist}。善悪の判定はない。残った関係だけが答えになる。`;ending.classList.remove('hidden')}go.onclick=()=>{intro.classList.add('hidden');render()};again.onclick=()=>{ending.classList.add('hidden');ch=0;cargo=[];dist=0;relations=0;render()}})();</script></body></html>
