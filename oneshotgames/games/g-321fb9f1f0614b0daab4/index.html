<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>あめつぶ下水レスキュー</title><style>body{margin:0;font-family:system-ui;background:#e8fbff;color:#10243a}.app{max-width:540px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:22px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat,.card{background:#fff;border:2px solid #b9ddea;border-radius:18px;padding:12px;text-align:center}.stat{font-size:14px;font-weight:900}.bar{height:10px;background:#d5e0e6;border-radius:99px;margin-top:7px;overflow:hidden}.fill{height:100%;background:#2588dd}.card{padding:24px 18px;box-shadow:0 12px 28px #23465922}.emoji{font-size:62px}.card h2{font-size:30px;margin:8px 0}.card p{font-size:18px;line-height:1.65;color:#294a61}.choices,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices div{border-radius:14px;padding:12px;font-weight:900}.l{background:#ffe5e5;color:#801d1d}.r{background:#dff7e7;color:#16643b}.buttons{margin-top:12px}.buttons button,.overlay button{border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:900;background:#fff;color:#10243a;box-shadow:0 6px 16px #23465922}.buttons button:last-child{background:#dff7e7}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#e8fbfff2;padding:24px;z-index:5}.panel{max-width:420px;text-align:center}.panel h1{font-size:38px}.panel p{font-size:18px;line-height:1.65}.overlay button{background:#55c9f2}.hidden{display:none}</style></head><body><main class="app"><div class="top"><div class="title">☔ あめつぶ下水レスキュー</div><b id="round">1 / 5</b></div><div class="stats"><div class="stat">洪水リスク<div class="bar"><div class="fill" id="flood"></div></div></div><div class="stat">水のきれいさ<div class="bar"><div class="fill" id="clean"></div></div></div><div class="stat">予算<div class="bar"><div class="fill" id="money"></div></div></div></div><section class="card"><div class="emoji" id="emoji"></div><h2 id="q"></h2><p id="desc"></p><div class="choices"><div class="l" id="lc"></div><div class="r" id="rc"></div></div></section><div class="buttons"><button id="left">← 左を選ぶ</button><button id="right">右を選ぶ →</button></div></main><section class="overlay" id="intro"><div class="panel"><div class="emoji">💧</div><h1>雨を安全に海まで届けよう</h1><p>左右どちらかの整備案を選ぶだけ。洪水・水質・予算の3つを見ながら街の下水を完成させよう。</p><button id="start">整備スタート</button></div></section><section class="overlay hidden" id="finish"><div class="panel"><div class="emoji" id="endEmoji"></div><h1 id="endTitle"></h1><p id="endText"></p><button id="retry">もう一度つくる</button></div></section><script>const E=[['🕳️','最初に整備するのは？','古い住宅街では雨の日に水たまりが増えている。','大きな雨水管','小さな分散排水',-22,0,-24,-12,6,-10],['🌳','公園に降った雨は？','一気に下水へ流すか、地面にしみ込ませるか。','すぐ下水へ','雨庭でためる',-8,-3,-6,-17,12,-12],['🧹','道路のごみ対策は？','落ち葉やごみが排水口をふさいでいる。','大型ポンプ','清掃と網かご',-13,0,-22,-10,18,-8],['🏭','汚れた水が混ざりそう！','雨水と汚水をどう扱う？','まとめて流す','分けて処理する',-5,-22,-5,-8,25,-25],['🌊','最後の出口をどうする？','海へ出る直前。大雨にも備えたい。','一直線に放流','貯留池をはさむ',-8,-7,-6,-20,8,-18]];let i=0,s={f:72,c:46,m:100};const $=x=>document.getElementById(x),cl=v=>Math.max(0,Math.min(100,v));function draw(){let e=E[i];$('round').textContent=(i+1)+' / 5';$('emoji').textContent=e[0];$('q').textContent=e[1];$('desc').textContent=e[2];$('lc').textContent='← '+e[3];$('rc').textContent=e[4]+' →';$('flood').style.width=s.f+'%';$('clean').style.width=s.c+'%';$('money').style.width=s.m+'%'}function pick(r){let e=E[i],o=r?8:5;s.f=cl(s.f+e[o]);s.c=cl(s.c+e[o+1]);s.m=cl(s.m+e[o+2]);navigator.vibrate?.(20);if(++i===5)return end();draw()}function end(){let t='大雨パニック',x='🌧️';if(s.f<=28&&s.c>=65){t='しずくの楽園';x='🐳'}else if(s.f<=40&&s.c>=45){t='しっかり下水';x='🌈'}else if(s.m<=12){t='豪華すぎ整備';x='💸'}else if(s.c<35){t='海がしょんぼり';x='🐟'}$('endEmoji').textContent=x;$('endTitle').textContent=t;$('endText').textContent='洪水 '+Math.round(s.f)+' / 水質 '+Math.round(s.c)+' / 予算 '+Math.round(s.m);$('finish').classList.remove('hidden')}$('left').onclick=()=>pick(false);$('right').onclick=()=>pick(true);$('start').onclick=()=>{$('intro').classList.add('hidden');draw()};$('retry').onclick=()=>{i=0;s={f:72,c:46,m:100};$('finish').classList.add('hidden');draw()};draw()</script></body></html>
