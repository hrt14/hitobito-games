<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#c8f4ff"><title>あめつぶ下水レスキュー | OneShotGames</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#dff8ff;color:#15304a}body{touch-action:none}.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;padding:12px 14px max(14px,env(safe-area-inset-bottom));gap:10px;background:linear-gradient(#dcf8ff 0 45%,#c7e8c2 45% 57%,#9a735c 57% 100%)}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-weight:950}.round{font-size:12px;font-weight:900;background:#fff9;border:1px solid #fff;border-radius:999px;padding:6px 10px}.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#fff9;border-radius:14px;padding:8px;text-align:center;font-size:11px;font-weight:900}.bar{height:7px;border-radius:99px;background:#c8d5dc;overflow:hidden;margin-top:5px}.fill{height:100%;width:50%;background:#39a8ff;border-radius:99px;transition:.3s}.scene{position:relative;min-height:0;border-radius:24px;overflow:hidden;background:linear-gradient(#c9f4ff 0 42%,#9ed48e 42% 49%,#79584b 49% 100%);box-shadow:0 10px 28px #406b7c33}.city{position:absolute;inset:0;pointer-events:none}.cloud{position:absolute;top:8%;left:8%;font-size:56px;animation:float 4s ease-in-out infinite}.sea{position:absolute;right:-10%;bottom:0;width:40%;height:26%;background:#5cc9ef;border-radius:50% 0 0 0}.pipe{position:absolute;left:8%;right:25%;bottom:19%;height:18px;background:#557987;border-radius:20px}.drop{position:absolute;font-size:34px;left:16%;bottom:24%;animation:bob 1.5s ease-in-out infinite}.card{position:absolute;left:7%;right:7%;top:24%;min-height:220px;background:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 20px 35px #23465940;display:grid;align-content:center;text-align:center;transition:transform .18s,opacity .18s;user-select:none}.emoji{font-size:54px}.card h2{margin:8px 0 6px;font-size:24px}.card p{margin:0;color:#527083;line-height:1.55}.hint{margin-top:14px;font-size:12px;font-weight:900;color:#7091a5}.choice{position:absolute;top:12px;padding:7px 10px;border-radius:12px;font-size:12px;font-weight:950;opacity:.25}.leftChoice{left:12px;background:#ffe8e8;color:#b44}.rightChoice{right:12px;background:#e4f8ea;color:#27874d}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls button,.overlay button{border:0;border-radius:18px;min-height:56px;font-weight:950;font-size:15px;color:#15304a;background:#fff;box-shadow:0 7px 20px #3b647230}.controls button:last-child{background:#dffbe7;color:#1d7845}.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#dff8fff0;backdrop-filter:blur(8px)}.panel{max-width:420px;text-align:center}.panel .big{font-size:72px}.panel h1{font-size:34px;line-height:1.05;margin:4px 0 12px}.panel p{line-height:1.65;color:#49697b}.overlay button{padding:0 24px;background:#57d3ff;color:#06384c}.hidden{display:none}@keyframes float{50%{transform:translateX(15px)}}@keyframes bob{50%{transform:translateY(-8px)}}</style></head><body><main class="app"><div class="head"><div><div class="title">☔ あめつぶ下水レスキュー</div><div style="font-size:11px;color:#58788a">雨を安全に海まで届けよう</div></div><div class="round" id="round">1 / 5</div></div><div class="meters"><div class="m">洪水リスク<div class="bar"><div class="fill" id="flood"></div></div></div><div class="m">水のきれいさ<div class="bar"><div class="fill" id="clean"></div></div></div><div class="m">予算<div class="bar"><div class="fill" id="money"></div></div></div></div><section class="scene"><div class="city"><div class="cloud">🌧️</div><div class="pipe"></div><div class="sea"></div><div class="drop">💧</div></div><div class="card" id="card"><div class="choice leftChoice" id="lc">左</div><div class="choice rightChoice" id="rc">右</div><div class="emoji" id="emoji">🕳️</div><h2 id="q">どこから整備する？</h2><p id="desc">カードを左右にスワイプして下水計画を決めよう。</p><div class="hint">← 左へスワイプ　｜　右へスワイプ →</div></div><section class="overlay" id="intro"><div class="panel"><div class="big">💧</div><h1>雨つぶを<br>海まで送ろう</h1><p>5回の整備判断で街の下水をつくるゲーム。<br>カードを左右にスワイプ。洪水・水質・予算のバランスで結末が変わる。</p><button id="start">整備スタート</button></div></section><section class="overlay hidden" id="finish"><div class="panel"><div class="big" id="endEmoji">🌊</div><h1 id="endTitle"></h1><p id="endText"></p><button id="retry">もう一度つくる</button></div></section></section><div class="controls"><button id="left">← 左を選ぶ</button><button id="right">右を選ぶ →</button></div></main><script>(()=>{const events=[{e:'🕳️',q:'最初に整備するのは？',d:'古い住宅街では雨の日に水たまりが増えている。',l:'大きな雨水管',r:'小さな分散排水',L:{f:-22,c:0,m:-24},R:{f:-12,c:6,m:-10}},{e:'🌳',q:'公園に降った雨は？',d:'一気に下水へ流すか、地面にしみ込ませるか。',l:'すぐ下水へ',r:'雨庭でためる',L:{f:-8,c:-3,m:-6},R:{f:-17,c:12,m:-12}},{e:'🧹',q:'道路のごみ対策は？',d:'落ち葉やごみが排水口をふさいでいる。',l:'大型ポンプ',r:'清掃と網かご',L:{f:-13,c:0,m:-22},R:{f:-10,c:18,m:-8}},{e:'🏭',q:'汚れた水が混ざりそう！',d:'雨水と汚水をどう扱う？',l:'まとめて流す',r:'分けて処理する',L:{f:-5,c:-22,m:-5},R:{f:-8,c:25,m:-25}},{e:'🌊',q:'最後の出口をどうする？',d:'海へ出る直前。大雨にも備えたい。',l:'一直線に放流',r:'貯留池をはさむ',L:{f:-8,c:-7,m:-6},R:{f:-20,c:8,m:-18}}];const card=document.getElementById('card'),flood=document.getElementById('flood'),clean=document.getElementById('clean'),money=document.getElementById('money'),round=document.getElementById('round'),q=document.getElementById('q'),desc=document.getElementById('desc'),emoji=document.getElementById('emoji'),lc=document.getElementById('lc'),rc=document.getElementById('rc'),intro=document.getElementById('intro'),finish=document.getElementById('finish');let i=0,state,startX=0,drag=false;function reset(){i=0;state={f:72,c:46,m:100};renderMeters();show()}function clamp(v){return Math.max(0,Math.min(100,v))}function renderMeters(){flood.style.width=state.f+'%';flood.style.background=state.f>60?'#ff6b6b':state.f>35?'#ffc857':'#42c985';clean.style.width=state.c+'%';clean.style.background=state.c<35?'#ff6b6b':'#42c985';money.style.width=state.m+'%';money.style.background=state.m<25?'#ff6b6b':'#5aa7ff'}function show(){const x=events[i];round.textContent=`${i+1} / ${events.length}`;emoji.textContent=x.e;q.textContent=x.q;desc.textContent=x.d;lc.textContent='← '+x.l;rc.textContent=x.r+' →';card.style.transform='';card.style.opacity=1}function choose(side){if(i>=events.length)return;const x=events[i],eff=side==='L'?x.L:x.R;state.f=clamp(state.f+eff.f);state.c=clamp(state.c+eff.c);state.m=clamp(state.m+eff.m);card.style.transform=`translateX(${side==='L'?-120:120}px) rotate(${side==='L'?-8:8}deg)`;card.style.opacity=.15;if(navigator.vibrate)navigator.vibrate(20);setTimeout(()=>{renderMeters();i++;if(i>=events.length)end();else show()},190)}function end(){let title,text,em;if(state.f<=28&&state.c>=65){title='しずくの楽園エンド';em='🐳';text='洪水を抑え、水もきれい。雨つぶは安全に海へ到着！街と海の両方が笑顔になった。'}else if(state.f<=40&&state.c>=45){title='しっかり下水エンド';em='🌈';text='大雨にもかなり強く、水質もまずまず。あと少し改善すれば理想の街！'}else if(state.m<=12){title='豪華すぎ整備エンド';em='💸';text='設備は立派だけど予算が空っぽ。次は安く効く対策も組み合わせよう。'}else if(state.c<35){title='海がしょんぼりエンド';em='🐟';text='雨は流れたけれど汚れも海へ。分離処理や清掃で水質を守ろう。'}else{title='大雨パニックエンド';em='🌧️';text='排水が追いつかず街に水があふれた。貯留や浸透を組み合わせると強くなる。'}document.getElementById('endEmoji').textContent=em;document.getElementById('endTitle').textContent=title;document.getElementById('endText').textContent=`洪水 ${Math.round(state.f)} / 水質 ${Math.round(state.c)} / 予算 ${Math.round(state.m)}。${text}`;finish.classList.remove('hidden')}card.addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;card.setPointerCapture?.(e.pointerId)});card.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-startX;card.style.transform=`translateX(${dx}px) rotate(${dx*.035}deg)`;lc.style.opacity=dx<0?Math.min(1,.25+Math.abs(dx)/90):.25;rc.style.opacity=dx>0?Math.min(1,.25+Math.abs(dx)/90):.25});function up(e){if(!drag)return;drag=false;const dx=e.clientX-startX;lc.style.opacity=rc.style.opacity=.25;if(Math.abs(dx)>70)choose(dx<0?'L':'R');else card.style.transform=''}card.addEventListener('pointerup',up);card.addEventListener('pointercancel',()=>{drag=false;card.style.transform=''});document.getElementById('left').onclick=()=>choose('L');document.getElementById('right').onclick=()=>choose('R');document.getElementById('start').onclick=()=>{intro.classList.add('hidden');reset()};document.getElementById('retry').onclick=()=>{finish.classList.add('hidden');reset()};reset()})();</script></body></html>
