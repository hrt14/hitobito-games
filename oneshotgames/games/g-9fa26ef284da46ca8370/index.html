<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>HOOK!</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.sea{height:320px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#b9eaff 0 22%,#1784ad 22%,#06456d)}.float{position:absolute;left:50%;top:110px;font-size:44px}.fish{position:absolute;top:200px;font-size:58px;transition:.08s}.zone{position:absolute;left:15%;right:15%;bottom:20px;height:28px;border:3px solid #fff;border-radius:12px}.marker{position:absolute;top:0;width:16px;height:100%;background:#ffdd57}</style></head><body><main class="app"><div class="tag">TIMING FISHING</div><h1>HOOK!</h1><p class="muted">魚が食いつくと「HIT!」。下のタイミングバーの中央で引き上げろ。5匹釣ればクリア。</p><div class="panel"><div class="hud"><span class="pill">FISH <b id="score">0</b>/5</span><span class="pill">MISS <b id="miss">0</b>/3</span></div><div class="sea"><div class="float" id="float">🎣</div><div class="fish" id="fish">🐟</div><div class="zone"><div class="marker" id="marker"></div></div></div><button id="hook" style="width:100%;margin-top:10px">待つ…</button><p class="card" id="msg">魚が近づいている。</p></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">もう一度釣る</button></div></main><script>(()=>{let score,miss,pos,dir,bite,run,timer;function loop(){if(!run)return;pos+=dir*2.4;if(pos>94||pos<0)dir*=-1;marker.style.left=pos+'%';requestAnimationFrame(loop)}function next(){bite=false;hook.textContent='待つ…';fish.style.left=(-10+Math.random()*70)+'%';msg.textContent='魚が近づいている。';clearTimeout(timer);timer=setTimeout(()=>{bite=true;hook.textContent='HIT! 引き上げる';msg.textContent='今だ！中央で引け！'},700+Math.random()*1500)}function pull(){if(!bite)return;let ok=pos>38&&pos<58;if(ok){score++;document.getElementById('score').textContent=score;msg.textContent='釣れた！ 🎉'}else{miss++;document.getElementById('miss').textContent=miss;msg.textContent='バレた！'}if(score>=5)return end(true);if(miss>=3)return end(false);setTimeout(next,500)}function end(win){run=false;clearTimeout(timer);rt.textContent=win?'大漁！':'今日は渋い';rx.textContent=`釣果 ${score}匹 / ミス ${miss}。HIT後に中央ゾーンを狙おう。`;result.classList.add('on')}function reset(){score=0;miss=0;pos=0;dir=1;run=true;document.getElementById('score').textContent=0;document.getElementById('miss').textContent=0;result.classList.remove('on');next();loop()}hook.onclick=pull;retry.onclick=reset;reset()})()</script></body></html>
