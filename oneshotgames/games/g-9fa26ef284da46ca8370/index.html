<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>HOOK!</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#04131d;color:#fff;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:radial-gradient(circle at 50% -20%,#22586f,#071722 50%,#02080d)}h1{margin:4px 0;font-size:31px}.tag{font-size:11px;font-weight:900;letter-spacing:.16em;color:#79e7ff}.sub{margin:0 0 10px;color:#bdd8e2;font-size:13px}.panel{padding:12px;border:1px solid #ffffff22;border-radius:22px;background:#061a27cc}.hud{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.pill{padding:6px 9px;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:900}.sea{height:54vh;min-height:350px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#baeaf5 0 17%,#4fb8d2 17% 35%,#117096 35% 70%,#084662 70%);box-shadow:inset 0 -70px 100px #001a2788}.sea:before{content:"";position:absolute;left:-10%;top:18%;width:120%;height:28px;border-radius:50%;border-top:4px solid #fff8;animation:wave 2.6s ease-in-out infinite}@keyframes wave{50%{transform:translateX(5%) scaleX(.94)}}.boat{position:absolute;left:9%;top:8%;font-size:48px}.fish{position:absolute;top:53%;font-size:62px;filter:drop-shadow(0 10px 12px #001822);transition:left .35s,transform .25s}.fish.hit{animation:thrash .16s infinite alternate}@keyframes thrash{to{transform:translateY(-8px) rotate(-12deg)}}.line{position:absolute;left:50%;top:24%;width:2px;height:34%;background:#e8fbff99}.zone{position:absolute;left:10%;right:10%;bottom:22px;height:34px;border-radius:12px;background:#001b28aa;border:2px solid #ffffffbb;overflow:hidden}.sweet{position:absolute;left:40%;width:20%;height:100%;background:#64f5b766}.marker{position:absolute;top:0;width:18px;height:100%;border-radius:8px;background:#ffe05b;box-shadow:0 0 14px #ffe05baa}.btn{width:100%;min-height:58px;margin-top:10px;border:0;border-radius:16px;color:#fff;font-weight:950;font-size:18px;background:linear-gradient(135deg,#ff9b32,#ff4769);touch-action:manipulation}.btn:active{transform:scale(.98)}.msg{margin:9px 0 0;padding:10px 12px;border-radius:14px;background:#ffffff0d;font-size:13px;color:#dcecf3}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#092331}.result.on{display:block}.combo{color:#ffe16b}</style></head><body><main class="app"><div class="tag">TIMING FISHING</div><h1>HOOK!</h1><p class="sub">HIT後、黄色マーカーを緑ゾーンで止める。連続成功で魚が大きく、バーが速くなる。</p><section class="panel"><div class="hud"><span class="pill">FISH <b id="score">0</b>/7</span><span class="pill">MISS <b id="miss">0</b>/3</span><span class="pill combo">COMBO <b id="combo">0</b></span></div><div class="sea"><div class="boat">🚤</div><div class="line"></div><div class="fish" id="fish">🐟</div><div class="zone"><div class="sweet"></div><div class="marker" id="marker"></div></div></div><button class="btn" id="hook">魚を待つ…</button><p class="msg" id="msg">水面を見てHITを待とう。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">もう一度釣る</button></section></main><script>(()=>{let score,miss,combo,pos,dir,bite,run,timer,raf;const fish=document.getElementById('fish'),marker=document.getElementById('marker'),hook=document.getElementById('hook'),msg=document.getElementById('msg');function loop(){if(!run)return;pos+=dir*(2.2+combo*.18);if(pos>96||pos<0){dir*=-1;pos=Math.max(0,Math.min(96,pos))}marker.style.left=pos+'%';raf=requestAnimationFrame(loop)}function next(){bite=false;fish.classList.remove('hit');hook.textContent='魚を待つ…';fish.style.left=(8+Math.random()*66)+'%';fish.textContent=['🐟','🐠','🐡'][Math.floor(Math.random()*3)];fish.style.transform=`scale(${1+combo*.05})`;msg.textContent='水面を見てHITを待とう。';clearTimeout(timer);timer=setTimeout(()=>{if(!run)return;bite=true;fish.classList.add('hit');hook.textContent='HIT! 引き上げる';msg.textContent='今だ！緑ゾーンで止めろ！'},650+Math.random()*1400)}function pull(){if(!run)return;if(!bite){msg.textContent='まだ食っていない。待とう。';return}bite=false;fish.classList.remove('hit');let ok=pos>39&&pos<61;if(ok){score++;combo++;document.getElementById('score').textContent=score;document.getElementById('combo').textContent=combo;msg.textContent=combo>=3?`PERFECT! ${combo}連続！`:'釣れた！'}else{miss++;combo=0;document.getElementById('miss').textContent=miss;document.getElementById('combo').textContent=0;msg.textContent='バレた！次は中央を狙おう。'}if(score>=7)return end(true);if(miss>=3)return end(false);setTimeout(next,520)}function end(win){run=false;clearTimeout(timer);cancelAnimationFrame(raf);rt.textContent=win?'大漁フィニッシュ！':'今日は渋い';rx.textContent=`釣果 ${score}匹 / ミス ${miss}。連続成功で難度も得点感も上がる。`;result.classList.add('on')}function reset(){score=0;miss=0;combo=0;pos=0;dir=1;bite=false;run=true;['score','miss','combo'].forEach(id=>document.getElementById(id).textContent=0);result.classList.remove('on');next();loop()}hook.onclick=pull;retry.onclick=reset;reset()})()</script></body></html>
