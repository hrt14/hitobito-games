<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>絶望工場 絶望勤務</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:#141414;color:#eee;display:grid;place-items:center;padding:14px}.game{width:min(100%,460px);background:#262626;border:2px solid #555;border-radius:22px;padding:16px;box-shadow:0 20px 60px #0009}h1{margin:0;font-size:30px;color:#ffcf32}.sub{margin:6px 0 14px;color:#bbb}.hud{display:flex;gap:7px}.chip{flex:1;background:#0d0d0d;border:1px solid #555;padding:8px;text-align:center;font-weight:900}.meter{height:13px;background:#090909;border:1px solid #555;margin:10px 0;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf32,#ff7332,#ff334f)}.factory{height:330px;position:relative;overflow:hidden;border:3px solid #080808;background:repeating-linear-gradient(90deg,#303030 0 42px,#292929 42px 84px)}.belt{position:absolute;left:0;right:0;bottom:42px;height:80px;background:repeating-linear-gradient(90deg,#111 0 22px,#1e1e1e 22px 44px);border-top:6px solid #666;border-bottom:6px solid #666;animation:belt .8s linear infinite}@keyframes belt{to{background-position:44px 0}}.box{position:absolute;left:50%;top:92px;transform:translateX(-50%);width:150px;height:120px;background:#8c6239;border:8px solid #5b3c20;display:grid;place-items:center;text-align:center;font-weight:1000;font-size:21px;box-shadow:8px 8px 0 #0008}.stamp{position:absolute;right:12px;top:10px;color:#ffcf32;font:900 13px monospace}.flash{position:absolute;inset:0;pointer-events:none;opacity:0}.flash.ok{animation:fok .25s}.flash.ng{animation:fng .25s}@keyframes fok{50%{opacity:.25;background:#66ff88}}@keyframes fng{50%{opacity:.3;background:#ff334f}}.controls{display:flex;gap:10px;margin-top:12px}.controls button{flex:1;padding:16px;border:0;border-radius:12px;font-size:19px;font-weight:1000}.ship{background:#5ad67a;color:#102514}.trash{background:#ee4d5f;color:#fff}.msg{text-align:center;min-height:44px;font-weight:900;padding-top:10px}.action{width:100%;padding:14px;border:0;border-radius:14px;background:#ffcf32;color:#17120b;font-size:18px;font-weight:1000}.result{display:none;text-align:center}.result.show{display:block}.hidden{display:none}.big{font-size:60px;font-weight:1000;color:#ffcf32}</style></head><body><main class="game"><section id="intro"><h1>絶望工場 絶望勤務</h1><p class="sub">25秒の夜勤。良品は出荷、不良品は廃棄。ミスで絶望ゲージが100になると即退勤。</p><button id="begin" class="action">勤務開始</button></section><section id="play" class="hidden"><div class="hud"><div class="chip">処理 <b id="done">0</b></div><div class="chip">連勤 <b id="combo">0</b></div><div class="chip">TIME <b id="tm">25.0</b></div></div><div class="meter"><i id="bar"></i></div><div id="factory" class="factory"><div class="stamp">第13ライン</div><div class="belt"></div><div id="box" class="box"></div><div id="flash" class="flash"></div></div><div class="controls"><button id="trash" class="trash">廃棄</button><button id="ship" class="ship">出荷</button></div><div id="msg" class="msg">品質表示を見て仕分けろ。</div></section><section id="result" class="result"><h1 id="rtitle"></h1><div id="big" class="big"></div><p id="rtext"></p><button id="again" class="action">再出勤</button></section></main><script>const items=[['良品','good'],['合格','good'],['検品済','good'],['正常','good'],['ひび割れ','bad'],['欠け','bad'],['異音あり','bad'],['色違い','bad'],['要再検査','bad'],['ラベル逆','bad']];let left=25,processed=0,chain=0,best=0,despair=0,current,running=false,timer,lastAt=0;const box=document.getElementById('box'),msg=document.getElementById('msg'),flash=document.getElementById('flash');function hud(){done.textContent=processed;combo.textContent=chain;tm.textContent=left.toFixed(1);bar.style.width=despair+'%'}function next(){current=items[Math.floor(Math.random()*items.length)];box.textContent=current[0];box.style.transform='translateX(-50%) scale(.9)';requestAnimationFrame(()=>box.style.transform='translateX(-50%) scale(1)');lastAt=performance.now()}function start(){left=25;processed=0;chain=0;best=0;despair=0;running=true;intro.classList.add('hidden');result.classList.remove('show');play.classList.remove('hidden');clearInterval(timer);next();hud();timer=setInterval(()=>{left-=.1;if(left<=0){left=0;end(true)}hud()},100)}function judge(choice){if(!running)return;const good=choice===current[1],speed=Math.max(0,1800-(performance.now()-lastAt));flash.className='flash';void flash.offsetWidth;if(good){processed++;chain++;best=Math.max(best,chain);despair=Math.max(0,despair-3);msg.textContent=speed>850?'爆速処理 +残業適性':'正解。次。';flash.classList.add('ok')}else{chain=0;despair=Math.min(100,despair+22);left=Math.max(0,left-1);msg.textContent='誤出荷！ 絶望 +22 / 1秒没収';flash.classList.add('ng')}hud();if(despair>=100){end(false);return}next()}ship.onclick=()=>judge('good');trash.onclick=()=>judge('bad');function end(survive){if(!running)return;running=false;clearInterval(timer);play.classList.add('hidden');result.classList.add('show');const score=processed*100+best*25-Math.round(despair*4);big.textContent=Math.max(0,score);rtitle.textContent=survive?'夜勤終了':'絶望退勤';rtext.textContent='処理 '+processed+'箱 / 最大連勤 '+best+' / 絶望 '+Math.round(despair)+'%。'+(processed>=22?'工場長が次のシフト表を持ってきた。':processed>=14?'生還。十分働いた。':'表示を一瞬確認してから押すと生存率が上がる。')}begin.onclick=start;again.onclick=start</script></body></html>
