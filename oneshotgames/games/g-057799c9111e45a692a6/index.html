<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>REMOTE RUSH</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#101326,#23133a);color:#fff;min-height:100vh;display:flex;justify-content:center}.wrap{width:min(720px,100%);padding:18px 16px 28px}.hud{display:flex;justify-content:space-between;gap:8px;font-weight:800}.card{margin-top:14px;background:#ffffff12;border:1px solid #ffffff22;border-radius:24px;padding:18px;box-shadow:0 20px 50px #0005}.tv{height:120px;border:8px solid #222;border-radius:18px;background:linear-gradient(135deg,#35d0ff,#8b5cf6);display:grid;place-items:center;font-size:30px;font-weight:900;text-align:center}.hint{text-align:center;margin:14px 0 8px;color:#d9d6ff}.track{position:relative;height:58px;background:#090b16;border-radius:30px;margin:20px 0;border:2px solid #ffffff25}.mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#ffffff44}.remote{position:absolute;top:9px;width:66px;height:40px;border-radius:12px;background:#eee;color:#111;display:grid;place-items:center;font-size:20px;box-shadow:0 6px 12px #0008;transition:left .08s linear}.faces{display:flex;justify-content:space-between;font-size:28px}.bar{height:10px;background:#ffffff20;border-radius:99px;overflow:hidden;margin:8px 0 16px}.fill{height:100%;background:linear-gradient(90deg,#2dd4bf,#facc15);width:100%}.btn{width:100%;min-height:92px;border:0;border-radius:24px;background:linear-gradient(180deg,#ff4f87,#db2777);color:white;font-size:28px;font-weight:1000;box-shadow:0 8px 0 #8d174d;touch-action:manipulation}.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #8d174d}.result{display:none;text-align:center;padding:14px}.result h2{font-size:34px;margin:8px}.retry{border:0;border-radius:18px;padding:14px 24px;font-size:18px;font-weight:900;background:#fff;color:#24113b}.shake{animation:shake .2s}@keyframes shake{50%{transform:translateX(6px)}}</style></head><body><main class="wrap"><div class="hud"><span>ROUND <b id="round">1</b>/3</span><span>🏆 <b id="wins">0</b></span></div><section class="card" id="game"><div class="tv" id="tv">チャンネル争奪戦！</div><p class="hint" id="hint">連打してリモコンを自分の側へ！</p><div class="faces"><span>😤 兄</span><span>弟 😠</span></div><div class="track"><div class="mid"></div><div class="remote" id="remote">📺</div></div><div>スタミナ</div><div class="bar"><div class="fill" id="stamina"></div></div><button class="btn" id="pull">リモコンを引っぱる！</button></section><section class="card result" id="result"><div id="emoji" style="font-size:64px">🏆</div><h2 id="resultTitle">勝ち！</h2><p id="resultText"></p><button class="retry" id="retry">もう一戦</button></section></main><script>(()=>{const remote=document.getElementById('remote'),pull=document.getElementById('pull'),staminaEl=document.getElementById('stamina'),roundEl=document.getElementById('round'),winsEl=document.getElementById('wins'),hint=document.getElementById('hint'),tv=document.getElementById('tv'),game=document.getElementById('game'),result=document.getElementById('result');let pos=50,stamina=100,round=1,wins=0,active=true,last=performance.now(),ai=0;function draw(){remote.style.left=`calc(${pos}% - 33px)`;staminaEl.style.width=stamina+'%'}function tap(){if(!active||stamina<8)return;pos-=5.6;stamina-=8;remote.classList.remove('shake');void remote.offsetWidth;remote.classList.add('shake');navigator.vibrate?.(18);draw();check()}function check(){if(pos<=8){finishRound(true)}else if(pos>=92){finishRound(false)}}function finishRound(win){active=false;if(win){wins++;winsEl.textContent=wins;tv.textContent='あなたの番組！';hint.textContent='ナイス奪取！'}else{tv.textContent='相手に取られた！';hint.textContent='次はタイミングよく連打！'}setTimeout(()=>{if(round<3){round++;roundEl.textContent=round;pos=50;stamina=100;active=true;tv.textContent='チャンネル争奪戦！';hint.textContent='連打してリモコンを自分の側へ！';draw()}else end()},900)}function end(){game.style.display='none';result.style.display='block';document.getElementById('emoji').textContent=wins>=2?'🏆':'📺';document.getElementById('resultTitle').textContent=wins>=2?'リモコン王！':'惜しい！';document.getElementById('resultText').textContent=`3ラウンド中 ${wins} 勝。連打だけでなく、スタミナ回復の間も大事！`}function loop(t){if(active){const dt=(t-last)/1000;last=t;stamina=Math.min(100,stamina+18*dt);ai+=dt;if(ai>.18+Math.random()*.28){pos+=2.2+Math.random()*3.2;ai=0}draw();check()}else last=t;requestAnimationFrame(loop)}pull.addEventListener('pointerdown',tap);document.getElementById('retry').onclick=()=>location.reload();draw();requestAnimationFrame(loop)})();</script></body></html>
