<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BEAT PULSE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2a145d,#090816 65%);color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.w{width:min(620px,100%);padding:14px}.top{display:flex;justify-content:space-between;font-weight:950}.board{height:430px;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(#11132a,#241449);border:2px solid #ffffff25}.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}.lane{border-right:1px solid #ffffff1f;position:relative}.line{position:absolute;left:0;right:0;bottom:68px;height:5px;background:#fff}.note{position:absolute;left:50%;transform:translateX(-50%);width:58px;height:24px;border-radius:99px;background:linear-gradient(90deg,#5ee7ff,#d86cff);box-shadow:0 0 18px #66e8ff}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.pads button,.again{min-height:66px;border:0;border-radius:17px;font-size:20px;font-weight:950}.msg{text-align:center;min-height:28px;font-weight:900}.result{display:none;text-align:center;padding:28px;background:#ffffff0d;border-radius:22px}</style></head><body><main class="w"><div class="top"><span>🎵 BEAT PULSE</span><span>SCORE <b id="score">0</b></span></div><p>ラインに重なったノーツのレーンをタップ！20ノーツで終了。</p><section id="game"><div class="board" id="board"><div class="lanes"><div class="lane"></div><div class="lane"></div><div class="lane"></div></div><div class="line"></div></div><div id="msg" class="msg">READY...</div><div class="pads"><button data-l="0">🟦</button><button data-l="1">🟪</button><button data-l="2">🟧</button></div></section><section id="res" class="result"><h2 id="rt"></h2><p id="rs"></p><button class="again" id="again">リプレイ</button></section></main><script>(()=>{let notes=[],scoreN=0,spawned=0,judged=0,active=true,last=0;const laneX=[16.7,50,83.3];function spawn(){if(!active||spawned>=20)return;const l=Math.floor(Math.random()*3),e=document.createElement('div');e.className='note';e.dataset.l=l;e.style.left=laneX[l]+'%';e.style.top='-25px';board.appendChild(e);notes.push({e,l,y:-25});spawned++}function tap(l){if(!active)return;let best=null,bd=999;for(const n of notes)if(n.l===l){const d=Math.abs(n.y-330);if(d<bd){bd=d;best=n}}if(best&&bd<55){const pts=bd<20?100:60;scoreN+=pts;msg.textContent=pts===100?'PERFECT!':'GOOD!';best.e.remove();notes.splice(notes.indexOf(best),1);judged++;score.textContent=scoreN}else msg.textContent='MISS';check()}function check(){if(judged>=20){active=false;game.style.display='none';res.style.display='block';rt.textContent=scoreN>=1500?'RHYTHM MASTER!':scoreN>=1000?'GREAT BEAT!':'KEEP THE BEAT!';rs.textContent=`20ノーツで ${scoreN} 点`}}function reset(){notes.forEach(n=>n.e.remove());notes=[];scoreN=spawned=judged=0;active=true;score.textContent='0';game.style.display='block';res.style.display='none';msg.textContent='READY...'}document.querySelectorAll('[data-l]').forEach(b=>b.onpointerdown=()=>tap(+b.dataset.l));again.onclick=reset;setInterval(spawn,700);function loop(t){const dt=Math.min(30,t-last||16);last=t;if(active){for(const n of [...notes]){n.y+=dt*.24;n.e.style.top=n.y+'px';if(n.y>420){n.e.remove();notes.splice(notes.indexOf(n),1);judged++;msg.textContent='MISS';check()}}}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop)})();</script></body></html>
