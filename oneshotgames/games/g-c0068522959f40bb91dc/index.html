<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>INFRA CITY BUILDER | OneShotGames</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,sans-serif;background:#101721;color:#eef5ff}body{overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(#182433,#101721)}.top{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-weight:950}.stats{display:flex;gap:6px;font-size:11px;font-weight:900}.pill{background:#26364a;border-radius:999px;padding:6px 9px}.city{position:relative;min-height:0;margin:0 10px 8px;border-radius:24px;overflow:hidden;background:linear-gradient(#9ac7df 0 44%,#69875c 44% 100%);box-shadow:0 15px 35px #0008}.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:3px;padding:7px}.cell{position:relative;border:1px solid #ffffff38;background:#49664a99;border-radius:8px;display:grid;place-items:center;font-size:30px;transition:.2s}.cell.road{background:#555}.cell.water{background:#396d91}.cell.park{background:#4e8a4d}.cell.power{background:#8b7542}.pop{position:absolute;inset:auto 10px 10px 10px;background:#111a25dd;border-radius:16px;padding:10px;font-size:12px;line-height:1.45}.toolbar{padding:8px 10px max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tool{border:0;border-radius:16px;min-height:58px;background:#243449;color:#fff;font-weight:900}.tool.active{outline:3px solid #6ee7ff;background:#315470}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#101721ee;z-index:8;padding:24px}.panel{max-width:420px;text-align:center}.panel h1{font-size:38px;margin:8px 0}.panel p{line-height:1.6;color:#c7d6e8}.panel button{border:0;border-radius:18px;padding:15px 24px;background:#6ee7ff;color:#0b2233;font-weight:950;font-size:16px}.hidden{display:none}</style></head><body><main class="app"><header class="top"><div><div class="title">🏙️ INFRA CITY BUILDER</div><div style="font-size:11px;color:#a9bbcf">8ターンで支持される街をつくれ</div></div><div class="stats"><span class="pill" id="money">💰100</span><span class="pill" id="support">❤️50</span><span class="pill" id="turn">1/8</span></div></header><section class="city"><div class="grid" id="grid"></div><div class="pop" id="msg">下の設備を選び、空き地をタップして配置。</div><section class="overlay" id="intro"><div class="panel"><div style="font-size:64px">🏗️</div><h1>街は、配置で変わる。</h1><p>道路・水道・公園・電力を配置。毎ターン住民が増え、支持率が変化する。8ターン後の市長ランクを競おう。</p><button id="start">市長になる</button></div></section><section class="overlay hidden" id="finish"><div class="panel"><div style="font-size:64px" id="badge">🏅</div><h1 id="rank"></h1><p id="result"></p><button id="retry">もう一度つくる</button></div></section></section><footer class="toolbar"><button class="tool active" data-type="road">🛣️<br>道路 10</button><button class="tool" data-type="water">💧<br>水道 18</button><button class="tool" data-type="park">🌳<br>公園 14</button><button class="tool" data-type="power">⚡<br>電力 20</button></footer></main><script>(()=>{const costs={road:10,water:18,park:14,power:20},icons={road:'🛣️',water:'💧',park:'🌳',power:'⚡'},grid=document.getElementById('grid'),msg=document.getElementById('msg'),moneyEl=document.getElementById('money'),supportEl=document.getElementById('support'),turnEl=document.getElementById('turn'),finish=document.getElementById('finish');let cells=[],selected='road',money=100,support=50,turn=1;function setup(){grid.innerHTML='';cells=[];for(let i=0;i<16;i++){const c=document.createElement('button');c.className='cell';c.dataset.i=i;c.onclick=()=>place(c);grid.appendChild(c);cells.push(c)}}function reset(){money=100;support=50;turn=1;selected='road';document.querySelectorAll('.tool').forEach((b,i)=>b.classList.toggle('active',i===0));setup();render();msg.textContent='設備を選び、空き地をタップして配置。'}function place(c){if(c.dataset.type){msg.textContent='ここにはすでに設備があります。';return}const cost=costs[selected];if(money<cost){msg.textContent='予算不足。安い設備を選ぼう。';return}money-=cost;c.dataset.type=selected;c.classList.add(selected);c.textContent=icons[selected];if(navigator.vibrate)navigator.vibrate(20);advance()}function advance(){const count=t=>cells.filter(c=>c.dataset.type===t).length;const road=count('road'),water=count('water'),park=count('park'),power=count('power');let delta=0;if(road)delta+=2;if(water)delta+=3;if(power)delta+=3;if(park)delta+=4;delta+=Math.min(6,Math.min(road,water,power)*2);if(power>water+2)delta-=4;if(road>park+3)delta-=3;support=Math.max(0,Math.min(100,support+delta-3));money+=8+Math.min(8,road*2);msg.textContent=`住民評価 ${delta-3>=0?'+':''}${delta-3}。次の区画を整備しよう。`;turn++;render();if(turn>8)setTimeout(end,300)}function render(){moneyEl.textContent='💰'+money;supportEl.textContent='❤️'+Math.round(support);turnEl.textContent=Math.min(turn,8)+'/8'}function end(){const count=t=>cells.filter(c=>c.dataset.type===t).length;const diversity=['road','water','park','power'].filter(t=>count(t)>0).length;let rank='見習い市長',badge='🥉';if(support>=75&&diversity===4){rank='都市デザイン市長',badge='🏆'}else if(support>=62){rank='人気市長',badge='🥇'}else if(support>=50){rank='堅実市長',badge='🥈'}document.getElementById('rank').textContent=rank;document.getElementById('badge').textContent=badge;document.getElementById('result').textContent=`最終支持率 ${Math.round(support)}%。道路・水道・公園・電力の組み合わせで街の評価が変わる。`;finish.classList.remove('hidden')}document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));msg.textContent=`${b.textContent.replace(/\s+/g,' ')}を配置中。空き地をタップ。`});document.getElementById('start').onclick=()=>{document.getElementById('intro').classList.add('hidden');reset()};document.getElementById('retry').onclick=()=>{finish.classList.add('hidden');reset()};reset()})();</script></body></html>
