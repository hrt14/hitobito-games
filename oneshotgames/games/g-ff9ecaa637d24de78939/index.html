<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ねこ王決定戦</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#f7efe5,#d9ecff);color:#14213d;min-height:100vh;display:grid;place-items:center}.game{width:min(92vw,430px);background:#fff;border:4px solid #14213d;border-radius:24px;padding:18px;box-shadow:0 12px 0 #14213d}h1{font-size:28px;margin:0 0 6px}.sub{margin:0 0 14px}.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cat{border:3px solid #14213d;border-radius:18px;padding:14px;text-align:center;background:#fff8d6}.face{font-size:64px}.stat{font-weight:800;margin:6px 0}.bar{height:12px;background:#ddd;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#ff7b00}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}button{font:inherit;font-weight:800;border:3px solid #14213d;border-radius:14px;padding:13px 8px;background:#8ecae6;box-shadow:0 4px 0 #14213d}button:active{transform:translateY(3px);box-shadow:0 1px 0 #14213d}.log{min-height:54px;margin:14px 0 0;padding:10px;border-radius:12px;background:#eef6ff;font-weight:700}.result{display:none;text-align:center}.result.show{display:block}.hidden{display:none}.result button{width:100%;margin-top:10px;background:#ffb703}</style></head><body><main class="game"><section id="play"><h1>ねこ王決定戦</h1><p class="sub">3ラウンド先取。攻撃・ガード・必殺を読み合え！</p><div class="arena"><div class="cat"><div class="face">😼</div><b>あなた</b><div class="stat">HP <span id="php">5</span></div><div class="bar"><i id="pbar" style="width:100%"></i></div></div><div class="cat"><div class="face">😾</div><b>ライバル</b><div class="stat">HP <span id="ehp">5</span></div><div class="bar"><i id="ebar" style="width:100%"></i></div></div></div><div class="actions"><button data-a="attack">ネコパンチ</button><button data-a="guard">まるまりガード</button><button data-a="special">必殺ジャンプ</button></div><div class="log" id="log">技を選んで勝負！</div></section><section id="result" class="result"><h1 id="rtitle"></h1><div class="face" id="rface"></div><p id="rtext"></p><button id="again">もう一戦</button></section></main><script>let p=5,e=5;const acts=['attack','guard','special'];const names={attack:'ネコパンチ',guard:'まるまりガード',special:'必殺ジャンプ'};function resolve(a,b){if(a===b)return[0,0,'互いに様子見！'];if(a==='attack'&&b==='special'||a==='special'&&b==='guard'||a==='guard'&&b==='attack')return[0,2,'読み勝ち！'];return[2,0,'読まれた！']}function draw(){php.textContent=p;ehp.textContent=e;pbar.style.width=(p/5*100)+'%';ebar.style.width=(e/5*100)+'%'}document.querySelectorAll('button[data-a]').forEach(btn=>btn.onclick=()=>{const a=btn.dataset.a,b=acts[Math.floor(Math.random()*3)],r=resolve(a,b);p=Math.max(0,p-r[0]);e=Math.max(0,e-r[1]);log.textContent=`あなた:${names[a]} / 相手:${names[b]} → ${r[2]}`;draw();if(!p||!e)setTimeout(end,350)});function end(){play.classList.add('hidden');result.classList.add('show');const win=e===0;rtitle.textContent=win?'ねこ王に決定！':'王座ならず';rface.textContent=win?'👑😸':'🙀';rtext.textContent=win?'読み合いを制した！':'技の相性を変えて再挑戦しよう。'}again.onclick=()=>{p=e=5;draw();log.textContent='技を選んで勝負！';play.classList.remove('hidden');result.classList.remove('show')}</script></body></html>
