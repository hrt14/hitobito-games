<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>FORTRESS RUSH</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.lane{position:relative;height:320px;border-radius:18px;overflow:hidden;background:linear-gradient(#173450,#0a1727)}.enemy{position:absolute;font-size:34px;transition:.12s}.tower{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:54px}.shot{position:absolute;width:8px;height:18px;background:#7ff;border-radius:5px}</style></head><body><main class="app"><div class="top"><div><div class="tag">DEFENSE · POWER UP</div><h1>FORTRESS RUSH</h1></div><div class="hud"><span class="pill" id="wave">WAVE 1</span><span class="pill" id="power">POWER 1</span></div></div><p class="muted">敵をタップして射撃。倒すほど連射と威力が上がる。城門HPが0になる前に5ウェーブ守れ。</p><div class="panel"><div class="bar"><i id="hp"></i></div><div class="lane" id="lane"><div class="tower">🏰</div></div><button id="fire" style="width:100%;margin-top:10px">画面の敵をタップ / ここで一斉射撃</button></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">もう一度守る</button></div></main><script>(()=>{const lane=document.getElementById('lane'),hp=document.getElementById('hp'),wave=document.getElementById('wave'),power=document.getElementById('power'),res=document.getElementById('result');let H=100,w=1,p=1,k=0,en=[],timer,spawnTimer,waveTotal=0,spawned=0,resolved=0,ended=false;function beginWave(){if(ended)return;if(w>5)return win();waveTotal=3+w;spawned=0;resolved=0;wave.textContent='WAVE '+w;spawn()}function spawn(){if(ended||spawned>=waveTotal)return;const e=document.createElement('div');e.className='enemy';e.textContent=['👾','🧟','👹','🦂'][Math.floor(Math.random()*4)];e.style.left=(8+Math.random()*84)+'%';e.style.top='0px';e.dataset.hp=2+w;e.onclick=()=>hit(e);lane.appendChild(e);en.push(e);spawned++;if(spawned<waveTotal)spawnTimer=setTimeout(spawn,380);else maybeAdvance()}function resolveEnemy(e){if(!e.isConnected)return false;e.remove();en=en.filter(x=>x!==e);resolved++;return true}function maybeAdvance(){if(ended||spawned<waveTotal||resolved<waveTotal)return;w++;k=0;if(w>5)return win();spawnTimer=setTimeout(beginWave,600)}function hit(e){if(ended||!e.isConnected)return;e.dataset.hp=+e.dataset.hp-p;if(+e.dataset.hp<=0){if(!resolveEnemy(e))return;k++;if(k%4===0){p++;power.textContent='POWER '+p}maybeAdvance()}else{e.style.transform='scale(.8)';setTimeout(()=>{if(e.isConnected)e.style.transform=''},90)}}function tick(){if(ended)return;for(const e of [...en]){let y=parseFloat(e.style.top)||0;y+=.6+w*.12;e.style.top=y+'px';if(y>255){if(!resolveEnemy(e))continue;H-=10;hp.style.width=Math.max(0,H)+'%';if(H<=0)return lose();maybeAdvance()}}timer=requestAnimationFrame(tick)}function burst(){[...en].forEach(hit)}function lose(){if(ended)return;ended=true;clearTimeout(spawnTimer);cancelAnimationFrame(timer);show('城門突破…','POWER '+p+'まで成長。敵を早めに集中攻撃しよう。')}function win(){if(ended)return;ended=true;clearTimeout(spawnTimer);cancelAnimationFrame(timer);show('防衛成功！','5ウェーブ防衛。最終POWER '+p+'。')}function show(a,b){document.getElementById('rt').textContent=a;document.getElementById('rx').textContent=b;res.classList.add('on')}function reset(){clearTimeout(spawnTimer);cancelAnimationFrame(timer);lane.querySelectorAll('.enemy').forEach(x=>x.remove());H=100;w=1;p=1;k=0;en=[];waveTotal=0;spawned=0;resolved=0;ended=false;hp.style.width='100%';wave.textContent='WAVE 1';power.textContent='POWER 1';res.classList.remove('on');beginWave();tick()}document.getElementById('fire').onclick=burst;document.getElementById('retry').onclick=reset;reset()})()</script></body></html>
