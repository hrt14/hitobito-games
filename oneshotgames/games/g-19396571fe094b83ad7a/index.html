<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DO NOT PRESS?</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}body{transition:.3s}.world{height:300px;display:grid;place-items:center;position:relative;overflow:hidden}.red{width:170px;height:170px;border-radius:50%;font-size:24px;background:radial-gradient(circle at 35% 30%,#ff8195,#d10e2e 45%,#700619);box-shadow:0 18px 0 #530411,0 28px 50px #0008}.weird{position:absolute;font-size:28px;animation:float 2s infinite alternate}@keyframes float{to{transform:translateY(-20px) rotate(25deg)}}</style></head><body><main class="app"><div class="tag">CURIOSITY GAME</div><h1>DO NOT PRESS?</h1><p class="muted">押すたび世界がおかしくなる。20回目に何が起こるか見届ける？</p><div class="panel"><div class="hud"><span class="pill">PRESSES <b id="n">0</b>/20</span><span class="pill" id="state">NORMAL</span></div><div class="world" id="world"><button class="red" id="press">押すな</button></div></div><div class="panel result" id="result"><h2>世界の端まで押した。</h2><p id="rx"></p><button id="retry">世界を初期化</button></div></main><script>(()=>{const w=document.getElementById('world'),b=document.getElementById('press'),res=document.getElementById('result'),things=['🦆','🪐','🍜','🧦','👁️','🐸','📺','🍉','🛸','🧠'];let n=0;function hit(){n++;document.getElementById('n').textContent=n;document.getElementById('state').textContent=['NORMAL','ODD','VERY ODD','WHY','REALITY ERROR'][Math.min(4,Math.floor(n/4))];document.body.style.filter=`hue-rotate(${n*23}deg)`;document.body.style.transform=`rotate(${(n%5-2)*.25}deg)`;let d=document.createElement('div');d.className='weird';d.textContent=things[n%things.length];d.style.left=(5+Math.random()*80)+'%';d.style.top=(5+Math.random()*75)+'%';w.appendChild(d);b.textContent=['押すな','本当に？','やめとく？','まだ押す？','世界が見てる'][n%5];if(n===7)w.style.transform='scaleX(-1)';if(n===12)w.style.borderRadius='50%';if(n>=20){res.classList.add('on');document.getElementById('rx').textContent='20回押した結果、世界は意味を失った。でもボタンだけはまだ押せそうだった。'}}function reset(){n=0;[...w.querySelectorAll('.weird')].forEach(x=>x.remove());document.body.style.filter='';document.body.style.transform='';w.style.transform='';w.style.borderRadius='';b.textContent='押すな';document.getElementById('n').textContent=0;document.getElementById('state').textContent='NORMAL';res.classList.remove('on')}b.onclick=hit;document.getElementById('retry').onclick=reset})()</script></body></html>
