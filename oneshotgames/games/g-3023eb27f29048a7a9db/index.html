<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>猫撫でNo.1</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#fff1d7,#ffd9c8);color:#33241f;display:grid;place-items:center;padding:14px}.game{width:min(100%,450px);background:#fffaf2;border:2px solid #8b6855;border-radius:28px;padding:16px;box-shadow:0 18px 50px #7a4a302d}h1{margin:0;font-size:30px}.sub{margin:6px 0 12px;color:#76574a}.hud{display:flex;gap:8px}.chip{flex:1;background:#5a4138;color:#fff;border-radius:14px;padding:9px;text-align:center;font-weight:900}.wish{margin:10px 0;text-align:center;font-size:18px;font-weight:1000}.arena{height:380px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 50% 22%,#fff,#f7e3cd 70%);touch-action:none;user-select:none}.cat{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:280px;height:270px}.body{position:absolute;left:65px;top:105px;width:165px;height:120px;border-radius:55% 45% 45% 55%;background:#b97c4b;border:4px solid #70452e}.head{position:absolute;left:25px;top:45px;width:110px;height:105px;border-radius:48%;background:#c98b56;border:4px solid #70452e}.ear{position:absolute;top:18px;width:42px;height:55px;background:#c98b56;border:4px solid #70452e;transform:rotate(28deg);clip-path:polygon(50% 0,100% 100%,0 100%)}.ear.e1{left:31px}.ear.e2{left:92px;transform:rotate(-28deg)}.eye{position:absolute;top:82px;width:8px;height:11px;background:#222;border-radius:50%}.eye.a{left:55px}.eye.b{left:95px}.mouth{position:absolute;left:75px;top:106px;width:12px;height:7px;border-bottom:2px solid #5a3828;border-radius:50%}.tail{position:absolute;right:2px;top:125px;width:90px;height:36px;border-radius:50%;border:18px solid #b97c4b;border-left-color:transparent;transform:rotate(-26deg)}.zone{position:absolute;border:3px dashed transparent;border-radius:24px;pointer-events:none}.zone.on{border-color:#ff6f91;background:#ff9eb72a;box-shadow:0 0 22px #ff7cae88}.zhead{left:20px;top:38px;width:120px;height:115px}.zback{left:95px;top:98px;width:145px;height:105px}.belly{position:absolute;left:105px;top:155px;width:105px;height:62px;border-radius:50%;background:#d9a27755;pointer-events:none}.heart{position:absolute;font-size:28px;pointer-events:none;animation:rise .7s forwards}@keyframes rise{to{transform:translateY(-55px) scale(1.4);opacity:0}}.msg{text-align:center;font-weight:900;min-height:44px;padding-top:9px}.action{width:100%;padding:14px;border:0;border-radius:15px;background:#5a4138;color:#fff;font-size:18px;font-weight:1000}.result{display:none;text-align:center}.result.show{display:block}.hidden{display:none}.big{font-size:64px;font-weight:1000;color:#c05d78}</style></head><body><main class="game"><section id="intro"><h1>猫撫でNo.1</h1><p class="sub">20秒。猫が今撫でてほしい場所を、指でやさしくスリスリ。お腹としっぽは嫌がるぞ。</p><button id="begin" class="action">撫で始める</button></section><section id="play" class="hidden"><div class="hud"><div class="chip">PURR <b id="score">0</b></div><div class="chip">MOOD <b id="mood">100</b></div><div class="chip">TIME <b id="tm">20.0</b></div></div><div class="wish" id="wish"></div><div id="arena" class="arena"><div class="cat"><div class="ear e1"></div><div class="ear e2"></div><div class="tail"></div><div class="body"></div><div class="head"></div><div class="eye a"></div><div class="eye b"></div><div class="mouth"></div><div class="belly"></div><div id="zh" class="zone zhead"></div><div id="zb" class="zone zback"></div></div></div><div id="msg" class="msg">指を置いて、ゆっくり動かそう。</div></section><section id="result" class="result"><h1 id="rtitle"></h1><div id="big" class="big"></div><p id="rtext"></p><button id="again" class="action">もう一匹撫でる</button></section></main><script>let running=false,down=false,left=20,points=0,m=100,want='head',timer,wishTimer,last=0;const arena=document.getElementById('arena'),zh=document.getElementById('zh'),zb=document.getElementById('zb'),msg=document.getElementById('msg');function hud(){score.textContent=points;mood.textContent=Math.max(0,Math.round(m));tm.textContent=left.toFixed(1)}function pick(){want=Math.random()<.5?'head':'back';wish.textContent=want==='head'?'今は「頭」を撫でてほしい':'今は「背中」を撫でてほしい';zh.classList.toggle('on',want==='head');zb.classList.toggle('on',want==='back')}function start(){running=true;down=false;left=20;points=0;m=100;intro.classList.add('hidden');result.classList.remove('show');play.classList.remove('hidden');clearInterval(timer);clearInterval(wishTimer);pick();hud();timer=setInterval(()=>{left-=.1;if(left<=0){left=0;end()}hud()},100);wishTimer=setInterval(pick,3500)}function local(e){const r=arena.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*450,y:(e.clientY-r.top)/r.height*380}}function zoneAt(p){if(p.x>38&&p.x<165&&p.y>65&&p.y<185)return'head';if(p.x>150&&p.x<330&&p.y>150&&p.y<285)return'back';if(p.x>185&&p.x<300&&p.y>235&&p.y<330)return'belly';if(p.x>330)return'tail';return'none'}function heart(e,good){const r=arena.getBoundingClientRect(),h=document.createElement('span');h.className='heart';h.textContent=good?'♥':'!';h.style.left=(e.clientX-r.left-8)+'px';h.style.top=(e.clientY-r.top-12)+'px';h.style.color=good?'#ef5f83':'#555';arena.appendChild(h);setTimeout(()=>h.remove(),720)}arena.onpointerdown=e=>{if(!running)return;down=true;arena.setPointerCapture(e.pointerId)};arena.onpointerup=()=>down=false;arena.onpointercancel=()=>down=false;arena.onpointermove=e=>{if(!running||!down||Date.now()-last<85)return;last=Date.now();const z=zoneAt(local(e));if(z===want){points+=8;m=Math.min(100,m+1.2);msg.textContent='ゴロゴロ…そこ！';heart(e,true)}else if(z==='belly'||z==='tail'){m-=8;points=Math.max(0,points-5);msg.textContent=z==='belly'?'そこは今じゃない！':'しっぽはやめて！';heart(e,false)}else if(z!=='none'){points+=1;m-=1;msg.textContent='悪くないけど、今は別の場所。'}hud();if(m<=0)end()};function end(){if(!running)return;running=false;down=false;clearInterval(timer);clearInterval(wishTimer);play.classList.add('hidden');result.classList.add('show');big.textContent=points;rtitle.textContent=points>=650&&m>60?'猫撫でNo.1！':m<=0?'猫に逃げられた':'撫で上手';rtext.textContent='PURR '+points+' / MOOD '+Math.max(0,Math.round(m))+'。'+(points>=450?'猫の好みをかなり読めている。':'光っている場所を長めに撫でると伸びる。')}begin.onclick=start;again.onclick=start</script></body></html>
