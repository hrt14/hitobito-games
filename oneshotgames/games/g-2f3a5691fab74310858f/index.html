<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一投必中フィッシング</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#9ed7ff 0 42%,#1479b8 42% 100%);min-height:100vh;color:#10243e;display:grid;place-items:center}.game{width:min(94vw,440px);background:#fff;border-radius:24px;padding:18px;box-shadow:0 12px 30px #003b5c66}h1{margin:0;font-size:28px}.hint{margin:6px 0 12px}.hud{display:flex;justify-content:space-between;font-weight:800}.water{height:330px;position:relative;background:linear-gradient(#44b8e8,#075985);border-radius:18px;overflow:hidden;margin-top:12px;border:4px solid #0b3558}.bobber{position:absolute;left:48%;top:15px;font-size:38px;transition:top .25s}.fish{position:absolute;font-size:42px;filter:drop-shadow(0 3px 1px #003);transition:transform .25s}.meter{height:18px;background:#dde7ed;border-radius:12px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;width:0;background:#ffb703;transition:width .1s}.cast{width:100%;padding:15px;border:0;border-radius:14px;background:#ffb703;color:#14213d;font-size:20px;font-weight:900}.msg{font-weight:800;text-align:center;min-height:48px;margin-top:10px}.result{display:none;text-align:center}.result.show{display:block}.hidden{display:none}</style></head><body><main class="game"><section id="play"><h1>一投必中フィッシング</h1><p class="hint">「今！」と思った瞬間にタップ。魚が浮きに近いほど大物！</p><div class="hud"><span>残り <b id="left">5</b>投</span><span>合計 <b id="score">0</b>cm</span></div><div class="water" id="water"><div class="bobber">🔻</div><div class="fish" id="fish">🐟</div></div><div class="meter"><i id="meter"></i></div><button class="cast" id="cast">今だ！ 釣り上げる</button><div class="msg" id="msg">魚は水中を行ったり来たりします。</div></section><section id="result" class="result"><h1 id="rtitle"></h1><div style="font-size:72px">🎣</div><p id="rtext"></p><button class="cast" id="again">もう5投する</button></section></main><script>let x=20,dir=1,shots=5,total=0,raf;function swim(){x+=dir*.75;if(x>82||x<5)dir*=-1;fish.style.left=x+'%';fish.style.top=(90+Math.sin(x/7)*80)+'px';fish.style.transform=dir>0?'scaleX(1)':'scaleX(-1)';raf=requestAnimationFrame(swim)}function castNow(){if(shots<=0)return;shots--;left.textContent=shots;const bobX=50,dist=Math.abs(x-bobX),cm=Math.max(0,Math.round(82-dist*2.2));meter.style.width=cm+'%';if(cm<18){msg.textContent='逃げた！タイミングが遠い。'}else{total+=cm;score.textContent=total;msg.textContent=cm>=70?`大物！ ${cm}cm！`:`釣れた！ ${cm}cm`;}if(shots===0)setTimeout(end,500)}function end(){cancelAnimationFrame(raf);play.classList.add('hidden');result.classList.add('show');rtitle.textContent=total>=260?'爆釣！':'釣果発表';rtext.textContent=`5投の合計は ${total}cm。${total>=260?'タイミング名人！':'浮きの真下を狙って再挑戦！'}`}cast.onclick=castNow;again.onclick=()=>{shots=5;total=0;left.textContent=5;score.textContent=0;meter.style.width='0';msg.textContent='魚は水中を行ったり来たりします。';result.classList.remove('show');play.classList.remove('hidden');swim()};swim()</script></body></html>
