<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>TRASH MERGE DROP</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#07101a;padding:6px;border-radius:16px}.cell{aspect-ratio:1;border-radius:10px;background:#102338;display:grid;place-items:center;font-size:27px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}</style></head><body><main class="app"><div class="tag">FALLING PUZZLE</div><h1>TRASH MERGE DROP</h1><p class="muted">同じゴミが3つつながるとリサイクルされて消える。列を選んで落とし、山盛りになる前に500点を目指せ。</p><div class="panel"><div class="hud"><span class="pill">SCORE <b id="score">0</b></span><span class="pill">NEXT <b id="next"></b></span></div><div class="board" id="board"></div><div class="controls" id="controls"></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">もう一度分別</button></div></main><script>(()=>{const R=8,C=5,items=['🥫','🧴','📦','📰'],b=document.getElementById('board'),cs=document.getElementById('controls'),res=document.getElementById('result');let g,next,score;for(let i=0;i<R*C;i++){let d=document.createElement('div');d.className='cell';b.appendChild(d)}for(let c=0;c<C;c++){let x=document.createElement('button');x.textContent='▼ '+(c+1);x.onclick=()=>drop(c);cs.appendChild(x)}function render(){[...b.children].forEach((e,i)=>e.textContent=g[Math.floor(i/C)][i%C]||'');document.getElementById('score').textContent=score;document.getElementById('next').textContent=next}function drop(c){let r=R-1;while(r>=0&&g[r][c])r--;if(r<0)return end(false);g[r][c]=next;next=items[Math.floor(Math.random()*items.length)];resolve();render();if(score>=500)end(true)}function resolve(){let gone=new Set;for(let r=0;r<R;r++)for(let c=0;c<C;c++){let v=g[r][c];if(!v)continue;for(const [dr,dc] of [[1,0],[0,1]]){let a=[[r,c]];for(let k=1;k<3;k++){let rr=r+dr*k,cc=c+dc*k;if(rr<R&&cc<C&&g[rr][cc]===v)a.push([rr,cc])}if(a.length===3)a.forEach(x=>gone.add(x.join(',')))}}if(gone.size){gone.forEach(s=>{let[r,c]=s.split(',').map(Number);g[r][c]=null});score+=gone.size*25;for(let c=0;c<C;c++){let vals=[];for(let r=R-1;r>=0;r--)if(g[r][c])vals.push(g[r][c]);for(let r=R-1,i=0;r>=0;r--)g[r][c]=vals[i++]||null}resolve()}}function end(win){document.getElementById('rt').textContent=win?'リサイクル達成！':'山盛り！';document.getElementById('rx').textContent=`最終 ${score} 点。3つ並びを先読みして空きを作ろう。`;res.classList.add('on')}function reset(){g=Array.from({length:R},()=>Array(C).fill(null));next=items[Math.floor(Math.random()*items.length)];score=0;res.classList.remove('on');render()}document.getElementById('retry').onclick=reset;reset()})()</script></body></html>
