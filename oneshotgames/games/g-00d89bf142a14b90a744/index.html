<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>TRASH MERGE DROP</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07120d;color:#f4fff7;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 92px;background:radial-gradient(circle at 50% -12%,#31553c,#0c1b12 44%,#030805)}h1{font-size:30px;margin:4px 0}.tag{font-size:11px;font-weight:900;letter-spacing:.15em;color:#91efaa}.sub{margin:0 0 10px;color:#c4d3c6;font-size:13px}.panel{padding:12px;border-radius:22px;background:#0f2116dd;border:1px solid #ffffff1e;box-shadow:0 22px 60px #0008}.hud{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.pill{padding:6px 9px;border-radius:999px;background:#ffffff0e;font-size:12px;font-weight:900}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;border-radius:18px;background:linear-gradient(#07110b,#030704);box-shadow:inset 0 0 30px #000}.cell{position:relative;aspect-ratio:1;border-radius:10px;background:linear-gradient(145deg,#17301f,#0d1e14);display:grid;place-items:center;font-size:29px;box-shadow:inset 0 0 0 1px #ffffff08;transition:.16s}.cell.hot{animation:pop .24s alternate 2}@keyframes pop{to{transform:scale(1.13);background:#35582f}}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.drop{min-height:48px;border:0;border-radius:12px;color:#fff;font-weight:950;background:linear-gradient(135deg,#2f8e55,#1d6340);touch-action:manipulation}.drop:active{transform:scale(.96)}.nexts{display:flex;gap:8px;align-items:center;margin:8px 0;padding:8px 10px;border-radius:14px;background:#ffffff0b}.nextIcon{font-size:30px}.chain{color:#ffe47d}.msg{margin:9px 0 0;padding:10px;border-radius:14px;background:#ffffff0b;color:#d6e5d8;font-size:13px}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#13291b}.result.on{display:block}.btn{min-height:56px;border:0;border-radius:15px;color:#fff;font-weight:950;background:linear-gradient(135deg,#38a862,#2c7fc2)}</style></head><body><main class="app"><div class="tag">FALLING PUZZLE</div><h1>TRASH MERGE DROP</h1><p class="sub">同じゴミを3つ以上つなげてリサイクル。連鎖で倍率が上がる。800点でクリア。</p><section class="panel"><div class="hud"><span class="pill">SCORE <b id="score">0</b>/800</span><span class="pill chain">CHAIN <b id="chain">0</b></span><span class="pill">BEST MERGE <b id="best">0</b></span></div><div class="nexts"><span>次</span><span class="nextIcon" id="next"></span><span>その次</span><span class="nextIcon" id="after"></span></div><div class="board" id="board"></div><div class="controls" id="controls"></div><p class="msg" id="msg">落とす列を選ぼう。縦・横どちらでも3つで消える。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">もう一度分別</button></section></main><script>(()=>{const R=8,C=5,items=['🥫','🧴','📦','📰'],b=document.getElementById('board'),cs=document.getElementById('controls'),res=document.getElementById('result'),el=id=>document.getElementById(id);let g,next,after,score,chain,best,locked=false;for(let i=0;i<R*C;i++){let d=document.createElement('div');d.className='cell';b.appendChild(d)}for(let c=0;c<C;c++){let x=document.createElement('button');x.className='drop';x.textContent='▼';x.onclick=()=>drop(c);cs.appendChild(x)}function rand(){return items[Math.floor(Math.random()*items.length)]}function render(hot=[]){[...b.children].forEach((e,i)=>{e.textContent=g[Math.floor(i/C)][i%C]||'';e.classList.toggle('hot',hot.includes(i))});el('score').textContent=score;el('chain').textContent=chain;el('best').textContent=best;el('next').textContent=next;el('after').textContent=after}function drop(c){if(locked)return;let r=R-1;while(r>=0&&g[r][c])r--;if(r<0)return end(false);g[r][c]=next;next=after;after=rand();chain=0;resolve()}function matches(){let gone=new Set;for(let r=0;r<R;r++)for(let c=0;c<C;c++){let v=g[r][c];if(!v)continue;let horiz=[[r,c]],vert=[[r,c]];for(let k=1;c+k<C&&g[r][c+k]===v;k++)horiz.push([r,c+k]);for(let k=1;r+k<R&&g[r+k][c]===v;k++)vert.push([r+k,c]);if(horiz.length>=3)horiz.forEach(x=>gone.add(x.join(',')));if(vert.length>=3)vert.forEach(x=>gone.add(x.join(','))) }return gone}function resolve(){let gone=matches();if(!gone.size){render();if(score>=800)end(true);return}locked=true;chain++;best=Math.max(best,gone.size);score+=gone.size*30*chain;let hot=[...gone].map(s=>{let[r,c]=s.split(',').map(Number);return r*C+c});render(hot);msg.textContent=chain>1?`${chain} CHAIN! ×${chain} ボーナス`:`${gone.size}個リサイクル！`;setTimeout(()=>{gone.forEach(s=>{let[r,c]=s.split(',').map(Number);g[r][c]=null});for(let c=0;c<C;c++){let vals=[];for(let r=R-1;r>=0;r--)if(g[r][c])vals.push(g[r][c]);for(let r=R-1,i=0;r>=0;r--)g[r][c]=vals[i++]||null}locked=false;resolve()},230)}function end(win){locked=true;rt.textContent=win?'リサイクル達成！':'山盛り！';rx.textContent=`最終 ${score} 点 / 最大消去 ${best}。次の2個を見て連鎖を組もう。`;res.classList.add('on')}function reset(){g=Array.from({length:R},()=>Array(C).fill(null));next=rand();after=rand();score=0;chain=0;best=0;locked=false;res.classList.remove('on');msg.textContent='落とす列を選ぼう。縦・横どちらでも3つで消える。';render()}retry.onclick=reset;reset()})()</script></body></html>
