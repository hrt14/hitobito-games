<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>右に行け！たぶん。</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{touch-action:none}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto}.hud{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:#171b24;border-bottom:2px solid #2b3140;font-weight:800;font-size:14px}.game{position:relative;overflow:hidden;background:linear-gradient(#76c8ff 0 58%,#d8f3ff 58% 64%,#83c55b 64% 100%)}canvas{display:block;width:100%;height:100%}.msg{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);min-width:220px;max-width:88%;padding:10px 14px;border:3px solid #111;background:#fff;color:#111;font-weight:900;text-align:center;box-shadow:5px 5px 0 #111;opacity:0;transition:opacity .15s}.msg.show{opacity:1}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;background:#11151d;border-top:2px solid #2b3140}.controls button{min-height:58px;border:0;border-radius:14px;font-size:20px;font-weight:950;background:#f1f5f9;color:#111;box-shadow:0 5px 0 #7f8a9a}.controls button:active{transform:translateY(4px);box-shadow:0 1px 0 #7f8a9a}.jump{background:#ffd644!important}.start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,10,14,.88);padding:24px;text-align:center}.panel{max-width:420px}.panel h1{font-size:34px;line-height:1;margin:0 0 12px}.panel p{line-height:1.5;margin:8px 0}.panel button{margin-top:14px;padding:14px 24px;border:0;border-radius:14px;background:#ff4f87;color:#fff;font-size:20px;font-weight:950;box-shadow:0 5px 0 #98294e}.small{font-size:12px;opacity:.78}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span id="score">距離 0m</span><span id="lives">やる気 ♥♥♥</span><span id="goal">ゴール 500m</span></div>
  <div class="game" id="game"><canvas id="c"></canvas><div class="msg" id="msg"></div><div class="start" id="start"><div class="panel"><h1>右に行け！<br>たぶん。</h1><p>横スクロールアクションです。<br><b>右へ進み、穴と謎の物体をジャンプ。</b></p><p>ただし、たまに右が左です。</p><button id="go">とにかく出発</button><p class="small">操作：← → / ジャンプ</p></div></div></div>
  <div class="controls"><button id="left">←</button><button id="jump" class="jump">跳</button><button id="right">→</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),game=document.getElementById('game');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),msg=document.getElementById('msg'),start=document.getElementById('start');
let W=0,H=0,dpr=1,running=false,last=0,world=0,lives=3,reverse=false,nextReverse=170,won=false;
const player={x:110,y:0,w:28,h:36,vx:0,vy:0,onGround:false};
let platforms=[],hazards=[],coins=[];
function resize(){const r=game.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(!running)player.y=H*.55}
addEventListener('resize',resize);resize();
function reset(){world=0;lives=3;reverse=false;nextReverse=140+Math.random()*100;won=false;player.x=110;player.y=H*.45;player.vx=0;player.vy=0;platforms=[];hazards=[];coins=[];for(let i=0;i<22;i++){const x=i*210;platforms.push({x,y:H*.68-(i%4===2?35:0),w:150+(i%3)*25,h:22});if(i>1&&i%3!==0)hazards.push({x:x+120,y:H*.68-20,w:24,h:20,type:i%2});if(i%2===0)coins.push({x:x+75,y:H*.52-(i%3)*22,r:8,taken:false});}running=true;start.classList.add('hidden');updateHud();toast('ゴールは右。たぶん。',1100);last=performance.now();requestAnimationFrame(loop)}
function toast(t,ms=850){msg.textContent=t;msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),ms)}
function updateHud(){scoreEl.textContent='距離 '+Math.max(0,Math.floor(world/8))+'m';livesEl.textContent='やる気 '+('♥'.repeat(lives)||'0');}
const input={left:false,right:false};
function bind(id,key){const b=document.getElementById(id);const on=e=>{e.preventDefault();input[key]=true},off=e=>{e.preventDefault();input[key]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}bind('left','left');bind('right','right');
function jump(){if(running&&player.onGround){player.vy=-520;player.onGround=false;toast(Math.random()<.22?'ジャンプした。えらい。':'ぴょん',350)}}
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.getElementById('go').onclick=reset;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.left=true;if(e.key==='ArrowRight'||e.key==='d')input.right=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){e.preventDefault();jump()}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')input.left=false;if(e.key==='ArrowRight'||e.key==='d')input.right=false});
function respawn(){lives--;updateHud();if(lives<=0){running=false;start.classList.remove('hidden');start.querySelector('h1').innerHTML='やる気が<br>尽きました';start.querySelector('p').innerHTML='到達 '+Math.floor(world/8)+'m。<br>右に行くだけなのに。';document.getElementById('go').textContent='もう一回だけ';return}player.y=H*.35;player.vy=0;world=Math.max(0,world-130);toast('なかったことにします',900)}
function loop(t){if(!running)return;const dt=Math.min(.032,(t-last)/1000||.016);last=t;const wish=(input.right?1:0)-(input.left?1:0);const dir=reverse?-wish:wish;player.vx+=(dir*260-player.vx)*Math.min(1,dt*10);world+=Math.max(0,player.vx)*dt;player.vy+=1300*dt;player.y+=player.vy*dt;player.onGround=false;
if(world>nextReverse){reverse=!reverse;nextReverse=world+170+Math.random()*180;toast(reverse?'⚠ 右と左が入れ替わりました':'↩ 右と左が戻りました',1200)}
const px=world+player.x;
for(const p of platforms){if(px+player.w>p.x&&px<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+18&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true}}
for(const h of hazards){if(px+player.w>h.x&&px<h.x+h.w&&player.y+player.h>h.y&&player.y<h.y+h.h){h.x=-9999;toast(h.type?'謎の三角に負けた':'たぶん石です',600);respawn()}}
for(const c of coins){if(!c.taken&&Math.abs(px-(c.x+c.r))<28&&Math.abs((player.y+18)-c.y)<30){c.taken=true;world+=18;toast('＋謎ポイント',450)}}
if(player.y>H+80)respawn();if(world>=4000&&!won){won=true;running=false;start.classList.remove('hidden');start.querySelector('h1').innerHTML='ゴール！<br>たぶん。';start.querySelector('p').innerHTML='500mを走破しました。<br>得たもの：特になし。';document.getElementById('go').textContent='また右へ行く'}updateHud();draw();if(running)requestAnimationFrame(loop)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#78cfff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';for(let i=0;i<7;i++){const x=((i*190-world*.15)%(W+240))-120,y=45+(i%3)*52;ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.arc(x+28,y+5,22,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const camera=world;ctx.fillStyle='#78b956';ctx.fillRect(0,H*.74,W,H*.26);for(const p of platforms){const x=p.x-camera;if(x<-250||x>W+100)continue;ctx.fillStyle='#4e8434';ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#8dd85c';ctx.fillRect(x,p.y,p.w,6)}for(const h of hazards){const x=h.x-camera;if(x<-50||x>W+50)continue;ctx.fillStyle=h.type?'#a92848':'#555';if(h.type){ctx.beginPath();ctx.moveTo(x,h.y+h.h);ctx.lineTo(x+h.w/2,h.y);ctx.lineTo(x+h.w,h.y+h.h);ctx.fill()}else{ctx.fillRect(x,h.y,h.w,h.h)}}for(const c of coins){if(c.taken)continue;const x=c.x-camera;if(x<-40||x>W+40)continue;ctx.fillStyle='#ffd21f';ctx.beginPath();ctx.arc(x,c.y,c.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6f5400';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('?',x,c.y+3)}ctx.fillStyle='#222';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#fff';ctx.fillRect(player.x+5,player.y+8,5,5);ctx.fillRect(player.x+18,player.y+8,5,5);ctx.fillStyle='#ff4f87';ctx.fillRect(player.x+8,player.y+25,12,4);if(reverse){ctx.fillStyle='rgba(255,45,98,.12)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='900 18px sans-serif';ctx.textAlign='center';ctx.fillText('← 今は右がこっち →',W/2,32)}}
})();
</script>
</body>
</html>
