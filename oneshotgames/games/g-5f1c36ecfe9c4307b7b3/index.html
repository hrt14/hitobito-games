<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>CEO: DON'T CRASH</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}</style></head><body><main class="app"><div class="tag">ABSURD CEO SIM</div><h1>CEO: DON'T CRASH</h1><p class="muted">毎ターン究極の2択。会社を潰さず、時価総額1兆円を目指せ。選択肢はだいたい無茶。</p><div class="panel"><div class="hud"><span class="pill">TURN <b id="turn">1</b></span><span class="pill">CASH <b id="cash">100</b></span></div><div class="big">🏢</div><h2 id="q"></h2><div class="btns"><button id="a"></button><button class="alt" id="b"></button></div><p>時価総額 <b id="cap">100</b> 億円</p><div class="bar"><i id="bar" style="width:1%"></i></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">新会社を設立</button></div></main><script>(()=>{const TARGET=10000,q=[['採用方針','社員を2倍','社員を100倍',18,-38,8,-30],['広告','SNSだけ試す','全広告を停止',12,-25,10,12],['新規事業','小さく実験','いきなり月へ進出',20,-30,-8,-22],['オフィス','席を減らす','全員に城を支給',10,-42,14,-35],['給料','成果連動で上げる','明日から全員10倍',16,-55,-10,-50],['海外展開','1都市で検証','世界196か国同時',20,-28,-8,-20],['製品','顧客10人に聞く','社長の夢だけで量産',14,-22,8,-18],['AI導入','1業務で試す','全社員を今日解雇',18,-48,5,-55],['宇宙','衛星データを買う','自社ロケット100機',12,-45,-4,-44],['会議','30分に短縮','24時間会議',15,-26,9,-24]];let turn,cash,cap;function show(){if(turn>20||cap>=TARGET)return end(cap>=TARGET);let z=q[(turn-1)%q.length];document.getElementById('q').textContent=z[0]+'、どうする？';a.textContent=z[1];b.textContent=z[2];document.getElementById('turn').textContent=turn}function pick(k){let z=q[(turn-1)%q.length],growth=k?z[4]:z[3];cap=Math.max(0,cap*Math.max(0,1+growth/50));cash=Math.max(0,cash+(k?z[6]:z[5]));document.getElementById('cap').textContent=Math.round(cap);document.getElementById('cash').textContent=Math.round(cash);document.getElementById('bar').style.width=Math.min(100,cap/TARGET*100)+'%';turn++;if(cash<=0||cap<=0)return end(false);show()}function end(win){document.getElementById('rt').textContent=win?'1兆円企業！':cap>500?'なんとか存続':'会社終了';document.getElementById('rx').textContent=`時価総額 ${Math.round(cap)}億円 / CASH ${Math.round(cash)}。無茶と成長の境界を見極めよう。`;document.getElementById('result').classList.add('on')}function reset(){turn=1;cash=100;cap=100;document.getElementById('cash').textContent=100;document.getElementById('cap').textContent=100;document.getElementById('bar').style.width='1%';document.getElementById('result').classList.remove('on');show()}a.onclick=()=>pick(0);b.onclick=()=>pick(1);retry.onclick=reset;reset()})()</script></body></html>
