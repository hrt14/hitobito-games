<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>5cm HOUSE QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#15182a;color:#fff}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(#20294c,#15182a)}.top{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.title{font-weight:950}.hud{display:flex;gap:6px;font-size:11px;font-weight:900}.hud span{background:#303a68;border-radius:999px;padding:6px 9px}.game{position:relative}.game canvas{width:100%;height:100%;display:block}.tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#0b1020dd;border:1px solid #ffffff33;border-radius:14px;padding:8px 12px;font-weight:900;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.tip.show{opacity:1}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:#080b18aa}.controls button,.overlay button{border:0;border-radius:18px;min-height:58px;font-size:20px;font-weight:950;color:#fff;background:#354276}.controls #jump{background:linear-gradient(135deg,#635cff,#da4fd4)}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#090b18e8;backdrop-filter:blur(8px);z-index:5;padding:24px}.panel{text-align:center;max-width:420px}.panel h1{font-size:44px;line-height:.95}.panel p{font-size:17px;line-height:1.6;color:#dbe4ff}.overlay button{padding:0 24px;font-size:16px;background:linear-gradient(135deg,#48a8ff,#7358ff,#e94dbd)}.hidden{display:none}</style></head><body><main class="wrap"><header class="top"><div><div class="title">5cm HOUSE QUEST</div><div style="font-size:11px;color:#c8d7ff" id="mission">カギを取って青いドアへ</div></div><div class="hud"><span id="key">KEY 0/1</span><span id="combo">COMBO 0</span><span id="time">0.0s</span></div></header><section class="game" id="box"><canvas id="c"></canvas><div class="tip" id="tip"></div><section class="overlay" id="intro"><div class="panel"><div style="font-size:72px">🧍</div><h1>家が巨大迷宮。</h1><p>← → で走る。JUMPで跳ぶ。光るスイッチ→カギ→青いドアを連続で決めるとコンボが伸びる。</p><button id="start">探検スタート</button></div></section><section class="overlay hidden" id="finish"><div class="panel"><div style="font-size:72px">✨</div><h1>脱出成功!</h1><p id="result"></p><button id="retry">もう一度</button></div></section></section><footer class="controls"><button id="left">◀</button><button id="jump">JUMP</button><button id="right">▶</button></footer></main><script>(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),box=document.getElementById('box'),$=id=>document.getElementById(id);let W,H,dpr,raf,playing=false,start=0,combo=0,lastEvent=0,keys={l:false,r:false};let p,sw,key,door,bridge,parts=[];const plats=[{x:0,y:620,w:420,h:100},{x:520,y:620,w:400,h:100},{x:1010,y:620,w:890,h:100},{x:260,y:510,w:210,h:25},{x:620,y:455,w:170,h:25},{x:870,y:530,w:150,h:25},{x:1180,y:455,w:190,h:25},{x:1450,y:380,w:190,h:25}],world={w:1900,h:720};function resize(){dpr=Math.min(2,devicePixelRatio||1);W=box.clientWidth;H=box.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function reset(){p={x:70,y:560,w:26,h:48,vx:0,vy:0,on:false};sw={x:730,y:430,w:44,h:18,on:false};key={x:1320,y:415,taken:false};door={x:1715,y:520,w:72,h:100};bridge={x:420,y:590,w:100,h:18,on:false};combo=0;lastEvent=0;parts=[];$('key').textContent='KEY 0/1';$('combo').textContent='COMBO 0';$('mission').textContent='光るスイッチを探そう'}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function tip(t){$('tip').textContent=t;$('tip').classList.add('show');clearTimeout(tip.t);tip.t=setTimeout(()=>$('tip').classList.remove('show'),900)}function scoreEvent(label){const now=performance.now();combo=lastEvent&&now-lastEvent<5000?combo+1:1;lastEvent=now;$('combo').textContent='COMBO '+combo;tip(label+'  +COMBO');navigator.vibrate?.([18,20,35])}function burst(px,py,col){for(let i=0;i<22;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*6,vy:(Math.random()-1)*6,a:1,c:col})}function jump(){if(playing&&p.on){p.vy=-12.6;p.on=false;navigator.vibrate?.(15)}}function bind(id,k){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();k==='j'?jump():keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{if(k!=='j')keys[k]=false}))}bind('left','l');bind('right','r');bind('jump','j');function physics(){p.vx+=(keys.r?.72:0)-(keys.l?.72:0);p.vx*=.84;p.vx=Math.max(-6,Math.min(6,p.vx));p.vy=Math.min(14,p.vy+.62);p.x=Math.max(0,Math.min(world.w-p.w,p.x+p.vx));let py=p.y;p.y+=p.vy;p.on=false;for(const q of bridge.on?[...plats,bridge]:plats)if(p.x+p.w>q.x&&p.x<q.x+q.w&&py+p.h<=q.y&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=true}if(p.y>790){p.x=70;p.y=560;p.vx=p.vy=0;combo=0;$('combo').textContent='COMBO 0';tip('落下！コンボリセット')}if(!sw.on&&hit(p,sw)){sw.on=true;bridge.on=true;$('mission').textContent='橋が出た！カギへ';scoreEvent('スイッチON');burst(sw.x,sw.y,'#b888ff')}if(!key.taken&&hit(p,{x:key.x-14,y:key.y-14,w:28,h:28})){key.taken=true;$('key').textContent='KEY 1/1';$('mission').textContent='青いドアへ急げ！';scoreEvent('KEY GET');burst(key.x,key.y,'#ffd85a')}if(hit(p,door)){if(key.taken)end();else tip('カギが必要！')}}function draw(){x.clearRect(0,0,W,H);const cam=Math.max(0,Math.min(world.w-W,p.x-W*.35)),sy=H/world.h;x.save();x.translate(-cam,0);x.scale(1,sy);let g=x.createLinearGradient(0,0,0,720);g.addColorStop(0,'#7485b8');g.addColorStop(.6,'#ddc9ad');g.addColorStop(1,'#8b684d');x.fillStyle=g;x.fillRect(cam,0,W,720);x.fillStyle='#eef0f7';x.fillRect(0,0,1900,145);x.fillStyle='#50392c';for(let q of plats)x.fillRect(q.x,q.y,q.w,q.h);if(bridge.on){x.fillStyle='#efd88a';x.fillRect(bridge.x,bridge.y,bridge.w,bridge.h)}x.fillStyle=sw.on?'#64df8c':'#b887ff';x.fillRect(sw.x,sw.y,sw.w,sw.h);if(!key.taken){x.fillStyle='#ffd74b';x.beginPath();x.arc(key.x,key.y,12,0,7);x.fill();x.fillRect(key.x+8,key.y-3,35,6)}x.fillStyle='#25a8ff';x.fillRect(door.x,door.y,door.w,door.h);x.fillStyle='#ffcb86';x.fillRect(p.x+5,p.y,16,18);x.fillStyle='#665fff';x.fillRect(p.x,p.y+18,p.w,20);x.fillStyle='#25263a';x.fillRect(p.x+3,p.y+38,7,10);x.fillRect(p.x+16,p.y+38,7,10);for(const s of parts){x.globalAlpha=s.a;x.fillStyle=s.c;x.fillRect(s.x,s.y,5,5)}x.globalAlpha=1;x.restore()}function loop(){if(!playing)return;physics();for(const s of parts){s.x+=s.vx;s.y+=s.vy;s.vy+=.2;s.a-=.035}parts=parts.filter(s=>s.a>0);draw();$('time').textContent=((performance.now()-start)/1000).toFixed(1)+'s';raf=requestAnimationFrame(loop)}function begin(){cancelAnimationFrame(raf);reset();start=performance.now();playing=true;$('intro').classList.add('hidden');$('finish').classList.add('hidden');loop()}function end(){playing=false;cancelAnimationFrame(raf);scoreEvent('DOOR OPEN');const sec=((performance.now()-start)/1000).toFixed(1);$('result').textContent=`${sec}秒 / 最大コンボ ${combo}。スイッチ→カギ→ドアを素早くつなぐほど気持ちいい！`;$('finish').classList.remove('hidden')}$('start').onclick=begin;$('retry').onclick=begin;reset();draw()})();</script></body></html>
