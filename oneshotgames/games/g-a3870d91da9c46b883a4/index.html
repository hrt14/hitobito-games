<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1f2440"><title>5cm HOUSE QUEST | OneShotGames</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#15182a;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{touch-action:none}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(#20294c,#15182a)}.top{padding:10px 14px 6px;display:flex;justify-content:space-between;gap:8px;align-items:center}.title{font-weight:950;letter-spacing:.02em}.mission{font-size:12px;color:#dbe5ff}.badge{font-size:11px;font-weight:900;background:#313a67;border:1px solid #59649c;border-radius:999px;padding:6px 9px}.gamebox{position:relative;min-height:0}.gamebox canvas{width:100%;height:100%;display:block}.tip{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(16,18,34,.86);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;opacity:0;transition:.2s}.tip.show{opacity:1}.controls{padding:10px 14px max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:rgba(7,9,20,.66);backdrop-filter:blur(8px)}button{border:0;border-radius:18px;min-height:58px;color:#fff;font-size:22px;font-weight:950;background:linear-gradient(#3b467c,#2d355f);box-shadow:inset 0 1px rgba(255,255,255,.18),0 8px 22px rgba(0,0,0,.25)}button:active{transform:translateY(2px)}#jump{background:linear-gradient(135deg,#6c5cff,#d64ad8)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:rgba(9,11,24,.82);backdrop-filter:blur(10px);z-index:5}.card{max-width:420px;text-align:center}.k{font-size:11px;font-weight:900;letter-spacing:.18em;color:#72e6ff}.card h1{font-size:clamp(40px,12vw,68px);line-height:.9;margin:10px 0}.card p{color:#d9e0f6;line-height:1.6}.card button{margin-top:12px;padding:0 24px;font-size:16px;background:linear-gradient(135deg,#48a8ff,#7358ff,#e94dbd)}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div><div class="title">5cm HOUSE QUEST</div><div class="mission" id="mission">カギを見つけて、青いドアへ</div></div><div class="badge" id="badge">KEY 0/1</div></div><div class="gamebox" id="box"><canvas id="c"></canvas><div class="tip" id="tip"></div><section class="overlay" id="intro"><div class="card"><div class="k">YOU ARE ONLY 5cm TALL</div><h1>家が<br>巨大迷宮。</h1><p>← → で走る。紫ボタンでジャンプ。<br>まずは光るカギを探そう。</p><button id="start">探検スタート</button></div></section><section class="overlay hidden" id="finish"><div class="card"><div class="k">QUEST COMPLETE</div><h1>脱出成功!</h1><p id="result"></p><button id="retry">もう一度探検</button></div></section></div><div class="controls"><button id="left" aria-label="左へ">◀</button><button id="jump" aria-label="ジャンプ">JUMP</button><button id="right" aria-label="右へ">▶</button></div></main><script>(()=>{const cvs=document.getElementById('c'),ctx=cvs.getContext('2d'),box=document.getElementById('box'),mission=document.getElementById('mission'),badge=document.getElementById('badge'),tip=document.getElementById('tip'),intro=document.getElementById('intro'),finish=document.getElementById('finish'),result=document.getElementById('result');let W=0,H=0,dpr=1,raf=0,playing=false,startT=0,keys={l:false,r:false};const world={w:1900,h:720};let p,key,button,door,bridge,particles=[];const plats=[{x:0,y:635,w:420,h:85},{x:520,y:635,w:380,h:85},{x:1030,y:635,w:870,h:85},{x:260,y:520,w:220,h:26},{x:620,y:465,w:170,h:24},{x:870,y:545,w:150,h:24},{x:1170,y:470,w:190,h:24},{x:1450,y:390,w:180,h:24}];function reset(){p={x:70,y:560,w:26,h:48,vx:0,vy:0,on:false,hasKey:false};key={x:1320,y:420,r:13,taken:false};button={x:730,y:440,w:44,h:16,on:false};door={x:1710,y:535,w:74,h:100};bridge={x:420,y:600,w:100,h:18,active:false};particles=[];mission.textContent='カギを見つけて、青いドアへ';badge.textContent='KEY 0/1'}function resize(){dpr=Math.min(2,devicePixelRatio||1);W=box.clientWidth;H=box.clientHeight;cvs.width=W*dpr;cvs.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function say(t){tip.textContent=t;tip.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>tip.classList.remove('show'),1100)}function jump(){if(!playing)return;if(p.on){p.vy=-12.2;p.on=false;if(navigator.vibrate)navigator.vibrate(18)}}function bind(id,k){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='j')jump();else keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{if(k!=='j')keys[k]=false}))}bind('left','l');bind('right','r');bind('jump','j');addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.key===' '||e.key==='ArrowUp')jump()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});function physics(){p.vx+=(keys.r?0.65:0)-(keys.l?0.65:0);p.vx*=0.84;p.vx=Math.max(-5.4,Math.min(5.4,p.vx));p.vy+=0.62;p.vy=Math.min(14,p.vy);p.x+=p.vx;p.x=Math.max(0,Math.min(world.w-p.w,p.x));const prevY=p.y;p.y+=p.vy;p.on=false;const all=bridge.active?[...plats,bridge]:plats;for(const q of all){if(p.x+p.w>q.x&&p.x<q.x+q.w&&prevY+p.h<=q.y&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=true}}if(p.y>world.h+80){p.x=70;p.y=560;p.vx=p.vy=0;say('落ちた！スタート地点へ戻った')}if(!button.on&&hit(p,button)){button.on=true;bridge.active=true;mission.textContent='橋が出た！カギを探そう';say('カチッ！巨大な定規が橋になった');burst(button.x+22,button.y,'#9d7cff')}if(!key.taken){const kb={x:key.x-key.r,y:key.y-key.r,w:key.r*2,h:key.r*2};if(hit(p,kb)){key.taken=true;p.hasKey=true;badge.textContent='KEY 1/1';mission.textContent='カギを持って青いドアへ！';say('カギGET！');burst(key.x,key.y,'#ffd64a')}}if(hit(p,door)){if(p.hasKey)end();else say('ドアはロック中。カギが必要！')}}function burst(x,y,color){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-1)*5,a:1,c:color})}function updateParticles(){for(const s of particles){s.x+=s.vx;s.y+=s.vy;s.vy+=.2;s.a-=.03}particles=particles.filter(s=>s.a>0)}function draw(){ctx.clearRect(0,0,W,H);const cam=Math.max(0,Math.min(world.w-W,p.x-W*.38));ctx.save();ctx.translate(-cam,0);const sy=H/world.h;ctx.scale(1,sy);const grad=ctx.createLinearGradient(0,0,0,world.h);grad.addColorStop(0,'#7183b5');grad.addColorStop(.58,'#d9c5aa');grad.addColorStop(1,'#8c6a4e');ctx.fillStyle=grad;ctx.fillRect(cam,0,W,world.h);ctx.fillStyle='#eef0f7';ctx.fillRect(0,0,1900,145);ctx.fillStyle='#4a342a';for(let x=110;x<1900;x+=520){ctx.fillRect(x,95,42,540);ctx.fillRect(x-75,130,190,28)}ctx.fillStyle='#d85e52';ctx.fillRect(300,480,170,40);ctx.fillStyle='#32425f';ctx.fillRect(580,430,230,38);ctx.fillStyle='#f1d27a';ctx.fillRect(1410,330,250,48);ctx.fillStyle='#5a493f';for(const q of plats){ctx.fillRect(q.x,q.y,q.w,q.h)}if(bridge.active){ctx.fillStyle='#f0d98e';ctx.fillRect(bridge.x,bridge.y,bridge.w,bridge.h);for(let i=0;i<9;i++){ctx.fillStyle='#584b32';ctx.fillRect(bridge.x+10+i*10,bridge.y,2,8)}}ctx.fillStyle=button.on?'#69e38b':'#b887ff';ctx.fillRect(button.x,button.y,button.w,button.h);ctx.fillStyle='#2c2340';ctx.fillRect(button.x+8,button.y-8,button.w-16,8);if(!key.taken){ctx.save();ctx.translate(key.x,key.y);ctx.rotate(Math.sin(performance.now()/400)*.15);ctx.fillStyle='#ffd64a';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.fillRect(7,-3,34,6);ctx.fillRect(31,2,6,11);ctx.fillRect(22,2,6,8);ctx.restore()}ctx.fillStyle='#2fa8ff';ctx.fillRect(door.x,door.y,door.w,door.h);ctx.fillStyle='#173f7a';ctx.fillRect(door.x+9,door.y+10,door.w-18,door.h-10);ctx.fillStyle='#f5d44f';ctx.beginPath();ctx.arc(door.x+56,door.y+50,5,0,7);ctx.fill();ctx.fillStyle='#ffcf8a';ctx.fillRect(p.x+5,p.y,16,18);ctx.fillStyle='#5c6cff';ctx.fillRect(p.x,p.y+17,p.w,20);ctx.fillStyle='#2b2c42';ctx.fillRect(p.x+3,p.y+37,7,11);ctx.fillRect(p.x+16,p.y+37,7,11);ctx.fillStyle='#20233a';ctx.beginPath();ctx.arc(p.x+13,p.y+6,10,Math.PI,Math.PI*2);ctx.fill();for(const s of particles){ctx.globalAlpha=Math.max(0,s.a);ctx.fillStyle=s.c;ctx.fillRect(s.x,s.y,5,5)}ctx.globalAlpha=1;ctx.restore()}function loop(){if(!playing)return;physics();updateParticles();draw();raf=requestAnimationFrame(loop)}function begin(){cancelAnimationFrame(raf);reset();playing=true;startT=performance.now();intro.classList.add('hidden');finish.classList.add('hidden');loop()}function end(){playing=false;cancelAnimationFrame(raf);burst(p.x,p.y,'#72e6ff');draw();const sec=((performance.now()-startT)/1000).toFixed(1);result.textContent=`${sec}秒で巨大な家を攻略。スイッチで橋を作り、カギを見つけてドアを開けた！`;finish.classList.remove('hidden');if(navigator.vibrate)navigator.vibrate([35,35,70])}document.getElementById('start').onclick=begin;document.getElementById('retry').onclick=begin;reset();draw()})();</script></body></html>
