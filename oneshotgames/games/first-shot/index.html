<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07133b"><title>FIRST SHOT | OneShotGames</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07133b;color:white;font-family:Inter,system-ui,-apple-system,sans-serif}.stage{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 45%,#142d78,#07133b 58%,#03091e);touch-action:manipulation}.hud{position:absolute;z-index:3;left:18px;right:18px;bottom:max(22px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.score b,.time b{display:block;font-size:42px;line-height:.9;letter-spacing:-.06em}.score span,.time span{font-size:10px;letter-spacing:.16em;color:#b9c7ef;font-weight:900}.target{position:absolute;width:76px;height:76px;border:8px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.9);box-shadow:0 0 0 13px rgba(11,124,255,.28),0 0 38px rgba(227,38,181,.6);background:radial-gradient(circle,#ffb000 0 13%,#ff5a1f 14% 27%,transparent 28%);cursor:pointer;transition:transform .08s}.target:active{transform:translate(-50%,-50%) scale(.75)}.intro,.finish{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:26px;background:rgba(3,9,30,.78);backdrop-filter:blur(10px)}.card{max-width:430px;text-align:center}.kicker{font-size:11px;letter-spacing:.18em;color:#15d6c5;font-weight:950}.card h1{margin:12px 0;font-size:clamp(52px,13vw,82px);line-height:.87;letter-spacing:-.07em}.card p{color:#c2cef1;line-height:1.7}.card button{margin-top:16px;border:0;border-radius:16px;padding:15px 24px;background:linear-gradient(100deg,#0b7cff,#6f2cff,#e326b5);color:#fff;font-weight:950;font-size:16px;cursor:pointer;box-shadow:0 12px 35px rgba(111,44,255,.35)}.hidden{display:none}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .12s}@keyframes flash{50%{opacity:.12}}</style></head><body><main class="stage" id="stage"><div class="flash" id="flash"></div><button id="target" class="target hidden" aria-label="ターゲット"></button><div class="hud"><div class="score"><span>HITS</span><b id="score">0/10</b></div><div class="time"><span>TIME</span><b id="time">15.0</b></div></div><section class="intro" id="intro"><div class="card"><div class="kicker">ONE SHOT GAME #001</div><h1>FIRST<br>SHOT</h1><p>15秒でターゲットを10回撃ち抜け。<br>考える前にタップ。</p><button id="start">START</button></div></section><section class="finish hidden" id="finish"><div class="card"><div class="kicker">RESULT</div><h1 id="result">CLEAR</h1><p id="resultText"></p><button id="retry">もう一発</button></div></section></main><script>(()=>{const stage=document.getElementById('stage'),target=document.getElementById('target'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),intro=document.getElementById('intro'),finish=document.getElementById('finish'),result=document.getElementById('result'),resultText=document.getElementById('resultText'),flash=document.getElementById('flash');let hits=0,startAt=0,raf=0,playing=false;function move(){const pad=58,w=stage.clientWidth,h=stage.clientHeight;const x=pad+Math.random()*Math.max(20,w-pad*2),y=105+Math.random()*Math.max(20,h-210);target.style.left=x+'px';target.style.top=y+'px'}function tick(){if(!playing)return;const left=Math.max(0,15-(performance.now()-startAt)/1000);timeEl.textContent=left.toFixed(1);if(left<=0){end(false);return}raf=requestAnimationFrame(tick)}function begin(){hits=0;scoreEl.textContent='0/10';timeEl.textContent='15.0';intro.classList.add('hidden');finish.classList.add('hidden');target.classList.remove('hidden');playing=true;startAt=performance.now();move();cancelAnimationFrame(raf);tick()}function end(clear){playing=false;cancelAnimationFrame(raf);target.classList.add('hidden');result.textContent=clear?'CLEAR!':'MISS';const sec=((performance.now()-startAt)/1000).toFixed(2);resultText.textContent=clear?`${sec}秒で10発命中。`: `${hits}/10。もう一発いける。`;finish.classList.remove('hidden')}target.addEventListener('pointerdown',()=>{if(!playing)return;hits++;scoreEl.textContent=hits+'/10';flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');if(navigator.vibrate)navigator.vibrate(18);if(hits>=10){end(true);return}move()});document.getElementById('start').addEventListener('click',begin);document.getElementById('retry').addEventListener('click',begin)})();</script></body></html>
