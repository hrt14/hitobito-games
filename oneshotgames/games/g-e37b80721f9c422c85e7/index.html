<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WHALE FALL―深海に咲く</title><style>*{box-sizing:border-box}body{margin:0;background:#010713;color:#e8fbff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.pill{background:#031426dd;border:1px solid #2b8aa5;border-radius:999px;padding:8px 10px;font-size:11px}.help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(94vw,560px);text-align:center;background:#03111eee;border:1px solid #246a80;border-radius:18px;padding:10px;font-size:13px}.start,.end{position:fixed;z-index:5;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#0d4261,#020814 70%);padding:24px}.card{max-width:540px;text-align:center}.card h1{font-size:clamp(42px,12vw,74px);line-height:.9;margin:0}.card p{line-height:1.75;color:#bfe9f3}.card button,.sonar{border:0;border-radius:16px;padding:15px 24px;background:#55dff2;color:#01222b;font-weight:900;font-size:16px}.hidden{display:none}.sonar{position:fixed;right:16px;bottom:78px;width:76px;height:76px;border-radius:50%;padding:0;background:#0a4054;color:white;border:2px solid #80f4ff}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill" id="depth">0m</div><div class="pill" id="mission">魚群の光輪</div><div class="pill" id="hp">耐久 ●●●</div></div><button class="sonar" id="sonar">SONAR</button><div class="help" id="help">ドラッグ / 矢印キーで探査艇を動かし、SONARで目標を浮かび上がらせる。</div><section class="start" id="start"><div class="card"><h1>WHALE<br>FALL</h1><p>海面から海底まで6層。暗闇をソナーで読み、光・ビーコン・マリンスノーを追って、最後に「死が命を支える場所」へ。</p><button id="go">潜る</button></div></section><section class="end hidden" id="end"><div class="card"><h1>深海に咲く</h1><p id="em"></p><button id="again">もう一度観察する</button></div></section><script>(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),D=depth,M=mission,H=hp,Help=help;let w,h,dpr,p,stage,scan=0,target,phaseHits=0,damage=0,drag=false,finished=false,time=0;const S=[['陽光層：魚群の光輪',450],['薄明層：発光順を再現',850],['漆黒層：ビーコン3基',1400],['深海平原：マリンスノー',2200],['海底：巨大反応を追う',3000],['ホエールフォール',3600]];function fit(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function mk(){target={x:50+Math.random()*(w-100),y:h*.35+Math.random()*h*.45}}function reset(){p={x:w/2,y:100};stage=0;phaseHits=0;damage=0;finished=false;time=0;mk();ui()}function ui(){D.textContent=Math.round(stage*600+(p.y/h)*500)+'m';M.textContent=S[stage][0];H.textContent='耐久 '+('●'.repeat(3-damage)+'○'.repeat(damage))}function advance(){phaseHits=0;stage++;if(stage>=S.length){finished=true;em.textContent='スカベンジャー期、富栄養化期、硫化物依存期、そして骨格の礁。クジラの死は終点ではなく、何十年も続く生態系の始点だった。';end.classList.remove('hidden');return}mk();Help.textContent=stage===5?'SONARで4つの生態相を観察する。':'SONARで目標を見つけて接触する。';ui()}function ping(){scan=1.1}function loop(){time+=.016;ctx.clearRect(0,0,w,h);let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,stage<2?'#0b4e72':'#041626');g.addColorStop(1,'#01040a');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<50;i++){ctx.fillStyle='rgba(190,240,255,.12)';ctx.fillRect((i*83)%w,(i*71+time*15)%h,1,2)}if(!finished){if(scan>0){scan-=.016;const r=(1-scan/1.1)*Math.max(w,h);ctx.strokeStyle='rgba(100,240,255,'+(scan/.9)+')';ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();ctx.fillStyle=stage===5?'#d5ffd2':'#82f7ff';ctx.beginPath();ctx.arc(target.x,target.y,stage===5?16:10,0,7);ctx.fill()}ctx.fillStyle='#9cf8ff';ctx.beginPath();ctx.moveTo(p.x,p.y-14);ctx.lineTo(p.x-12,p.y+12);ctx.lineTo(p.x+12,p.y+12);ctx.closePath();ctx.fill();if(Math.hypot(p.x-target.x,p.y-target.y)<30){phaseHits++;mk();if(stage===2){Help.textContent='ビーコン '+phaseHits+'/3';if(phaseHits>=3)advance()}else if(stage===5){Help.textContent='生態相 '+phaseHits+'/4 を観察';if(phaseHits>=4)advance()}else if(stage===1){Help.textContent='発光パターン '+phaseHits+'/3';if(phaseHits>=3)advance()}else if(stage===3){Help.textContent='採取 '+phaseHits+'/4';if(phaseHits>=4)advance()}else advance()}ui()}requestAnimationFrame(loop)}sonar.onclick=ping;c.onpointerdown=e=>{drag=true;p.x=e.clientX;p.y=e.clientY};c.onpointermove=e=>{if(drag){p.x=e.clientX;p.y=e.clientY}};onpointerup=()=>drag=false;onkeydown=e=>{const s=20;if(e.key==='ArrowLeft')p.x-=s;if(e.key==='ArrowRight')p.x+=s;if(e.key==='ArrowUp')p.y-=s;if(e.key==='ArrowDown')p.y+=s;if(e.key===' ')ping();p.x=Math.max(20,Math.min(w-20,p.x));p.y=Math.max(60,Math.min(h-85,p.y))};go.onclick=()=>{start.classList.add('hidden');reset()};again.onclick=()=>{end.classList.add('hidden');reset()};onresize=fit;fit();reset();loop()})();</script></body></html>
