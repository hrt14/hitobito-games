<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一歩だけ未来視</title><style>*{box-sizing:border-box}body{margin:0;background:#09121c;color:#eefbff;font-family:system-ui,sans-serif}.wrap{max-width:650px;margin:auto;min-height:100vh;padding:16px 16px 130px;background:radial-gradient(circle at 50% 0,#18344e,#09121c 60%)}.top{display:flex;justify-content:space-between;gap:7px}.pill{background:#102334;border:1px solid #31516a;border-radius:999px;padding:8px 10px;font-size:12px}.grid{margin:14px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;aspect-ratio:1;background:#0d1b29;border-radius:18px;padding:6px}.cell{border-radius:9px;background:#294257;display:grid;place-items:center;font-size:24px}.void{background:#03070a}.trap{box-shadow:inset 0 0 0 2px #f25c72}.core{background:#68562e}.exit{background:#265c49}.player{outline:3px solid #74f5ff}.panel{background:#0e2030;border:1px solid #2b4a60;border-radius:16px;padding:12px}.preview{color:#9defff;min-height:42px}.controls{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,64px);gap:6px}.controls button{border:0;border-radius:14px;min-height:54px;background:#25425d;color:white;font-size:19px;font-weight:900}.controls button:first-child{grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}.future{position:fixed;right:14px;bottom:90px;border:0;border-radius:50%;width:80px;height:80px;background:#9c6dff;color:white;font-weight:900}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#06101aee;padding:22px}.card{text-align:center;max-width:500px}.card h1{font-size:clamp(44px,12vw,72px)}.card p{line-height:1.7;color:#c9deeb}.card button{border:0;border-radius:14px;padding:14px 22px;background:#73eaff;font-weight:900}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div class="pill" id="lv">1 / 30</div><div class="pill" id="moves">手数 0</div><div class="pill" id="collapse">崩壊 0%</div></div><div class="grid" id="grid"></div><div class="panel"><div class="preview" id="preview">核◆を取り、出口へ。未来視は次の一手だけ見える。</div></div></main><button class="future" id="future">未来視</button><div class="controls"><button data-d="u">↑</button><button data-d="l">←</button><button data-d="d">↓</button><button data-d="r">→</button></div><section class="modal" id="intro"><div class="card"><h1>一歩だけ未来視</h1><p>行動を選ぶ前に「未来視」を使うと、次の一手の罠と崩落を2秒だけ確認できる。ただし見るたび世界の外周が壊れていく。</p><button id="go">遺跡へ</button></div></section><section class="modal hidden" id="end"><div class="card"><h1 id="et">突破</h1><p id="em"></p><button id="next">次の遺跡</button></div></section><script>(()=>{'use strict';const G=grid;let level=1,pos,core,exit,traps,holes,got,mv,visions,active=false;function setup(){pos=20;core=4+(level*7)%15;exit=4;traps=new Set([(level*3)%20+1,(level*5)%18+2,(level*7)%16+3]);holes=new Set();got=false;mv=0;visions=0;active=false;draw()}function draw(){G.innerHTML='';for(let i=0;i<25;i++){const c=document.createElement('div');c.className='cell';if(holes.has(i))c.classList.add('void');else{if(i===core&&!got){c.classList.add('core');c.textContent='◆'}if(i===exit)c.classList.add('exit');if(active&&traps.has(i))c.classList.add('trap');if(i===pos)c.classList.add('player')}G.appendChild(c)}lv.textContent=`${level} / 30`;moves.textContent='手数 '+mv;collapse.textContent='崩壊 '+Math.min(100,visions*12)+'%'}function target(d){let r=Math.floor(pos/5),c=pos%5;if(d==='u')r--;if(d==='d')r++;if(d==='l')c--;if(d==='r')c++;return r<0||r>4||c<0||c>4?-1:r*5+c}function step(d){let n=target(d);if(n<0||holes.has(n))return;if(traps.has(n)&&!active){preview.textContent='見えない罠！スタートへ戻された。';pos=20;mv++;draw();return}pos=n;mv++;if(pos===core){got=true;preview.textContent='遺跡の核を回収。出口へ。'}if(pos===exit&&got){et.textContent=level===30?'世界を崩して道を作った':'突破';em.textContent=`手数 ${mv}、未来視 ${visions}回。${visions<3?'直感を多く残した。':'崩壊を利用して進んだ。'}`;end.classList.remove('hidden')}active=false;draw()}future.onclick=()=>{visions++;active=true;preview.textContent='2秒先：赤い縁が次の罠。だが外周が崩れ始めた。';if(visions%2===0){const candidates=[0,1,2,3,5,9,10,14,15,19,21,22,23,24].filter(i=>i!==pos&&i!==core&&i!==exit);if(candidates.length)holes.add(candidates[(visions+level)%candidates.length])}if(level===30&&visions>=3){holes.delete(9);holes.delete(14);preview.textContent='崩壊で壁の代わりだった外周が消え、新しい縦道が開いた。'}draw();setTimeout(()=>{active=false;draw()},2000)};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>step(b.dataset.d));go.onclick=()=>{intro.classList.add('hidden');setup()};next.onclick=()=>{end.classList.add('hidden');if(level===30)level=1;else level++;setup()};onkeydown=e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};if(m[e.key])step(m[e.key])};setup()})();</script></body></html>
