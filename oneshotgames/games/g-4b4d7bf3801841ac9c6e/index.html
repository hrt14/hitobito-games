<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>RIDICULOUS FINAL BOSS</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.boss{font-size:110px;text-align:center;transition:.2s}.boss.hit{transform:rotate(8deg) scale(.92)}</style></head><body><main class="app"><div class="tag">FINAL BOSS(?)</div><h1>RIDICULOUS FINAL BOSS</h1><p class="muted">世界最強のラスボスは、なぜかくだらないことでしかダメージを受けない。弱点を探せ。</p><div class="panel"><div class="hud"><span class="pill">BOSS HP <b id="hp">100</b></span><span class="pill">TURN <b id="turn">1</b></span></div><div class="boss" id="boss">👹</div><p class="card" id="msg">「勇者よ、恐怖せよ！」</p><div class="btns" id="acts"></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">再戦</button></div></main><script>(()=>{const actions=[['すごく髪型いいですね',18],['靴ひもほどけてますよ',25],['肩に米粒ついてます',22],['昨日より顔色いいですね',14],['くしゃみ出そうですね',30],['そのマント裏返しです',28],['普通に強そう',0],['必殺剣を放つ',2],['魔法を唱える',1],['「お母さん元気？」と聞く',20]];let hp,turn;function draw(){acts.innerHTML='';let picks=[actions[(turn*3)%actions.length],actions[(turn*7+1)%actions.length]];picks.forEach(a=>{let b=document.createElement('button');b.textContent=a[0];b.onclick=()=>hit(a);acts.appendChild(b)})}function hit(a){hp=Math.max(0,hp-a[1]);document.getElementById('hp').textContent=hp;boss.classList.add('hit');setTimeout(()=>boss.classList.remove('hit'),160);msg.textContent=a[1]?`「や、やめろ！そういうの効く！」 ${a[1]}ダメージ`:'「それは普通すぎて効かん！」';turn++;document.getElementById('turn').textContent=turn;if(hp<=0)return end();if(turn>12)return lose();draw()}function end(){rt.textContent='魔王、気まずさで敗北';rx.textContent=`${turn}ターンで撃破。世界はくだらない一言に救われた。`;result.classList.add('on')}function lose(){rt.textContent='時間切れ';rx.textContent='普通の攻撃ではほぼ効かない。生活感のある一言を狙おう。';result.classList.add('on')}function reset(){hp=100;turn=1;document.getElementById('hp').textContent=100;document.getElementById('turn').textContent=1;msg.textContent='「勇者よ、恐怖せよ！」';result.classList.remove('on');draw()}retry.onclick=reset;reset()})()</script></body></html>
