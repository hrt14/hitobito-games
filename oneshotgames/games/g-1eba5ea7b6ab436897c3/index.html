<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ONE-MINUTE GOD</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}</style></head><body><main class="app"><div class="tag">102 WISHES</div><h1>ONE-MINUTE GOD</h1><p class="muted">1分だけ神様。願いを叶えるか断るか決めよう。叶えると必ず妙な反動が来る。</p><div class="panel"><div class="hud"><span class="pill">WISH <b id="n">1</b>/102</span><span class="pill">KARMA <b id="karma">50</b></span></div><div class="big">☁️</div><h2 id="wish"></h2><div class="btns"><button id="yes">叶える</button><button class="alt" id="no">却下</button></div><p class="card" id="after">判定を待つ人間が列を作っている。</p></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">また神様になる</button></div></main><script>(()=>{const wants=['宝くじで大当たりしたい','毎日休日にしたい','一瞬で人気者になりたい','試験を全部満点にしたい','世界一足が速くなりたい','猫と話したい','無限に寿司を食べたい','透明人間になりたい','空を飛びたい','寝なくても平気になりたい','未来を見たい','一生若くいたい','全員に褒められたい','家を100軒ほしい','仕事を全部自動化したい','どこでも瞬間移動したい','毎日誕生日にしたい'];const twist=['ただし当選金は全部1円玉','ただし休日は役所も病院も全部休み','ただし人気はハトの間だけ','ただし問題は幼稚園のぬりえ','ただし靴だけ置いていかれる','ただし猫は文句しか言わない','ただし全部わさび10倍','ただし服は透明にならない','ただし着地が毎回ダサい','ただし夢は全部会議','ただし5秒先だけ','ただし髪型だけ毎朝変わる','ただし毎回同じ褒め言葉','ただし掃除も100倍','ただし自動化された仕事が逆に質問してくる','ただし移動先は3mずれる','ただしケーキ代が毎日かかる'];let i,karma;function text(){let a=i%17,b=Math.floor(i/17)%6;wish.textContent=wants[a]+['','！','。本気です','、今すぐ','、絶対に','、お願いします'][b];n.textContent=i+1}function pick(ok){let a=i%17;if(ok){after.textContent='✨ 願いは叶った。'+twist[a];karma+=a%3===0?-4:1}else{after.textContent='☁️ 却下。「神様ケチ！」と言われた。';karma+=2}karma=Math.max(0,Math.min(100,karma));document.getElementById('karma').textContent=karma;i++;if(i>=102)return end();text()}function end(){rt.textContent='神様タイム終了';rx.textContent=`102件すべて判定。最終KARMA ${karma}/100。`;result.classList.add('on')}function reset(){i=0;karma=50;after.textContent='判定を待つ人間が列を作っている。';document.getElementById('karma').textContent=50;result.classList.remove('on');text()}yes.onclick=()=>pick(true);no.onclick=()=>pick(false);retry.onclick=reset;reset()})()</script></body></html>
