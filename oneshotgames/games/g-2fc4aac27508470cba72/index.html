<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FROST CAMP</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#b8e8ff,#eef9ff);font-family:system-ui;color:#13334a;min-height:100vh;display:grid;place-items:center}.w{width:min(660px,100%);padding:14px}.top{display:flex;justify-content:space-between;font-weight:950}.camp{height:330px;border-radius:24px;background:linear-gradient(#d9f3ff 0 55%,#eef6f7 55%);position:relative;overflow:hidden;border:3px solid #fff}.tree{position:absolute;bottom:28px;font-size:62px}.t1{left:8%}.t2{right:8%}.fire{position:absolute;left:45%;bottom:42px;font-size:70px}.hut{position:absolute;left:38%;bottom:45px;font-size:76px;display:none}.worker{position:absolute;left:28%;bottom:35px;font-size:45px;display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:#ffffffb8;padding:10px;border-radius:15px;text-align:center;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button,.again{border:0;border-radius:17px;min-height:62px;font-weight:900}.goal{font-weight:850;text-align:center;min-height:28px}.result{display:none;text-align:center;background:#ffffffc8;border-radius:22px;padding:26px}</style></head><body><main class="w"><div class="top"><span>❄️ FROST CAMP</span><span>DAY <b id="day">1</b></span></div><p>木と食料を集め、作業を自動化してDAY 5まで生き残ろう。</p><section id="game"><div class="camp"><div class="tree t1">🌲</div><div class="tree t2">🌲</div><div id="fire" class="fire">🔥</div><div id="hut" class="hut">🏕️</div><div id="worker" class="worker">🧑‍🌾</div></div><div class="stats"><div class="stat">🪵 <b id="wood">0</b></div><div class="stat">🍖 <b id="food">0</b></div><div class="stat">🌡️ <b id="heat">55</b></div></div><div class="actions"><button id="chop">🪓 木を切る</button><button id="hunt">🧺 食料を探す</button><button id="build">🏕️ 小屋を作る<br><small>木材20</small></button><button id="auto">⚙️ 作業係を雇う<br><small>食料15</small></button></div><div id="goal" class="goal">まず木材20で小屋を作ろう</div></section><section id="res" class="result"><h2 id="rt"></h2><p id="rs"></p><button id="again" class="again">新しいキャンプ</button></section></main><script>(()=>{let w=0,f=0,h=55,d=1,built=false,workerOn=false,active=true;function draw(){wood.textContent=w;food.textContent=f;heat.textContent=Math.round(h);day.textContent=d;hut.style.display=built?'block':'none';fire.style.display=built?'none':'block';worker.style.display=workerOn?'block':'none';goal.textContent=!built?'木材20で小屋を作ろう':!workerOn?'食料15で作業を自動化しよう':'自動収集中。DAY 5を目指そう'}function end(win){active=false;game.style.display='none';res.style.display='block';rt.textContent=win?'キャンプ発展成功！':'凍えてしまった';rs.textContent=`DAY ${d} / 木材 ${w} / 食料 ${f}`}chop.onclick=()=>{if(active){w+=3;h-=1;draw()}};hunt.onclick=()=>{if(active){f+=3;h-=1;draw()}};build.onclick=()=>{if(active&&!built&&w>=20){w-=20;built=true;h+=18;draw()}};auto.onclick=()=>{if(active&&!workerOn&&f>=15){f-=15;workerOn=true;draw()}};setInterval(()=>{if(!active)return;if(workerOn){w+=2;f+=1}h-=built?.6:1.7;if(h<=0)return end(false);draw()},1000);setInterval(()=>{if(!active)return;d++;f=Math.max(0,f-4);h-=f===0?10:2;if(d>=5)return end(true);draw()},7000);again.onclick=()=>{w=f=0;h=55;d=1;built=workerOn=false;active=true;game.style.display='block';res.style.display='none';draw()};draw()})();</script></body></html>
