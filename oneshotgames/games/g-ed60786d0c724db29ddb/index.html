<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>REVIVE ROUTE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071018;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 92px;background:radial-gradient(circle at 50% -10%,#214f69,#071018 48%,#02070a)}.tag{font-size:11px;font-weight:900;letter-spacing:.15em;color:#7ce7ff}h1{margin:4px 0 2px;font-size:31px}.sub{margin:0 0 10px;color:#bfd1da;font-size:13px}.panel{padding:12px;border-radius:22px;background:#0a1821e8;border:1px solid #ffffff1b}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.pill{padding:7px;border-radius:12px;background:#ffffff0d;text-align:center;font-size:10px;font-weight:900}.pill b{display:block;font-size:15px}.city{position:relative;height:56vh;min-height:360px;overflow:hidden;border-radius:18px;background:linear-gradient(#10283a 0 48%,#17202a 48% 100%);border:1px solid #ffffff1a;box-shadow:inset 0 0 60px #0008}.city:before{content:"";position:absolute;left:0;right:0;bottom:52%;height:42%;background:repeating-linear-gradient(90deg,#1b3b50 0 34px,#234861 34px 66px,#153346 66px 94px);clip-path:polygon(0 40%,8% 30%,12% 44%,20% 20%,27% 38%,34% 11%,41% 36%,50% 18%,58% 42%,66% 17%,73% 35%,82% 24%,90% 40%,100% 18%,100% 100%,0 100%)}.road{position:absolute;left:10%;right:10%;top:48%;bottom:0;background:linear-gradient(#313842,#111821);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%)}.road:after{content:"";position:absolute;left:49%;top:0;bottom:0;width:3px;background:repeating-linear-gradient(#ffffff66 0 18px,transparent 18px 36px)}.lane{position:absolute;top:48%;bottom:0;width:33.333%}.l0{left:10%}.l1{left:33.333%}.l2{right:10%}.hero{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);font-size:48px;z-index:10;transition:left .13s ease,filter .18s;filter:drop-shadow(0 8px 8px #000)}.hero.hit{filter:drop-shadow(0 0 15px #ff4b65)}.obj{position:absolute;font-size:34px;z-index:7;animation:fall 2.4s linear forwards;filter:drop-shadow(0 5px 7px #000)}@keyframes fall{from{top:49%;transform:scale(.62)}to{top:93%;transform:scale(1.18)}}.pop{position:absolute;font-size:24px;font-weight:900;z-index:15;animation:pop .65s forwards}@keyframes pop{to{transform:translateY(-35px) scale(1.25);opacity:0}}.meter{height:12px;background:#001017;border-radius:99px;overflow:hidden;margin:9px 0}.meter i{display:block;height:100%;width:20%;background:linear-gradient(90deg,#ff5e75,#ffd35b,#64ebb8);transition:width .2s}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:58px;border:0;border-radius:16px;color:#fff;font-size:18px;font-weight:950;background:linear-gradient(135deg,#1688cc,#5a62ff);touch-action:manipulation}.btn:active{transform:scale(.97)}.msg{margin:9px 0 0;padding:10px 12px;border-radius:14px;background:#ffffff0b;color:#d7e5eb;font-size:13px}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#102736}.result.on{display:block}.retry{width:100%;min-height:56px;border:0;border-radius:15px;color:#fff;font-weight:950;background:linear-gradient(135deg,#2ebd91,#3b72ff)}</style></head><body><main class="app"><div class="tag">AFTER WORK RECOVERY RUN</div><h1>REVIVE ROUTE</h1><p class="sub">左右に移動して ☕🌿🍙 を集める。📩💻 は避けて、家に着くまでENERGYを回復しよう。</p><section class="panel"><div class="hud"><div class="pill">ENERGY<b id="energy">20</b></div><div class="pill">距離<b id="dist">0%</b></div><div class="pill">COMBO<b id="combo">0</b></div></div><div class="city" id="city"><div class="road"></div><div class="hero" id="hero">🧑‍💼</div></div><div class="meter"><i id="bar"></i></div><div class="controls"><button class="btn" id="left">← 左へ</button><button class="btn" id="right">右へ →</button></div><p class="msg" id="msg">終電まであと少し。回復アイテムを集めて帰ろう。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="retry" id="retry">もう一度帰る</button></section></main><script>(()=>{const good=[['☕',12,'温かいコーヒー'],['🌿',15,'公園の深呼吸'],['🍙',18,'夜のおにぎり'],['🎧',10,'好きな音楽']],bad=[['📩',-15,'仕事メール'],['💻',-18,'持ち帰り仕事'],['⏰',-10,'締切アラーム']];let lane=1,energy=20,step=0,combo=0,timer=null,active=[];const el=id=>document.getElementById(id),city=el('city'),hero=el('hero'),msg=el('msg');function laneLeft(n){return [28,50,72][n]+'%'}function move(d){lane=Math.max(0,Math.min(2,lane+d));hero.style.left=laneLeft(lane)}function spawn(){step++;el('dist').textContent=Math.min(100,Math.round(step/24*100))+'%';const positive=Math.random()>.38,pool=positive?good:bad,item=pool[Math.floor(Math.random()*pool.length)],ln=Math.floor(Math.random()*3),o=document.createElement('div');o.className='obj';o.textContent=item[0];o.style.left=laneLeft(ln);o.dataset.lane=ln;o.dataset.val=item[1];o.dataset.name=item[2];city.appendChild(o);active.push(o);setTimeout(()=>resolve(o),1900);if(step>=24){clearInterval(timer);timer=null;setTimeout(end,2300)}}function resolve(o){if(!o.isConnected)return;const val=+o.dataset.val;if(+o.dataset.lane===lane){energy=Math.max(0,Math.min(100,energy+val));if(val>0){combo++;msg.textContent=`${o.dataset.name} +${val} ENERGY / ${combo} COMBO`;pop(o,'+'+val)}else{combo=0;msg.textContent=`${o.dataset.name} ${val} ENERGY`;hero.classList.add('hit');setTimeout(()=>hero.classList.remove('hit'),220);pop(o,String(val))}}else if(val>0){combo=0}el('energy').textContent=energy;el('combo').textContent=combo;el('bar').style.width=energy+'%';o.remove();active=active.filter(x=>x!==o);if(energy<=0&&!result.classList.contains('on')){clearInterval(timer);timer=null;active.forEach(x=>x.remove());active=[];rt.textContent='電池切れ…';rx.textContent='仕事の刺激を避け、回復アイテムを連続で取ると復活しやすい。';result.classList.add('on')}}function pop(o,text){const p=document.createElement('div');p.className='pop';p.textContent=text;p.style.left=o.style.left;p.style.top='77%';city.appendChild(p);setTimeout(()=>p.remove(),700)}function end(){if(result.classList.contains('on'))return;rt.textContent=energy>=75?'完全復活！':energy>=45?'少し元気になった':'なんとか帰宅';rx.textContent=`帰宅時 ENERGY ${energy}。${energy>=75?'明日は自分のペースで始められそう。':'次は仕事メールを避けて回復COMBOを伸ばそう。'}`;result.classList.add('on')}function reset(){clearInterval(timer);active.forEach(x=>x.remove());active=[];lane=1;energy=20;step=0;combo=0;hero.style.left=laneLeft(1);['energy','combo'].forEach((id,i)=>el(id).textContent=[20,0][i]);el('dist').textContent='0%';el('bar').style.width='20%';result.classList.remove('on');msg.textContent='終電まであと少し。回復アイテムを集めて帰ろう。';timer=setInterval(spawn,850);spawn()}left.onclick=()=>move(-1);right.onclick=()=>move(1);retry.onclick=reset;reset()})()</script></body></html>
