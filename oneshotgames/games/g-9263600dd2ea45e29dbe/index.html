<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>LUCKY CAPSULE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.machine{height:300px;display:grid;place-items:center;background:radial-gradient(circle,#533b8f,#1b1733);border-radius:24px}.ball{font-size:100px;transition:.4s}.spin{animation:spin .25s infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main class="app"><div class="tag">FREE VIRTUAL DRAW · NO MONEY</div><h1>LUCKY CAPSULE</h1><p class="muted">無料の架空抽選ゲーム。ボタンを押すと1等〜6等がランダムで出る。10回のベストを狙え。</p><div class="panel"><div class="hud"><span class="pill">TRY <b id="try">0</b>/10</span><span class="pill">BEST <b id="best">-</b></span></div><div class="machine"><div class="ball" id="ball">🔮</div></div><button id="draw" style="width:100%;margin-top:12px">無料で抽選</button><p class="card" id="msg">現実のお金・景品は一切ありません。</p></div><div class="panel result" id="result"><h2>10回終了</h2><p id="rx"></p><button id="retry">もう10回</button></div></main><script>(()=>{let n,best;const ranks=['1等 🌟','2等 ✨','3等 🎉','4等 🎈','5等 🍬','6等 🧻'];function draw(){if(n>=10)return;n++;ball.classList.add('spin');draw.disabled=true;setTimeout(()=>{let r=Math.random(),rank=r<.03?0:r<.10?1:r<.22?2:r<.42?3:r<.68?4:5;best=Math.min(best,rank);ball.classList.remove('spin');ball.textContent=['🏆','💎','🎁','🎈','🍬','🧻'][rank];msg.textContent=ranks[rank]+'！';document.getElementById('try').textContent=n;document.getElementById('best').textContent=ranks[best];draw.disabled=false;if(n===10){rx.textContent=`ベストは ${ranks[best]}。完全無料のランダム遊びとして何度でも再挑戦できる。`;result.classList.add('on')}},450)}function reset(){n=0;best=99;ball.textContent='🔮';msg.textContent='現実のお金・景品は一切ありません。';document.getElementById('try').textContent=0;document.getElementById('best').textContent='-';result.classList.remove('on')}document.getElementById('draw').onclick=draw;retry.onclick=reset;reset()})()</script></body></html>
