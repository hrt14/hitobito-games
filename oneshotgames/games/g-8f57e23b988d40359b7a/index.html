<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DON'T WAKE THE CAT</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.room{height:340px;position:relative;border-radius:20px;background:linear-gradient(#362b49,#171523);overflow:hidden}.cat{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:96px}.loot{position:absolute;font-size:42px;touch-action:none}.meter{height:16px}</style></head><body><main class="app"><div class="tag">STEALTH PICKUP</div><h1>DON'T WAKE THE CAT</h1><p class="muted">猫のそばの品を長押しせず、ゆっくりドラッグして下のカゴへ。速く動かすと猫が起きる。</p><div class="panel"><div class="hud"><span class="pill">SLEEP <b id="sleep">100</b></span><span class="pill">GET <b id="get">0</b>/5</span></div><div class="bar meter"><i id="bar" style="width:100%"></i></div><div class="room" id="room"><div class="cat" id="cat">😴🐈</div></div><div class="card" id="basket">🧺 ここへそっと運ぶ</div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">もう一度そっと</button></div></main><script>(()=>{const room=document.getElementById('room'),cat=document.getElementById('cat'),bar=document.getElementById('bar');let sleep,got,drag,last;const icons=['🐟','🧶','🥛','🧦','🪶'];function reset(){room.querySelectorAll('.loot').forEach(x=>x.remove());sleep=100;got=0;drag=null;document.getElementById('sleep').textContent=sleep;document.getElementById('get').textContent=0;bar.style.width='100%';cat.textContent='😴🐈';document.getElementById('result').classList.remove('on');icons.forEach((ic,i)=>{let d=document.createElement('div');d.className='loot';d.textContent=ic;d.style.left=(10+(i*17)%75)+'%';d.style.top=(10+(i*23)%65)+'%';d.onpointerdown=e=>{drag=d;last={x:e.clientX,y:e.clientY,t:performance.now()};d.setPointerCapture(e.pointerId)};d.onpointermove=e=>{if(drag!==d)return;let r=room.getBoundingClientRect(),dt=Math.max(1,performance.now()-last.t),v=Math.hypot(e.clientX-last.x,e.clientY-last.y)/dt;if(v>.65){sleep=Math.max(0,sleep-Math.ceil(v*4));document.getElementById('sleep').textContent=sleep;bar.style.width=sleep+'%'}d.style.left=(e.clientX-r.left-20)+'px';d.style.top=(e.clientY-r.top-20)+'px';last={x:e.clientX,y:e.clientY,t:performance.now()};if(sleep<=0)lose()};d.onpointerup=e=>{if(drag!==d)return;drag=null;let r=room.getBoundingClientRect();if(e.clientY>r.bottom-35){d.remove();got++;document.getElementById('get').textContent=got;if(got===5)win()}};room.appendChild(d)})}function lose(){cat.textContent='😾';document.getElementById('rt').textContent='起きた！';document.getElementById('rx').textContent='急な動きでSLEEPが0に。ゆっくり一定速度で運ぼう。';document.getElementById('result').classList.add('on')}function win(){document.getElementById('rt').textContent='完全回収！';document.getElementById('rx').textContent=`猫はまだ熟睡。SLEEP ${sleep} 残し。`;document.getElementById('result').classList.add('on')}document.getElementById('retry').onclick=reset;reset()})()</script></body></html>
