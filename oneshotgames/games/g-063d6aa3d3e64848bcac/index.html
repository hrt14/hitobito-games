<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10141c"><title>雪籠り館の夜 | OneShotGames</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0c1017;color:#eef2f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:linear-gradient(#0c1017,#151b24)}.app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(86px + env(safe-area-inset-bottom))}.sky{height:42vh;min-height:260px;position:relative;overflow:hidden;background:linear-gradient(#1b2633,#2d3c4a 60%,#202831)}.snow{position:absolute;inset:-20%;background-image:radial-gradient(circle,#fff 0 1.3px,transparent 1.5px);background-size:36px 36px;opacity:.6;animation:snow 9s linear infinite}@keyframes snow{to{transform:translate(30px,70px)}}.lodge{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(78vw,420px);height:150px;background:#221c1b;clip-path:polygon(10% 38%,50% 0,90% 38%,90% 100%,10% 100%);box-shadow:0 0 60px rgba(255,200,91,.08)}.window{position:absolute;width:38px;height:46px;background:#f6c66e;bottom:28px;box-shadow:0 0 20px rgba(255,196,94,.6)}.w1{left:25%}.w2{right:25%}.storm{position:absolute;left:18px;top:18px;font-size:11px;letter-spacing:.17em;font-weight:900;color:#d7e8fb}.main{width:min(720px,100%);margin:-18px auto 0;z-index:2;padding:0 14px}.novel{border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(12,16,23,.96);box-shadow:0 25px 70px rgba(0,0,0,.45);overflow:hidden}.head{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px}.chapter{letter-spacing:.14em;font-weight:900;color:#8fb9d9}.clues{color:#f2c977}.text{padding:22px 18px 8px;min-height:190px}.speaker{font-size:12px;font-weight:900;color:#8fc9ff;letter-spacing:.08em}.text p{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:17px;line-height:2;margin:10px 0;color:#f1f2f4}.choices{display:grid;gap:10px;padding:12px 16px 18px}.choices button,.primary{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:#18212c;color:#f3f6f8;padding:14px 13px;text-align:left;font-weight:800;font-size:14px;cursor:pointer}.choices button:active{transform:scale(.985)}.primary{background:linear-gradient(135deg,#314d66,#6b476f);text-align:center}.intro,.ending{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#26384a,#0b0f15 68%)}.card{width:min(520px,100%);text-align:center}.moon{font-size:66px}.card h1{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(38px,12vw,64px);line-height:1.05;margin:12px 0}.card p{color:#c6d0dc;line-height:1.8}.tag{font-size:10px;letter-spacing:.18em;color:#9ac9ef;font-weight:950}.hidden{display:none}.toast{position:fixed;z-index:15;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:#f0c66f;color:#17120a;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:900;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.evidence{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}.chip{font-size:11px;border:1px solid rgba(242,201,119,.3);color:#f3cf85;border-radius:999px;padding:5px 8px}.pulse{animation:pulse .18s}@keyframes pulse{50%{filter:brightness(1.6)}}
</style></head><body><main class="app"><section class="sky" id="sky"><div class="snow"></div><div class="storm">23:47 · 吹雪で道路封鎖</div><div class="lodge"><i class="window w1"></i><i class="window w2"></i></div></section><div class="main"><section class="novel"><div class="head"><span class="chapter" id="chapter">第一章 · 閉ざされた館</span><span class="clues" id="clueCount">手がかり 0/3</span></div><div class="text"><div class="speaker" id="speaker">地の文</div><p id="story">玄関の鍵は内側から掛かっている。なのに、書斎で館主が倒れていた。</p></div><div class="evidence" id="evidence"></div><div class="choices" id="choices"></div></section></div></main><div class="toast" id="toast">手がかりを入手</div><section class="intro" id="intro"><div class="card"><div class="moon">🌨️</div><div class="tag">ORIGINAL MYSTERY SOUND NOVEL</div><h1>雪籠り館の夜</h1><p>吹雪で孤立した山荘。館主が倒れ、外へ出た者はいない。<br>3つの手がかりを集め、午前0時までに犯人を指名せよ。</p><button class="primary" id="start">物語を始める</button></div></section><section class="ending hidden" id="ending"><div class="card"><div class="moon" id="endIcon">🔎</div><div class="tag">CASE CLOSED?</div><h1 id="endTitle">真相</h1><p id="endText"></p><button class="primary" id="retry">最初から読む</button></div></section><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const story=$('story'),speaker=$('speaker'),choices=$('choices'),chapter=$('chapter'),evidence=$('evidence'),clueCount=$('clueCount'),toast=$('toast'),intro=$('intro'),ending=$('ending'),sky=$('sky');let clues=new Set(),visited=new Set(),audio=null;function tone(freq=260,dur=.08){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.03,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}function say(who,text,opts){speaker.textContent=who;story.textContent=text;choices.innerHTML='';(opts||[]).forEach(o=>{const b=document.createElement('button');b.textContent=o.label;b.onclick=()=>{tone(210,.05);o.go()};choices.appendChild(b)})}function addClue(id,label){if(clues.has(id))return;clues.add(id);clueCount.textContent=`手がかり ${clues.size}/3`;const c=document.createElement('span');c.className='chip';c.textContent=label;evidence.appendChild(c);toast.textContent=`手がかり「${label}」`;toast.classList.add('show');tone(620,.14);setTimeout(()=>toast.classList.remove('show'),1000)}function hub(){chapter.textContent='第二章 · 23:52';say('あなた','館内を調べる。残された時間は8分。',[{label:'書斎を調べる',go:study},{label:'厨房で料理人に聞く',go:kitchen},{label:'廊下で客人に聞く',go:hall},{label:clues.size>=3?'推理を始める':'まだ推理材料が足りない',go:clues.size>=3?deduce:hub}])}function study(){visited.add('study');say('書斎','窓は完全に凍りつき、机の脇に割れたグラス。暖炉の灰だけが妙に新しい。',[{label:'灰を調べる',go:()=>{addClue('ash','濡れた封筒の灰');say('あなた','灰の中から、完全には燃えていない封筒の端が出た。水で濡れていた跡がある。',[{label:'廊下へ戻る',go:hub}])}},{label:'戻る',go:hub}])}function kitchen(){visited.add('kitchen');say('料理人・ミナ','「23時半に停電がありました。館主さまの飲み物は、いつも秘書の久瀬さんが運びます」',[{label:'停電について詳しく聞く',go:()=>{addClue('clock','停電は23:31〜23:34');say('ミナ','「非常灯が点くまで3分くらい。厨房の時計は電池式だから時間は確かです」',[{label:'廊下へ戻る',go:hub}])}},{label:'戻る',go:hub}])}function hall(){visited.add('hall');say('客人・真鍋','「私はずっと談話室にいた。秘書の久瀬さんなら、停電の直前に地下へ降りていったよ」',[{label:'足元を見る',go:()=>{addClue('snow','久瀬の靴だけ乾いている');say('あなた','玄関脇には全員の濡れた雪靴。だが久瀬の靴だけが乾いている。外へ出た形跡はない。',[{label:'廊下へ戻る',go:hub}])}},{label:'戻る',go:hub}])}function deduce(){chapter.textContent='最終章 · 23:59';say('あなた','3つの手がかりが揃った。館主を襲ったのは誰だ？',[{label:'料理人・ミナ',go:()=>accuse('mina')},{label:'客人・真鍋',go:()=>accuse('manabe')},{label:'秘書・久瀬',go:()=>accuse('kuze')}])}function accuse(who){ending.classList.remove('hidden');if(who==='kuze'){$('endIcon').textContent='🕯️';$('endTitle').textContent='真相到達';$('endText').textContent='犯人は秘書・久瀬。停電中、地下の給水弁で封筒を濡らして証拠を燃えにくくし、書斎へ戻って館主を襲った。外からの侵入に見せかける必要がなかったから、靴だけが乾いていた。館主は一命を取り留める。'}else{$('endIcon').textContent='🌨️';$('endTitle').textContent='誤推理';$('endText').textContent='指名は外れた。午前0時、吹雪の音に紛れて本当の犯人は証拠を消した。3つの手がかりの「停電」「濡れた封筒」「乾いた靴」をつなぎ直せ。'}tone(who==='kuze'?760:120,.3)}function begin(){clues=new Set();visited=new Set();evidence.innerHTML='';clueCount.textContent='手がかり 0/3';intro.classList.add('hidden');ending.classList.add('hidden');chapter.textContent='第一章 · 閉ざされた館';say('地の文','23時47分。吹雪で道路は封鎖。書斎で館主が倒れていた。玄関は内側から施錠され、窓は雪に埋もれている。',[{label:'館内を調べる',go:hub}]);tone(180,.18)}$('start').addEventListener('click',begin);$('retry').addEventListener('click',begin);})();
</script></body></html>
