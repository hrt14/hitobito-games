<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>クソUI No.1決定戦</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#00e8ff;color:#111;display:grid;place-items:center;padding:10px}.game{width:min(100%,470px);background:#fffb00;border:9px ridge #f0f;padding:10px;box-shadow:0 0 0 8px #00f,12px 12px 0 #000}h1{margin:0;font:1000 27px/1.05 Arial;color:#f00;text-shadow:2px 2px #fff,-2px -2px #00f}.sub{background:#000;color:#0f0;padding:8px;font-weight:900}.hud{display:flex;gap:4px}.chip{flex:1;background:#fff;border:3px solid #000;padding:6px;text-align:center;font-weight:1000}.arena{height:390px;position:relative;overflow:hidden;margin:8px 0;border:5px dashed #f00;background:repeating-linear-gradient(135deg,#fff 0 16px,#ddd 16px 32px)}.tile{position:absolute;border:3px solid #111;min-width:70px;min-height:45px;font-size:12px;font-weight:1000;transform:rotate(var(--r));box-shadow:3px 3px 0 #222}.tile.good{outline:6px double transparent}.noise{position:absolute;font-size:11px;font-weight:900;pointer-events:none}.action{width:100%;padding:14px;border:5px outset #ddd;background:#cfcfcf;font-size:18px;font-weight:1000}.msg{min-height:42px;background:#111;color:#fff;padding:7px;text-align:center;font-weight:900}.result{display:none;text-align:center;background:#fff;padding:14px}.result.show{display:block}.hidden{display:none}.big{font-size:58px;font-weight:1000}</style></head><body><main class="game"><section id="intro"><h1>クソUI No.1決定戦</h1><p class="sub">画面のゴミ情報に負けず、指示された本物のボタンを5回見つけろ。</p><button class="action" id="begin">視界を破壊する</button></section><section id="play" class="hidden"><div class="hud"><div class="chip">ROUND <b id="rd">1</b>/5</div><div class="chip">MISS <b id="mi">0</b></div><div class="chip">TIME <b id="tm">20.0</b></div></div><div id="msg" class="msg"></div><div id="arena" class="arena"></div></section><section id="result" class="result"><h1 id="rtitle"></h1><div id="big" class="big"></div><p id="rtext"></p><button class="action" id="again">もう一度探す</button></section></main><script>const words=['OK','開始','次へ','確認','保存','閉じる','決定','同意','取消','戻る','実行','完了','進む','OPEN','GO','YES','NO','CLICK'];const colors=['#f66','#6ff','#8f8','#fc6','#f8f','#fff','#9cf','#ffa'];let round=1,miss=0,left=20,running=false,timer,target='';const arena=document.getElementById('arena'),msg=document.getElementById('msg');function rand(a){return a[Math.floor(Math.random()*a.length)]}function hud(){rd.textContent=round;mi.textContent=miss;tm.textContent=left.toFixed(1)}function start(){round=1;miss=0;left=20;running=true;intro.classList.add('hidden');result.classList.remove('show');play.classList.remove('hidden');clearInterval(timer);hud();build();timer=setInterval(()=>{left-=.1;if(left<=0){left=0;end(false)}hud()},100)}function build(){arena.innerHTML='';target=rand(words.slice(0,10));msg.textContent='「'+target+'」を押せ';for(let i=0;i<24;i++){const b=document.createElement('button');b.className='tile';const isGood=i===Math.floor(Math.random()*24);b.textContent=isGood?target:rand(words.filter(w=>w!==target));if(isGood)b.dataset.good='1';b.style.left=(2+Math.random()*76)+'%';b.style.top=(2+Math.random()*82)+'%';b.style.background=rand(colors);b.style.color=Math.random()<.5?'#000':'#fff';b.style.setProperty('--r',(Math.random()*18-9)+'deg');b.style.zIndex=String(Math.floor(Math.random()*8)+1);b.onclick=e=>{e.stopPropagation();if(!running)return;if(b.dataset.good){round++;if(round>5){end(true);return}hud();msg.textContent='発見。次も視認性ゼロ。';setTimeout(build,180)}else{miss++;left=Math.max(0,left-.7);hud();msg.textContent='それっぽい偽物。-0.7秒'}};arena.appendChild(b)}for(let i=0;i<10;i++){const n=document.createElement('span');n.className='noise';n.textContent=rand(['NEW!','重要','※広告','注目','!!','SALE?','HELP','123']);n.style.left=Math.random()*86+'%';n.style.top=Math.random()*90+'%';n.style.color=rand(['#f00','#00f','#090','#f0f']);n.style.fontSize=(10+Math.random()*14)+'px';n.style.zIndex='9';arena.appendChild(n)}}function end(win){if(!running)return;running=false;clearInterval(timer);play.classList.add('hidden');result.classList.add('show');const score=Math.max(0,Math.round(left*60-miss*45));big.textContent=score;rtitle.textContent=win?'視認性地獄を突破':'UIに飲まれた';rtext.textContent='ミス '+miss+'回。'+(score>=700?'クソUI耐性 No.1級。':score>=400?'かなり見抜いた。':'次は文字より配置の違和感を追え。')}begin.onclick=start;again.onclick=start</script></body></html>
