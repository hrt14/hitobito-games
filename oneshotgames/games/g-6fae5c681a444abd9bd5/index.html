<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>無限待機ボタン</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#ececec;color:#303030;display:grid;place-items:center;padding:16px}.game{width:min(100%,430px);background:#f8f8f8;border-radius:22px;padding:20px;border:1px solid #ccc;box-shadow:0 12px 35px #0002}h1{margin:0;font-size:28px}.sub{color:#666}.timer{font-size:72px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:18px 0}.track{height:16px;background:#ddd;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;width:0;background:#666}.tempt{margin:20px 0;width:100%;min-height:92px;border:2px solid #999;border-radius:14px;background:#fff;font-size:20px;font-weight:900;transition:transform .15s,background .15s}.tempt.pulse{transform:scale(1.035);background:#fff4c7}.note{text-align:center;min-height:50px;font-weight:800;color:#555}.action{width:100%;padding:15px;border:0;border-radius:14px;background:#333;color:#fff;font-size:18px;font-weight:900}.result{display:none;text-align:center}.result.show{display:block}.hidden{display:none}.big{font-size:62px;font-weight:1000}</style></head><body><main class="game"><section id="intro"><h1>無限待機ボタン</h1><p class="sub">15秒、何もしないでください。途中のボタンを押したら0秒に戻ります。</p><button class="action" id="begin">退屈を開始</button></section><section id="play" class="hidden"><div class="timer"><span id="time">0.0</span>s</div><div class="track"><i id="bar"></i></div><button id="tempt" class="tempt">押しても何も起きません</button><div id="note" class="note">やることはありません。</div></section><section id="result" class="result"><h1>退屈に勝った</h1><div class="big">15.0秒</div><p id="rtext"></p><button class="action" id="again">もう一度、何もしない</button></section></main><script>let elapsed=0,resets=0,running=false,timer;const messages=['本当に押さなくていいです','あと少しだけ何もしない','ボタンが気になりますね','退屈ですね','でも押したら最初から'];function start(){elapsed=0;resets=0;running=true;intro.classList.add('hidden');result.classList.remove('show');play.classList.remove('hidden');time.textContent='0.0';bar.style.width='0';note.textContent='やることはありません。';clearInterval(timer);timer=setInterval(tick,100)}function tick(){if(!running)return;elapsed+=.1;if(elapsed>=15){elapsed=15;finish();return}time.textContent=elapsed.toFixed(1);bar.style.width=(elapsed/15*100)+'%';if(Math.round(elapsed*10)%25===0){note.textContent=messages[Math.floor(Math.random()*messages.length)];tempt.classList.add('pulse');setTimeout(()=>tempt.classList.remove('pulse'),450)}}tempt.onclick=()=>{if(!running)return;resets++;elapsed=0;time.textContent='0.0';bar.style.width='0';note.textContent='押しました。0秒に戻りました。リセット '+resets+'回';tempt.textContent=resets%2?'だから押さなくていいです':'押しても何も起きません'};function finish(){running=false;clearInterval(timer);play.classList.add('hidden');result.classList.add('show');rtext.textContent=resets===0?'一度も誘惑に負けなかった。完璧な退屈。':'リセット '+resets+'回。それでも最後まで耐えた。'}begin.onclick=start;again.onclick=start</script></body></html>
