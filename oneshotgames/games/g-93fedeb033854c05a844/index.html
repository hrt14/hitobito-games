<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SCARE SHIFT</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#34154c,#0c0b16 65%);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center}.wrap{width:min(720px,100%);padding:18px}.top{display:flex;justify-content:space-between;font-weight:900}.stage{margin-top:12px;background:#ffffff0d;border:1px solid #ffffff20;border-radius:24px;padding:16px}.hall{height:280px;border-radius:20px;background:linear-gradient(#1a1730,#0f1020);position:relative;overflow:hidden;border:2px solid #ffffff15}.door{position:absolute;bottom:22px;width:72px;height:120px;background:#251d33;border:3px solid #6d547e;border-radius:12px 12px 0 0}.d1{left:8%}.d2{left:39%}.d3{right:8%}.actor{position:absolute;bottom:28px;font-size:50px;left:-60px;transition:transform .08s}.ghost{position:absolute;font-size:46px;opacity:0;transform:scale(.2);transition:.16s}.ghost.show{opacity:1;transform:scale(1.3)}.message{text-align:center;min-height:28px;font-weight:900;margin:12px 0}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{min-height:90px;border:0;border-radius:20px;color:#fff;font-size:17px;font-weight:1000;background:linear-gradient(180deg,#7c3aed,#4c1d95);box-shadow:0 6px 0 #2e1065;touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2e1065}.btn small{display:block;font-size:24px}.energy{height:10px;background:#ffffff18;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#e879f9)}.result{display:none;text-align:center;padding:22px}.retry{padding:14px 24px;border:0;border-radius:18px;font-size:18px;font-weight:900}.flash{animation:flash .22s}@keyframes flash{50%{filter:brightness(2)}} </style></head><body><main class="wrap"><div class="top"><span>👻 SCARE SHIFT</span><span>SCORE <b id="score">0</b></span></div><section class="stage" id="game"><p style="margin:0 0 10px;color:#d8c7ff">通るスタッフを、近いドアからタイミングよく驚かせろ！</p><div class="hall" id="hall"><div class="door d1"></div><div class="door d2"></div><div class="door d3"></div><div class="actor" id="actor">🧑‍💼</div><div class="ghost" id="ghost">👻</div></div><div class="message" id="message">近づいたドアをタップ！</div><div class="buttons"><button class="btn" data-lane="0"><small>🚪</small>左から驚かす</button><button class="btn" data-lane="1"><small>🪦</small>中央で驚かす</button><button class="btn" data-lane="2"><small>🕯️</small>右から驚かす</button></div><div>おばけパワー</div><div class="energy"><div class="fill" id="energy"></div></div></section><section class="stage result" id="result"><div style="font-size:64px">🎃</div><h2 id="title">勤務終了！</h2><p id="summary"></p><button class="retry" onclick="location.reload()">もう1シフト</button></section></main><script>(()=>{const actor=document.getElementById('actor'),ghost=document.getElementById('ghost'),hall=document.getElementById('hall'),message=document.getElementById('message'),scoreEl=document.getElementById('score'),energyEl=document.getElementById('energy');let x=-50,score=0,energy=100,round=0,active=true,speed=0.095,last=performance.now();const lanes=[18,50,82];function actorPct(){return Math.max(0,Math.min(100,(x+50)/6.4))}function targetLane(){const p=actorPct();if(p<34)return 0;if(p<67)return 1;return 2}function scare(lane){if(!active||energy<18)return;energy-=18;const p=actorPct(),target=targetLane(),dist=Math.abs(p-lanes[lane]);ghost.style.left=`calc(${lanes[lane]}% - 22px)`;ghost.style.bottom='92px';ghost.classList.add('show');setTimeout(()=>ghost.classList.remove('show'),180);hall.classList.remove('flash');void hall.offsetWidth;hall.classList.add('flash');if(lane===target&&dist<24){const pts=Math.max(8,Math.round(30-dist));score+=pts;scoreEl.textContent=score;message.textContent=pts>=24?'完璧！😱 +'+pts:'びっくり！ +'+pts;navigator.vibrate?.([20,30,20]);x+=32}else{message.textContent='空振り！タイミングを見よう';score=Math.max(0,score-5);scoreEl.textContent=score}draw()}function draw(){actor.style.transform=`translateX(${x}px)`;energyEl.style.width=energy+'%'}function next(){round++;if(round>=5){active=false;document.getElementById('game').style.display='none';document.getElementById('result').style.display='block';document.getElementById('summary').textContent=`5人を相手に ${score} 点。近づくまで待つほど高得点！`;document.getElementById('title').textContent=score>=90?'伝説のおばけ役！':score>=55?'ナイス脅かし！':'まだ驚かせられる！';return}x=-50;message.textContent='次のスタッフが来る…'}function loop(t){const dt=t-last;last=t;if(active){x+=dt*speed;energy=Math.min(100,energy+dt*.012);if(x>650)next();draw()}requestAnimationFrame(loop)}document.querySelectorAll('[data-lane]').forEach(b=>b.addEventListener('pointerdown',()=>scare(+b.dataset.lane)));requestAnimationFrame(loop)})();</script></body></html>
