<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SCARE SHIFT: HAUNTED HOUSE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050408;color:#fff;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 92px;background:radial-gradient(circle at 50% -8%,#392d52,#100b18 42%,#030205)}h1{font-size:30px;margin:4px 0;text-shadow:0 2px 18px #8b55ff88}.tag{font-size:11px;font-weight:900;letter-spacing:.15em;color:#dcb4ff}.sub{margin:0 0 10px;color:#c9bdd3;font-size:13px}.panel{padding:12px;border-radius:22px;background:#100b17e8;border:1px solid #ffffff1f;box-shadow:0 22px 60px #000b}.hud{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.pill{padding:6px 9px;border-radius:999px;background:#ffffff0d;font-size:12px;font-weight:900}.house{position:relative;height:448px;border-radius:18px;overflow:hidden;background:linear-gradient(#090711,#020204);box-shadow:inset 0 0 65px #000,0 8px 30px #0009;border:1px solid #6d567b}.moon{position:absolute;right:8%;top:4%;width:54px;height:54px;border-radius:50%;background:#d8d2c0;box-shadow:0 0 30px #d8d2c066}.cloud{position:absolute;height:18px;border-radius:99px;background:#463f5288;filter:blur(1px)}.c1{width:110px;right:-12px;top:15%}.c2{width:80px;left:4%;top:11%}.facade{position:absolute;left:4%;right:4%;top:17%;bottom:6%;background:linear-gradient(90deg,#1b1520,#2e2034 18%,#24192b 50%,#2d1f34 82%,#17121c);clip-path:polygon(6% 12%,18% 0,31% 12%,42% 6%,51% 15%,62% 6%,74% 13%,88% 2%,95% 15%,100% 18%,100% 100%,0 100%,0 19%);border:2px solid #5f4a6b;box-shadow:0 0 34px #000}.window{position:absolute;width:16%;height:15%;border:3px solid #402f48;background:linear-gradient(#7b5d40,#291d2a);box-shadow:inset 0 0 18px #ffcc6644,0 0 15px #000}.w1{left:12%;top:28%}.w2{right:12%;top:28%}.w3{left:42%;bottom:18%}.window:before,.window:after{content:"";position:absolute;background:#3c2b40}.window:before{left:48%;top:0;width:3px;height:100%}.window:after{left:0;top:48%;height:3px;width:100%}.curtain{position:absolute;inset:0;background:linear-gradient(90deg,#5a2138 0 28%,transparent 30% 70%,#5a2138 72%);opacity:.82}.web{position:absolute;width:62px;height:62px;border-top:1px solid #dcd1e055;border-left:1px solid #dcd1e055;border-radius:100% 0 0}.web:before,.web:after{content:"";position:absolute;left:0;top:0;width:52px;border-top:1px solid #dcd1e044;transform-origin:left}.web:before{transform:rotate(24deg)}.web:after{transform:rotate(48deg)}.web1{left:3%;top:18%}.web2{right:2%;top:49%;transform:scaleX(-1)}.room{position:absolute;border:2px solid #6f5879;background:linear-gradient(145deg,#38273e,#17111b);border-radius:13px;display:grid;place-items:center;text-align:center;font-weight:900;box-shadow:inset 0 0 30px #0009,0 5px 15px #0007;overflow:hidden}.room:after{content:"";position:absolute;inset:auto 0 0;height:22%;background:repeating-linear-gradient(90deg,#2d1e20 0 16px,#3a2728 16px 18px);opacity:.8}.r1{left:8%;top:29%;width:38%;height:27%}.r2{right:8%;top:29%;width:38%;height:27%}.r3{left:29%;right:29%;bottom:9%;height:26%}.roomLabel{position:relative;z-index:2;text-shadow:0 2px 8px #000}.hall{position:absolute;left:47%;top:52%;width:6%;height:23%;background:linear-gradient(90deg,#261b2e,#4a3653,#211727);box-shadow:inset 0 0 12px #000}.guest{position:absolute;font-size:38px;transition:left .36s linear,top .36s linear;z-index:9;filter:drop-shadow(0 6px 8px #000)}.trap{position:absolute;z-index:11;min-height:44px;border:1px solid #cda8f455;border-radius:12px;padding:7px 9px;color:#fff;font-size:11px;font-weight:950;background:linear-gradient(135deg,#5e328d,#932f6a);box-shadow:0 6px 18px #0008,inset 0 0 12px #ffffff0d;touch-action:manipulation}.trap:active{transform:scale(.96)}.t1{left:9%;top:46%}.t2{right:9%;top:46%}.t3{left:34%;bottom:10%}.fear{position:absolute;left:8%;right:8%;bottom:2%;height:10px;border-radius:99px;background:#000a;overflow:hidden;z-index:15}.fear i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5de6ca,#ffd25d,#ff577d);transition:width .2s}.spark{position:absolute;font-size:50px;z-index:20;animation:pop .48s forwards;filter:drop-shadow(0 0 10px #f2b6ff)}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:19}.flash.on{animation:flash .28s}.msg{margin:9px 0 0;padding:10px;border-radius:14px;background:#ffffff0b;font-size:13px;color:#ddd2e7}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#20122d}.result.on{display:block}.btn{min-height:56px;border:0;border-radius:15px;color:#fff;font-weight:950;background:linear-gradient(135deg,#7d4eff,#d248c3)}@keyframes pop{to{transform:scale(1.7) rotate(-8deg);opacity:0}}@keyframes flash{0%{opacity:0}35%{opacity:.2}100%{opacity:0}}@keyframes flicker{0%,100%{filter:brightness(.8)}50%{filter:brightness(1.25)}}.window{animation:flicker 2.4s infinite alternate}.w2{animation-delay:.8s}.w3{animation-delay:1.4s}</style></head><body><main class="app"><div class="tag">HAUNTED HOUSE MANAGEMENT</div><h1>SCARE SHIFT</h1><p class="sub">薄暗い屋敷を巡る客が部屋に入った瞬間、仕掛けを発動。連続成功でSCARE倍率アップ。</p><section class="panel"><div class="hud"><span class="pill">GUEST <b id="guestNo">1</b>/12</span><span class="pill">SCARE <b id="score">0</b></span><span class="pill">ENERGY <b id="energy">100</b></span><span class="pill">COMBO <b id="combo">0</b></span></div><div class="house" id="house"><div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="facade"></div><div class="web web1"></div><div class="web web2"></div><div class="window w1"><div class="curtain"></div></div><div class="window w2"><div class="curtain"></div></div><div class="window w3"><div class="curtain"></div></div><div class="room r1"><span class="roomLabel">🕯️<br>呪いの人形室</span></div><div class="room r2"><span class="roomLabel">🪞<br>血塗れ鏡の間</span></div><div class="room r3"><span class="roomLabel">⚰️<br>地下棺室</span></div><div class="hall"></div><button class="trap t1" data-room="0">👻 飛び出す</button><button class="trap t2" data-room="1">🕷️ 落とす</button><button class="trap t3" data-room="2">🧟 起きる</button><div class="guest" id="guest">🚶</div><div class="flash" id="flash"></div><div class="fear"><i id="fearBar"></i></div></div><p class="msg" id="msg">客が門をくぐった。部屋に入る瞬間を待て。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">次の営業日</button></section></main><script>(()=>{const path=[[4,83,-1],[18,68,2],[27,60,2],[27,49,0],[25,37,0],[46,51,-1],[72,37,1],[71,49,1],[52,61,-1],[50,72,2],[50,80,2],[90,84,-1]],types=[['😐',1],['😬',1.15],['😎',.8],['👨‍👩‍👧',1.3]];let guestNo,score,energy,combo,step,timer,roomNow=-1,done=false,fear=0,type;const el=id=>document.getElementById(id),house=el('house'),guest=el('guest'),msg=el('msg'),flash=el('flash');function place(){let p=path[step];guest.style.left=p[0]+'%';guest.style.top=p[1]+'%';roomNow=p[2];step++;fear=Math.max(0,fear-1);el('fearBar').style.width=Math.min(100,fear)+'%';if(step>=path.length){clearInterval(timer);setTimeout(nextGuest,360)}}function nextGuest(){guestNo++;if(guestNo>12)return end();step=0;done=false;energy=Math.min(100,energy+12);type=types[guestNo%types.length];guest.textContent=type[0];el('guestNo').textContent=guestNo;el('energy').textContent=energy;msg.textContent=type[1]>1.2?'怖がりな客。驚かせすぎに注意。':type[1]<1?'強気な客。入室直後を狙え。':'足音が近づく。仕掛けを温存。';timer=setInterval(place,430);place()}document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{let r=+b.dataset.room;if(energy<12){msg.textContent='ENERGY不足。次の客まで温存。';return}energy-=12;el('energy').textContent=energy;if(r===roomNow&&!done){done=true;combo++;let base=20+Math.floor(Math.random()*16),pts=Math.round(base*type[1]*(1+Math.min(5,combo)*.12));fear=Math.min(100,fear+pts);score+=pts;el('score').textContent=score;el('combo').textContent=combo;el('fearBar').style.width=fear+'%';msg.textContent=fear>85?'悲鳴が屋敷中に響く！ 驚かせすぎ寸前。':`大成功 +${pts} / ${combo} COMBO`;flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');let s=document.createElement('div');s.className='spark';s.textContent=['😱','👻','💀'][r];s.style.left=guest.style.left;s.style.top=guest.style.top;house.appendChild(s);setTimeout(()=>s.remove(),520)}else{combo=0;score=Math.max(0,score-6);el('score').textContent=score;el('combo').textContent=0;msg.textContent='空振り -6。廊下ではなく部屋に入った瞬間を狙おう。'}});function end(){clearInterval(timer);rt.textContent=score>=300?'伝説のお化け屋敷！':score>=210?'人気のお化け屋敷':'営業終了';rx.textContent=`12組で SCARE ${score}。客タイプとCOMBOを読んで記録更新を狙おう。`;result.classList.add('on')}function reset(){guestNo=1;score=0;energy=100;combo=0;step=0;done=false;fear=0;type=types[0];['guestNo','score','combo'].forEach((id,i)=>el(id).textContent=[1,0,0][i]);el('energy').textContent=100;el('fearBar').style.width='0';result.classList.remove('on');clearInterval(timer);timer=setInterval(place,430);place()}retry.onclick=reset;reset()})()</script></body></html>
