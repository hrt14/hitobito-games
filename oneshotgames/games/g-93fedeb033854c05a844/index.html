<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SCARE SHIFT: HAUNTED HOUSE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090611;color:#fff;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 92px;background:radial-gradient(circle at 50% 0,#382452,#120b1d 46%,#050308)}h1{font-size:30px;margin:4px 0}.tag{font-size:11px;font-weight:900;letter-spacing:.15em;color:#d99bff}.sub{margin:0 0 10px;color:#cbbfd8;font-size:13px}.panel{padding:12px;border-radius:22px;background:#160e23dd;border:1px solid #ffffff1f;box-shadow:0 22px 60px #0009}.hud{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.pill{padding:6px 9px;border-radius:999px;background:#ffffff0d;font-size:12px;font-weight:900}.house{position:relative;height:430px;border-radius:18px;overflow:hidden;background:linear-gradient(#191128,#0a0710);box-shadow:inset 0 0 60px #000}.house:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#b997ff22 1px,transparent 1px);background-size:23px 23px}.room{position:absolute;border:2px solid #775b96;background:linear-gradient(145deg,#302144,#171022);border-radius:16px;display:grid;place-items:center;text-align:center;font-weight:900;box-shadow:inset 0 0 25px #0007}.r1{left:5%;top:7%;width:43%;height:35%}.r2{right:5%;top:7%;width:43%;height:35%}.r3{left:18%;right:18%;bottom:8%;height:35%}.hall{position:absolute;left:46%;top:40%;width:8%;height:27%;background:#4e3c61}.guest{position:absolute;font-size:38px;transition:left .36s linear,top .36s linear;z-index:6;filter:drop-shadow(0 5px 8px #000)}.trap{position:absolute;z-index:8;min-height:46px;border:0;border-radius:13px;padding:7px 10px;color:#fff;font-size:12px;font-weight:900;background:linear-gradient(135deg,#7e4bd1,#b83ed0);touch-action:manipulation}.trap:active{transform:scale(.97)}.t1{left:8%;top:27%}.t2{right:8%;top:27%}.t3{left:33%;bottom:12%}.fear{position:absolute;left:8%;right:8%;bottom:2%;height:10px;border-radius:99px;background:#0008;overflow:hidden}.fear i{display:block;height:100%;width:0;background:linear-gradient(90deg,#64f2c5,#ffd85a,#ff5c7a);transition:width .2s}.spark{position:absolute;font-size:48px;z-index:10;animation:pop .48s forwards}@keyframes pop{to{transform:scale(1.7) rotate(-8deg);opacity:0}}.msg{margin:9px 0 0;padding:10px;border-radius:14px;background:#ffffff0b;font-size:13px;color:#ddd2e7}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#20122d}.result.on{display:block}.btn{min-height:56px;border:0;border-radius:15px;color:#fff;font-weight:950;background:linear-gradient(135deg,#7d4eff,#d248c3)}</style></head><body><main class="app"><div class="tag">HAUNTED HOUSE MANAGEMENT</div><h1>SCARE SHIFT</h1><p class="sub">客のタイプと部屋を見て、入室直後に仕掛けを発動。連続成功でSCARE倍率アップ。</p><section class="panel"><div class="hud"><span class="pill">GUEST <b id="guestNo">1</b>/12</span><span class="pill">SCARE <b id="score">0</b></span><span class="pill">ENERGY <b id="energy">100</b></span><span class="pill">COMBO <b id="combo">0</b></span></div><div class="house" id="house"><div class="room r1">🕯️<br>人形の間</div><div class="room r2">🪞<br>鏡の間</div><div class="room r3">⚰️<br>地下墓室</div><div class="hall"></div><button class="trap t1" data-room="0">👻 飛び出す</button><button class="trap t2" data-room="1">🕷️ 落とす</button><button class="trap t3" data-room="2">🧟 起きる</button><div class="guest" id="guest">🚶</div><div class="fear"><i id="fearBar"></i></div></div><p class="msg" id="msg">客が入場。部屋に入った瞬間を狙おう。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">次の営業日</button></section></main><script>(()=>{const path=[[2,88,-1],[18,64,2],[27,60,2],[28,47,0],[25,31,0],[45,46,-1],[72,31,1],[70,46,1],[50,58,-1],[50,72,2],[50,82,2],[90,88,-1]],types=[['😐',1],['😬',1.15],['😎',.8],['👨‍👩‍👧',1.3]];let guestNo,score,energy,combo,step,timer,roomNow=-1,done=false,fear=0,type;const el=id=>document.getElementById(id),house=el('house'),guest=el('guest'),msg=el('msg');function place(){let p=path[step];guest.style.left=p[0]+'%';guest.style.top=p[1]+'%';roomNow=p[2];step++;fear=Math.max(0,fear-1);el('fearBar').style.width=Math.min(100,fear)+'%';if(step>=path.length){clearInterval(timer);setTimeout(nextGuest,360)}}function nextGuest(){guestNo++;if(guestNo>12)return end();step=0;done=false;energy=Math.min(100,energy+12);type=types[guestNo%types.length];guest.textContent=type[0];el('guestNo').textContent=guestNo;el('energy').textContent=energy;msg.textContent=type[1]>1.2?'怖がりな客。驚かせすぎに注意。':type[1]<1?'強気な客。タイミング命。':'客の動きを読む。';timer=setInterval(place,430);place()}document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{let r=+b.dataset.room;if(energy<12){msg.textContent='ENERGY不足。次の客まで温存。';return}energy-=12;el('energy').textContent=energy;if(r===roomNow&&!done){done=true;combo++;let base=20+Math.floor(Math.random()*16),pts=Math.round(base*type[1]*(1+Math.min(5,combo)*.12));fear=Math.min(100,fear+pts);score+=pts;el('score').textContent=score;el('combo').textContent=combo;el('fearBar').style.width=fear+'%';msg.textContent=fear>85?'驚かせすぎ寸前！':`大成功 +${pts} / ${combo} COMBO`;let s=document.createElement('div');s.className='spark';s.textContent='😱';s.style.left=guest.style.left;s.style.top=guest.style.top;house.appendChild(s);setTimeout(()=>s.remove(),520)}else{combo=0;score=Math.max(0,score-6);el('score').textContent=score;el('combo').textContent=0;msg.textContent='空振り -6。入室直後を狙おう。'}});function end(){clearInterval(timer);rt.textContent=score>=300?'伝説のお化け屋敷！':score>=210?'人気のお化け屋敷':'営業終了';rx.textContent=`12組で SCARE ${score}。客タイプとCOMBOを読んで記録更新を狙おう。`;result.classList.add('on')}function reset(){guestNo=1;score=0;energy=100;combo=0;step=0;done=false;fear=0;type=types[0];['guestNo','score','combo'].forEach((id,i)=>el(id).textContent=[1,0,0][i]);el('energy').textContent=100;el('fearBar').style.width='0';result.classList.remove('on');clearInterval(timer);timer=setInterval(place,430);place()}retry.onclick=reset;reset()})()</script></body></html>
