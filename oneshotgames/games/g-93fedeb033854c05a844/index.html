<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SCARE SHIFT: HAUNTED HOUSE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.house{position:relative;height:410px;border-radius:22px;overflow:hidden;background:linear-gradient(#0d1020,#080911)}.room{position:absolute;border:2px solid #66558c;background:linear-gradient(145deg,#2a2540,#12101f);border-radius:18px;display:grid;place-items:center;text-align:center;font-weight:900}.r1{left:6%;top:8%;width:42%;height:36%}.r2{right:6%;top:8%;width:42%;height:36%}.r3{left:18%;right:18%;bottom:10%;height:34%}.hall{position:absolute;left:45%;top:40%;width:10%;height:25%;background:#493c5d}.guest{position:absolute;font-size:34px;transition:left .35s linear,top .35s linear;z-index:5}.trap{position:absolute;z-index:6;min-height:44px;font-size:12px;padding:7px}.t1{left:9%;top:27%}.t2{right:9%;top:27%}.t3{left:32%;bottom:13%}.spark{position:absolute;font-size:44px;z-index:8;animation:pop .4s forwards}@keyframes pop{to{transform:scale(1.6);opacity:0}}</style></head><body><main class="app"><div class="tag">HAUNTED HOUSE MANAGEMENT</div><h1>SCARE SHIFT: HAUNTED HOUSE</h1><p class="muted">お化け屋敷全体を見ながら、お客さんが部屋に入った瞬間に仕掛けを発動。驚かせすぎず高得点を狙え。</p><div class="panel"><div class="hud"><span class="pill">GUEST <b id="guestNo">1</b>/12</span><span class="pill">SCARE <b id="score">0</b></span><span class="pill">ENERGY <b id="energy">100</b></span></div><div class="house" id="house"><div class="room r1">🕯️<br>人形の間</div><div class="room r2">🪞<br>鏡の間</div><div class="room r3">⚰️<br>地下墓室</div><div class="hall"></div><button class="trap t1" data-room="0">👻 飛び出す</button><button class="trap t2 alt" data-room="1">🕷️ 落とす</button><button class="trap t3" data-room="2">🧟 起きる</button><div class="guest" id="guest">🚶</div></div><p class="card" id="msg">お客さんが入場した。部屋に入る瞬間を狙おう。</p></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">次の営業日</button></div></main><script>(()=>{const path=[[2,88,-1],[18,64,2],[27,60,2],[28,47,0],[25,31,0],[45,46,-1],[72,31,1],[70,46,1],[50,58,-1],[50,72,2],[50,82,2],[90,88,-1]];let guestNo,score,energy,step,timer,roomNow=-1,done=false;function place(){let p=path[step];guest.style.left=p[0]+'%';guest.style.top=p[1]+'%';roomNow=p[2];step++;if(step>=path.length){clearInterval(timer);setTimeout(nextGuest,350)}}function nextGuest(){guestNo++;if(guestNo>12)return end();step=0;done=false;guest.textContent=['🚶','🧍','👨‍👩‍👧','🧑‍🎓'][guestNo%4];document.getElementById('guestNo').textContent=guestNo;timer=setInterval(place,430);place()}document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{let r=+b.dataset.room;if(energy<10){msg.textContent='ENERGY不足！';return}energy-=10;document.getElementById('energy').textContent=energy;if(r===roomNow&&!done){done=true;let pts=20+Math.floor(Math.random()*21);score+=pts;document.getElementById('score').textContent=score;msg.textContent=`大成功！ +${pts} SCARE`;let s=document.createElement('div');s.className='spark';s.textContent='😱';s.style.left=guest.style.left;s.style.top=guest.style.top;house.appendChild(s);setTimeout(()=>s.remove(),450)}else{score=Math.max(0,score-5);document.getElementById('score').textContent=score;msg.textContent='空振り… -5。部屋に入った瞬間を狙う。'}});function end(){clearInterval(timer);rt.textContent=score>=220?'伝説のお化け屋敷！':'営業終了';rx.textContent=`12組で SCARE ${score}。全体マップを見て客の位置と仕掛けの部屋を合わせよう。`;result.classList.add('on')}function reset(){guestNo=1;score=0;energy=100;step=0;done=false;document.getElementById('guestNo').textContent=1;document.getElementById('score').textContent=0;document.getElementById('energy').textContent=100;result.classList.remove('on');clearInterval(timer);timer=setInterval(place,430);place()}retry.onclick=reset;reset()})()</script></body></html>
