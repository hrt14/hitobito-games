<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SCARE SHIFT: HAUNTED HOUSE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030207;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 92px;background:radial-gradient(circle at 50% -5%,#4a315f,#120a1a 38%,#030207 72%)}.tag{font-size:11px;font-weight:900;letter-spacing:.16em;color:#e7c6ff}h1{margin:4px 0 2px;font-size:30px;text-shadow:0 0 20px #c467ff77}.sub{margin:0 0 10px;color:#d0c2d6;font-size:13px}.panel{padding:12px;border-radius:22px;background:#100b17ee;border:1px solid #ffffff20;box-shadow:0 24px 70px #000c}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.pill{padding:7px 5px;border-radius:12px;background:#ffffff0c;border:1px solid #ffffff10;text-align:center;font-size:10px;font-weight:900}.pill b{display:block;font-size:14px}.house{position:relative;height:470px;border-radius:20px;overflow:hidden;background:linear-gradient(#10091c 0 18%,#06040b 18% 100%);border:1px solid #7d5d8d;box-shadow:inset 0 0 90px #000,0 12px 35px #000a}.stars{position:absolute;inset:0 0 70%;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:33px 33px;opacity:.22}.moon{position:absolute;right:7%;top:4%;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8dc,#b9b1a2 60%,#69606a);box-shadow:0 0 35px #fff0c455}.moon:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#8c8490aa;left:14px;top:29px;box-shadow:23px -15px 0 2px #8c849088}.cloud{position:absolute;height:17px;border-radius:99px;background:#574d6288;filter:blur(2px);animation:drift 9s linear infinite}.c1{width:130px;right:-20px;top:15%}.c2{width:95px;left:-10px;top:10%;animation-duration:12s}@keyframes drift{50%{transform:translateX(26px)}}.facade{position:absolute;left:3%;right:3%;top:17%;bottom:5%;clip-path:polygon(4% 15%,15% 0,27% 14%,42% 5%,51% 17%,64% 6%,76% 14%,90% 1%,97% 16%,100% 19%,100% 100%,0 100%,0 19%);background:linear-gradient(90deg,#1b1420,#37263e 15%,#211727 50%,#3a2741 84%,#171019);border:2px solid #60476d;box-shadow:0 0 34px #000,inset 0 0 40px #0007}.roofline{position:absolute;left:5%;right:5%;top:28%;height:6px;background:#6b4a75;box-shadow:0 6px 0 #1d1421}.brick{position:absolute;inset:22% 5% 7%;opacity:.13;background:repeating-linear-gradient(0deg,transparent 0 22px,#c88ee822 22px 24px),repeating-linear-gradient(90deg,transparent 0 50px,#c88ee822 50px 52px)}.window{position:absolute;width:15%;height:14%;border:3px solid #4a3553;background:radial-gradient(circle,#d9a760,#4c3022 72%);box-shadow:inset 0 0 18px #ffcf6655,0 0 16px #000}.w1{left:12%;top:29%}.w2{right:12%;top:29%}.w3{left:43%;bottom:17%}.window:before,.window:after{content:"";position:absolute;background:#38273f}.window:before{left:48%;top:0;width:3px;height:100%}.window:after{left:0;top:48%;height:3px;width:100%}.curtain{position:absolute;inset:0;background:linear-gradient(90deg,#5d1738 0 28%,transparent 30% 70%,#5d1738 72%)}.web{position:absolute;width:72px;height:72px;border-top:1px solid #eee9f066;border-left:1px solid #eee9f066;border-radius:100% 0 0}.web:before,.web:after{content:"";position:absolute;left:0;top:0;width:62px;border-top:1px solid #eee9f044;transform-origin:left}.web:before{transform:rotate(25deg)}.web:after{transform:rotate(50deg)}.web1{left:2%;top:19%}.web2{right:1%;top:52%;transform:scaleX(-1)}.portrait{position:absolute;left:47%;top:31%;width:6%;height:10%;border:2px solid #735f40;background:#1c121b;display:grid;place-items:center;font-size:13px;z-index:4}.room{position:absolute;border:2px solid #745c80;background:linear-gradient(145deg,#442d4a,#17111b 72%);border-radius:14px;display:grid;place-items:center;text-align:center;font-weight:900;box-shadow:inset 0 0 34px #000a,0 7px 20px #0009;overflow:hidden}.room:after{content:"";position:absolute;left:0;right:0;bottom:0;height:20%;background:repeating-linear-gradient(90deg,#2d1e20 0 14px,#463031 14px 16px);opacity:.9}.r1{left:8%;top:31%;width:38%;height:26%}.r2{right:8%;top:31%;width:38%;height:26%}.r3{left:29%;right:29%;bottom:8%;height:25%}.roomLabel{position:relative;z-index:2;text-shadow:0 2px 9px #000}.hall{position:absolute;left:47%;top:52%;width:6%;height:24%;background:linear-gradient(90deg,#241728,#55395f,#211526);box-shadow:inset 0 0 14px #000}.candles{position:absolute;left:45%;top:55%;font-size:16px;filter:drop-shadow(0 0 8px #ffb957);animation:flicker .65s infinite alternate}.guest{position:absolute;font-size:40px;transition:left .34s linear,top .34s linear;z-index:9;filter:drop-shadow(0 8px 8px #000)}.trap{position:absolute;z-index:11;min-height:46px;border:1px solid #d8b0ff66;border-radius:12px;padding:8px 10px;color:#fff;font-size:11px;font-weight:950;background:linear-gradient(135deg,#6a338f,#a82970);box-shadow:0 8px 20px #0009,inset 0 0 13px #ffffff10;touch-action:manipulation}.trap:active{transform:scale(.95)}.t1{left:9%;top:47%}.t2{right:9%;top:47%}.t3{left:34%;bottom:9%}.fear{position:absolute;left:8%;right:8%;bottom:2%;height:11px;border-radius:99px;background:#000c;overflow:hidden;z-index:15}.fear i{display:block;height:100%;width:0;background:linear-gradient(90deg,#67e4c3,#ffd35c,#ff4f7b);transition:width .2s}.spark{position:absolute;font-size:54px;z-index:20;animation:pop .5s forwards;filter:drop-shadow(0 0 12px #f2b6ff)}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:19}.flash.on{animation:flash .3s}.fog{position:absolute;left:-20%;right:-20%;bottom:4%;height:70px;background:radial-gradient(ellipse,#d9d7e21e,transparent 65%);animation:fog 4s ease-in-out infinite alternate;pointer-events:none}.msg{margin:9px 0 0;padding:10px;border-radius:14px;background:#ffffff0b;font-size:13px;color:#e3d8e8;min-height:42px}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#20122d}.result.on{display:block}.btn{min-height:56px;border:0;border-radius:15px;color:#fff;font-weight:950;background:linear-gradient(135deg,#7d4eff,#d248c3)}@keyframes pop{to{transform:scale(1.8) rotate(-8deg);opacity:0}}@keyframes flash{0%{opacity:0}35%{opacity:.22}100%{opacity:0}}@keyframes flicker{to{filter:brightness(1.35)}}@keyframes fog{to{transform:translateX(8%) scaleX(.92)}}.window{animation:flicker 2.5s infinite alternate}.w2{animation-delay:.8s}.w3{animation-delay:1.4s}</style></head><body><main class="app"><div class="tag">HAUNTED HOUSE MANAGEMENT</div><h1>SCARE SHIFT</h1><p class="sub">客が部屋に入った瞬間に仕掛けを発動。連続成功で屋敷の恐怖演出が加速する。</p><section class="panel"><div class="hud"><div class="pill">GUEST<b id="guestNo">1/12</b></div><div class="pill">SCARE<b id="score">0</b></div><div class="pill">ENERGY<b id="energy">100</b></div><div class="pill">COMBO<b id="combo">0</b></div></div><div class="house" id="house"><div class="stars"></div><div class="moon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="facade"></div><div class="roofline"></div><div class="brick"></div><div class="web web1"></div><div class="web web2"></div><div class="window w1"><div class="curtain"></div></div><div class="window w2"><div class="curtain"></div></div><div class="window w3"><div class="curtain"></div></div><div class="portrait">👁</div><div class="room r1"><span class="roomLabel">🕯️<br>呪いの人形室</span></div><div class="room r2"><span class="roomLabel">🪞<br>血塗れ鏡の間</span></div><div class="room r3"><span class="roomLabel">⚰️<br>地下棺室</span></div><div class="hall"></div><div class="candles">🕯️🕯️</div><button class="trap t1" data-room="0">👻 飛び出す</button><button class="trap t2" data-room="1">🕷️ 落とす</button><button class="trap t3" data-room="2">🧟 起きる</button><div class="guest" id="guest">🚶</div><div class="flash" id="flash"></div><div class="fog"></div><div class="fear"><i id="fearBar"></i></div></div><p class="msg" id="msg">客が門をくぐった。部屋に入る瞬間を待て。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">次の営業日</button></section></main><script>(()=>{const path=[[4,83,-1],[18,68,2],[27,60,2],[27,49,0],[25,38,0],[46,51,-1],[72,38,1],[71,49,1],[52,61,-1],[50,72,2],[50,80,2],[90,84,-1]],types=[['😐',1],['😬',1.15],['😎',.82],['👨‍👩‍👧',1.28]];let guestNo,score,energy,combo,step,timer,roomNow=-1,done=false,fear=0,type;const el=id=>document.getElementById(id),house=el('house'),guest=el('guest'),msg=el('msg'),flash=el('flash');function place(){const p=path[step];guest.style.left=p[0]+'%';guest.style.top=p[1]+'%';roomNow=p[2];step++;fear=Math.max(0,fear-1);el('fearBar').style.width=Math.min(100,fear)+'%';if(step>=path.length){clearInterval(timer);setTimeout(nextGuest,340)}}function nextGuest(){guestNo++;if(guestNo>12)return end();step=0;done=false;energy=Math.min(100,energy+12);type=types[guestNo%types.length];guest.textContent=type[0];el('guestNo').textContent=guestNo+'/12';el('energy').textContent=energy;msg.textContent=type[1]>1.2?'怖がりな客。連続成功を狙える。':type[1]<1?'強気な客。入室直後を逃すな。':'足音が近づく。仕掛けを温存。';timer=setInterval(place,410);place()}document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{const r=+b.dataset.room;if(energy<12){msg.textContent='ENERGY不足。次の客まで温存。';return}energy-=12;el('energy').textContent=energy;if(r===roomNow&&!done){done=true;combo++;const base=20+Math.floor(Math.random()*16),pts=Math.round(base*type[1]*(1+Math.min(5,combo)*.12));fear=Math.min(100,fear+pts);score+=pts;el('score').textContent=score;el('combo').textContent=combo;el('fearBar').style.width=fear+'%';msg.textContent=fear>85?'悲鳴が屋敷中に反響！恐怖MAX寸前。':`大成功 +${pts} / ${combo} COMBO`;flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');const s=document.createElement('div');s.className='spark';s.textContent=['😱','👻','💀'][r];s.style.left=guest.style.left;s.style.top=guest.style.top;house.appendChild(s);setTimeout(()=>s.remove(),520)}else{combo=0;score=Math.max(0,score-6);el('score').textContent=score;el('combo').textContent=0;msg.textContent='空振り -6。部屋に入った瞬間を狙おう。'}});function end(){clearInterval(timer);rt.textContent=score>=300?'伝説のお化け屋敷！':score>=210?'人気のお化け屋敷':'営業終了';rx.textContent=`12組で SCARE ${score}。客タイプとCOMBOを読んで記録更新を狙おう。`;result.classList.add('on')}function reset(){guestNo=1;score=0;energy=100;combo=0;step=0;done=false;fear=0;type=types[0];el('guestNo').textContent='1/12';el('score').textContent=0;el('combo').textContent=0;el('energy').textContent=100;el('fearBar').style.width='0';result.classList.remove('on');clearInterval(timer);timer=setInterval(place,410);place()}retry.onclick=reset;reset()})()</script></body></html>
