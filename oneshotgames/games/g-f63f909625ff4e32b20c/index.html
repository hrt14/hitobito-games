<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>押すな！ボタン</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f8f3e7;color:#1e1e1e;min-height:100vh;display:grid;place-items:center}.wrap{width:min(92vw,420px);text-align:center}.panel{background:#fff;border:3px solid #222;border-radius:20px;padding:22px;box-shadow:8px 8px 0 #222}h1{font-size:30px;margin:0 0 8px}.score{font-size:18px;font-weight:800}.arena{height:340px;position:relative;border:3px dashed #777;border-radius:18px;margin:18px 0;overflow:hidden;background:#fffbe8}.target{position:absolute;width:92px;height:92px;border:4px solid #222;border-radius:50%;background:#ff4d4d;font-weight:900;font-size:17px;box-shadow:0 7px 0 #222;touch-action:manipulation}.target:active{transform:translateY(5px);box-shadow:0 2px 0 #222}.msg{min-height:44px;font-weight:800}.result{display:none}.result.show{display:block}.hidden{display:none}.again{width:100%;padding:14px;border:3px solid #222;border-radius:14px;background:#ffd166;font-weight:900;font-size:18px}</style></head><body><main class="wrap"><section id="play" class="panel"><h1>押すな！ボタン</h1><p>20秒で、逃げるボタンを何回押せる？</p><div class="score">残り <span id="time">20</span>秒　/　<span id="score">0</span>回</div><div class="arena" id="arena"><button class="target" id="target">押すな！</button></div><div class="msg" id="msg">押すとすぐ逃げます。</div></section><section id="result" class="panel result"><h1 id="title"></h1><p id="summary"></p><button id="again" class="again">もう一回</button></section></main><script>let s=0,t=20,started=false,timer;function move(){const maxX=arena.clientWidth-100,maxY=arena.clientHeight-100;target.style.left=Math.max(0,Math.floor(Math.random()*maxX))+'px';target.style.top=Math.max(0,Math.floor(Math.random()*maxY))+'px'}function tick(){t--;time.textContent=t;if(t<=0){clearInterval(timer);play.classList.add('hidden');result.classList.add('show');title.textContent=s>=18?'なぜそんなに押した':'終了！';summary.textContent=`記録 ${s}回。${s<8?'ボタンの方が一枚上手。':s<18?'妙にうまい。':'無駄に強い。'}`}}target.onclick=()=>{if(!started){started=true;timer=setInterval(tick,1000)}s++;score.textContent=s;msg.textContent=['逃げた！','まだ押す？','そこまでして？','無意味なのに強い。'][Math.min(3,Math.floor(s/5))];move()};again.onclick=()=>{s=0;t=20;started=false;score.textContent=0;time.textContent=20;msg.textContent='押すとすぐ逃げます。';result.classList.remove('show');play.classList.remove('hidden');move()};move()</script></body></html>
