<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>ラインキープ</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.g{width:min(94vw,520px);padding:24px}.belt{height:130px;background:#374151;border-radius:20px;position:relative;overflow:hidden;margin:20px 0}.item{position:absolute;top:35px;width:60px;height:60px;border-radius:14px;background:#f59e0b;display:grid;place-items:center;font-size:30px;transition:.08s}.zone{position:absolute;right:24px;top:20px;width:82px;height:90px;border:3px dashed #22d3ee;border-radius:16px}button{width:100%;padding:18px;border:0;border-radius:16px;font-size:20px;font-weight:800;background:#22d3ee;color:#082f49}h1{margin:0}#msg{min-height:28px}small{color:#cbd5e1}</style><main class="g"><h1>ラインキープ</h1><p>青い検品ゾーンに来た瞬間に「検品！」を押せ。10個連続で成功すると班長昇格。</p><div>成功 <b id="score">0</b>/10　ミス <b id="miss">0</b>/3</div><div class="belt"><div class="zone"></div><div class="item" id="item">📦</div></div><button id="tap">検品！</button><p id="msg"></p><small>3ミスでライン停止。</small></main><script>const item=document.querySelector('#item'),scoreEl=document.querySelector('#score'),missEl=document.querySelector('#miss'),msg=document.querySelector('#msg'),btn=document.querySelector('#tap');let x=-70,score=0,miss=0,speed=2.6,done=false;function reset(){x=-70;speed=2.4+Math.random()*1.8;item.textContent=['📦','🥫','🧃','🧴'][Math.floor(Math.random()*4)]}function end(win){done=true;msg.textContent=win?'班長昇格！ラインを守り切った。':'ライン停止！もう一度挑戦しよう。';btn.textContent='もう一度';}btn.onclick=()=>{if(done){score=miss=0;done=false;scoreEl.textContent=missEl.textContent=0;msg.textContent='';btn.textContent='検品！';reset();return}if(x>360&&x<455){score++;scoreEl.textContent=score;msg.textContent='✓ ジャスト検品';if(score>=10)return end(true);reset()}else{miss++;missEl.textContent=miss;msg.textContent='× タイミング違い';if(miss>=3)return end(false)}};function loop(){if(!done){x+=speed;item.style.transform=`translateX(${x}px)`;if(x>520){miss++;missEl.textContent=miss;msg.textContent='× 見逃した';if(miss>=3)end(false);else reset()}}requestAnimationFrame(loop)}reset();loop();</script>
