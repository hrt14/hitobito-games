<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>RIVER SHADOWS</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07131b;color:#eefaff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 92px;background:radial-gradient(circle at 50% -10%,#315f73,#07131b 48%,#02070b)}.tag{font-size:11px;font-weight:900;letter-spacing:.16em;color:#8ef0ff}h1{margin:4px 0 2px;font-size:30px}.sub{margin:0 0 10px;color:#c3dce5;font-size:13px}.panel{padding:12px;border:1px solid #b6ecff24;border-radius:22px;background:#081925e8}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:9px}.pill{padding:7px;border-radius:12px;background:#ffffff10;text-align:center;font-size:11px;font-weight:900}.pill b{display:block;font-size:15px}.phase{margin:0 0 9px;padding:9px 11px;border-radius:14px;background:#0d2937;border:1px solid #8fe9ff33;font-size:13px;font-weight:900}.phase strong{color:#8ef0ff}.river{position:relative;height:52vh;min-height:340px;overflow:hidden;border-radius:18px;background:linear-gradient(#d1eef0 0 8%,#7bcfd0 8% 24%,#318b99 24% 58%,#14566a 58% 100%);box-shadow:inset 0 -100px 100px #052b3c88}.bank{position:absolute;left:0;right:0;bottom:0;height:12%;background:linear-gradient(#5b7045,#273a24)}.shadow{position:absolute;width:70px;height:24px;border-radius:60% 40% 60% 40%;background:#07394ccc;box-shadow:18px 0 0 -8px #07394ccc;animation:swim 3s ease-in-out infinite alternate}.shadow:after{content:"";position:absolute;right:-13px;top:7px;border-left:17px solid #07394ccc;border-top:8px solid transparent;border-bottom:8px solid transparent}.shadow.sel{outline:3px solid #fff7a7;filter:drop-shadow(0 0 8px #ffe45e)}@keyframes swim{to{transform:translateX(24px)}}.line{position:absolute;width:2px;background:#f7fbffbb;transform-origin:top;display:none;z-index:7}.bobber{position:absolute;width:21px;height:27px;border-radius:50% 50% 46% 46%;background:linear-gradient(#ff4458 0 48%,#fff 48%);box-shadow:0 3px 10px #0008;display:none;z-index:8}.bobber.wait{animation:float .9s ease-in-out infinite alternate}.bobber.bite{animation:bite .16s infinite alternate}@keyframes float{to{transform:translateY(4px)}}@keyframes bite{to{transform:translateY(11px) rotate(12deg)}}.splash{position:absolute;font-size:44px;z-index:10;animation:pop .55s forwards}@keyframes pop{to{transform:scale(1.8);opacity:0}}.meterWrap{margin:9px 0}.meterLabel{display:flex;justify-content:space-between;font-size:11px;color:#c8dfe8}.meter{height:14px;background:#00131d;border-radius:99px;overflow:hidden;border:1px solid #ffffff1c}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#62d9ff 0 35%,#6ff2b8 35% 68%,#ffd35f 68% 86%,#ff6576 86%);transition:width .08s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:58px;border:0;border-radius:16px;color:#fff;font-size:16px;font-weight:950;background:linear-gradient(135deg,#00a8d8,#546dff);touch-action:manipulation}.btn.alt{background:linear-gradient(135deg,#ff9e32,#ff426e)}.btn:disabled{opacity:.35}.msg{margin:9px 0 0;padding:10px 12px;border-radius:14px;background:#ffffff0c;color:#d7edf4;font-size:13px;min-height:42px}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#092433}.result.on{display:block}</style></head><body><main class="app"><div class="tag">CAST · BITE · FIGHT</div><h1>RIVER SHADOWS</h1><p class="sub">魚影を選び、キャスト。ウキが沈んだら合わせ、緑の張力を保って取り込め。</p><section class="panel"><div class="hud"><div class="pill">釣果<b id="catch">0</b></div><div class="pill">連続<b id="combo">0</b></div><div class="pill">残り<b id="left">8</b></div></div><div class="phase" id="phase"><strong>① 狙う</strong> 魚影をタップ</div><div class="river" id="river"><div class="bank"></div><div class="line" id="line"></div><div class="bobber" id="bobber"></div></div><div class="meterWrap"><div class="meterLabel"><span>糸の張り</span><span>緑をキープ</span></div><div class="meter"><i id="tension"></i></div></div><div class="actions"><button class="btn" id="cast">🎣 キャスト</button><button class="btn alt" id="reel">🌀 リール</button></div><p class="msg" id="msg">魚影を1匹選ぼう。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">もう一度釣る</button></section></main><script>(()=>{const fish=[['アユ',1],['ヤマメ',1],['イワナ',2],['ニジマス',1],['ナマズ',2],['イトウ',3],['コイ',1],['幻の金魚',3]];let target=null,phase='aim',timer=null,loop=null,t=0,progress=0,catchN=0,comboN=0,round=1;const el=id=>document.getElementById(id),river=el('river'),bobber=el('bobber'),line=el('line'),msg=el('msg'),bar=el('tension'),phaseEl=el('phase');function clear(){clearTimeout(timer);clearInterval(loop);timer=loop=null}function setPhase(p,text){phase=p;phaseEl.innerHTML=text}function splash(txt){const s=document.createElement('div');s.className='splash';s.textContent=txt;s.style.left=bobber.style.left;s.style.top=bobber.style.top;river.appendChild(s);setTimeout(()=>s.remove(),600)}function spawn(){river.querySelectorAll('.shadow').forEach(x=>x.remove());target=null;for(let i=0;i<6;i++){const sp=fish[Math.floor(Math.random()*fish.length)],d=document.createElement('div');d.className='shadow';d.style.left=(5+Math.random()*72)+'%';d.style.top=(18+Math.random()*58)+'%';d.dataset.name=sp[0];d.dataset.r=sp[1];d.onclick=()=>{if(phase!=='aim')return;river.querySelectorAll('.shadow').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');target=d;msg.textContent=sp[1]===3?'巨大な魚影。強い引きに備えろ。':'狙いを決めた。キャスト！';};river.appendChild(d)}}function castNow(){if(phase!=='aim'||!target){msg.textContent='先に魚影をタップ';return}clear();bobber.style.display='block';bobber.className='bobber wait';bobber.style.left=target.style.left;bobber.style.top=target.style.top;line.style.display='block';line.style.left='50%';line.style.top='0';line.style.height=(parseFloat(target.style.top)+4)+'%';setPhase('wait','<strong>② 待つ</strong> ウキが沈むまで待つ');msg.textContent='水面を見ろ…まだ引かない。';timer=setTimeout(()=>{phase='bite';bobber.className='bobber bite';splash('💦');setPhase('bite','<strong>③ 合わせ</strong> 今すぐ「リール」！');msg.textContent='HIT! ウキが沈んだ！';timer=setTimeout(()=>{if(phase==='bite')fail('合わせが遅れた…魚が逃げた')},900)},700+(+target.dataset.r)*260+Math.random()*700)}function reelNow(){if(phase==='bite'){clear();phase='fight';t=45;progress=0;setPhase('fight','<strong>④ ファイト</strong> リールを短く刻んで緑を保つ');msg.textContent='掛かった！ 緑の範囲で巻き続けろ。';loop=setInterval(fightTick,90);return}if(phase==='fight'){t=Math.min(100,t+14);progress+=7;return}if(phase==='wait'){fail('早合わせ！まだ食っていない');return}msg.textContent=phase==='aim'?'魚影を選んでキャスト':'次の魚を待とう'}function fightTick(){const r=+target.dataset.r;t+=((Math.random()*13)-5)+r*1.8;t-=4.8;bar.style.width=Math.max(0,Math.min(100,t))+'%';progress+=1.5;if(t>=96)return fail('糸が張りすぎて切れた！');if(t<=4)return fail('糸が緩んでバレた！');if(progress>=100)return win()}function win(){clear();const name=target.dataset.name;catchN++;comboN++;msg.textContent=`${name}を取り込んだ！`;splash('🐟');finishRound()}function fail(text){clear();comboN=0;msg.textContent=text;finishRound()}function finishRound(){bar.style.width='0';bobber.style.display='none';line.style.display='none';el('catch').textContent=catchN;el('combo').textContent=comboN;round++;el('left').textContent=Math.max(0,9-round);if(round>8)return end();setTimeout(()=>{setPhase('aim','<strong>① 狙う</strong> 魚影をタップ');spawn()},650)}function end(){setPhase('done','<strong>終了</strong> 今日の釣りを振り返ろう');rt.textContent=catchN>=6?'川の名人！':catchN>=4?'好釣果！':'次はもっと釣れる';rx.textContent=`8投で${catchN}匹。最高連続は画面のCOMBO記録を伸ばしてみよう。`;result.classList.add('on')}function reset(){clear();target=null;phase='aim';t=0;progress=0;catchN=0;comboN=0;round=1;el('catch').textContent=0;el('combo').textContent=0;el('left').textContent=8;bar.style.width='0';bobber.style.display='none';line.style.display='none';result.classList.remove('on');setPhase('aim','<strong>① 狙う</strong> 魚影をタップ');msg.textContent='魚影を1匹選ぼう。';spawn()}cast.onclick=castNow;reel.onclick=reelNow;retry.onclick=reset;reset()})()</script></body></html>
