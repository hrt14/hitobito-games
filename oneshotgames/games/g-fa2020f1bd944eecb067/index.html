<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>RIVER SHADOWS</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06131d;color:#eefaff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 92px;background:radial-gradient(circle at 50% -10%,#244f65,#07131d 48%,#03090e)}h1{margin:4px 0 2px;font-size:30px}.tag{font-size:11px;font-weight:900;letter-spacing:.16em;color:#7be8ff}.sub{margin:0 0 10px;color:#b8d5df;font-size:13px;line-height:1.45}.panel{padding:12px;border:1px solid #b6ecff24;border-radius:22px;background:#081925cc;box-shadow:0 22px 60px #0007}.hud{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.pill{padding:6px 9px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff18;font-size:12px;font-weight:900}.river{position:relative;height:55vh;min-height:360px;overflow:hidden;border-radius:18px;background:linear-gradient(#b8ebef 0 9%,#6bc4c5 9% 25%,#2e8e9d 25% 58%,#135b70 58% 100%);box-shadow:inset 0 -80px 100px #052b3c88}.river:before,.river:after{content:"";position:absolute;left:-10%;width:120%;height:26px;border-radius:50%;border-top:3px solid #ffffff38;animation:ripple 3s linear infinite}.river:before{top:22%}.river:after{top:36%;animation-delay:-1.4s}@keyframes ripple{50%{transform:translateX(5%) scaleX(.92)}}.reed{position:absolute;bottom:0;font-size:54px}.shadow{position:absolute;width:66px;height:24px;border-radius:60% 38% 60% 38%;background:#07394caa;box-shadow:18px 0 0 -8px #07394caa;transition:.18s;animation:swim 3.2s ease-in-out infinite alternate}.shadow:after{content:"";position:absolute;right:-13px;top:7px;border-left:17px solid #07394caa;border-top:8px solid transparent;border-bottom:8px solid transparent}@keyframes swim{to{transform:translateX(24px) rotate(2deg)}}.shadow.sel{outline:3px solid #fff8b0;filter:drop-shadow(0 0 8px #ffe66f)}.bobber{position:absolute;width:22px;height:22px;border-radius:50%;background:linear-gradient(#ff4d62 0 50%,#fff 50%);box-shadow:0 4px 12px #0008;display:none;z-index:5}.bobber.bite{animation:bob .18s infinite alternate}@keyframes bob{to{transform:translateY(10px) rotate(15deg)}}.splash{position:absolute;font-size:46px;z-index:8;animation:pop .55s forwards}@keyframes pop{to{transform:scale(1.8);opacity:0}}.meter{height:12px;background:#00131d;border-radius:99px;overflow:hidden;margin:9px 0}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#74f1cd,#ffe467,#ff6b75);transition:width .08s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:56px;border:0;border-radius:16px;color:#fff;font-size:17px;font-weight:950;background:linear-gradient(135deg,#00a8d8,#556cff);touch-action:manipulation}.btn.alt{background:linear-gradient(135deg,#ff9e32,#ff426e)}.btn:active{transform:scale(.98)}.msg{margin:9px 0 0;padding:10px 12px;border-radius:14px;background:#ffffff0c;color:#d7edf4;font-size:13px}.book{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.chip{padding:5px 7px;border-radius:999px;background:#ffffff0e;font-size:10px}.chip.on{background:#8ff6d222;color:#9ff7db}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#092433;border:1px solid #ffffff20}.result.on{display:block}</style></head><body><main class="app"><div class="tag">RIVER FISHING COLLECTION</div><h1>RIVER SHADOWS</h1><p class="sub">魚影をタップ → キャスト → 食いついた瞬間に引く。レア魚ほど待ち時間と判定がシビア。</p><section class="panel"><div class="hud"><span class="pill">図鑑 <b id="count">0</b>/20</span><span class="pill">連続 <b id="combo">0</b></span><span class="pill" id="target">魚影を選ぶ</span></div><div class="river" id="river"><span class="reed" style="left:-8px">🌿</span><span class="reed" style="right:-6px">🌾</span><div class="bobber" id="bobber"></div></div><div class="meter"><i id="tension"></i></div><div class="actions"><button class="btn" id="cast">🎣 キャスト</button><button class="btn alt" id="reel">⚡ 引く！</button></div><p class="msg" id="msg">流れる魚影を1匹選ぼう。</p><div class="book" id="book"></div></section><section class="result" id="result"><h2>川の図鑑完成！</h2><p>全20種をコンプリート。連続釣果も伸ばしてみよう。</p><button class="btn" id="retry">もう一度集める</button></section></main><script>(()=>{const species=[['アユ',1],['ヤマメ',1],['イワナ',2],['ニジマス',1],['コイ',1],['フナ',1],['ウグイ',1],['オイカワ',1],['ナマズ',2],['ウナギ',2],['ドジョウ',1],['ワカサギ',1],['カジカ',2],['イトウ',3],['ハス',2],['タナゴ',1],['モツゴ',1],['ニゴイ',2],['ブラックバス',2],['幻の金魚',3]];let got=new Set,target=null,bite=false,timer=null,combo=0,tick=null;const river=document.getElementById('river'),msg=document.getElementById('msg'),bobber=document.getElementById('bobber'),tension=document.getElementById('tension');function cancel(){clearTimeout(timer);clearInterval(tick);timer=null;tick=null;bite=false}function randFish(){let roll=Math.random(),pool=species.filter(x=>x[1]===1||(x[1]===2&&roll>.35)||(x[1]===3&&roll>.78));return pool[Math.floor(Math.random()*pool.length)]}function shadows(){river.querySelectorAll('.shadow').forEach(x=>x.remove());target=null;document.getElementById('target').textContent='魚影を選ぶ';for(let i=0;i<8;i++){const sp=randFish(),d=document.createElement('div');d.className='shadow';d.style.left=(3+Math.random()*78)+'%';d.style.top=(15+Math.random()*68)+'%';d.style.animationDelay=(-Math.random()*3)+'s';d.dataset.sp=sp[0];d.dataset.r=sp[1];d.onclick=()=>{river.querySelectorAll('.shadow').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');target=d;document.getElementById('target').textContent=sp[1]===3?'巨大な魚影！':sp[1]===2?'濃い魚影':'魚影ロック';msg.textContent='狙いを決めた。キャスト！'};river.appendChild(d)}}function cast(){if(!target||!target.isConnected){msg.textContent='先に魚影をタップ';return}cancel();tension.style.width='0';bobber.style.display='block';bobber.classList.remove('bite');bobber.style.left=target.style.left;bobber.style.top=target.style.top;let r=+target.dataset.r;msg.textContent='水面を見て待て…';timer=setTimeout(()=>{if(!target||!target.isConnected)return;bite=true;bobber.classList.add('bite');msg.textContent='HIT! 今すぐ引け！';let p=0;tick=setInterval(()=>{p+=6+r*2;tension.style.width=Math.min(100,p)+'%';if(p>=100){cancel();combo=0;document.getElementById('combo').textContent=0;msg.textContent='糸が切れた…';bobber.style.display='none';shadows()}},70)},650+r*300+Math.random()*900)}function reelNow(){if(!target){msg.textContent='魚影を選んでキャスト';return}if(!bite){cancel();combo=0;document.getElementById('combo').textContent=0;msg.textContent='早すぎた！魚が散った';bobber.style.display='none';shadows();return}let r=+target.dataset.r,sp=target.dataset.sp;cancel();if(Math.random()>Math.max(.45,.94-r*.12)){combo=0;msg.textContent='あと少しでバレた！'}else{got.add(sp);combo++;msg.textContent=`${sp} GET! ${combo>1?combo+'連続！':''}`;let s=document.createElement('div');s.className='splash';s.textContent=r===3?'✨🐟✨':'💦';s.style.left=target.style.left;s.style.top=target.style.top;river.appendChild(s);setTimeout(()=>s.remove(),600)}bobber.style.display='none';bobber.classList.remove('bite');tension.style.width='0';document.getElementById('combo').textContent=combo;renderBook();shadows();if(got.size===20)result.classList.add('on')}function renderBook(){count.textContent=got.size;book.innerHTML=species.map(([s,r])=>`<span class="chip ${got.has(s)?'on':''}">${got.has(s)?'✓ '+s:'？'+(r===3?' ★':'')}</span>`).join('')}function reset(){cancel();got.clear();target=null;combo=0;result.classList.remove('on');bobber.style.display='none';tension.style.width='0';document.getElementById('combo').textContent=0;renderBook();shadows();msg.textContent='流れる魚影を1匹選ぼう。'}cast.onclick=cast;reel.onclick=reelNow;retry.onclick=reset;reset()})()</script></body></html>
