<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>RIVER SHADOWS</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.river{height:360px;position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(90deg,#1c6f82,#55b0a9,#246b89)}.shadow{position:absolute;width:58px;height:22px;border-radius:50%;background:#062f3b99;transform:rotate(-8deg)}.bobber{position:absolute;font-size:36px;display:none}.book{display:flex;gap:5px;flex-wrap:wrap}.fishchip{padding:5px 8px;border-radius:999px;background:#ffffff0d;font-size:11px}</style></head><body><main class="app"><div class="tag">RIVER FISHING COLLECTION</div><h1>RIVER SHADOWS</h1><p class="muted">魚影をタップして狙いを決め、竿を投げる。食いついたら引く。全20種の図鑑を埋めよう。</p><div class="panel"><div class="hud"><span class="pill">GET <b id="count">0</b>/20</span><span class="pill" id="target">魚影を選ぶ</span></div><div class="river" id="river"><div class="bobber" id="bobber">🔴</div></div><div class="btns"><button id="cast">🎣 投げる</button><button class="alt" id="reel">引く！</button></div><div class="book" id="book"></div><p class="card" id="msg">川を泳ぐ魚影をタップ。</p></div><div class="panel result" id="result"><h2>川の図鑑完成！</h2><p>20種類すべて釣り上げた。</p><button id="retry">図鑑をリセット</button></div></main><script>(()=>{const species=['アユ','ヤマメ','イワナ','ニジマス','コイ','フナ','ウグイ','オイカワ','ナマズ','ウナギ','ドジョウ','ワカサギ','カジカ','イトウ','ハス','タナゴ','モツゴ','ニゴイ','ブラックバス','幻の金魚'];let got=new Set,target=null,bite=false,timer=null;function cancelBite(){if(timer!==null){clearTimeout(timer);timer=null}bite=false}function shadows(){river.querySelectorAll('.shadow').forEach(x=>x.remove());target=null;document.getElementById('target').textContent='魚影を選ぶ';for(let i=0;i<7;i++){let d=document.createElement('div');d.className='shadow';d.style.left=(5+Math.random()*82)+'%';d.style.top=(10+Math.random()*78)+'%';d.dataset.sp=species[Math.floor(Math.random()*species.length)];d.onclick=()=>{target=d;document.getElementById('target').textContent=d.dataset.sp+'？';msg.textContent='この魚影を狙う。投げよう。'};river.appendChild(d)}}function cast(){if(!target||!target.isConnected){msg.textContent='先に魚影を選ぼう';return}cancelBite();bobber.style.display='block';bobber.textContent='🔴';bobber.style.left=target.style.left;bobber.style.top=target.style.top;msg.textContent='じっと待つ…';timer=setTimeout(()=>{timer=null;if(!target||!target.isConnected)return;bite=true;msg.textContent='食った！ 今すぐ「引く！」';bobber.textContent='💥'},500+Math.random()*1400)}function reelNow(){if(!bite){cancelBite();msg.textContent='まだ早い！魚が逃げた';bobber.style.display='none';bobber.textContent='🔴';shadows();return}if(!target||!target.isConnected){cancelBite();bobber.style.display='none';bobber.textContent='🔴';msg.textContent='魚影を見失った。もう一度狙おう。';shadows();return}const sp=target.dataset.sp;cancelBite();got.add(sp);msg.textContent=`${sp} を釣った！`;bobber.style.display='none';bobber.textContent='🔴';renderBook();shadows();if(got.size===20)result.classList.add('on')}function renderBook(){count.textContent=got.size;book.innerHTML=species.map(s=>`<span class="fishchip">${got.has(s)?'✓ '+s:'？'}</span>`).join('')}function reset(){cancelBite();got.clear();target=null;result.classList.remove('on');bobber.style.display='none';bobber.textContent='🔴';renderBook();shadows();msg.textContent='川を泳ぐ魚影をタップ。'}cast.onclick=cast;reel.onclick=reelNow;retry.onclick=reset;reset()})()</script></body></html>
