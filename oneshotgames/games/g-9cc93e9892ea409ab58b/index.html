<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>深夜コンビニ店長</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ff;font-family:system-ui;color:#172554;min-height:100vh;display:grid;place-items:center}.g{width:min(94vw,520px);padding:22px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 12px 30px #0001}button{width:100%;margin:7px 0;padding:16px;border:0;border-radius:14px;background:#2563eb;color:#fff;font-size:18px;font-weight:800}.stat{display:flex;justify-content:space-between;margin:12px 0}.good{color:#15803d}.bad{color:#b91c1c}</style><main class="g"><div class="card"><h1>深夜コンビニ店長</h1><p>5ターンだけ店を回せ。利益を残しつつ評判を落としすぎるな。</p><div class="stat"><span>利益 ¥<b id="money">5000</b></span><span>評判 <b id="rep">50</b></span></div><h2 id="event">開始</h2><div id="choices"></div><p id="msg"></p></div></main><script>const E=[['客が一気に来た',['レジ応援',-500,8],['ワンオペ継続',700,-8]],['弁当が余りそう',['値引きする',-200,7],['定価で粘る',500,-5]],['コピー機で困る客',['案内する',-300,6],['セルフでお願い',300,-4]],['床が汚れた',['すぐ清掃',-400,8],['朝まで放置',400,-10]],['新商品を置くか',['少量だけ',300,3],['大量発注',1000,-6]]];let t=0,m=5000,r=50;const q=s=>document.querySelector(s);function draw(){q('#money').textContent=m;q('#rep').textContent=r;if(t>=5){q('#event').textContent='閉店レポート';q('#choices').innerHTML=`<button onclick="location.reload()">もう一度</button>`;q('#msg').textContent=(m>=6500&&r>=45)?'黒字＆評判キープ！名店長。':'店は回った。次はもっと上手くできる。';return}let e=E[t];q('#event').textContent=e[0];q('#choices').innerHTML=e.slice(1).map((c,i)=>`<button data-i="${i}">${c[0]}</button>`).join('');[...q('#choices').children].forEach(b=>b.onclick=()=>{let c=e[+b.dataset.i+1];m+=c[1];r=Math.max(0,Math.min(100,r+c[2]));q('#msg').textContent=`${c[1]>=0?'+':''}¥${c[1]} / 評判 ${c[2]>=0?'+':''}${c[2]}`;t++;draw()})}draw();</script>
