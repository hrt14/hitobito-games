<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スーパーリアクター</title><style>:root{font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 18%,#2b2f77,#0b1027 58%,#050812);color:#fff;display:grid;place-items:center;padding:16px}.game{width:min(100%,460px);background:#111831;border:1px solid #35406f;border-radius:28px;padding:18px;box-shadow:0 24px 70px #0008}h1{margin:0;font-size:30px}.sub{margin:6px 0 14px;color:#c9d1ff}.hud{display:flex;gap:10px;margin-bottom:12px}.chip{flex:1;background:#1b254b;border-radius:14px;padding:10px;text-align:center;font-weight:900}.arena{height:390px;position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#172255,#0d1536);border:2px solid #394b91;touch-action:none}.target{position:absolute;width:72px;height:72px;border:0;border-radius:50%;font-size:32px;font-weight:900;background:radial-gradient(circle at 35% 30%,#fff,#65f3ff 24%,#3c78ff 62%,#6339e5);box-shadow:0 0 24px #5bdfffaa;transform:translate(-50%,-50%);transition:left .12s,top .12s,transform .08s}.target:active{transform:translate(-50%,-50%) scale(.86)}.target.hot{background:radial-gradient(circle at 35% 30%,#fff,#ffe96b 24%,#ff8a00 62%,#f43b47)}.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#fff}.flash.on{animation:flash .18s}@keyframes flash{50%{opacity:.24}}.bar{height:12px;background:#263057;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#62f4ff,#ffd54a,#ff5d8f)}button.start{width:100%;padding:15px;border:0;border-radius:16px;font-size:18px;font-weight:900;background:#6bf1ff;color:#091128}.msg{min-height:46px;text-align:center;font-weight:800;color:#e8ebff}.result{display:none;text-align:center}.result.show{display:block}.hidden{display:none}.scorebig{font-size:64px;font-weight:1000;margin:14px 0}</style></head><body><main class="game"><section id="intro"><h1>スーパーリアクター</h1><p class="sub">20秒。光るコアを連続タップしてコンボをつなげ。</p><button class="start" id="begin">ゲーム開始</button></section><section id="play" class="hidden"><div class="hud"><div class="chip">SCORE <b id="score">0</b></div><div class="chip">COMBO <b id="combo">0</b></div><div class="chip">TIME <b id="time">20.0</b></div></div><div class="arena" id="arena"><button class="target" id="target" aria-label="光るコア">●</button><div class="flash" id="flash"></div></div><div class="bar"><i id="bar"></i></div><div class="msg" id="msg">光るコアを追え！</div></section><section id="result" class="result"><h1 id="rtitle">RESULT</h1><div class="scorebig" id="finalScore">0</div><p id="rtext"></p><button class="start" id="again">もう一回</button></section></main><script>let score=0,combo=0,bestCombo=0,left=20,running=false,timer;const spots=[[18,20],[50,18],[82,22],[24,48],[50,50],[78,48],[18,78],[48,80],[82,76]];function move(){const p=spots[Math.floor(Math.random()*spots.length)];target.style.left=p[0]+'%';target.style.top=p[1]+'%';target.classList.toggle('hot',Math.random()<.28)}function start(){score=0;combo=0;bestCombo=0;left=20;running=true;intro.classList.add('hidden');result.classList.remove('show');play.classList.remove('hidden');scoreEl();move();clearInterval(timer);timer=setInterval(()=>{left-=.1;if(left<=0){left=0;end()}time.textContent=left.toFixed(1);bar.style.width=(left/20*100)+'%'},100)}function scoreEl(){score.textContent=score;comboEl.textContent=combo}const comboEl=document.getElementById('combo');target.onclick=()=>{if(!running)return;const hot=target.classList.contains('hot');combo++;bestCombo=Math.max(bestCombo,combo);const gain=(hot?30:10)+Math.min(combo,20)*2;score+=gain;scoreEl();msg.textContent=hot?'SUPER CORE! +'+gain:'HIT! +'+gain;flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');move()};arena.onclick=e=>{if(!running||e.target===target)return;combo=0;score=Math.max(0,score-8);scoreEl();msg.textContent='MISS -8';move()};function end(){if(!running)return;running=false;clearInterval(timer);play.classList.add('hidden');result.classList.add('show');finalScore.textContent=score;rtitle.textContent=score>=900?'神反応！':score>=600?'高速リアクター！':'REACTION RESULT';rtext.textContent='最大コンボ '+bestCombo+'。'+(score>=600?'かなり速い。次は900点を狙え！':'ミスを減らすと一気に伸びる。')}begin.onclick=start;again.onclick=start</script></body></html>
