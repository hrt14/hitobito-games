<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>たまごむき職人</title><style>body{margin:0;background:#fff7ed;font-family:system-ui;display:grid;place-items:center;min-height:100vh;color:#7c2d12}.g{text-align:center;width:min(92vw,480px)}#egg{width:220px;height:280px;margin:20px auto;border-radius:50% 50% 45% 45%;background:#f3f4f6;box-shadow:inset 0 0 0 12px #e5e7eb;display:grid;place-items:center;font-size:64px;user-select:none;touch-action:manipulation}button{padding:16px 22px;border:0;border-radius:14px;background:#f97316;color:white;font-weight:800;font-size:18px}#bar{height:14px;background:#fed7aa;border-radius:10px;overflow:hidden}#fill{height:100%;background:#fb923c;width:0}</style><main class="g"><h1>たまごむき職人</h1><p>ヒビをタップして、白身を傷つけず20枚むけ！</p><div id="bar"><div id="fill"></div></div><div id="egg">🥚</div><p id="msg">タップ開始</p><button id="again" hidden>もう一度</button></main><script>const egg=document.querySelector('#egg'),fill=document.querySelector('#fill'),msg=document.querySelector('#msg'),again=document.querySelector('#again');let n=0,bad=0,done=false;egg.onclick=()=>{if(done)return;n++;if(Math.random()<.16){bad++;msg.textContent='白身まで削った！慎重に…'}else msg.textContent='パリッ！気持ちいい';fill.style.width=Math.min(100,n*5)+'%';egg.style.transform=`rotate(${(Math.random()-.5)*8}deg) scale(${1+n*.002})`;if(n>=20){done=true;egg.textContent=bad<=3?'✨🥚✨':'🥚';msg.textContent=bad<=3?'つるん！職人級のむき上がり':'むけた！でも少しボコボコ。';again.hidden=false}};again.onclick=()=>location.reload();</script>
