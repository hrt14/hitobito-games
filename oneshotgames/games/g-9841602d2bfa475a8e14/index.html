<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>無駄ボタン選手権</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#0f1221;color:#f7f7fb;min-height:100vh;display:grid;place-items:center}.wrap{width:min(92vw,430px);text-align:center}.panel{background:#171b31;border:3px solid #fff;border-radius:22px;padding:20px;box-shadow:10px 10px 0 #ff4fd8}h1{margin:0 0 8px;font-size:30px}.sub{opacity:.8}.hud{display:flex;justify-content:space-between;font-weight:900;margin:14px 0}.arena{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.btn{min-height:110px;border:3px solid #fff;border-radius:18px;background:#2b3159;color:#fff;font-size:20px;font-weight:900;box-shadow:0 7px 0 #000;touch-action:manipulation}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #000}.btn.wide{grid-column:1/-1}.msg{min-height:52px;font-weight:800}.bar{height:14px;border:2px solid #fff;border-radius:999px;overflow:hidden;background:#090b14}.fill{height:100%;width:0;background:linear-gradient(90deg,#6df7ff,#ff4fd8);transition:width .2s}.result{display:none}.result.show{display:block}.hidden{display:none}.again{width:100%;padding:15px;border:3px solid #fff;border-radius:14px;background:#ffe96a;color:#111;font-size:18px;font-weight:900}</style></head><body><main class="wrap"><section id="play" class="panel"><h1>無駄ボタン選手権</h1><p class="sub">正解っぽいボタンを押して、10点取れ。</p><div class="hud"><span>得点 <b id="score">0</b>/10</span><span>ミス <b id="miss">0</b>/5</span></div><div class="bar"><div id="fill" class="fill"></div></div><div class="arena" id="arena"><button class="btn" data-i="0">たぶん正解</button><button class="btn" data-i="1">絶対ちがう</button><button class="btn wide" data-i="2">押す意味なし</button></div><div id="msg" class="msg">毎回ルールが微妙に変わります。</div></section><section id="result" class="panel result"><h1 id="resultTitle"></h1><p id="summary"></p><button id="again" class="again">もう一回やる</button></section></main><script>const labels=['たぶん正解','絶対ちがう','押す意味なし','今はこれ','知らんけど','こっちかも','罠です','押したいならどうぞ'];let s=0,m=0,answer=0,round=0;const buttons=[...document.querySelectorAll('.btn')];function shuffleLabels(){buttons.forEach((b,i)=>{b.textContent=labels[(round+i+Math.floor(Math.random()*labels.length))%labels.length]});answer=Math.floor(Math.random()*3);if(round%3===2)buttons[answer].textContent='これだけは押すな';else if(round%4===1)buttons[answer].textContent='今だけ正解';else buttons[answer].textContent='たぶんこれ'}function finish(win){play.classList.add('hidden');result.classList.add('show');resultTitle.textContent=win?'無駄に勝利！':'無駄に敗北！';summary.textContent=win?`10点達成。ミス ${m}回。何も得ていないのに強い。`:`ミス ${m}回。得点は ${s}点。悔しい理由は特にない。`}buttons.forEach((b,i)=>b.onclick=()=>{if(i===answer){s++;score.textContent=s;msg.textContent=['正解。なぜ？','当たった。価値はない。','また正解。困る。','妙にうまい。'][Math.min(3,Math.floor(s/3))]}else{m++;miss.textContent=m;msg.textContent='不正解。でも正解にも意味はない。'}fill.style.width=(s*10)+'%';round++;if(s>=10)return finish(true);if(m>=5)return finish(false);shuffleLabels()});again.onclick=()=>{s=0;m=0;round=0;score.textContent=0;miss.textContent=0;fill.style.width='0';msg.textContent='毎回ルールが微妙に変わります。';result.classList.remove('show');play.classList.remove('hidden');shuffleLabels()};shuffleLabels()</script></body></html>
