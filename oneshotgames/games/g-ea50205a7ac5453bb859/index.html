<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHIP BALANCE</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#241336,#10091b);color:#fff;font-family:system-ui;min-height:100vh;display:grid;place-items:center}.w{width:min(620px,100%);padding:16px}.top{display:flex;justify-content:space-between;font-weight:900}.arena{margin-top:10px;height:420px;border-radius:24px;background:linear-gradient(#3a1e4f,#151124);position:relative;overflow:hidden;border:2px solid #ffffff22}.player{position:absolute;bottom:20px;left:50%;font-size:54px;transform:translateX(-50%)}.chip{position:absolute;font-size:30px}.hud{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.bar{height:12px;background:#ffffff18;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#43e6a5,#ffc857)}button{border:0;border-radius:18px;padding:15px;font-weight:900;font-size:17px}.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{display:none;text-align:center;padding:28px;background:#ffffff0d;border-radius:22px}</style></head><body><main class="w"><div class="top"><span>🥔 CHIP BALANCE</span><span>得点 <b id="score">0</b></span></div><p>左右に動いてチップを集めよう。満腹100%になる前に30秒生き残れ！</p><section id="game"><div class="hud"><div>満腹 <div class="bar"><div id="full" class="fill"></div></div></div><div>残り <b id="time">30</b>秒</div></div><div class="arena" id="arena"><div class="player" id="p">😋</div></div><div class="ctrl"><button id="l">← 左</button><button id="r">右 →</button></div></section><section id="res" class="result"><h2 id="rt"></h2><p id="rs"></p><button id="again">もう一回</button></section></main><script>(()=>{const A=arena,P=p,F=full,T=time,S=score,G=game,R=res;let x=50,fullness=15,scoreN=0,left=30,active=true,items=[];function spawn(){if(!active)return;const e=document.createElement('div');e.className='chip';e.textContent=Math.random()<.22?'🥕':'🥔';e.dataset.good=e.textContent==='🥕'?'1':'0';e.style.left=(5+Math.random()*88)+'%';e.style.top='-35px';A.appendChild(e);items.push({e,y:-35,spd:2.2+Math.random()*2})}function move(d){if(!active)return;x=Math.max(7,Math.min(93,x+d*9));P.style.left=x+'%'}function end(win){active=false;G.style.display='none';R.style.display='block';rt.textContent=win?'ナイスバランス！':'満腹になった！';rs.textContent=`得点 ${scoreN}。野菜は満腹を少し回復するよ。`}function reset(){x=50;fullness=15;scoreN=0;left=30;active=true;items.forEach(o=>o.e.remove());items=[];P.style.left='50%';F.style.width='15%';T.textContent='30';S.textContent='0';G.style.display='block';R.style.display='none'}l.onpointerdown=()=>move(-1);r.onpointerdown=()=>move(1);again.onclick=reset;setInterval(spawn,650);setInterval(()=>{if(!active)return;left--;T.textContent=left;if(left<=0)end(true)},1000);function loop(){if(active){const rect=A.getBoundingClientRect(),px=rect.width*x/100;for(const o of [...items]){o.y+=o.spd;o.e.style.top=o.y+'px';const ox=parseFloat(o.e.style.left)*rect.width/100;if(o.y>330&&o.y<395&&Math.abs(ox-px)<48){if(o.e.dataset.good==='1'){fullness=Math.max(0,fullness-16);scoreN+=8}else{fullness+=14;scoreN+=10}o.e.remove();items.splice(items.indexOf(o),1);F.style.width=Math.min(100,fullness)+'%';S.textContent=scoreN;if(fullness>=100)end(false)}else if(o.y>430){o.e.remove();items.splice(items.indexOf(o),1)}}}requestAnimationFrame(loop)}reset();loop()})();</script></body></html>
