<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>逆成長勇者</title><style>*{box-sizing:border-box}body{margin:0;background:#111018;color:#fff4df;font-family:system-ui,sans-serif}.wrap{min-height:100vh;padding:18px;background:radial-gradient(circle at 50% 0,#3b264c,#111018 58%)}.top,.panel{max-width:680px;margin:auto}.top{display:flex;justify-content:space-between;gap:8px}.pill{background:#20182a;border:1px solid #654878;border-radius:999px;padding:8px 11px;font-size:12px}.arena{max-width:680px;margin:14px auto;background:#1a1422;border:1px solid #463553;border-radius:22px;padding:22px;text-align:center}.enemy{font-size:72px}.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.bar{height:12px;background:#30263a;border-radius:999px;overflow:hidden}.fill{height:100%;background:#70e1a3;width:100%}.efill{background:#ff6b73}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button,.card button,.choice button{border:0;border-radius:14px;padding:14px 10px;font-weight:900;background:#734eb7;color:white}.actions button:nth-child(2){background:#2d7c9f}.actions button:nth-child(3){background:#a64963}.skills{margin-top:12px;font-size:12px;color:#cbbdd2}.log{min-height:42px;margin-top:10px;color:#d2c5d9}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#0c0a10ee;padding:24px}.card{max-width:520px;text-align:center}.card h1{font-size:clamp(46px,13vw,76px);line-height:.9;margin:0}.card p{line-height:1.7;color:#c9bfd0}.choice{display:grid;gap:8px;margin-top:14px}.hidden{display:none}</style></head><body><main class="wrap"><div class="top"><div class="pill" id="stage">STAGE 1/10</div><div class="pill" id="level">LV 99</div><div class="pill" id="remain">能力 6</div></div><section class="arena"><div class="enemy" id="enemy">🐗</div><h2 id="ename">鉄牙獣</h2><div class="bars"><div><small>YOU</small><div class="bar"><div class="fill" id="hpbar"></div></div></div><div><small>ENEMY</small><div class="bar"><div class="fill efill" id="ebar"></div></div></div></div><div class="actions"><button id="atk">攻撃</button><button id="guard">回避</button><button id="magic">魔法</button></div><div class="skills" id="skills"></div><div class="log" id="log">最強の勇者。しかし勝つたび、何かを失う。</div></section></main><section class="modal" id="intro"><div class="card"><h1>逆成長勇者</h1><p>LV99、最強装備、全魔法習得済み。敵を倒すたびに能力を一つ捨てる。最後まで何を残す？</p><button id="go">最強から始める</button></div></section><section class="modal hidden" id="lose"><div class="card"><h1 id="lt">敗北</h1><p id="lm"></p><button id="again">最初から</button></div></section><section class="modal hidden" id="sac"><div class="card"><h1>何を捨てる？</h1><p>この喪失は次の戦いから戻らない。</p><div class="choice" id="choices"></div></div></section><script>(()=>{'use strict';const foes=[['鉄牙獣','🐗',40],['氷術師','🧊',48],['双頭蛇','🐍',54],['石巨人','🗿',62],['影騎士','♞',70],['天空鳥','🦅',76],['虚無僧','👁️',84],['黒竜','🐉',92],['魔王の影','🌑',100],['魔王','👑',120]];const all=['攻撃力','最大体力','回避','武器','炎魔法','回復魔法'];let skillsSet,st,hp,maxhp,ehp,busy;function reset(){skillsSet=new Set(all);st=0;maxhp=100;hp=100;load()}function ui(){stage.textContent=`STAGE ${st+1}/10`;level.textContent='LV '+(99-st*9);remain.textContent='能力 '+skillsSet.size;skills.textContent='残存：'+[...skillsSet].join(' / ');hpbar.style.width=Math.max(0,hp/maxhp*100)+'%';ebar.style.width=Math.max(0,ehp/foes[st][2]*100)+'%'}function load(){ehp=foes[st][2];hp=Math.min(maxhp,hp+25);enemy.textContent=foes[st][1];ename.textContent=foes[st][0];log.textContent='敵を倒せ。勝てば、また一つ失う。';busy=false;ui()}function act(type){if(busy)return;busy=true;let dmg=0;if(type==='atk')dmg=(skillsSet.has('武器')?16:8)+(skillsSet.has('攻撃力')?8:0);if(type==='magic')dmg=skillsSet.has('炎魔法')?24:6;if(type==='guard'){hp=Math.min(maxhp,hp+(skillsSet.has('回復魔法')?10:3));log.textContent='身構えた。少し立て直す。'}else{ehp-=dmg;log.textContent=`${dmg}ダメージ。`}ui();if(ehp<=0){setTimeout(win,300);return}setTimeout(()=>{let hit=10+st*2;if(type==='guard'&&skillsSet.has('回避'))hit=Math.ceil(hit*.35);hp-=hit;log.textContent+=` 反撃 ${hit}。`;ui();if(hp<=0){lm.textContent=`STAGE ${st+1}で力尽きた。何を残すか、選び直せ。`;lose.classList.remove('hidden')}else busy=false},350)}function win(){if(st===9){lt.textContent='残った強さ';lm.textContent='最後まで残した能力：'+[...skillsSet].join('、')+'。削ぎ落とされた自分で魔王を倒した。';lose.classList.remove('hidden');return}const opts=[...skillsSet].sort(()=>Math.random()-.5).slice(0,3);choices.innerHTML='';opts.forEach(s=>{const b=document.createElement('button');b.textContent=s+'を捨てる';b.onclick=()=>{skillsSet.delete(s);if(s==='最大体力'){maxhp=Math.max(45,maxhp-25);hp=Math.min(hp,maxhp)}st++;sac.classList.add('hidden');load()};choices.appendChild(b)});sac.classList.remove('hidden')}go.onclick=()=>{intro.classList.add('hidden');reset()};again.onclick=()=>{lose.classList.add('hidden');reset()};atk.onclick=()=>act('atk');guard.onclick=()=>act('guard');magic.onclick=()=>act('magic');reset()})();</script></body></html>
