<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>LAST 60</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0a14;color:#fff;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:radial-gradient(circle at 50% 0,#3c244f,#140f22 45%,#07060d)}h1{font-size:31px;margin:4px 0}.tag{font-size:11px;font-weight:900;letter-spacing:.16em;color:#ffab74}.sub{margin:0 0 10px;color:#cec4d9;font-size:13px}.panel{padding:14px;border-radius:22px;background:#171224dd;border:1px solid #ffffff20}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border-radius:999px;background:#ffffff0d;font-size:12px;font-weight:900}.sky{position:relative;height:300px;margin-top:10px;border-radius:18px;overflow:hidden;background:linear-gradient(#17112e,#2c1834 58%,#44221f)}.sky:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:29px 31px;opacity:.28}.meteor{position:absolute;right:10%;top:12%;font-size:84px;filter:drop-shadow(-12px 12px 18px #ff6a3f88);animation:fall 6s linear infinite}@keyframes fall{50%{transform:translate(-25px,35px) scale(1.12)}}.city{position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(90deg,#17131e 0 10%,#211722 10% 21%,#15131c 21% 31%,#261923 31% 45%,#17131e 45% 62%,#241722 62% 76%,#16131e 76%);clip-path:polygon(0 45%,8% 45%,8% 19%,18% 19%,18% 37%,27% 37%,27% 5%,39% 5%,39% 31%,51% 31%,51% 12%,65% 12%,65% 40%,77% 40%,77% 22%,90% 22%,90% 49%,100% 49%,100% 100%,0 100%)}.count{position:absolute;left:18px;top:16px;font-size:58px;font-weight:1000;text-shadow:0 6px 22px #000}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.bar{height:11px;border-radius:99px;background:#0008;overflow:hidden}.bar i{display:block;height:100%;transition:width .25s}.sat i{background:linear-gradient(90deg,#ff7c6b,#ffd36a)}.brave i{background:linear-gradient(90deg,#6cc9ff,#9d7dff)}.question{min-height:58px;font-size:20px;font-weight:900;display:flex;align-items:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:68px;border:0;border-radius:16px;padding:10px;color:#fff;font-size:14px;font-weight:900;background:linear-gradient(135deg,#794bff,#be4cff);touch-action:manipulation}.btn.alt{background:linear-gradient(135deg,#ff823d,#ff425b)}.btn:active{transform:scale(.98)}.msg{margin:9px 0 0;padding:10px;border-radius:14px;background:#ffffff0b;font-size:13px}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#20172d}.result.on{display:block}</style></head><body><main class="app"><div class="tag">60 SECONDS TO IMPACT</div><h1>LAST 60</h1><p class="sub">残り60秒。6つの選択で「満足」と「勇気」をどう残す？</p><section class="panel"><div class="hud"><span class="pill">残り <b id="time">60</b>s</span><span class="pill">選択 <b id="step">1</b>/6</span></div><div class="sky"><div class="count" id="bigTime">60</div><div class="meteor">☄️</div><div class="city"></div></div><div class="bars"><div><small>満足 <b id="sat">50</b></small><div class="bar sat"><i id="satBar"></i></div></div><div><small>勇気 <b id="brave">50</b></small><div class="bar brave"><i id="braveBar"></i></div></div></div><div class="question" id="q"></div><div class="choices"><button class="btn" id="a"></button><button class="btn alt" id="b"></button></div><p class="msg" id="msg">直感で選ぼう。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">もう一度60秒</button></section></main><script>(()=>{const qs=[['最初に誰へ伝える？','家族にありがとう','昔のライバルに電話',18,4,-6,14],['最後に食べるなら？','大好物を味わう','激辛に挑戦',15,2,4,12],['残り40秒。外へ出る？','空を見上げる','屋上まで全力疾走',10,7,2,16],['何を残す？','短い手紙を書く','恥ずかしい下書きを消す',14,5,8,3],['残り20秒。','好きな曲を歌う','隕石に向かって叫ぶ',12,9,5,15],['最後の10秒。','笑って目を閉じる','最後まで目をそらさない',16,8,4,20]];let i,sat,brave;const el=id=>document.getElementById(id);function clamp(v){return Math.max(0,Math.min(100,v))}function render(){if(i>=qs.length)return end();let x=qs[i],t=60-i*10;el('time').textContent=t;el('bigTime').textContent=t;el('step').textContent=i+1;el('q').textContent=x[0];el('a').textContent=x[1];el('b').textContent=x[2];el('sat').textContent=sat;el('brave').textContent=brave;el('satBar').style.width=sat+'%';el('braveBar').style.width=brave+'%'}function pick(k){let x=qs[i];if(k===0){sat=clamp(sat+x[3]);brave=clamp(brave+x[4])}else{sat=clamp(sat+x[5]);brave=clamp(brave+x[6])}msg.textContent=k===0?'心が少し落ち着いた。':'鼓動が速くなった。';i++;render()}function end(){el('time').textContent=0;el('bigTime').textContent=0;let total=sat+brave;rt.textContent=total>=165?'悔いのないラスト':total>=125?'悪くないラスト':'まだ言い足りない';rx.textContent=`満足 ${sat} / 勇気 ${brave}。次は違う組み合わせで最後の60秒を作ろう。`;result.classList.add('on')}function reset(){i=0;sat=50;brave=50;result.classList.remove('on');msg.textContent='直感で選ぼう。';render()}a.onclick=()=>pick(0);b.onclick=()=>pick(1);retry.onclick=reset;reset()})()</script></body></html>
