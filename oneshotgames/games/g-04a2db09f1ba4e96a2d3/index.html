<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>LAST 60</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}</style></head><body><main class="app"><div class="tag">60 SECONDS TO IMPACT</div><h1>LAST 60</h1><p class="muted">隕石衝突まで60秒。10秒ごとに最後の行動を選び、満足度100を目指す。</p><div class="panel"><div class="hud"><span class="pill">⏱ <b id="time">60</b>s</span><span class="pill">満足 <b id="sat">50</b></span></div><div class="big" id="icon">☄️</div><h2 id="q"></h2><div class="btns"><button id="a"></button><button class="alt" id="b"></button></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">もう一度60秒</button></div></main><script>(()=>{const qs=[['誰に連絡する？','家族に「ありがとう」','昔のライバルに勝利宣言',18,-8],['最後に食べるなら？','大好物をゆっくり','冷蔵庫を全部ミキサー',14,-5],['外で何をする？','空を見上げる','意味なく全力疾走',12,4],['残り30秒。','大切な人を思い出す','SNSの下書きを全部消す',16,7],['残り20秒。','好きな曲を口ずさむ','部屋の掃除を始める',13,3],['最後の10秒。','「まあ悪くなかった」と笑う','隕石に説教する',20,10]];let i,sat;function show(){if(i>=qs.length)return end();let q=qs[i];document.getElementById('time').textContent=60-i*10;document.getElementById('q').textContent=q[0];document.getElementById('a').textContent=q[1];document.getElementById('b').textContent=q[2]}function pick(k){let q=qs[i];sat=Math.max(0,Math.min(100,sat+q[k?4:3]));document.getElementById('sat').textContent=sat;i++;show()}function end(){document.getElementById('time').textContent=0;document.getElementById('icon').textContent='💥';document.getElementById('result').classList.add('on');document.getElementById('rt').textContent=sat>=80?'満足のラスト':'それも人生';document.getElementById('rx').textContent=`最終満足度 ${sat}/100。選んだ行動が最後の気分を作った。`}function reset(){i=0;sat=50;document.getElementById('sat').textContent=sat;document.getElementById('icon').textContent='☄️';document.getElementById('result').classList.remove('on');show()}document.getElementById('a').onclick=()=>pick(0);document.getElementById('b').onclick=()=>pick(1);document.getElementById('retry').onclick=reset;reset()})()</script></body></html>
