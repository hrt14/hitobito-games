<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>クソUX No.1決定戦</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:#171717;color:#111;display:grid;place-items:center;padding:14px}.game{width:min(100%,460px);background:#f2f2f2;border:5px solid #222;padding:16px;box-shadow:10px 10px 0 #000}h1{margin:0;font-size:28px}.sub{margin:6px 0 14px;color:#444}.hud{display:flex;gap:8px;margin:10px 0}.chip{flex:1;background:#111;color:#fff;padding:9px;text-align:center;font-weight:900}.stage{position:relative;height:360px;overflow:hidden;border:3px solid #111;background:#fff}.panel{position:absolute;inset:0;padding:16px}.badbtn{position:absolute;min-width:92px;min-height:52px;border:4px outset #ddd;background:#d8d8d8;font-size:16px;font-weight:1000}.badbtn:active{border-style:inset}.modal{position:absolute;left:8%;right:8%;top:12%;background:#fff6c9;border:5px solid #111;padding:18px;box-shadow:8px 8px 0 #555}.tiny{width:38px;height:38px;border:1px solid #888;background:#eee;font-size:10px}.slider{width:100%;direction:rtl}.target{font-size:44px;font-weight:1000;text-align:center;margin:40px 0 18px}.msg{text-align:center;font-weight:900;min-height:48px;padding-top:10px}.action{width:100%;padding:14px;border:0;background:#111;color:#fff;font-size:18px;font-weight:1000}.result{display:none;text-align:center}.result.show{display:block}.hidden{display:none}.rank{font-size:68px;font-weight:1000}</style></head><body><main class="game"><section id="intro"><h1>クソUX No.1決定戦</h1><p class="sub">25秒以内に3つの「使いにくい」を突破せよ。ミスするほど減点。</p><button class="action" id="begin">地獄へ入る</button></section><section id="play" class="hidden"><div class="hud"><div class="chip">STAGE <b id="st">1</b>/3</div><div class="chip">MISS <b id="mi">0</b></div><div class="chip">TIME <b id="tm">25.0</b></div></div><div class="stage" id="arena"></div><div class="msg" id="msg"></div></section><section id="result" class="result"><h1 id="rtitle"></h1><div class="rank" id="rank"></div><p id="rtext"></p><button class="action" id="again">もう一度苦しむ</button></section></main><script>let stage=1,miss=0,left=25,running=false,timer,catches=0;const arena=document.getElementById('arena'),msg=document.getElementById('msg');function hud(){st.textContent=stage;mi.textContent=miss;tm.textContent=left.toFixed(1)}function start(){stage=1;miss=0;left=25;running=true;catches=0;intro.classList.add('hidden');result.classList.remove('show');play.classList.remove('hidden');clearInterval(timer);render();hud();timer=setInterval(()=>{left-=.1;if(left<=0){left=0;end(false)}hud()},100)}function render(){arena.innerHTML='';catches=0;if(stage===1){msg.textContent='巨大モーダルの「閉じる」を3回つかまえろ';const m=document.createElement('div');m.className='modal';m.innerHTML='<b>重要なお知らせ</b><p>閉じるボタンは見つけにくい場所へ移動します。</p>';const b=document.createElement('button');b.className='badbtn';b.textContent='閉じる';m.appendChild(b);arena.appendChild(m);move(b);b.onclick=()=>{catches++;if(catches>=3){next();return}move(b)};arena.onclick=e=>{if(e.target!==b){miss++;hud();msg.textContent='そこでは閉じられません'}}}else if(stage===2){msg.textContent='表示は逆。スライダーを「80」に合わせろ';const p=document.createElement('div');p.className='panel';p.innerHTML='<div class="target">80</div><input id="sl" class="slider" type="range" min="0" max="100" value="50"><div class="target" id="val">50</div>';arena.appendChild(p);const sl=document.getElementById('sl'),val=document.getElementById('val');sl.oninput=()=>{val.textContent=sl.value};sl.onchange=()=>{const actual=100-Number(sl.value);if(Math.abs(actual-80)<=4)next();else{miss++;hud();msg.textContent='見た目と値が逆でした。もう一度'}}}else{msg.textContent='ラベルが入れ替わる。「終了する」を3回押せ';const a=document.createElement('button'),b=document.createElement('button');[a,b].forEach((x,i)=>{x.className='badbtn';x.style.left=(i?55:12)+'%';x.style.top='42%';arena.appendChild(x)});let flip=false;function labels(){flip=!flip;a.textContent=flip?'終了する':'まだ続ける';b.textContent=flip?'まだ続ける':'終了する'}labels();const iv=setInterval(()=>{if(stage===3&&running)labels();else clearInterval(iv)},650);[a,b].forEach(x=>x.onclick=()=>{if(x.textContent==='終了する'){catches++;msg.textContent='正解 '+catches+'/3';if(catches>=3){clearInterval(iv);end(true)}}else{miss++;hud();msg.textContent='逆です'}})}}function move(b){b.style.left=(8+Math.random()*66)+'%';b.style.top=(42+Math.random()*36)+'%'}function next(){stage++;hud();if(stage<=3)render();else end(true)}function end(win){if(!running)return;running=false;clearInterval(timer);play.classList.add('hidden');result.classList.add('show');const score=Math.max(0,Math.round(left*40-miss*70));rank.textContent=score>=700?'S':score>=450?'A':score>=250?'B':'C';rtitle.textContent=win?'UX地獄を制覇':'UXに負けた';rtext.textContent='残り '+left.toFixed(1)+'秒 / ミス '+miss+'回。'+(miss===0?'あなたは理不尽に強い。':'次はミスを減らしてNo.1を狙え。')}begin.onclick=start;again.onclick=start</script></body></html>
