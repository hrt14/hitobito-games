<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ABYSS SQUID QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020914;color:#eefcff;font-family:system-ui,-apple-system,sans-serif}.app{height:100%;display:grid;grid-template-rows:auto 1fr;background:radial-gradient(circle at 50% 12%,#0d7393 0,#073a59 28%,#031a2c 60%,#020914 100%)}header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(180deg,#031522ee,#02101add);border-bottom:1px solid #6de9ff44;box-shadow:0 8px 24px #0008;z-index:20}.brand{font-weight:1000;letter-spacing:.06em;text-shadow:0 0 18px #69e9ff88}.sub{font-size:11px;color:#a9f3ff}.hud{display:flex;gap:6px;font-size:11px;font-weight:950}.hud span{padding:6px 9px;border-radius:999px;background:linear-gradient(180deg,#0c4260,#062a40);border:1px solid #6de9ff55;box-shadow:inset 0 0 12px #28c8ff22}.stage{position:relative;min-height:0}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 40%,#0007 100%)}.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff05 0,#ffffff05 1px,transparent 1px,transparent 4px);opacity:.2}.msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:88%;padding:9px 13px;border-radius:14px;background:#00111ee8;border:1px solid #79f0ff66;box-shadow:0 8px 28px #0009,0 0 22px #5cecff22;font-size:13px;font-weight:900;text-align:center;opacity:0;transition:.18s;pointer-events:none;z-index:7}.msg.on{opacity:1}.quest{position:absolute;right:max(12px,env(safe-area-inset-right));top:12px;z-index:6;min-width:132px;padding:10px 12px;border-radius:15px;background:linear-gradient(180deg,#082f45ea,#001725e8);border:1px solid #71e8ff55;text-align:center;font-size:11px;line-height:1.45;color:#c7f7ff;font-weight:900;box-shadow:0 10px 28px #0007;pointer-events:none}.dpad{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(78px,calc(env(safe-area-inset-bottom) + 70px));width:174px;height:174px;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:3px;z-index:8;filter:drop-shadow(0 12px 22px #000a)}.dpad button{border:1px solid #8defff66;border-radius:18px;background:linear-gradient(180deg,#0a4a68ee,#062f48ee);color:#fff;font-size:24px;font-weight:950;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 18px #31d8ff12}.dpad button:active,.dpad button.active{background:linear-gradient(180deg,#178ab4,#0a5575);transform:scale(.96);box-shadow:0 0 20px #5defff55}.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.dpad .right{grid-column:3;grid-row:2}.dpad .center{grid-column:2;grid-row:2;display:grid;place-items:center;border-radius:50%;background:#021b2acc;border:1px solid #77dceb55;color:#8defff;font-size:11px;font-weight:900;box-shadow:inset 0 0 24px #33d6ff22}.controlHint{position:absolute;left:14px;bottom:max(48px,calc(env(safe-area-inset-bottom) + 42px));z-index:6;font-size:10px;font-weight:800;color:#b6f3fb;background:#001522cc;padding:6px 9px;border-radius:999px;border:1px solid #6de9ff33;pointer-events:none}.battle{position:absolute;inset:0;display:none;place-items:center;padding:20px;background:radial-gradient(circle,#073654ee,#000b14f2);backdrop-filter:blur(8px);z-index:12}.battle.on{display:grid}.card{width:min(430px,100%);border-radius:26px;padding:21px;background:linear-gradient(180deg,#0c4866,#06263b 55%,#041c2c);border:1px solid #8ef2ff66;box-shadow:0 26px 80px #000a,0 0 34px #34d8ff22;text-align:center}.enemyWrap{position:relative;height:100px;display:grid;place-items:center}.enemyGlow{position:absolute;width:90px;height:90px;border-radius:50%;background:#9b5cff44;filter:blur(18px);animation:pulse 1.4s infinite alternate}.enemy{position:relative;font-size:68px;filter:drop-shadow(0 12px 14px #0008)}@keyframes pulse{to{transform:scale(1.25);opacity:.65}}.card h2{margin:6px 0}.bar{height:13px;border-radius:999px;background:#00131f;overflow:hidden;margin:8px 0 14px;border:1px solid #ffffff11}.fill{height:100%;background:linear-gradient(90deg,#3bffd6,#54c7ff,#9466ff);box-shadow:0 0 14px #4ce5ff88}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button,.overlay button{border:0;border-radius:17px;min-height:56px;color:white;font-weight:950;font-size:16px;background:linear-gradient(135deg,#0f93b5,#425be7);box-shadow:0 8px 18px #0005}.actions .ink{background:linear-gradient(135deg,#754cff,#df4fd7)}.actions button:active,.overlay button:active{transform:translateY(2px)}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#0c4268ef,#00101bf2);z-index:14;padding:24px}.overlay.hidden{display:none}.overlay .card p{line-height:1.58;color:#d0f5fb}.overlay button{padding:0 26px;background:linear-gradient(135deg,#1fd3c5,#3e6bec,#a758ff)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#64e8ff18;border:1px solid #64e8ff44;font-size:10px;font-weight:950;letter-spacing:.08em}@media(max-width:390px){.dpad{width:156px;height:156px;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px}.dpad button{font-size:22px}.quest{min-width:112px;font-size:10px}.brand{font-size:14px}.sub{font-size:10px}}</style></head><body><main class="app"><header><div><div class="brand">ABYSS SQUID QUEST</div><div class="sub">深海を巡り、3つの潮の紋章を集めよう</div></div><div class="hud"><span id="hp">HP 12/12</span><span id="seal">SEAL 0/3</span></div></header><section class="stage" id="stage"><canvas id="c"></canvas><div class="vignette"></div><div class="scan"></div><div class="msg" id="msg"></div><div class="quest" id="quest">紋章を探そう<br>0 / 3</div><div class="dpad" aria-label="移動操作"><button class="up" data-d="u" aria-label="上へ移動">▲</button><button class="left" data-d="l" aria-label="左へ移動">◀</button><div class="center">MOVE</div><button class="right" data-d="r" aria-label="右へ移動">▶</button><button class="down" data-d="d" aria-label="下へ移動">▼</button></div><div class="controlHint">押し続けて移動</div><section class="battle" id="battle"><div class="card"><span class="badge">DEEP SEA BATTLE</span><div class="enemyWrap"><div class="enemyGlow"></div><div class="enemy" id="enemyIcon">🦀</div></div><h2 id="enemyName">深海モンスター</h2><div class="bar"><div class="fill" id="enemyHp"></div></div><p id="battleText">どうする？</p><div class="actions"><button id="attack">触腕アタック</button><button class="ink" id="ink">墨スプラッシュ</button></div></div></section><section class="overlay" id="intro"><div class="card"><span class="badge">ABYSS EXPEDITION</span><div style="font-size:78px;filter:drop-shadow(0 18px 16px #0008)">🦑</div><h1>深海を救え。</h1><p>左下の十字キーを押し続けて海底を進む。光る紋章に触れるとバトル開始。3つ集めたら中央の魔王城へ。</p><button id="start">冒険スタート</button></div></section><section class="overlay hidden" id="finish"><div class="card"><div style="font-size:76px" id="endIcon">🌊</div><h1 id="endTitle">海に光が戻った！</h1><p id="endText"></p><button id="retry">もう一度冒険</button></div></section></section></main><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),$=id=>document.getElementById(id);let W,H,dpr,playing=false,inBattle=false,steps=0,time=0;const world={w:960,h:720};let p,seals,boss,rocks,bubbles=[],fish=[],jellies=[],enemy=null;const dir={u:false,d:false,l:false,r:false};function resize(){dpr=Math.min(2,devicePixelRatio||1);W=stage.clientWidth;H=stage.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function reset(){p={x:100,y:590,r:18,hp:12,max:12};seals=[{x:160,y:140,t:false,n:'珊瑚の紋章',e:['🦀','アビスクラブ',7]},{x:790,y:170,t:false,n:'渦の紋章',e:['🐡','トゲフグナイト',8]},{x:790,y:565,t:false,n:'月光の紋章',e:['🐙','シャドウオクト',9]}];boss={x:480,y:350,r:58};rocks=[{x:280,y:220,r:50},{x:620,y:500,r:58},{x:500,y:150,r:38},{x:285,y:500,r:32}];bubbles=Array.from({length:28},()=>({x:Math.random()*960,y:Math.random()*720,r:2+Math.random()*5,s:.2+Math.random()*.7}));fish=Array.from({length:12},(_,i)=>({x:Math.random()*960,y:60+Math.random()*580,s:.4+Math.random()*.8,d:i%2?1:-1,h:180+Math.random()*80}));jellies=Array.from({length:7},()=>({x:Math.random()*960,y:80+Math.random()*540,o:Math.random()*6}));enemy=null;steps=0;for(const k in dir)dir[k]=false;updateHud()}function updateHud(){$('hp').textContent=`HP ${p.hp}/${p.max}`;const n=seals.filter(s=>s.t).length;$('seal').textContent=`SEAL ${n}/3`;$('quest').innerHTML=n<3?`紋章を探そう<br>${n} / 3`:`中央の魔王城へ<br>READY!`}function toast(t){$('msg').textContent=t;$('msg').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('msg').classList.remove('on'),1200)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function startBattle(type,obj){inBattle=true;for(const k in dir)dir[k]=false;document.querySelectorAll('[data-d]').forEach(b=>b.classList.remove('active'));enemy={type,obj,name:type==='boss'?'魔王 ダンクルオステウス':obj.e[1],icon:type==='boss'?'🐋':obj.e[0],hp:type==='boss'?18:obj.e[2],max:type==='boss'?18:obj.e[2],inked:false};$('enemyIcon').textContent=enemy.icon;$('enemyName').textContent=enemy.name;$('battleText').textContent=type==='boss'?'最後の戦いだ！':'海流がざわめいた！';updateEnemy();$('battle').classList.add('on');navigator.vibrate?.([25,30,25])}function updateEnemy(){$('enemyHp').style.width=`${Math.max(0,enemy.hp/enemy.max*100)}%`}function hitEnemy(power,label){if(!enemy)return;const dmg=power+Math.floor(Math.random()*3);enemy.hp-=dmg;$('battleText').textContent=`${label}！ ${dmg}ダメージ`;updateEnemy();navigator.vibrate?.(22);if(enemy.hp<=0){setTimeout(winBattle,350);return}setTimeout(enemyTurn,420)}function enemyTurn(){if(!enemy||enemy.hp<=0)return;const dmg=enemy.inked?Math.floor(Math.random()*2):1+Math.floor(Math.random()*3);enemy.inked=false;p.hp=Math.max(0,p.hp-dmg);updateHud();$('battleText').textContent=`${enemy.name}の反撃！ ${dmg}ダメージ`;navigator.vibrate?.([15,30,15]);if(p.hp<=0)setTimeout(gameOver,500)}function winBattle(){if(enemy.type==='boss'){inBattle=false;$('battle').classList.remove('on');playing=false;$('endIcon').textContent='✨';$('endTitle').textContent='深海に光が戻った！';$('endText').textContent=`${steps}歩の冒険で魔王を撃破。潮の流れが穏やかになり、海底の仲間たちが帰ってきた。`;$('finish').classList.remove('hidden');return}enemy.obj.t=true;p.hp=Math.min(p.max,p.hp+3);toast(`${enemy.obj.n} GET! HP+3`);inBattle=false;$('battle').classList.remove('on');enemy=null;updateHud()}function gameOver(){inBattle=false;$('battle').classList.remove('on');playing=false;$('endIcon').textContent='🫧';$('endTitle').textContent='力尽きた…';$('endText').textContent='紋章を倒すたびHPが少し回復する。墨で敵の反撃を弱めながら再挑戦しよう。';$('finish').classList.remove('hidden')}function move(){if(!playing||inBattle)return;let vx=(dir.r?1:0)-(dir.l?1:0),vy=(dir.d?1:0)-(dir.u?1:0);if(!vx&&!vy)return;const m=Math.hypot(vx,vy);vx/=m;vy/=m;const nx=Math.max(24,Math.min(world.w-24,p.x+vx*5.6)),ny=Math.max(24,Math.min(world.h-24,p.y+vy*5.6));let blocked=false;for(const r of rocks)if(Math.hypot(nx-r.x,ny-r.y)<r.r+p.r+6)blocked=true;if(!blocked){p.x=nx;p.y=ny;steps++}for(const s of seals)if(!s.t&&dist(p,s)<38){startBattle('seal',s);break}if(seals.every(s=>s.t)&&dist(p,boss)<78)startBattle('boss',boss)}function glow(x,y,r,color,a=.35){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.globalAlpha=a;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1}function drawWorld(){const sx=W/world.w,sy=H/world.h,s=Math.min(sx,sy),ox=(W-world.w*s)/2,oy=(H-world.h*s)/2;ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);const bg=ctx.createLinearGradient(0,0,0,720);bg.addColorStop(0,'#0b6683');bg.addColorStop(.42,'#073d5d');bg.addColorStop(.78,'#04243a');bg.addColorStop(1,'#02121f');ctx.fillStyle=bg;ctx.fillRect(0,0,960,720);glow(180,90,180,'#36eaff',.18);glow(760,160,160,'#7f5cff',.13);for(const j of jellies){const bob=Math.sin(time*.002+j.o)*9;glow(j.x,j.y+bob,34,'#7bdeff',.12);ctx.font='28px system-ui';ctx.fillText('🪼',j.x-14,j.y+bob+8)}for(const f of fish){f.x+=f.d*f.s;if(f.x<-30)f.x=990;if(f.x>990)f.x=-30;ctx.save();ctx.translate(f.x,f.y+Math.sin(time*.002+f.h)*8);ctx.scale(f.d,1);ctx.globalAlpha=.6;ctx.fillStyle=`hsl(${f.h} 70% 65%)`;ctx.beginPath();ctx.ellipse(0,0,13,6,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-22,-8);ctx.lineTo(-22,8);ctx.closePath();ctx.fill();ctx.restore()}for(const b of bubbles){b.y-=b.s;if(b.y<0){b.y=720;b.x=Math.random()*960}ctx.strokeStyle='#c9fbff55';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.stroke()}for(const r of rocks){const rg=ctx.createRadialGradient(r.x-r.r*.3,r.y-r.r*.3,5,r.x,r.y,r.r);rg.addColorStop(0,'#4f8c94');rg.addColorStop(.55,'#285d68');rg.addColorStop(1,'#163a46');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.fill();ctx.strokeStyle='#77d3d344';ctx.lineWidth=2;ctx.stroke()}for(let x=24;x<955;x+=58){const h=24+((x*17)%42);ctx.strokeStyle=x%116?'#2abf9b':'#e95ca9';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,720);ctx.quadraticCurveTo(x-12,700-h*.4,x+Math.sin(time*.002+x)*10,720-h);ctx.stroke();ctx.fillStyle='#5fffd944';ctx.beginPath();ctx.arc(x,720-h,5,0,7);ctx.fill()}for(const s1 of seals)if(!s1.t){glow(s1.x,s1.y,62,'#65f5ff',.35);ctx.shadowBlur=22;ctx.shadowColor='#74faff';ctx.fillStyle='#72efff';ctx.beginPath();ctx.arc(s1.x,s1.y,16+Math.sin(time*.005)*2,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font='24px system-ui';ctx.fillText(s1.e[0],s1.x-13,s1.y-26)}const ready=seals.every(s=>s.t);glow(boss.x,boss.y,ready?100:70,ready?'#b15cff':'#345a70',ready?.24:.1);ctx.fillStyle=ready?'#7f4cff':'#142b3d';ctx.beginPath();ctx.arc(boss.x,boss.y,boss.r,0,7);ctx.fill();ctx.strokeStyle=ready?'#ff64e9':'#456070';ctx.lineWidth=8;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(ready?'魔王城':'封印中',boss.x,boss.y+5);ctx.textAlign='start';glow(p.x,p.y,52,'#59e9ff',.22);ctx.font='38px system-ui';ctx.fillText('🦑',p.x-22,p.y+15);ctx.restore()}function loop(t){time=t;move();ctx.clearRect(0,0,W,H);drawWorld();requestAnimationFrame(loop)}$('attack').onclick=()=>hitEnemy(3,'触腕アタック');$('ink').onclick=()=>{if(!enemy)return;enemy.inked=true;hitEnemy(1,'墨スプラッシュ')};function bindDpad(){document.querySelectorAll('[data-d]').forEach(btn=>{const k=btn.dataset.d;const on=e=>{e.preventDefault();dir[k]=true;btn.classList.add('active');try{btn.setPointerCapture?.(e.pointerId)}catch{}};const off=e=>{e?.preventDefault?.();dir[k]=false;btn.classList.remove('active')};btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);btn.addEventListener('pointercancel',off);btn.addEventListener('lostpointercapture',off);btn.addEventListener('contextmenu',e=>e.preventDefault())});addEventListener('pointerup',()=>{for(const k in dir)dir[k]=false;document.querySelectorAll('[data-d]').forEach(b=>b.classList.remove('active'))})}bindDpad();$('start').onclick=()=>{$('intro').classList.add('hidden');playing=true;toast('十字キーを押し続けて移動！')};$('retry').onclick=()=>{reset();$('finish').classList.add('hidden');playing=true;toast('再出発！')};reset();requestAnimationFrame(loop)})();</script></body></html>
