<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ABYSS SQUID QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.stage{height:64vh;min-height:430px}.joy{position:absolute;left:18px;bottom:22px;width:150px;height:150px;border-radius:50%;background:#071b2bdd;border:2px solid #8defff55;touch-action:none;user-select:none;-webkit-user-select:none}.stick{position:absolute;left:45px;top:45px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a7f7ff,#247ba5);box-shadow:0 8px 22px #0008}.action{position:absolute;right:18px;bottom:34px;width:92px;height:92px;border-radius:50%;font-size:14px}.quest{position:absolute;right:12px;top:12px;padding:8px 10px;border-radius:12px;background:#001522dd;font-size:12px;font-weight:900}canvas{touch-action:none}</style></head><body><main class="app"><div class="tag">IMPROVED TOUCH CONTROL</div><h1>ABYSS SQUID QUEST</h1><p class="muted">左の円をどの方向にもドラッグして移動。長押し不要。紋章3つを集めて中央の魔王を倒せ。</p><div class="panel"><div class="hud"><span class="pill">HP <b id="hp">12</b></span><span class="pill">SEAL <b id="seal">0</b>/3</span></div><div class="stage" id="stage"><canvas id="c"></canvas><div class="quest" id="quest">光る紋章を探す</div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><button class="action alt" id="attack">INK<br>ATTACK</button><div class="overlay" id="intro"><div><div class="big">🦑</div><h2>指を置いてスライド</h2><p>十字キーではなくアナログ移動。ブラウザの長押し拡大を起こさない操作に変更。</p><button id="start">潜る</button></div></div></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">再挑戦</button></div></main><script>(()=>{document.addEventListener('contextmenu',e=>e.preventDefault());const c=document.getElementById('c'),x=c.getContext('2d'),stage=document.getElementById('stage'),joy=document.getElementById('joy'),stick=document.getElementById('stick');let W,H,p,seals,boss,run,vx=0,vy=0,last=0;function size(){W=stage.clientWidth;H=stage.clientHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();function reset(){p={x:55,y:H-70,hp:12};seals=[{x:70,y:80,on:true},{x:W-70,y:110,on:true},{x:W-85,y:H-140,on:true}];boss={x:W/2,y:H/2,hp:18,open:false};run=true;document.getElementById('hp').textContent=12;document.getElementById('seal').textContent=0;result.classList.remove('on');last=0;requestAnimationFrame(loop)}function setJoy(e){let r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,k=Math.min(52,m);vx=dx/m;vy=dy/m;stick.style.transform=`translate(${vx*k}px,${vy*k}px)`}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);setJoy(e);e.preventDefault()};joy.onpointermove=e=>{if(e.buttons)setJoy(e)};joy.onpointerup=joy.onpointercancel=e=>{vx=vy=0;stick.style.transform='';e.preventDefault()};function loop(t){if(!run)return;let dt=Math.min(30,t-last||16);last=t;p.x=Math.max(25,Math.min(W-25,p.x+vx*dt*.22));p.y=Math.max(25,Math.min(H-25,p.y+vy*dt*.22));for(const s of seals)if(s.on&&Math.hypot(p.x-s.x,p.y-s.y)<34){s.on=false;p.hp=Math.min(12,p.hp+1);document.getElementById('seal').textContent=3-seals.filter(s=>s.on).length}boss.open=!seals.some(s=>s.on);quest.textContent=boss.open?'中央の魔王へ！':'光る紋章を探す';if(boss.open&&Math.hypot(p.x-boss.x,p.y-boss.y)<48)p.hp-=dt*.004;if(p.hp<=0)return end(false);draw();requestAnimationFrame(loop)}function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a6582');g.addColorStop(1,'#031728');x.fillStyle=g;x.fillRect(0,0,W,H);x.font='28px sans-serif';for(let i=0;i<18;i++)x.fillText(i%2?'🫧':'🪸',(i*67)%W,(i*83)%H);seals.forEach(s=>{if(s.on){x.font='38px sans-serif';x.fillText('🔱',s.x-19,s.y+14)}});x.font='60px sans-serif';x.fillText(boss.open?'🐋':'🏰',boss.x-30,boss.y+22);x.font='44px sans-serif';x.fillText('🦑',p.x-22,p.y+16)}attack.onclick=()=>{if(!run)return;if(boss.open&&Math.hypot(p.x-boss.x,p.y-boss.y)<130){boss.hp-=3;quest.textContent='魔王 HP '+boss.hp;if(boss.hp<=0)return end(true)}};function end(win){run=false;rt.textContent=win?'深海救済！':'力尽きた';rx.textContent=win?'アナログ移動で3紋章と魔王を攻略。':'魔王の近くに居続けず、攻撃後は距離を取ろう。';result.classList.add('on')}start.onclick=()=>{intro.classList.add('hide');reset()};retry.onclick=reset;draw()})()</script></body></html>
