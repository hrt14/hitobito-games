<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ABYSS SQUID QUEST</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#031525;color:#eefcff;font-family:system-ui,-apple-system,sans-serif}.app{height:100%;display:grid;grid-template-rows:auto 1fr;background:radial-gradient(circle at 50% 20%,#0b6380 0,#07314d 34%,#031525 76%)}header{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#02111dcc;border-bottom:1px solid #79eaff33}.brand{font-weight:950;letter-spacing:.04em}.sub{font-size:11px;color:#9fe9f4}.hud{display:flex;gap:6px;font-size:11px;font-weight:900}.hud span{padding:6px 8px;border-radius:999px;background:#0b3550;border:1px solid #64e5ff33}.stage{position:relative;min-height:0}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:88%;padding:8px 12px;border-radius:13px;background:#001018e8;border:1px solid #78efff55;font-size:13px;font-weight:850;text-align:center;opacity:0;transition:.18s;pointer-events:none;z-index:4}.msg.on{opacity:1}.battle{position:absolute;inset:0;display:none;place-items:center;padding:20px;background:#00101be8;backdrop-filter:blur(6px);z-index:8}.battle.on{display:grid}.card{width:min(420px,100%);border-radius:24px;padding:20px;background:linear-gradient(180deg,#0b3954,#062236);border:1px solid #7beeff55;box-shadow:0 24px 70px #0009;text-align:center}.enemy{font-size:64px}.card h2{margin:6px 0}.bar{height:12px;border-radius:999px;background:#00131f;overflow:hidden;margin:8px 0 14px}.fill{height:100%;background:linear-gradient(90deg,#39ffd3,#64a8ff)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions button,.overlay button{border:0;border-radius:16px;min-height:54px;color:white;font-weight:950;font-size:16px;background:linear-gradient(135deg,#127a9a,#3d66e7)}.actions .ink{background:linear-gradient(135deg,#7d4dff,#e44bd3)}.dpad{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(76px,calc(env(safe-area-inset-bottom) + 68px));width:174px;height:174px;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:3px;z-index:6;filter:drop-shadow(0 10px 18px #0008)}.dpad button{border:1px solid #8defff55;border-radius:17px;background:#063754e8;color:#fff;font-size:24px;font-weight:950;touch-action:none;user-select:none;-webkit-user-select:none}.dpad button:active,.dpad button.active{background:#13779d;transform:scale(.96)}.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.dpad .right{grid-column:3;grid-row:2}.dpad .center{grid-column:2;grid-row:2;display:grid;place-items:center;border-radius:50%;background:#031c2cbb;border:1px solid #77dceb44;color:#8defff;font-size:11px;font-weight:900}.quest{position:absolute;right:max(12px,env(safe-area-inset-right));top:12px;z-index:5;min-width:122px;padding:9px 11px;border-radius:14px;background:#001826d9;border:1px solid #71e8ff3d;text-align:center;font-size:11px;line-height:1.4;color:#bdeefa;font-weight:850;pointer-events:none}.controlHint{position:absolute;left:14px;bottom:max(48px,calc(env(safe-area-inset-bottom) + 42px));z-index:5;font-size:10px;font-weight:800;color:#9bdce9;background:#001522bb;padding:5px 8px;border-radius:999px;pointer-events:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#00101be8;z-index:10;padding:24px}.overlay.hidden{display:none}.overlay .card p{line-height:1.55;color:#c5edf5}.overlay button{padding:0 24px;background:linear-gradient(135deg,#21c9be,#3d65e7,#9a52ff)}@media(max-width:390px){.dpad{width:156px;height:156px;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px}.dpad button{font-size:22px}.quest{min-width:108px;font-size:10px}.brand{font-size:14px}.sub{font-size:10px}}</style></head><body><main class="app"><header><div><div class="brand">ABYSS SQUID QUEST</div><div class="sub">深海を巡り、3つの潮の紋章を集めよう</div></div><div class="hud"><span id="hp">HP 12/12</span><span id="seal">SEAL 0/3</span></div></header><section class="stage" id="stage"><canvas id="c"></canvas><div class="msg" id="msg"></div><div class="quest" id="quest">紋章を探そう<br>0 / 3</div><div class="dpad" aria-label="移動操作"><button class="up" data-d="u" aria-label="上へ移動">▲</button><button class="left" data-d="l" aria-label="左へ移動">◀</button><div class="center">MOVE</div><button class="right" data-d="r" aria-label="右へ移動">▶</button><button class="down" data-d="d" aria-label="下へ移動">▼</button></div><div class="controlHint">押し続けて移動</div><section class="battle" id="battle"><div class="card"><div class="enemy" id="enemyIcon">🦀</div><h2 id="enemyName">深海モンスター</h2><div class="bar"><div class="fill" id="enemyHp"></div></div><p id="battleText">どうする？</p><div class="actions"><button id="attack">触腕アタック</button><button class="ink" id="ink">墨スプラッシュ</button></div></div></section><section class="overlay" id="intro"><div class="card"><div style="font-size:72px">🦑</div><h1>深海を救え。</h1><p>左下の大きな十字キーを押し続けて海底を進む。光る紋章に触れるとバトル開始。3つ集めたら中央の魔王城へ。</p><button id="start">冒険スタート</button></div></section><section class="overlay hidden" id="finish"><div class="card"><div style="font-size:72px" id="endIcon">🌊</div><h1 id="endTitle">海に光が戻った！</h1><p id="endText"></p><button id="retry">もう一度冒険</button></div></section></section></main><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d'),stage=document.getElementById('stage'),$=id=>document.getElementById(id);let W,H,dpr,raf,playing=false,inBattle=false,steps=0;const world={w:960,h:720};let p,seals,boss,rocks,bubbles=[],enemy=null;const dir={u:false,d:false,l:false,r:false};function resize(){dpr=Math.min(2,devicePixelRatio||1);W=stage.clientWidth;H=stage.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function reset(){p={x:100,y:590,r:18,hp:12,max:12,inv:0};seals=[{x:160,y:140,t:false,n:'珊瑚の紋章',e:['🦀','アビスクラブ',7]},{x:790,y:170,t:false,n:'渦の紋章',e:['🐡','トゲフグナイト',8]},{x:790,y:565,t:false,n:'月光の紋章',e:['🐙','シャドウオクト',9]}];boss={x:480,y:350,r:54};rocks=[{x:280,y:220,r:50},{x:620,y:500,r:58},{x:500,y:150,r:38},{x:285,y:500,r:32}];bubbles=[];enemy=null;steps=0;for(const k in dir)dir[k]=false;updateHud()}function updateHud(){$('hp').textContent=`HP ${p.hp}/${p.max}`;const n=seals.filter(s=>s.t).length;$('seal').textContent=`SEAL ${n}/3`;$('quest').innerHTML=n<3?`紋章を探そう<br>${n} / 3`:`中央の魔王城へ<br>READY!`}function toast(t){$('msg').textContent=t;$('msg').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('msg').classList.remove('on'),1100)}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function startBattle(type,obj){inBattle=true;for(const k in dir)dir[k]=false;document.querySelectorAll('[data-d]').forEach(b=>b.classList.remove('active'));enemy={type,obj,name:type==='boss'?'魔王 ダンクルオステウス':obj.e[1],icon:type==='boss'?'🐋':obj.e[0],hp:type==='boss'?18:obj.e[2],max:type==='boss'?18:obj.e[2],inked:false};$('enemyIcon').textContent=enemy.icon;$('enemyName').textContent=enemy.name;$('battleText').textContent=type==='boss'?'最後の戦いだ！':'海流がざわめいた！';updateEnemy();$('battle').classList.add('on');navigator.vibrate?.([25,30,25])}function updateEnemy(){$('enemyHp').style.width=`${Math.max(0,enemy.hp/enemy.max*100)}%`}function hitEnemy(power,label){if(!enemy)return;const dmg=power+Math.floor(Math.random()*3);enemy.hp-=dmg;$('battleText').textContent=`${label}！ ${dmg}ダメージ`;updateEnemy();navigator.vibrate?.(22);if(enemy.hp<=0){setTimeout(winBattle,350);return}setTimeout(enemyTurn,420)}function enemyTurn(){if(!enemy||enemy.hp<=0)return;let dmg=enemy.inked?Math.floor(Math.random()*2):1+Math.floor(Math.random()*3);enemy.inked=false;p.hp=Math.max(0,p.hp-dmg);updateHud();$('battleText').textContent=`${enemy.name}の反撃！ ${dmg}ダメージ`;navigator.vibrate?.([15,30,15]);if(p.hp<=0)setTimeout(gameOver,500)}function winBattle(){if(enemy.type==='boss'){inBattle=false;$('battle').classList.remove('on');playing=false;$('endIcon').textContent='✨';$('endTitle').textContent='深海に光が戻った！';$('endText').textContent=`${steps}歩の冒険で魔王を撃破。潮の流れが穏やかになり、海底の仲間たちが帰ってきた。`;$('finish').classList.remove('hidden');return}enemy.obj.t=true;p.hp=Math.min(p.max,p.hp+3);toast(`${enemy.obj.n} GET! HP+3`);inBattle=false;$('battle').classList.remove('on');enemy=null;updateHud()}function gameOver(){inBattle=false;$('battle').classList.remove('on');playing=false;$('endIcon').textContent='🫧';$('endTitle').textContent='力尽きた…';$('endText').textContent='紋章を倒すたびHPが少し回復する。墨で敵の反撃を弱めながら再挑戦しよう。';$('finish').classList.remove('hidden')}function move(){if(!playing||inBattle)return;let vx=(dir.r?1:0)-(dir.l?1:0),vy=(dir.d?1:0)-(dir.u?1:0);if(!vx&&!vy)return;const m=Math.hypot(vx,vy);vx/=m;vy/=m;const nx=Math.max(24,Math.min(world.w-24,p.x+vx*5.6)),ny=Math.max(24,Math.min(world.h-24,p.y+vy*5.6));let blocked=false;for(const r of rocks)if(Math.hypot(nx-r.x,ny-r.y)<r.r+p.r+6)blocked=true;if(!blocked){p.x=nx;p.y=ny;steps++}for(const s of seals)if(!s.t&&dist(p,s)<38){startBattle('seal',s);break}if(seals.every(s=>s.t)&&dist(p,boss)<75)startBattle('boss',boss)}function draw(){ctx.clearRect(0,0,W,H);const sx=W/world.w,sy=H/world.h,s=Math.min(sx,sy),ox=(W-world.w*s)/2,oy=(H-world.h*s)/2;ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);const g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#0a5572');g.addColorStop(.55,'#07334e');g.addColorStop(1,'#031825');ctx.fillStyle=g;ctx.fillRect(0,0,960,720);for(let i=0;i<24;i++){const x=(i*173+70)%960,y=(i*97+40)%720;ctx.fillStyle=i%2?'#10678355':'#32d6d533';ctx.beginPath();ctx.arc(x,y,6+(i%4)*3,0,7);ctx.fill()}for(const r of rocks){ctx.fillStyle='#1d5060';ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.fill();ctx.fillStyle='#2f7380';ctx.beginPath();ctx.arc(r.x-r.r*.25,r.y-r.r*.25,r.r*.45,0,7);ctx.fill()}ctx.fillStyle='#ef4fa2';for(let x=30;x<950;x+=90){ctx.fillRect(x,690,7,-18-Math.sin(x)*8);ctx.fillRect(x-8,682,23,5)}for(const s1 of seals)if(!s1.t){ctx.shadowBlur=22;ctx.shadowColor='#74faff';ctx.fillStyle='#72efff';ctx.beginPath();ctx.arc(s1.x,s1.y,15,0,7);ctx.fill();ctx.shadowBlur=0;ctx.font='22px system-ui';ctx.fillText(s1.e[0],s1.x-12,s1.y-24)}const ready=seals.every(s=>s.t);ctx.fillStyle=ready?'#8b50ff':'#14293b';ctx.beginPath();ctx.arc(boss.x,boss.y,boss.r,0,7);ctx.fill();ctx.strokeStyle=ready?'#ff5fe7':'#456070';ctx.lineWidth=7;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(ready?'魔王城':'封印中',boss.x,boss.y+5);ctx.textAlign='start';ctx.font='34px system-ui';ctx.fillText('🦑',p.x-20,p.y+14);for(let i=0;i<8;i++){const b=bubbles[i]||(bubbles[i]={x:Math.random()*960,y:Math.random()*720,r:2+Math.random()*5});b.y-=.45+i*.02;if(b.y<0){b.y=720;b.x=Math.random()*960}ctx.strokeStyle='#b8f9ff66';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.stroke()}ctx.restore()}function loop(){move();draw();raf=requestAnimationFrame(loop)}function setDir(button,on){const k=button.dataset.d;dir[k]=on;button.classList.toggle('active',on)}document.querySelectorAll('[data-d]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);setDir(b,true)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>setDir(b,false)))});addEventListener('keydown',e=>{const map={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};if(map[e.key]){e.preventDefault();dir[map[e.key]]=true}});addEventListener('keyup',e=>{const map={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'};if(map[e.key])dir[map[e.key]]=false});$('attack').onclick=()=>hitEnemy(3,'触腕アタック');$('ink').onclick=()=>{enemy.inked=true;hitEnemy(1,'墨スプラッシュ')};function begin(){cancelAnimationFrame(raf);reset();playing=true;inBattle=false;$('intro').classList.add('hidden');$('finish').classList.add('hidden');$('battle').classList.remove('on');toast('光る紋章を3つ探そう');loop()}$('start').onclick=begin;$('retry').onclick=begin;reset();draw();})();</script></body></html>
