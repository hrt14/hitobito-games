<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DAY 30: ZOMBIE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}</style></head><body><main class="app"><div class="tag">30 DAY SURVIVAL</div><h1>DAY 30: ZOMBIE</h1><p class="muted">食料・体力・警戒を管理して30日生き延びろ。毎日1つ行動を選ぶ。</p><div class="panel"><div class="hud"><span class="pill">DAY <b id="day">1</b>/30</span><span class="pill">🍞 <b id="food">8</b></span><span class="pill">❤️ <b id="hp">10</b></span></div><div class="big" id="icon">🧟</div><h2 id="event"></h2><div class="btns"><button id="a"></button><button class="alt" id="b"></button></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">DAY 1から</button></div></main><script>(()=>{const events=[['コンビニ跡を見つけた','食料を探す','静かに通過'],['遠くで物音','様子を見る','バリケード補強'],['雨が降り出した','水を集める','屋内で休む'],['放置車両','トランクを開ける','触らない'],['誰かの無線','返事をする','電源を切る'],['薬局跡','薬を探す','急いで離れる']];let day,food,hp;function show(){if(day>30)return end(true);let e=events[(day*7)%events.length];event.textContent=e[0];a.textContent=e[1];b.textContent=e[2];document.getElementById('day').textContent=day}function pick(k){let risk=Math.random();if(k===0){food+=1+Math.floor(Math.random()*4);if(risk<.35)hp-=2}else{hp=Math.min(10,hp+1);food--}food--;if(day%6===0&&Math.random()<.5)hp--;document.getElementById('food').textContent=food;document.getElementById('hp').textContent=hp;day++;if(food<0||hp<=0)return end(false);show()}function end(win){document.getElementById('icon').textContent=win?'🚐':'🧟';document.getElementById('rt').textContent=win?'救援隊が来た！':'生存失敗';document.getElementById('rx').textContent=win?'30日を耐えた。だが救援隊の全員が妙に青白い。「乗ってください」――ドアが閉まった。':'食料と体力のどちらかを失った。危険を取りすぎないこと。';result.classList.add('on')}function reset(){day=1;food=8;hp=10;document.getElementById('food').textContent=food;document.getElementById('hp').textContent=hp;document.getElementById('icon').textContent='🧟';result.classList.remove('on');show()}a.onclick=()=>pick(0);b.onclick=()=>pick(1);retry.onclick=reset;reset()})()</script></body></html>
