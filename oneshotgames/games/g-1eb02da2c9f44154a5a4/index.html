<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>DAY 30: ZOMBIE</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d0c;color:#eef8ef;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:radial-gradient(circle at 70% 0,#34483c,#121b17 38%,#050807)}h1{font-size:30px;margin:4px 0}.tag{font-size:11px;font-weight:900;letter-spacing:.14em;color:#b7f07d}.sub{margin:0 0 10px;color:#b8c7bb;font-size:13px}.panel{padding:14px;border-radius:22px;background:#101a15dd;border:1px solid #c9ffd31f;box-shadow:0 20px 60px #0008}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border-radius:999px;background:#ffffff0d;font-size:12px;font-weight:900}.scene{height:250px;margin-top:10px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(#5d7267 0 45%,#24312a 45% 100%)}.scene:before{content:"";position:absolute;left:8%;right:8%;bottom:0;height:62%;background:linear-gradient(90deg,#252d29 0 14%,transparent 14% 22%,#303832 22% 44%,transparent 44% 52%,#252d29 52% 68%,transparent 68% 76%,#303832 76%);clip-path:polygon(0 18%,10% 18%,10% 4%,25% 4%,25% 31%,40% 31%,40% 10%,58% 10%,58% 36%,75% 36%,75% 16%,100% 16%,100% 100%,0 100%)}.moon{position:absolute;right:12%;top:12%;width:54px;height:54px;border-radius:50%;background:#d7e4bf;box-shadow:0 0 28px #e5ffc466}.survivor{position:absolute;left:12%;bottom:14%;font-size:72px;filter:drop-shadow(0 8px 10px #000)}.zeds{position:absolute;right:8%;bottom:12%;font-size:58px;letter-spacing:-16px}.forecast{margin:10px 0 0;padding:10px;border-radius:14px;background:#0006;font-size:13px}.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.bar{height:12px;border-radius:99px;background:#0008;overflow:hidden}.bar i{display:block;height:100%;transition:width .25s}.food i{background:linear-gradient(90deg,#e8b84d,#ffe58c)}.alert i{background:linear-gradient(90deg,#67c891,#ff5e5e)}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.btn{min-height:62px;border:0;border-radius:15px;padding:8px;color:#fff;font-weight:900;font-size:14px;background:linear-gradient(135deg,#4b7757,#2e543d);touch-action:manipulation}.btn.risk{background:linear-gradient(135deg,#886128,#b44232)}.btn.safe{background:linear-gradient(135deg,#465f6d,#334856)}.btn:active{transform:scale(.98)}.msg{min-height:44px;margin:10px 0 0;padding:10px;border-radius:14px;background:#ffffff0b;font-size:13px}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#17241c}.result.on{display:block}</style></head><body><main class="app"><div class="tag">30 DAY SURVIVAL</div><h1>DAY 30: ZOMBIE</h1><p class="sub">食料・体力・警戒を管理し、30日目の救援まで生き残れ。</p><section class="panel"><div class="hud"><span class="pill">DAY <b id="day">1</b>/30</span><span class="pill">🍞 <b id="food">10</b></span><span class="pill">❤️ <b id="hp">10</b></span><span class="pill">🧱 <b id="shelter">2</b></span></div><div class="scene"><div class="moon"></div><div class="survivor">🧍</div><div class="zeds" id="zeds">🧟🧟</div></div><div class="forecast" id="event"></div><div class="bars"><div><small>食料</small><div class="bar food"><i id="foodBar"></i></div></div><div><small>警戒</small><div class="bar alert"><i id="alertBar"></i></div></div></div><div class="actions"><button class="btn risk" id="scavenge">🔎 探索</button><button class="btn safe" id="rest">🛏️ 休む</button><button class="btn" id="fortify">🧱 補強</button></div><p class="msg" id="msg">今日はどう動く？</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">DAY 1から</button></section></main><script>(()=>{const events=[['スーパー跡に物資の気配',2],['路地で足音が増えている',4],['雨。ゾンビの音が聞こえにくい',1],['薬局跡のシャッターが半開き',3],['遠くで発煙筒が上がった',3],['静かな夜。不気味なくらいだ',0],['駐車場に放置トラック',2],['群れが北側へ移動中',5]];let day,food,hp,shelter,alert;const el=id=>document.getElementById(id);function current(){return events[(day*5+Math.floor(day/3))%events.length]}function render(){el('day').textContent=day;el('food').textContent=food;el('hp').textContent=hp;el('shelter').textContent=shelter;el('foodBar').style.width=Math.min(100,food*8)+'%';el('alertBar').style.width=Math.min(100,alert*10)+'%';let e=current();el('event').textContent=`今日の状況：${e[0]} / 危険度 ${e[1]}`;el('zeds').textContent='🧟'.repeat(Math.max(1,Math.min(4,Math.ceil((alert+e[1])/3))))}function advance(){food--;if(food<0)hp-=2;if(alert>=8&&Math.random()<.45){let hit=Math.max(1,3-shelter);hp-=hit;alert=Math.max(2,alert-3);msg.textContent+=` 襲撃！ -${hit}体力`}day++;if(hp<=0||food<-2)return end(false);if(day>30)return end(true);render()}function act(type){let risk=current()[1];if(type==='scavenge'){let gain=2+Math.floor(Math.random()*4);food+=gain;alert+=risk+Math.floor(Math.random()*3);msg.textContent=`物資 +${gain}。そのぶん物音も出た。`}if(type==='rest'){hp=Math.min(10,hp+2);alert=Math.max(0,alert-2);food--;msg.textContent='体力回復。静かにやり過ごした。'}if(type==='fortify'){if(food<=1){msg.textContent='資材を探す余裕がない。';return}food--;shelter=Math.min(5,shelter+1);alert=Math.max(0,alert-1);msg.textContent='拠点を補強。襲撃ダメージを軽減。'}advance()}function end(win){rt.textContent=win?'救援車両が到着！':'生存失敗';rx.textContent=win?`30日を突破。残り食料${food}、体力${hp}、拠点Lv.${shelter}。`: `DAY ${Math.min(day,30)}で力尽きた。探索と警戒のバランスを変えて再挑戦。`;result.classList.add('on')}function reset(){day=1;food=10;hp=10;shelter=2;alert=1;result.classList.remove('on');msg.textContent='今日はどう動く？';render()}scavenge.onclick=()=>act('scavenge');rest.onclick=()=>act('rest');fortify.onclick=()=>act('fortify');retry.onclick=reset;reset()})()</script></body></html>
