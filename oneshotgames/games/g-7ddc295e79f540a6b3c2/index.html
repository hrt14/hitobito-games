<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>最後の灯り</title><style>body{margin:0;background:#08111f;color:#e5eefc;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.g{width:min(92vw,500px);text-align:center}.sky{height:280px;border-radius:22px;background:linear-gradient(#10233d,#1f3654);position:relative;overflow:hidden;margin:18px 0}.star{position:absolute;width:10px;height:10px;background:white;border-radius:50%;opacity:.2;transition:.4s}.boat{position:absolute;bottom:22px;left:42%;font-size:52px;transition:.5s}.msg{min-height:58px}button{width:100%;padding:18px;border:0;border-radius:16px;background:#fbbf24;color:#422006;font-size:19px;font-weight:900}</style><main class="g"><h1>最後の灯り</h1><p>暗い海で、遠くの誰かへ灯りを5回届けよう。</p><div class="sky" id="sky"><div class="boat" id="boat">⛵</div></div><div class="msg" id="msg">灯りを送るたび、空が少し戻る。</div><button id="send">灯りを送る</button></main><script>const sky=document.querySelector('#sky'),boat=document.querySelector('#boat'),msg=document.querySelector('#msg'),send=document.querySelector('#send');for(let i=0;i<25;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*95+'%';s.style.top=Math.random()*75+'%';sky.appendChild(s)}const lines=['遠くで小さく返事が見えた。','一人ではない気がした。','波の音が少しやわらいだ。','灯りは見えなくても届いている。','夜明け。あなたの灯りを待っていた人がいた。'];let n=0,done=false;send.onclick=()=>{if(done)return location.reload();document.querySelectorAll('.star').forEach((s,i)=>{if(i<n*5+5)s.style.opacity=1});boat.style.left=(42+(n%2?8:-8))+'%';msg.textContent=lines[n];n++;sky.style.background=`linear-gradient(#${['10233d','17345a','234b72','3c6685','7296a7'][n-1]},#1f3654)`;if(n===5){done=true;send.textContent='もう一度';}};</script>
