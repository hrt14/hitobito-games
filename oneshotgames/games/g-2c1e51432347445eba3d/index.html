<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>ひとりかくれんぼ</title><style>body{margin:0;background:#09090b;color:#fafafa;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.g{width:min(92vw,500px);text-align:center}.room{height:300px;border:1px solid #3f3f46;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(#18181b,#09090b)}.spot{position:absolute;width:84px;height:84px;border:1px solid #52525b;border-radius:14px;display:grid;place-items:center;font-size:36px;user-select:none}.spot:nth-child(1){left:20px;top:35px}.spot:nth-child(2){right:20px;top:50px}.spot:nth-child(3){left:120px;bottom:25px}.spot:nth-child(4){right:100px;bottom:20px}button{margin-top:16px;padding:15px 24px;border:0;border-radius:14px;font-weight:800}#msg{min-height:48px}</style><main class="g"><h1>ひとりかくれんぼ</h1><p>5秒以内に「気配」がない隠れ場所を選べ。3夜生き残れ。</p><div class="room"><div class="spot">🚪</div><div class="spot">🛏️</div><div class="spot">🧺</div><div class="spot">🪟</div></div><p id="msg">夜1。どこに隠れる？</p><button id="again" hidden>最初から</button></main><script>const spots=[...document.querySelectorAll('.spot')],msg=document.querySelector('#msg'),again=document.querySelector('#again');let night=1,danger=Math.floor(Math.random()*4),done=false,timer;function round(){danger=Math.floor(Math.random()*4);let left=5;msg.textContent=`夜${night}。${left}秒で選べ`;clearInterval(timer);timer=setInterval(()=>{left--;msg.textContent=`夜${night}。${left}秒で選べ`;if(left<=0){clearInterval(timer);finish(false,'時間切れ。廊下の音が止まった。')}} ,1000)}function finish(win,text){done=true;msg.textContent=text;again.hidden=false}spots.forEach((s,i)=>s.onclick=()=>{if(done)return;clearInterval(timer);if(i===danger)return finish(false,'そこには先客がいた。見つかった。');night++;if(night>3)return finish(true,'朝が来た。3夜を逃げ切った！');msg.textContent='静かだ…次の夜へ。';setTimeout(round,700)});again.onclick=()=>location.reload();round();</script>
