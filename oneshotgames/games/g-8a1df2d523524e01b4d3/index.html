<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SKY RUINS QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#86d5ff,#d7f0ff);font-family:system-ui;color:#10233e;min-height:100vh;display:grid;place-items:center}.w{width:min(700px,100%);padding:14px}.top{display:flex;justify-content:space-between;font-weight:950}.box{position:relative;height:420px;border-radius:24px;overflow:hidden;background:linear-gradient(#91e0ff 0 42%,#7eb86b 42%);border:3px solid #ffffffaa}.island{position:absolute;background:#a8c87b;border:4px solid #6f8d54;border-radius:40%;box-shadow:0 12px #5a7549}.i1{left:4%;top:55%;width:38%;height:32%}.i2{right:5%;top:18%;width:38%;height:34%}.bridge{position:absolute;left:38%;top:55%;width:28%;height:18px;background:#845a34;transform:rotate(-28deg);opacity:.25}.bridge.on{opacity:1}.hero{position:absolute;left:18%;top:68%;font-size:48px;transition:.12s}.orb{position:absolute;left:28%;top:60%;font-size:34px}.altar{position:absolute;right:18%;top:27%;font-size:52px}.msg{text-align:center;font-weight:850;min-height:30px;margin:9px}.ctrl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ctrl button,.again{min-height:58px;border:0;border-radius:17px;font-weight:900;font-size:16px}.result{display:none;text-align:center;background:#ffffffb5;border-radius:22px;padding:24px}</style></head><body><main class="w"><div class="top"><span>☁️ SKY RUINS QUEST</span><span>🔷 <b id="orbs">0</b>/2</span></div><p>遺跡を歩き、青い結晶を2つ集めて祭壇へ。</p><section id="game"><div class="box"><div class="island i1"></div><div class="island i2"></div><div id="bridge" class="bridge"></div><div id="orb1" class="orb">🔷</div><div id="orb2" class="orb" style="left:72%;top:30%">🔷</div><div class="altar">🗿</div><div id="hero" class="hero">🧭</div></div><div id="msg" class="msg">まず近くの結晶を取ろう</div><div class="ctrl"><button data-d="l">←</button><button data-d="u">↑</button><button data-d="r">→</button><button data-d="d">↓</button><button id="act">✨ 調べる</button><button id="dash">💨 ダッシュ</button></div></section><section id="res" class="result"><h2>遺跡起動！</h2><p>空の祭壇が目を覚ました。</p><button id="again" class="again">もう一度探索</button></section></main><script>(()=>{let x=18,y=68,count=0,got1=false,got2=false,active=true;function draw(){hero.style.left=x+'%';hero.style.top=y+'%';orbs.textContent=count;bridge.classList.toggle('on',got1)}function near(ax,ay){return Math.hypot(x-ax,y-ay)<12}function move(d,s=6){if(!active)return;if(d==='l')x-=s;if(d==='r')x+=s;if(d==='u')y-=s;if(d==='d')y+=s;x=Math.max(5,Math.min(90,x));y=Math.max(18,Math.min(82,y));if(!got1&&x>44&&x<65){x=44;msg.textContent='橋がない。近くの結晶を探そう'}draw()}function actNow(){if(!got1&&near(28,60)){got1=true;count++;orb1.style.display='none';msg.textContent='橋が出現した！';draw();return}if(got1&&!got2&&near(72,30)){got2=true;count++;orb2.style.display='none';msg.textContent='祭壇へ行こう';draw();return}if(got2&&near(82,27)){active=false;game.style.display='none';res.style.display='block';return}msg.textContent='ここには何もないようだ'}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(b.dataset.d));dash.onclick=()=>move('r',12);act.onclick=actNow;again.onclick=()=>{x=18;y=68;count=0;got1=got2=false;active=true;orb1.style.display='block';orb2.style.display='block';game.style.display='block';res.style.display='none';msg.textContent='まず近くの結晶を取ろう';draw()};draw()})();</script></body></html>
