<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>CHORD JAM</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key{height:110px;background:linear-gradient(#fff,#d9e3ef);color:#172238;border-radius:10px;display:grid;place-items:end center;padding:10px;font-weight:1000}.key.on{transform:translateY(5px);background:#9fe9ff}.notes{height:100px;display:flex;align-items:center;justify-content:center;font-size:36px;letter-spacing:8px}</style></head><body><main class="app"><div class="tag">PLAYABLE PIANO</div><h1>CHORD JAM</h1><p class="muted">コードをタップするだけで和音が鳴る。お題の4コードを順番に決めてフィニッシュ。</p><div class="panel"><div class="hud"><span class="pill">SCORE <b id="score">0</b></span><span class="pill" id="goal">C → G → Am → F</span></div><div class="notes" id="notes">♪</div><div class="keys" id="keys"></div><button id="finish" style="width:100%;margin-top:12px">この演奏でフィニッシュ</button></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">別のお題</button></div></main><script>(()=>{const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();const defs={C:[261.6,329.6,392],G:[196,246.9,392],Am:[220,261.6,329.6],F:[174.6,220,349.2],Dm:[146.8,220,293.7],Em:[164.8,246.9,329.6],E:[164.8,207.7,329.6],A:[220,277.2,440]};const keys=document.getElementById('keys'),notes=document.getElementById('notes'),score=document.getElementById('score'),goal=document.getElementById('goal');let seq=[],target=[];function sound(name){ctx.resume();defs[name].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.type=i?'triangle':'sine';g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.48);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.5)})}Object.keys(defs).forEach(n=>{const b=document.createElement('button');b.className='key';b.textContent=n;b.onclick=()=>{sound(n);seq.push(n);if(seq.length>4)seq.shift();notes.textContent=seq.join(' · ');b.classList.add('on');setTimeout(()=>b.classList.remove('on'),120);score.textContent=seq.filter((x,i)=>x===target[i]).length};keys.appendChild(b)});function newGoal(){const names=Object.keys(defs);target=Array.from({length:4},()=>names[Math.floor(Math.random()*names.length)]);seq=[];notes.textContent='♪';score.textContent='0';goal.textContent=target.join(' → ');document.getElementById('result').classList.remove('on')}document.getElementById('finish').onclick=()=>{const s=seq.filter((x,i)=>x===target[i]).length;document.getElementById('rt').textContent=s===4?'PERFECT JAM!':'演奏終了';document.getElementById('rx').textContent=`一致 ${s}/4。自由演奏も正解探しも、コード1タップで鳴らせる。`;document.getElementById('result').classList.add('on')};document.getElementById('retry').onclick=newGoal;newGoal()})()</script></body></html>
