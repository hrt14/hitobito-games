<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090512"><title>WORLD END | OneShotGames</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090512;color:#f7f0ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}.game{min-height:100vh;background:radial-gradient(circle at 50% 0,#32194f 0,#12091f 42%,#090512 75%);padding:18px 16px calc(96px + env(safe-area-inset-bottom))}.top{max-width:720px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-size:11px;letter-spacing:.2em;font-weight:900;color:#ff8df3}.stage{font-size:12px;color:#baa8c9}.panel{max-width:720px;margin:14px auto 0;border:1px solid rgba(255,255,255,.12);border-radius:24px;overflow:hidden;background:linear-gradient(180deg,rgba(31,18,48,.96),rgba(11,7,19,.98));box-shadow:0 28px 80px rgba(0,0,0,.5)}.scene{min-height:300px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.55)),radial-gradient(circle at 50% 25%,#713e95,#24103d 55%,#0d0717)}.orb{position:absolute;left:50%;top:74px;transform:translateX(-50%);width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff 0 3%,#8ffcff 5% 13%,#a029ff 25%,#35104f 57%,#13051c 70%);box-shadow:0 0 30px #b64cff,0 0 90px rgba(103,38,255,.6);animation:pulse 2.1s ease-in-out infinite}@keyframes pulse{50%{transform:translateX(-50%) scale(1.05);filter:brightness(1.14)}}.enemy{position:absolute;left:50%;top:48px;transform:translateX(-50%);font-size:92px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.6));transition:.14s}.enemy.hit{transform:translateX(-50%) scale(.86) rotate(-4deg);filter:brightness(1.8) drop-shadow(0 0 18px #ff4c8b)}.scene h1{margin:0;font-size:clamp(34px,10vw,68px);line-height:.9;letter-spacing:-.06em}.scene p{margin:10px 0 0;max-width:560px;color:#d0bfdc;line-height:1.55}.hud{padding:16px 18px 0}.row{display:flex;gap:12px}.stat{flex:1}.stathead{display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.08em;color:#c5b5d1}.bar{height:10px;margin-top:6px;border-radius:999px;background:#27182f;overflow:hidden}.fill{height:100%;width:100%;transition:.25s;background:linear-gradient(90deg,#35e0c1,#6bff98)}.enemyfill{background:linear-gradient(90deg,#ff2e75,#ff9b54)}.log{min-height:48px;padding:13px 18px;color:#cdbdd7;font-size:13px;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 18px 18px}.actions button,.primary{appearance:none;border:0;border-radius:16px;padding:15px 10px;color:white;font-weight:950;font-size:15px;background:linear-gradient(135deg,#4f2ea1,#9b39dc);box-shadow:0 9px 22px rgba(101,43,180,.24);cursor:pointer}.actions button:nth-child(2){background:linear-gradient(135deg,#124b62,#188f94)}.actions button:nth-child(3){background:linear-gradient(135deg,#7a274a,#d14173)}button:disabled{opacity:.42}.intro,.ending{position:fixed;z-index:20;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,#2c1744,#090512 66%)}.card{width:min(520px,100%);text-align:center}.sigil{font-size:74px;margin-bottom:8px}.card h2{font-size:clamp(42px,13vw,74px);margin:0;line-height:.9;letter-spacing:-.07em}.card p{color:#cbb9d7;line-height:1.75}.primary{padding:16px 24px;background:linear-gradient(105deg,#7c39ff,#e03aae,#ff7148)}.hidden{display:none}.quake{animation:quake .22s linear}@keyframes quake{25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}.badge{display:inline-block;margin-top:12px;padding:6px 10px;border:1px solid rgba(255,255,255,.15);border-radius:999px;font-size:11px;color:#d7c5e2}.choice{display:grid;gap:10px;margin-top:18px}.choice button{border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:13px;color:white;background:#1a1027;font-weight:800}
</style></head><body><main class="game"><div class="top"><div class="brand">ONE SHOT RPG</div><div class="stage" id="stageLabel">PROLOGUE</div></div><section class="panel" id="panel"><div class="scene" id="scene"><div class="orb" id="orb"></div><div class="enemy hidden" id="enemy">👁️</div><h1 id="title">WORLD END</h1><p id="subtitle">世界を救うな。滅ぼせ。4つの守護核を破壊し、最後に世界心臓を止めろ。</p></div><div class="hud"><div class="row"><div class="stat"><div class="stathead"><span>YOU</span><span id="hpText">100</span></div><div class="bar"><div class="fill" id="hpFill"></div></div></div><div class="stat"><div class="stathead"><span id="enemyName">CORE</span><span id="enemyHpText">—</span></div><div class="bar"><div class="fill enemyfill" id="enemyHpFill"></div></div></div></div></div><div class="log" id="log">STARTすると最初の守護者が現れる。</div><div class="actions"><button id="strike">斬る</button><button id="guard">守る</button><button id="hex">呪う</button></div></section></main><section class="intro" id="intro"><div class="card"><div class="sigil">☄️</div><div class="brand">A TINY APOCALYPSE RPG</div><h2>WORLD END</h2><p>世界を滅ぼす側の30秒RPG。<br>敵の攻撃を読み、斬る・守る・呪うで4戦突破せよ。</p><div class="badge">操作は3ボタンだけ</div><br><br><button class="primary" id="start">世界を滅ぼしに行く</button></div></section><section class="ending hidden" id="ending"><div class="card"><div class="sigil" id="endIcon">🌑</div><div class="brand">ENDING</div><h2 id="endTitle">THE END</h2><p id="endText"></p><div class="choice" id="endChoices"></div></div></section><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const intro=$('intro'),ending=$('ending'),enemy=$('enemy'),orb=$('orb'),scene=$('scene'),title=$('title'),subtitle=$('subtitle'),log=$('log'),stageLabel=$('stageLabel'),hpText=$('hpText'),hpFill=$('hpFill'),enemyHpText=$('enemyHpText'),enemyHpFill=$('enemyHpFill'),enemyName=$('enemyName'),strike=$('strike'),guard=$('guard'),hex=$('hex');const foes=[{name:'天空監視者',icon:'👁️',hp:34,min:8,max:15,stage:'I · SKY CORE'},{name:'鉄獣ベヒモス',icon:'🦾',hp:46,min:10,max:18,stage:'II · IRON CORE'},{name:'時喰らい',icon:'⏳',hp:58,min:12,max:20,stage:'III · TIME CORE'},{name:'世界心臓',icon:'🜃',hp:78,min:14,max:23,stage:'FINAL · WORLD HEART'}];let player=100,index=0,foeHp=0,guarding=false,cursed=0,busy=false,turn=0;function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function rumble(){scene.classList.remove('quake');void scene.offsetWidth;scene.classList.add('quake')}function hitFx(){enemy.classList.remove('hit');void enemy.offsetWidth;enemy.classList.add('hit');setTimeout(()=>enemy.classList.remove('hit'),160)}function update(){hpText.textContent=player;hpFill.style.width=clamp(player,0,100)+'%';enemyHpText.textContent=Math.max(0,foeHp);const max=foes[index]?.hp||1;enemyHpFill.style.width=clamp(foeHp/max*100,0,100)+'%';[strike,guard,hex].forEach(b=>b.disabled=busy)}function startBattle(){const f=foes[index];foeHp=f.hp;guarding=false;cursed=0;turn=0;stageLabel.textContent=f.stage;enemyName.textContent=f.name;enemy.textContent=f.icon;enemy.classList.remove('hidden');orb.classList.add('hidden');title.textContent=f.name;subtitle.textContent=index===3?'世界を支える最後の心臓。止めれば空も海も消える。':'守護核を破壊し、世界心臓への道を開け。';log.textContent='敵の気配を読む。斬る=大ダメージ、守る=被害軽減、呪う=次の敵攻撃を弱体化。';update()}function enemyTurn(){if(foeHp<=0)return winBattle();const f=foes[index];let dmg=Math.floor(f.min+Math.random()*(f.max-f.min+1));if(cursed>0){dmg=Math.max(2,Math.floor(dmg*.45));cursed--}if(guarding)dmg=Math.max(1,Math.floor(dmg*.35));guarding=false;player-=dmg;rumble();log.textContent=`${f.name}の反撃。${dmg}ダメージ。`;if(player<=0){player=0;update();return endGame(false)}update();busy=false;update()}function act(type){if(busy||player<=0)return;busy=true;turn++;let dmg=0;if(type==='strike'){dmg=Math.floor(11+Math.random()*12);foeHp-=dmg;hitFx();log.textContent=`終末斬り。${dmg}ダメージ。`;}else if(type==='guard'){guarding=true;player=Math.min(100,player+4);log.textContent='黒盾展開。次の反撃を大幅軽減。HP+4。';}else{cursed=Math.min(2,cursed+1);dmg=Math.floor(5+Math.random()*6);foeHp-=dmg;hitFx();log.textContent=`崩壊の呪い。${dmg}ダメージ＋敵弱体化。`;}update();setTimeout(enemyTurn,520)}function winBattle(){const f=foes[index];log.textContent=`${f.name}、崩壊。`;busy=true;update();if(index===foes.length-1){setTimeout(()=>endGame(true),650);return}player=Math.min(100,player+20);index++;setTimeout(startBattle,720)}function endGame(clear){ending.classList.remove('hidden');$('endChoices').innerHTML='';if(!clear){$('endIcon').textContent='💀';$('endTitle').textContent='YOU FELL';$('endText').textContent=`守護者に倒された。到達地点：${foes[index].stage}。世界はまだ続いている。`;const b=document.createElement('button');b.textContent='もう一度、終末を始める';b.onclick=begin;$('endChoices').appendChild(b);return}$('endIcon').textContent='🌑';$('endTitle').textContent='WORLD ENDED';$('endText').textContent='世界心臓は止まった。光が消え、音も消えた。最後に残ったのは、あなたの選択だけだ。';['滅びを受け入れる','最後の1秒だけ巻き戻す'].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(i===0){$('endTitle').textContent='SILENCE';$('endText').textContent='何もない。それが、あなたが選んだエンディング。'}else{$('endTitle').textContent='ONE MORE WORLD';$('endText').textContent='世界は1秒だけ戻った。誰も気づかない。ただ、あなたはもう一度選べる。'}b.remove();const r=document.createElement('button');r.textContent='最初から遊ぶ';r.onclick=begin;$('endChoices').innerHTML='';$('endChoices').appendChild(r)};$('endChoices').appendChild(b)})}function begin(){intro.classList.add('hidden');ending.classList.add('hidden');player=100;index=0;busy=false;startBattle()}$('start').addEventListener('click',begin);strike.addEventListener('click',()=>act('strike'));guard.addEventListener('click',()=>act('guard'));hex.addEventListener('click',()=>act('hex'));update()})();
</script></body></html>
