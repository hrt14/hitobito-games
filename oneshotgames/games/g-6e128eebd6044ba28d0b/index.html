<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>TISSUE DASH</title><style>*{box-sizing:border-box;user-select:none;-webkit-user-select:none}html,body{margin:0;height:100%;font-family:system-ui;background:#12213b;color:#fff;overflow:hidden;touch-action:none}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;text-align:center;background:linear-gradient(#162a4b,#0b1325)}header{padding:14px}h1{margin:0;font-size:24px}.hud{display:flex;justify-content:center;gap:18px;font-weight:800}.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;min-height:0}.lane{position:relative;border-radius:22px;background:#fff1;color:#fff;border:2px solid #ffffff22;overflow:hidden}.box{position:absolute;left:15%;right:15%;bottom:12%;height:34%;border-radius:18px;background:linear-gradient(135deg,#6ad9ff,#8f7cff);box-shadow:0 12px 30px #0007}.box.rival{background:linear-gradient(135deg,#ff8ab8,#ffb85c)}.slot{position:absolute;left:28%;right:28%;top:12%;height:10px;border-radius:99px;background:#18223a}.paper{position:absolute;left:40%;width:20%;bottom:43%;height:90px;background:#fff;border-radius:8px 8px 3px 3px;box-shadow:0 4px 10px #0003;transform-origin:bottom}.count{position:absolute;top:14px;left:0;right:0;font-size:40px;font-weight:1000}.label{position:absolute;bottom:4%;left:0;right:0;font-weight:900}.controls{padding:10px 14px max(16px,env(safe-area-inset-bottom));display:grid;gap:8px}button{border:0;border-radius:18px;min-height:64px;font-size:20px;font-weight:1000;color:#071224;background:linear-gradient(135deg,#77f0ff,#fff);box-shadow:0 8px 20px #0006}button:active{transform:scale(.97)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:#081224ee;z-index:5}.card{max-width:420px;background:#172844;border:1px solid #ffffff33;border-radius:24px;padding:24px;box-shadow:0 20px 60px #000b}.card p{line-height:1.6}.hidden{display:none}.flash{animation:pull .18s}@keyframes pull{50%{transform:translateY(-45px) scaleY(1.2);opacity:.7}}</style></head><body><main class="app"><header><h1>🧻 TISSUE DASH</h1><div class="hud"><span id="time">TIME 15.0</span><span>先に多く引け！</span></div></header><section class="arena"><div class="lane"><div class="count" id="me">0</div><div class="paper" id="paper"></div><div class="box"><div class="slot"></div></div><div class="label">YOU</div></div><div class="lane"><div class="count" id="cpu">0</div><div class="paper" id="rpaper"></div><div class="box rival"><div class="slot"></div></div><div class="label">RIVAL</div></div></section><div class="controls"><button id="pull">⬆ ティッシュを引き抜く！</button></div></main><section class="overlay" id="intro"><div class="card"><h2>15秒ティッシュ勝負</h2><p>下のボタンをテンポよくタップ。ライバルより多くティッシュを引き抜けば勝ち！連打しすぎると紙が詰まることがある。</p><button id="start">START</button></div></section><section class="overlay hidden" id="end"><div class="card"><h2 id="result"></h2><p id="detail"></p><button id="retry">もう一度</button></div></section><script>(()=>{const $=x=>document.getElementById(x);let me=0,cpu=0,left=15,running=false,last=0,streak=0,timer,cpuTimer;function draw(){$('me').textContent=me;$('cpu').textContent=cpu;$('time').textContent='TIME '+left.toFixed(1)}function pulse(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}function pull(){if(!running)return;const now=performance.now();if(now-last<75)streak++;else streak=Math.max(0,streak-1);last=now;if(streak>7&&Math.random()<.28){streak=0;$('pull').textContent='⚠ 詰まった！';setTimeout(()=>{$('pull').textContent='⬆ ティッシュを引き抜く！'},420);navigator.vibrate?.(40);return}me++;pulse($('paper'));navigator.vibrate?.(8);draw()}function start(){me=cpu=streak=0;left=15;running=true;$('intro').classList.add('hidden');$('end').classList.add('hidden');draw();const began=performance.now();timer=setInterval(()=>{left=Math.max(0,15-(performance.now()-began)/1000);draw();if(left<=0)finish()},50);cpuTimer=setInterval(()=>{if(running&&Math.random()<.72){cpu++;pulse($('rpaper'));draw()}},145+Math.random()*65)}function finish(){if(!running)return;running=false;clearInterval(timer);clearInterval(cpuTimer);const win=me>cpu,tie=me===cpu;$('result').textContent=tie?'DRAW!':win?'🏆 YOU WIN!':'😵 RIVAL WIN';$('detail').textContent=`あなた ${me}枚 / ライバル ${cpu}枚。${win?'見事な引き抜き速度！':tie?'完全互角！もう一勝負。':'一定のリズムで詰まりを避けよう。'}`;$('end').classList.remove('hidden')}$('pull').addEventListener('pointerdown',e=>{e.preventDefault();pull()});$('start').onclick=start;$('retry').onclick=start;draw()})();</script></body></html>
