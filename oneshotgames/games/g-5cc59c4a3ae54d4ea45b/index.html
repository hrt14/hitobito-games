<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WHALE FALL―深海に咲く</title><style>*{box-sizing:border-box}body{margin:0;background:#020814;color:#e8fbff;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#041629cc;border:1px solid #2b8aa5;border-radius:999px;padding:8px 12px;font-size:12px}.help{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(92vw,520px);text-align:center;background:#03111edd;border:1px solid #246a80;border-radius:18px;padding:10px}.start,.end{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#0d4261,#020814 70%);padding:24px}.card{max-width:520px;text-align:center}.card h1{font-size:clamp(42px,12vw,72px);line-height:.9;margin:0}.card p{line-height:1.7;color:#bfe9f3}.card button{border:0;border-radius:16px;padding:15px 24px;background:#45d9ef;color:#01222b;font-weight:900;font-size:16px}.hidden{display:none}.sonar{position:fixed;right:18px;bottom:86px;width:76px;height:76px;border-radius:50%;border:2px solid #79efff;background:#0a3446cc;color:#fff;font-weight:900}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill" id="depth">0m</div><div class="pill" id="mission">魚群を追う</div><div class="pill" id="hp">耐久 3</div></div><button class="sonar" id="sonar">SONAR</button><div class="help" id="help">ドラッグ / 矢印キーで移動。ソナーで見えない目標を照らす。</div><section class="start" id="start"><div class="card"><h1>WHALE<br>FALL</h1><p>暗闇へ潜れ。移動とソナーだけで5つの深度を突破し、海底に咲く命を観察する。</p><button id="go">潜航開始</button></div></section><section class="end hidden" id="end"><div class="card"><h1 id="et">深海に咲く</h1><p id="em"></p><button id="again">もう一度潜る</button></div></section><script>(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),D=document.getElementById('depth'),M=document.getElementById('mission'),H=document.getElementById('hp'),help=document.getElementById('help'),sonar=document.getElementById('sonar');let w,h,dpr,p,stage,hits,scan,goal,t,drag=false,done=false;const stages=[['魚群を追う',550],['発光順を再現',900],['3基のビーコンを起動',1400],['マリンスノーを採取',2100],['反応を追って海底へ',3000],['ホエールフォールを観察',3400]];function fit(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)}function reset(){p={x:w/2,y:h*.25};stage=0;hits=3;scan=0;goal={x:w*.25+Math.random()*w*.5,y:h*.55};t=0;done=false;D.textContent='0m';M.textContent=stages[0][0];H.textContent='耐久 3';help.textContent='ドラッグ / 矢印キーで移動。ソナーで見えない目標を照らす。'}function next(){stage++;if(stage>=stages.length){done=true;document.getElementById('em').textContent='腐肉食生物、小さな生物、硫化物に支えられた生態系、そして骨格の礁。ひとつの死が、長い時間をかけて多くの命を支えていた。';document.getElementById('end').classList.remove('hidden');return}goal={x:50+Math.random()*(w-100),y:h*.45+Math.random()*h*.35};M.textContent=stages[stage][0];help.textContent=stage===5?'ソナーを4回当てて、時間の異なる4つの生態相を観察しよう。':'ソナーで目標を探し、探査艇を重ねよう。'}function loop(){if(!done){t+=.016;const depth=Math.min(stages[stage][1],Math.floor((stage*520)+(p.y/h)*520));D.textContent=depth+'m';x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#06304c');g.addColorStop(1,'#01040a');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<36;i++){const yy=(i*83+t*18)%h;x.fillStyle='rgba(170,230,240,'+(0.08+(i%5)*.02)+')';x.fillRect((i*97)%w,yy,1,3)}if(scan>0){scan-=.016;const r=(1-scan/1.2)*Math.max(w,h);x.strokeStyle='rgba(99,238,255,'+(scan/1.2)+')';x.lineWidth=2;x.beginPath();x.arc(p.x,p.y,r,0,7);x.stroke();x.fillStyle='rgba(140,255,233,.85)';x.beginPath();x.arc(goal.x,goal.y,10+stage*2,0,7);x.fill()}x.fillStyle='#7ef1ff';x.beginPath();x.moveTo(p.x,p.y-14);x.lineTo(p.x-11,p.y+12);x.lineTo(p.x+11,p.y+12);x.closePath();x.fill();if(Math.hypot(p.x-goal.x,p.y-goal.y)<30){if(stage===5){goal={x:60+Math.random()*(w-120),y:h*.45+Math.random()*h*.35};help.textContent='観察 '+(Math.min(4,Math.floor(t)%4+1))+'/4：骨の周りに新しい命の層が見える';if(t>12)next()}else next()}}requestAnimationFrame(loop)}function ping(){scan=1.2}sonar.onclick=ping;c.addEventListener('pointerdown',e=>{drag=true;p.x=e.clientX;p.y=e.clientY});c.addEventListener('pointermove',e=>{if(drag){p.x=e.clientX;p.y=e.clientY}});addEventListener('pointerup',()=>drag=false);addEventListener('keydown',e=>{const s=18;if(e.key==='ArrowLeft')p.x-=s;if(e.key==='ArrowRight')p.x+=s;if(e.key==='ArrowUp')p.y-=s;if(e.key==='ArrowDown')p.y+=s;if(e.key===' ')ping();p.x=Math.max(20,Math.min(w-20,p.x));p.y=Math.max(60,Math.min(h-90,p.y))});document.getElementById('go').onclick=()=>{document.getElementById('start').classList.add('hidden');reset()};document.getElementById('again').onclick=()=>{document.getElementById('end').classList.add('hidden');reset()};addEventListener('resize',fit);fit();reset();loop()})();</script></body></html>
