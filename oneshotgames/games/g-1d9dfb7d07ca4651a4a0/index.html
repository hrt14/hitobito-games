<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON 1988</title><style>body{margin:0;background:#090014;color:#fff;font-family:monospace;display:grid;place-items:center;min-height:100vh}.g{width:min(94vw,520px);text-align:center}.screen{height:300px;border:4px solid #22d3ee;box-shadow:0 0 24px #22d3ee88 inset,0 0 20px #ec4899;border-radius:14px;position:relative;overflow:hidden;background:linear-gradient(#16052d,#08000f)}.grid{position:absolute;inset:55% 0 0;background:repeating-linear-gradient(0deg,#7c3aed55 0 2px,transparent 2px 24px),repeating-linear-gradient(90deg,#22d3ee55 0 2px,transparent 2px 32px)}#car{position:absolute;bottom:30px;left:44%;font-size:48px}#orb{position:absolute;top:20px;left:30px;font-size:34px}button{width:100%;padding:18px;margin-top:16px;border:0;background:#ec4899;color:#fff;font:900 18px monospace;border-radius:10px}h1{text-shadow:3px 3px #22d3ee}</style><main class="g"><h1>NEON 1988</h1><p>左右タップでネオン球を5個集めろ。3回逃すとGAME OVER。</p><div class="screen" id="screen"><div class="grid"></div><div id="car">🏎️</div><div id="orb">◈</div></div><p>SCORE <b id="score">0</b>　MISS <b id="miss">0</b></p><button id="move">LANE CHANGE</button><p id="msg">INSERT COIN…ではなくタップ開始</p></main><script>const car=document.querySelector('#car'),orb=document.querySelector('#orb'),scoreEl=document.querySelector('#score'),missEl=document.querySelector('#miss'),btn=document.querySelector('#move'),msg=document.querySelector('#msg');let lane=0,score=0,miss=0,done=false,target=Math.round(Math.random());function draw(){car.style.left=lane?'68%':'18%';orb.style.left=target?'72%':'22%'}function round(){target=Math.round(Math.random());draw();setTimeout(()=>{if(done)return;if(lane===target){score++;scoreEl.textContent=score;msg.textContent='GET! +1000';}else{miss++;missEl.textContent=miss;msg.textContent='MISS!';}if(score>=5){done=true;msg.textContent='STAGE CLEAR — 1988 FOREVER';btn.textContent='REPLAY';return}if(miss>=3){done=true;msg.textContent='GAME OVER';btn.textContent='REPLAY';return}round()},1100)}btn.onclick=()=>{if(done)return location.reload();lane=1-lane;draw()};draw();setTimeout(round,700);</script>
