<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SHADOW DEPOT</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07111f;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 90px;background:linear-gradient(180deg,#10233d,#07111f 55%,#050b13)}h1{font-size:26px;margin:6px 0}p{line-height:1.45}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{font-size:11px;font-weight:900;letter-spacing:.08em;color:#8fe7ff}.hud{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff10;font-size:12px;font-weight:800}.panel{margin-top:12px;padding:14px;border:1px solid #ffffff1f;border-radius:20px;background:#ffffff0b;box-shadow:0 18px 50px #0005}.big{font-size:72px;text-align:center}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}button{min-height:54px;border:0;border-radius:16px;padding:10px;color:#fff;font-weight:900;font-size:16px;background:linear-gradient(135deg,#168cff,#7b4dff);touch-action:manipulation;user-select:none;-webkit-user-select:none}button.alt{background:linear-gradient(135deg,#ff8a2b,#ff3d81)}button:active{transform:scale(.98)}.bar{height:12px;border-radius:999px;background:#0008;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#44f0c5,#49a8ff,#a76dff);width:50%}.result{display:none}.result.on{display:block}.muted{color:#b8c9da;font-size:13px}.grid{display:grid;gap:8px}.card{padding:11px;border-radius:14px;background:#0e2035;border:1px solid #ffffff19}.stage{position:relative;height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#0a1a2b;border:1px solid #ffffff24}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:#04101bdc;text-align:center}.overlay.hide{display:none}.tiny{font-size:11px;color:#9fb3c7}.map{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.tile{aspect-ratio:1;border-radius:8px;background:#10263b;display:grid;place-items:center;font-size:23px}.wall{background:#31445a}.seen{background:#7a2538}.goal{background:#174d3b}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}</style></head><body><main class="app"><div class="tag">STEALTH ACTION · 8 STAGES</div><h1>SHADOW DEPOT</h1><p class="muted">警備員の視線を避けて出口へ。1マスずつ移動し、壁の陰に隠れよう。</p><div class="panel"><div class="hud"><span class="pill">STAGE <b id="lv">1</b>/8</span><span class="pill">ALERT <b id="al">0</b>/3</span></div><div class="map" id="map"></div><div class="controls"><button class="up" data-d="0,-1">▲</button><button class="left" data-d="-1,0">◀</button><button class="down" data-d="0,1">▼</button><button class="right" data-d="1,0">▶</button></div></div><div class="panel result" id="result"><h2 id="rt"></h2><p id="rx"></p><button id="retry">最初から潜入</button></div></main><script>(()=>{const N=7,map=document.getElementById('map'),res=document.getElementById('result');let lv,p,guards,walls,alert;function build(){p={x:0,y:6};alert=0;walls=[];for(let i=0;i<5+lv;i++){let q={x:1+Math.floor(Math.random()*5),y:1+Math.floor(Math.random()*5)};if(!walls.some(w=>w.x===q.x&&w.y===q.y))walls.push(q)}guards=Array.from({length:1+Math.floor(lv/2)},(_,i)=>({x:1+((i*2+lv)%5),y:(i*3+lv)%6,d:i%2?1:-1}));render()}function key(x,y){return walls.some(w=>w.x===x&&w.y===y)}function visible(x,y){return guards.some(g=>{for(let k=0;k<3;k++){let xx=g.x+g.d*k;if(key(xx,g.y))break;if(xx===x&&g.y===y)return true}return false})}function render(){map.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){let d=document.createElement('div');d.className='tile';if(key(x,y))d.classList.add('wall');if(x===6&&y===0)d.classList.add('goal');if(visible(x,y))d.classList.add('seen');if(p.x===x&&p.y===y)d.textContent='🕵️';else{let g=guards.find(g=>g.x===x&&g.y===y);d.textContent=g?'👁️':key(x,y)?'▦':x===6&&y===0?'🚪':''}map.appendChild(d)}document.getElementById('lv').textContent=lv;document.getElementById('al').textContent=alert}function move(dx,dy){let nx=Math.max(0,Math.min(6,p.x+dx)),ny=Math.max(0,Math.min(6,p.y+dy));if(key(nx,ny))return;p={x:nx,y:ny};guards.forEach(g=>{let nx=g.x+g.d;if(nx<0||nx>6||key(nx,g.y)){g.d*=-1;nx=g.x+g.d}g.x=nx});if(visible(p.x,p.y)){alert++;if(alert>=3)return end(false)}if(p.x===6&&p.y===0){lv++;if(lv>8)return end(true);build();return}render()}function end(win){document.getElementById('rt').textContent=win?'潜入完了！':'発見された！';document.getElementById('rx').textContent=`到達 STAGE ${Math.min(lv,8)}。赤い視線マスに入らないルートを読むのがコツ。`;res.classList.add('on')}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(...b.dataset.d.split(',').map(Number)));document.getElementById('retry').onclick=()=>{lv=1;res.classList.remove('on');build()};lv=1;build()})()</script></body></html>
