<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>SHADOW DEPOT</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#060a0f;color:#eef7ff;font-family:system-ui,-apple-system,sans-serif}.app{min-height:100vh;max-width:520px;margin:auto;padding:14px 14px 92px;background:radial-gradient(circle at 50% -10%,#203549,#09111a 45%,#030609)}h1{font-size:30px;margin:4px 0}.tag{font-size:11px;font-weight:900;letter-spacing:.15em;color:#82c8ff}.sub{margin:0 0 10px;color:#aebdca;font-size:13px}.panel{padding:12px;border-radius:22px;background:#0b141ddd;border:1px solid #ffffff1d;box-shadow:0 22px 60px #0009}.hud{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.pill{padding:6px 9px;border-radius:999px;background:#ffffff0d;font-size:12px;font-weight:900}.map{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px;border-radius:18px;background:#02070b;box-shadow:inset 0 0 32px #000}.tile{position:relative;aspect-ratio:1;border-radius:8px;background:linear-gradient(145deg,#152434,#0c1722);display:grid;place-items:center;font-size:22px;overflow:hidden}.tile:after{content:"";position:absolute;inset:0;border:1px solid #ffffff08;border-radius:8px}.wall{background:linear-gradient(145deg,#41505c,#202a32)}.seen{background:linear-gradient(145deg,#6e1d2b,#351018);box-shadow:inset 0 0 14px #ff334455}.goal{background:linear-gradient(145deg,#1d654e,#123529);box-shadow:0 0 14px #43f0a044}.hide{background:linear-gradient(145deg,#20213a,#101121)}.player{filter:drop-shadow(0 0 6px #72d5ff)}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.btn{min-height:54px;border:0;border-radius:15px;color:#fff;font-weight:950;font-size:17px;background:linear-gradient(135deg,#216aaa,#563ec2);touch-action:manipulation}.btn.alt{background:linear-gradient(135deg,#374451,#1d2832)}.btn:active{transform:scale(.98)}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.wide{grid-column:1/4}.msg{margin:9px 0 0;padding:10px;border-radius:14px;background:#ffffff0c;color:#cfdae4;font-size:13px;min-height:42px}.result{display:none;margin-top:12px;padding:18px;border-radius:20px;background:#101c26}.result.on{display:block}</style></head><body><main class="app"><div class="tag">STEALTH ACTION · 8 STAGES</div><h1>SHADOW DEPOT</h1><p class="sub">赤い視線を読み、遮蔽物と暗がりを使って出口へ。1手ごとに警備員も動く。</p><section class="panel"><div class="hud"><span class="pill">STAGE <b id="lv">1</b>/8</span><span class="pill">ALERT <b id="al">0</b>/3</span><span class="pill">SMOKE <b id="smoke">2</b></span></div><div class="map" id="map"></div><div class="controls"><button class="btn up" data-d="0,-1">▲</button><button class="btn left" data-d="-1,0">◀</button><button class="btn down" data-d="0,1">▼</button><button class="btn right" data-d="1,0">▶</button><button class="btn alt wide" id="smokeBtn">💨 スモーク：次の1手は視線を無効化</button></div><p class="msg" id="msg">出口 🚪 まで赤いマスを避けて進もう。</p></section><section class="result" id="result"><h2 id="rt"></h2><p id="rx"></p><button class="btn" id="retry">最初から潜入</button></section></main><script>(()=>{const N=7,map=document.getElementById('map'),res=document.getElementById('result'),el=id=>document.getElementById(id);let lv,p,guards,walls,hides,alert,smoke,smoked;const layouts=[[[2,5],[2,4],[4,4],[4,3]],[[1,4],[2,4],[4,5],[5,3]],[[1,5],[3,5],[3,3],[5,2]],[[2,5],[2,3],[4,4],[5,4]],[[1,3],[2,3],[4,5],[4,2]],[[2,5],[3,4],[5,4],[5,2]],[[1,5],[2,2],[4,4],[5,3]],[[1,4],[3,5],[3,2],[5,4]]];function key(x,y){return walls.some(w=>w.x===x&&w.y===y)}function makeStage(){p={x:0,y:6};alert=0;smoke=2;smoked=false;walls=layouts[lv-1].map(([x,y])=>({x,y}));hides=[{x:(lv*2)%6+1,y:(lv*3)%5+1}].filter(q=>!key(q.x,q.y));guards=Array.from({length:1+Math.floor((lv-1)/2)},(_,i)=>({x:2+((i*2+lv)%4),y:(i*2+lv)%6,d:i%2?1:-1}));msg.textContent='出口 🚪 まで赤いマスを避けて進もう。';render()}function visible(x,y){if(smoked)return false;return guards.some(g=>{for(let k=0;k<4;k++){let xx=g.x+g.d*k;if(xx<0||xx>=N||key(xx,g.y))break;if(xx===x&&g.y===y)return true}return false})}function render(){map.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){let d=document.createElement('div');d.className='tile';if(key(x,y))d.classList.add('wall');if(hides.some(h=>h.x===x&&h.y===y))d.classList.add('hide');if(x===6&&y===0)d.classList.add('goal');if(visible(x,y))d.classList.add('seen');if(p.x===x&&p.y===y){d.textContent='🕵️';d.classList.add('player')}else{let g=guards.find(g=>g.x===x&&g.y===y);d.textContent=g?'🔦':key(x,y)?'▦':hides.some(h=>h.x===x&&h.y===y)?'🌑':x===6&&y===0?'🚪':''}map.appendChild(d)}el('lv').textContent=lv;el('al').textContent=alert;el('smoke').textContent=smoke}function patrol(){guards.forEach(g=>{let nx=g.x+g.d;if(nx<0||nx>=N||key(nx,g.y)){g.d*=-1;nx=g.x+g.d}g.x=nx})}function move(dx,dy){let nx=Math.max(0,Math.min(6,p.x+dx)),ny=Math.max(0,Math.min(6,p.y+dy));if(key(nx,ny)){msg.textContent='壁だ。別ルートを探そう。';return}p={x:nx,y:ny};patrol();let hidden=hides.some(h=>h.x===p.x&&h.y===p.y);if(!hidden&&visible(p.x,p.y)){alert++;msg.textContent='見つかった！ ALERT +1';if(alert>=3)return end(false)}else msg.textContent=hidden?'暗がりで視線をやり過ごした。':'クリア。次の1手を読む。';smoked=false;if(p.x===6&&p.y===0){lv++;if(lv>8)return end(true);makeStage();return}render()}function useSmoke(){if(smoke<=0){msg.textContent='スモークは残っていない。';return}smoke--;smoked=true;msg.textContent='視界を遮断。次の1手は安全。';render()}function end(win){rt.textContent=win?'潜入完了！':'発見された！';rx.textContent=win?'8区画を突破。視線・遮蔽物・スモークを使い切った。':`STAGE ${lv} で警報3。赤マスが動く前提でルートを組もう。`;res.classList.add('on')}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(...b.dataset.d.split(',').map(Number)));smokeBtn.onclick=useSmoke;retry.onclick=()=>{lv=1;res.classList.remove('on');makeStage()};lv=1;makeStage()})()</script></body></html>
