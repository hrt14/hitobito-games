<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>やる気点火</title><style>body{margin:0;background:#0f172a;color:white;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.g{width:min(92vw,470px);text-align:center}.orb{width:210px;height:210px;margin:22px auto;border-radius:50%;background:#1e293b;display:grid;place-items:center;font-size:64px;box-shadow:0 0 0 10px #334155 inset;transition:.15s}button{width:100%;padding:18px;border:0;border-radius:16px;background:#f97316;color:white;font-size:20px;font-weight:900}#meter{height:18px;background:#334155;border-radius:12px;overflow:hidden}#fill{height:100%;width:0;background:#fb923c;transition:.2s}</style><main class="g"><h1>やる気点火</h1><p>迷っている暇は3秒。表示された最小行動を即タップして火を育てろ。</p><div id="meter"><div id="fill"></div></div><div class="orb" id="orb">·</div><h2 id="task">準備中</h2><button id="go">やる</button><p id="msg"></p></main><script>const tasks=['立つ','水を一口飲む','机の上を1個だけ片付ける','ファイルを1つ開く','30秒だけ始める'];let i=0,left=3,timer,done=false;const q=s=>document.querySelector(s);function next(){if(i>=tasks.length){done=true;q('#orb').textContent='🔥';q('#task').textContent='点火完了';q('#msg').textContent='やる気を待たずに5回動いた。';q('#go').textContent='もう一度';return}left=3;q('#task').textContent=tasks[i];q('#msg').textContent='3秒以内にタップ';clearInterval(timer);timer=setInterval(()=>{left--;q('#msg').textContent=`あと${left}秒`;if(left<=0){clearInterval(timer);q('#msg').textContent='火が消えた…もう一度この行動から';}},1000)}q('#go').onclick=()=>{if(done)return location.reload();if(left<=0)return next();clearInterval(timer);i++;q('#fill').style.width=(i*20)+'%';q('#orb').textContent=['·','✦','🔥','🔥','🔥','🔥'][i];q('#msg').textContent='即行動！';setTimeout(next,350)};next();</script>
