<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OneShotGames app icon</title>
  <desc id="desc">Blue and purple game icon with an O-shaped controller, play mark, and spark.</desc>
  <defs>
    <linearGradient id="bg" x1="42" y1="26" x2="470" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15d9ff"/>
      <stop offset="0.48" stop-color="#0877ff"/>
      <stop offset="1" stop-color="#8a16ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(112 92) rotate(45) scale(360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67edff" stop-opacity=".58"/>
      <stop offset="1" stop-color="#67edff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="control" x1="138" y1="342" x2="382" y2="422" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1739ef"/>
      <stop offset="1" stop-color="#6118f4"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#061970" flood-opacity=".24"/>
    </filter>
  </defs>

  <!-- Full-bleed background so iOS can apply its own icon mask cleanly. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <path d="M0 356C108 446 262 476 512 420V512H0Z" fill="#2a38ff" opacity=".20"/>

  <g filter="url(#softShadow)">
    <!-- O / controller ring -->
    <circle cx="252" cy="260" r="143" fill="none" stroke="#fff" stroke-width="68" stroke-linecap="round"/>

    <!-- Play -->
    <path d="M218 190c0-14 15-23 27-15l112 73c11 7 11 23 0 30l-112 72c-12 8-27-1-27-15Z" fill="#fff"/>

    <!-- Controller controls integrated into the lower ring -->
    <g fill="url(#control)">
      <rect x="145" y="365" width="58" height="18" rx="7"/>
      <rect x="165" y="345" width="18" height="58" rx="7"/>
      <circle cx="329" cy="364" r="11"/>
      <circle cx="357" cy="382" r="11"/>
      <circle cx="329" cy="400" r="11"/>
      <circle cx="301" cy="382" r="11"/>
    </g>

    <!-- One-shot spark / creation cue -->
    <path d="M387 153 414 92l12 38 39 11-38 13-12 39-13-38Z" fill="#fff"/>
    <path d="m348 184 54-35-36 54Z" fill="#fff"/>
  </g>
</svg>
