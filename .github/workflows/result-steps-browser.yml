name: Result steps browser playtest

on:
  pull_request:
    paths:
      - 'apps/result-steps/**'
      - 'scripts/register-result-steps-meta.mjs'
      - 'scripts/inject-result-steps-card.mjs'
      - 'scripts/inject-result-steps-book-card.mjs'
      - 'package.json'
      - '.github/workflows/result-steps-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/result-steps/**'
      - 'scripts/register-result-steps-meta.mjs'
      - 'scripts/inject-result-steps-card.mjs'
      - 'scripts/inject-result-steps-book-card.mjs'
      - 'package.json'
      - '.github/workflows/result-steps-browser.yml'
  workflow_dispatch:

jobs:
  mobile-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: node --check apps/result-steps/app.js
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/result-steps-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/apps/result-steps/?test=1' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/result-steps-server.log
          exit 1
      - name: Run real mobile playtest
        env:
          RESULT_STEPS_URL: http://127.0.0.1:4173/apps/result-steps/?test=1
        run: node apps/result-steps/smoke-browser.mjs
      - name: Run LEVEL UP quality gate
        run: node scripts/validate-levelup-quality-gate.mjs --app apps/result-steps
      - name: Build Firebase bundle
        run: npm run build:firebase
      - name: Verify app in Firebase output
        run: |
          test -f .dist/firebase/apps/result-steps/index.html
          grep -q 'result-steps' .dist/firebase/levelup-catalog.json
          grep -q 'data-game="result-steps"' .dist/firebase/index.html
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-steps-browser-playtest
          path: apps/result-steps/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Server log on failure
        if: failure()
        run: cat /tmp/result-steps-server.log || true
