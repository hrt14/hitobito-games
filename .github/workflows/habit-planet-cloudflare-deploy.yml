name: Habit Planet Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply remote D1 migrations before deploy"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: habit-planet-cloudflare
    defaults:
      run:
        working-directory: standalone/habit-planet
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require Cloudflare deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Apply remote D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply habit-planet --remote --config wrangler.jsonc

      - name: Deploy Habit Planet Worker
        run: npx wrangler deploy --config wrangler.jsonc
