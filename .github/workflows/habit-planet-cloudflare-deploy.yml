name: Habit Planet Cloudflare Deploy

on:
  push:
    branches: [feat/habit-planet-cloudflare]
    paths:
      - '.github/workflows/habit-planet-cloudflare-deploy.yml'
      - 'standalone/habit-planet/**'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply remote D1 migrations before deploy"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: habit-planet-cloudflare
    defaults:
      run:
        working-directory: standalone/habit-planet
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HABIT_PLANET_URL: https://habit-planet.hiratamanabu14.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require Cloudflare deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check Stripe secret names
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.jsonc > /tmp/hp-secrets.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/hp-secrets.json', 'utf8');
          let names = [];
          try {
            const parsed = JSON.parse(raw);
            names = Array.isArray(parsed) ? parsed.map(x => x?.name).filter(Boolean) : [];
          } catch {
            names = [...raw.matchAll(/\b(?:STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET)\b/g)].map(m => m[0]);
          }
          for (const name of ['STRIPE_SECRET_KEY', 'STRIPE_WEBHOOK_SECRET']) {
            console.log(`${name}: ${names.includes(name) ? 'PRESENT' : 'MISSING'}`);
          }
          NODE

      - name: Diagnose D1 billing sync
        run: |
          set -euo pipefail
          echo "Entitlement row count:"
          npx wrangler d1 execute habit-planet --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS entitlement_count FROM entitlements;"
          echo "Stripe event counts:"
          npx wrangler d1 execute habit-planet --remote --config wrangler.jsonc --command "SELECT event_type, COUNT(*) AS event_count FROM stripe_events GROUP BY event_type ORDER BY event_type;"

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Apply remote D1 migrations
        if: ${{ github.event_name == 'push' || inputs.apply_migrations }}
        run: npx wrangler d1 migrations apply habit-planet --remote --config wrangler.jsonc

      - name: Deploy Habit Planet Worker
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed app and auth guards
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl -fsS -D /tmp/hp-index-headers.txt "$HABIT_PLANET_URL/" -o /tmp/hp-index.html; then break; fi
            sleep 2
          done
          grep -q "Habit Planet" /tmp/hp-index.html
          tr -d '\r' </tmp/hp-index-headers.txt >/tmp/hp-index-headers-normalized.txt
          grep -Eiq '^content-security-policy:.*frame-ancestors' /tmp/hp-index-headers-normalized.txt
          grep -Eiq '^x-frame-options: *DENY' /tmp/hp-index-headers-normalized.txt
          grep -Eiq '^x-content-type-options: *nosniff' /tmp/hp-index-headers-normalized.txt
          test "$(curl -sS -o /tmp/hp-state.json -w '%{http_code}' "$HABIT_PLANET_URL/api/state")" = "401"
          test "$(curl -sS -o /tmp/hp-entitlement.json -w '%{http_code}' "$HABIT_PLANET_URL/api/entitlement")" = "401"
          test "$(curl -sS -o /tmp/hp-checkout.json -w '%{http_code}' -X POST "$HABIT_PLANET_URL/api/checkout")" = "401"
          echo "Habit Planet deployed smoke test: OK"
