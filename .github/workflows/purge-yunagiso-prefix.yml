name: Remove Yunagiso from old HTTPS URL

on:
  push:
    branches:
      - main
    paths:
      - .purge-yunagiso-prefix

permissions:
  contents: write
  deployments: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build current Cloudflare bundle
        run: npm run build:hosting

      - name: Install explicit old-URL tombstone
        run: |
          cp 404.html .dist/cloudflare/404.html
          mkdir -p .dist/cloudflare/apps/yunagiso
          cp 404.html .dist/cloudflare/apps/yunagiso/index.html
          test ! -e apps/yunagiso/index.html
          grep -q 'このゲームはありません' .dist/cloudflare/apps/yunagiso/index.html

      - name: Deploy bundle with Yunagiso tombstone
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .dist/cloudflare --project-name=hitobito-games-normal
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact old HTTPS URL
        run: |
          set -euo pipefail
          URL="https://play.hitobito.jp/apps/yunagiso/"
          CODE="$(curl -sS -L -H 'Cache-Control: no-cache' -o /tmp/yunagiso.html -w '%{http_code}' "$URL")"
          OLD=no
          grep -q '夕凪荘' /tmp/yunagiso.html && OLD=yes || true
          TOMBSTONE=no
          grep -q 'このゲームはありません' /tmp/yunagiso.html && TOMBSTONE=yes || true
          mkdir -p ops
          {
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "url=$URL"
            echo "http_code=$CODE"
            echo "contains_yunagiso=$OLD"
            echo "contains_tombstone=$TOMBSTONE"
          } > ops/yunagiso-purge-latest.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ops/yunagiso-purge-latest.txt
          git commit -m "Record Yunagiso tombstone verification" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
          test "$OLD" = no
          test "$TOMBSTONE" = yes
