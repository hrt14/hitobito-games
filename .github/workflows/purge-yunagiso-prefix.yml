name: Purge Yunagiso HTTPS cache

on:
  push:
    branches:
      - main
    paths:
      - .purge-yunagiso-prefix

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge Yunagiso prefix from Cloudflare
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONES="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=hitobito.jp")"
          ZONE_ID="$(printf '%s' "$ZONES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result||!j.result[0]){console.error(JSON.stringify(j.errors||j));process.exit(1)};process.stdout.write(j.result[0].id)})")"
          PURGE="$(curl -sS -X POST -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" --data '{"prefixes":["play.hitobito.jp/apps/yunagiso"]}')"
          printf '%s' "$PURGE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors||j));process.exit(1)};console.log('Cloudflare prefix purge succeeded:',j.result?.id||'ok')})"

      - name: Verify HTTPS no longer serves Yunagiso
        run: |
          set -euo pipefail
          URL="https://play.hitobito.jp/apps/yunagiso/?purgecheck=$(date +%s)"
          CODE="$(curl -sS -L -o /tmp/yunagiso.html -w '%{http_code}' "$URL")"
          echo "HTTP=$CODE"
          if grep -q '夕凪荘' /tmp/yunagiso.html; then
            echo 'Yunagiso content is still being served over HTTPS.'
            exit 1
          fi
          echo 'Yunagiso content is not present in HTTPS response.'
