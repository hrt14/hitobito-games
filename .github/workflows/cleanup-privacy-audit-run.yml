name: Cleanup privacy audit run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-privacy-audit-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded privacy audit run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/32038391453"
