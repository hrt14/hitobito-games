name: Deploy normal games to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .deploy-trigger
      - 'apps/**'
      - 'index.html'
      - 'scripts/playtest-catalog.mjs'
      - 'scripts/sync-games-portal.mjs'
      - 'scripts/inject-play-top-nav.mjs'
      - 'scripts/validate-play-fun-gate.mjs'
      - 'docs/PLAY_FUN_FIRST.md'
      - 'deploy-targets.json'

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  deploy:
    name: Deploy normal games
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce PLAY FUN gate before production deploy
        if: github.event_name == 'push'
        run: >-
          node scripts/validate-play-fun-gate.mjs
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"

      - name: Sync Play portal newest-first
        run: node scripts/sync-games-portal.mjs

      - name: Build hosting bundles
        run: npm run build:hosting

      - name: Inject Play hamburger navigation
        run: node scripts/inject-play-top-nav.mjs

      - name: Install explicit 404 page
        run: cp 404.html .dist/cloudflare/404.html

      - name: Verify protected games are excluded
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('.dist/cloudflare/manifest.json','utf8'));const slugs=new Set(m.games.map(g=>g.slug));for(const blocked of ['404-kaiki','astral-dawn','oceans-of-earth']){if(slugs.has(blocked)){throw new Error(blocked+' must not be deployed to Cloudflare');}}console.log('Cloudflare bundle verified:',m.games.length,'games');"
          test ! -e .dist/cloudflare/apps/yunagiso/index.html
          test -e .dist/cloudflare/404.html
          grep -q 'id="hitobito-play-nav"' .dist/cloudflare/index.html

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .dist/cloudflare --project-name=hitobito-games-normal
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Play hamburger navigation live
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 12); do
            BODY="$(curl -fsSL --max-time 15 "https://play.hitobito.jp/?_verify=${GITHUB_SHA}-${ATTEMPT}" || true)"
            if [[ "$BODY" == *'id="hitobito-play-nav"'* ]] \
              && [[ "$BODY" == *'https://levelup.hitobito.jp/'* ]] \
              && [[ "$BODY" == *'https://hitobito.jp/'* ]]; then
              echo "Verified live Play hamburger navigation on attempt ${ATTEMPT}."
              exit 0
            fi
            echo "Attempt ${ATTEMPT}: fetched ${#BODY} bytes; navigation not confirmed yet."
            sleep 5
          done
          echo "Play hamburger navigation was not visible on the live custom domain." >&2
          exit 1

      - name: Purge stale Yunagiso cache if permitted
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONES="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=hitobito.jp")"
          ZONE_ID="$(printf '%s' "$ZONES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.success&&j.result&&j.result[0]?j.result[0].id:'')})")"
          if [ -z "$ZONE_ID" ]; then
            echo "Zone lookup unavailable with current token; skipping explicit purge."
            exit 0
          fi
          PURGE="$(curl -sS -X POST -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" --data '{"files":["https://play.hitobito.jp/apps/yunagiso/","https://play.hitobito.jp/apps/yunagiso/index.html","https://play.hitobito.jp/apps/yunagiso/app.js","https://play.hitobito.jp/apps/yunagiso/style.css"]}')"
          printf '%s' "$PURGE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)};console.log('Purged Yunagiso URLs from Cloudflare cache')})"

      - name: Ensure public game custom domains
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/hitobito-games-normal/domains"
          for DOMAIN in play.hitobito.jp games.hitobito.jp; do
            CURRENT="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "${BASE}/${DOMAIN}")"
            if printf '%s' "$CURRENT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.exit(j.success&&j.result&&j.result.name?0:1)})"; then
              printf '%s' "$CURRENT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log('Custom domain already registered:',j.result.name,'status=',j.result.status)})"
            else
              CREATED="$(curl -sS -X POST -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "${BASE}" --data "{\"name\":\"${DOMAIN}\"}")"
              printf '%s' "$CREATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)};console.log('Custom domain registered:',j.result.name,'status=',j.result.status)})"
            fi
          done

      - name: Point games.hitobito.jp to Cloudflare Pages
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ZONES="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=hitobito.jp")"
          ZONE_ID="$(printf '%s' "$ZONES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.success&&j.result&&j.result[0]?j.result[0].id:'')})")"
          if [ -z "$ZONE_ID" ]; then
            echo "Could not resolve Cloudflare zone for hitobito.jp; leaving games.hitobito.jp DNS unchanged."
            exit 1
          fi

          RECORDS="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?name=games.hitobito.jp")"
          RECORD_ID="$(printf '%s' "$RECORDS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(j.success&&j.result&&j.result[0]?j.result[0].id:'')})")"
          PAYLOAD='{"type":"CNAME","name":"games.hitobito.jp","content":"hitobito-games-normal.pages.dev","ttl":1,"proxied":true}'

          if [ -n "$RECORD_ID" ]; then
            RESULT="$(curl -sS -X PUT -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}" --data "$PAYLOAD")"
          else
            RESULT="$(curl -sS -X POST -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" --data "$PAYLOAD")"
          fi

          printf '%s' "$RESULT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)};console.log('games.hitobito.jp DNS now points to',j.result.content,'proxied=',j.result.proxied)})"

      - name: Report Cloudflare entrypoint deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="Cloudflare Pages deployed and play.hitobito.jp verified"
          else
            STATE="failure"
            DESCRIPTION="Cloudflare Pages deployment or live verification failed"
          fi
          PAYLOAD="$(STATE="$STATE" DESCRIPTION="$DESCRIPTION" node -e "process.stdout.write(JSON.stringify({state:process.env.STATE,target_url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,description:process.env.DESCRIPTION,context:'Cloudflare Pages - games entrypoint'}))")"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$PAYLOAD"
