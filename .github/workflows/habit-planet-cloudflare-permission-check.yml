name: Habit Planet Cloudflare Permission Check

on:
  push:
    branches: [feat/habit-planet-cloudflare]
    paths:
      - '.github/workflows/habit-planet-cloudflare-permission-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone/habit-planet
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require existing Cloudflare secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Existing Cloudflare secrets are present."
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Show token identity and permissions
        run: npx wrangler whoami
      - name: Check D1 access against Habit Planet database
        run: npx wrangler d1 execute habit-planet --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" --config wrangler.jsonc
      - name: Check Workers API access without deploying
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")"
          printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(j.errors);process.exit(1)};console.log('Workers API access: OK; scripts visible:',Array.isArray(j.result)?j.result.length:0)})"
