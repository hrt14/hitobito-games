name: Habit Planet Cloudflare Permission Check

on:
  push:
    branches: [feat/habit-planet-cloudflare]
    paths:
      - '.github/workflows/habit-planet-cloudflare-permission-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone/habit-planet
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require existing Cloudflare secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Existing Cloudflare secrets are present."
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Token identity check (informational)
        continue-on-error: true
        run: npx wrangler whoami
      - name: Prove D1 write access with reversible probe
        run: |
          set -euo pipefail
          npx wrangler d1 execute habit-planet --remote --command "CREATE TABLE IF NOT EXISTS __hp_permission_probe (id INTEGER); DROP TABLE __hp_permission_probe;" --config wrangler.jsonc
          npx wrangler d1 execute habit-planet --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" --config wrangler.jsonc
      - name: Prove Workers Scripts write access with temporary worker
        run: |
          set -euo pipefail
          PROBE="habit-planet-permission-probe-${GITHUB_RUN_ID}"
          printf '%s\n' 'export default { async fetch(){ return new Response("ok") } };' > /tmp/hp-probe.js
          cleanup() {
            curl -sS -X DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PROBE}" >/tmp/hp-probe-delete.json || true
          }
          trap cleanup EXIT
          RESPONSE="$(curl -sS -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"index.js"};type=application/json' \
            -F 'index.js=@/tmp/hp-probe.js;type=application/javascript+module' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PROBE}")"
          printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)};console.log('Workers Scripts write access: OK')})"
          cleanup
          trap - EXIT
          printf '%s' "$(cat /tmp/hp-probe-delete.json)" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)};console.log('Temporary permission probe worker deleted.')})"
