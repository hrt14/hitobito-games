name: Habit Planet Cloudflare Permission Check

on:
  push:
    branches: [feat/habit-planet-cloudflare]
    paths:
      - '.github/workflows/habit-planet-cloudflare-permission-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone/habit-planet
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require existing Cloudflare secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Existing Cloudflare secrets are present."
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Token identity check (informational)
        continue-on-error: true
        run: npx wrangler whoami
      - name: Prove D1 write access with reversible probe
        run: |
          set -euo pipefail
          npx wrangler d1 execute habit-planet --remote --command "CREATE TABLE IF NOT EXISTS __hp_permission_probe (id INTEGER); DROP TABLE __hp_permission_probe;" --config wrangler.jsonc
          npx wrangler d1 execute habit-planet --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;" --config wrangler.jsonc
      - name: Prove Workers Scripts write access with temporary worker
        if: ${{ always() }}
        run: |
          set -euo pipefail
          PROBE="habit-planet-permission-probe-${GITHUB_RUN_ID}"
          cat > /tmp/hp-probe.js <<'JS'
          export default {
            async fetch() {
              return new Response("ok");
            }
          };
          JS
          cat > /tmp/hp-probe-wrangler.jsonc <<JSON
          {
            "name": "${PROBE}",
            "main": "./hp-probe.js",
            "compatibility_date": "2026-09-10"
          }
          JSON
          WRANGLER="$GITHUB_WORKSPACE/standalone/habit-planet/node_modules/.bin/wrangler"
          cleanup() {
            (cd /tmp && "$WRANGLER" delete --config /tmp/hp-probe-wrangler.jsonc --force) || true
          }
          trap cleanup EXIT
          (cd /tmp && "$WRANGLER" deploy --config /tmp/hp-probe-wrangler.jsonc)
          echo "Workers Scripts write access: OK"
          cleanup
          trap - EXIT
          echo "Temporary permission probe worker deleted."
