name: Deploy LEVEL UP production closed loop

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: firebase-levelup-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Bootstrap Firebase Functions IAM and private queue secret
        env:
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
          PRIVATE_REQUEST_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
        run: bash scripts/bootstrap-levelup-functions.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install root dependencies
        run: npm install

      - name: Install Functions dependencies
        run: npm install --prefix functions

      - name: Deploy Firestore rules directly via Firebase Admin SDK
        id: firestore_rules
        continue-on-error: true
        run: |
          set -o pipefail
          node functions/deploy-firestore-rules.mjs 2>&1 | tee /tmp/firestore-rules-direct.log

      - name: Prepare current LEVEL UP game sources for mobile
        run: node scripts/prepare-firebase-mobile.mjs

      - name: Build LEVEL UP bundle
        run: npm run build:firebase

      - name: Stamp exact production commit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const meta = {
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            repository: process.env.GITHUB_REPOSITORY,
            deployedAt: new Date().toISOString()
          };
          fs.writeFileSync('.dist/firebase/deploy-meta.json', JSON.stringify(meta, null, 2) + '\n');
          console.log(meta);
          NODE

      - name: Deploy Firebase Hosting
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project hitobito-levelup --non-interactive 2>&1 | tee /tmp/firebase-hosting-deploy.log

      - name: Verify exact commit and shared navigation are live
        run: |
          set -euo pipefail
          sleep 5
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            echo "Checking exact deployment SHA on $base"
            curl -fLsS --max-time 30 "$base/deploy-meta.json?sha=$GITHUB_SHA" -o /tmp/deploy-meta.json
            node - "$base" "$GITHUB_SHA" <<'NODE'
          const fs = require('fs');
          const base = process.argv[2];
          const expected = process.argv[3];
          const meta = JSON.parse(fs.readFileSync('/tmp/deploy-meta.json', 'utf8'));
          if (meta.sha !== expected) {
            throw new Error(`Production SHA mismatch on ${base}: expected ${expected}, got ${meta.sha}`);
          }
          console.log(`Production SHA verified on ${base}: ${meta.sha}`);
          NODE
            curl -fLsS --max-time 30 "$base/apps/kokkara-best/?sha=$GITHUB_SHA" -o /tmp/kokkara-best.html
            grep -F 'id="levelup-nav-fixed"' /tmp/kokkara-best.html >/dev/null
            grep -F 'id="levelup-nav-toggle"' /tmp/kokkara-best.html >/dev/null
            grep -F 'levelup-feedback-session-fallback' /tmp/kokkara-best.html >/dev/null
            grep -F 'const docId=(batchId+String(i+1).padStart(2,"0")).slice(0,40)' /tmp/kokkara-best.html >/dev/null
            curl -fLsS --max-time 30 "$base/?sha=$GITHUB_SHA" -o /tmp/levelup-home.html
            grep -F 'id="levelup-nav-fixed"' /tmp/levelup-home.html >/dev/null
            grep -F 'id="levelup-nav-toggle"' /tmp/levelup-home.html >/dev/null
            grep -F 'levelup-feedback-session-fallback' /tmp/levelup-home.html >/dev/null
            grep -F 'const docId=(batchId+String(i+1).padStart(2,"0")).slice(0,40)' /tmp/levelup-home.html >/dev/null
            echo "Navigation + lowercase-ID feedback fallback verified in live HTML on $base"
          done

      - name: Stop after Hosting when Firestore rules IAM is missing
        if: steps.firestore_rules.outcome != 'success'
        run: |
          echo "Firestore rules were not released. Hosting is live, but feedback/data writes cannot be reported healthy until IAM is fixed."
          exit 1

      - name: Prove feedback fallback can actually write from a production browser
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0
          : > /tmp/feedback-browser-smoke.log
          for attempt in $(seq 1 18); do
            echo "Browser feedback write attempt $attempt/18" | tee -a /tmp/feedback-browser-smoke.log
            if node scripts/verify-levelup-feedback-browser.mjs 2>&1 | tee -a /tmp/feedback-browser-smoke.log; then
              if grep -F 'REAL FEEDBACK WRITE VERIFIED IN BROWSER' /tmp/feedback-browser-smoke.log >/dev/null; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production browser feedback write did not succeed after rules propagation retries." | tee -a /tmp/feedback-browser-smoke.log
          exit 1

      - name: Deploy Cloud Functions
        id: functions_deploy
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only functions --project hitobito-levelup --non-interactive 2>&1 | tee /tmp/firebase-functions-deploy.log

      - name: Verify submitLevelupFeedback Function when deployed
        if: steps.functions_deploy.outcome == 'success'
        run: |
          set -euo pipefail
          url="https://asia-northeast1-hitobito-levelup.cloudfunctions.net/submitLevelupFeedback"
          code=$(curl -sS --max-time 30 -o /tmp/feedback-health.json -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://levelup.hitobito.jp' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$url")
          cat /tmp/feedback-health.json
          test "$code" = "400"
          grep -F 'INVALID_INPUT' /tmp/feedback-health.json >/dev/null
          echo "Production Function health check OK: $url returned expected 400 INVALID_INPUT"

      - name: Verify event-driven LEVEL UP queue Function
        id: queue_function
        if: steps.functions_deploy.outcome == 'success'
        run: |
          set -euo pipefail
          state=$(gcloud functions describe queueLevelupCreationRequests \
            --gen2 \
            --region=asia-northeast1 \
            --project=hitobito-levelup \
            --format='value(state)')
          echo "queueLevelupCreationRequests state=$state"
          test "$state" = "ACTIVE"
          gcloud secrets versions access latest \
            --secret=PRIVATE_REQUEST_TOKEN \
            --project=hitobito-levelup >/dev/null
          echo 'Event-driven LEVEL UP request queue Function and secret are active.'

      - name: Update production deployment status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          FIRESTORE_RULES_OUTCOME: ${{ steps.firestore_rules.outcome }}
          FUNCTIONS_OUTCOME: ${{ steps.functions_deploy.outcome }}
          QUEUE_FUNCTION_OUTCOME: ${{ steps.queue_function.outcome }}
        run: |
          set -euo pipefail
          title='LEVEL UP production deployment status'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          {
            echo "Status: **$JOB_STATUS**"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Verified production conditions:"
            echo "- Firestore security rules release: $FIRESTORE_RULES_OUTCOME"
            echo "- exact commit SHA is live on hitobito-levelup.web.app and levelup.hitobito.jp"
            echo "- production browser Firestore write smoke passed"
            echo "- Cloud Functions deploy: $FUNCTIONS_OUTCOME"
            echo "- event-driven LEVEL UP queue verification: $QUEUE_FUNCTION_OUTCOME"
            if [ "$FUNCTIONS_OUTCOME" != "success" ] || [ "$QUEUE_FUNCTION_OUTCOME" != "success" ]; then
              echo
              echo "Event-driven request processing is not healthy yet; the redundant GitHub Actions pollers remain the fallback."
              echo
              echo "### Functions deploy log tail"
              echo '```text'
              if [ -f /tmp/firebase-functions-deploy.log ]; then tail -n 160 /tmp/firebase-functions-deploy.log; else echo '(not available)'; fi
              echo '```'
            fi
          } > /tmp/production-status.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file /tmp/production-status.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/production-status.md
          fi
