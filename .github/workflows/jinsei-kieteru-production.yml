name: Verify jinsei-kieteru production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jinsei-kieteru-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Verify live LEVEL UP app
        run: |
          # Production smoke + interaction check after Firebase deployment.
          cat > .jinsei-kieteru-production-test.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox']});
          const page = await browser.newPage();
          await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
          const failed=[];
          page.on('pageerror',e=>failed.push(String(e)));
          page.on('requestfailed',req=>{
            const u=req.url();
            if(u.endsWith('/favicon.ico') || u.includes('google-analytics.com') || u.includes('googletagmanager.com')) return;
            failed.push(`${u} ${req.failure()?.errorText||''}`);
          });
          const url='https://levelup.hitobito.jp/apps/jinsei-kieteru/';
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
          if(!response || response.status()!==200) throw new Error(`production HTTP status ${response?.status()}`);
          await page.waitForSelector('#cardFree',{timeout:10000});
          const title=await page.title();
          if(!title.includes('あなたの人生、何に消えてる？')) throw new Error(`production title mismatch: ${title}`);
          const initial=await page.$eval('#cardFree',el=>el.textContent.trim());
          if(initial!=='8年4か月') throw new Error(`initial free time mismatch: ${initial}`);
          await page.$eval('#sliders input[data-key="phone"]',el=>{el.value='4';el.dispatchEvent(new Event('input',{bubbles:true}))});
          const afterPhone=await page.$eval('#cardFree',el=>el.textContent.trim());
          if(afterPhone!=='6年3か月') throw new Error(`phone slider recalculation failed: ${afterPhone}`);
          await page.$eval('#ageRange',el=>{el.value='50';el.dispatchEvent(new Event('input',{bubbles:true}))});
          const afterAge=await page.$eval('#cardFree',el=>el.textContent.trim());
          if(afterAge!=='5年0か月') throw new Error(`age recalculation failed: ${afterAge}`);
          await page.$eval('#sliders input[data-key="work"]',el=>{el.value='14';el.dispatchEvent(new Event('input',{bubbles:true}))});
          const warningVisible=await page.$eval('#warning',el=>!el.hidden);
          if(!warningVisible) throw new Error('24-hour overflow warning did not appear');
          if(failed.length) throw new Error(`production browser errors: ${failed.join(' | ')}`);
          console.log(`JINSEI-KIETERU PRODUCTION PASS: ${url} returned 200; sliders, recalculation, and overflow warning verified on mobile viewport.`);
          await browser.close();
          NODE
          node .jinsei-kieteru-production-test.mjs
          rm .jinsei-kieteru-production-test.mjs
