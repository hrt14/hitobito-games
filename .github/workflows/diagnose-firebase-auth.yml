name: Diagnose Firebase Auth configuration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-firebase-auth.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Google auth helper
        run: npm install --no-save google-auth-library

      - name: Inspect Firebase Auth configuration
        run: |
          node <<'NODE'
          const { GoogleAuth } = require('google-auth-library');

          const PROJECT = 'hitobito-levelup';
          const CUSTOM_DOMAIN = 'levelup.hitobito.jp';
          const BASE = 'https://identitytoolkit.googleapis.com/admin/v2';

          async function main() {
            const initResponse = await fetch('https://levelup.hitobito.jp/__/firebase/init.json', { cache: 'no-store' });
            const init = await initResponse.json();
            console.log('Hosting init status:', initResponse.status);
            console.log('Hosting init projectId:', init.projectId);
            console.log('Hosting init authDomain:', init.authDomain);

            if (init.apiKey) {
              const publicConfigUrl = new URL('https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig');
              publicConfigUrl.searchParams.set('key', init.apiKey);
              const publicConfigResponse = await fetch(publicConfigUrl);
              const text = await publicConfigResponse.text();
              let publicConfig = null;
              try { publicConfig = text ? JSON.parse(text) : {}; } catch { publicConfig = { raw: text }; }
              console.log('Public project config status:', publicConfigResponse.status);
              if (publicConfigResponse.ok) {
                const domains = Array.isArray(publicConfig.authorizedDomains) ? publicConfig.authorizedDomains : [];
                console.log('Public authorized domains:', domains.join(', '));
                console.log('Public custom domain authorized:', domains.includes(CUSTOM_DOMAIN));
                if (Array.isArray(publicConfig.idpConfig)) {
                  const google = publicConfig.idpConfig.find((item) => item.provider === 'google.com');
                  if (google) console.log('Public Google provider clientId:', google.clientId || '(none)');
                }
              } else {
                console.log('Public project config error:', JSON.stringify(publicConfig));
              }
            }

            const auth = new GoogleAuth({ scopes: ['https://www.googleapis.com/auth/cloud-platform'] });
            const client = await auth.getClient();
            const token = await client.getAccessToken();
            const accessToken = typeof token === 'string' ? token : token.token;
            const headers = { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' };

            async function api(path, init = {}) {
              const res = await fetch(BASE + path, { ...init, headers: { ...headers, ...(init.headers || {}) } });
              const text = await res.text();
              let body = null;
              try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
              return { res, body };
            }

            const configResult = await api(`/projects/${PROJECT}/config`);
            console.log('Admin auth config status:', configResult.res.status);
            if (!configResult.res.ok) console.log('Admin auth config read error:', JSON.stringify(configResult.body));

            const googleResult = await api(`/projects/${PROJECT}/defaultSupportedIdpConfigs/google.com`);
            console.log('Admin Google provider status:', googleResult.res.status);
            if (!googleResult.res.ok) console.log('Admin Google provider read error:', JSON.stringify(googleResult.body));

            for (const url of [
              'https://levelup.hitobito.jp/__/auth/handler',
              'https://hitobito-levelup.firebaseapp.com/__/auth/handler',
            ]) {
              try {
                const res = await fetch(url, { redirect: 'manual' });
                console.log('HTTP', res.status, url, 'content-type=' + (res.headers.get('content-type') || ''));
              } catch (error) {
                console.log('HTTP ERROR', url, error && error.message ? error.message : String(error));
              }
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
