name: Diagnose Firebase Auth configuration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-firebase-auth.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Google auth helper
        run: npm install --no-save google-auth-library

      - name: Inspect and initialize Firebase Auth configuration
        run: |
          node <<'NODE'
          const { GoogleAuth } = require('google-auth-library');

          const PROJECT = 'hitobito-levelup';
          const CUSTOM_DOMAIN = 'levelup.hitobito.jp';
          const ADMIN_BASE = 'https://identitytoolkit.googleapis.com/admin/v2';
          const V2_BASE = 'https://identitytoolkit.googleapis.com/v2';

          async function main() {
            const hostingInitResponse = await fetch('https://levelup.hitobito.jp/__/firebase/init.json', { cache: 'no-store' });
            const hostingInit = await hostingInitResponse.json();
            console.log('Hosting init status:', hostingInitResponse.status);
            console.log('Hosting init projectId:', hostingInit.projectId);
            console.log('Hosting init authDomain:', hostingInit.authDomain);

            async function readPublicConfig(label) {
              if (!hostingInit.apiKey) {
                console.log(label + ' public project config: no API key');
                return null;
              }
              const url = new URL('https://www.googleapis.com/identitytoolkit/v3/relyingparty/getProjectConfig');
              url.searchParams.set('key', hostingInit.apiKey);
              const response = await fetch(url);
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
              console.log(label + ' public project config status:', response.status);
              if (response.ok) {
                const domains = Array.isArray(body.authorizedDomains) ? body.authorizedDomains : [];
                console.log(label + ' public authorized domains:', domains.join(', '));
                console.log(label + ' public custom domain authorized:', domains.includes(CUSTOM_DOMAIN));
                if (Array.isArray(body.idpConfig)) {
                  const google = body.idpConfig.find((item) => item.provider === 'google.com');
                  console.log(label + ' public Google provider present:', Boolean(google));
                  if (google) console.log(label + ' public Google provider clientId:', google.clientId || '(none)');
                }
              } else {
                console.log(label + ' public project config error:', JSON.stringify(body));
              }
              return { response, body };
            }

            const before = await readPublicConfig('Before');

            const auth = new GoogleAuth({ scopes: ['https://www.googleapis.com/auth/cloud-platform'] });
            const client = await auth.getClient();
            const token = await client.getAccessToken();
            const accessToken = typeof token === 'string' ? token : token.token;
            const headers = { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' };

            if (!before || !before.response.ok) {
              const initAuthResponse = await fetch(`${V2_BASE}/projects/${PROJECT}/identityPlatform:initializeAuth`, {
                method: 'POST',
                headers,
                body: '{}',
              });
              const initText = await initAuthResponse.text();
              let initBody = null;
              try { initBody = initText ? JSON.parse(initText) : {}; } catch { initBody = { raw: initText }; }
              console.log('initializeAuth status:', initAuthResponse.status);
              console.log('initializeAuth response:', JSON.stringify(initBody));
            }

            await readPublicConfig('After');

            async function adminApi(path) {
              const response = await fetch(ADMIN_BASE + path, { headers });
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : {}; } catch { body = { raw: text }; }
              return { response, body };
            }

            const configResult = await adminApi(`/projects/${PROJECT}/config`);
            console.log('Admin auth config status:', configResult.response.status);
            if (!configResult.response.ok) console.log('Admin auth config read error:', JSON.stringify(configResult.body));

            const googleResult = await adminApi(`/projects/${PROJECT}/defaultSupportedIdpConfigs/google.com`);
            console.log('Admin Google provider status:', googleResult.response.status);
            if (!googleResult.response.ok) console.log('Admin Google provider read error:', JSON.stringify(googleResult.body));

            for (const url of [
              'https://levelup.hitobito.jp/__/auth/handler',
              'https://hitobito-levelup.firebaseapp.com/__/auth/handler',
            ]) {
              const response = await fetch(url, { redirect: 'manual' });
              console.log('HTTP', response.status, url, 'content-type=' + (response.headers.get('content-type') || ''));
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
