name: ten years back browser playtest

on:
  pull_request:
    paths:
      - 'apps/ten-years-back/**'
      - '.github/workflows/ten-years-back-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/ten-years-back/**'
      - '.github/workflows/ten-years-back-browser.yml'
  workflow_dispatch:

jobs:
  mobile-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check apps/ten-years-back/app.js
          node --check apps/ten-years-back/smoke-browser.mjs
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ten-years-back-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/apps/ten-years-back/' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ten-years-back-server.log
          exit 1
      - name: Run real mobile playtest
        env:
          TEN_YEARS_URL: http://127.0.0.1:4173/apps/ten-years-back/
        run: node apps/ten-years-back/smoke-browser.mjs
      - name: Run LEVEL UP quality gate when evidence report is complete
        run: |
          if grep -q 'UNVERIFIED' apps/ten-years-back/QUALITY.md; then
            echo 'Browser evidence passed; QUALITY.md still awaits this run to be recorded.'
            exit 0
          fi
          node scripts/validate-levelup-quality-gate.mjs --app apps/ten-years-back
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-years-back-browser-playtest
          path: apps/ten-years-back/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Server log on failure
        if: failure()
        run: cat /tmp/ten-years-back-server.log || true
