name: Force deploy LEVEL UP to Firebase

on:
  push:
    branches:
      - main
    paths:
      - '.firebase-force-deploy'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: firebase-levelup-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare mobile sources
        run: node scripts/prepare-firebase-mobile.mjs

      - name: Build Firebase bundle
        run: |
          set -o pipefail
          npm run build:firebase 2>&1 | tee /tmp/firebase-build.log

      - name: Assert LEVEL UP bundle
        run: |
          set -euo pipefail
          test -s .dist/firebase/apps/big-tech-interview/index.html
          grep -F '面接官は、答えを知らない。 | LEVEL UP' .dist/firebase/apps/big-tech-interview/index.html >/dev/null
          grep -F '/apps/big-tech-interview/' .dist/firebase/levelup-catalog.json >/dev/null
          grep -F 'data-game="big-tech-interview"' .dist/firebase/index.html >/dev/null
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('.dist/firebase/manifest.json', 'utf8'));
          const catalog = JSON.parse(fs.readFileSync('.dist/firebase/levelup-catalog.json', 'utf8'));
          const manifestLevelup = manifest.games.filter((g) => g.category === 'levelup');
          const catalogSlugs = new Set(catalog.games.map((g) => g.slug));
          const missing = manifestLevelup.filter((g) => !catalogSlugs.has(g.slug));
          if (missing.length) throw new Error(`Manifest LEVEL UP games missing from catalog: ${missing.map((g) => g.slug).join(', ')}`);
          console.log(`Bundle coverage OK: ${manifestLevelup.length} manifest LEVEL UP apps, ${catalog.games.length} catalog games`);
          NODE

      - name: Deploy Firebase Hosting
        run: |
          set -o pipefail
          npx --yes firebase-tools@latest deploy --only hosting --project hitobito-levelup --non-interactive 2>&1 | tee /tmp/firebase-deploy.log

      - name: Verify LEVEL UP live
        run: |
          set -euo pipefail
          sleep 5
          expected_games=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('.dist/firebase/levelup-catalog.json','utf8')).games.length)")
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            echo "Checking $base"
            curl -fLsS --max-time 30 "$base/" -o /tmp/levelup-home.html
            grep -F "${expected_games} games" /tmp/levelup-home.html >/dev/null
            grep -F 'data-game="big-tech-interview"' /tmp/levelup-home.html >/dev/null

            curl -fLsS --max-time 30 "$base/apps/big-tech-interview/" -o /tmp/big-tech-interview.html
            grep -F '面接官は、答えを知らない。 | LEVEL UP' /tmp/big-tech-interview.html >/dev/null

            node - "$base" <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const base = process.argv[2];
          const catalog = JSON.parse(fs.readFileSync('.dist/firebase/levelup-catalog.json', 'utf8'));
          for (const game of catalog.games) {
            const url = new URL(game.href, base).href;
            execFileSync('curl', ['-fLsS', '--max-time', '30', '-o', '/dev/null', url], { stdio: 'inherit' });
          }
          console.log(`Live route coverage OK: ${catalog.games.length} games on ${base}`);
          NODE
          done

      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('.dist/firebase/levelup-catalog.json','utf8')).games.length)")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Firebase deploy OK: LEVEL UP ${GITHUB_SHA::7}" \
            --body "Firebase deploy succeeded. All ${count} LEVEL UP catalog routes were checked on hitobito-levelup.web.app and levelup.hitobito.jp. BIG TECH THINKING TEST is present on the home page and its app route is live. Commit: $GITHUB_SHA"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'LEVEL UP Firebase deploy failed.'
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo '### Build log tail'
            echo '```text'
            if [ -f /tmp/firebase-build.log ]; then tail -n 160 /tmp/firebase-build.log; else echo '(build log unavailable)'; fi
            echo '```'
            echo
            echo '### Deploy log tail'
            echo '```text'
            if [ -f /tmp/firebase-deploy.log ]; then tail -n 160 /tmp/firebase-deploy.log; else echo '(deploy log unavailable)'; fi
            echo '```'
          } > /tmp/firebase-report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Firebase deploy FAILED: LEVEL UP ${GITHUB_SHA::7}" \
            --body-file /tmp/firebase-report.md
