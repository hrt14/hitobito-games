name: Sync LEVEL UP feedback to GitHub Issues

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
      - ops/feedback-sync
    paths:
      - 'functions/sync-feedback-to-github.mjs'
      - '.github/workflows/sync-levelup-feedback.yml'
      - '.feedback-sync-trigger'

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: levelup-feedback-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Firestore access for feedback sync
        id: firestore_iam
        continue-on-error: true
        run: |
          set -o pipefail
          gcloud projects add-iam-policy-binding hitobito-levelup \
            --member='serviceAccount:github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com' \
            --role='roles/datastore.user' \
            --condition=None \
            --quiet 2>&1 | tee /tmp/levelup-feedback-iam.log

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm install --prefix functions

      - name: Sync feedback into issues
        id: sync_feedback
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
        run: |
          set -o pipefail
          node functions/sync-feedback-to-github.mjs 2>&1 | tee /tmp/levelup-feedback-sync.log

      - name: Record feedback sync status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_OUTCOME: ${{ steps.sync_feedback.outcome }}
          IAM_OUTCOME: ${{ steps.firestore_iam.outcome }}
        run: |
          set -euo pipefail
          title='LEVEL UP feedback sync status'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          {
            echo "Status: **$SYNC_OUTCOME**"
            echo "Firestore IAM repair step: **$IAM_OUTCOME**"
            echo
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Ref: \`$GITHUB_REF_NAME\`"
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo '### Firestore IAM repair log'
            echo '```text'
            if [ -f /tmp/levelup-feedback-iam.log ]; then tail -n 120 /tmp/levelup-feedback-iam.log; else echo '(IAM log unavailable)'; fi
            echo '```'
            echo
            echo '### Feedback sync log'
            echo '```text'
            if [ -f /tmp/levelup-feedback-sync.log ]; then tail -n 120 /tmp/levelup-feedback-sync.log; else echo '(sync log unavailable)'; fi
            echo '```'
          } > /tmp/feedback-sync-status.md
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file /tmp/feedback-sync-status.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/feedback-sync-status.md
          fi
