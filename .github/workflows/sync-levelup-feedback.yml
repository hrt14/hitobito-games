name: Sync LEVEL UP feedback to private queue

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
      - ops/feedback-sync
    paths:
      - 'functions/sync-feedback-to-github.mjs'
      - 'functions/run-private-feedback-sync.mjs'
      - '.github/workflows/sync-levelup-feedback.yml'
      - '.feedback-sync-trigger'

permissions:
  contents: read
  id-token: write

concurrency:
  group: levelup-feedback-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private request queue
        id: queue
        env:
          QUEUE_REPO: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QUEUE_REPO:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Private request queue configuration is missing; LEVEL UP requests cannot be processed.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::PRIVATE_REQUEST_REPOSITORY and PRIVATE_REQUEST_TOKEN are required for LEVEL UP request sync.'
            exit 1
          fi
          visibility=$(gh api "repos/$QUEUE_REPO" --jq '.private')
          if [ "$visibility" != 'true' ]; then
            echo "Refusing to sync user text: $QUEUE_REPO is not private." >&2
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo "Private request queue verified: $QUEUE_REPO" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Firestore access for feedback sync
        continue-on-error: true
        run: |
          gcloud projects add-iam-policy-binding hitobito-levelup \
            --member='serviceAccount:github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com' \
            --role='roles/datastore.user' \
            --condition=None \
            --quiet >/dev/null 2>&1 || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm install --prefix functions

      - name: Sync LEVEL UP requests into private issues
        env:
          REQUEST_QUEUE_REPOSITORY: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
        run: |
          set -o pipefail
          node functions/run-private-feedback-sync.mjs 2>&1 \
            | sed -E \
              -e 's/(Recovered session feedback [^:]+):.*/\1: [message redacted]/' \
              -e 's/(\[dry-run\] [^:]+):.*/\1: [message redacted]/'

      - name: Record privacy-safe result
        if: always()
        run: |
          echo 'LEVEL UP feedback sync finished. Raw feedback text is allowed only in the dedicated private request repository.' >> "$GITHUB_STEP_SUMMARY"

# Privacy rule: free-text LEVEL UP feedback and app requests are allowed only in the dedicated private request repository.
# The private repository is a lightweight queue only; Actions remain in this public code repository.
