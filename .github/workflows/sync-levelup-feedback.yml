name: Sync LEVEL UP feedback to private queue

on:
  workflow_dispatch:
  schedule:
    # Stagger from the independent OneShotGames poller. GitHub documents that
    # scheduled events can be delayed or dropped, so both pollers process both queues.
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches:
      - main
      - ops/feedback-sync
    paths:
      - 'functions/sync-feedback-to-github.mjs'
      - 'functions/sync-levelup-creation-requests-to-github.mjs'
      - 'functions/sync-osg-requests-to-github.mjs'
      - 'functions/run-private-feedback-sync.mjs'
      - '.github/workflows/sync-levelup-feedback.yml'
      - '.github/workflows/sync-osg-requests.yml'
      - '.feedback-sync-trigger'

permissions:
  contents: read
  id-token: write

# Shared with sync-osg-requests.yml so the two redundant pollers cannot race
# and create duplicate private queue issues.
concurrency:
  group: private-request-queue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private request queue
        id: queue
        env:
          QUEUE_REPO: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QUEUE_REPO:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Private request queue configuration is missing; requests cannot be processed.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::PRIVATE_REQUEST_REPOSITORY and PRIVATE_REQUEST_TOKEN are required for private request sync.'
            exit 1
          fi
          visibility=$(gh api "repos/$QUEUE_REPO" --jq '.private')
          if [ "$visibility" != 'true' ]; then
            echo "Refusing to sync user text: $QUEUE_REPO is not private." >&2
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo "Private request queue verified: $QUEUE_REPO" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm install --prefix functions

      - name: Sync LEVEL UP requests into private issues
        env:
          REQUEST_QUEUE_REPOSITORY: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
        run: |
          set -o pipefail
          node functions/run-private-feedback-sync.mjs 2>&1 \
            | sed -E \
              -e 's/(Recovered session feedback [^:]+):.*/\1: [message redacted]/' \
              -e 's/(\[dry-run\] [^:]+):.*/\1: [message redacted]/'

      - name: Redundant OneShotGames queue sync
        env:
          REQUEST_QUEUE_REPOSITORY: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
        run: node functions/sync-osg-requests-to-github.mjs

      - name: Record privacy-safe result
        if: always()
        run: |
          echo 'LEVEL UP and OneShotGames private request sync finished. Raw user text is allowed only in the dedicated private request repository.' >> "$GITHUB_STEP_SUMMARY"

# Firestore access is a prerequisite configured in IAM. This workflow verifies
# it by performing the real sync; it never attempts to grant itself permissions.
# Privacy rule: free-text LEVEL UP feedback and app requests are allowed only in the dedicated private request repository.
# The private repository is a lightweight queue only; Actions remain in this public code repository.
