name: Check 404 deploy temporary

on:
  push:
    paths:
      - '.github/workflows/check-404-deploy-temp.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for drain deploy then probe
        shell: bash
        run: |
          url=https://drain.hitobito.jp/404/
          for i in $(seq 1 18); do
            body=$(curl -sL --max-time 20 "$url" || true)
            if printf '%s' "$body" | grep -q '404怪異調査クラブ'; then
              echo "OK after ${i} tries"
              printf '%s' "$body" | grep -o '<title>[^<]*</title>'
              printf '%s' "$body" | wc -c | sed 's/^/bytes: /'
              for marker in 'CASE 01 をはじめる' 'id="stage"' '404調査記録' 'drawAnomaly' 'SAFE_ZONE'; do
                printf '%s' "$body" | grep -q "$marker" \
                  && echo "  found: $marker" || echo "  MISSING: $marker"
              done
              echo "--- old 404 project (expected: still stale) ---"
              curl -sL --max-time 20 https://404.hitobito.jp/ | grep -o '<title>[^<]*</title>' || true
              exit 0
            fi
            echo "try $i: not live yet"
            sleep 10
          done
          echo "TIMED OUT — not deployed within ~3 minutes"
          curl -sL -o /dev/null -w 'final status: %{http_code}\n' --max-time 20 "$url"
          exit 1
