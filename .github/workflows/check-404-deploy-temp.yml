name: Check 404 deploy temporary

on:
  push:
    paths:
      - '.github/workflows/check-404-deploy-temp.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hosts
        shell: bash
        run: |
          fetch() { curl -sL -o "$2" -w '%{http_code}' --max-time 20 "$1" || echo ERR; }
          show() {
            code=$(fetch "$1" /tmp/b)
            title=$(grep -o '<title>[^<]*</title>' /tmp/b | head -1 || true)
            printf '%-40s %s  %-9s %s\n' "$1" "$code" "$(wc -c < /tmp/b)B" "$title"
          }

          ok=0
          for i in $(seq 1 15); do
            fetch https://404.hitobito.jp/ /tmp/t >/dev/null
            if grep -q '404怪異調査クラブ' /tmp/t; then echo "404.hitobito.jp LIVE (try $i)"; ok=1; break; fi
            echo "try $i: not yet"
            sleep 10
          done

          echo "--- state (following redirects) ---"
          show https://404.hitobito.jp/
          show https://404.hitobito.jp/kaiki/
          show https://drain.hitobito.jp/
          show https://drain.hitobito.jp/kaiki/
          show https://drain.hitobito.jp/one-tsubo/

          echo "--- redirect check (no follow) ---"
          curl -s -o /dev/null -w '404 root      -> %{http_code} %{redirect_url}\n' --max-time 20 https://404.hitobito.jp/
          curl -s -o /dev/null -w 'drain root    -> %{http_code} %{redirect_url}\n' --max-time 20 https://drain.hitobito.jp/

          [ "$ok" = "1" ] || { echo "404.hitobito.jp NOT serving the game"; exit 1; }
