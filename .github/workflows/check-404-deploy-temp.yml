name: Check 404 deploy temporary

on:
  push:
    paths:
      - '.github/workflows/check-404-deploy-temp.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for drain deploy then probe
        shell: bash
        run: |
          show() {
            code=$(curl -sL -o /tmp/b -w '%{http_code}' --max-time 20 "$1" || echo ERR)
            title=$(grep -o '<title>[^<]*</title>' /tmp/b 2>/dev/null | head -1)
            size=$(wc -c < /tmp/b 2>/dev/null || echo 0)
            printf '%-42s %s  %-9s %s\n' "$1" "$code" "${size}B" "$title"
          }
          ok=0
          for i in $(seq 1 24); do
            if curl -sL --max-time 20 https://drain.hitobito.jp/kaiki/ | grep -q '404怪異調査クラブ'; then
              echo "LIVE after ${i} tries"; ok=1; break
            fi
            echo "try $i: not live yet"
            sleep 10
          done
          echo "--- state ---"
          show https://drain.hitobito.jp/kaiki/
          show https://drain.hitobito.jp/404/
          show https://drain.hitobito.jp/one-tsubo/
          show https://404.hitobito.jp/
          [ "$ok" = "1" ] || { echo "NOT DEPLOYED"; exit 1; }
          echo "--- content markers ---"
          curl -sL --max-time 20 https://drain.hitobito.jp/kaiki/ > /tmp/g
          for m in 'CASE 01 をはじめる' 'id="stage"' '404調査記録' 'drawAnomaly' 'SAFE_ZONE' 'banter'; do
            grep -q "$m" /tmp/g && echo "  ok: $m" || echo "  MISSING: $m"
          done
