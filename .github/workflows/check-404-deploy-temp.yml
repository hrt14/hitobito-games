name: Check 404 deploy temporary

on:
  push:
    paths:
      - '.github/workflows/check-404-deploy-temp.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hosts
        shell: bash
        run: |
          # curl を grep へパイプすると SIGPIPE + pipefail で誤判定するので使わない
          fetch() { curl -sL -o "$2" -w '%{http_code}' --max-time 20 "$1" || echo ERR; }
          show() {
            code=$(fetch "$1" /tmp/b)
            title=$(grep -o '<title>[^<]*</title>' /tmp/b | head -1 || true)
            printf '%-40s %s  %-9s %s\n' "$1" "$code" "$(wc -c < /tmp/b)B" "$title"
          }

          ok=0
          for i in $(seq 1 12); do
            fetch https://404.hitobito.jp/ /tmp/t >/dev/null
            if grep -q '404怪異調査クラブ' /tmp/t; then echo "404.hitobito.jp LIVE (try $i)"; ok=1; break; fi
            echo "try $i: 404.hitobito.jp not the game yet"
            sleep 10
          done

          echo "--- state ---"
          show https://404.hitobito.jp/
          show https://drain.hitobito.jp/
          show https://drain.hitobito.jp/kaiki/
          show https://drain.hitobito.jp/one-tsubo/

          if [ "$ok" = "1" ]; then
            echo "--- markers on 404.hitobito.jp ---"
            fetch https://404.hitobito.jp/ /tmp/g >/dev/null
            for m in 'CASE 01 をはじめる' 'id="stage"' '404調査記録' 'drawAnomaly' 'banter'; do
              if grep -q "$m" /tmp/g; then echo "  ok: $m"; else echo "  MISSING: $m"; fi
            done
          else
            echo "404.hitobito.jp is NOT serving the game"
            exit 1
          fi
