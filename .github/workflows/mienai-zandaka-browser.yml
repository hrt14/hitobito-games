name: 見えない残高 browser playtest

on:
  pull_request:
    paths:
      - 'apps/mienai-zandaka/**'
      - '.github/workflows/mienai-zandaka-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/mienai-zandaka/**'
      - '.github/workflows/mienai-zandaka-browser.yml'
  workflow_dispatch:

jobs:
  mobile-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check browser test syntax
        run: node --check apps/mienai-zandaka/smoke-browser.mjs
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mienai-zandaka-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/apps/mienai-zandaka/?test=1' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mienai-zandaka-server.log
          exit 1
      - name: Run real mobile playtest
        env:
          MIENAI_ZANDAKA_URL: http://127.0.0.1:4173/apps/mienai-zandaka/?test=1
        run: node apps/mienai-zandaka/smoke-browser.mjs
      - name: Enforce LEVEL UP quality gate
        run: node scripts/validate-levelup-quality-gate.mjs --app apps/mienai-zandaka
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mienai-zandaka-browser-playtest
          path: apps/mienai-zandaka/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Server log on failure
        if: failure()
        run: cat /tmp/mienai-zandaka-server.log || true
