name: Deploy LEVEL UP Functions
# IAM bootstrap retry marker: 2026-08-31T22:19+09:00

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'scripts/bootstrap-levelup-functions.sh'
      - 'firebase.json'
      - '.github/workflows/deploy-life-plus-one-ai.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Bootstrap APIs and private queue secret
        env:
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
          PRIVATE_REQUEST_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
        run: bash scripts/bootstrap-levelup-functions.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        run: npm install --prefix functions

      - name: Deploy LEVEL UP functions
        run: npx --yes firebase-tools@latest deploy --only functions:analyzeLifePlusOne,functions:submitLevelupFeedback,functions:queueLevelupCreationRequests --project hitobito-levelup --non-interactive

      - name: Verify feedback endpoint
        run: |
          set -euo pipefail
          endpoint='https://asia-northeast1-hitobito-levelup.cloudfunctions.net/submitLevelupFeedback'
          code=$(curl -sS -o /tmp/feedback-health.json -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://levelup.hitobito.jp' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$endpoint")
          test "$code" = "400"
          grep -F '"error":"INVALID_INPUT"' /tmp/feedback-health.json >/dev/null
          echo "Feedback endpoint reachable and validating input."

      - name: Verify event-driven request queue function
        run: |
          set -euo pipefail
          state=$(gcloud functions describe queueLevelupCreationRequests \
            --gen2 \
            --region=asia-northeast1 \
            --project=hitobito-levelup \
            --format='value(state)')
          echo "queueLevelupCreationRequests state=$state"
          test "$state" = 'ACTIVE'
          echo 'Event-driven LEVEL UP request queue is ACTIVE.'
