name: Verify ato-nankai production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ato-nankai-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Verify live LEVEL UP app
        run: |
          cat > .ato-nankai-production-test.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser = await puppeteer.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox']});
          const page = await browser.newPage();
          await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
          const failed=[];
          page.on('pageerror',e=>failed.push(String(e)));
          page.on('requestfailed',req=>{if(!req.url().endsWith('/favicon.ico')) failed.push(`${req.url()} ${req.failure()?.errorText||''}`)});
          const url='https://levelup.hitobito.jp/apps/ato-nankai/';
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
          if(!response || response.status()!==200) throw new Error(`production HTTP status ${response?.status()}`);
          await page.waitForSelector('#springCount',{timeout:10000});
          const title=await page.title();
          if(!title.includes('人生、あと何回？')) throw new Error(`production title mismatch: ${title}`);
          const disclaimer=await page.$eval('.hero-copy',el=>el.textContent);
          if(!disclaimer.includes('寿命の予測ではありません')) throw new Error('production disclaimer missing');
          await page.$eval('#ageRange',el=>{el.value='50';el.dispatchEvent(new Event('input',{bubbles:true}))});
          const spring=await page.$eval('#springCount',el=>el.textContent.trim());
          if(spring!=='40') throw new Error(`production interaction failed: spring=${spring}`);
          await page.click('#choiceGrid button[data-source="saturday"]');
          await page.waitForSelector('#resultSection:not([hidden])');
          const result=await page.$eval('#resultChoice',el=>el.textContent.trim());
          if(result!=='土曜日') throw new Error(`production result mismatch: ${result}`);
          if(failed.length) throw new Error(`production browser errors: ${failed.join(' | ')}`);
          console.log(`ATO-NANKAI PRODUCTION PASS: ${url} returned 200 and mobile interaction/result verified.`);
          await browser.close();
          NODE
          node .ato-nankai-production-test.mjs
          rm .ato-nankai-production-test.mjs
