name: Validate LEVEL UP guided app request loop

on:
  pull_request:
    paths:
      - 'scripts/inject-levelup-account.mjs'
      - 'scripts/inject-levelup-maker.mjs'
      - 'scripts/patch-levelup-popup-auth.mjs'
      - 'scripts/fix-levelup-feedback-session-ids.mjs'
      - 'scripts/validate-levelup-maker-only-request-flow.mjs'
      - 'functions/sync-levelup-creation-requests-to-github.mjs'
      - 'functions/complete-levelup-creation-request-from-issue.mjs'
      - 'functions/run-private-feedback-sync.mjs'
      - '.github/workflows/sync-levelup-feedback.yml'
      - '.github/workflows/complete-levelup-creation-request.yml'
      - '.github/workflows/validate-levelup-app-request.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Node syntax
        run: |
          node --check scripts/inject-levelup-account.mjs
          node --check scripts/inject-levelup-maker.mjs
          node --check scripts/patch-levelup-popup-auth.mjs
          node --check scripts/fix-levelup-feedback-session-ids.mjs
          node --check scripts/validate-levelup-maker-only-request-flow.mjs
          node --check functions/sync-levelup-creation-requests-to-github.mjs
          node --check functions/complete-levelup-creation-request-from-issue.mjs
          node --check functions/run-private-feedback-sync.mjs

      - name: Prove generated account survives auth hardening
        run: |
          rm -rf .dist/firebase
          mkdir -p .dist/firebase/apps/test-app
          printf '<!doctype html><html><head></head><body><main></main></body></html>' > .dist/firebase/index.html
          printf '<!doctype html><html><head></head><body><main></main></body></html>' > .dist/firebase/apps/test-app/index.html
          node scripts/inject-levelup-account.mjs
          node scripts/patch-levelup-popup-auth.mjs
          node --check .dist/firebase/levelup-account.js
          grep -F 'creationRequestCount' .dist/firebase/levelup-account.js
          grep -F 'data-action="created-apps"' .dist/firebase/levelup-account.js
          grep -F 'levelup:open-maker' .dist/firebase/levelup-account.js
          grep -F "fetch('/__/firebase/init.json'" .dist/firebase/levelup-account.js
          grep -F 'signInWithPopup(provider)' .dist/firebase/levelup-account.js
          grep -F "sessionStorage.removeItem('levelup-auth-redirect-pending-v5')" .dist/firebase/levelup-account.js
          grep -F '/levelup-account.js?v=' .dist/firebase/index.html
          if grep -F '/__/firebase/init.js' .dist/firebase/index.html; then
            echo 'Firebase init.js remained after popup-auth patch.' >&2
            exit 1
          fi

      - name: Prove guided maker injection
        run: |
          rm -rf .dist/firebase
          mkdir -p .dist/firebase
          printf '<!doctype html><html><head></head><body><main><section class="intro"></section></main></body></html>' > .dist/firebase/index.html
          node scripts/inject-levelup-maker.mjs
          grep -F 'data-levelup-maker' .dist/firebase/index.html
          grep -F '/levelup-maker.js?v=' .dist/firebase/index.html
          grep -F 'data-maker-fab' .dist/firebase/levelup-maker.js
          grep -F 'アプリ制作' .dist/firebase/levelup-maker.js
          grep -F '今あるLEVEL UPを使うだけでなく' .dist/firebase/levelup-maker.js
          grep -F '困りごとを、' .dist/firebase/levelup-maker.js
          grep -F 'STEP 1 / 5' .dist/firebase/levelup-maker.js
          grep -F 'この内容で制作を依頼する' .dist/firebase/levelup-maker.js
          grep -F "collection('levelupUsers')" .dist/firebase/levelup-maker.js
          grep -F 'creationRequests' .dist/firebase/levelup-maker.js
          grep -F 'levelup:open-maker' .dist/firebase/levelup-maker.js
          grep -F 'showPublicName' .dist/firebase/levelup-maker.js
          grep -F 'publicNickname' .dist/firebase/levelup-maker.js
          grep -F 'Googleアカウントの本名・メールアドレスは公開しません' .dist/firebase/levelup-maker.js
          grep -F '自分の制作アプリ' .dist/firebase/levelup-maker.js
          node --check .dist/firebase/levelup-maker.js
          node scripts/validate-levelup-maker-only-request-flow.mjs

      - name: Prove My Data opens created apps
        run: |
          grep -F 'creationRequestCount' scripts/inject-levelup-account.mjs
          grep -F 'data-action="created-apps"' scripts/inject-levelup-account.mjs
          grep -F 'levelup:open-maker' scripts/inject-levelup-account.mjs
          grep -F 'levelupView=mine' scripts/inject-levelup-account.mjs
          grep -F '自分の制作アプリ' scripts/inject-levelup-account.mjs

      - name: Prove maker stays secondary and login becomes ready
        run: |
          if grep -F 'insertBefore(host, intro.nextSibling)' .dist/firebase/levelup-maker.js; then
            echo 'Maker returned to the main home content stream.' >&2
            exit 1
          fi
          grep -F 'document.body.appendChild(host)' .dist/firebase/levelup-maker.js
          grep -F 'waitForFirebaseSdk' .dist/firebase/levelup-maker.js
          grep -F "fetch('/__/firebase/init.json'" .dist/firebase/levelup-maker.js
          grep -F 'signInWithPopup(provider)' .dist/firebase/levelup-maker.js
          grep -F 'ログイン準備完了' .dist/firebase/levelup-maker.js

      - name: Prove privacy-safe attribution reaches the private queue
        run: |
          grep -F '## 公開時の見せ方' functions/sync-levelup-creation-requests-to-github.mjs
          grep -F 'Requested by' functions/sync-levelup-creation-requests-to-github.mjs
          grep -F '依頼文をそのまま引用しない' functions/sync-levelup-creation-requests-to-github.mjs
          grep -F 'publicNickname' functions/sync-levelup-creation-requests-to-github.mjs
          grep -F '依頼者名は表示しない' functions/sync-levelup-creation-requests-to-github.mjs

      - name: Prove legacy anonymous request UI is disabled
        run: |
          if grep -F "levelup-feedback/app-request.mjs" scripts/fix-levelup-feedback-session-ids.mjs; then
            echo 'Legacy anonymous app-request widget is still imported.' >&2
            exit 1
          fi
          grep -F 'validate-levelup-maker-only-request-flow.mjs' scripts/fix-levelup-feedback-session-ids.mjs

      - name: Prove private queue and completion markers
        run: |
          grep -F 'levelup-creation-request-id:' functions/sync-levelup-creation-requests-to-github.mjs
          grep -F 'levelup-app-slug:pending' functions/sync-levelup-creation-requests-to-github.mjs
          grep -F "status: 'published'" functions/complete-levelup-creation-request-from-issue.mjs || grep -F "'published'" functions/complete-levelup-creation-request-from-issue.mjs
          grep -F 'sync-levelup-creation-requests-to-github.mjs' functions/run-private-feedback-sync.mjs
          grep -F 'inject-levelup-maker.mjs' package.json
