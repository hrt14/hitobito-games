name: Verify LEVEL UP request production

on:
  workflow_run:
    workflows:
      - 'Deploy LEVEL UP production closed loop'
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recovery-map-production-browser.yml'
  workflow_dispatch:

jobs:
  mobile-production:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for exact production pages
        run: |
          for i in $(seq 1 30); do
            recovery=$(curl -L -sS -o /tmp/recovery.html -w '%{http_code}' -H 'cache-control: no-cache' "https://levelup.hitobito.jp/apps/recovery-map/?verify=${GITHUB_RUN_ID}" || true)
            miss=$(curl -L -sS -o /tmp/miss.html -w '%{http_code}' -H 'cache-control: no-cache' "https://levelup.hitobito.jp/apps/miss-check-reflex/?verify=${GITHUB_RUN_ID}" || true)
            if [ "$recovery" = '200' ] && grep -q 'RECOVERY MAP' /tmp/recovery.html && [ "$miss" = '200' ]; then exit 0; fi
            sleep 10
          done
          echo 'Production pages did not become ready in time.'
          exit 1
      - name: Operate recovery map on production mobile width
        env:
          RECOVERY_MAP_URL: https://levelup.hitobito.jp/apps/recovery-map/?verify=production
        run: node apps/recovery-map/smoke-browser.mjs
      - name: Verify miss-check contrast on production mobile width
        env:
          MISS_CHECK_URL: https://levelup.hitobito.jp/apps/miss-check-reflex/?verify=production
        run: node apps/miss-check-reflex/contrast-browser.mjs
      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levelup-request-production-evidence
          path: |
            apps/recovery-map/.artifacts/*
            apps/miss-check-reflex/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
