name: Verify LEVEL UP app favorite menu production

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/inject-levelup-app-menu.mjs'
      - 'package.json'
      - '.firebase-deploy-trigger'
      - '.github/workflows/verify-levelup-app-menu-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: levelup-app-menu-production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify hamburger and favorite controls are live
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          bases=("https://hitobito-levelup.web.app" "https://levelup.hitobito.jp")
          ok=0
          : > /tmp/levelup-app-menu-verify.log

          for attempt in $(seq 1 36); do
            echo "Attempt $attempt/36" | tee -a /tmp/levelup-app-menu-verify.log
            attempt_ok=1
            for base in "${bases[@]}"; do
              safe=$(echo "$base" | tr -cd '[:alnum:]')
              out="/tmp/${safe}-ato5.html"
              url="$base/apps/ato-5min/?verify=${GITHUB_SHA}-${attempt}"
              echo "GET $url" | tee -a /tmp/levelup-app-menu-verify.log
              if ! curl -fLsS --max-time 30 "$url" -o "$out"; then
                echo "fetch failed: $base" | tee -a /tmp/levelup-app-menu-verify.log
                attempt_ok=0
                continue
              fi
              for needle in \
                'data-levelup-app-menu' \
                'data-game-slug="ato-5min"' \
                'お気に入りに追加' \
                'LEVEL UP トップ' \
                'ログイン・マイデータ' \
                'hitobito-levelup-favorites-v1'; do
                if ! grep -F "$needle" "$out" >/dev/null; then
                  echo "missing [$needle] on $base" | tee -a /tmp/levelup-app-menu-verify.log
                  attempt_ok=0
                fi
              done
            done
            if [ "$attempt_ok" = "1" ]; then
              ok=1
              echo "PRODUCTION FAVORITE MENU VERIFIED" | tee -a /tmp/levelup-app-menu-verify.log
              break
            fi
            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "Favorite menu did not become live within the verification window." | tee -a /tmp/levelup-app-menu-verify.log
            exit 1
          fi

      - name: Update favorite-menu production status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          title='LEVEL UP favorite menu production status'
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          {
            echo "Status: **$JOB_STATUS**"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ "$JOB_STATUS" = "success" ]; then
              echo "Verified on both production domains:"
              echo "- shared hamburger menu is present in app HTML"
              echo "- current app slug is injected"
              echo "- favorite add/remove UI is shipped"
              echo "- LEVEL UP top navigation is shipped"
              echo "- login / My Data entry is shipped"
              echo "- existing LEVEL UP favorite storage key is used"
            else
              echo "Favorite-menu production verification failed. Do not report this feature as production-complete."
            fi
            echo
            echo '```text'
            if [ -f /tmp/levelup-app-menu-verify.log ]; then tail -n 180 /tmp/levelup-app-menu-verify.log; else echo '(log unavailable)'; fi
            echo '```'
          } > /tmp/levelup-app-menu-status.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file /tmp/levelup-app-menu-status.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/levelup-app-menu-status.md
          fi
