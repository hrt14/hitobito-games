name: Energy bucket production browser verification

on:
  workflow_run:
    workflows:
      - Deploy LEVEL UP production closed loop
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - '.github/workflows/energy-bucket-production-browser.yml'
      - '.github/scripts/energy-bucket-production-cdp.mjs'

jobs:
  verify-production:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for energy-bucket route
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 20 'https://levelup.hitobito.jp/apps/energy-bucket/' | grep -F '体力の穴を1個ふさぐ' >/dev/null; then
              echo 'Production route is live.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production route did not become verifiable.' >&2
          exit 1
      - name: Start system Chrome with DevTools Protocol
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/energy-bucket-chrome about:blank >/tmp/energy-bucket-chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/energy-bucket-chrome.log
          exit 1
      - name: Run full production mobile flow
        run: node .github/scripts/energy-bucket-production-cdp.mjs
      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-bucket-production-browser-evidence
          path: apps/energy-bucket/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Chrome log on failure
        if: failure()
        run: cat /tmp/energy-bucket-chrome.log || true
