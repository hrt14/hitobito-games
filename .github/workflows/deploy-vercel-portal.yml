name: Deploy games portal to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .deploy-vercel-portal

concurrency:
  group: vercel-games-portal-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy games.hitobito.jp
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_vCUqyPcmj2xuDuBM7f7aOiMQ
      VERCEL_PROJECT_ID: prj_sFmkqzrcg91agYpI4pat0dj83uD6
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy to Vercel production
        run: npx vercel@latest deploy --prod --non-interactive
