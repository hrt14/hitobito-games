name: Habit Planet Firebase full deploy

on:
  workflow_dispatch:

concurrency:
  group: habit-planet-firebase-full
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: habit-planet-5bbc3
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate production bundle
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check public/firebase-client.js
          node --check public/app-entry.js
          grep -Fq 'maxInstances: 2' functions/index.js
          grep -Fq 'Idempotency-Key' functions/index.js
          grep -Fq 'match /{document=**}' firestore.rules

      - name: Install Functions dependencies
        working-directory: standalone/habit-planet/functions
        run: npm install --omit=dev

      - name: Deploy Firestore, Hosting, and Functions
        working-directory: standalone/habit-planet
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules,hosting,functions \
            --project habit-planet-5bbc3 \
            --config firebase.json \
            --non-interactive

      - name: Verify live static app and API routing
        run: |
          set -euo pipefail
          for i in {1..12}; do
            body="$(curl -fsS https://habit-planet-5bbc3.web.app/ || true)"
            if printf '%s' "$body" | grep -Fq '<title>Habit Planet</title>'; then
              break
            fi
            sleep 5
          done
          curl -fsSI https://habit-planet-5bbc3.web.app/ | grep -i 'x-content-type-options: nosniff'
          # User billing APIs must not accept unauthenticated POSTs.
          code="$(curl -sS -o /tmp/checkout.json -w '%{http_code}' -X POST https://habit-planet-5bbc3.web.app/api/checkout)"
          test "$code" = "401"
          grep -Fq 'Login required' /tmp/checkout.json
