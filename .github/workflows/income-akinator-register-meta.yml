name: Register Income Akinator metadata

on:
  push:
    branches:
      - feat/income-akinator
    paths:
      - '.github/workflows/income-akinator-register-meta.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/income-akinator
          fetch-depth: 0

      - name: Add LEVEL UP catalog metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/playtest-catalog.mjs')
          text = path.read_text()
          entry = "  'income-akinator': ['levelup', '職業名や年収を入力せず、「はい・いいえ」だけで仕事内容・働き方・責任範囲を絞り込み、12問以内に職業とゲーム内推定年収を当てる推理ゲーム。'],\n"
          if "'income-akinator':" not in text:
              needle = 'export const GAME_META = {\n'
              if needle not in text:
                  raise SystemExit('GAME_META declaration not found')
              text = text.replace(needle, needle + entry, 1)
              path.write_text(text)
          PY
          rm -f scripts/register-income-akinator-meta.mjs
          rm -f .github/workflows/income-akinator-register-meta.yml

      - name: Commit catalog patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/playtest-catalog.mjs scripts/register-income-akinator-meta.mjs .github/workflows/income-akinator-register-meta.yml
          if git diff --cached --quiet; then
            echo 'No metadata patch needed.'
            exit 0
          fi
          git commit -m 'Register income akinator as LEVEL UP app'
          git push origin HEAD:feat/income-akinator
