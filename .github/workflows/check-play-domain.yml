name: Check play.hitobito.jp status

on:
  push:
    branches:
      - main
    paths:
      - .check-play-domain

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Pages custom domain
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/hitobito-games-normal/domains/play.hitobito.jp"
          RESP="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "$URL")"
          printf '%s' "$RESP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)};const r=j.result||{};console.log(JSON.stringify({name:r.name,status:r.status,zone_tag:r.zone_tag||null,validation_data:r.validation_data||null,verification_data:r.verification_data||null},null,2))})"

      - name: Verify sound-clinic live route
        run: |
          set -euo pipefail
          URL="https://play.hitobito.jp/apps/sound-clinic/"
          for ATTEMPT in $(seq 1 12); do
            BODY="$(curl -fsSL --max-time 15 "${URL}?_verify=${GITHUB_SHA}-${ATTEMPT}" || true)"
            if [[ "$BODY" == *'<title>走ると、来る。｜廃診療所5分脱出ホラー</title>'* ]] \
              && [[ "$BODY" == *'id="startBtn"'* ]] \
              && [[ "$BODY" == *'ヒューズ 0 / 3'* ]]; then
              echo "Verified sound-clinic production route on attempt ${ATTEMPT}."
              exit 0
            fi
            echo "Attempt ${ATTEMPT}: fetched ${#BODY} bytes; sound-clinic markers not confirmed yet."
            sleep 5
          done
          echo "sound-clinic production route did not return the expected game markers." >&2
          exit 1

      - name: Diagnose authoritative DNS
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils >/dev/null
          echo 'NS hitobito.jp:'
          dig +short NS hitobito.jp
          echo 'CNAME games.hitobito.jp:'
          dig +short CNAME games.hitobito.jp
          echo 'CNAME play.hitobito.jp:'
          dig +short CNAME play.hitobito.jp

      - name: Report sound-clinic production status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="sound-clinic live route verified"
          else
            STATE="failure"
            DESCRIPTION="sound-clinic live route verification failed"
          fi
          PAYLOAD="$(STATE="$STATE" DESCRIPTION="$DESCRIPTION" node -e "process.stdout.write(JSON.stringify({state:process.env.STATE,target_url:'https://play.hitobito.jp/apps/sound-clinic/',description:process.env.DESCRIPTION,context:'Sound Clinic Production'}))")"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$PAYLOAD"
