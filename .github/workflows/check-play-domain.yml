name: Check play.hitobito.jp status

on:
  push:
    branches:
      - main
    paths:
      - .check-play-domain

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Pages custom domain
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/hitobito-games-normal/domains/play.hitobito.jp"
          RESP="$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "$URL")"
          printf '%s' "$RESP" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)};const r=j.result||{};console.log(JSON.stringify({name:r.name,status:r.status,zone_tag:r.zone_tag||null,validation_data:r.validation_data||null,verification_data:r.verification_data||null},null,2))})"
