name: 人生RPGステータス browser playtest

on:
  pull_request:
    paths:
      - 'apps/life-rpg-status/**'
      - '.github/workflows/life-rpg-status-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/life-rpg-status/**'
      - '.github/workflows/life-rpg-status-browser.yml'
  workflow_dispatch:

jobs:
  mobile-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('apps/life-rpg-status/index.html','utf8');
          const m=s.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('inline script missing');
          fs.writeFileSync('/tmp/life-rpg-status.js',m[1]);
          NODE
          node --check /tmp/life-rpg-status.js
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/life-rpg-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/apps/life-rpg-status/' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/life-rpg-server.log
          exit 1
      - name: Run real mobile playtest
        env:
          LIFE_RPG_URL: http://127.0.0.1:4173/apps/life-rpg-status/
        run: node apps/life-rpg-status/smoke-browser.mjs
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-rpg-status-browser-playtest
          path: apps/life-rpg-status/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Server log on failure
        if: failure()
        run: cat /tmp/life-rpg-server.log || true
