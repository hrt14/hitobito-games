name: Fix LEVEL UP back links

on:
  push:
    paths:
      - .github/workflows/fix-levelup-backlinks.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point LEVEL UP apps back to LEVEL UP home
        shell: python
        run: |
          from pathlib import Path
          import re

          levelup_url = "https://levelup.hitobito.jp/"
          slugs = [
              "3sec-action",
              "ato-5min",
              "one-thing",
              "timecraft",
              "100-turns",
              "task-separation",
              "levelup-control",
              "expect-nothing",
              "dont-change-people",
              "help-me",
              "levelup-mood",
              "mou-owatta",
              "name-it",
              "viewpoint-exam",
              "jinsei-title",
              "main-character",
              "arigatou-sagashi",
              "levelup-smalltalk",
              "watashi-zukan",
          ]

          replacements = [
              (r'href="/"', f'href="{levelup_url}"'),
              (r"href='/'", f"href='{levelup_url}'"),
              (r'href="/index\.html"', f'href="{levelup_url}"'),
              (r"href='/index\.html'", f"href='{levelup_url}'"),
              (r'href="https://games\.hitobito\.jp/?"', f'href="{levelup_url}"'),
              (r"href='https://games\.hitobito\.jp/?'", f"href='{levelup_url}'"),
              (r'(?:window\.)?location\.href\s*=\s*"/"', f'location.href="{levelup_url}"'),
              (r"(?:window\.)?location\.href\s*=\s*'/'", f"location.href='{levelup_url}'"),
              (r'(?:window\.)?location\s*=\s*"/"', f'location="{levelup_url}"'),
              (r"(?:window\.)?location\s*=\s*'/'", f"location='{levelup_url}'"),
              (r'location\.assign\(\s*"/"\s*\)', f'location.assign("{levelup_url}")'),
              (r"location\.assign\(\s*'/'\s*\)", f"location.assign('{levelup_url}')"),
              (r'location\.replace\(\s*"/"\s*\)', f'location.replace("{levelup_url}")'),
              (r"location\.replace\(\s*'/'\s*\)", f"location.replace('{levelup_url}')"),
          ]

          changed = []
          for slug in slugs:
              path = Path("apps") / slug / "index.html"
              if not path.exists():
                  print(f"skip missing: {path}")
                  continue
              before = path.read_text(encoding="utf-8")
              after = before
              for pattern, replacement in replacements:
                  after = re.sub(pattern, replacement, after)
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed.append(str(path))

          print("changed files:")
          for path in changed:
              print(path)
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No backlink changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/*/index.html
          git commit -m "Point LEVEL UP apps back to LEVEL UP home"
          git push
