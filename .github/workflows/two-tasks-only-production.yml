name: Verify two-tasks-only production

on:
  push:
    branches:
      - main
    paths:
      - '.firebase-deploy-trigger'
      - 'apps/two-tasks-only/**'
      - '.github/workflows/two-tasks-only-production.yml'
  workflow_dispatch:

jobs:
  production-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for app on both production domains
        run: |
          set -euo pipefail
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            ok=0
            for attempt in $(seq 1 36); do
              out="/tmp/two-tasks-only-${attempt}.html"
              if curl -fLsS --max-time 30 "$base/apps/two-tasks-only/?verify=${GITHUB_SHA}-${attempt}" -o "$out" \
                && grep -F '今日やるのは' "$out" >/dev/null \
                && grep -F '3つ目を入れるなら、1つ追い出す。' "$out" >/dev/null; then
                ok=1
                echo "two-tasks-only live on $base"
                break
              fi
              sleep 5
            done
            test "$ok" = "1"
          done
      - name: Run production mobile playtest on custom domain
        env:
          TWO_TASKS_ONLY_URL: https://levelup.hitobito.jp/apps/two-tasks-only/?production-smoke=${{ github.sha }}
        run: node apps/two-tasks-only/smoke-browser.mjs
      - name: Run production mobile playtest on Firebase domain
        env:
          TWO_TASKS_ONLY_URL: https://hitobito-levelup.web.app/apps/two-tasks-only/?production-smoke=${{ github.sha }}
        run: node apps/two-tasks-only/smoke-browser.mjs
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-tasks-only-production-playtest
          path: apps/two-tasks-only/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
