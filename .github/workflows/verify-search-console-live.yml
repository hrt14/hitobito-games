name: Verify Search Console markers live

on:
  push:
    paths:
      - ".github/workflows/verify-search-console-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose HTML verification file response
        run: |
          set -euo pipefail
          curl -sS -L -D /tmp/headers.txt -o /tmp/body.txt https://levelup.hitobito.jp/google4a20d374a163ef3d.html
          echo '--- headers ---'
          cat /tmp/headers.txt
          echo '--- body ---'
          cat /tmp/body.txt
          echo
          printf 'final-url: '
          curl -sS -L -o /dev/null -w '%{url_effective}\n' https://levelup.hitobito.jp/google4a20d374a163ef3d.html
          grep -Fx 'google-site-verification: google4a20d374a163ef3d.html' /tmp/body.txt

      - name: Verify meta verification tag is live
        run: |
          set -euo pipefail
          BODY="$(curl -fsSL --retry 4 --retry-delay 2 https://levelup.hitobito.jp/)"
          printf '%s' "$BODY" | grep -F 'google-site-verification' | grep -F 'sPBsbYpwHySgc4VntENvvGC4M--IgVcITX__dUozokA'
          echo "Meta verification tag OK"
