name: Verify thick-self production

on:
  push:
    branches: [main]
    paths:
      - 'apps/thick-self/**'
      - '.github/workflows/thick-self-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for exact commit to reach Firebase production
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            if curl -fsS --max-time 20 "https://levelup.hitobito.jp/deploy-meta.json?sha=$GITHUB_SHA" -o /tmp/thick-self-deploy-meta.json; then
              live_sha=$(node -e "const fs=require('fs');try{process.stdout.write(JSON.parse(fs.readFileSync('/tmp/thick-self-deploy-meta.json','utf8')).sha||'')}catch{}")
              echo "attempt=$attempt expected=$GITHUB_SHA live=$live_sha"
              if [ "$live_sha" = "$GITHUB_SHA" ]; then
                echo "Exact production SHA is live."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Exact commit did not reach production within the verification window."
          exit 1
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Verify live LEVEL UP app
        run: |
          cat > .thick-self-production-test.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          page.setDefaultTimeout(12000);
          await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
          const failures=[];
          page.on('pageerror',e=>failures.push(`pageerror ${String(e)}`));
          page.on('requestfailed',req=>{
            const u=req.url();
            if(u.includes('google-analytics.com')||u.endsWith('/favicon.ico')) return;
            failures.push(`requestfailed ${u} ${req.failure()?.errorText||''}`);
          });
          const url='https://levelup.hitobito.jp/apps/thick-self/';
          const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
          if(!response||response.status()!==200) throw new Error(`production HTTP status ${response?.status()}`);
          const title=await page.title();
          if(!title.includes('分厚い自分をつくる')) throw new Error(`production title mismatch: ${title}`);
          await page.waitForSelector('#startBtn');
          if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1)) throw new Error('production mobile horizontal overflow');
          const scienceHit=await page.evaluate(()=>{
            const b=document.getElementById('scienceBtn');
            const r=b.getBoundingClientRect();
            const top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
            return {tag:top?.tagName,id:top?.id,cls:top?.className};
          });
          if(scienceHit.id==='levelup-app-menu-root') throw new Error(`science button still blocked by production menu: ${JSON.stringify(scienceHit)}`);
          await page.click('#scienceBtn');
          await page.waitForSelector('dialog[open]');
          if((await page.$$('.science-item')).length!==7) throw new Error('production evidence map must contain 7 skills');
          await page.click('#scienceClose');
          await page.click('#startBtn');
          await page.waitForSelector('#tempt');
          await page.click('#tempt');
          const early=await page.$eval('#tempt',e=>e.textContent);
          if(!early.includes('まだ戻れる')) throw new Error('production impulsive recovery feedback missing');
          await new Promise(r=>setTimeout(r,3300));
          const pauseChoices=await page.$$('.choice-btn');
          await pauseChoices[1].click();
          await page.waitForSelector('.feedback .continue-btn');
          await page.click('.feedback .continue-btn');
          await page.waitForSelector('#place');
          await page.click('#place');
          await page.waitForSelector('.feedback .continue-btn');
          await page.click('.feedback .continue-btn');
          await page.waitForSelector('.sort-row');
          const rows=await page.$$('.sort-row');
          for(const row of rows){
            const text=await row.$eval('p',e=>e.textContent);
            const story=/嫌われ|才能|将来|呆れ|恥をかいた|気に障る|原因/.test(text)&&!/理由|原因かは不明/.test(text);
            const buttons=await row.$$('.sort-controls button');
            await buttons[story?1:0].click();
          }
          await page.click('#judge');
          await page.waitForSelector('.feedback .continue-btn');
          await page.click('.feedback .continue-btn');
          await page.waitForSelector('.unknown-btn');
          const unknowns=await page.$$('.unknown-btn');
          for(const b of unknowns){
            const t=await b.evaluate(e=>e.textContent);
            if(/つもり|評価|理由|怒って|事情|終わった|成果が出る|最終結論/.test(t)) await b.click();
          }
          await page.click('#judge');
          await page.waitForSelector('.feedback .continue-btn');
          await page.click('.feedback .continue-btn');
          await page.waitForSelector('.depth-card');
          const depth=await page.$$('.depth-card');
          await depth[0].click(); await depth[2].click(); await page.click('#judge');
          await page.waitForSelector('.feedback .continue-btn');
          await page.click('.feedback .continue-btn');
          await page.waitForSelector('#grip');
          await page.$eval('#grip',e=>{e.value=50;e.dispatchEvent(new Event('input',{bubbles:true}))});
          await page.click('#judge');
          await page.waitForSelector('.feedback .continue-btn');
          await page.click('.feedback .continue-btn');
          await page.waitForSelector('.recovery-step');
          const recovery=await page.$$('.recovery-step');
          await recovery[0].click();
          await page.waitForSelector('.feedback .continue-btn');
          await page.click('.feedback .continue-btn');
          await page.waitForSelector('.summary');
          const challenge=await page.$eval('.ifthen',e=>e.textContent);
          if(!challenge.includes('もし')) throw new Error('production real-world transfer missing');
          await page.click('#homeBtn');
          await page.waitForSelector('#startBtn');
          await page.reload({waitUntil:'domcontentloaded'});
          if((await page.$$('.layer')).length!==7) throw new Error('production persistent seven layers missing');
          const exitHit=await page.evaluate(()=>{
            const b=document.getElementById('exitBtn');
            const r=b.getBoundingClientRect();
            const top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
            return {tag:top?.tagName,id:top?.id,cls:top?.className};
          });
          if(exitHit.id==='levelup-app-menu-root') throw new Error(`exit button still blocked by production menu: ${JSON.stringify(exitHit)}`);
          page.once('dialog',async d=>{await d.accept()});
          await page.click('#exitBtn');
          await page.waitForFunction(()=>location.pathname==='/');
          if(failures.length) throw new Error(failures.join(' | '));
          console.log(`THICK-SELF PRODUCTION PASS: ${url} returned 200; exact deployment, mobile first view, evidence, both top controls, impulsive recovery, seven drills, completion, real-world transfer, persistence/reload verified.`);
          await browser.close();
          NODE
          node .thick-self-production-test.mjs
          rm .thick-self-production-test.mjs
