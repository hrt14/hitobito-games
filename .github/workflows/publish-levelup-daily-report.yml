name: Publish LEVEL UP daily report

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.levelup-daily-report-trigger'
      - '.github/workflows/publish-levelup-daily-report.yml'
      - 'scripts/export-levelup-daily-report.mjs'
      - 'scripts/inject-levelup-auto-circuit.mjs'
      - 'firebase-overrides/levelup-home-ux/daily-report-telemetry.mjs'
      - 'firebase-overrides/levelup-growth-loop/inject.mjs'
  schedule:
    - cron: '48 19 * * *' # 04:48 JST

permissions:
  contents: write
  id-token: write

concurrency:
  group: firebase-levelup-production
  cancel-in-progress: false

jobs:
  publish-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare current LEVEL UP game sources for mobile
        run: node scripts/prepare-firebase-mobile.mjs

      - name: Build LEVEL UP bundle
        run: npm run build:firebase

      - name: Deploy Firestore analytics rules when available
        continue-on-error: true
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project hitobito-levelup --non-interactive

      - name: Export sanitized daily report JSON
        run: node scripts/export-levelup-daily-report.mjs

      - name: Build automatic market-test circuit from latest aggregates
        run: node scripts/inject-levelup-auto-circuit.mjs

      - name: Deploy hosting with report and circuit
        run: npx --yes firebase-tools@latest deploy --only hosting --project hitobito-levelup --non-interactive

      - name: Verify report and circuit endpoints
        run: |
          set -euo pipefail
          sleep 5
          curl -fLsS https://levelup.hitobito.jp/reports/latest.json -o /tmp/report.json
          node -e "const r=require('/tmp/report.json'); if(!r.schemaVersion||!r.current) process.exit(1); console.log(r.current.date, r.current.available, r.blockedReason || 'ok')"
          curl -fLsS https://levelup.hitobito.jp/reports/circuit.json -o /tmp/circuit.json
          node -e "const c=require('/tmp/circuit.json'); if(c.schemaVersion!==1||!Array.isArray(c.games)||!c.telemetry) process.exit(1); console.log('circuit', c.reportDate, c.featured?.slug || 'none', 'boosts=' + c.boosts.length, 'explore=' + c.explore.length, 'improve=' + c.improvements.length)"
          curl -fLsS https://levelup.hitobito.jp/ -o /tmp/levelup-home.html
          grep -F 'data-levelup-auto-circuit-v1' /tmp/levelup-home.html >/dev/null
          echo 'Automatic circuit is live on the LEVEL UP home.'

      - name: Record successful report publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/report.json', 'utf8'));
          const c = JSON.parse(fs.readFileSync('/tmp/circuit.json', 'utf8'));
          const status = {
            publishedAt: new Date().toISOString(),
            reportDate: r.current?.date || null,
            available: Boolean(r.current?.available),
            blockedReason: r.blockedReason || null,
            generatedAt: r.generatedAt || null,
            circuit: {
              reportDate: c.reportDate || null,
              featured: c.featured?.slug || null,
              boosts: Array.isArray(c.boosts) ? c.boosts.map((item) => item.slug) : [],
              explore: Array.isArray(c.explore) ? c.explore.map((item) => item.slug) : [],
              improvements: Array.isArray(c.improvements) ? c.improvements.map((item) => item.slug) : [],
              completionReady: Boolean(c.telemetry?.completionReady),
            },
            workflowRun: process.env.GITHUB_RUN_ID || null,
          };
          fs.writeFileSync('/tmp/report-status.json', JSON.stringify(status, null, 2) + '\n');
          NODE

          publish_file() {
            local source="$1"
            local target="$2"
            local message="$3"
            local content sha
            content=$(base64 -w0 "$source")
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${target}" --jq '.sha' 2>/dev/null || true)
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${target}" -f message="$message" -f content="$content" -f branch=main)
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api "${args[@]}" >/dev/null
          }

          # Mirror sanitized aggregates and the derived circuit decision to GitHub
          # so connected agents can audit what the production homepage used without
          # exposing user-level analytics data.
          publish_file /tmp/report.json .levelup-daily-report-latest.json 'Mirror LEVEL UP daily report aggregates'
          publish_file /tmp/circuit.json .levelup-circuit-latest.json 'Mirror LEVEL UP automatic circuit decision'
          publish_file /tmp/report-status.json .levelup-daily-report-status.json 'Record LEVEL UP daily report publish'
