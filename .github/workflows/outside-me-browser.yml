name: Outside Me browser playtest

on:
  push:
    branches:
      - feature/door-outside-horror
    paths:
      - 'apps/outside-me/**'
      - '.github/workflows/outside-me-browser.yml'
  pull_request:
    paths:
      - 'apps/outside-me/**'
      - '.github/workflows/outside-me-browser.yml'
  workflow_dispatch:

jobs:
  mobile-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/outside-me-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/apps/outside-me/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/outside-me-server.log
          exit 1
      - name: Play true and alternate routes in Chromium
        env:
          OUTSIDE_ME_URL: http://127.0.0.1:4173/apps/outside-me/
        run: node apps/outside-me/smoke-browser.mjs
      - name: Upload playtest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outside-me-browser-playtest
          path: apps/outside-me/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Server log on failure
        if: failure()
        run: cat /tmp/outside-me-server.log || true
