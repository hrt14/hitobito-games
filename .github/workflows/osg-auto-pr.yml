name: OSG Auto Integrate

on:
  push:
    branches:
      - 'osg-request-*'
      - 'osg-requests-*'
      - 'osg-improvement-*'
    paths:
      - 'oneshotgames/games/**'
      - 'oneshotgames/site/**'
      - 'scripts/build-osg.mjs'
      - 'scripts/validate-osg-game-security.mjs'
      - 'firebase.osg.json'

permissions:
  contents: write

concurrency:
  group: osg-auto-integrate
  cancel-in-progress: false

jobs:
  validate-and-integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OSG game security
        run: node scripts/validate-osg-game-security.mjs

      - name: Build OSG
        run: node scripts/build-osg.mjs

      - name: Integrate validated request into main
        env:
          HEAD_SHA: ${{ github.sha }}
          HEAD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          request_id="$(printf '%s' "$HEAD_BRANCH" | sed -E 's/^osg-(request|requests|improvement)-//')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git merge --squash "$HEAD_SHA"
          if git diff --cached --quiet; then
            echo "No changes remain to integrate for $HEAD_BRANCH"
            exit 0
          fi
          git commit -m "OSG request ${request_id}"
          git push origin main
