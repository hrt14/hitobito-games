name: OSG Auto PR

on:
  push:
    branches:
      - 'osg-request-*'
      - 'osg-requests-*'
      - 'osg-improvement-*'
    paths:
      - 'oneshotgames/games/**'
      - 'oneshotgames/site/**'
      - 'scripts/build-osg.mjs'
      - 'scripts/validate-osg-game-security.mjs'
      - 'firebase.osg.json'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: osg-auto-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-open-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate OSG game security
        run: node scripts/validate-osg-game-security.mjs

      - name: Build OSG
        run: node scripts/build-osg.mjs

      - name: Open or reuse pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --state open --head "$HEAD_BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            pr_number="$existing"
            echo "PR #$pr_number already exists for $HEAD_BRANCH"
          else
            request_id="$(printf '%s' "$HEAD_BRANCH" | sed -E 's/^osg-(request|requests|improvement)-//')"
            title="OSG request ${request_id}"
            body="Automated OneShotGames change from branch \`${HEAD_BRANCH}\`.\n\nThis PR intentionally contains only generalized implementation information."
            pr_url="$(gh pr create --base main --head "$HEAD_BRANCH" --title "$title" --body "$body")"
            pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge validated pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --squash --delete-branch
