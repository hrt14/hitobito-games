name: Provision OSG event queue

on:
  workflow_dispatch:
  push:
    branches:
      - feat/osg-event-driven-queue
    paths:
      - '.github/workflows/provision-osg-event-queue.yml'
      - 'functions/entry.js'
      - 'functions/osg-request-trigger.js'
      - 'functions/package.json'

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate Functions code
        run: |
          set -euo pipefail
          npm install --prefix functions
          node --check functions/osg-request-trigger.js
          node --check functions/sync-osg-requests-to-github.mjs
          node -e "import('./functions/entry.js').then(() => console.log('Functions entry imports successfully'))"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Enable event-driven Functions services
        run: |
          set -euo pipefail
          gcloud services enable \
            cloudfunctions.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            eventarc.googleapis.com \
            pubsub.googleapis.com \
            secretmanager.googleapis.com \
            --project=hitobito-levelup

      - name: Store private request token in Secret Manager
        env:
          PRIVATE_REQUEST_TOKEN_VALUE: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REQUEST_TOKEN_VALUE:-}"
          if ! gcloud secrets describe PRIVATE_REQUEST_TOKEN --project=hitobito-levelup >/dev/null 2>&1; then
            gcloud secrets create PRIVATE_REQUEST_TOKEN --replication-policy=automatic --project=hitobito-levelup
          fi
          printf '%s' "$PRIVATE_REQUEST_TOKEN_VALUE" | gcloud secrets versions add PRIVATE_REQUEST_TOKEN --data-file=- --project=hitobito-levelup >/dev/null
          echo 'Private request token stored without exposing its value.'

      - name: Deploy event-driven OSG Function
        run: |
          set -euo pipefail
          npx --yes firebase-tools@latest deploy --only functions:queueOneShotGameRequest --project hitobito-levelup --non-interactive
