name: Finalize LEVEL UP agent request

on:
  workflow_run:
    workflows:
      - Deploy LEVEL UP production closed loop
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: levelup-agent-finalize-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find LEVEL UP agent PR for deployed commit
        id: meta
        env:
          PUBLIC_GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
          QUEUE_REPO: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
        run: |
          set -euo pipefail

          GH_TOKEN="$PUBLIC_GH_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/commits/$DEPLOYED_SHA/pulls" > /tmp/deployed-prs.json

          pr=$(jq -r '[.[] | select(.merged_at != null) | select((.body // "") | contains("<!-- levelup-agent-request:"))] | .[0].number // empty' /tmp/deployed-prs.json)
          if [ -z "$pr" ]; then
            echo 'No delegated LEVEL UP PR is associated with this verified deployment.' >> "$GITHUB_STEP_SUMMARY"
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          GH_TOKEN="$PUBLIC_GH_TOKEN" gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json author,body > /tmp/deployed-pr.json
          author=$(jq -r '.author.login // empty' /tmp/deployed-pr.json)
          if [ "$author" != 'copilot-swe-agent[bot]' ]; then
            echo 'Associated PR is not a Copilot delegated LEVEL UP PR.' >> "$GITHUB_STEP_SUMMARY"
            echo 'found=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_BODY=$(jq -r '.body // ""' /tmp/deployed-pr.json) QUEUE_REPO="$QUEUE_REPO" node - <<'NODE'
          const fs = require('fs');
          const body = process.env.PR_BODY || '';
          const expectedQueue = process.env.QUEUE_REPO || 'hrt14/hitobito-request-queue';
          const source = body.match(/<!-- levelup-agent-request:([^#<>\s]+)#(\d+) -->/);
          const requestId = body.match(/<!-- levelup-creation-request-id:([a-z0-9-]{8,36}) -->/);
          const slug = body.match(/<!-- levelup-app-slug:([a-z0-9][a-z0-9-]{0,63}) -->/);
          const title = body.match(/<!-- levelup-app-title:([^<>\n]{1,100}) -->/);
          if (!source || !requestId || !slug || !title) throw new Error('Delegated PR is missing completion metadata.');
          if (source[1] !== expectedQueue) throw new Error(`Unexpected private queue repository: ${source[1]}`);
          const cleanTitle = title[1].trim();
          if (!cleanTitle) throw new Error('Delegated PR has an empty public title.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `found=true\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `issue=${source[2]}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `request_id=${requestId[1]}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `slug=${slug[1]}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${cleanTitle.replace(/\r?\n/g, ' ')}\n`);
          NODE

      - name: Verify the new app is live on production
        if: steps.meta.outputs.found == 'true'
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            url="$base/apps/$SLUG/?sha=$DEPLOYED_SHA"
            curl -fLsS --max-time 30 "$url" -o /tmp/levelup-agent-app.html
            grep -qi '<html' /tmp/levelup-agent-app.html
            echo "Verified live app route: $base/apps/$SLUG/" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Update and close the private source request
        if: steps.meta.outputs.found == 'true'
        env:
          QUEUE_REPO: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
          ISSUE: ${{ steps.meta.outputs.issue }}
          REQUEST_ID: ${{ steps.meta.outputs.request_id }}
          SLUG: ${{ steps.meta.outputs.slug }}
          APP_TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -euo pipefail
          if [ -z "${QUEUE_REPO:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo '::error::Private queue configuration is required to finalize a delegated LEVEL UP request.'
            exit 1
          fi

          private=$(gh api "repos/$QUEUE_REPO" --jq '.private')
          if [ "$private" != 'true' ]; then
            echo '::error::Refusing to finalize a request outside the private queue.'
            exit 1
          fi

          gh issue view "$ISSUE" --repo "$QUEUE_REPO" --json body --jq '.body' > /tmp/private-levelup-request.md

          REQUEST_ID="$REQUEST_ID" SLUG="$SLUG" APP_TITLE="$APP_TITLE" node - <<'NODE'
          const fs = require('fs');
          const path = '/tmp/private-levelup-request.md';
          let body = fs.readFileSync(path, 'utf8');
          const requestId = process.env.REQUEST_ID;
          const slug = process.env.SLUG;
          const title = process.env.APP_TITLE;
          const idMatch = body.match(/<!-- levelup-creation-request-id:([a-z0-9-]{8,36}) -->/);
          if (!idMatch || idMatch[1] !== requestId) throw new Error('Private request id does not match the deployed PR.');

          const slugMarker = `<!-- levelup-app-slug:${slug} -->`;
          if (/<!-- levelup-app-slug:[a-z0-9-]{1,64} -->/.test(body)) {
            body = body.replace(/<!-- levelup-app-slug:[a-z0-9-]{1,64} -->/, slugMarker);
          } else {
            body = body.replace(idMatch[0], `${idMatch[0]}\n${slugMarker}`);
          }

          const titleMarker = `<!-- levelup-app-title:${title} -->`;
          if (/<!-- levelup-app-title:[^<>\n]{1,100} -->/.test(body)) {
            body = body.replace(/<!-- levelup-app-title:[^<>\n]{1,100} -->/, titleMarker);
          } else {
            body = body.replace(slugMarker, `${slugMarker}\n${titleMarker}`);
          }

          fs.writeFileSync('/tmp/private-levelup-request-updated.md', body);
          NODE

          gh label create levelup-agent-published \
            --repo "$QUEUE_REPO" \
            --color 0E8A16 \
            --description 'LEVEL UP coding-agent request verified live' \
            --force >/dev/null

          gh issue edit "$ISSUE" \
            --repo "$QUEUE_REPO" \
            --body-file /tmp/private-levelup-request-updated.md \
            --add-label levelup-agent-published >/dev/null

          gh issue close "$ISSUE" --repo "$QUEUE_REPO" --reason completed >/dev/null

          {
            echo 'Verified production deployment completed the private LEVEL UP request.'
            echo "Private issue: #$ISSUE"
            echo "App slug: $SLUG"
            echo "Public title: $APP_TITLE"
            echo 'Raw private request text was never copied to the public repository or workflow summary.'
          } >> "$GITHUB_STEP_SUMMARY"
