name: Environment policy live verification

on:
  push:
    paths:
      - '.environment-policy-live-trigger'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production game
        run: |
          set -euo pipefail
          URL='https://play.hitobito.jp/apps/environment-policy-sim/'
          for ATTEMPT in $(seq 1 12); do
            BODY="$(curl -fsSL --max-time 20 "${URL}?_verify=${GITHUB_SHA}-${ATTEMPT}" || true)"
            HAS_TITLE=no; HAS_BUTTON=no; HAS_ENV=no
            [[ "$BODY" == *'<title>稲わら焼きを止めても終わらない｜環境政策シミュレーター</title>'* ]] && HAS_TITLE=yes
            [[ "$BODY" == *'id="quickBtn"'* ]] && HAS_BUTTON=yes
            [[ "$BODY" == *'環境課題シミュレーション'* ]] && HAS_ENV=yes
            echo "attempt=${ATTEMPT} bytes=${#BODY} title=${HAS_TITLE} button=${HAS_BUTTON} env=${HAS_ENV}"
            if [[ "$HAS_TITLE" == yes && "$HAS_BUTTON" == yes && "$HAS_ENV" == yes ]]; then
              echo "LIVE PASS ${URL}"
              exit 0
            fi
            sleep 5
          done
          echo 'Production game content not verified' >&2
          exit 1
