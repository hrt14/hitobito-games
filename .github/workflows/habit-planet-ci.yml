name: Habit Planet CI

on:
  pull_request:
    paths:
      - "standalone/habit-planet/**"
      - ".github/workflows/habit-planet-ci.yml"
  push:
    branches: [main]
    paths:
      - "standalone/habit-planet/**"
      - ".github/workflows/habit-planet-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          for file in public/*.js functions/index.js; do
            echo "checking $file"
            node --check "$file"
          done
      - name: Verify required app files
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          required=(
            public/index.html
            public/styles.css
            public/app-entry.js
            public/app-part1.js
            public/app-part2.js
            public/app-part3.js
            public/app-part4.js
            public/app-part5.js
            public/firebase-client.js
            public/manifest.json
            public/sw.js
            firestore.rules
            firebase.json
          )
          for file in "${required[@]}"; do
            echo "checking $file"
            test -f "$file"
          done
          grep -Fq '/app-part5.js' public/app-entry.js
          grep -Fq '/api/stripe-webhook' firebase.json
