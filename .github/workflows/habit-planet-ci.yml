name: Habit Planet CI

on:
  pull_request:
    paths:
      - "standalone/habit-planet/**"
      - ".github/workflows/habit-planet-ci.yml"
  push:
    branches: [main, feat/habit-planet-firebase, feat/habit-planet-cloudflare]
    paths:
      - "standalone/habit-planet/**"
      - ".github/workflows/habit-planet-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Cloudflare dependencies
        working-directory: standalone/habit-planet
        run: npm install --ignore-scripts
      - name: Syntax check
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          npm run check
          for file in public/app-part1.js public/app-part2.js public/app-part3.js public/app-part4.js public/app-part5.js; do
            node --check "$file"
          done
      - name: Verify required app and D1 files
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          required=(
            public/index.html
            public/styles.css
            public/app-entry.js
            public/app-part1.js
            public/app-part2.js
            public/app-part3.js
            public/app-part4.js
            public/app-part5.js
            public/firebase-client.js
            public/manifest.json
            public/sw.js
            worker/index.js
            migrations/0001_init.sql
            wrangler.example.jsonc
            package.json
            PARITY.md
          )
          for file in "${required[@]}"; do
            echo "checking $file"
            test -f "$file"
          done
          grep -Fq '/app-part4.js' public/app-entry.js
          grep -Fq '/app-part5.js' public/app-entry.js
          grep -Fq 'user_states' migrations/0001_init.sql
          grep -Fq 'entitlements' migrations/0001_init.sql
          grep -Fq 'stripe_events' migrations/0001_init.sql
          grep -Fq 'Habit Planet Pro' PARITY.md
      - name: Verify Firebase ID Token checks
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          grep -Fq 'protectedHeader.alg !== "RS256"' worker/index.js
          grep -Fq 'protectedHeader.kid' worker/index.js
          grep -Fq 'importX509' worker/index.js
          grep -Fq 'payload.exp' worker/index.js
          grep -Fq 'payload.iat' worker/index.js
          grep -Fq 'payload.auth_time' worker/index.js
          grep -Fq 'payload.aud' worker/index.js
          grep -Fq 'payload.iss' worker/index.js
          grep -Fq 'payload.sub' worker/index.js
          grep -Fq 'securetoken.google.com' worker/index.js
          grep -Fq 'caches.default' worker/index.js
      - name: Verify API and billing guardrails
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          grep -Fq 'MAX_STATE_BYTES' worker/index.js
          grep -Fq 'STRIPE_TOLERANCE_SECONDS = 300' worker/index.js
          grep -Fq 'stripe-signature' worker/index.js
          grep -Fq 'crypto.subtle.importKey' worker/index.js
          grep -Fq 'Idempotency-Key' worker/index.js
          grep -Fq '/api/state' worker/index.js
          grep -Fq '/api/entitlement' worker/index.js
          grep -Fq '/api/checkout' worker/index.js
          grep -Fq '/api/portal' worker/index.js
          grep -Fq '/api/stripe-webhook' worker/index.js
          grep -Fq 'run_worker_first' wrangler.example.jsonc
          grep -Fq 'firebase-auth.js' public/firebase-client.js
          ! grep -Fq 'firebase-firestore.js' public/firebase-client.js
          ! grep -Fq 'firebase-admin' worker/index.js
      - name: Bundle Worker with Wrangler dry run
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.example.jsonc
      - name: Browser smoke test
        working-directory: standalone/habit-planet
        run: |
          set -euo pipefail
          cat > public/ci-smoke.html <<'HTML'
          <!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="/styles.css"></head>
          <body><div id="app"></div>
          <script>
          window.HP_CLOUD = {
            cloudAvailable: false,
            getCurrentUser: () => null,
            idToken: async () => "",
            loadState: async () => null,
            loginGoogle: async () => null,
            logout: async () => {},
            saveState: async () => {},
            watchAuth: (callback) => { callback(null); return () => {}; },
            watchEntitlement: (_uid, callback) => { callback(null); return () => {}; }
          };
          </script>
          <script src="/app-part1.js"></script>
          <script src="/app-part2.js"></script>
          <script src="/app-part3.js"></script>
          <script src="/app-part4.js"></script>
          <script src="/app-part5.js"></script>
          </body></html>
          HTML
          python3 -m http.server 4173 --directory public >/tmp/habit-planet-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ci-smoke.html >/dev/null && break
            sleep 0.25
          done
          google-chrome --headless --no-sandbox --disable-gpu --disable-background-networking \
            --disable-component-update --disable-sync --no-first-run --virtual-time-budget=2500 \
            --dump-dom http://127.0.0.1:4173/ci-smoke.html > /tmp/habit-planet-dom.html
          grep -Fq 'HABIT PLANET' /tmp/habit-planet-dom.html
          grep -Eq '今日の(歩み|習慣)' /tmp/habit-planet-dom.html
          ! grep -Fq 'ReferenceError' /tmp/habit-planet-dom.html
