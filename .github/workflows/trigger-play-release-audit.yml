name: Trigger PLAY release audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-play-release-audit.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch PLAY release browser audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run play-release-audit.yml --repo hrt14/hitobito-games --ref main
