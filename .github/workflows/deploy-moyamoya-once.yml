name: Deploy moyamoya finder once

on:
  push:
    branches:
      - main
    paths:
      - firebase-overrides/levelup-home-diagnosis-v3/inject.mjs
      - firebase-overrides/levelup-home-diagnosis-v3/deploy-trigger.txt
  workflow_dispatch:

concurrency:
  group: firebase-levelup-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare current LEVEL UP game sources for mobile
        run: node scripts/prepare-firebase-mobile.mjs

      - name: Build LEVEL UP bundle
        run: npm run build:firebase

      - name: Verify moyamoya finder in bundle
        run: |
          set -euo pipefail
          grep -F 'data-levelup-state-diagnosis-v3' .dist/firebase/index.html >/dev/null
          grep -F 'lu-v3-start' .dist/firebase/index.html >/dev/null
          grep -F 'lu-v3-more' .dist/firebase/index.html >/dev/null

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project hitobito-levelup --non-interactive

      - name: Verify live LEVEL UP
        run: |
          set -euo pipefail
          sleep 5
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            echo "Checking $base"
            curl -fLsS --max-time 30 "$base/?moyamoya_verify=$GITHUB_SHA" -o /tmp/levelup-home.html
            grep -F 'data-levelup-state-diagnosis-v3' /tmp/levelup-home.html >/dev/null
            grep -F 'lu-v3-start' /tmp/levelup-home.html >/dev/null
            grep -F 'lu-v3-more' /tmp/levelup-home.html >/dev/null
          done
