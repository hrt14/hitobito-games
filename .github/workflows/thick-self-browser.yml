name: thick-self browser

on:
  push:
    branches: [main, feat/thick-self, feat/thick-self-8-skills-bigger-bank, feat/thick-self-theme-toggle]
    paths:
      - 'apps/thick-self/**'
      - '.github/workflows/thick-self-browser.yml'
  pull_request:
    paths:
      - 'apps/thick-self/**'
      - '.github/workflows/thick-self-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/thick-self-server.log 2>&1 &
          sleep 2
      - name: Browser test
        run: |
          cat > .thick-self-browser-test.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();page.setDefaultTimeout(10000);await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
          await page.emulateMediaFeatures([{name:'prefers-color-scheme',value:'dark'}]);
          const base='http://127.0.0.1:4173/apps/thick-self/';
          await page.goto(base,{waitUntil:'domcontentloaded'});

          // No saved preference: follow the device/system dark preference.
          const initialTheme=await page.evaluate(()=>document.documentElement.dataset.thickTheme);
          if(initialTheme!=='dark')throw new Error(`system dark theme not adopted: ${initialTheme}`);
          const homeDark=await page.evaluate(()=>({
            body:getComputedStyle(document.body).backgroundColor,
            h1:getComputedStyle(document.querySelector('.hero h1')).color,
            ctaBg:getComputedStyle(document.querySelector('#startBtn')).backgroundColor,
            ctaText:getComputedStyle(document.querySelector('#startBtn')).color
          }));
          if(homeDark.body!=='rgb(7, 17, 29)'||homeDark.h1!=='rgb(247, 249, 252)')throw new Error(`dark home contrast regression: ${JSON.stringify(homeDark)}`);
          if(homeDark.ctaBg!=='rgb(185, 239, 60)'||homeDark.ctaText!=='rgb(7, 17, 29)')throw new Error(`dark CTA contrast regression: ${JSON.stringify(homeDark)}`);

          // Explicit toggle to light; setting must persist.
          await page.click('#themeBtn');
          const light=await page.evaluate(()=>({theme:document.documentElement.dataset.thickTheme,saved:localStorage.getItem('thick-self:theme'),body:getComputedStyle(document.body).backgroundColor,h1:getComputedStyle(document.querySelector('.hero h1')).color}));
          if(light.theme!=='light'||light.saved!=='light'||light.body!=='rgb(246, 243, 237)'||light.h1!=='rgb(13, 26, 43)')throw new Error(`light toggle failed: ${JSON.stringify(light)}`);
          await page.reload({waitUntil:'domcontentloaded'});
          if(await page.evaluate(()=>document.documentElement.dataset.thickTheme)!=='light')throw new Error('saved light theme did not survive reload');

          // Toggle back to dark and persist for the training flow.
          await page.click('#themeBtn');
          await page.reload({waitUntil:'domcontentloaded'});
          if(await page.evaluate(()=>document.documentElement.dataset.thickTheme)!=='dark')throw new Error('saved dark theme did not survive reload');

          const homeText=await page.$eval('#app',e=>e.textContent);
          if(!homeText.includes('今日の8つを稽古する'))throw new Error('8-skill CTA missing');
          if(!homeText.includes('各テーマ45パターン'))throw new Error('expanded scenario-bank copy missing');
          const start=await page.$('#startBtn');const box=await start.boundingBox();if(!box||box.height<48)throw new Error('start tap target too small');
          if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1))throw new Error('mobile horizontal overflow');

          await page.click('#scienceBtn');await page.waitForSelector('dialog[open]');const evidence=await page.$$('.science-item');if(evidence.length!==8)throw new Error('evidence map must contain 8 skills');const scienceText=await page.$eval('#scienceList',e=>e.textContent);if(!scienceText.includes('品位'))throw new Error('dignity evidence item missing');const dialogColors=await page.$eval('.science-dialog',e=>({bg:getComputedStyle(e).backgroundColor,text:getComputedStyle(e).color}));if(dialogColors.bg!=='rgb(14, 27, 41)'||dialogColors.text!=='rgb(247, 249, 252)')throw new Error(`dark science dialog regression: ${JSON.stringify(dialogColors)}`);await page.click('#scienceClose');

          await page.click('#startBtn');
          const firstScenario=await page.$eval('.scenario-card h2',e=>e.textContent);
          const colors=await page.$eval('.scenario-card',card=>({bg:getComputedStyle(card).backgroundColor,text:getComputedStyle(card.querySelector('h2')).color,instruction:getComputedStyle(document.querySelector('.instruction')).color}));
          if(colors.bg!=='rgb(14, 27, 41)'||colors.text!=='rgb(247, 249, 252)'||colors.instruction!=='rgb(190, 200, 212)') throw new Error(`dark practice readability regression: ${JSON.stringify(colors)}`);

          async function feedbackNext(){await page.waitForSelector('.feedback');const sections=await page.$$('.feedback-explain>div');if(sections.length!==3)throw new Error('feedback must explain why / avoid / real-world action');await page.click('.feedback .continue-btn');}
          // 1 pause
          await page.waitForSelector('#tempt');await new Promise(r=>setTimeout(r,3300));await page.waitForSelector('.choice-btn');(await page.$$('.choice-btn'))[0].click();await feedbackNext();
          // 2 acceptance
          await page.waitForSelector('#place');await page.click('#place');await feedbackNext();
          // 3 distance
          await page.waitForSelector('.sort-row');for(const row of await page.$$('.sort-row')){const buttons=await row.$$('.sort-controls button');await buttons[0].click();}await page.click('#judge');await feedbackNext();
          // 4 uncertainty
          await page.waitForSelector('.unknown-btn');await page.click('#judge');await feedbackNext();
          // 5 depth
          await page.waitForSelector('.depth-card');const depth=await page.$$('.depth-card');await depth[0].click();await depth[1].click();await page.click('#judge');await feedbackNext();
          // 6 lightness
          await page.waitForSelector('#grip');await page.$eval('#grip',e=>{e.value=50;e.dispatchEvent(new Event('input',{bubbles:true}))});await page.click('#judge');await feedbackNext();
          // 7 recovery
          await page.waitForSelector('.choice-btn');(await page.$$('.choice-btn'))[0].click();await feedbackNext();
          // 8 dignity / self-disgust repair
          await page.waitForSelector('.skill-pill');const dignityLabel=await page.$eval('.skill-pill',e=>e.textContent);if(!dignityLabel.includes('品位'))throw new Error('dignity round missing');const dignityInstruction=await page.$eval('.instruction',e=>e.textContent);if(!dignityInstruction.includes('自己嫌悪')||!dignityInstruction.includes('美学'))throw new Error('dignity self-disgust framing missing');(await page.$$('.choice-btn'))[0].click();await feedbackNext();

          await page.waitForSelector('.summary');const summary=await page.$eval('.summary',e=>e.textContent);if(!summary.includes('8層'))throw new Error('8-layer summary missing');if(!summary.includes('美学'))throw new Error('dignity summary missing');
          const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('thick-self:v1')));if(saved?.version!==2)throw new Error('state was not upgraded to v2');if(!saved?.history?.some(x=>x.kind==='session'))throw new Error('session history not saved');
          const layerCount=await page.$$('.layer');if(layerCount.length!==8)throw new Error('8 persistent skill layers missing');

          // Immediate repeat protection.
          await page.click('#homeBtn');await page.waitForSelector('#startBtn');await page.click('#startBtn');const secondScenario=await page.$eval('.scenario-card h2',e=>e.textContent);if(secondScenario===firstScenario)throw new Error('first scenario repeated immediately');const repeatState=await page.evaluate(()=>JSON.parse(localStorage.getItem('thick-self:v1')));for(const [skill,ids] of Object.entries(repeatState.seen)){if(ids.length>=2){const a=ids.at(-1).split('-v')[0],b=ids.at(-2).split('-v')[0];if(a===b)throw new Error(`core scenario repeated immediately for ${skill}`)}}
          if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1))throw new Error('mobile overflow after theme toggle');
          console.log('THICK-SELF THEME PASS: system default, explicit light/dark toggle, persistence, high-contrast home/dialog/practice, 8 skills, dignity, explanations, anti-repeat.');
          await browser.close();
          NODE
          timeout 150s node .thick-self-browser-test.mjs
          rm .thick-self-browser-test.mjs
