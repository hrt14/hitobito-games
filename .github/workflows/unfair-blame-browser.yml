name: Unfair blame LEVEL UP browser playtest

on:
  pull_request:
    paths:
      - 'apps/unfair-blame/**'
      - '.github/workflows/unfair-blame-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/unfair-blame/**'
      - '.github/workflows/unfair-blame-browser.yml'
  workflow_dispatch:

jobs:
  mobile-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: node --check apps/unfair-blame/app.js
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/unfair-blame-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/apps/unfair-blame/?test=1' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/unfair-blame-server.log
          exit 1
      - name: Run real mobile playtest
        env:
          UNFAIR_BLAME_URL: http://127.0.0.1:4173/apps/unfair-blame/?test=1
        run: node apps/unfair-blame/smoke-browser.mjs
      - name: Wait for this commit on Firebase production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for i in $(seq 1 48); do
            if curl -fsS --max-time 20 "https://levelup.hitobito.jp/deploy-meta.json?sha=$GITHUB_SHA&attempt=$i" -o /tmp/unfair-blame-deploy-meta.json; then
              if grep -F "$GITHUB_SHA" /tmp/unfair-blame-deploy-meta.json >/dev/null; then
                echo "Firebase production is on $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Firebase production did not reach $GITHUB_SHA"
          cat /tmp/unfair-blame-deploy-meta.json || true
          exit 1
      - name: Verify unfair blame on Firebase production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          UNFAIR_BLAME_PRODUCTION_URL: https://levelup.hitobito.jp/apps/unfair-blame/?sha=${{ github.sha }}
        run: node apps/unfair-blame/production-smoke.mjs
      - name: Run LEVEL UP quality gate
        run: node scripts/validate-levelup-quality-gate.mjs --app apps/unfair-blame
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unfair-blame-browser-playtest
          path: apps/unfair-blame/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Server log on failure
        if: failure()
        run: cat /tmp/unfair-blame-server.log || true
