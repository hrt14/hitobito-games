name: あなたを止めているもの診断 production E2E

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/what-stops-you-production.yml'
      - 'apps/what-stops-you/**'
  workflow_dispatch:

jobs:
  production-mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run production mobile playtest
        env:
          WHAT_STOPS_YOU_URL: https://levelup.hitobito.jp/apps/what-stops-you/
        run: node apps/what-stops-you/smoke-browser.mjs
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: what-stops-you-production-e2e
          path: apps/what-stops-you/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
