name: Verify salary diagnosis production

on:
  push:
    branches:
      - main
    paths:
      - '.firebase-deploy-trigger'
      - '.github/workflows/nenshu-shindan-production.yml'
  workflow_dispatch:

jobs:
  production-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for salary diagnosis on both production domains
        run: |
          set -euo pipefail
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            ok=0
            for attempt in $(seq 1 36); do
              out="/tmp/nenshu-${attempt}.html"
              if curl -fLsS --max-time 30 "$base/apps/nenshu-shindan/?verify=${GITHUB_SHA}-${attempt}" -o "$out" \
                && grep -F '30問でわかる' "$out" >/dev/null \
                && grep -F '市場年収診断' "$out" >/dev/null \
                && grep -F 'NO SALARY INPUT / 30 TAPS' "$out" >/dev/null; then
                ok=1
                echo "Salary diagnosis live on $base"
                break
              fi
              sleep 5
            done
            test "$ok" = "1"
          done
      - name: Run production mobile playtest on custom domain
        env:
          NENSHU_SHINDAN_URL: https://levelup.hitobito.jp/apps/nenshu-shindan/?production-smoke=${{ github.sha }}
        run: node apps/nenshu-shindan/smoke-browser.mjs
      - name: Run production mobile playtest on Firebase domain
        env:
          NENSHU_SHINDAN_URL: https://hitobito-levelup.web.app/apps/nenshu-shindan/?production-smoke=${{ github.sha }}
        run: node apps/nenshu-shindan/smoke-browser.mjs
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nenshu-shindan-production-playtest
          path: apps/nenshu-shindan/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
