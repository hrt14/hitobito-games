name: Diagnose thick-self production hitbox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thick-self-production-hitbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hitbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Inspect production click target
        run: |
          cat > .hitbox.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
          await page.goto('https://levelup.hitobito.jp/apps/thick-self/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForSelector('#scienceBtn');
          const before=await page.evaluate(()=>{
            const b=document.getElementById('scienceBtn');
            const r=b.getBoundingClientRect();
            const x=r.left+r.width/2,y=r.top+r.height/2;
            const top=document.elementFromPoint(x,y);
            return {rect:{x:r.x,y:r.y,w:r.width,h:r.height},center:{x,y},top:{tag:top?.tagName,id:top?.id,cls:top?.className},dialogExists:!!document.getElementById('scienceDialog'),showModal:typeof document.getElementById('scienceDialog')?.showModal};
          });
          console.log('HITBOX',JSON.stringify(before));
          await page.click('#scienceBtn');
          await new Promise(r=>setTimeout(r,500));
          const after=await page.evaluate(()=>({open:document.getElementById('scienceDialog')?.open,active:document.activeElement?.id,navOpen:document.getElementById('levelup-nav-fixed')?.classList.contains('open')}));
          console.log('AFTER_CLICK',JSON.stringify(after));
          if(!after.open) throw new Error(`science dialog did not open; top=${JSON.stringify(before.top)} rect=${JSON.stringify(before.rect)}`);
          await browser.close();
          NODE
          node .hitbox.mjs
