name: Deploy LEVEL UP to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .firebase-deploy-trigger

concurrency:
  group: firebase-levelup-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Restore Aug 15 LEVEL UP game sources
        run: |
          set -euo pipefail
          SNAPSHOT=dfe0eec0b0b1a0e231021212f32d310bd663a4fe
          rm -rf apps
          git archive "$SNAPSHOT" apps | tar -x
          node scripts/prepare-firebase-mobile.mjs
          echo "LEVEL UP game source snapshot: $SNAPSHOT (2026-08-15 23:45 JST)"

      - name: Build LEVEL UP bundle
        run: npm run build:firebase

      - name: Check mobile-safe bundle
        run: |
          set -euo pipefail
          test -s .dist/firebase/apps/ato-5min/game.js
          test -s .dist/firebase/apps/watashi-zukan/game.js
          ! grep -F 'DecompressionStream' .dist/firebase/apps/ato-5min/index.html
          ! grep -F 'game-a.bin' .dist/firebase/apps/ato-5min/index.html
          ! grep -F 'Promise.all(parts.map' .dist/firebase/apps/watashi-zukan/game.js
          echo "Mobile loader check OK"

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project hitobito-levelup --non-interactive

      - name: Verify live LEVEL UP routes
        run: |
          set -euo pipefail
          sleep 5
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            echo "Checking $base"
            curl -fLsS "$base/" -o /tmp/levelup-home.html
            grep -F '22 games' /tmp/levelup-home.html >/dev/null
            node - "$base" <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const base = process.argv[2];
          const catalog = JSON.parse(fs.readFileSync('.dist/firebase/levelup-catalog.json', 'utf8'));
          for (const game of catalog.games) {
            const url = new URL(game.href, base).href;
            console.log(`GET ${game.title}: ${url}`);
            execFileSync('curl', ['-fLsS', '--max-time', '30', '-o', '/dev/null', url], { stdio: 'inherit' });
          }
          NODE
            curl -fLsS "$base/apps/ato-5min/" -o /tmp/ato5.html
            grep -F './game.js' /tmp/ato5.html >/dev/null
            curl -fLsS "$base/apps/ato-5min/game.js" -o /tmp/ato5.js
            test -s /tmp/ato5.js
            curl -fLsS "$base/apps/watashi-zukan/game.js" -o /tmp/watashi.js
            test -s /tmp/watashi.js
            curl -fLsS "$base/apps/task-separation/" -o /tmp/task-separation.html
            grep -F 'それ、' /tmp/task-separation.html >/dev/null
            echo "OK: $base all 22 curated routes + mobile-safe loaders"
          done
