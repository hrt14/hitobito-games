name: Deploy LEVEL UP to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'firebase-overrides/**'
      - 'deploy-targets.json'
      - 'firebase.json'
      - 'firestore.rules'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-host-targets.mjs'
      - 'scripts/build-firebase-levelup-home.mjs'
      - 'scripts/inject-levelup-home-link.mjs'
      - 'scripts/inject-levelup-account.mjs'
      - 'scripts/inject-levelup-refresh-button.mjs'
      - 'scripts/patch-levelup-popup-auth.mjs'
      - 'scripts/playtest-catalog.mjs'
      - 'scripts/prepare-firebase-mobile.mjs'
      - 'scripts/validate-firebase-bundle.mjs'
      - '.github/workflows/deploy-firebase-levelup.yml'
      - '.firebase-deploy-trigger'

concurrency:
  group: firebase-levelup-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare current LEVEL UP game sources for mobile
        run: node scripts/prepare-firebase-mobile.mjs

      - name: Build LEVEL UP bundle
        run: npm run build:firebase

      - name: Check mobile-safe bundle
        run: |
          set -euo pipefail
          test -s .dist/firebase/apps/ato-5min/game.js
          test -s .dist/firebase/apps/watashi-zukan/game.js
          grep -F 'signInWithPopup(provider)' .dist/firebase/levelup-account.js >/dev/null
          grep -F 'signInWithRedirect(provider)' .dist/firebase/levelup-account.js >/dev/null
          grep -F 'getRedirectResult()' .dist/firebase/levelup-account.js >/dev/null
          grep -F "config.authDomain = location.hostname" .dist/firebase/levelup-account.js >/dev/null
          grep -F "fetch('/__/firebase/init.json'" .dist/firebase/levelup-account.js >/dev/null
          grep -F "sessionStorage.setItem('levelup-auth-redirect-pending-v5'" .dist/firebase/levelup-account.js >/dev/null
          grep -F 'Googleログインが完了しました。' .dist/firebase/levelup-account.js >/dev/null
          grep -F "(code ? '（' + code + '）' : '')" .dist/firebase/levelup-account.js >/dev/null
          grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js' .dist/firebase/index.html >/dev/null
          grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js' .dist/firebase/index.html >/dev/null
          grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js' .dist/firebase/index.html >/dev/null
          grep -E 'src="/levelup-account\.js\?v=[a-f0-9]{12}"' .dist/firebase/index.html >/dev/null
          ! grep -R -F '/__/firebase/init.js' .dist/firebase --include='*.html'
          grep -F 'window.firebase.auth().onAuthStateChanged(renderAccount)' .dist/firebase/index.html >/dev/null
          ! grep -F 'DecompressionStream' .dist/firebase/apps/ato-5min/index.html
          ! grep -F 'game-a.bin' .dist/firebase/apps/ato-5min/index.html
          grep -F 'id="ato5min-inline-styles"' .dist/firebase/apps/ato-5min/index.html >/dev/null
          grep -F -- '--bg:#090b11' .dist/firebase/apps/ato-5min/index.html >/dev/null
          ! grep -F 'style-part1.css' .dist/firebase/apps/ato-5min/index.html
          ! grep -F 'style-part2.css' .dist/firebase/apps/ato-5min/index.html
          ! grep -F 'Promise.all(parts.map' .dist/firebase/apps/watashi-zukan/game.js
          grep -F 'これは自分の課題？ それとも相手の課題？' .dist/firebase/apps/task-separation/index.html >/dev/null
          grep -F 'data-answer="self"' .dist/firebase/apps/task-separation/index.html >/dev/null
          grep -F 'data-answer="other"' .dist/firebase/apps/task-separation/index.html >/dev/null
          ! grep -F 'data-answer="joint"' .dist/firebase/apps/task-separation/index.html
          ! grep -F 'data-answer="outside"' .dist/firebase/apps/task-separation/index.html
          grep -F '間違えた問題を振り返る' .dist/firebase/apps/task-separation/index.html >/dev/null
          node scripts/audit-firebase-mobile.mjs
          echo "Mobile loader, Firebase 12 same-origin redirect auth, desktop popup auth, explicit diagnostics, inline style, and task-separation checks OK"

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project hitobito-levelup --non-interactive

      - name: Deploy Firestore security rules when available
        continue-on-error: true
        run: npx --yes firebase-tools@latest deploy --only firestore:rules --project hitobito-levelup --non-interactive

      - name: Verify live LEVEL UP routes
        run: |
          set -euo pipefail
          sleep 5
          expected_games=$(node -e "const fs=require('fs');console.log(JSON.parse(fs.readFileSync('.dist/firebase/levelup-catalog.json','utf8')).games.length)")
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            echo "Checking $base"
            curl -fLsS "$base/" -o /tmp/levelup-home.html
            grep -F "${expected_games} games" /tmp/levelup-home.html >/dev/null
            grep -F 'window.firebase.auth().onAuthStateChanged(renderAccount)' /tmp/levelup-home.html >/dev/null
            grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js' /tmp/levelup-home.html >/dev/null
            grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js' /tmp/levelup-home.html >/dev/null
            grep -E 'src="/levelup-account\.js\?v=[a-f0-9]{12}"' /tmp/levelup-home.html >/dev/null
            ! grep -F '/__/firebase/init.js' /tmp/levelup-home.html

            curl -fLsS "$base/__/firebase/init.json" -o /tmp/firebase-init.json
            curl -fLsS "$base/__/auth/handler" -o /tmp/firebase-auth-handler.html
            test -s /tmp/firebase-auth-handler.html
            node - "$base" <<'NODE'
          const fs = require('fs');
          const base = process.argv[2];
          const config = JSON.parse(fs.readFileSync('/tmp/firebase-init.json', 'utf8'));
          if (config.projectId !== 'hitobito-levelup') throw new Error(`Unexpected Firebase project for ${base}: ${config.projectId}`);
          console.log(`Firebase config ${base}: projectId=${config.projectId}, hostedAuthDomain=${config.authDomain || '(none)'}`);
          NODE

            node - "$base" <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const base = process.argv[2];
          const catalog = JSON.parse(fs.readFileSync('.dist/firebase/levelup-catalog.json', 'utf8'));
          for (const game of catalog.games) {
            const url = new URL(game.href, base).href;
            console.log(`GET ${game.title}: ${url}`);
            execFileSync('curl', ['-fLsS', '--max-time', '30', '-o', '/dev/null', url], { stdio: 'inherit' });
          }
          NODE
            curl -fLsS "$base/apps/ato-5min/" -o /tmp/ato5.html
            grep -F './game.js' /tmp/ato5.html >/dev/null
            grep -F 'id="ato5min-inline-styles"' /tmp/ato5.html >/dev/null
            grep -F -- '--bg:#090b11' /tmp/ato5.html >/dev/null
            ! grep -F 'style-part1.css' /tmp/ato5.html
            curl -fLsS "$base/apps/ato-5min/game.js" -o /tmp/ato5.js
            test -s /tmp/ato5.js
            curl -fLsS "$base/apps/watashi-zukan/game.js" -o /tmp/watashi.js
            test -s /tmp/watashi.js
            curl -fLsS "$base/apps/task-separation/" -o /tmp/task-separation.html
            grep -F 'これは自分の課題？ それとも相手の課題？' /tmp/task-separation.html >/dev/null
            grep -F '間違えた問題を振り返る' /tmp/task-separation.html >/dev/null
            ! grep -F 'data-answer="joint"' /tmp/task-separation.html
            grep -F 'data-levelup-account' /tmp/task-separation.html >/dev/null
            grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js' /tmp/task-separation.html >/dev/null
            ! grep -F '/__/firebase/init.js' /tmp/task-separation.html
            curl -fLsS "$base/levelup-account.js" -o /tmp/levelup-account.js
            grep -F 'GoogleAuthProvider' /tmp/levelup-account.js >/dev/null
            grep -F 'signInWithPopup(provider)' /tmp/levelup-account.js >/dev/null
            grep -F 'signInWithRedirect(provider)' /tmp/levelup-account.js >/dev/null
            grep -F 'getRedirectResult()' /tmp/levelup-account.js >/dev/null
            grep -F "config.authDomain = location.hostname" /tmp/levelup-account.js >/dev/null
            grep -F "sessionStorage.setItem('levelup-auth-redirect-pending-v5'" /tmp/levelup-account.js >/dev/null
            grep -F "fetch('/__/firebase/init.json'" /tmp/levelup-account.js >/dev/null
            grep -F 'Googleログインが完了しました。' /tmp/levelup-account.js >/dev/null
            grep -F "(code ? '（' + code + '）' : '')" /tmp/levelup-account.js >/dev/null
            curl -fLsS "$base/apps/task-separation/game.js" -o /tmp/task-separation.js
            grep -F "const QUESTIONS" /tmp/task-separation.js >/dev/null
            curl -fLsS "$base/apps/meaning-map/" -o /tmp/meaning-map.html
            grep -F '意味マップ | LEVEL UP' /tmp/meaning-map.html >/dev/null
            curl -fLsS "$base/apps/meaning-map/game.js" -o /tmp/meaning-map.js
            grep -F "const LENSES" /tmp/meaning-map.js >/dev/null
            echo "OK: $base all ${expected_games} routes + Firebase 12 mobile same-origin redirect auth + desktop popup auth + explicit diagnostics + meaning map + inline ato-5min CSS + mobile-safe loaders + two-choice task separation"
          done