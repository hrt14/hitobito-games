name: Deploy LEVEL UP to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .firebase-deploy-trigger

concurrency:
  group: firebase-levelup-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build LEVEL UP bundle
        run: npm run build:firebase

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HITOBITO_LEVELUP }}
          channelId: live
          projectId: hitobito-levelup
