name: Deploy LEVEL UP to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .firebase-deploy-trigger

concurrency:
  group: firebase-levelup-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare current LEVEL UP game sources for mobile
        run: node scripts/prepare-firebase-mobile.mjs

      - name: Build LEVEL UP bundle
        run: npm run build:firebase

      - name: Check mobile-safe bundle
        run: |
          set -euo pipefail
          test -s .dist/firebase/apps/ato-5min/game.js
          test -s .dist/firebase/apps/watashi-zukan/game.js
          grep -F 'signInWithPopup(provider)' .dist/firebase/levelup-account.js >/dev/null
          grep -F 'signInWithRedirect(provider)' .dist/firebase/levelup-account.js >/dev/null
          grep -F 'getRedirectResult()' .dist/firebase/levelup-account.js >/dev/null
          grep -F "config.authDomain = location.hostname" .dist/firebase/levelup-account.js >/dev/null
          grep -F "fetch('/__/firebase/init.json'" .dist/firebase/levelup-account.js >/dev/null
          grep -F "sessionStorage.setItem('levelup-auth-redirect-pending-v5'" .dist/firebase/levelup-account.js >/dev/null
          grep -F 'Googleログインが完了しました。' .dist/firebase/levelup-account.js >/dev/null
          grep -F "(code ? '（' + code + '）' : '')" .dist/firebase/levelup-account.js >/dev/null
          grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js' .dist/firebase/index.html >/dev/null
          grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js' .dist/firebase/index.html >/dev/null
          grep -F 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js' .dist/firebase/index.html >/dev/null
          grep -E 'src="/levelup-account\.js\?v=[a-f0-9]{12}"' .dist/firebase/index.html >/dev/null
          ! grep -R -F '/__/firebase/init.js' .dist/firebase --include='*.html'
          grep -F 'window.firebase.auth().onAuthStateChanged(renderAccount)' .dist/firebase/index.html >/dev/null
          ! grep -F 'DecompressionStream' .dist/firebase/apps/ato-5min/index.html
          ! grep -F 'game-a.bin' .dist/firebase/apps/ato-5min/index.html
          grep -F 'id="ato5min-inline-styles"' .dist/firebase/apps/ato-5min/index.html >/dev/null
          grep -F -- '--bg:#090b11' .dist/firebase/apps/ato-5min/index.html >/dev/null
          ! grep -F 'style-part1.css' .dist/firebase/apps/ato-5min/index.html
          ! grep -F 'style-part2.css' .dist/firebase/apps/ato-5min/index.html
          ! grep -F 'Promise.all(parts.map' .dist/firebase/apps/watashi-zukan/game.js
          grep -F 'これは自分の課題？ それとも相手の課題？' .dist/firebase/apps/task-separation/index.html >/dev/null
          grep -F 'data-answer="self"' .dist/firebase/apps/task-separation/index.html >/dev/null
          grep -F 'data-answer="other"' .dist/firebase/apps/task-separation/index.html >/dev/null
          ! grep -F 'data-answer="joint"' .dist/firebase/apps/task-separation/index.html
          ! grep -F 'data-answer="outside"' .dist/firebase/apps/task-separation/index.html
          grep -F '間違えた問題を振り返る' .dist/firebase/apps/task-separation/index.html >/dev/null
          node scripts/audit-firebase-mobile.mjs
          echo "Mobile loader, Firebase 12 same-origin redirect auth, desktop popup auth, explicit diagnostics, inline style, and task-separation checks OK"

      - name: Deploy to Firebase Hosting and how-seen API
        run: npx --yes firebase-tools@latest deploy --only hosting,functions:howSeenApi --project hitobito-levelup --non-interactive

      - name: Notify search engines and feed hubs
        run: node scripts/notify-levelup-discovery.mjs
