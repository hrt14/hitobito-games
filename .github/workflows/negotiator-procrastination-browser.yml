name: NEGOTIATOR procrastination browser playtest

on:
  pull_request:
    paths:
      - 'apps/negotiator-procrastination/**'
      - 'scripts/register-negotiator-procrastination-meta.mjs'
      - 'scripts/register-10x-thinking-meta.mjs'
      - '.github/workflows/negotiator-procrastination-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/negotiator-procrastination/**'
      - 'scripts/register-negotiator-procrastination-meta.mjs'
      - 'scripts/register-10x-thinking-meta.mjs'
      - '.github/workflows/negotiator-procrastination-browser.yml'
  workflow_dispatch:

jobs:
  mobile-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check apps/negotiator-procrastination/app.js
          node --check apps/negotiator-procrastination/smoke-browser.mjs
          node --check scripts/register-negotiator-procrastination-meta.mjs
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/negotiator-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/apps/negotiator-procrastination/?test=1' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/negotiator-server.log
          exit 1
      - name: Run real mobile playtest
        env:
          NEGOTIATOR_URL: http://127.0.0.1:4173/apps/negotiator-procrastination/?test=1
        run: node apps/negotiator-procrastination/smoke-browser.mjs
      - name: Run LEVEL UP quality gate
        run: node scripts/validate-levelup-quality-gate.mjs --app apps/negotiator-procrastination
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negotiator-procrastination-browser-playtest
          path: apps/negotiator-procrastination/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Server log on failure
        if: failure()
        run: cat /tmp/negotiator-server.log || true
