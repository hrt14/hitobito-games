name: 寝る前3分 全部うまくいくイメトレ browser playtest

on:
  pull_request:
    paths:
      - 'apps/bedtime-best-case/**'
      - 'scripts/inject-bedtime-best-case-card.mjs'
      - 'scripts/inject-mienai-zandaka-card-copy.mjs'
      - '.github/workflows/bedtime-best-case-browser.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/bedtime-best-case/**'
      - 'scripts/inject-bedtime-best-case-card.mjs'
      - 'scripts/inject-mienai-zandaka-card-copy.mjs'
      - '.github/workflows/bedtime-best-case-browser.yml'
  workflow_dispatch:

jobs:
  mobile-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check apps/bedtime-best-case/app.js
          node --check scripts/inject-bedtime-best-case-card.mjs
      - name: Build Firebase bundle
        run: npm run build:firebase
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/bedtime-best-case-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:4173/apps/bedtime-best-case/' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bedtime-best-case-server.log
          exit 1
      - name: Run real mobile playtest
        env:
          BEDTIME_BEST_CASE_URL: http://127.0.0.1:4173/apps/bedtime-best-case/
        run: node apps/bedtime-best-case/smoke-browser.mjs
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedtime-best-case-browser-playtest
          path: apps/bedtime-best-case/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
      - name: Server log on failure
        if: failure()
        run: cat /tmp/bedtime-best-case-server.log || true
