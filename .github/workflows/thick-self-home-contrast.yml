name: thick-self home contrast

on:
  push:
    branches: [main, fix/thick-self-home-contrast-v2, fix/thick-self-theme-contrast-test]
    paths:
      - 'apps/thick-self/**'
      - '.github/workflows/thick-self-home-contrast.yml'
  pull_request:
    paths:
      - 'apps/thick-self/**'
      - '.github/workflows/thick-self-home-contrast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-contrast:
    timeout-minutes: 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24.16.0
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/thick-home-server.log 2>&1 &
          sleep 2
      - name: Verify both home themes remain readable
        run: |
          cat > .thick-home-test.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';
          const browser=await puppeteer.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const page=await browser.newPage();
          await page.setViewport({width:390,height:844,isMobile:true,hasTouch:true});
          await page.emulateMediaFeatures([{name:'prefers-color-scheme',value:'dark'}]);
          await page.goto('http://127.0.0.1:4173/apps/thick-self/',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('#startBtn');
          const read=()=>page.evaluate(()=>({
            theme:document.documentElement.dataset.thickTheme,
            bodyBg:getComputedStyle(document.body).backgroundColor,
            appBg:getComputedStyle(document.getElementById('app')).backgroundColor,
            heroBg:getComputedStyle(document.querySelector('.hero')).backgroundColor,
            title:getComputedStyle(document.querySelector('.hero h1')).color,
            lead:getComputedStyle(document.querySelector('.hero .lead')).color,
            micro:getComputedStyle(document.querySelector('.hero .micro')).color,
            ctaBg:getComputedStyle(document.getElementById('startBtn')).backgroundColor,
            ctaText:getComputedStyle(document.getElementById('startBtn')).color,
            titleSize:parseFloat(getComputedStyle(document.querySelector('.hero h1')).fontSize),
            leadSize:parseFloat(getComputedStyle(document.querySelector('.hero .lead')).fontSize)
          }));
          const dark=await read();
          if(dark.theme!=='dark'||dark.bodyBg!=='rgb(7, 17, 29)'||dark.appBg!=='rgb(7, 17, 29)'||dark.heroBg!=='rgb(7, 17, 29)')throw new Error(`dark canvas regression: ${JSON.stringify(dark)}`);
          if(dark.title!=='rgb(247, 249, 252)'||dark.lead!=='rgb(190, 200, 212)'||dark.micro!=='rgb(190, 200, 212)')throw new Error(`dark text contrast regression: ${JSON.stringify(dark)}`);
          if(dark.ctaBg!=='rgb(185, 239, 60)'||dark.ctaText!=='rgb(7, 17, 29)')throw new Error(`dark CTA contrast regression: ${JSON.stringify(dark)}`);
          await page.click('#themeBtn');
          const light=await read();
          if(light.theme!=='light'||light.bodyBg!=='rgb(246, 243, 237)'||light.appBg!=='rgb(246, 243, 237)'||light.heroBg!=='rgb(246, 243, 237)')throw new Error(`light canvas regression: ${JSON.stringify(light)}`);
          if(light.title!=='rgb(13, 26, 43)'||light.lead!=='rgb(89, 97, 107)'||light.micro!=='rgb(89, 97, 107)')throw new Error(`light text contrast regression: ${JSON.stringify(light)}`);
          if(light.titleSize<46||light.leadSize<18)throw new Error(`home typography too small: ${JSON.stringify(light)}`);
          if(await page.evaluate(()=>document.documentElement.scrollWidth>document.documentElement.clientWidth+1))throw new Error('mobile horizontal overflow');
          console.log('THICK-SELF HOME THEME PASS',JSON.stringify({dark,light}));
          await browser.close();
          NODE
          node .thick-home-test.mjs
