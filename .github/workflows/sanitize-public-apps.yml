name: Sanitize public app content

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'index.html'
      - 'scripts/playtest-catalog.mjs'
      - 'scripts/build-host-targets.mjs'
      - 'scripts/human-test-organized.mjs'
      - 'scripts/human-test.mjs'
      - 'scripts/sanitize-public-apps.mjs'
      - '.github/workflows/sanitize-public-apps.yml'

concurrency:
  group: sanitize-public-apps
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sanitize public source surfaces
        run: node scripts/sanitize-public-apps.mjs --fix

      - name: Commit redactions if needed
        run: |
          TARGETS=(apps index.html scripts/playtest-catalog.mjs scripts/build-host-targets.mjs scripts/human-test-organized.mjs scripts/human-test.mjs)
          if ! git diff --quiet -- "${TARGETS[@]}"; then
            git add -- "${TARGETS[@]}"
            git commit -m "Remove confidential examples from public surfaces"
            git push origin HEAD:main
          else
            echo "No public source changes needed"
          fi

      - name: Build games and play bundle
        run: npm run build:hosting

      - name: Audit generated games/play bundle
        run: node scripts/sanitize-public-apps.mjs
