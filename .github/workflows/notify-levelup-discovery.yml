name: Notify LEVEL UP organic discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build LEVEL UP discovery assets
        run: |
          npm install
          node scripts/prepare-firebase-mobile.mjs
          npm run build:firebase

      - name: Notify IndexNow and WebSub
        run: node scripts/notify-levelup-discovery.mjs
