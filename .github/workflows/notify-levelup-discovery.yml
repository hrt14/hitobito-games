name: Notify LEVEL UP organic discovery

on:
  workflow_run:
    workflows:
      - Deploy LEVEL UP production closed loop
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: levelup-organic-discovery
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve deployed commit
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify that commit is actually live
        id: live
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="${{ steps.target.outputs.sha }}"
          LIVE_JSON="$(curl -fsS --retry 4 --retry-delay 3 https://levelup.hitobito.jp/deploy-meta.json || true)"
          LIVE_SHA="$(printf '%s' "$LIVE_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{try{console.log(JSON.parse(s).sha||'')}catch{console.log('')}})")"
          if [ -z "$LIVE_SHA" ] || [ "$LIVE_SHA" != "$TARGET_SHA" ]; then
            echo "notify=false" >> "$GITHUB_OUTPUT"
            echo "Production is not on target SHA; skipping discovery notification. target=$TARGET_SHA live=$LIVE_SHA"
            exit 0
          fi
          echo "notify=true" >> "$GITHUB_OUTPUT"

      - name: Checkout deployed commit
        if: steps.live.outputs.notify == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup Node
        if: steps.live.outputs.notify == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Notify IndexNow and WebSub
        if: steps.live.outputs.notify == 'true'
        run: node scripts/notify-levelup-discovery.mjs
