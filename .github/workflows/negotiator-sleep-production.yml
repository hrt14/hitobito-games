name: Verify NEGOTIATOR sleep production

on:
  push:
    branches:
      - main
    paths:
      - '.firebase-deploy-trigger'
      - 'apps/negotiator-sleep/**'
      - '.github/workflows/negotiator-sleep-production.yml'
  workflow_dispatch:

jobs:
  production-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for NEGOTIATOR sleep on both production domains
        run: |
          set -euo pipefail
          for base in https://hitobito-levelup.web.app https://levelup.hitobito.jp; do
            ok=0
            for attempt in $(seq 1 36); do
              out="/tmp/negotiator-sleep-${attempt}.html"
              if curl -fLsS --max-time 30 "$base/apps/negotiator-sleep/?verify=${GITHUB_SHA}-${attempt}" -o "$out" \
                && grep -F 'NEGOTIATOR｜寝かせる' "$out" >/dev/null \
                && grep -F '寝る気ゼロの' "$out" >/dev/null; then
                ok=1
                echo "NEGOTIATOR sleep live on $base"
                break
              fi
              sleep 5
            done
            test "$ok" = "1"
          done
      - name: Run production mobile playtest on custom domain
        env:
          NEGOTIATOR_SLEEP_URL: https://levelup.hitobito.jp/apps/negotiator-sleep/?production-smoke=${{ github.sha }}
        run: node apps/negotiator-sleep/smoke-browser.mjs
      - name: Run production mobile playtest on Firebase domain
        env:
          NEGOTIATOR_SLEEP_URL: https://hitobito-levelup.web.app/apps/negotiator-sleep/?production-smoke=${{ github.sha }}
        run: node apps/negotiator-sleep/smoke-browser.mjs
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negotiator-sleep-production-playtest
          path: apps/negotiator-sleep/.artifacts/*
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
