name: Merge validated LEVEL UP agent PR

on:
  workflow_run:
    workflows:
      - Validate LEVEL UP agent PR
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: levelup-agent-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only the exact validated Copilot LEVEL UP PR
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          pr=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$pr" ]; then
            echo 'No pull request is associated with this validation run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json author,body,state,isDraft,headRefOid,baseRefName > /tmp/pr.json
          author=$(jq -r '.author.login // empty' /tmp/pr.json)
          body=$(jq -r '.body // ""' /tmp/pr.json)
          state=$(jq -r '.state' /tmp/pr.json)
          draft=$(jq -r '.isDraft' /tmp/pr.json)
          head_sha=$(jq -r '.headRefOid' /tmp/pr.json)
          base=$(jq -r '.baseRefName' /tmp/pr.json)

          if [ "$author" != 'copilot-swe-agent[bot]' ]; then
            echo "PR #$pr is not authored by Copilot; no automatic merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$body" != *'<!-- levelup-agent-request:'* ]]; then
            echo "PR #$pr is not a LEVEL UP delegated request; no automatic merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$state" != 'OPEN' ] || [ "$draft" = 'true' ] || [ "$base" != 'main' ]; then
            echo "PR #$pr is not an open, ready, main-targeting PR; no automatic merge." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$head_sha" != "$VALIDATED_SHA" ]; then
            echo "::error::PR #$pr moved after validation. Expected $VALIDATED_SHA but current head is $head_sha."
            exit 1
          fi

          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash
          echo "Validated LEVEL UP Copilot PR #$pr merged. Production deployment will now be dispatched by the existing main-push workflow." >> "$GITHUB_STEP_SUMMARY"
