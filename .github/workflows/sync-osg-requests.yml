name: Sync OneShotGames requests

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - 'functions/sync-osg-requests-to-github.mjs'
      - '.github/workflows/sync-osg-requests.yml'

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: osg-request-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix functions
      - name: Sync queued OneShotGames quests to GitHub Issues
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
        run: node functions/sync-osg-requests-to-github.mjs

# Keep this workflow on main so queued creator requests can be retried immediately via a safe workflow-file push.
