name: Sync OneShotGames requests

on:
  workflow_dispatch:
  schedule:
    # Independent staggered poller. Both this workflow and the LEVEL UP poller
    # process both queues because GitHub schedule events can be delayed or dropped.
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches:
      - main
    paths:
      - 'functions/sync-osg-requests-to-github.mjs'
      - 'functions/sync-feedback-to-github.mjs'
      - 'functions/sync-levelup-creation-requests-to-github.mjs'
      - 'functions/run-private-feedback-sync.mjs'
      - '.github/workflows/sync-osg-requests.yml'
      - '.github/workflows/sync-levelup-feedback.yml'

permissions:
  contents: read
  id-token: write

# Shared with sync-levelup-feedback.yml so redundant pollers do not race.
concurrency:
  group: private-request-queue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private request queue
        id: queue
        env:
          QUEUE_REPO: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${QUEUE_REPO:-}" ] || [ -z "${GH_TOKEN:-}" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Private request queue configuration is missing; queued requests cannot be processed.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::PRIVATE_REQUEST_REPOSITORY and PRIVATE_REQUEST_TOKEN are required for private request sync.'
            exit 1
          fi
          visibility=$(gh api "repos/$QUEUE_REPO" --jq '.private')
          if [ "$visibility" != 'true' ]; then
            echo "Refusing to sync user text: $QUEUE_REPO is not private." >&2
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo "Private request queue verified: $QUEUE_REPO" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.queue.outputs.configured == 'true'

      - name: Authenticate to Google Cloud
        if: steps.queue.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          project_id: hitobito-levelup
          workload_identity_provider: projects/995292381518/locations/global/workloadIdentityPools/hitobito-github/providers/hitobito-games
          service_account: github-firebase-deployer@hitobito-levelup.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Install function dependencies
        if: steps.queue.outputs.configured == 'true'
        run: npm install --prefix functions

      - name: Sync queued OneShotGames quests to private GitHub Issues
        if: steps.queue.outputs.configured == 'true'
        env:
          REQUEST_QUEUE_REPOSITORY: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
        run: node functions/sync-osg-requests-to-github.mjs

      - name: Redundant LEVEL UP private queue sync
        if: steps.queue.outputs.configured == 'true'
        env:
          REQUEST_QUEUE_REPOSITORY: ${{ vars.PRIVATE_REQUEST_REPOSITORY }}
          GH_TOKEN: ${{ secrets.PRIVATE_REQUEST_TOKEN }}
          GOOGLE_CLOUD_PROJECT: hitobito-levelup
        run: |
          set -o pipefail
          node functions/run-private-feedback-sync.mjs 2>&1 \
            | sed -E \
              -e 's/(Recovered session feedback [^:]+):.*/\1: [message redacted]/' \
              -e 's/(\[dry-run\] [^:]+):.*/\1: [message redacted]/'

      - name: Record privacy-safe result
        if: always()
        run: |
          echo 'OneShotGames and LEVEL UP private request sync finished. Raw user text is allowed only in the dedicated private request repository.' >> "$GITHUB_STEP_SUMMARY"

# Privacy rule: raw creator prompts and LEVEL UP free text must never be written to the public code repository.
# Missing private-queue configuration is a hard failure so queued requests cannot silently stall.
