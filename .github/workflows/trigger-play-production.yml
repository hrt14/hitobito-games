name: Trigger PLAY production deploy

on:
  push:
    branches: [main]
    paths:
      - '.deploy-trigger'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Cloudflare Pages production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare-pages.yml --repo hrt14/hitobito-games --ref main
